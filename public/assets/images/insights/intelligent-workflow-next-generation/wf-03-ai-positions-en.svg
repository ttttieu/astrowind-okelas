<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Four places AI can take part in a workflow, in order of increasing risk: preparing context, suggesting actions, handling repetitive cases, proactively initiating action." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="780" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four places AI can take part in a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ordered by increasing risk. Each position is a design decision, not a product to buy.</text><line x1="60.0" y1="718.0" x2="1140.0" y2="718.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="740.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The categories and framework shown are OKELAS's way of framing the topic: a discussion aid, not a certified methodology.</text><rect x="60.0" y="274.0" width="255.0" height="296.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="310.0" r="18" fill="var(--p)"/><text x="96.0" y="316.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="360.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Prepare context</text><text x="80.0" y="387.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Summarize information for a</text><text x="80.0" y="408.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">step, such as a supplier’s</text><text x="80.0" y="429.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">history before an approver</text><text x="80.0" y="450.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">reviews. AI decides nothing.</text><rect x="76.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="187.5" y="536.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Low risk</text><rect x="335.0" y="252.0" width="255.0" height="318.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="371.0" cy="288.0" r="18" fill="var(--p)"/><text x="371.0" y="294.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="338.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Suggest an action</text><text x="355.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Propose based on data and</text><text x="355.0" y="386.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">precedent, such as a</text><text x="355.0" y="407.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">discount level drawn from</text><text x="355.0" y="428.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">similar past cases. A person</text><text x="355.0" y="449.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">still makes the final call.</text><rect x="351.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="462.5" y="536.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Medium risk, needs evidence</text><rect x="610.0" y="230.0" width="255.0" height="340.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="646.0" cy="266.0" r="18" fill="var(--p)"/><text x="646.0" y="272.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="316.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Handle repetitive cases</text><text x="630.0" y="343.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Well-defined, low-risk</text><text x="630.0" y="364.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cases, such as classifying</text><text x="630.0" y="385.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">and routing a simple</text><text x="630.0" y="406.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">support request.</text><text x="630.0" y="427.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Traditional automation and</text><text x="630.0" y="448.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI overlap here.</text><rect x="626.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="737.5" y="536.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Low-risk cases, clear rules</text><rect x="885.0" y="208.0" width="255.0" height="362.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="921.0" cy="244.0" r="18" fill="var(--a)"/><text x="921.0" y="250.6" font-size="18" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text><text x="905.0" y="294.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Proactively</text><text x="905.0" y="317.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">initiate action</text><text x="905.0" y="344.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">On detecting an event, such</text><text x="905.0" y="365.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">as an AI agent opening a</text><text x="905.0" y="386.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quality-check request on an</text><text x="905.0" y="407.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">abnormal reading. The</text><text x="905.0" y="428.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">highest level of autonomy.</text><rect x="901.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1012.5" y="528.2" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Highest autonomy,</text><text x="1012.5" y="545.3" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">tight governance</text><line x1="60.0" y1="594.0" x2="1127.0" y2="594.0" stroke="var(--mut)" stroke-width="2.5"/><polygon points="1138.0,594.0 1127.0,600.0 1127.0,588.0" fill="var(--mut)"/><text x="600.0" y="618.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Autonomy and control requirements increase</text><rect x="60.0" y="642.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="675.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The real question: which position are we at, and does the next step fit our current standardization?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Event-driven workflow hỏi sự kiện gì vừa xảy ra thay vì ai làm bước tiếp theo, và chỉ phát huy khi tổ chức đã định nghĩa nhất quán sự kiện và đã sẵn sàng về quy trình, dữ liệu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="780" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Event-driven workflow bắt đầu từ sự kiện, không từ cú bấm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cùng một workflow, hai câu hỏi khác nhau về điều gì khiến nó chạy.</text><line x1="60.0" y1="718.0" x2="1140.0" y2="718.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="740.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="430.0" height="226.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="84.0" y="169.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Workflow truyền thống hỏi</text><text x="84.0" y="211.3" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Ai cần làm bước tiếp theo?</text><text x="84.0" y="248.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Kích hoạt bởi: một người bấm gửi yêu cầu.</text><text x="84.0" y="276.6" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ: A duyệt xong mới tới B.</text><rect x="520.0" y="134.0" width="620.0" height="226.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="544.0" y="169.8" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Event-driven workflow hỏi</text><text x="544.0" y="209.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Sự kiện gì vừa xảy ra, nó có ý nghĩa gì trong bối</text><text x="544.0" y="239.5" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">cảnh tổ chức, và ai hoặc hệ thống nào cần</text><text x="544.0" y="269.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">phản ứng?</text><text x="544.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Kích hoạt bởi: sự kiện trong hệ thống hoặc trong thực tế vận hành.</text><text x="544.0" y="332.5" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ: tồn kho dưới ngưỡng, lô hàng lệch thông số, hợp đồng sắp hết hạn.</text><line x1="830.0" y1="364.0" x2="830.0" y2="386.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="830.0,396.0 824.5,386.0 835.5,386.0" fill="var(--p)"/><rect x="60.0" y="400.0" width="1080.0" height="138.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="435.0" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Cổng trước khi bật event-driven</text><rect x="84.0" y="454.0" width="504.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="98.0" y="484.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Định nghĩa nhất quán: thế nào là một sự kiện cần xử lý, ngưỡng</text><text x="98.0" y="504.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">nào là bất thường.</text><rect x="612.0" y="454.0" width="504.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="626.0" y="494.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Process readiness và data readiness đã ở mức đủ tốt.</text><rect x="60.0" y="554.0" width="530.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="80.0" y="578.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Chưa đạt</text><text x="80.0" y="603.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Công nghệ chỉ tạo nhiễu: quá nhiều cảnh báo, không ai biết cái nào</text><text x="80.0" y="624.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quan trọng.</text><rect x="610.0" y="554.0" width="530.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="630.0" y="578.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Đạt</text><text x="630.0" y="603.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow phản ứng đúng sự kiện, kèm ngữ cảnh tổ chức.</text><rect x="60.0" y="654.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="687.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Event-driven là điểm đến sau khi đã sẵn sàng về quy trình và dữ liệu, không phải điểm bắt đầu.</text></svg>
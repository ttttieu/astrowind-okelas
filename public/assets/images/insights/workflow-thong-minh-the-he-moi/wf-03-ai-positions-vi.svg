<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Bốn vị trí AI có thể tham gia workflow, sắp theo rủi ro tăng dần: chuẩn bị context, gợi ý hành động, tự xử lý ca lặp lại, chủ động khởi tạo hành động." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="780" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn vị trí AI có thể tham gia trong một workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sắp theo mức độ rủi ro tăng dần. Mỗi vị trí là một quyết định thiết kế, không phải một sản phẩm cần mua.</text><line x1="60.0" y1="718.0" x2="1140.0" y2="718.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="740.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân loại và khung trong hình là cách trình bày của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="274.0" width="255.0" height="296.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="310.0" r="18" fill="var(--p)"/><text x="96.0" y="316.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="360.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn bị context</text><text x="80.0" y="387.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tóm tắt thông tin cho một</text><text x="80.0" y="408.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bước, ví dụ lịch sử nhà</text><text x="80.0" y="429.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cung cấp trước khi người</text><text x="80.0" y="450.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">duyệt xem xét. AI không</text><text x="80.0" y="471.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định.</text><rect x="76.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="187.5" y="536.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Rủi ro thấp</text><rect x="335.0" y="252.0" width="255.0" height="318.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="371.0" cy="288.0" r="18" fill="var(--p)"/><text x="371.0" y="294.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="338.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Gợi ý hành động</text><text x="355.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đề xuất dựa trên dữ liệu và</text><text x="355.0" y="386.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tiền lệ, ví dụ mức chiết khấu</text><text x="355.0" y="407.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">từ các trường hợp tương tự</text><text x="355.0" y="428.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trước đó. Con người vẫn</text><text x="355.0" y="449.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định cuối cùng.</text><rect x="351.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="462.5" y="536.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Rủi ro trung bình, cần evidence</text><rect x="610.0" y="230.0" width="255.0" height="340.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="646.0" cy="266.0" r="18" fill="var(--p)"/><text x="646.0" y="272.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="316.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tự xử lý ca lặp lại</text><text x="630.0" y="343.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ca có quy tắc rõ, rủi ro thấp,</text><text x="630.0" y="364.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ví dụ phân loại và định tuyến</text><text x="630.0" y="385.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">một yêu cầu hỗ trợ đơn giản.</text><text x="630.0" y="406.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Automation truyền thống và</text><text x="630.0" y="427.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI giao thoa ở đây.</text><rect x="626.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="737.5" y="536.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Ca rủi ro thấp, quy tắc rõ</text><rect x="885.0" y="208.0" width="255.0" height="362.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="921.0" cy="244.0" r="18" fill="var(--a)"/><text x="921.0" y="250.6" font-size="18" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text><text x="905.0" y="294.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chủ động khởi tạo</text><text x="905.0" y="317.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">hành động</text><text x="905.0" y="344.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Khi phát hiện sự kiện, ví dụ</text><text x="905.0" y="365.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI agent tự tạo phiếu kiểm</text><text x="905.0" y="386.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tra chất lượng khi chỉ số</text><text x="905.0" y="407.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bất thường. Mức tự động</text><text x="905.0" y="428.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cao nhất.</text><rect x="901.0" y="510.0" width="223.0" height="44.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1012.5" y="528.2" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Tự chủ cao nhất, cần</text><text x="1012.5" y="545.3" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">governance chặt</text><line x1="60.0" y1="594.0" x2="1127.0" y2="594.0" stroke="var(--mut)" stroke-width="2.5"/><polygon points="1138.0,594.0 1127.0,600.0 1127.0,588.0" fill="var(--mut)"/><text x="600.0" y="618.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Mức tự chủ và yêu cầu kiểm soát tăng dần</text><rect x="60.0" y="642.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="675.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi đúng: doanh nghiệp đang ở vị trí nào, và bước tiếp theo có phù hợp với mức chuẩn hóa hiện có không?</text></svg>
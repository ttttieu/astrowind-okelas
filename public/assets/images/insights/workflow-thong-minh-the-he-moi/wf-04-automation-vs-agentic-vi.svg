<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 692" width="1200" height="692" role="img" aria-label="Automation theo quy tắc cố định khác agentic workflow ở chỗ agent lập kế hoạch và dùng công cụ, nên cần ngữ cảnh tổ chức, evidence truy vết được và điểm dừng con người." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="692" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ automation theo quy tắc đến agentic workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khác biệt không chỉ ở công nghệ, mà ở mức tin cậy tổ chức phải đặt vào hệ thống.</text><line x1="60.0" y1="630.0" x2="1140.0" y2="630.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="652.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="500.0" height="226.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="84.0" y="173.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Workflow automation truyền thống</text><circle cx="90.0" cy="207.0" r="4.5" fill="var(--gm)"/><text x="106.0" y="212.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Chạy theo quy tắc cố định: nếu điều kiện A đúng, làm</text><text x="106.0" y="234.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">hành động B</text><circle cx="90.0" cy="267.2" r="4.5" fill="var(--gm)"/><text x="106.0" y="273.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Nhanh và dễ kiểm soát</text><circle cx="90.0" cy="305.2" r="4.5" fill="var(--gm)"/><text x="106.0" y="311.1" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Cứng: không xử lý được ngoại lệ ngoài quy tắc đã</text><text x="106.0" y="333.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">lập trình</text><rect x="640.0" y="130.0" width="500.0" height="226.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="664.0" y="173.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Agentic workflow</text><circle cx="670.0" cy="207.0" r="4.5" fill="var(--p)"/><text x="686.0" y="212.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">AI agent quan sát trạng thái và lập kế hoạch</text><text x="686.0" y="234.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều bước</text><circle cx="670.0" cy="267.2" r="4.5" fill="var(--p)"/><text x="686.0" y="273.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Dùng công cụ: tra cứu dữ liệu, gọi hệ thống khác</text><circle cx="670.0" cy="305.2" r="4.5" fill="var(--p)"/><text x="686.0" y="311.1" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Điều chỉnh theo kết quả trung gian, trong giới hạn</text><text x="686.0" y="333.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">quyền hạn và guardrail</text><line x1="566.0" y1="243.0" x2="622.0" y2="243.0" stroke="var(--a)" stroke-width="3"/><polygon points="634.0,243.0 622.0,249.6 622.0,236.4" fill="var(--a)"/><text x="600.0" y="204.9" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Cần tin cậy</text><text x="600.0" y="219.9" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">cao hơn</text><text x="60.0" y="397.9" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Agentic workflow sai một bước có thể kéo theo chuỗi hành động sai, nên cần ba điều kiện:</text><rect x="60.0" y="417.5" width="346.0" height="130.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><circle cx="96.0" cy="451.5" r="16" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><text x="96.0" y="457.3" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">1</text><text x="124.0" y="454.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ngữ cảnh tổ chức</text><text x="82.0" y="502.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Agent biết mình đang hoạt động trong quy</text><text x="82.0" y="522.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trình nào, với quyền hạn nào.</text><rect x="427.0" y="417.5" width="346.0" height="130.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><circle cx="463.0" cy="451.5" r="16" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><text x="463.0" y="457.3" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">2</text><text x="491.0" y="454.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence kiểm chứng được</text><text x="449.0" y="502.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mọi hành động truy vết lại được: ai hoặc cái</text><text x="449.0" y="522.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">gì quyết định, dựa trên dữ liệu nào.</text><rect x="794.0" y="417.5" width="346.0" height="130.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><circle cx="830.0" cy="451.5" r="16" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><text x="830.0" y="457.3" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">3</text><text x="858.0" y="454.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm dừng con người</text><text x="816.0" y="502.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ở quyết định có rủi ro tài chính, pháp lý</text><text x="816.0" y="522.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc chất lượng đáng kể.</text><rect x="60.0" y="565.5" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="599.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giá trị đến từ việc thiết kế lại workflow để AI có chỗ đứng hợp lý, không từ việc thêm AI.</text></svg>
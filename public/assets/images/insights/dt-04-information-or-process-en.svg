<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Decision tree: is the problem missing information or an inconsistent process"><style>
  :root{--p:1 97 239;--s:1 84 207;--a:109 40 217;--bg:255 255 255;--tx:0 0 0;--mut:16 16 16;--line:16 16 16}
  @media (prefers-color-scheme: dark){:root{--bg:8 9 10;--tx:247 248 248;--mut:229 236 246;--line:229 236 246}}
  text{font-family:Inter,Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
  .bg{fill:rgb(var(--bg))}
  .title{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .big{font-size:50px;font-weight:700;fill:rgb(var(--tx))}
  .subtitle{font-size:17px;fill:rgb(var(--mut)/.66)}
  .term{font-size:17px;font-weight:700;fill:rgb(var(--tx))}
  .h2{font-size:19px;font-weight:700;fill:rgb(var(--tx))}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:rgb(var(--mut)/.66)}
  .desc{font-size:13.5px;fill:rgb(var(--mut)/.85)}
  .body{font-size:14.5px;fill:rgb(var(--mut)/.88)}
  .mut{font-size:13px;fill:rgb(var(--mut)/.66)}
  .val{font-size:15px;font-weight:600;fill:rgb(var(--tx))}
  .foot{font-size:13px;fill:rgb(var(--mut)/.5)}
  .chip{font-size:12px;font-weight:700;letter-spacing:.06em}
  .g1 .box{fill:rgb(var(--p)/.08);stroke:rgb(var(--p))}
  .g2 .box{fill:rgb(var(--s)/.12);stroke:rgb(var(--s))}
  .g3 .box{fill:rgb(var(--a)/.09);stroke:rgb(var(--a))}
  .g1 .bar{fill:rgb(var(--p))}.g2 .bar{fill:rgb(var(--s))}.g3 .bar{fill:rgb(var(--a))}
  .g1 .acc{fill:rgb(var(--p))}.g2 .acc{fill:rgb(var(--s))}.g3 .acc{fill:rgb(var(--a))}
  .box{stroke-width:1.5}
  .card{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .soft{fill:rgb(var(--line)/.05)}
  .ghost{fill:rgb(var(--line)/.22)}
  .rule{stroke:rgb(var(--line)/.45);stroke-width:2;fill:none}
  .ring{stroke:rgb(var(--line)/.18);stroke-width:1;fill:none}
  .axis{stroke:rgb(var(--line)/.18);stroke-width:1}
  .poly{fill:rgb(var(--p)/.18);stroke:rgb(var(--p));stroke-width:2.5;stroke-linejoin:round}
  .dot{fill:rgb(var(--p));stroke:rgb(var(--bg));stroke-width:2}
  .ah{fill:rgb(var(--line)/.45)}
  .chipbox{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .chiptx{fill:rgb(var(--a))}
  .blue{fill:rgb(var(--p))}.purp{fill:rgb(var(--a))}
  .ok{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .pr{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .final{fill:rgb(var(--tx));}
  .finaltx{font-size:18px;font-weight:700;fill:rgb(var(--bg))}
  @media (prefers-color-scheme: dark){
    .g1 .box{fill:rgb(var(--p)/.18)}.g2 .box{fill:rgb(var(--s)/.22)}.g3 .box{fill:rgb(var(--a)/.2)}
    .chiptx{fill:rgb(167 139 250)}.chipbox{stroke:rgb(167 139 250)}.purp{fill:rgb(167 139 250)}.pr{stroke:rgb(167 139 250)}
    .g3 .acc{fill:rgb(167 139 250)}
  }
</style><rect class="bg" width="1200" height="780"/>
<text class="title" x="60" y="78" text-anchor="start">Is your problem information or process?</text>
<text class="subtitle" x="60" y="110" text-anchor="start">A simple question to choose the first step of digitalization</text>
<rect class="card" x="400" y="150" width="400" height="48" rx="24"/>
<text class="val" x="600" y="180" text-anchor="middle">An operational problem is costing you</text>
<line class="rule" x1="600" y1="198" x2="600" y2="222"/><path class="ah" d="M600 228 l-5 -8 h10 z"/>
<rect class="final" x="340" y="228" width="520" height="62" rx="14"/>
<text class="finaltx" x="600" y="266" text-anchor="middle">Is the problem information or process?</text>
<path class="rule" d="M600 290 V316 H310 V346"/><path class="ah" d="M310 356 l-5 -8 h10 z"/>
<path class="rule" d="M600 316 H890 V346"/><path class="ah" d="M890 356 l-5 -8 h10 z"/>
<g class="g1">
<rect class="box" x="70" y="356" width="480" height="116" rx="12"/><rect class="bar" x="70" y="356" width="480" height="6" rx="3"/>
<text class="h2" x="94" y="394" text-anchor="start">Missing information</text>
<text class="body" x="94" y="422" text-anchor="start">Data is absent, hard to find,</text>
<text class="body" x="94" y="443" text-anchor="start">or arrives too late</text>
</g>
<g class="g3">
<rect class="box" x="650" y="356" width="480" height="116" rx="12"/><rect class="bar" x="650" y="356" width="480" height="6" rx="3"/>
<text class="h2" x="674" y="394" text-anchor="start">Inconsistent process</text>
<text class="body" x="674" y="422" text-anchor="start">Everyone does it differently; the</text>
<text class="body" x="674" y="443" text-anchor="start">same task gives different results</text>
</g>
<line class="rule" x1="310" y1="472" x2="310" y2="514"/><path class="ah" d="M310 520 l-5 -8 h10 z"/>
<line class="rule" x1="890" y1="472" x2="890" y2="514"/><path class="ah" d="M890 520 l-5 -8 h10 z"/>
<rect class="ok" x="70" y="520" width="480" height="64" rx="12"/>
<text class="term" x="310" y="558" text-anchor="middle">Software can help right away</text>
<rect class="pr" x="650" y="520" width="480" height="64" rx="12"/>
<text class="term" x="890" y="558" text-anchor="middle">Standardize the process first, or in parallel</text>
<path class="rule" d="M310 584 V620 H600 V646"/><path class="rule" d="M890 584 V620 H600"/>
<path class="ah" d="M600 656 l-5 -8 h10 z"/>
<rect class="final" x="300" y="656" width="600" height="58" rx="14"/>
<text class="finaltx" x="600" y="692" text-anchor="middle">Pick the smallest step with economic value</text>
<text class="mut" x="600" y="744" text-anchor="middle">Examples: documenting SOPs · a simple document management system · standardized QC data capture</text>
<text class="foot" x="60" y="756" text-anchor="start">okelas.com</text>
</svg>
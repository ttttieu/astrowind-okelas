<text class="chip chiptx" x="742" y="189" text-anchor="start">VÍ DỤ MINH HỌA · KHÔNG PHẢI DỮ LIỆU THỰC</text>
<text class="h2" x="734" y="234" text-anchor="start">Cách đọc hình</text>
<text class="body" x="734" y="260" text-anchor="start">Mỗi trục là một chiều vận hành. Điểm là</text>
<text class="body" x="734" y="281" text-anchor="start">cấp độ (1–5) mà doanh nghiệp đang ở</text>
<text class="body" x="734" y="302" text-anchor="start">ở chiều đó.</text>
<text class="h2" x="734" y="349" text-anchor="start">Trong ví dụ này</text>
<text class="body" x="734" y="375" text-anchor="start">Tài liệu đã ở cấp độ 4, nhưng lớp tri</text>
<text class="body" x="734" y="396" text-anchor="start">thức mới ở cấp độ 1. Doanh nghiệp có</text>
<text class="body" x="734" y="417" text-anchor="start">hệ thống, nhưng tri thức vẫn nằm trong</text>
<text class="body" x="734" y="438" text-anchor="start">đầu người.</text>
<text class="h2" x="734" y="485" text-anchor="start">Hàm ý</text>
<text class="body" x="734" y="511" text-anchor="start">Hỏi “doanh nghiệp ở cấp độ nào?” theo</text>
<text class="body" x="734" y="532" text-anchor="start">từng chiều, không phải bằng một con số</text>
<text class="body" x="734" y="553" text-anchor="start">duy nhất.</text>
<text class="foot" x="60" y="676" text-anchor="start">okelas.com</text>

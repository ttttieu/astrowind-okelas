<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Five stages of digitalization for a manufacturing company, from paper to AI-assisted operations"><style>
  :root{--p:1 97 239;--s:1 84 207;--a:109 40 217;--bg:255 255 255;--tx:0 0 0;--mut:16 16 16;--line:16 16 16}
  @media (prefers-color-scheme: dark){:root{--bg:8 9 10;--tx:247 248 248;--mut:229 236 246;--line:229 236 246}}
  text{font-family:Inter,Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
  .bg{fill:rgb(var(--bg))}
  .title{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .big{font-size:50px;font-weight:700;fill:rgb(var(--tx))}
  .subtitle{font-size:17px;fill:rgb(var(--mut)/.66)}
  .term{font-size:17px;font-weight:700;fill:rgb(var(--tx))}
  .h2{font-size:19px;font-weight:700;fill:rgb(var(--tx))}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:rgb(var(--mut)/.66)}
  .desc{font-size:13.5px;fill:rgb(var(--mut)/.85)}
  .body{font-size:14.5px;fill:rgb(var(--mut)/.88)}
  .mut{font-size:13px;fill:rgb(var(--mut)/.66)}
  .val{font-size:15px;font-weight:600;fill:rgb(var(--tx))}
  .foot{font-size:13px;fill:rgb(var(--mut)/.5)}
  .chip{font-size:12px;font-weight:700;letter-spacing:.06em}
  .g1 .box{fill:rgb(var(--p)/.08);stroke:rgb(var(--p))}
  .g2 .box{fill:rgb(var(--s)/.12);stroke:rgb(var(--s))}
  .g3 .box{fill:rgb(var(--a)/.09);stroke:rgb(var(--a))}
  .g1 .bar{fill:rgb(var(--p))}.g2 .bar{fill:rgb(var(--s))}.g3 .bar{fill:rgb(var(--a))}
  .g1 .acc{fill:rgb(var(--p))}.g2 .acc{fill:rgb(var(--s))}.g3 .acc{fill:rgb(var(--a))}
  .box{stroke-width:1.5}
  .card{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .soft{fill:rgb(var(--line)/.05)}
  .ghost{fill:rgb(var(--line)/.22)}
  .rule{stroke:rgb(var(--line)/.45);stroke-width:2;fill:none}
  .ring{stroke:rgb(var(--line)/.18);stroke-width:1;fill:none}
  .axis{stroke:rgb(var(--line)/.18);stroke-width:1}
  .poly{fill:rgb(var(--p)/.18);stroke:rgb(var(--p));stroke-width:2.5;stroke-linejoin:round}
  .dot{fill:rgb(var(--p));stroke:rgb(var(--bg));stroke-width:2}
  .ah{fill:rgb(var(--line)/.45)}
  .chipbox{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .chiptx{fill:rgb(var(--a))}
  .blue{fill:rgb(var(--p))}.purp{fill:rgb(var(--a))}
  .ok{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .pr{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .final{fill:rgb(var(--tx));}
  .finaltx{font-size:18px;font-weight:700;fill:rgb(var(--bg))}
  @media (prefers-color-scheme: dark){
    .g1 .box{fill:rgb(var(--p)/.18)}.g2 .box{fill:rgb(var(--s)/.22)}.g3 .box{fill:rgb(var(--a)/.2)}
    .chiptx{fill:rgb(167 139 250)}.chipbox{stroke:rgb(167 139 250)}.purp{fill:rgb(167 139 250)}.pr{stroke:rgb(167 139 250)}
    .g3 .acc{fill:rgb(167 139 250)}
  }
</style><rect class="bg" width="1200" height="700"/>
<text class="title" x="60" y="78" text-anchor="start">Five stages of digitalization in manufacturing</text>
<text class="subtitle" x="60" y="110" text-anchor="start">Each stage builds on the one before; not every company needs to reach the top</text>
<g class="g1"><rect class="box" x="61.0" y="400" width="206" height="230" rx="12"/><rect class="bar" x="61.0" y="400" width="206" height="6" rx="3"/>
<text class="lbl" x="77.0" y="430" text-anchor="start">STAGE 1</text>
<text class="term" x="77.0" y="456" text-anchor="start">Paper</text>
<text class="desc" x="77.0" y="482" text-anchor="start">Manual processes,</text>
<text class="desc" x="77.0" y="500" text-anchor="start">paper records,</text>
<text class="desc" x="77.0" y="518" text-anchor="start">hard to search</text>
<line class="axis" x1="77.0" y1="550" x2="251.0" y2="550"/>
<text class="lbl" x="77.0" y="564" text-anchor="start">NEXT STEP</text>
<text class="desc" x="77.0" y="582" text-anchor="start">Digitize key records</text>
<text class="desc" x="77.0" y="600" text-anchor="start">into searchable form</text>
</g>
<g class="g1"><rect class="box" x="279.0" y="350" width="206" height="280" rx="12"/><rect class="bar" x="279.0" y="350" width="206" height="6" rx="3"/>
<text class="lbl" x="295.0" y="380" text-anchor="start">STAGE 2</text>
<text class="term" x="295.0" y="406" text-anchor="start">Digital documents</text>
<text class="desc" x="295.0" y="432" text-anchor="start">Word, Excel and PDF</text>
<text class="desc" x="295.0" y="450" text-anchor="start">files without</text>
<text class="desc" x="295.0" y="468" text-anchor="start">structure</text>
<line class="axis" x1="295.0" y1="550" x2="469.0" y2="550"/>
<text class="lbl" x="295.0" y="564" text-anchor="start">NEXT STEP</text>
<text class="desc" x="295.0" y="582" text-anchor="start">Build a document</text>
<text class="desc" x="295.0" y="600" text-anchor="start">management system with</text>
<text class="desc" x="295.0" y="618" text-anchor="start">version control</text>
</g>
<g class="g2"><rect class="box" x="497.0" y="300" width="206" height="330" rx="12"/><rect class="bar" x="497.0" y="300" width="206" height="6" rx="3"/>
<text class="lbl" x="513.0" y="330" text-anchor="start">STAGE 3</text>
<text class="term" x="513.0" y="356" text-anchor="start">Digital workflow</text>
<text class="desc" x="513.0" y="382" text-anchor="start">Processes run through</text>
<text class="desc" x="513.0" y="400" text-anchor="start">a system; records are</text>
<text class="desc" x="513.0" y="418" text-anchor="start">created automatically</text>
<line class="axis" x1="513.0" y1="550" x2="687.0" y2="550"/>
<text class="lbl" x="513.0" y="564" text-anchor="start">NEXT STEP</text>
<text class="desc" x="513.0" y="582" text-anchor="start">Integrate systems,</text>
<text class="desc" x="513.0" y="600" text-anchor="start">standardize data</text>
</g>
<g class="g3"><rect class="box" x="715.0" y="250" width="206" height="380" rx="12"/><rect class="bar" x="715.0" y="250" width="206" height="6" rx="3"/>
<text class="lbl" x="731.0" y="280" text-anchor="start">STAGE 4</text>
<text class="term" x="731.0" y="306" text-anchor="start">Integrated</text>
<text class="term" x="731.0" y="327" text-anchor="start">processes</text>
<text class="desc" x="731.0" y="353" text-anchor="start">Connected systems,</text>
<text class="desc" x="731.0" y="371" text-anchor="start">data usable for</text>
<text class="desc" x="731.0" y="389" text-anchor="start">decisions</text>
<line class="axis" x1="731.0" y1="550" x2="905.0" y2="550"/>
<text class="lbl" x="731.0" y="564" text-anchor="start">NEXT STEP</text>
<text class="desc" x="731.0" y="582" text-anchor="start">Build organizational</text>
<text class="desc" x="731.0" y="600" text-anchor="start">knowledge as a base</text>
<text class="desc" x="731.0" y="618" text-anchor="start">for AI</text>
</g>
<g class="g3"><rect class="box" x="933.0" y="200" width="206" height="430" rx="12"/><rect class="bar" x="933.0" y="200" width="206" height="6" rx="3"/>
<text class="lbl" x="949.0" y="230" text-anchor="start">STAGE 5</text>
<text class="term" x="949.0" y="256" text-anchor="start">AI-assisted</text>
<text class="term" x="949.0" y="277" text-anchor="start">operations</text>
<text class="desc" x="949.0" y="303" text-anchor="start">AI takes part in the</text>
<text class="desc" x="949.0" y="321" text-anchor="start">process as a participant,</text>
<text class="desc" x="949.0" y="339" text-anchor="start">not only a tool</text>
<line class="axis" x1="949.0" y1="550" x2="1123.0" y2="550"/>
<text class="lbl" x="949.0" y="564" text-anchor="start">NOTE</text>
<text class="desc" x="949.0" y="582" text-anchor="start">Highest level; not</text>
<text class="desc" x="949.0" y="600" text-anchor="start">required for every</text>
<text class="desc" x="949.0" y="618" text-anchor="start">company</text>
</g>
<text class="foot" x="60" y="676" text-anchor="start">okelas.com</text>
</svg>
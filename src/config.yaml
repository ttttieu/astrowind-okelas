site:
  name: OKELAS
  site: 'https://okelas.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata (Brand-level fallback)
metadata:
  title:
    default: 'OKELAS — Organization Knowledge Operating System'
    template: '%s — OKELAS'

  description: 'OKELAS helps organizations standardize processes, structure organizational knowledge, digitize operations, and prepare for ERP and AI.'

  robots:
    index: true
    follow: true

  openGraph:
    site_name: OKELAS
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

  twitter:
    handle: '@okelas'
    site: '@okelas'
    cardType: summary_large_image

i18n:
  language: vi
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/insights/%slug%' 
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'insights' 
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false # Ngăn tạo thin-content pages cho các tag ít bài

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # Điền ID GA4 dạng "G-XXXXXXXXXX" khi deploy chính thức

ui:
  theme: 'system'

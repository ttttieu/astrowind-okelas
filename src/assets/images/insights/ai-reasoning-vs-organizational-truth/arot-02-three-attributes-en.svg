<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="A three-row table comparing traceable, attributable and verifiable: plain AI explanation marked “Not enough”, sourced data marked “Can be met”." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A coherent explanation falls short of the evidence standard</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three attributes the article names, set against the two kinds of information.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The table is OKELAS’s rearrangement of the article’s argument; the “Not enough” and “Can be met” labels are OKELAS’s assessment.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Attribute</text><text x="460.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Plain AI explanation</text><text x="810.0" y="152.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Tied to sourced data</text><rect x="60.0" y="170.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="206.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Traceable</text><rect x="460.0" y="170.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="182.0" width="115.5" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="541.7" y="204.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Not enough</text><rect x="810.0" y="170.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="182.0" width="112.8" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="890.4" y="204.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Can be met</text><rect x="60.0" y="242.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="278.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Attributable</text><rect x="460.0" y="242.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="254.0" width="115.5" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="541.7" y="276.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Not enough</text><rect x="810.0" y="242.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="254.0" width="112.8" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="890.4" y="276.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Can be met</text><rect x="60.0" y="314.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="350.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Verifiable</text><rect x="460.0" y="314.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="326.0" width="115.5" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="541.7" y="348.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Not enough</text><rect x="810.0" y="314.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="326.0" width="112.8" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="890.4" y="348.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Can be met</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A coherent explanation does not automatically meet the evidence standard.</text></svg>
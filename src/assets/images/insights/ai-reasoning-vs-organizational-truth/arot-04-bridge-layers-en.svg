<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Three stacked layers: AI at the top, KVM in the middle, organizational evidence at the bottom; a note on the right points to further mechanisms." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM is a bridge, but not the whole compliance answer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI explains; KVM retrieves, resolves and traces; the organization needs audit-ready evidence.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Layering per the article; the other mechanisms from article 6.10 are an internal reference with no link yet.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="640.0" height="70.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="380.0" y="191.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">AI: explains and reasons</text><rect x="60.0" y="250.0" width="640.0" height="70.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="380.0" y="291.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">KVM: retrieves, resolves, traces</text><rect x="60.0" y="350.0" width="640.0" height="70.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.6"/><text x="380.0" y="391.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Organization: audit-ready evidence</text><line x1="380.0" y1="220.0" x2="380.0" y2="250.0" stroke="var(--gm)" stroke-width="3"/><line x1="380.0" y1="320.0" x2="380.0" y2="350.0" stroke="var(--gm)" stroke-width="3"/><rect x="740.0" y="250.0" width="400.0" height="170.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="940.0" y="330.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Other mechanisms (article 6.10) are still</text><text x="940.0" y="352.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">needed for audit readiness.</text><line x1="700.0" y1="285.0" x2="740.0" y2="285.0" stroke="var(--gm)" stroke-width="2"/><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM is a bridge, not the whole compliance solution.</text></svg>
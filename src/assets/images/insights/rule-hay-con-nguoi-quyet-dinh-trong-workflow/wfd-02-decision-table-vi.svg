<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="Bảng bốn loại quyết định và ba cơ chế: rule trong workflow, AI hỗ trợ đầu vào và con người phán đoán; AI chỉ ở cột hỗ trợ đầu vào, quyền quyết định ở lại với con người." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="670" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Rule, AI hay con người: mỗi bên đảm nhận gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI không nằm ở cột "quyết định": quyền quyết định ở lại với con người.</text><line x1="60.0" y1="608.0" x2="1140.0" y2="608.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="630.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="330.0" height="38.0" rx="10" fill="var(--gt)"/><text x="225.0" y="158.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đặc điểm quyết định</text><rect x="400.0" y="134.0" width="230.0" height="38.0" rx="10" fill="var(--p)"/><text x="515.0" y="158.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Rule trong workflow</text><rect x="640.0" y="134.0" width="250.0" height="38.0" rx="10" fill="var(--a)"/><text x="765.0" y="158.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">AI hỗ trợ đầu vào</text><rect x="900.0" y="134.0" width="240.0" height="38.0" rx="10" fill="var(--hd)"/><text x="1020.0" y="158.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Con người phán đoán</text><rect x="60.0" y="182.0" width="330.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="227.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lặp lại, tiêu chí rõ, dữ liệu có cấu trúc</text><rect x="400.0" y="182.0" width="230.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="515.0" y="227.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Có</text><rect x="640.0" y="182.0" width="250.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="765.0" y="227.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Không cần</text><rect x="900.0" y="182.0" width="240.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="1020.0" y="227.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Không cần</text><rect x="60.0" y="272.0" width="330.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="317.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lặp lại, nhưng đầu vào phi cấu trúc</text><rect x="400.0" y="272.0" width="230.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="515.0" y="317.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Có, sau khi AI diễn giải</text><rect x="640.0" y="272.0" width="250.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="765.0" y="317.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Diễn giải đầu vào</text><rect x="900.0" y="272.0" width="240.0" height="80.0" rx="12" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="1020.0" y="317.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xác nhận nếu rủi ro cao</text><rect x="60.0" y="362.0" width="330.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="407.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Hiếm gặp, tiêu chí chưa ổn định</text><rect x="400.0" y="362.0" width="230.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="515.0" y="407.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Chưa: cần tiền lệ</text><rect x="640.0" y="362.0" width="250.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="765.0" y="407.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tổng hợp evidence</text><rect x="900.0" y="362.0" width="240.0" height="80.0" rx="12" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="1020.0" y="407.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phán đoán</text><rect x="60.0" y="452.0" width="330.0" height="80.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="497.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Hậu quả sai cao, bất kể tần suất</text><rect x="400.0" y="452.0" width="230.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="515.0" y="497.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chỉ làm đường mặc định</text><rect x="640.0" y="452.0" width="250.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="765.0" y="497.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuẩn bị hồ sơ evidence</text><rect x="900.0" y="452.0" width="240.0" height="80.0" rx="12" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="1020.0" y="497.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xác nhận bắt buộc</text><rect x="60.0" y="548.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="581.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI diễn giải đầu vào và chuẩn bị evidence để con người quyết định nhanh hơn, với căn cứ tốt hơn.</text></svg>
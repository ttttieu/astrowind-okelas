<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Dải liên tục của Herbert Simon: quyết định có thể lập trình ở một đầu, quyết định không thể lập trình ở đầu kia, phần lớn quyết định thực tế nằm giữa; vị trí không cố định và dịch về phía lập trình khi tiền lệ tích lũy; bốn tiêu chí giúp định vị." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định nằm ở đâu trên dải liên tục</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Hai đầu của một dải liên tục, không phải hai phạm trù tách biệt.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="714.1" y="124.0" width="425.9" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="927.0" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Herbert Simon, "The New Science of Management Decision" (1960)</text><rect x="330.0" y="168.0" width="375.3" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="517.6" y="184.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Vị trí không cố định: dịch về phía lập trình khi tiền lệ tích lũy</text><line x1="1100.0" y1="206.0" x2="140.0" y2="206.0" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="160.0" y1="206.0" x2="130.0" y2="206.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="120.0,206.0 130.0,200.5 130.0,211.5" fill="#A78BFA"/><rect x="60.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="80.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định có thể lập trình</text><text x="80.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">Programmed</text><rect x="420.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.8"/><text x="440.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Phần lớn quyết định thực tế</text><text x="440.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">nằm ở giữa hai đầu</text><rect x="780.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="800.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định không thể lập trình</text><text x="800.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">Nonprogrammed</text><rect x="60.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="80.0" y="344.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Lặp lại, có cấu trúc rõ ràng, xử lý bằng</text><text x="80.0" y="365.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">quy trình hoặc hệ thống đã thiết lập.</text><rect x="80.0" y="408.0" width="320.0" height="40.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="240.0" y="432.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Ứng viên cho rule trong workflow</text><rect x="420.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="440.0" y="338.8" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Bốn tiêu chí định vị</text><rect x="440.0" y="356.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="517.0" y="380.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tần suất</text><rect x="608.0" y="356.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="685.0" y="380.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Độ ổn định của tiêu chí</text><rect x="440.0" y="404.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="517.0" y="420.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Liệt kê trước được</text><text x="517.0" y="436.3" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">biến thể</text><rect x="608.0" y="404.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="685.0" y="420.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Hậu quả khi áp</text><text x="685.0" y="436.3" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">dụng sai</text><rect x="780.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="800.0" y="344.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Mới, phức tạp, cần phán đoán nhiều yếu tố</text><text x="800.0" y="365.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">cùng lúc, không liệt kê hết biến thể từ trước.</text><rect x="800.0" y="408.0" width="320.0" height="40.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5"/><text x="960.0" y="432.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Thuộc về con người; hệ thống chuẩn bị đầu vào</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Câu hỏi không phải "có dùng AI không", mà là quyết định này đang ở đâu trên dải liên tục.</text></svg>
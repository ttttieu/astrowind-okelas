<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="Bảng bốn loại quyết định và ba cơ chế: rule trong workflow, AI hỗ trợ đầu vào và con người phán đoán; AI chỉ ở cột hỗ trợ đầu vào, quyền quyết định ở lại với con người." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="670" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule, AI hay con người: mỗi bên đảm nhận gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">AI không nằm ở cột "quyết định": quyền quyết định ở lại với con người.</text><line x1="60.0" y1="608.0" x2="1140.0" y2="608.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="630.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="330.0" height="38.0" rx="10" fill="#14161A"/><text x="225.0" y="158.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đặc điểm quyết định</text><rect x="400.0" y="134.0" width="230.0" height="38.0" rx="10" fill="#2B74F5"/><text x="515.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rule trong workflow</text><rect x="640.0" y="134.0" width="250.0" height="38.0" rx="10" fill="#A78BFA"/><text x="765.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI hỗ trợ đầu vào</text><rect x="900.0" y="134.0" width="240.0" height="38.0" rx="10" fill="#F7F8F8"/><text x="1020.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Con người phán đoán</text><rect x="60.0" y="182.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="227.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Lặp lại, tiêu chí rõ, dữ liệu có cấu trúc</text><rect x="400.0" y="182.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="227.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Có</text><rect x="640.0" y="182.0" width="250.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="765.0" y="227.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Không cần</text><rect x="900.0" y="182.0" width="240.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="1020.0" y="227.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Không cần</text><rect x="60.0" y="272.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="317.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Lặp lại, nhưng đầu vào phi cấu trúc</text><rect x="400.0" y="272.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Có, sau khi AI diễn giải</text><rect x="640.0" y="272.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Diễn giải đầu vào</text><rect x="900.0" y="272.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Xác nhận nếu rủi ro cao</text><rect x="60.0" y="362.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="407.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Hiếm gặp, tiêu chí chưa ổn định</text><rect x="400.0" y="362.0" width="230.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="515.0" y="407.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Chưa: cần tiền lệ</text><rect x="640.0" y="362.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="407.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tổng hợp evidence</text><rect x="900.0" y="362.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="407.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Phán đoán</text><rect x="60.0" y="452.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="497.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Hậu quả sai cao, bất kể tần suất</text><rect x="400.0" y="452.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Chỉ làm đường mặc định</text><rect x="640.0" y="452.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Chuẩn bị hồ sơ evidence</text><rect x="900.0" y="452.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Xác nhận bắt buộc</text><rect x="60.0" y="548.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="581.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI diễn giải đầu vào và chuẩn bị evidence để con người quyết định nhanh hơn, với căn cứ tốt hơn.</text></svg>
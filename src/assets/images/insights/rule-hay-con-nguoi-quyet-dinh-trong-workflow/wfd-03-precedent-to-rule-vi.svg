<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 648" width="1200" height="648" role="img" aria-label="Bốn bước biến phán đoán thành rule: ghi nhận ngoại lệ, nhận diện mẫu hình, con người duyệt và ban hành, rule mới vào workflow; kèm vòng đời rule với rule owner, quy trình sửa, log evidence và dấu hiệu cần rà soát." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="648" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ phán đoán thành rule: tiền lệ tích lũy</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phạm vi phán đoán thu hẹp dần nhờ tiền lệ được xác nhận, không nhờ giao thêm quyền cho AI.</text><line x1="60.0" y1="586.0" x2="1140.0" y2="586.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="608.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi nhận ngoại lệ</text><text x="76.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi ca ngoài rule hiện tại:</text><text x="76.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hệ thống ghi lý do và quyết định</text><text x="76.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">như evidence.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="var(--p)"/><rect x="335.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nhận diện mẫu hình</text><text x="351.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cùng loại tình huống xuất hiện đủ</text><text x="351.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều lần, xử lý nhất quán: đề xuất</text><text x="351.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">"có thể thành rule".</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="var(--p)"/><rect x="610.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--a)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><rect x="746.8" y="154.0" width="102.2" height="22.0" rx="11.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="797.9" y="169.0" font-size="11" font-weight="700" fill="var(--a)" text-anchor="middle">Cổng con người</text><text x="626.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Con người duyệt và</text><text x="626.0" y="239.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">ban hành</text><text x="626.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đề xuất không tự thành rule: người</text><text x="626.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">có thẩm quyền xem xét, chỉnh sửa,</text><text x="626.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">ban hành với điều kiện rõ ràng.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="var(--p)"/><rect x="885.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Rule mới vào workflow</text><text x="901.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Các ca cùng loại được rule xử lý,</text><text x="901.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">không cần leo thang.</text><rect x="60.0" y="360.0" width="1080.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="390.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Vòng đời của rule</text><rect x="84.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="245.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Rule owner rà soát định kỳ</text><rect x="424.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="585.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sửa rule theo quy trình chính thức</text><rect x="764.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="925.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Log evidence mỗi lần áp dụng</text><text x="84.0" y="476.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Dấu hiệu cần rà soát</text><rect x="330.0" y="456.0" width="280.0" height="36.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="470.0" y="478.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Ngoại lệ tăng bất thường</text><rect x="630.0" y="456.0" width="280.0" height="36.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="770.0" y="478.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Khiếu nại tăng sau khi rule chạy</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Doanh nghiệp trưởng thành biết phần nào đủ điều kiện thành rule, phần nào cần con người.</text></svg>
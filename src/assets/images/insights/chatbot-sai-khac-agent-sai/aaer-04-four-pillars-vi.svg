<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Bốn thẻ trụ cột: bằng chứng, phê duyệt, giới hạn và kiểm toán." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn trụ cột: bằng chứng, phê duyệt, giới hạn, kiểm toán</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn trụ cột bài viết đề xuất để giới hạn rủi ro của agent.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn trụ cột theo bài viết; cách triển khai cụ thể tùy từng doanh nghiệp.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="96.0" cy="166.0" r="15" fill="var(--gm)"/><text x="96.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng</text><text x="84.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi lại độc lập đầu vào, lập</text><text x="84.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">luận và kết quả, không phụ</text><text x="84.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thuộc vào tự báo cáo của</text><text x="84.0" y="320.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">mô hình.</text><rect x="335.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="371.0" cy="166.0" r="15" fill="var(--p)"/><text x="371.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="359.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Phê duyệt</text><text x="359.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một điểm xác nhận riêng</text><text x="359.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trước các hành động có</text><text x="359.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hệ quả.</text><rect x="610.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="646.0" cy="166.0" r="15" fill="var(--gm)"/><text x="646.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="634.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Giới hạn</text><text x="634.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quyền tối thiểu cần thiết,</text><text x="634.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm tra ở cả cấp agent lẫn</text><text x="634.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cấp hệ thống.</text><rect x="885.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="921.0" cy="166.0" r="15" fill="var(--gm)"/><text x="921.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="909.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm toán</text><text x="909.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Rà soát chủ động, định kỳ</text><text x="909.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">và khả năng thu hồi quyền</text><text x="909.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">nhanh chóng.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khả năng không đồng nghĩa với quyền được làm.</text></svg>
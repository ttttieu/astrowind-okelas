<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Ba bước khuyến nghị được đánh số, theo thứ tự trước khi triển khai." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba việc doanh nghiệp nên làm trước khi triển khai</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba khuyến nghị triển khai theo bài viết.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khuyến nghị theo bài viết; bài dẫn OWASP Top 10 for Agentic Applications làm tham chiếu.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="182.0" r="15" fill="var(--gm)"/><text x="100.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="150.0" y="170.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Phân loại hậu quả và khả năng đảo ngược trước khi chọn công nghệ</text><text x="150.0" y="205.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quyết định nên được xếp loại theo mức độ hậu quả và khả năng sửa lại trước khi chọn giải pháp.</text><rect x="60.0" y="244.0" width="1080.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="292.0" r="15" fill="var(--p)"/><text x="100.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="150.0" y="280.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Xây bốn trụ cột trước khi có sự cố, không phải sau</text><text x="150.0" y="315.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bài viết lưu ý OWASP Top 10 for Agentic Applications được xây từ các sự cố thực tế năm 2025.</text><rect x="60.0" y="354.0" width="1080.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="402.0" r="15" fill="var(--gm)"/><text x="100.0" y="407.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="150.0" y="390.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thực thi trong kiến trúc lúc chạy, không chỉ trong tài liệu chính sách</text><text x="150.0" y="425.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chính sách trên giấy không giới hạn được hành động của agent nếu hệ thống không thực thi.</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Các trụ cột không loại bỏ rủi ro; chúng giới hạn hậu quả khi agent sai.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="Bảng so sánh năm tiêu chí giữa chatbot và agent." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm tiêu chí khiến lỗi agent khác lỗi chatbot</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bảng so sánh năm khía cạnh theo bài viết.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tóm tắt so sánh theo bài viết; không phải dữ liệu khảo sát.</text><text x="60.0" y="651.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="84.0" y="163.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Tiêu chí</text><text x="340.0" y="163.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Chatbot</text><text x="760.0" y="163.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Agent</text><rect x="60.0" y="182.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="182.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="182.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="216.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Bản chất</text><text x="352.0" y="216.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một câu trả lời</text><text x="772.0" y="216.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một hành động thay đổi trạng thái hệ thống</text><rect x="60.0" y="246.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="246.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="246.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="280.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Thời điểm can thiệp</text><text x="352.0" y="280.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Trước khi có hệ quả</text><text x="772.0" y="280.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Có thể sau khi hệ quả đã xảy ra</text><rect x="60.0" y="310.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="310.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="310.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="344.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Khả năng đảo ngược</text><text x="352.0" y="344.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thường dễ sửa hoặc bỏ đi</text><text x="772.0" y="344.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Có thể khó hoặc không đảo ngược</text><rect x="60.0" y="374.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="374.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="374.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="408.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Phạm vi tác động</text><text x="352.0" y="408.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một nội dung, một người đọc</text><text x="772.0" y="408.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu, quy trình và hệ thống liên quan</text><rect x="60.0" y="438.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="438.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="438.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="472.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Cách phát hiện</text><text x="352.0" y="472.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người kiểm tra thấy ngay</text><text x="772.0" y="472.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thường phải qua nhật ký hoặc sự cố</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Sự khác biệt nằm ở thời điểm can thiệp và khả năng đảo ngược, không chỉ ở mức độ nghiêm trọng.</text></svg>
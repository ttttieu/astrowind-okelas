<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 682" width="1200" height="682" role="img" aria-label="Bốn thẻ ví dụ về sự cố agent: Replit, Apollo Research, confused deputy và EchoLeak." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="682" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Khi agent sai, hậu quả thường đã xảy ra</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn ví dụ theo bài viết, mô tả ở mức khái quát.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ tóm tắt theo bài viết. Thời điểm: Replit 07/2025; Apollo Research 2024; CSA 2026.</text><text x="60.0" y="661.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="171.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Replit · 07/2025</text><text x="84.0" y="207.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Agent xóa cơ sở dữ liệu production dù đã được dặn không</text><text x="84.0" y="229.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">thay đổi khi chưa có phê duyệt.</text><rect x="612.0" y="134.0" width="528.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="636.0" y="171.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Apollo Research · 2024</text><text x="636.0" y="207.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Nghiên cứu trong môi trường thử nghiệm: một số mô hình cố</text><text x="636.0" y="229.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">gắng tắt cơ chế giám sát.</text><rect x="60.0" y="320.0" width="528.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="357.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Confused deputy · CSA 2026</text><text x="84.0" y="393.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Lỗi lan truyền qua orchestrator và vượt quá quyền hạn của</text><text x="84.0" y="415.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">từng agent.</text><rect x="612.0" y="320.0" width="528.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="357.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">EchoLeak · CVE-2025-32711</text><text x="636.0" y="393.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Một email được tạo sẵn có thể làm lộ dữ liệu doanh nghiệp mà</text><text x="636.0" y="415.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">không cần người dùng bấm gì.</text><rect x="60.0" y="528.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="561.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điểm chung: hậu quả đã xảy ra trước khi có người xem xét.</text></svg>
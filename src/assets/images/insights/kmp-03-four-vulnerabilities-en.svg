<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Four characteristics that make manufacturing SMEs vulnerable to knowledge loss: shift operations, non-standard conditions, compliance requirements and staff turnover." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="572" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Why manufacturing SMEs are vulnerable to knowledge loss</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not every industry depends on tacit knowledge to the same degree.</text><line x1="60.0" y1="488.0" x2="1140.0" y2="488.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="510.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Characteristics from the article’s analysis, not statistics. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="551.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Shift operations</text><text x="84.0" y="219.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Each shift may develop its own way of handling situations that no</text><text x="84.0" y="238.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">document covers, and no one records the differences.</text><rect x="606.0" y="134.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--a)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Non-standard conditions</text><text x="630.0" y="219.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Raw materials vary, weather shifts, equipment drifts: handling this takes</text><text x="630.0" y="238.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">experience that isn’t in the SOP.</text><rect x="60.0" y="274.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="310.0" r="15" fill="var(--a)"/><text x="94.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="315.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Compliance requirements</text><text x="84.0" y="359.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ISO and GMP need evidence that processes ran correctly. Knowledge</text><text x="84.0" y="378.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">in people’s heads is not captured.</text><rect x="606.0" y="274.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="310.0" r="15" fill="var(--a)"/><text x="640.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="315.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Staff turnover</text><text x="630.0" y="359.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Each time someone leaves, knowledge leaves with them, and the real</text><text x="630.0" y="378.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cost is rarely calculated in full.</text><rect x="60.0" y="418.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="451.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">When knowledge lives in people’s heads, every departure takes some operating capability with it.</text></svg>
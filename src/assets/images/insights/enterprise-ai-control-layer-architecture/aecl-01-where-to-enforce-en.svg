<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Three comparison cards: model self-report and policy document marked “Not enough”; runtime control layer marked “Needed”." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Policy does not enforce itself: it needs a layer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Control should not rest on the model’s self-report, nor stop at a policy document.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three options compared, per the article; the labels “Not enough” and “Needed” are OKELAS’s assessment.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Model self-report</text><text x="84.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Control should not rely on the model’s</text><text x="84.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">own ability to report on itself.</text><rect x="84.0" y="330.0" width="115.5" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="141.7" y="352.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Not enough</text><rect x="426.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="450.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Policy document</text><text x="450.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Policy on paper does not</text><text x="450.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">enforce itself.</text><rect x="450.0" y="330.0" width="115.5" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="507.7" y="352.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Not enough</text><rect x="792.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="816.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Runtime control layer</text><text x="816.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">A technical check at the moment each</text><text x="816.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">action happens.</text><rect x="816.0" y="330.0" width="86.6" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="859.3" y="352.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Needed</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Control needs a technical layer at the moment of action, not only a promise or a document.</text></svg>
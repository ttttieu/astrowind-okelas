<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Two-column comparison: control plane and data plane in networking, matched with control layer and organizational systems for AI." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Borrowing control plane and data plane from networking</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The separation has been applied for decades in networking and distributed systems.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative comparison based on the article; not a detailed networking architecture.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Computer networking</text><text x="415.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Role</text><text x="690.0" y="152.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Agents and the enterprise</text><rect x="60.0" y="170.0" width="330.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="214.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Decides how traffic is routed.</text><rect x="415.0" y="170.0" width="250.0" height="110.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="435.0" y="208.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Control plane /</text><text x="435.0" y="230.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">control layer</text><rect x="690.0" y="170.0" width="450.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="714.0" y="214.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Checks permission, tier and evidence before</text><text x="714.0" y="238.4" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">each action.</text><rect x="60.0" y="298.0" width="330.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="342.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Carries the actual traffic.</text><rect x="415.0" y="298.0" width="250.0" height="110.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="435.0" y="336.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Data plane /</text><text x="435.0" y="358.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">organizational systems</text><rect x="690.0" y="298.0" width="450.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="714.0" y="342.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Real enterprise systems and data.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The control plane decides and the data plane carries: the same separation of roles, applied to AI.</text></svg>
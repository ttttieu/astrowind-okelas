<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 682" width="1200" height="682" role="img" aria-label="Diagram: the AI agent enters a control layer with four checks before reaching organizational systems; an orchestrator also passes through the control layer." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="682" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The agent never touches enterprise systems directly</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Every request passes through the control layer before it reaches a system or data.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Architecture diagram per the article; the checks are listed as the article describes them.</text><text x="60.0" y="661.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="340.0" y="128.0" width="400.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="540.0" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Orchestrator or other agents</text><line x1="540.0" y1="172.0" x2="540.0" y2="188.0" stroke="var(--gm)" stroke-width="3"/><polygon points="540.0,198.0 534.5,188.0 545.5,188.0" fill="var(--gm)"/><rect x="60.0" y="300.0" width="220.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="170.0" y="351.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">AI agent</text><rect x="340.0" y="198.0" width="400.0" height="300.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="2"/><text x="360.0" y="232.6" font-size="18" font-weight="700" fill="var(--p)" text-anchor="start">Control layer</text><rect x="364.0" y="250.0" width="352.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="540.0" y="276.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Verify identity and authority</text><rect x="364.0" y="306.0" width="352.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="540.0" y="332.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Check against the permission tier</text><rect x="364.0" y="362.0" width="352.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="540.0" y="388.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Check evidence</text><rect x="364.0" y="418.0" width="352.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="540.0" y="444.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Independent confirmation when required</text><line x1="280.0" y1="345.0" x2="324.0" y2="345.0" stroke="var(--gm)" stroke-width="3"/><polygon points="336.0,345.0 324.0,351.6 324.0,338.4" fill="var(--gm)"/><line x1="744.0" y1="345.0" x2="804.0" y2="345.0" stroke="var(--gm)" stroke-width="3"/><polygon points="816.0,345.0 804.0,351.6 804.0,338.4" fill="var(--gm)"/><rect x="820.0" y="300.0" width="320.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="980.0" y="351.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational systems</text><rect x="60.0" y="528.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="561.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Every interaction between an agent and enterprise systems must pass through this layer, by design.</text></svg>
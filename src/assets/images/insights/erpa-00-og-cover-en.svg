<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An ERP block resting on three pillars, chart of accounts, cost allocation and opening balances, showing the three areas to standardize before the project starts." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · ERP</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Accounting Readiness for ERP:</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">A CFO’s Preparation Checklist</text><rect x="300.0" y="300.0" width="600.0" height="90.0" rx="18" fill="var(--ink)"/><text x="600.0" y="361.6" font-size="40" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP</text><rect x="300.0" y="404.0" width="180.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="2.2"/><text x="390.0" y="451.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chart of accounts</text><rect x="510.0" y="404.0" width="180.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="2.2"/><text x="600.0" y="451.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="m
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Four manufacturing examples: inventory below threshold, a measurement outside control range, a certificate or contract nearing expiry, and a complaint spike; the system detects and initiates." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="680" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four applications: the system detects and initiates</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The system handles detection and initiation, where people tend to be slow.</text><line x1="60.0" y1="618.0" x2="1140.0" y2="618.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="640.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Event</text><text x="540.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">What the system does</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Illustrative example</text><rect x="60.0" y="152.0" width="400.0" height="88.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="78.0" y="191.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Raw material inventory drops below</text><text x="78.0" y="212.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">safety threshold</text><line x1="468.0" y1="196.0" x2="519.0" y2="196.0" stroke="#2B74F5" stroke-width="3"/><polygon points="530.0,196.0 519.0,202.1 519.0,189.9" fill="#2B74F5"/><rect x="540.0" y="152.0" width="600.0" height="88.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="560.0" y="201.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Drafts a purchase request with consumption history and preferred supplier</text><rect x="60.0" y="252.0" width="400.0" height="88.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="78.0" y="291.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">An in-process measurement exceeds the</text><text x="78.0" y="312.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">control range</text><line x1="468.0" y1="296.0" x2="519.0" y2="296.0" stroke="#2B74F5" stroke-width="3"/><polygon points="530.0,296.0 519.0,302.1 519.0,289.9" fill="#2B74F5"/><rect x="540.0" y="252.0" width="600.0" height="88.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="560.0" y="291.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Opens a quality ticket and notifies the owner, without waiting for a</text><text x="560.0" y="311.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">scheduled inspection</text><rect x="60.0" y="352.0" width="400.0" height="88.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="78.0" y="401.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">A certificate or contract nears expiry</text><line x1="468.0" y1="396.0" x2="519.0" y2="396.0" stroke="#2B74F5" stroke-width="3"/><polygon points="530.0,396.0 519.0,402.1 519.0,389.9" fill="#2B74F5"/><rect x="540.0" y="352.0" width="600.0" height="88.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="560.0" y="391.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Starts the renewal or review process, instead of relying on one</text><text x="560.0" y="411.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">person remembering</text><rect x="60.0" y="452.0" width="400.0" height="88.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="78.0" y="491.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Complaints about one issue cross a</text><text x="78.0" y="512.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">threshold within a period</text><line x1="468.0" y1="496.0" x2="519.0" y2="496.0" stroke="#2B74F5" stroke-width="3"/><polygon points="530.0,496.0 519.0,502.1 519.0,489.9" fill="#2B74F5"/><rect x="540.0" y="452.0" width="600.0" height="88.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="560.0" y="491.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Starts a higher-level root-cause investigation, instead of handling each</text><text x="560.0" y="511.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">case alone</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The system takes on detection and initiation; judgment at the final decision stays with people.</text></svg>
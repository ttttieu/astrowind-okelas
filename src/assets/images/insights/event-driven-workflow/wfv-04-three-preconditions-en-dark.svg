<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three preconditions before going event-driven: clearly defined events, reliable data and a way to handle false alerts; event-driven workflow is a destination, not a starting point." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three preconditions before going event-driven</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Event-driven workflow is a destination, not a starting point.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Events are clearly and</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">consistently defined</text><text x="76.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Without agreement on what an</text><text x="76.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">abnormal measure or safe</text><text x="76.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">inventory level is, detection only</text><text x="76.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">creates false alarms or misses.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="#2B74F5"/><rect x="335.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Data is reliable enough to</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">detect from</text><text x="351.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Data must be complete,</text><text x="351.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">timely and accurate; it cannot</text><text x="351.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">rest on fragmented or</text><text x="351.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">delayed recording.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="#2B74F5"/><rect x="610.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A way to handle</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">false alerts</text><text x="626.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">A quick way to confirm or</text><text x="626.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">dismiss alerts; otherwise people</text><text x="626.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">gradually ignore every alert,</text><text x="626.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">correct ones included.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="#2B74F5"/><rect x="885.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="901.0" y="150.0" width="88.8" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="945.4" y="166.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Destination</text><text x="901.0" y="207.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Event-driven workflow</text><text x="901.0" y="261.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Sensible once the workflow is</text><text x="901.0" y="280.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">well designed and does not lean</text><text x="901.0" y="300.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">heavily on a few individuals.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Without these, event detection only creates false alarms or misses, eroding trust in the system.</text></svg>
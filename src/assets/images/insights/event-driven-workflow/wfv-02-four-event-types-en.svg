<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Four event types that can start a workflow: threshold, state-change, anomaly and external, with examples of each." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="660" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four types of events that can start a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not every event deserves to start a workflow.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Threshold events</text><text x="76.0" y="212.2" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">A metric crosses a</text><text x="76.0" y="229.3" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">defined boundary</text><rect x="76.0" y="246.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="86.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Inventory falls below</text><text x="86.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">safety level</text><rect x="76.0" y="312.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="86.0" y="337.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Temperature or humidity</text><text x="86.0" y="354.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">exceeds tolerance</text><rect x="76.0" y="378.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="86.0" y="403.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A quality indicator drifts out of</text><text x="86.0" y="420.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">control range</text><rect x="335.0" y="134.0" width="255.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="391.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">State-change events</text><text x="351.0" y="212.2" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">An entity moves from one status</text><text x="351.0" y="229.3" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">to another</text><rect x="351.0" y="246.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="361.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A shipment is</text><text x="361.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">confirmed delivered</text><rect x="351.0" y="312.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="361.0" y="345.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A contract nears expiry</text><rect x="351.0" y="378.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="361.0" y="403.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A certificate has few days of</text><text x="361.0" y="420.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">validity left</text><rect x="610.0" y="134.0" width="255.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="666.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Anomaly events</text><text x="626.0" y="220.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">A pattern differs from normal</text><rect x="626.0" y="246.0" width="223.0" height="190.0" rx="10" fill="var(--pt)"/><text x="640.0" y="316.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Complaints spike within</text><text x="640.0" y="336.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">a week, even if no</text><text x="640.0" y="356.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">single metric has</text><text x="640.0" y="376.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">crossed a threshold</text><rect x="885.0" y="134.0" width="255.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="941.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">External events</text><text x="901.0" y="220.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Outside conditions shift</text><rect x="901.0" y="246.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="911.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Exchange rate passes a</text><text x="911.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">contract limit</text><rect x="901.0" y="312.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="911.0" y="345.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A new regulation takes effect</text><rect x="901.0" y="378.0" width="223.0" height="58.0" rx="10" fill="var(--pt)"/><text x="911.0" y="403.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">A supplier discontinues</text><text x="911.0" y="420.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">a product</text><text x="60.0" y="493.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">A worthwhile trigger needs</text><rect x="270.0" y="470.0" width="230.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="385.0" y="494.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">A clear definition</text><rect x="520.0" y="470.0" width="310.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="675.0" y="494.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Detectable from existing data</text><rect x="850.0" y="470.0" width="290.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="995.0" y="494.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Real value from early response</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ask before implementing: if the system detects it earlier than people, does the outcome actually change?</text></svg>
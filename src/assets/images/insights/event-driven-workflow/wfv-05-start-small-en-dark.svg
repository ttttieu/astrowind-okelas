<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Start with one or two event types of moderate frequency, clear impact and available data, rather than covering the whole organization at once." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="622" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Start small: one or two event types</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Choose few event types, but choose well.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="560.0" height="56.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="340.0" y="167.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">A well-designed workflow that does not lean on a few individuals</text><line x1="626.0" y1="162.0" x2="689.0" y2="162.0" stroke="#A78BFA" stroke-width="3"/><polygon points="700.0,162.0 689.0,168.1 689.0,155.9" fill="#A78BFA"/><rect x="706.0" y="134.0" width="434.0" height="56.0" rx="12" fill="#A78BFA"/><text x="923.0" y="167.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Event-driven workflow</text><rect x="60.0" y="212.0" width="440.0" height="270.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="230.0" width="65.0" height="26.0" rx="13.0" fill="#08090A" stroke="#9AA6B8" stroke-width="1.2"/><text x="116.5" y="247.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="middle">Avoid</text><text x="84.0" y="299.1" font-size="20" font-weight="700" fill="#9AA6B8" text-anchor="start">Covering the whole organization</text><text x="84.0" y="326.7" font-size="20" font-weight="700" fill="#9AA6B8" text-anchor="start">at once</text><text x="84.0" y="368.3" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Invites noise and lost trust while event definitions and</text><text x="84.0" y="390.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">data are not ready.</text><line x1="508.0" y1="347.0" x2="545.0" y2="347.0" stroke="#2B74F5" stroke-width="3"/><polygon points="556.0,347.0 545.0,353.1 545.0,340.9" fill="#2B74F5"/><rect x="566.0" y="212.0" width="574.0" height="270.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="590.0" y="230.0" width="68.1" height="26.0" rx="13.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="624.0" y="247.7" font-size="13" font-weight="700" fill="#2B74F5" text-anchor="middle">Prefer</text><text x="590.0" y="299.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Start with one or two event types</text><rect x="590.0" y="332.0" width="360.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="770.0" y="357.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Moderate frequency</text><rect x="590.0" y="382.0" width="360.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="770.0" y="407.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Clear impact</text><rect x="590.0" y="432.0" width="360.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="770.0" y="457.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Data already available</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Start with one or two event types, not the whole organization at once.</text></svg>
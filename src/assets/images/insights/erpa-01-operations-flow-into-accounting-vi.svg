<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 522" width="1200" height="522" role="img" aria-label="Các giao dịch vận hành như đơn mua, nhập kho và hóa đơn bán đều đi vào kế toán dưới dạng bút toán, rồi thành báo cáo đầu ra dùng để ra quyết định; dữ liệu kế toán sai thì mọi báo cáo không đáng tin." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="522" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Mọi giao dịch vận hành đều đổ vào kế toán</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Kế toán hay bị xếp “xử lý sau”, nhưng là nền của mọi báo cáo đầu ra.</text><line x1="60.0" y1="438.0" x2="1140.0" y2="438.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="460.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="501.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="149.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Giao dịch vận hành</text><text x="480.0" y="149.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Bút toán kế toán</text><text x="850.0" y="149.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Báo cáo</text><rect x="60.0" y="164.0" width="280.0" height="52.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="200.0" y="196.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Đơn mua</text><line x1="346.0" y1="190.0" x2="466.0" y2="251.9" stroke="var(--gm)" stroke-width="2.5"/><polygon points="474.0,256.0 463.7,256.3 468.3,247.5" fill="var(--gm)"/><rect x="60.0" y="230.0" width="280.0" height="52.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="200.0" y="262.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhập kho</text><line x1="346.0" y1="256.0" x2="465.0" y2="256.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="474.0,256.0 465.0,260.9 465.0,251.1" fill="var(--gm)"/><rect x="60.0" y="296.0" width="280.0" height="52.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="200.0" y="328.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Hóa đơn bán</text><line x1="346.0" y1="322.0" x2="466.0" y2="260.1" stroke="var(--gm)" stroke-width="2.5"/><polygon points="474.0,256.0 468.3,264.5 463.7,255.7" fill="var(--gm)"/><rect x="480.0" y="164.0" width="280.0" height="184.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="2.4"/><text x="620.0" y="212.7" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="middle">Kế toán</text><text x="620.0" y="264.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="middle">Mỗi giao dịch sinh bút toán</text><line x1="766.0" y1="256.0" x2="834.0" y2="256.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="844.0,256.0 834.0,261.5 834.0,250.5" fill="var(--gm)"/><rect x="850.0" y="164.0" width="290.0" height="184.0" rx="16" fill="var(--ink)"/><text x="995.0" y="213.3" font-size="20" font-weight="700" fill="var(--onink)" text-anchor="middle">Báo cáo đầu ra</text><text x="995.0" y="264.1" font-size="14" font-weight="400" fill="var(--onink)" text-anchor="middle">Dùng để ra quyết định sau go-live</text><rect x="60.0" y="368.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="401.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Dữ liệu kế toán sai thì mọi báo cáo đầu ra đều không đáng tin.</text></svg>
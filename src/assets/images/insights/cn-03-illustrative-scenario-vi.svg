<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="Ước tính minh họa chi phí thời gian vận hành thủ công của doanh nghiệp thực phẩm 100 nhân viên: tổng 150 đến 245 triệu đồng mỗi năm, số liệu giả định"><style>
  :root{--p:1 97 239;--s:1 84 207;--a:109 40 217;--bg:255 255 255;--tx:0 0 0;--mut:16 16 16;--line:16 16 16}
  @media (prefers-color-scheme: dark){:root{--bg:8 9 10;--tx:247 248 248;--mut:229 236 246;--line:229 236 246}}
  text{font-family:Inter,Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
  .bg{fill:rgb(var(--bg))}
  .title{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .big{font-size:50px;font-weight:700;fill:rgb(var(--tx))}
  .subtitle{font-size:17px;fill:rgb(var(--mut)/.66)}
  .term{font-size:16px;font-weight:700;fill:rgb(var(--tx))}
  .h2{font-size:19px;font-weight:700;fill:rgb(var(--tx))}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:rgb(var(--mut)/.66)}
  .desc{font-size:13.5px;fill:rgb(var(--mut)/.85)}
  .body{font-size:14.5px;fill:rgb(var(--mut)/.88)}
  .mut{font-size:13px;fill:rgb(var(--mut)/.66)}
  .val{font-size:15px;font-weight:600;fill:rgb(var(--tx))}
  .foot{font-size:13px;fill:rgb(var(--mut)/.5)}
  .chip{font-size:12px;font-weight:700;letter-spacing:.06em}
  .g1 .box{fill:rgb(var(--p)/.08);stroke:rgb(var(--p))}
  .g2 .box{fill:rgb(var(--s)/.12);stroke:rgb(var(--s))}
  .g3 .box{fill:rgb(var(--a)/.09);stroke:rgb(var(--a))}
  .g1 .bar{fill:rgb(var(--p))}.g2 .bar{fill:rgb(var(--s))}.g3 .bar{fill:rgb(var(--a))}
  .g1 .acc{fill:rgb(var(--p))}.g2 .acc{fill:rgb(var(--s))}.g3 .acc{fill:rgb(var(--a))}
  .box{stroke-width:1.5}
  .card{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .soft{fill:rgb(var(--line)/.05)}
  .ghost{fill:rgb(var(--line)/.22)}
  .rule{stroke:rgb(var(--line)/.45);stroke-width:2;fill:none}
  .ring{stroke:rgb(var(--line)/.18);stroke-width:1;fill:none}
  .axis{stroke:rgb(var(--line)/.18);stroke-width:1}
  .poly{fill:rgb(var(--p)/.18);stroke:rgb(var(--p));stroke-width:2.5;stroke-linejoin:round}
  .dot{fill:rgb(var(--p));stroke:rgb(var(--bg));stroke-width:2}
  .ah{fill:rgb(var(--line)/.45)}
  .chipbox{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .chiptx{fill:rgb(var(--a))}
  .blue{fill:rgb(var(--p))}.purp{fill:rgb(var(--a))}
  .ok{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .pr{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .final{fill:rgb(var(--tx));}
  .finaltx{font-size:18px;font-weight:700;fill:rgb(var(--bg))}
  @media (prefers-color-scheme: dark){
    .g1 .box{fill:rgb(var(--p)/.18)}.g2 .box{fill:rgb(var(--s)/.22)}.g3 .box{fill:rgb(var(--a)/.2)}
    .chiptx{fill:rgb(167 139 250)}.chipbox{stroke:rgb(167 139 250)}.purp{fill:rgb(167 139 250)}.pr{stroke:rgb(167 139 250)}
    .g3 .acc{fill:rgb(167 139 250)}
  }
</style><style>
  .tool{fill:rgb(var(--line)/.06);stroke:rgb(var(--line)/.25);stroke-width:1.2}
  .toolb{fill:rgb(var(--p)/.12);stroke:rgb(var(--p));stroke-width:1.5}
  .island{fill:rgb(var(--line)/.04);stroke:rgb(var(--line)/.35);stroke-width:1.5;stroke-dasharray:6 5}
  .manual{stroke:rgb(var(--line)/.45);stroke-width:2;stroke-dasharray:3 5;fill:none;stroke-linecap:round}
  .flow{stroke:rgb(var(--p));stroke-width:3;fill:none;stroke-linecap:round}
  .flowh{fill:rgb(var(--p))}
  .warn{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .warntx{font-size:12.5px;font-weight:600;fill:rgb(var(--a))}
  .slot{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .yes{fill:rgb(var(--p))}.no{fill:rgb(var(--a))}
  .trk{fill:rgb(var(--line)/.10)}
  .neq{font-size:64px;font-weight:700;fill:rgb(var(--a))}
  @media (prefers-color-scheme: dark){
    .warntx{fill:rgb(167 139 250)}.neq{fill:rgb(167 139 250)}.no{fill:rgb(167 139 250)}
    .warn{stroke:rgb(167 139 250)}
  }
</style><style>
  .gate{fill:rgb(var(--bg));stroke:rgb(var(--line)/.3);stroke-width:1.5}
  .need{fill:rgb(var(--p)/.08);stroke:rgb(var(--p));stroke-width:1.2}
  .node{fill:rgb(var(--bg));stroke:rgb(var(--p));stroke-width:1.8}
  .nodep{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.8}
  .edge{stroke:rgb(var(--line)/.35);stroke-width:1.8;fill:none}
  .edgep{stroke:rgb(var(--a));stroke-width:2.2;fill:none}
  .tiny{font-size:12px;fill:rgb(var(--mut)/.66)}
  .h32{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .good{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .stop{fill:rgb(var(--a)/.08);stroke:rgb(var(--a));stroke-width:1.5}
  .limit{fill:rgb(var(--a)/.08)}
  .glow{fill:rgb(var(--a)/.06);stroke:rgb(var(--a));stroke-width:1.5;stroke-dasharray:6 5}
  @media (prefers-color-scheme: dark){
    .nodep{stroke:rgb(167 139 250)}.edgep{stroke:rgb(167 139 250)}.stop{stroke:rgb(167 139 250)}.glow{stroke:rgb(167 139 250)}
  }
</style><style>
  .tag{font-size:12px;font-weight:700;letter-spacing:.06em;fill:rgb(var(--mut)/.66)}
  .big2{font-size:44px;font-weight:700;fill:rgb(var(--tx))}
  .metric{font-size:26px;font-weight:700;fill:rgb(var(--tx))}
  .metricp{font-size:26px;font-weight:700;fill:rgb(var(--a))}
  .step{fill:rgb(var(--line)/.05);stroke:rgb(var(--line)/.18);stroke-width:1.2}
  .stepp{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.2}
  .stepb{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.2}
  .lane{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .lanep{fill:rgb(var(--a)/.06);stroke:rgb(var(--a));stroke-width:1.5}
  .lanb{fill:rgb(var(--p)/.05);stroke:rgb(var(--p));stroke-width:1.5}
  .cross{stroke:rgb(var(--line)/.55);stroke-width:2.5;stroke-linecap:round}
  .tick{stroke:rgb(var(--p));stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .tickp{stroke:rgb(var(--a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .bridge{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .endl{fill:rgb(var(--line)/.07);stroke:rgb(var(--line)/.25);stroke-width:1.5}
  .endr{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .dashv{stroke:rgb(var(--line)/.35);stroke-width:1.5;stroke-dasharray:5 5}
  .chipbox2{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .metricp{fill:rgb(167 139 250)}.tickp{stroke:rgb(167 139 250)}
    .stepp{stroke:rgb(167 139 250)}.lanep{stroke:rgb(167 139 250)}.bridge{stroke:rgb(167 139 250)}
    .chipbox2{stroke:rgb(167 139 250)}
  }
</style><style>
  .numw{font-size:18px;font-weight:700;fill:#fff}
  .chipfill{fill:rgb(var(--a))}
  .chipw{font-size:14px;font-weight:700;fill:#fff}
  .cell{fill:rgb(var(--line)/.07)}
  .c1{fill:rgb(var(--p))}.c2{fill:rgb(var(--s))}.c3{fill:rgb(var(--a))}
  .hl{fill:rgb(var(--a)/.07);stroke:rgb(var(--a));stroke-width:1.5}
  .dash{stroke:rgb(var(--line)/.4);stroke-width:2;stroke-dasharray:6 5;fill:none}
  .pa{stroke:rgb(var(--a));stroke-width:3;fill:none}
  .pah{fill:rgb(var(--a))}
  .bold-p{font-size:14.5px;font-weight:700;fill:rgb(var(--a))}
  @media (prefers-color-scheme: dark){
    .bold-p{fill:rgb(167 139 250)}.pa{stroke:rgb(167 139 250)}.pah{fill:rgb(167 139 250)}.c3{fill:rgb(167 139 250)}
    .hl{stroke:rgb(167 139 250)}.chipfill{fill:rgb(109 40 217)}
  }
</style><rect class="bg" width="1200" height="740"/>
<text class="title" x="60" y="78" text-anchor="start">Ước tính minh họa: chi phí thời gian của vận hành thủ công</text>
<text class="subtitle" x="60" y="110" text-anchor="start">Doanh nghiệp thực phẩm 100 nhân viên, Cấp độ 2: tài liệu số nhưng rải rác, chủ yếu dùng Excel và email</text>
<rect class="chipbox" x="60" y="128" width="424" height="28" rx="14"/><text class="chip chiptx" x="73" y="147">SỐ LIỆU MINH HỌA GIẢ ĐỊNH, KHÔNG PHẢI THỐNG KÊ</text>
<line class="axis" x1="600.0" y1="188" x2="600.0" y2="504"/>
<text class="tiny" x="600.0" y="522" text-anchor="middle">0</text>
<line class="axis" x1="715.0" y1="188" x2="715.0" y2="504"/>
<text class="tiny" x="715.0" y="522" text-anchor="middle">30</text>
<line class="axis" x1="830.0" y1="188" x2="830.0" y2="504"/>
<text class="tiny" x="830.0" y="522" text-anchor="middle">60</text>
<line class="axis" x1="945.0" y1="188" x2="945.0" y2="504"/>
<text class="tiny" x="945.0" y="522" text-anchor="middle">90</text>
<line class="axis" x1="1060.0" y1="188" x2="1060.0" y2="504"/>
<text class="tiny" x="1060.0" y="522" text-anchor="middle">120</text>
<text class="tiny" x="600" y="180" text-anchor="start">triệu đồng / năm</text>
<text class="term" x="60" y="220" text-anchor="start">Tổng hợp báo cáo</text>
<text class="desc" x="60" y="242" text-anchor="start">3 nhân viên × 3 giờ/tuần × 48 tuần = 432 giờ</text>
<rect class="trk" x="600" y="210" width="460" height="26" rx="6"/>
<rect class="blue" x="715.0" y="210" width="76.7" height="26" rx="6"/>
<text class="val" x="801.6666666666667" y="229" text-anchor="start">30–50</text>
<text class="term" x="60" y="298" text-anchor="start">Tìm kiếm và chờ thông tin</text>
<text class="desc" x="60" y="320" text-anchor="start">20 phút/người/ngày × 30 nhân viên văn phòng × 250 ngày = 2.500 giờ</text>
<rect class="trk" x="600" y="288" width="460" height="26" rx="6"/>
<rect class="blue" x="830.0" y="288" width="153.3" height="26" rx="6"/>
<text class="val" x="993.3333333333334" y="307" text-anchor="start">60–100</text>
<text class="term" x="60" y="376" text-anchor="start">Chuẩn bị audit (2 audit/năm)</text>
<text class="desc" x="60" y="398" text-anchor="start">4 nhân viên × 2 tuần × 2 audit = 640 giờ</text>
<rect class="trk" x="600" y="366" width="460" height="26" rx="6"/>
<rect class="blue" x="753.3" y="366" width="76.7" height="26" rx="6"/>
<text class="val" x="840.0" y="385" text-anchor="start">40–60</text>
<text class="term" x="60" y="454" text-anchor="start">Nhập liệu trùng lặp</text>
<text class="desc" x="60" y="476" text-anchor="start">15 phút/người/ngày × 15 nhân viên</text>
<rect class="trk" x="600" y="444" width="460" height="26" rx="6"/>
<rect class="blue" x="676.7" y="444" width="57.5" height="26" rx="6"/>
<text class="val" x="744.1666666666667" y="463" text-anchor="start">20–35</text>
<rect class="final" x="60" y="548" width="1080" height="64" rx="12"/>
<text class="finaltx" x="600" y="588" text-anchor="middle">Tổng chi phí thời gian ước tính: 150–245 triệu đồng/năm</text>
<rect class="need" x="60" y="624" width="1080" height="44" rx="12"/>
<text class="body" x="600" y="651" text-anchor="middle">Chưa gồm: chi phí sai sót, xử lý non-conformance phát sinh từ vận hành thủ công, chi phí cơ hội của quyết định chậm.</text>
<text class="foot" x="60" y="716" text-anchor="start">okelas.com</text>
<text class="foot" x="1140" y="716" text-anchor="end">Số liệu minh họa giả định, không phải thống kê hay benchmark.</text>
</svg>
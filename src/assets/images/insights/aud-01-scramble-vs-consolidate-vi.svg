<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="So sánh chuẩn bị audit kiểu chạy đua, với năm việc phát sinh khi audit đến gần, và chuẩn bị là tổng hợp khi bằng chứng, tài liệu và hồ sơ đã được ghi nhận và duy trì thường xuyên." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Audit không nên là sự kiện khẩn cấp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chuẩn bị audit nên là tổng hợp những gì đã có, không phải thu thập từ đầu.</text><line x1="60.0" y1="596.0" x2="1140.0" y2="596.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="618.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="659.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="376.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn bị theo kiểu chạy đua</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Công việc mới phát sinh khi audit đến gần</text><rect x="84.0" y="220.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="249.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tìm hồ sơ kiểm tra từ các tháng trước</text><rect x="84.0" y="276.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="305.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xác nhận hồ sơ nào còn thiếu</text><rect x="84.0" y="332.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="361.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hỏi từng bộ phận để thu thập bằng chứng</text><rect x="84.0" y="388.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cập nhật tài liệu chưa được cập nhật đúng hạn</text><rect x="84.0" y="444.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="473.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Lập danh sách cần hoàn thiện trước ngày audit</text><rect x="612.0" y="134.0" width="528.0" height="376.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn bị là tổng hợp</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Bằng chứng đã có sẵn từ vận hành bình thường</text><rect x="636.0" y="220.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="246.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng được ghi nhận đúng cách khi vận hành</text><text x="652.0" y="279.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">Chuẩn bị là tổng hợp, không phải thu thập</text><rect x="636.0" y="314.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="340.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu được cập nhật thường xuyên</text><text x="652.0" y="373.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">Không cần đợt chạy đua cập nhật trước audit</text><rect x="636.0" y="408.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="434.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Hồ sơ có cấu trúc, dễ tìm</text><text x="652.0" y="467.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">Không cần huy động nhiều người tìm thủ công</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Audit không nên tạo ra công việc mới. Nó chỉ nên tổng hợp những gì đã được ghi nhận.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four auditor competence cards in a row, with a note box below about ISO 19011." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Auditor competence: objective, process-literate, open</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Auditors need to understand the system to find real gaps; the article cites ISO 19011.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Competence requirements per clause 7.2 and the article; ISO 19011 is non-mandatory guidance.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><circle cx="90.0" cy="204.0" r="15" fill="var(--p)"/><text x="90.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="257.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Objective</text><text x="80.0" y="305.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Does not audit their</text><text x="80.0" y="325.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">own work.</text><rect x="335.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="365.0" cy="204.0" r="15" fill="var(--gm)"/><text x="365.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="257.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Knows the process</text><text x="355.0" y="305.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Understands enough to see</text><text x="355.0" y="325.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">real gaps.</text><rect x="610.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="640.0" cy="204.0" r="15" fill="var(--gm)"/><text x="640.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="257.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Asks open questions</text><text x="630.0" y="305.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Asks to understand the</text><text x="630.0" y="325.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">system, not to catch errors.</text><rect x="885.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="915.0" cy="204.0" r="15" fill="var(--gm)"/><text x="915.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="905.0" y="257.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Writes clear findings</text><text x="905.0" y="305.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">States the requirement,</text><text x="905.0" y="325.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">evidence and reasoning.</text><rect x="60.0" y="370.0" width="1080.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="406.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">ISO 19011 is non-mandatory guidance, not a requirement.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A good auditor understands the system, not just finds the most errors.</text></svg>
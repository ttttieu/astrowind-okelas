<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Bảy thẻ dấu hiệu xếp thành hai cột, mỗi thẻ có một dấu hiệu hình thức của audit." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bảy dấu hiệu cho thấy audit đã thành hình thức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bài viết nêu bảy dấu hiệu thường gặp; đây là quan sát chung, không phải số liệu đo.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bảy dấu hiệu theo bài viết, diễn đạt lại; bài không đưa số đo.</text><text x="60.0" y="589.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="190.0" r="15" fill="var(--p)"/><text x="94.0" y="195.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="193.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Báo trước lịch audit</text><rect x="60.0" y="232.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="262.0" r="15" fill="var(--gm)"/><text x="94.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="126.0" y="265.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đi theo checklist từng điều khoản</text><rect x="60.0" y="304.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="334.0" r="15" fill="var(--gm)"/><text x="94.0" y="339.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="337.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ xem tài liệu</text><rect x="60.0" y="376.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="406.0" r="15" fill="var(--gm)"/><text x="94.0" y="411.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="126.0" y="409.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Mọi quy trình được đối xử như nhau</text><rect x="612.0" y="160.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="190.0" r="15" fill="var(--gm)"/><text x="646.0" y="195.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="678.0" y="193.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ có phát hiện nhỏ</text><rect x="612.0" y="232.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="262.0" r="15" fill="var(--gm)"/><text x="646.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="678.0" y="265.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Auditor thiếu hiểu biết quy trình</text><rect x="612.0" y="304.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="334.0" r="15" fill="var(--gm)"/><text x="646.0" y="339.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="678.0" y="337.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Kết quả không dẫn đến đâu</text><rect x="60.0" y="456.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hình thức xuất hiện khi kết quả audit không dẫn đến thay đổi nào.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Hai thẻ đối chiếu: tuần dọn dẹp bên trái, ngày thường bên phải; bên dưới là một thanh kết luận." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Audit nội bộ đo hệ thống chạy thật, không đo hồ sơ đẹp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Audit nên cho thấy hệ thống chạy thế nào mỗi ngày, không phải lúc được chuẩn bị.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bối cảnh theo bài viết; kết luận về hai cách làm là diễn giải của OKELAS.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Tuần dọn dẹp</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Hồ sơ được sắp lại và câu trả lời được luyện</text><text x="88.0" y="283.0" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">trước audit.</text><rect x="612.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Ngày thường</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống vận hành ra sao khi không ai chuẩn bị riêng.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Audit đo hệ thống đang chạy, không đo độ đẹp của hồ sơ.</text></svg>
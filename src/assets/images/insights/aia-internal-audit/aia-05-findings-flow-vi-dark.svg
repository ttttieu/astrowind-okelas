<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Bốn hộp nối bằng mũi tên: phát hiện audit, nonconformance và CAPA, xem xét lãnh đạo, xu hướng nhiều năm; bên dưới là khung điều khoản và khung dấu hiệu thiết kế." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phát hiện audit phải dẫn đến hành động và xem xét</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giá trị của audit nằm ở những gì xảy ra sau khi phát hiện được ghi nhận.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Đường đi của phát hiện theo điều khoản 10.2, 9.3 và bài viết; sơ đồ là của OKELAS.</text><text x="60.0" y="663.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="226.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Phát hiện audit</text><line x1="306.0" y1="220.0" x2="324.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="334.0,220.0 324.0,225.5 324.0,214.5" fill="var(--gm)"/><rect x="340.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="460.0" y="215.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Nonconformance</text><text x="460.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">và CAPA</text><line x1="586.0" y1="220.0" x2="604.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="614.0,220.0 604.0,225.5 604.0,214.5" fill="var(--gm)"/><rect x="620.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="740.0" y="226.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Xem xét lãnh đạo</text><line x1="866.0" y1="220.0" x2="884.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="894.0,220.0 884.0,225.5 884.0,214.5" fill="var(--gm)"/><rect x="900.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="1020.0" y="226.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Xu hướng nhiều năm</text><rect x="60.0" y="300.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="334.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Điều khoản 10.2 xử lý hành động; 9.3 đưa kết quả vào xem xét của lãnh đạo.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Ba câu trả lời “không” hoặc “không chắc” trở lên: vấn đề nằm ở thiết kế chương trình.</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phát hiện lặp lại là dấu hiệu nguyên nhân gốc chưa được tìm ra.</text></svg>
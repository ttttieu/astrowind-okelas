<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Thanh bốn tầng Read, Request, Recommend, Execute có một dấu ngưỡng giữa Recommend và Execute; bên dưới là ba thẻ bài học." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba bài học: định ngưỡng trước, bảo vệ trước, rà soát</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một ví dụ về ngưỡng và ba bài học doanh nghiệp rút ra từ frontier.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ ngưỡng và ba bài học theo bài viết; vị trí ngưỡng trên thanh là minh họa của OKELAS.</text><text x="60.0" y="589.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="180.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="187.5" y="221.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Read</text><line x1="318.0" y1="215.0" x2="317.0" y2="215.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="326.0,215.0 317.0,219.9 317.0,210.1" fill="var(--gm)"/><rect x="330.0" y="180.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="457.5" y="221.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Request</text><line x1="588.0" y1="215.0" x2="587.0" y2="215.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="596.0,215.0 587.0,219.9 587.0,210.1" fill="var(--gm)"/><rect x="600.0" y="180.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="727.5" y="221.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Recommend</text><line x1="858.0" y1="215.0" x2="857.0" y2="215.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="866.0,215.0 857.0,219.9 857.0,210.1" fill="var(--gm)"/><rect x="870.0" y="180.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="997.5" y="221.9" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">Execute</text><line x1="862.0" y1="160.0" x2="862.0" y2="270.0" stroke="var(--a)" stroke-width="3" stroke-dasharray="6 5"/><text x="862.0" y="301.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Ngưỡng: kích hoạt rà soát bổ sung</text><rect x="60.0" y="340.0" width="336.0" height="74.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="96.0" cy="377.0" r="15" fill="var(--gm)"/><text x="96.0" y="382.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="373.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Định ngưỡng trước</text><rect x="432.0" y="340.0" width="336.0" height="74.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="468.0" cy="377.0" r="15" fill="var(--p)"/><text x="468.0" y="382.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="498.0" y="373.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Có biện pháp trước khi</text><text x="498.0" y="396.6" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">triển khai</text><rect x="804.0" y="340.0" width="336.0" height="74.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="840.0" cy="377.0" r="15" fill="var(--gm)"/><text x="840.0" y="382.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="870.0" y="373.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Rà soát chính sách định kỳ</text><rect x="60.0" y="456.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Định nghĩa ngưỡng trước, không phải sau sự cố.</text></svg>
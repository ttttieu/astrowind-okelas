<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Bảng ba hàng: Anthropic, OpenAI, Google DeepMind, với cơ chế ngưỡng và ngày công bố lần đầu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="552" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba phòng thí nghiệm, ba cách gọi ngưỡng, một nguyên tắc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba khung chính sách công bố công khai, đặt cạnh nhau.</text><line x1="60.0" y1="468.0" x2="1140.0" y2="468.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="490.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tên ngưỡng và ngày công bố theo bài viết; cần đối chiếu với tài liệu gốc của từng hãng trước khi đăng.</text><text x="60.0" y="531.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Phòng thí nghiệm</text><text x="380.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Cơ chế ngưỡng</text><text x="790.0" y="152.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Công bố lần đầu</text><rect x="60.0" y="170.0" width="300.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="206.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Anthropic</text><rect x="380.0" y="170.0" width="390.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="400.0" y="197.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Responsible Scaling Policy · AI Safety</text><text x="400.0" y="217.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Levels (ASL)</text><rect x="790.0" y="170.0" width="350.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="814.0" y="206.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">09/2023</text><rect x="60.0" y="242.0" width="300.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="278.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">OpenAI</text><rect x="380.0" y="242.0" width="390.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="400.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Preparedness Framework · ngưỡng High</text><text x="400.0" y="289.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">và Critical</text><rect x="790.0" y="242.0" width="350.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="814.0" y="278.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">12/2023</text><rect x="60.0" y="314.0" width="300.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="350.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Google DeepMind</text><rect x="380.0" y="314.0" width="390.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="400.0" y="341.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Frontier Safety Framework · Critical</text><text x="400.0" y="361.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Capability Levels</text><rect x="790.0" y="314.0" width="350.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="814.0" y="350.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">05/2024</text><rect x="60.0" y="398.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="431.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ba hãng gọi ngưỡng khác nhau, nhưng cùng một nguyên tắc.</text></svg>
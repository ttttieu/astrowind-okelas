<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Bốn dấu hiệu workflow đã số hóa nhưng chưa được thiết kế lại; từ hai dấu hiệu trở lên thì vấn đề nhiều khả năng nằm ở thiết kế quy trình." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="572" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn dấu hiệu: số hóa xong nhưng chưa thiết kế lại</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đánh dấu những gì doanh nghiệp bạn đang gặp.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ngưỡng và cách phân loại trong hình là gợi ý của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="132.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="98.0" cy="194.0" r="18" fill="var(--p)"/><text x="98.0" y="200.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="189.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Một yêu cầu bị kẹt, không ai biết chắc nó ở bước nào cho</text><text x="130.0" y="210.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">tới khi hỏi người phụ trách.</text><rect x="610.0" y="132.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="648.0" cy="194.0" r="18" fill="var(--p)"/><text x="648.0" y="200.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="680.0" y="189.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ngoại lệ luôn được xử lý ngoài hệ thống, dù</text><text x="680.0" y="210.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">workflow vẫn đang chạy.</text><rect x="60.0" y="274.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="98.0" cy="336.0" r="18" fill="var(--p)"/><text x="98.0" y="342.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="331.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Có người đóng vai “người nhắc việc” không chính thức;</text><text x="130.0" y="352.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">họ nghỉ phép thì mọi thứ chậm hẳn.</text><rect x="610.0" y="274.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="648.0" cy="336.0" r="18" fill="var(--p)"/><text x="648.0" y="342.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="680.0" y="320.7" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Số bước phê duyệt trên phần mềm giống hệt số bước</text><text x="680.0" y="341.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">ký tay trước đây, không bước nào được gộp, bỏ hay chạy</text><text x="680.0" y="362.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">song song.</text><rect x="60.0" y="422.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="453.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ hai dấu hiệu trở lên: vấn đề nhiều khả năng nằm ở cách quy trình được thiết kế, không phải ở việc đổi phần</text><text x="600.0" y="477.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">mềm workflow.</text></svg>
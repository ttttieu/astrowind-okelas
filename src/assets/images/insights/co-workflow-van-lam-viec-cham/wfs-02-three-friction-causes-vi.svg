<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Ba lý do workflow đã số hóa vẫn chậm: các bước tuần tự dù có thể song song, người duyệt thiếu ngữ cảnh, và ngoại lệ rơi về gọi điện, nhắn tin, email riêng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba lý do workflow đã số hóa vẫn tạo friction</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không phải lỗi của một phần mềm cụ thể, mà là hệ quả của cách quy trình được số hóa.</text><line x1="60.0" y1="568.0" x2="1140.0" y2="568.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="590.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="98.0" cy="168.0" r="17" fill="var(--a)"/><text x="98.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text><text x="126.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tuần tự dù có thể song song</text><text x="82.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Các bước xếp nối tiếp vì đó là cách làm</text><text x="82.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trên giấy, không phải vì nghiệp vụ</text><text x="82.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">đòi hỏi. Khi số hóa, thói quen này thường</text><text x="82.0" y="447.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">được giữ nguyên.</text><rect x="74.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><text x="82.0" y="228.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Hiện tại</text><rect x="82.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="110.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">A</text><line x1="141.0" y1="251.0" x2="157.0" y2="251.0" stroke="var(--gm)" stroke-width="2"/><polygon points="165.0,251.0 157.0,255.4 157.0,246.6" fill="var(--gm)"/><rect x="168.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="196.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">B</text><line x1="227.0" y1="251.0" x2="243.0" y2="251.0" stroke="var(--gm)" stroke-width="2"/><polygon points="251.0,251.0 243.0,255.4 243.0,246.6" fill="var(--gm)"/><rect x="254.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="282.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">C</text><text x="82.0" y="288.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Khi nghiệp vụ cho phép</text><rect x="82.0" y="308.0" width="56.0" height="30.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="110.0" y="327.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">A</text><rect x="168.0" y="294.0" width="56.0" height="26.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="196.0" y="311.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">B</text><rect x="168.0" y="324.0" width="56.0" height="26.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="196.0" y="341.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">C</text><line x1="141.0" y1="317.0" x2="157.6" y2="310.1" stroke="var(--p)" stroke-width="2"/><polygon points="165.0,307.0 159.3,314.1 155.9,306.0" fill="var(--p)"/><line x1="141.0" y1="325.0" x2="157.8" y2="333.4" stroke="var(--p)" stroke-width="2"/><polygon points="165.0,337.0 155.9,337.4 159.8,329.5" fill="var(--p)"/><rect x="427.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="465.0" cy="168.0" r="17" fill="var(--a)"/><text x="465.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text><text x="493.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Không mang theo ngữ cảnh</text><text x="449.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người duyệt bước 3 chỉ thấy form</text><text x="449.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">đã điền. Họ phải hỏi lại, chờ giải thích,</text><text x="449.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc duyệt qua loa vì thiếu thông tin.</text><rect x="441.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><rect x="449.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="477.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">1</text><line x1="508.0" y1="241.0" x2="524.0" y2="241.0" stroke="var(--gm)" stroke-width="2"/><polygon points="532.0,241.0 524.0,245.4 524.0,236.6" fill="var(--gm)"/><rect x="535.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="563.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">2</text><line x1="594.0" y1="241.0" x2="610.0" y2="241.0" stroke="var(--gm)" stroke-width="2"/><polygon points="618.0,241.0 610.0,245.4 610.0,236.6" fill="var(--gm)"/><rect x="621.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="649.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">3</text><rect x="449.0" y="276.0" width="142.0" height="54.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4" stroke-dasharray="4 4"/><text x="520.0" y="307.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Lý do bước 1, 2 bị ẩn</text><rect x="621.0" y="276.0" width="120.0" height="54.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="681.0" y="299.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Chỉ thấy</text><text x="681.0" y="315.3" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">form đã điền</text><line x1="477.0" y1="260.0" x2="477.0" y2="276.0" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="563.0" y1="260.0" x2="563.0" y2="276.0" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="651.0" y1="260.0" x2="651.0" y2="269.0" stroke="var(--p)" stroke-width="2"/><polygon points="651.0,276.0 647.1,269.0 654.9,269.0" fill="var(--p)"/><rect x="794.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="832.0" cy="168.0" r="17" fill="var(--a)"/><text x="832.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text><text x="860.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ngoại lệ không có đường đi</text><text x="816.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow được thiết kế cho ca chuẩn.</text><text x="816.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nhà cung cấp mới hay khoản chi vượt</text><text x="816.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hạn mức khiến mọi thứ rơi về kênh</text><text x="816.0" y="447.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không chính thức.</text><rect x="808.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><rect x="816.0" y="220.0" width="92.0" height="34.0" rx="8" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="862.0" y="241.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Ngoại lệ</text><line x1="912.0" y1="237.0" x2="958.0" y2="237.0" stroke="var(--gm)" stroke-width="2"/><polygon points="966.0,237.0 958.0,241.4 958.0,232.6" fill="var(--gm)"/><text x="939.0" y="231.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">×</text><rect x="970.0" y="220.0" width="92.0" height="34.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="1016.0" y="241.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="middle">Hệ thống</text><rect x="816.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="861.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Gọi điện</text><line x1="862.0" y1="258.0" x2="861.2" y2="289.0" stroke="var(--a)" stroke-width="1.8"/><polygon points="861.0,296.0 857.3,288.9 865.0,289.1" fill="var(--a)"/><rect x="914.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="959.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Nhắn tin</text><line x1="862.0" y1="258.0" x2="952.5" y2="293.4" stroke="var(--a)" stroke-width="1.8"/><polygon points="959.0,296.0 951.1,297.0 953.9,289.9" fill="var(--a)"/><rect x="1012.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="1057.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Email riêng</text><line x1="862.0" y1="258.0" x2="1050.1" y2="294.7" stroke="var(--a)" stroke-width="1.8"/><polygon points="1057.0,296.0 1049.4,298.4 1050.9,290.9" fill="var(--a)"/><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hệ quả của việc số hóa một quy trình mà không thiết kế lại quy trình đó.</text></svg>
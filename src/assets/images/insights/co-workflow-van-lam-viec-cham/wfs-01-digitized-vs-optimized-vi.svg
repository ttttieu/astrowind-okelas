<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Số hóa biến quy trình giấy hoặc email thành form điện tử và chuỗi người ký: quy trình rõ hơn, nhưng vẫn tuần tự và không tự chạy, nên chưa chắc nhanh hơn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="660" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Số hóa làm quy trình rõ hơn, chưa chắc làm nó nhanh hơn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai việc khác nhau: làm cho quy trình rõ ràng, và làm cho nó chạy nhanh.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="330.0" height="64.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="225.0" y="169.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Giấy hoặc email</text><line x1="398.0" y1="164.0" x2="468.0" y2="164.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="478.0,164.0 468.0,169.5 468.0,158.5" fill="var(--a)"/><text x="438.0" y="149.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">số hóa</text><rect x="486.0" y="132.0" width="654.0" height="64.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="813.0" y="169.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Form điện tử và chuỗi người ký trên phần mềm</text><rect x="60.0" y="226.0" width="520.0" height="290.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="84.0" y="269.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Số hóa giải quyết được</text><text x="84.0" y="293.8" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Quy trình rõ ràng hơn</text><text x="84.0" y="355.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không còn thất lạc tài liệu</text><line x1="84.0" y1="382.0" x2="556.0" y2="382.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="419.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không còn chậm vì không ai tìm thấy tài liệu</text><line x1="84.0" y1="446.0" x2="556.0" y2="446.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="483.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Tổng hợp lại được lịch sử phê duyệt</text><rect x="620.0" y="226.0" width="520.0" height="290.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="644.0" y="269.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Số hóa chưa thay đổi</text><text x="644.0" y="293.8" font-size="15" font-weight="700" fill="var(--a)" text-anchor="start">Chưa chắc nhanh hơn</text><text x="644.0" y="355.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Chuỗi bước vẫn tuần tự</text><line x1="644.0" y1="382.0" x2="1116.0" y2="382.0" stroke="var(--line)" stroke-width="1"/><text x="644.0" y="419.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Người sau vẫn phải chờ người trước</text><line x1="644.0" y1="446.0" x2="1116.0" y2="446.0" stroke="var(--line)" stroke-width="1"/><text x="644.0" y="473.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống vẫn không tự biết khi nào cần chạy nếu không có</text><text x="644.0" y="494.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">người bấm nút</text><rect x="60.0" y="534.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="567.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Số hóa không thay đổi bản chất của quy trình.</text></svg>
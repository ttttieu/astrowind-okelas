<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-label="Ba thẻ đánh giá: quy trình, dữ liệu, tri thức và context, mỗi thẻ có một câu hỏi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="544" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba chiều đánh giá hiện trạng trước khi chọn công cụ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điểm bắt đầu thực tế là biết hiện trạng và bước tiếp theo có lợi nhất về kinh tế.</text><line x1="60.0" y1="460.0" x2="1140.0" y2="460.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="482.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba chiều theo bài viết là khung đánh giá thực tiễn, không phải bộ chỉ số đo lường.</text><text x="60.0" y="523.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="90.0" cy="206.0" r="15" fill="var(--gm)"/><text x="90.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình</text><text x="84.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bao nhiêu quy trình quan trọng đã</text><text x="84.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">được viết thành văn bản? AI không</text><text x="84.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thể thực thi một quy trình chưa được</text><text x="84.0" y="314.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">định nghĩa.</text><rect x="426.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="456.0" cy="206.0" r="15" fill="var(--p)"/><text x="456.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="486.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu</text><text x="450.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu QC, lô và sản xuất có được lưu</text><text x="450.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">theo cấu trúc truy vấn được, hay còn rời</text><text x="450.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">rạc trong Excel và giấy tờ?</text><rect x="792.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="822.0" cy="206.0" r="15" fill="var(--gm)"/><text x="822.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="852.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức và context</text><text x="816.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ai đang giữ tri thức vận hành quan</text><text x="816.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trọng? Nếu hai, ba người nghỉ, vận hành</text><text x="816.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có tiếp tục được không?</text><rect x="60.0" y="389.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="422.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ba chiều này là cách đặt câu hỏi trước khi chọn công cụ, không phải thứ tự để tự chấm điểm.</text></svg>
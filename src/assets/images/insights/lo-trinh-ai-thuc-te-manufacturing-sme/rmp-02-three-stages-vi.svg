<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Ba cột giai đoạn: nền tảng, AI hỗ trợ có kiểm soát, AI trong workflow; giai đoạn ba được vẽ nét đứt vì chỉ dùng khi cần." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba giai đoạn: nền tảng, hỗ trợ, rồi mới đến workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không phải doanh nghiệp nào cũng cần giai đoạn 3; mục tiêu là giai đoạn có giá trị nhất cho chính mình.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba giai đoạn là khung thực tiễn từ bài viết; thời gian chỉ là tham khảo, không phải cam kết.</text><text x="60.0" y="585.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Giai đoạn 1 · Foundation</text><text x="84.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Mục tiêu: xây nền tảng để AI hoạt động</text><text x="84.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có nghĩa.</text><text x="84.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: công cụ năng suất cá nhân, không</text><text x="84.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tham gia quyết định.</text><text x="84.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thời gian tham khảo: 3–6 tháng.</text><line x1="404.0" y1="292.0" x2="418.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="426.0,292.0 418.0,296.4 418.0,287.6" fill="var(--p)"/><rect x="430.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="454.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Giai đoạn 2 · AI hỗ trợ có kiểm soát</text><text x="454.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Mục tiêu: đưa AI vào ứng dụng rủi ro</text><text x="454.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thấp, đo lường được.</text><text x="454.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: chatbot nội bộ trên SOP; không có</text><text x="454.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">agent trong quy trình.</text><text x="454.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thời gian: 3–6 tháng vận hành thực tế.</text><line x1="774.0" y1="292.0" x2="788.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,292.0 788.0,296.4 788.0,287.6" fill="var(--p)"/><rect x="800.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--gt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="824.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Giai đoạn 3 · AI trong workflow</text><text x="824.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Mục tiêu: tích hợp AI vào các bước có</text><text x="824.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">giá trị cao và đủ điều kiện.</text><text x="824.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: agent trong một workflow cụ thể, có</text><text x="824.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">human review và audit trail.</text><text x="824.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ khi giai đoạn 2 cho thấy khoảng</text><text x="824.0" y="378.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trống giá trị cụ thể.</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giai đoạn sau chỉ có ý nghĩa khi giai đoạn trước đã đạt tiêu chí chuyển.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Ba điều kiện có ô đánh dấu: dữ liệu có cấu trúc từ hệ thống quan trọng, quy trình đủ chi tiết, governance cho agent đã rõ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba điều kiện trước khi đưa agent vào workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Agent chỉ đưa vào khi cả ba điều kiện này đã được đáp ứng.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều kiện theo bài viết; mỗi doanh nghiệp cần kiểm tra theo hoàn cảnh của mình.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="1080.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="87.0" y="201.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="214.0" x2="99.0" y2="219.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="219.0" x2="107.0" y2="208.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="220.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu từ ít nhất một hệ thống quan trọng (ERP, QMS) đủ cấu trúc để truy vấn và phân tích.</text><rect x="60.0" y="266.0" width="1080.0" height="76.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="87.0" y="291.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="304.0" x2="99.0" y2="309.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="309.0" x2="107.0" y2="298.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="310.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Ít nhất một quy trình được định nghĩa đủ chi tiết để agent tham gia một bước cụ thể.</text><rect x="60.0" y="356.0" width="1080.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="87.0" y="381.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="394.0" x2="99.0" y2="399.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="399.0" x2="107.0" y2="388.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="400.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Governance cho agent đã rõ: được làm gì, ai review, audit trail thế nào.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây là điều kiện để vào giai đoạn 3, không phải danh sách việc cần làm song song.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 596" width="1200" height="596" role="img" aria-label="Ba cột theo mốc tháng: nền tảng, AI hỗ trợ, đánh giá; mỗi cột có ba việc cần làm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="596" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lộ trình minh họa trong 12 tháng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống tổng hợp cho doanh nghiệp chế biến thực phẩm 120 người, không phải case study.</text><line x1="60.0" y1="512.0" x2="1140.0" y2="512.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="534.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Kịch bản và kết quả sau 9 tháng là minh họa tổng hợp, không phải số liệu đo lường hay cam kết hiệu quả.</text><text x="60.0" y="575.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="48.0" rx="12" fill="var(--p)"/><text x="230.0" y="205.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">Tháng 1–3 · Nền tảng</text><rect x="60.0" y="232.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="80.0" y="268.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Chuẩn hóa dữ liệu QC thành</text><text x="80.0" y="289.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">một schema</text><text x="80.0" y="322.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Tài liệu hóa 5 quy trình rủi ro cao nhất</text><text x="80.0" y="356.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Ghi nhận quy tắc xử lý bất thường từ</text><text x="80.0" y="377.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trưởng ca</text><rect x="430.0" y="176.0" width="340.0" height="48.0" rx="12" fill="var(--p)"/><text x="600.0" y="205.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">Tháng 4–6 · AI hỗ trợ</text><rect x="430.0" y="232.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="450.0" y="268.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Chatbot nội bộ trên SOP đã chuẩn hóa</text><text x="450.0" y="301.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– QA soạn báo cáo kiểm tra với AI hỗ trợ</text><text x="450.0" y="334.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– AI không ra quyết định</text><rect x="800.0" y="176.0" width="340.0" height="48.0" rx="12" fill="var(--p)"/><text x="970.0" y="205.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">Tháng 7–12 · Đánh giá</text><rect x="800.0" y="232.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="820.0" y="268.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Xem chatbot làm tốt và chưa tốt</text><text x="820.0" y="289.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">những gì</text><text x="820.0" y="322.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Quyết định mở rộng kết nối dữ liệu</text><text x="820.0" y="344.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc dùng agent</text><rect x="60.0" y="442.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="475.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chỉ mở rộng khi có dữ liệu từ giai đoạn trước, không mở rộng theo kỳ vọng.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="Ba bước nối nhau từ trái sang phải: giai đoạn một nhận diện và phân loại, giai đoạn hai chuẩn hóa và kết nối, giai đoạn ba tích hợp vào vận hành, kèm loại công cụ thường phù hợp ở mỗi giai đoạn." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="586" fill="#08090A"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba giai đoạn bắt đầu quản trị tri thức</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Đi từ nhận diện đến tích hợp, bằng hệ thống nhỏ nhất đủ dùng.</text><rect x="60.0" y="144.0" width="344.0" height="273.0" rx="16" fill="#14161A" stroke="#2A2F38" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="#9AA6B8" text-anchor="start">GIAI ĐOẠN 1</text><text x="84.0" y="212.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhận diện và phân loại</text><text x="84.0" y="243.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Xác định nguồn tri thức đang có, nằm</text><text x="84.0" y="266.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">ở đâu, ai chịu trách nhiệm và đang gặp</text><text x="84.0" y="289.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">vấn đề gì.</text><line x1="84.0" y1="308" x2="380.0" y2="308" stroke="#2A2F38" stroke-width="1"/><text x="84.0" y="341.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Thường phù hợp: bảng kê nguồn tri thức;</text><text x="84.0" y="363.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">workspace AI hoặc ghi chú liên kết trên</text><text x="84.0" y="385.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">bộ tài liệu đã tuyển chọn.</text><rect x="428.0" y="144.0" width="344.0" height="273.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="#5FA0FF" text-anchor="start">GIAI ĐOẠN 2</text><text x="452.0" y="212.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Chuẩn hóa và kết nối</text><text x="452.0" y="243.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Thiết lập cấu trúc tri thức, quy tắc</text><text x="452.0" y="266.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">kiểm soát tài liệu, quyền truy cập,</text><text x="452.0" y="289.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">trách nhiệm cập nhật và liên kết giữa</text><text x="452.0" y="312.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">ba lớp.</text><line x1="452.0" y1="331" x2="748.0" y2="331" stroke="#2A2F38" stroke-width="1"/><text x="452.0" y="364.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Thường phù hợp: hệ thống quản lý vòng</text><text x="452.0" y="386.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">đời tài liệu, phê duyệt và phân quyền.</text><rect x="796.0" y="144.0" width="344.0" height="273.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="start">GIAI ĐOẠN 3</text><text x="820.0" y="212.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Tích hợp vào vận hành</text><text x="820.0" y="243.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Nối tri thức với workflow, ERP, QMS;</text><text x="820.0" y="266.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">đưa AI vào tìm kiếm, giải thích và phân</text><text x="820.0" y="289.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">tích có bằng chứng truy xuất.</text><line x1="820.0" y1="308" x2="1116.0" y2="308" stroke="#2A2F38" stroke-width="1"/><text x="820.0" y="341.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Thường phù hợp: ERP, QMS, workflow và</text><text x="820.0" y="363.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">nền tảng tri thức có cấu trúc.</text><line x1="407" y1="280" x2="416" y2="280" stroke="#5B6575" stroke-width="3"/><polygon points="428,280 416,273 416,287" fill="#5B6575"/><line x1="775" y1="280" x2="784" y2="280" stroke="#5B6575" stroke-width="3"/><polygon points="796,280 784,273 784,287" fill="#5B6575"/><rect x="60.0" y="445.0" width="1080.0" height="52.0" rx="14" fill="#F7F8F8"/><text x="84.0" y="478.0" font-size="20" font-weight="600" fill="#08090A" text-anchor="start">Bắt đầu từ khoảng trống tạo rủi ro lớn nhất, không phải từ phần mềm.</text><line x1="60" y1="531" x2="1140" y2="531" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="553.0" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Lộ trình là cách tiếp cận để thảo luận, không phải chuẩn ngành.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 653" width="1200" height="653" role="img" aria-label="Ba thẻ xếp ngang: tri thức bên ngoài trả lời bên ngoài yêu cầu gì, tri thức nội bộ trả lời doanh nghiệp quy định thực hiện thế nào, tri thức vận hành trả lời thực tế đã diễn ra những gì." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="653" fill="#08090A"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba lớp tri thức, ba câu hỏi khác nhau</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Mỗi lớp có nguồn gốc, vòng đời và cách kiểm soát riêng.</text><rect x="60.0" y="144.0" width="344.0" height="340.0" rx="16" fill="#14161A" stroke="#2A2F38" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="#9AA6B8" text-anchor="start">LỚP 1</text><text x="84.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">External Knowledge</text><text x="84.0" y="249.0" font-size="19" font-weight="600" fill="#9AA6B8" text-anchor="start">Bên ngoài yêu cầu điều gì?</text><line x1="84.0" y1="296" x2="380.0" y2="296" stroke="#2A2F38" stroke-width="1"/><circle cx="88.0" cy="325" r="3" fill="#9AA6B8"/><text x="102.0" y="330.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Luật, nghị định, thông tư</text><circle cx="88.0" cy="355" r="3" fill="#9AA6B8"/><text x="102.0" y="360.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Tiêu chuẩn: ISO, GMP, HACCP, GxP</text><circle cx="88.0" cy="385" r="3" fill="#9AA6B8"/><text x="102.0" y="390.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Yêu cầu của khách hàng</text><circle cx="88.0" cy="415" r="3" fill="#9AA6B8"/><text x="102.0" y="420.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Thị trường và công nghệ</text><text x="84.0" y="453.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Vai trò: căn cứ và giới hạn.</text><rect x="428.0" y="144.0" width="344.0" height="340.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="#5FA0FF" text-anchor="start">LỚP 2</text><text x="452.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">Internal Knowledge</text><text x="452.0" y="249.0" font-size="19" font-weight="600" fill="#5FA0FF" text-anchor="start">Doanh nghiệp quy định</text><text x="452.0" y="275.0" font-size="19" font-weight="600" fill="#5FA0FF" text-anchor="start">thực hiện thế nào?</text><line x1="452.0" y1="296" x2="748.0" y2="296" stroke="#2A2F38" stroke-width="1"/><circle cx="456.0" cy="325" r="3" fill="#5FA0FF"/><text x="470.0" y="330.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">SOP và hướng dẫn công việc</text><circle cx="456.0" cy="355" r="3" fill="#5FA0FF"/><text x="470.0" y="360.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Chính sách, quy chế, biểu mẫu</text><circle cx="456.0" cy="385" r="3" fill="#5FA0FF"/><text x="470.0" y="390.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Cơ cấu, phân quyền, trách nhiệm</text><circle cx="456.0" cy="415" r="3" fill="#5FA0FF"/><text x="470.0" y="420.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Bài học đã được phê duyệt</text><text x="452.0" y="453.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Vai trò: phương thức, trách nhiệm.</text><rect x="796.0" y="144.0" width="344.0" height="340.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="start">LỚP 3</text><text x="820.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">Operational Knowledge</text><text x="820.0" y="249.0" font-size="19" font-weight="600" fill="#A78BFA" text-anchor="start">Thực tế đã diễn ra những gì?</text><line x1="820.0" y1="296" x2="1116.0" y2="296" stroke="#2A2F38" stroke-width="1"/><circle cx="824.0" cy="325" r="3" fill="#A78BFA"/><text x="838.0" y="330.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Giao dịch và hồ sơ quy trình</text><circle cx="824.0" cy="355" r="3" fill="#A78BFA"/><text x="838.0" y="360.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Kết quả kiểm tra, sai lệch, CAPA</text><circle cx="824.0" cy="385" r="3" fill="#A78BFA"/><text x="838.0" y="390.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Quyết định và căn cứ</text><circle cx="824.0" cy="415" r="3" fill="#A78BFA"/><text x="838.0" y="420.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Sự cố và cách xử lý</text><text x="820.0" y="453.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Vai trò: thực hiện và bằng chứng.</text><rect x="60.0" y="512.0" width="1080.0" height="52.0" rx="14" fill="#F7F8F8"/><text x="84.0" y="545.0" font-size="20" font-weight="600" fill="#08090A" text-anchor="start">Ba bản chất khác nhau: không nên đổ chung vào một kho.</text><line x1="60" y1="598" x2="1140" y2="598" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="620.0" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Ba lớp là cách phân loại của OKELAS, không phải thuật ngữ chuẩn ngành.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Ba hộp nối nhau theo thứ tự yêu cầu bên ngoài, SOP nội bộ, hồ sơ vận hành; một hàng mũi tên đi xuôi cho biết khi yêu cầu đổi thì xét lại SOP và nhân sự, một hàng mũi tên đi ngược cho biết khi có sai lệch thì truy về SOP và căn cứ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Một yêu cầu, ba lớp, truy vết hai chiều</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nối được ba lớp thì tra ngược và tra xuôi đều làm được.</text><text x="60.0" y="136.0" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Ví dụ minh họa giả định, không phải case thực</text><rect x="60.0" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.8"/><text x="84.0" y="202.0" font-size="13" font-weight="600" fill="var(--mut)" text-anchor="start">EXTERNAL</text><text x="84.0" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu bên ngoài</text><text x="84.0" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Quy định hoặc tiêu chuẩn yêu cầu</text><text x="84.0" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm soát một công đoạn sản xuất.</text><rect x="434.7" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="458.7" y="202.0" font-size="13" font-weight="600" fill="var(--s)" text-anchor="start">INTERNAL</text><text x="458.7" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">SOP nội bộ</text><text x="458.7" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Phương pháp kiểm soát, tần suất</text><text x="458.7" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm tra và người chịu trách nhiệm.</text><rect x="809.3" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="833.3" y="202.0" font-size="13" font-weight="600" fill="var(--a)" text-anchor="start">OPERATIONAL</text><text x="833.3" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Hồ sơ vận hành</text><text x="833.3" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả, người thực hiện, thời điểm,</text><text x="833.3" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">sai lệch và cách xử lý.</text><line x1="394" y1="242" x2="422" y2="242" stroke="var(--gm)" stroke-width="3"/><polygon points="434,242 422,235 422,249" fill="var(--gm)"/><line x1="769" y1="242" x2="797" y2="242" stroke="var(--gm)" stroke-width="3"/><polygon points="809,242 797,235 797,249" fill="var(--gm)"/><line x1="80" y1="353" x2="1108" y2="353" stroke="var(--p)" stroke-width="3"/><polygon points="1120,353 1108,346 1108,360" fill="var(--p)"/><text x="80.0" y="381.0" font-size="17" font-weight="600" fill="var(--s)" text-anchor="start">Truy vết xuôi: khi yêu cầu đổi, xét lại SOP, bộ phận và nhân sự bị ảnh hưởng</text><line x1="1120" y1="415" x2="92" y2="415" stroke="var(--a)" stroke-width="3"/><polygon points="80,415 92,408 92,422" fill="var(--a)"/><text x="1120.0" y="443.0" font-size="17" font-weight="600" fill="var(--a)" text-anchor="end">Truy vết ngược: khi có sai lệch, truy về SOP và căn cứ bên ngoài</text><rect x="60.0" y="483.0" width="1080.0" height="52.0" rx="14" fill="var(--ink)"/><text x="84.0" y="516.0" font-size="20" font-weight="600" fill="var(--onink)" text-anchor="start">Mối nối giữa các lớp mới là nơi tạo ra giá trị của quản trị tri thức.</text><line x1="60" y1="569" x2="1140" y2="569" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="591.0" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ minh họa giả định, không phải case thực. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text></svg>
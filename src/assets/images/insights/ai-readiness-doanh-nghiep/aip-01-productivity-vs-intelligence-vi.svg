<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 688" width="1200" height="688" role="img" aria-label="AI productivity là cá nhân làm việc nhanh hơn ở từng tác vụ; organizational intelligence là năng lực của tổ chức: quyết định đúng, thực thi nhất quán, học hỏi, phát hiện sớm và giải thích được quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="688" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity không phải organizational intelligence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai khái niệm thường bị gộp làm một, nhưng tạo ra hai kết quả khác nhau.</text><line x1="60.0" y1="604.0" x2="1140.0" y2="604.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="626.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Thanh cuối là quan điểm của OKELAS.</text><text x="60.0" y="667.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="384.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cá nhân làm việc nhanh hơn ở từng tác vụ</text><rect x="84.0" y="238.0" width="480.0" height="80.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="283.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Soạn email, tóm tắt, viết báo cáo nhanh hơn</text><rect x="84.0" y="328.0" width="480.0" height="80.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giá trị thực, đo ở cấp cá nhân</text><rect x="84.0" y="418.0" width="480.0" height="80.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="463.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không tự động thay đổi cách tổ chức vận hành</text><rect x="612.0" y="134.0" width="528.0" height="384.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational intelligence</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Năng lực của tổ chức, không phụ thuộc ai làm</text><rect x="636.0" y="238.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="265.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ra quyết định từ thông tin đúng, đủ, kịp thời</text><rect x="636.0" y="292.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="319.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thực thi quy trình nhất quán dù ai làm</text><rect x="636.0" y="346.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Học từ sự kiện và kinh nghiệm</text><rect x="636.0" y="400.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="427.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phát hiện vấn đề trước khi thành sự cố</text><rect x="636.0" y="454.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="481.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giải thích được vì sao quyết định được đưa ra</text><rect x="60.0" y="534.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="567.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quan điểm của OKELAS: giá trị đến khi thông tin trở thành process, decision và action.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Ba giai đoạn AI readiness: AI productivity cho cá nhân, AI với context tổ chức, AI trong workflow vận hành; mỗi giai đoạn có điều kiện cần, giá trị và rủi ro riêng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba giai đoạn trong hành trình AI readiness</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI readiness không phải trạng thái nhị phân mà là một quá trình tiến dần.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba giai đoạn là khung phân tích của OKELAS, tách biệt với 5 cấp độ số hóa; là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="188.9" width="352.0" height="233.3" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="76.0" y="218.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Giai đoạn 1</text><text x="76.0" y="244.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity (cá nhân)</text><text x="76.0" y="274.7" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Cần</text><text x="76.0" y="292.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tối thiểu: một tài khoản AI.</text><text x="76.0" y="319.2" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Giá trị</text><text x="76.0" y="336.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tiết kiệm thời gian cho từng cá nhân.</text><text x="76.0" y="363.7" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Rủi ro</text><text x="76.0" y="381.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu dừng ở đây, AI chỉ là công cụ tốc độ, chưa tạo</text><text x="76.0" y="399.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">giá trị cho tổ chức.</text><rect x="424.0" y="152.0" width="352.0" height="270.2" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="440.0" y="181.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Giai đoạn 2</text><text x="440.0" y="207.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI với context tổ chức</text><text x="440.0" y="237.8" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Cần</text><text x="440.0" y="255.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu được tổ chức tốt, có hệ thống lưu trữ, AI</text><text x="440.0" y="273.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cấu hình theo context doanh nghiệp.</text><text x="440.0" y="300.7" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Giá trị</text><text x="440.0" y="318.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Giảm thời gian tìm kiếm, bớt phụ thuộc vào người</text><text x="440.0" y="336.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cụ thể cho câu hỏi thông thường.</text><text x="440.0" y="363.7" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Rủi ro</text><text x="440.0" y="381.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu lỗi thời thì câu trả lời lỗi thời. Không có</text><text x="440.0" y="399.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">evidence, không có auditability.</text><rect x="788.0" y="134.0" width="352.0" height="288.2" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="804.0" y="163.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Giai đoạn 3</text><text x="804.0" y="189.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI trong workflow vận hành</text><text x="804.0" y="219.8" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Cần</text><text x="804.0" y="237.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình rõ, dữ liệu có cấu trúc, governance,</text><text x="804.0" y="255.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tích hợp hệ thống, organizational context.</text><text x="804.0" y="282.7" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Giá trị</text><text x="804.0" y="300.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không phải AI nhanh hơn, mà là</text><text x="804.0" y="318.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tổ chức thông minh hơn.</text><text x="804.0" y="345.7" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Ý nghĩa</text><text x="804.0" y="363.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Giai đoạn tạo ra khác biệt về cạnh tranh.</text><rect x="60.0" y="438.2" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI readiness không phải đúng hoặc sai. Đó là một hành trình tiến dần.</text></svg>
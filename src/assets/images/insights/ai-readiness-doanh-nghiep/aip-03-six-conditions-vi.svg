<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Sáu điều kiện để AI có ích trong vận hành: dữ liệu có cấu trúc, quy trình rõ, tri thức tổ chức được cấu trúc hóa, governance và phân quyền, tích hợp hệ thống, organizational context." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="608" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu điều kiện để AI có ích trong vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích ở góc độ tổ chức và quản trị, không phải danh sách tính năng phần mềm.</text><line x1="60.0" y1="524.0" x2="1140.0" y2="524.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="546.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu điều kiện là khung phân tích của OKELAS, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="587.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu có cấu trúc</text><text x="80.0" y="215.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Excel rời rạc, không có trường chuẩn: AI</text><text x="80.0" y="234.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không phân tích được xu hướng theo dây</text><text x="80.0" y="254.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chuyền hay theo ca.</text><rect x="424.0" y="134.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="458.0" cy="170.0" r="15" fill="var(--p)"/><text x="458.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="484.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình được định nghĩa rõ</text><text x="444.0" y="215.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ai làm gì, bước nào cần bằng chứng,</text><text x="444.0" y="234.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ai phê duyệt. Nếu quy trình nằm trong</text><text x="444.0" y="254.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đầu người, AI phụ thuộc vào họ.</text><rect x="788.0" y="134.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="170.0" r="15" fill="var(--p)"/><text x="822.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="848.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức tổ chức có cấu trúc</text><text x="808.0" y="215.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu gắn với quy trình, sản phẩm và người</text><text x="808.0" y="234.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phê duyệt. Nếu không, đó chỉ là dữ liệu thô.</text><rect x="60.0" y="292.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="328.0" r="15" fill="var(--p)"/><text x="94.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="327.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Governance và phân quyền</text><text x="80.0" y="373.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI được đọc gì, tác động vào đâu. Kết quả</text><text x="80.0" y="392.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cần người có thẩm quyền xác minh trước khi</text><text x="80.0" y="412.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thành quyết định.</text><rect x="424.0" y="292.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="458.0" cy="328.0" r="15" fill="var(--p)"/><text x="458.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="484.0" y="327.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tích hợp giữa các hệ thống</text><text x="444.0" y="373.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI không tự nối các silo. Thông tin rải rác dẫn</text><text x="444.0" y="392.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tới câu trả lời lỗi thời hoặc thiếu.</text><rect x="788.0" y="292.0" width="352.0" height="146.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="328.0" r="15" fill="var(--p)"/><text x="822.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="848.0" y="327.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational context</text><text x="808.0" y="373.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Doanh nghiệp làm gì, quy trình nào áp dụng</text><text x="808.0" y="392.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cho sản phẩm nào, yêu cầu compliance nào</text><text x="808.0" y="412.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đang có hiệu lực.</text><rect x="60.0" y="454.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="487.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Sáu điều kiện này là câu hỏi về quản trị tổ chức, không phải danh sách tính năng phần mềm.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="RAG trả lời được câu hỏi về nội dung tài liệu như SOP; các câu hỏi về lô hàng cụ thể, phê duyệt và evidence, hay tuân thủ thực tế cần context vận hành, không nằm trong nội dung tài liệu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot trả lời được nội dung, chưa hiểu vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">RAG tìm trong kho tài liệu. Câu hỏi vận hành cần nhiều hơn tài liệu.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. RAG: Retrieval-Augmented Generation.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi về nội dung tài liệu</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">RAG tìm trong kho tài liệu và tổng hợp câu trả lời</text><rect x="84.0" y="238.0" width="480.0" height="98.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="292.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">“Quy trình kiểm soát nhiệt độ kho lạnh là gì?”</text><rect x="84.0" y="346.0" width="480.0" height="98.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="400.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nếu SOP có ghi, AI có thể tóm tắt được</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi về context vận hành</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đáp án nằm ở dữ liệu, workflow và evidence</text><rect x="636.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">“Lô hàng tuần trước có đạt kiểm tra không?”</text><rect x="636.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">“Ai phê duyệt thay đổi công thức, dựa trên bằng chứng nào?”</text><rect x="636.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">“Nhà máy có đang tuân thủ GMP khi đổi ca không?”</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khoảng cách giữa “AI biết quy định” và “AI hiểu doanh nghiệp đang vận hành thế nào” thường bị đánh giá thấp.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="What Excel is replacing hints at the problem: inventory work suggests configuration or the inbound process, financial reporting suggests unreliable data, and information stored outside suggests ERP scope gaps." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="586" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Symptom or cause? What is Excel replacing?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The part of ERP that Excel replaces hints at where the problem lies.</text><line x1="60.0" y1="502.0" x2="1140.0" y2="502.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="524.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Diagnostic hypotheses from the article, not conclusions for every company.</text><text x="60.0" y="565.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="470.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="295.0" y="181.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Excel is doing inventory work</text><line x1="540.0" y1="176.0" x2="586.0" y2="176.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="596.0,176.0 586.0,181.5 586.0,170.5" fill="var(--gm)"/><rect x="602.0" y="134.0" width="538.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="871.0" y="171.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="middle">The module may be misconfigured or the inbound process may</text><text x="871.0" y="191.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="middle">not fit</text><rect x="60.0" y="232.0" width="470.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="295.0" y="279.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Excel is doing financial reporting</text><line x1="540.0" y1="274.0" x2="586.0" y2="274.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="596.0,274.0 586.0,279.5 586.0,268.5" fill="var(--gm)"/><rect x="602.0" y="232.0" width="538.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="871.0" y="279.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="middle">ERP data may not be reliable enough for decisions</text><rect x="60.0" y="330.0" width="470.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="295.0" y="377.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Excel stores information ERP has no place for</text><line x1="540.0" y1="372.0" x2="586.0" y2="372.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="596.0,372.0 586.0,377.5 586.0,366.5" fill="var(--gm)"/><rect x="602.0" y="330.0" width="538.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="871.0" y="377.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="middle">ERP scope may not cover the real operation</text><rect x="60.0" y="432.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="465.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Diagnose before choosing a solution.</text></svg>
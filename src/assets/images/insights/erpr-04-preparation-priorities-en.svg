<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="Five things to prepare when not yet ready: standardize processes, clean master data, choose a small first scope, assign clear ownership and communicate with employees." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="534" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five things to prepare when you are not yet ready</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">“Not yet” does not mean ERP is the wrong direction; it means preparation is needed.</text><line x1="60.0" y1="450.0" x2="1140.0" y2="450.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="472.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data. The items have no fixed order.</text><text x="60.0" y="513.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">When the honest answer is “not yet”</text><line x1="158.4" y1="188.0" x2="158.4" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="158.4,212.0 154.0,204.0 162.8,204.0" fill="var(--gm)"/><rect x="60.0" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Standardize</text><text x="76.0" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">processes</text><text x="76.0" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Document the core</text><text x="76.0" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">operating processes.</text><line x1="379.2" y1="188.0" x2="379.2" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="379.2,212.0 374.8,204.0 383.6,204.0" fill="var(--gm)"/><rect x="280.8" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="296.8" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clean master data</text><text x="296.8" y="280.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Do it before migration, not</text><text x="296.8" y="298.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">during it.</text><line x1="600.0" y1="188.0" x2="600.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,212.0 595.6,204.0 604.4,204.0" fill="var(--gm)"/><rect x="501.6" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="517.6" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Choose a small</text><text x="517.6" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">first scope</text><text x="517.6" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Small enough to succeed.</text><line x1="820.8" y1="188.0" x2="820.8" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="820.8,212.0 816.4,204.0 825.2,204.0" fill="var(--gm)"/><rect x="722.4" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="738.4" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Assign clear</text><text x="738.4" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">ownership</text><text x="738.4" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">For the project and for the</text><text x="738.4" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">system after go-live.</text><line x1="1041.6" y1="188.0" x2="1041.6" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1041.6,212.0 1037.2,204.0 1046.0,204.0" fill="var(--gm)"/><rect x="943.2" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="959.2" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Communicate</text><text x="959.2" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">with employees</text><text x="959.2" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Explain what is changing</text><text x="959.2" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and why, before the</text><text x="959.2" y="339.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">project begins.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A “not yet” answer is useful information: it shows what to do before choosing software.</text></svg>
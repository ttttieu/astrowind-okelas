<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Three problems a DMS does not solve: contextual knowledge, historical and causal knowledge, and relational knowledge; each compares how a DMS answers with how better KM answers." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three knowledge problems a DMS doesn’t solve</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">However complete the library, a DMS typically can’t answer these three kinds of question.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Examples from the article for manufacturing SMEs; composite illustrative scenarios, not measured data.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Contextual knowledge</text><text x="82.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">How does the inspection procedure apply</text><text x="82.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">to the new product?</text><rect x="82.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="94.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">In a DMS</text><text x="94.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Find the procedure, find the product spec,</text><text x="94.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">read both and reason it through.</text><rect x="82.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="94.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">With better KM</text><text x="94.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The procedure is tied to each product</text><text x="94.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and its conditions, so the answer comes</text><text x="94.0" y="408.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">with context.</text><rect x="426.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Causal knowledge</text><text x="448.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Why this process? Has another approach</text><text x="448.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">been tried?</text><rect x="448.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="460.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">In a DMS</text><text x="460.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Documents record “what”, not “why”. You</text><text x="460.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">must find someone experienced.</text><rect x="448.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="460.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">With better KM</text><text x="460.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Decision history is connected to documents</text><text x="460.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and processes.</text><rect x="792.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Relational knowledge</text><text x="814.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">If we change a parameter in process A,</text><text x="814.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">what else is affected?</text><rect x="814.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="826.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">In a DMS</text><text x="826.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Two documents exist separately; no link</text><text x="826.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">unless someone wrote it down.</text><rect x="814.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="826.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">With better KM</text><text x="826.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Relationships among processes, products,</text><text x="826.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">equipment, materials and suppliers are</text><text x="826.0" y="408.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">recorded and queryable.</text><rect x="60.0" y="457.1" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="490.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A DMS stores “what”. These questions need context, history and connections.</text></svg>
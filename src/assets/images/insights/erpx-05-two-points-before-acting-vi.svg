<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai điều cần cân nhắc trước khi hành động: chẩn đoán trước khi kê đơn, và xem xét cả hệ thống lẫn tổ chức." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Hai điều cần cân nhắc trước khi hành động</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nên tìm hiểu nguyên nhân trước khi chọn giải pháp.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="532.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chẩn đoán trước khi kê đơn</text><text x="76.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tái triển khai, đổi phần mềm hoặc ép dùng hệ thống mà không xử lý</text><text x="76.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nguyên nhân gốc thường chỉ tạo thêm xung đột.</text><rect x="607.0" y="134.0" width="532.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="639.0" cy="166.0" r="15" fill="var(--p)"/><text x="639.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="623.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Xem xét cả hệ thống lẫn tổ chức</text><text x="623.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cấu hình không khớp là vấn đề hệ thống; không thấy lý do đổi là vấn đề</text><text x="623.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tổ chức; thường cả hai cùng tồn tại.</text><rect x="60.0" y="307.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="340.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hiểu nguyên nhân trước, rồi mới chọn giải pháp.</text></svg>
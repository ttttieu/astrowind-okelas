<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Five dimensions of AI readiness: Workflow, Knowledge, Data, Control, People." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Five dimensions of AI readiness</text><g transform="translate(0 149.1)"><rect x="60" y="0" width="204.8" height="153" rx="16" class="bb"/><text x="82" y="44" font-size="22" font-weight="600" class="tx">Workflow</text><text x="82" y="76" font-size="17" font-weight="400" class="mut">Which steps the</text><text x="82" y="100" font-size="17" font-weight="400" class="mut">work goes through.</text><rect x="278.8" y="0" width="204.8" height="153" rx="16" class="bb"/><text x="300.8" y="44" font-size="22" font-weight="600" class="tx">Knowledge</text><text x="300.8" y="76" font-size="17" font-weight="400" class="mut">Which knowledge</text><text x="300.8" y="100" font-size="17" font-weight="400" class="mut">AI may use, and</text><text x="300.8" y="124" font-size="17" font-weight="400" class="mut">who confirms it.</text><rect x="497.6" y="0" width="204.8" height="153" rx="16" class="bb"/><text x="519.6" y="44" font-size="22" font-weight="600" class="tx">Data</text><text x="519.6" y="76" font-size="17" font-weight="400" class="mut">Whether the data is</text><text x="519.6" y="100" font-size="17" font-weight="400" class="mut">reliable enough.</text><rect x="716.4000000000001" y="0" width="204.8" height="153" rx="16" class="bb"/><text x="738.4000000000001" y="44" font-size="22" font-weight="600" class="tx">Control</text><text x="738.4000000000001" y="76" font-size="17" font-weight="400" class="mut">Who checks, and</text><text x="738.4000000000001" y="100" font-size="17" font-weight="400" class="mut">who can stop it.</text><rect x="935.2" y="0" width="204.8" height="153" rx="16" class="bb"/><text x="957.2" y="44" font-size="22" font-weight="600" class="tx">People</text><text x="957.2" y="76" font-size="17" font-weight="400" class="mut">Whether users</text><text x="957.2" y="100" font-size="17" font-weight="400" class="mut">understand AI</text><text x="957.2" y="124" font-size="17" font-weight="400" class="mut">limits.</text></g><text x="60" y="336.1" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Six cards: AI creates work, AI noise, lack of judgment, error propagation, training and oversight gaps, and headcount cuts that do not equal productivity." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="496" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Six problems when AI is deployed too fast</text><g transform="translate(0 108)"><rect x="60" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">PROBLEM 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Creates work</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">AI output needs checking, fixing and</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">reconciling.</text><rect x="426.6666666666667" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="448.6666666666667" y="35" font-size="13" font-weight="600" class="mut">PROBLEM 2</text><text x="448.6666666666667" y="70" font-size="22" font-weight="600" class="tx">AI-generated noise</text><text x="448.6666666666667" y="102" font-size="17" font-weight="400" class="mut">High volume, low value: more to read</text><text x="448.6666666666667" y="126" font-size="17" font-weight="400" class="mut">and filter.</text><rect x="793.3333333333334" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="815.3333333333334" y="35" font-size="13" font-weight="600" class="mut">PROBLEM 3</text><text x="815.3333333333334" y="70" font-size="22" font-weight="600" class="tx">Lacks judgment</text><text x="815.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Fluent output, but no sense of what</text><text x="815.3333333333334" y="126" font-size="17" font-weight="400" class="mut">fits your context.</text><rect x="60" y="175" width="346.6666666666667" height="179" rx="16" class="bb"/><text x="82" y="210" font-size="13" font-weight="600" class="mut">PROBLEM 4</text><text x="82" y="245" font-size="22" font-weight="600" class="tx">Errors propagate</text><text x="82" y="277" font-size="17" font-weight="400" class="mut">One undetected error travels with</text><text x="82" y="301" font-size="17" font-weight="400" class="mut">the document.</text><rect x="426.6666666666667" y="175" width="346.6666666666667" height="179" rx="16" class="bb"/><text x="448.6666666666667" y="210" font-size="13" font-weight="600" class="mut">PROBLEM 5</text><text x="448.6666666666667" y="245" font-size="22" font-weight="600" class="tx">Training and oversight gaps</text><text x="448.6666666666667" y="277" font-size="17" font-weight="400" class="mut">Users are not shown how to use or</text><text x="448.6666666666667" y="301" font-size="17" font-weight="400" class="mut">verify it.</text><rect x="793.3333333333334" y="175" width="346.6666666666667" height="179" rx="16" class="bb"/><text x="815.3333333333334" y="210" font-size="13" font-weight="600" class="mut">PROBLEM 6</text><text x="815.3333333333334" y="245" font-size="22" font-weight="600" class="tx">Cutting staff ≠ productivity</text><text x="815.3333333333334" y="277" font-size="17" font-weight="400" class="mut">AI investment plus headcount cuts</text><text x="815.3333333333334" y="301" font-size="17" font-weight="400" class="mut">do not automatically raise</text><text x="815.3333333333334" y="325" font-size="17" font-weight="400" class="mut">productivity.</text></g></svg>

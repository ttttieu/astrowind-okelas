<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="ERP, vận hành dựa trên quy trình, đứng trên bốn nền tảng của tổ chức: quy trình đủ rõ, dữ liệu đủ sạch, con người sẵn sàng thay đổi và quản trị có người chịu trách nhiệm; thiếu nền tảng thì ERP khuếch đại sự hỗn loạn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP đứng trên bốn nền tảng của tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi chọn phần mềm nào đến sau khi các nền tảng này đã đủ vững.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="78.0" rx="16" fill="var(--ink)"/><text x="600.0" y="174.2" font-size="28" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP</text><text x="600.0" y="195.1" font-size="14" font-weight="400" fill="var(--onink)" text-anchor="middle">ERP vận hành dựa trên quy trình</text><line x1="189.0" y1="240.0" x2="189.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="189.0,216.0 193.9,225.0 184.1,225.0" fill="var(--gm)"/><rect x="60.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình</text><text x="80.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đủ rõ và nhất quán để cấu hình</text><line x1="463.0" y1="240.0" x2="463.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="463.0,216.0 467.9,225.0 458.1,225.0" fill="var(--gm)"/><rect x="334.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="354.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu</text><text x="354.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đủ sạch để báo cáo được tin</text><line x1="737.0" y1="240.0" x2="737.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="737.0,216.0 742.0,225.0 732.0,225.0" fill="var(--gm)"/><rect x="608.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="628.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Con người</text><text x="628.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Sẵn sàng thay đổi cách</text><text x="628.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">làm việc</text><line x1="1011.0" y1="240.0" x2="1011.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="1011.0,216.0 1016.0,225.0 1006.0,225.0" fill="var(--gm)"/><rect x="882.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="902.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Quản trị</text><text x="902.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có người quyết định và</text><text x="902.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chịu trách nhiệm</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thiếu các nền tảng này, ERP khuếch đại sự hỗn loạn hiện có, và việc sửa tốn kém hơn.</text></svg>
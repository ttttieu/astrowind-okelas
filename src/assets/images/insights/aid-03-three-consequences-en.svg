<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" width="1200" height="518" role="img" aria-label="Three consequences of document explosion: no one knows which version is current, finding documents takes longer, and document quality is not controlled." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="518" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three consequences of document explosion</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Volume grows faster than the ability to keep quality and findability.</text><line x1="60.0" y1="434.0" x2="1140.0" y2="434.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="456.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="497.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--a)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">No one knows which version</text><text x="122.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">is current</text><line x1="82.0" y1="230.0" x2="386.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI helps generate revisions and summaries</text><text x="82.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">much faster, but no one confirms which</text><text x="82.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">version is in effect. When an audit asks, it is</text><text x="82.0" y="320.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hard to answer.</text><rect x="426.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--a)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Finding things takes longer</text><line x1="448.0" y1="230.0" x2="752.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Volume grows while structure stays the</text><text x="448.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">same. Multiplied by daily searches</text><text x="448.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">across the organization, the value of</text><text x="448.0" y="320.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">documents falls.</text><rect x="792.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Document quality</text><text x="854.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">isn’t controlled</text><line x1="814.0" y1="230.0" x2="1118.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Creation speeds up while review doesn’t</text><text x="814.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">change: review becomes a bottleneck, or is</text><text x="814.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">skipped to keep pace.</text><rect x="60.0" y="364.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="397.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Volume grows faster than the ability to keep quality, relevance and findability.</text></svg>
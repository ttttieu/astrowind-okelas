<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba dạng kháng cự phổ biến: kháng cự thụ động, kháng cự ngầm là dạng khó phát hiện nhất và kháng cự công khai." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba dạng kháng cự phổ biến</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cả ba đều khiến ERP không phản ánh thực tế vận hành.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kháng cự thụ động</text><text x="76.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhập tối thiểu, vẫn giữ Excel và sổ tay</text><text x="76.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">song song.</text><rect x="425.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="441.0" y="150.0" width="132.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="507.4" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Khó phát hiện nhất</text><text x="441.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kháng cự ngầm</text><text x="441.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Xử lý ngoài hệ thống, nhờ người khác nhập</text><text x="441.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thay hoặc tạo quy trình riêng.</text><rect x="790.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="806.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kháng cự công khai</text><text x="806.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thường là quản lý trung gian chê hệ thống; dễ</text><text x="806.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thấy nhất và dễ lan.</text><rect x="60.0" y="297.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="330.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba dạng đều làm giá trị của ERP giảm dần theo thời gian.</text></svg>
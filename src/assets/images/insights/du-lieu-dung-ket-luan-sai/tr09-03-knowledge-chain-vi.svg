<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536" role="img" aria-label="Chuỗi sáu mắt xích tạo tri thức từ khảo sát: thu nhận, ghi nhận, kiểm chứng, nguồn gốc, quản trị, tổng hợp và quyết định; năm mắt xích đầu ứng với năm lỗi." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="536" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Sáu mắt xích tạo tri thức từ khảo sát, năm điểm có thể đứt</text><g transform="translate(0 108)"><rect x="60" y="0" width="322.6666666666667" height="131" rx="16" class="bp"/><text x="82" y="35" font-size="13" font-weight="600" class="tp">MẮT XÍCH 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tp">Thu nhận</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Lỗi: khung mẫu lệch.</text><rect x="438.6666666666667" y="0" width="322.6666666666667" height="131" rx="16" class="bp"/><text x="460.6666666666667" y="35" font-size="13" font-weight="600" class="tp">MẮT XÍCH 2</text><text x="460.6666666666667" y="70" font-size="22" font-weight="600" class="tp">Ghi nhận</text><text x="460.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Lỗi: áp lực quyền lực.</text><rect x="817.3333333333334" y="0" width="322.6666666666667" height="131" rx="16" class="bp"/><text x="839.3333333333334" y="35" font-size="13" font-weight="600" class="tp">MẮT XÍCH 3</text><text x="839.3333333333334" y="70" font-size="22" font-weight="600" class="tp">Kiểm chứng</text><text x="839.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Lỗi: khoảng cách nhận thức.</text><line x1="388.6666666666667" y1="65.5" x2="420.6666666666667" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M418.6666666666667 56.5 l14 9 l-14 9z" class="arf"/><line x1="767.3333333333334" y1="65.5" x2="799.3333333333334" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M797.3333333333334 56.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="191" width="322.6666666666667" height="155" rx="16" class="bp"/><text x="82" y="226" font-size="13" font-weight="600" class="tp">MẮT XÍCH 4</text><text x="82" y="261" font-size="22" font-weight="600" class="tp">Nguồn gốc</text><text x="82" y="293" font-size="17" font-weight="400" class="mut">Lỗi: đồng thuận không đầy đủ.</text><rect x="438.6666666666667" y="191" width="322.6666666666667" height="155" rx="16" class="bp"/><text x="460.6666666666667" y="226" font-size="13" font-weight="600" class="tp">MẮT XÍCH 5</text><text x="460.6666666666667" y="261" font-size="22" font-weight="600" class="tp">Quản trị</text><text x="460.6666666666667" y="293" font-size="17" font-weight="400" class="mut">Lỗi: bỏ qua chi phí thu thập.</text><rect x="817.3333333333334" y="191" width="322.6666666666667" height="155" rx="16" class="bb"/><text x="839.3333333333334" y="226" font-size="13" font-weight="600" class="mut">MẮT XÍCH 6</text><text x="839.3333333333334" y="261" font-size="22" font-weight="600" class="tx">Tổng hợp và quyết định</text><text x="839.3333333333334" y="293" font-size="17" font-weight="400" class="mut">Kết luận có nằm trong phạm vi</text><text x="839.3333333333334" y="317" font-size="17" font-weight="400" class="mut">bằng chứng không?</text><line x1="388.6666666666667" y1="268.5" x2="420.6666666666667" y2="268.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M418.6666666666667 259.5 l14 9 l-14 9z" class="arf"/><line x1="767.3333333333334" y1="268.5" x2="799.3333333333334" y2="268.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M797.3333333333334 259.5 l14 9 l-14 9z" class="arf"/><path d="M978.6666666666667 135 V161 H221.33333333333334 V177" class="ar" fill="none" stroke-width="3" stroke-dasharray="6 6"/><path d="M212.33333333333334 177 l9 14 l9 -14z" class="arf"/></g><text x="60" y="488" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

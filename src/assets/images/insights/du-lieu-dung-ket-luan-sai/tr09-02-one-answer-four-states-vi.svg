<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 507" width="1200" height="507" role="img" aria-label="Một câu trả lời “Đồng ý” có thể đến từ bốn trạng thái hiểu biết khác nhau; bảng khảo sát chỉ ghi lại giá trị cuối." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="507" class="bgr"/><rect x="60" y="26" width="182.3623046875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Một câu trả lời “Đồng ý”, bốn trạng thái hiểu biết</text><g transform="translate(0 140)"><rect x="60" y="0" width="258" height="184" rx="16" class="bp"/><text x="82" y="35" font-size="13" font-weight="600" class="tp">TRẠNG THÁI A</text><text x="82" y="70" font-size="22" font-weight="600" class="tp">Chưa hiểu</text><text x="82" y="99" font-size="22" font-weight="600" class="tp">khái niệm</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Nghĩ hiến tạng giống</text><text x="82" y="155" font-size="17" font-weight="400" class="mut">hiến máu.</text><rect x="334" y="0" width="258" height="184" rx="16" class="bp"/><text x="356" y="35" font-size="13" font-weight="600" class="tp">TRẠNG THÁI B</text><text x="356" y="70" font-size="22" font-weight="600" class="tp">Hiểu sai</text><text x="356" y="102" font-size="17" font-weight="400" class="mut">Chưa phân biệt chết não</text><text x="356" y="126" font-size="17" font-weight="400" class="mut">với hôn mê.</text><rect x="608" y="0" width="258" height="184" rx="16" class="bp"/><text x="630" y="35" font-size="13" font-weight="600" class="tp">TRẠNG THÁI C</text><text x="630" y="70" font-size="22" font-weight="600" class="tp">Hiểu, nhưng theo</text><text x="630" y="99" font-size="22" font-weight="600" class="tp">người lớn</text><text x="630" y="131" font-size="17" font-weight="400" class="mut">Trả lời theo điều được</text><text x="630" y="155" font-size="17" font-weight="400" class="mut">hướng dẫn.</text><rect x="882" y="0" width="258" height="184" rx="16" class="bb"/><text x="904" y="35" font-size="13" font-weight="600" class="mut">TRẠNG THÁI D</text><text x="904" y="70" font-size="22" font-weight="600" class="tx">Hiểu rõ và đồng tình</text><text x="904" y="102" font-size="17" font-weight="400" class="mut">Ý kiến độc lập của người</text><text x="904" y="126" font-size="17" font-weight="400" class="mut">trả lời.</text><rect x="60" y="212" width="1080" height="73" rx="16" class="bi"/><text x="82" y="256" font-size="22" font-weight="600" class="ti">Bảng khảo sát chỉ ghi lại một giá trị: “Đồng ý”.</text></g><text x="60" y="459" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" width="1200" height="484" role="img" aria-label="Hai ô đặt cạnh nhau với dấu không bằng: năng lực ra quyết định khác với giá trị tri thức; bốn nhóm tri thức là y khoa, pháp lý, trải nghiệm, xã hội và đạo đức." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="484" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Quyền quyết định và giá trị tri thức là hai việc khác nhau</text><g transform="translate(0 108)"><rect x="60" y="0" width="508" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">NĂNG LỰC RA QUYẾT ĐỊNH</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Ai có thẩm quyền và năng lực để chọn</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Gắn với vai trò, quy định và trách nhiệm.</text><rect x="632" y="0" width="508" height="131" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">GIÁ TRỊ TRI THỨC</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Ai biết điều gì về vấn đề</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Gắn với trải nghiệm, chuyên môn và góc nhìn.</text><text x="600" y="77.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><text x="60" y="175" font-size="15" font-weight="600" class="mut">Bốn nhóm tri thức:</text><rect x="213.5791015625" y="155" width="92.77734375" height="34" rx="17" class="bg"/><text x="231.5791015625" y="178" font-size="17" font-weight="600" class="tx">Y khoa</text><rect x="318.3564453125" y="155" width="96.62060546875" height="34" rx="17" class="bg"/><text x="336.3564453125" y="178" font-size="17" font-weight="600" class="tx">Pháp lý</text><rect x="426.97705078125" y="155" width="132.59619140625" height="34" rx="17" class="bg"/><text x="444.97705078125" y="178" font-size="17" font-weight="600" class="tx">Trải nghiệm</text><rect x="571.5732421875" y="155" width="181.18896484375" height="34" rx="17" class="bg"/><text x="589.5732421875" y="178" font-size="17" font-weight="600" class="tx">Xã hội và đạo đức</text><rect x="60" y="221" width="1080" height="73" rx="16" class="bi"/><text x="82" y="265" font-size="22" font-weight="600" class="ti">Không nhóm nào thay thế được nhóm nào.</text></g><text x="60" y="436" font-size="13" font-weight="400" class="mut">Phân tích từ góc độ quản trị tri thức, không phải tư vấn y khoa, đạo đức hay pháp lý.</text></svg>

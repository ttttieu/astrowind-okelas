<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Hai ô nối bằng mũi tên: bên trái là số liệu ghi nhận 850 trên 1.000 chọn đồng ý; bên phải là kết luận muốn rút ra, chỉ đứng được nếu mẫu đại diện, trẻ hiểu câu hỏi, không bị người lớn tác động và tham gia tự nguyện." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="604" class="bgr"/><rect x="60" y="26" width="182.3623046875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Dữ liệu ghi nhận chưa phải điều tổ chức muốn chứng minh</text><g transform="translate(0 140)"><rect x="60" y="0" width="508" height="261" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">DỮ LIỆU GHI NHẬN</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Bảng kết quả khảo sát</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Chính xác về mặt ghi nhận:</text><circle cx="86" cy="131" r="3" class="dot"/><text x="100" y="136" font-size="17" font-weight="400" class="mut">Số trẻ được hỏi: 1.000</text><circle cx="86" cy="161" r="3" class="dot"/><text x="100" y="166" font-size="17" font-weight="400" class="mut">Đồng ý: 850</text><circle cx="86" cy="191" r="3" class="dot"/><text x="100" y="196" font-size="17" font-weight="400" class="mut">Không đồng ý: 100</text><circle cx="86" cy="221" r="3" class="dot"/><text x="100" y="226" font-size="17" font-weight="400" class="mut">Không có ý kiến: 50</text><rect x="632" y="0" width="508" height="261" rx="16" class="bp"/><text x="654" y="35" font-size="13" font-weight="600" class="tp">KẾT LUẬN MUỐN RÚT RA</text><text x="654" y="70" font-size="22" font-weight="600" class="tp">“85% trẻ em ủng hộ hiến tạng”</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Chỉ đứng được nếu:</text><circle cx="658" cy="131" r="3" class="dot"/><text x="672" y="136" font-size="17" font-weight="400" class="mut">Mẫu có tính đại diện</text><circle cx="658" cy="161" r="3" class="dot"/><text x="672" y="166" font-size="17" font-weight="400" class="mut">Trẻ hiểu đúng câu hỏi</text><circle cx="658" cy="191" r="3" class="dot"/><text x="672" y="196" font-size="17" font-weight="400" class="mut">Không chịu ảnh hưởng của người lớn</text><circle cx="658" cy="221" r="3" class="dot"/><text x="672" y="226" font-size="17" font-weight="400" class="mut">Tham gia tự nguyện</text><line x1="578" y1="130.5" x2="610" y2="130.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 121.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="289" width="1080" height="73" rx="16" class="bi"/><text x="82" y="333" font-size="22" font-weight="600" class="ti">Khoảng cách giữa hai ô là phần tổ chức phải kiểm soát.</text></g><text x="60" y="536" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text><text x="60" y="556" font-size="13" font-weight="400" class="mut">Số liệu minh họa giả định, không phải thống kê.</text></svg>

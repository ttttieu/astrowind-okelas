<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" width="1200" height="716" role="img" aria-label="Bảng năm lỗi khi khảo sát, mỗi lỗi kèm biểu hiện trong khảo sát trẻ em và một ví dụ tương ứng trong doanh nghiệp." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="716" class="bgr"/><rect x="60" y="26" width="182.3623046875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Năm lỗi khi khảo sát, và biểu hiện trong doanh nghiệp</text><g transform="translate(0 140)"><text x="64" y="16" font-size="14" font-weight="700" class="mut">LỖI</text><text x="380.45" y="16" font-size="14" font-weight="700" class="mut">TRONG KHẢO SÁT TRẺ EM</text><text x="749.5" y="16" font-size="14" font-weight="700" class="mut">TRONG DOANH NGHIỆP</text><rect x="60" y="34" width="302.45" height="67" rx="16" class="bg"/><text x="82" y="74" font-size="18" font-weight="600" class="tx">1. Chỉ nghe người dễ tiếp cận</text><rect x="376.45" y="34" width="355.05" height="67" rx="16" class="bg"/><text x="398.45" y="74" font-size="18" font-weight="600" class="tx">Học sinh đô thị, bệnh viện lớn</text><rect x="745.5" y="34" width="394.5" height="67" rx="16" class="bb"/><text x="767.5" y="74" font-size="18" font-weight="600" class="tx">Đánh giá sẵn sàng ERP chỉ hỏi phòng IT</text><rect x="60" y="115" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="155" font-size="18" font-weight="600" class="tx">2. Câu trả lời bị quyền lực</text><text x="82" y="178" font-size="18" font-weight="600" class="tx">định hình</text><rect x="376.45" y="115" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="155" font-size="18" font-weight="600" class="tx">Giáo viên đứng cạnh khi hỏi</text><rect x="745.5" y="115" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="155" font-size="18" font-weight="600" class="tx">Quản lý trực tiếp phát và thu bảng hỏi</text><rect x="60" y="219" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="259" font-size="18" font-weight="600" class="tx">3. Cùng câu trả lời, khác</text><text x="82" y="282" font-size="18" font-weight="600" class="tx">mức hiểu</text><rect x="376.45" y="219" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="259" font-size="18" font-weight="600" class="tx">“Đồng ý” từ nhiều cách hiểu</text><rect x="745.5" y="219" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="259" font-size="18" font-weight="600" class="tx">“Có dùng AI” có thể ở bất kỳ mức nào</text><rect x="60" y="323" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="363" font-size="18" font-weight="600" class="tx">4. Không biết điều kiện</text><text x="82" y="386" font-size="18" font-weight="600" class="tx">thu thập</text><rect x="376.45" y="323" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="363" font-size="18" font-weight="600" class="tx">Cha mẹ hướng dẫn hoặc ép trả lời</text><rect x="745.5" y="323" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="363" font-size="18" font-weight="600" class="tx">Bộ phận tự điền phiếu đánh giá</text><text x="767.5" y="386" font-size="18" font-weight="600" class="tx">chính mình</text><rect x="60" y="427" width="302.45" height="67" rx="16" class="bg"/><text x="82" y="467" font-size="18" font-weight="600" class="tx">5. Không tính chi phí thu thập</text><rect x="376.45" y="427" width="355.05" height="67" rx="16" class="bg"/><text x="398.45" y="467" font-size="18" font-weight="600" class="tx">Khơi lại nỗi đau mất mát</text><rect x="745.5" y="427" width="394.5" height="67" rx="16" class="bb"/><text x="767.5" y="467" font-size="18" font-weight="600" class="tx">Hỏi sự cố như truy trách nhiệm</text></g><text x="60" y="668" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text></svg>

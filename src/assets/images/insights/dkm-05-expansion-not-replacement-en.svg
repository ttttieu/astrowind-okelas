<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Knowledge management is a layer added on top of the DMS, not a replacement; a DMS manages documents while KM manages the meaning of documents in operations." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From DMS to KM: an expansion, not a replacement</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The DMS remains the foundation. KM is a layer added on top.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="640.0" height="120.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="177.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge management</text><text x="84.0" y="205.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Connects documents to context, processes, events and people</text><line x1="380.0" y1="294.0" x2="380.0" y2="268.0" stroke="var(--mut)" stroke-width="2"/><polygon points="380.0,260.0 384.4,268.0 375.6,268.0" fill="var(--mut)"/><rect x="60.0" y="302.0" width="640.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="345.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">DMS</text><text x="84.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Stores, controls and approves documents</text><rect x="720.0" y="134.0" width="420.0" height="288.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="744.0" y="175.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">A DMS manages documents.</text><text x="744.0" y="211.8" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">KM manages the meaning of documents</text><text x="744.0" y="236.7" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">in how the organization operates.</text><text x="744.0" y="281.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not primarily a technology project: a change in</text><text x="744.0" y="301.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">how the organization conceives and organizes</text><text x="744.0" y="321.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">its knowledge.</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Technology is a support tool, not the starting point.</text></svg>
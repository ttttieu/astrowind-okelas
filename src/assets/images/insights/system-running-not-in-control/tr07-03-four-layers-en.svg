<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 616" width="1200" height="616" role="img" aria-label="Four consecutive layers: see, connect, direct, control, each with a question for leadership." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="616" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Four layers of operational control, one question each</text><g transform="translate(0 108)"><rect x="60" y="0" width="1080" height="96" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">LAYER 1 · SEE</text><text x="82" y="68" font-size="20" font-weight="600" class="tx">Do we know what is really happening, fast enough to act?</text><rect x="60" y="110" width="1080" height="96" rx="16" class="bb"/><text x="82" y="145" font-size="13" font-weight="600" class="mut">LAYER 2 · CONNECT</text><text x="82" y="178" font-size="20" font-weight="600" class="tx">Does a deviation on the floor reach the right person and team?</text><rect x="60" y="220" width="1080" height="96" rx="16" class="bb"/><text x="82" y="255" font-size="13" font-weight="600" class="mut">LAYER 3 · DIRECT</text><text x="82" y="288" font-size="20" font-weight="600" class="tx">Do we know what to do, who owns it and on what basis?</text><rect x="60" y="330" width="1080" height="96" rx="16" class="bb"/><text x="82" y="365" font-size="13" font-weight="600" class="mut">LAYER 4 · CONTROL</text><text x="82" y="398" font-size="20" font-weight="600" class="tx">Is the action done, recorded and checked for effect?</text></g><text x="60" y="568" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Two rhythms: the reporting rhythm runs hourly, by shift, weekly, monthly; the incident rhythm can strike at any time; a gap lies between them." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">The reporting rhythm and the incident rhythm do not match</text><g transform="translate(0 127.5)"><text x="60" y="42.5" font-size="18" font-weight="700" class="tx">Reporting rhythm</text><rect x="270" y="0" width="183" height="73" rx="16" class="bb"/><text x="292" y="44" font-size="22" font-weight="600" class="tx">Hourly</text><rect x="499" y="0" width="183" height="73" rx="16" class="bb"/><text x="521" y="44" font-size="22" font-weight="600" class="tx">By shift</text><rect x="728" y="0" width="183" height="73" rx="16" class="bb"/><text x="750" y="44" font-size="22" font-weight="600" class="tx">Weekly</text><rect x="957" y="0" width="183" height="73" rx="16" class="bb"/><text x="979" y="44" font-size="22" font-weight="600" class="tx">Monthly</text><line x1="457" y1="36.5" x2="483" y2="36.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M481 27.5 l14 9 l-14 9z" class="arf"/><line x1="686" y1="36.5" x2="712" y2="36.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M710 27.5 l14 9 l-14 9z" class="arf"/><line x1="915" y1="36.5" x2="941" y2="36.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M939 27.5 l14 9 l-14 9z" class="arf"/><text x="60" y="141.5" font-size="18" font-weight="700" class="tx">Incident rhythm</text><rect x="270" y="99" width="870" height="73" rx="16" class="bp"/><text x="292" y="143" font-size="22" font-weight="600" class="tp">A deviation can appear at any time, even at 2 a.m.</text><rect x="60" y="200" width="1080" height="73" rx="16" class="bi"/><text x="82" y="244" font-size="22" font-weight="600" class="ti">At the pace of an incident, the organization may see nothing.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Ba ô nối bằng mũi tên: mô hình đạt chuẩn, doanh nghiệp cấp quyền, gây hại nghiêm trọng; bên dưới là ghi chú ASL-2." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Mô hình đạt chuẩn vẫn có thể gây hại khi được cấp quyền</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đạt chuẩn của developer không tự động bảo đảm an toàn khi doanh nghiệp cấp quyền.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ và ASL-2 theo bài viết; cần đối chiếu phân loại với tài liệu của Anthropic trước khi đăng.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="300.0" height="120.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="224.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô hình đạt</text><text x="210.0" y="250.5" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">chuẩn developer</text><line x1="366.0" y1="230.0" x2="402.0" y2="230.0" stroke="var(--gm)" stroke-width="3"/><polygon points="414.0,230.0 402.0,236.6 402.0,223.4" fill="var(--gm)"/><rect x="420.0" y="170.0" width="300.0" height="120.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="570.0" y="224.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Doanh nghiệp cấp quyền</text><text x="570.0" y="250.5" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">truy cập</text><line x1="726.0" y1="230.0" x2="762.0" y2="230.0" stroke="var(--gm)" stroke-width="3"/><polygon points="774.0,230.0 762.0,236.6 762.0,223.4" fill="var(--gm)"/><rect x="780.0" y="170.0" width="300.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="930.0" y="237.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="middle">Gây hại nghiêm trọng</text><rect x="60.0" y="330.0" width="1080.0" height="80.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="376.6" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="middle">Mô hình được xếp ASL-2 không có cam kết nào về cách doanh nghiệp sử dụng nó.</text><rect x="60.0" y="458.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="491.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đạt chuẩn developer không đảm bảo an toàn khi triển khai.</text></svg>
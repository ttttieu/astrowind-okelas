<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Hai thẻ ở hai đầu một mũi tên, khối ở giữa cho biết mô hình đạt chuẩn vẫn cần lớp thứ hai." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Cần hai lớp, và lớp nào cũng không thay được lớp kia</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Developer và deployer chịu hai trách nhiệm khác nhau, và cả hai đều cần có mặt.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hai lớp theo bài viết; cách xếp chồng là cách trình bày của OKELAS.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="1080.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="600.0" y="203.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Developer · an toàn mô hình</text><text x="600.0" y="247.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Ngăn năng lực tăng gây hại nghiêm trọng trước khi phát hành</text><rect x="60.0" y="340.0" width="1080.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="383.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="middle">Deployer · kiểm soát vận hành</text><text x="600.0" y="427.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Kiểm soát agent khi chúng chạm vào dữ liệu và hệ thống của tổ chức</text><line x1="600.0" y1="270.0" x2="600.0" y2="328.0" stroke="var(--gm)" stroke-width="3"/><polygon points="600.0,340.0 593.4,328.0 606.6,328.0" fill="var(--gm)"/><rect x="380.0" y="285.0" width="440.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="310.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô hình đạt chuẩn vẫn cần lớp thứ hai</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cần cả hai lớp, không lớp nào thay được lớp nào.</text></svg>
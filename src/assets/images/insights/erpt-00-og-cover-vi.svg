<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bốn bậc thang tăng dần thể hiện bốn cấp độ khai thác dữ liệu ERP, từ ghi nhận giao dịch đến dự báo và hỗ trợ quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · ERP</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Sau ERP: doanh nghiệp cần làm gì</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">để khai thác dữ liệu ERP?</text><rect x="100.0" y="470.0" width="230.0" height="90.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="2"/><text x="116.0" y="499.1" font-size="14" font-weight="700" fill="var(--p)" text-anchor="start">Cấp 1</text><text x="116.0" y="527.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi nhận giao dịch</text><rect x="350.0" y="415.0" width="230.0" height="145.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="2"/><text x="366.0" y="444.1" font-size="14" font-weight="700" fill="var(--p)" text-anchor="start">Cấp 2</text><text x="366.0" y="472.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Báo cáo vận hành
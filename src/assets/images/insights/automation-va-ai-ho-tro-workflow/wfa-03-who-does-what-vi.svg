<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Bảng so sánh automation, AI hỗ trợ và con người theo việc chính, điều kiện để chạy, quyền quyết định và hậu quả khi sai; AI hỗ trợ không giữ quyền quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Automation, AI hỗ trợ và con người: ai làm gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cột AI hỗ trợ không giữ quyền quyết định ở hàng nào.</text><line x1="60.0" y1="618.0" x2="1140.0" y2="618.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="640.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><rect x="240.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--p)"/><text x="391.5" y="155.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Automation (rule)</text><rect x="553.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="704.5" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">AI hỗ trợ</text><rect x="866.0" y="130.0" width="274.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><text x="1003.0" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Con người</text><text x="64.0" y="223.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Việc chính</text><rect x="240.0" y="180.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="227.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thực thi hành động đã được cho phép</text><rect x="553.0" y="180.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="227.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đọc đầu vào, chuẩn bị evidence</text><rect x="866.0" y="180.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="227.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phán đoán ngoại lệ, ban hành rule</text><text x="64.0" y="317.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Cần gì để chạy</text><rect x="240.0" y="274.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rule viết rõ, đầu vào có cấu trúc</text><rect x="553.0" y="274.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đầu vào để đọc, nguồn evidence để tra</text><rect x="866.0" y="274.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thẩm quyền và thông tin đủ</text><text x="64.0" y="411.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền quyết định</text><rect x="240.0" y="368.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="415.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có, trong phạm vi rule đã ban hành</text><rect x="553.0" y="368.0" width="303.0" height="84.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="567.0" y="415.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Không</text><rect x="866.0" y="368.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="415.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có</text><text x="64.0" y="505.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Khi sai</text><rect x="240.0" y="462.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lỗi lặp lại nhanh và đều</text><rect x="553.0" y="462.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="499.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Diễn giải sai, người xem kết quả có</text><text x="567.0" y="518.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thể sửa</text><rect x="866.0" y="462.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="499.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có người chịu trách nhiệm,</text><text x="880.0" y="518.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">truy vết được</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyền quyết định ở lại với rule do người ban hành, hoặc với con người.</text></svg>
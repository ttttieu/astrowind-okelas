<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="Automation dừng ở ba chỗ: đầu vào phi cấu trúc thì AI diễn giải để rule chạy được; ca ngoài rule thì đi theo đường ngoại lệ tới người có thẩm quyền, AI chuẩn bị evidence; quyết định cần phán đoán thì con người quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="658" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Automation dừng ở ba chỗ, mỗi chỗ một lời giải</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi chỗ dừng cần một lời giải khác nhau.</text><line x1="60.0" y1="596.0" x2="1140.0" y2="596.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="618.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="143.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Automation dừng ở</text><text x="500.0" y="143.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Lời giải</text><rect x="60.0" y="156.0" width="380.0" height="112.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="191.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Đầu vào phi cấu trúc</text><text x="80.0" y="222.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Email, ảnh chứng từ, ghi chú không có trường để</text><text x="80.0" y="242.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">rule đọc.</text><line x1="446.0" y1="212.0" x2="479.0" y2="212.0" stroke="var(--p)" stroke-width="3"/><polygon points="490.0,212.0 479.0,218.1 479.0,205.9" fill="var(--p)"/><rect x="500.0" y="156.0" width="640.0" height="112.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="524.0" y="218.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI diễn giải đầu vào để rule chạy được.</text><rect x="60.0" y="282.0" width="380.0" height="112.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="317.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ca ngoài rule</text><text x="80.0" y="348.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không khớp rule nào, robot dừng đúng như</text><text x="80.0" y="368.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thiết kế.</text><line x1="446.0" y1="338.0" x2="479.0" y2="338.0" stroke="var(--a)" stroke-width="3"/><polygon points="490.0,338.0 479.0,344.1 479.0,331.9" fill="var(--a)"/><rect x="500.0" y="282.0" width="640.0" height="112.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="524.0" y="333.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đường ngoại lệ: chuyển đúng người có thẩm quyền, AI</text><text x="524.0" y="355.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">chuẩn bị evidence.</text><rect x="60.0" y="408.0" width="380.0" height="112.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="443.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định cần phán đoán</text><text x="80.0" y="474.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhiều yếu tố cùng lúc, tiêu chí chưa ổn định.</text><line x1="446.0" y1="464.0" x2="479.0" y2="464.0" stroke="var(--a)" stroke-width="3"/><polygon points="490.0,464.0 479.0,470.1 479.0,457.9" fill="var(--a)"/><rect x="500.0" y="408.0" width="640.0" height="112.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="524.0" y="470.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Con người quyết định; rule chưa thay được.</text><rect x="60.0" y="536.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="569.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nhầm ba chỗ này thành một chỗ là nguồn gốc của đầu tư sai.</text></svg>
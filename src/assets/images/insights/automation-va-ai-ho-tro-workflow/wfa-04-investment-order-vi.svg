<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Năm bước theo thứ tự phụ thuộc: chuẩn hóa và viết rule, automation, đường ngoại lệ, AI diễn giải đầu vào, AI chuẩn bị evidence; hai bước AI chỉ làm sau khi đo tỷ lệ ngoại lệ, tỷ lệ đầu vào phi cấu trúc và thời gian chuẩn bị hồ sơ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="660" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Thứ tự đầu tư theo sự phụ thuộc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bước sau chạy tốt khi bước trước đã có.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="200.0" height="252.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="209.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn hóa và</text><text x="76.0" y="233.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">viết rule</text><text x="76.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phần lặp lại, có người có</text><text x="76.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thẩm quyền đứng tên.</text><line x1="262.0" y1="162.0" x2="272.0" y2="162.0" stroke="var(--p)" stroke-width="2"/><polygon points="278.0,162.0 272.0,165.3 272.0,158.7" fill="var(--p)"/><rect x="280.0" y="130.0" width="200.0" height="252.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="310.0" cy="162.0" r="15" fill="var(--p)"/><text x="310.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="296.0" y="209.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Automation</text><text x="296.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phần có rule rõ và</text><text x="296.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đầu vào có cấu trúc.</text><line x1="482.0" y1="162.0" x2="492.0" y2="162.0" stroke="var(--p)" stroke-width="2"/><polygon points="498.0,162.0 492.0,165.3 492.0,158.7" fill="var(--p)"/><rect x="500.0" y="130.0" width="200.0" height="252.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="162.0" r="15" fill="var(--p)"/><text x="530.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="516.0" y="209.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đường ngoại lệ</text><text x="516.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ca ngoài rule đến</text><text x="516.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đúng người kèm hồ sơ;</text><text x="516.0" y="310.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định được ghi lại.</text><line x1="702.0" y1="162.0" x2="712.0" y2="162.0" stroke="var(--p)" stroke-width="2"/><polygon points="718.0,162.0 712.0,165.3 712.0,158.7" fill="var(--p)"/><rect x="720.0" y="130.0" width="200.0" height="252.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="750.0" cy="162.0" r="15" fill="var(--p)"/><text x="750.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="736.0" y="209.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI diễn giải đầu vào</text><text x="736.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khi đầu vào phi cấu trúc</text><text x="736.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">là điểm nghẽn thực sự.</text><rect x="736.0" y="342.0" width="71.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="771.5" y="358.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Đo trước</text><line x1="922.0" y1="162.0" x2="932.0" y2="162.0" stroke="var(--p)" stroke-width="2"/><polygon points="938.0,162.0 932.0,165.3 932.0,158.7" fill="var(--p)"/><rect x="940.0" y="130.0" width="200.0" height="252.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="970.0" cy="162.0" r="15" fill="var(--p)"/><text x="970.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="956.0" y="209.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI chuẩn bị</text><text x="956.0" y="233.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">evidence</text><text x="956.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khi ngoại lệ đủ nhiều để</text><text x="956.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tìm và tổng hợp hồ sơ</text><text x="956.0" y="310.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tốn công.</text><rect x="956.0" y="342.0" width="71.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="991.5" y="358.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Đo trước</text><rect x="60.0" y="398.0" width="1080.0" height="124.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="430.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Trước bước 4 và 5, đo trong chính quy trình của bạn</text><rect x="84.0" y="460.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="254.0" y="487.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tỷ lệ ca thành ngoại lệ</text><rect x="436.0" y="460.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="606.0" y="487.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tỷ lệ đầu vào phi cấu trúc</text><rect x="788.0" y="460.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="487.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thời gian chuẩn bị hồ sơ</text><rect x="60.0" y="538.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="571.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không có ngưỡng chung cho mọi doanh nghiệp. Con số của bạn mới là căn cứ.</text></svg>
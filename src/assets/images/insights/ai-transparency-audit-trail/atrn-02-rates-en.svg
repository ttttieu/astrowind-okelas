<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582" width="1200" height="582" role="img" aria-label="Two rate cards, 7–24% and 78%, and one wide card on Sleeper Agents." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="582" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The numbers depend on specific test conditions</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Two rates from Anthropic and Redwood Research (December 2024); the article stresses they vary by setup.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Based on the article and Anthropic Alignment Science with Redwood Research (December 2024); not a rate observed in operation.</text><text x="60.0" y="561.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="195.6" font-size="40" font-weight="700" fill="var(--p)" text-anchor="start">7–24%</text><text x="84.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Rate of the “alignment faking” reasoning pattern across</text><text x="84.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">test setups.</text><rect x="612.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="195.6" font-size="40" font-weight="700" fill="var(--p)" text-anchor="start">78%</text><text x="636.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Rate under one test condition with an added</text><text x="636.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">reinforcement-training step.</text><rect x="60.0" y="292.0" width="1080.0" height="110.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="330.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sleeper Agents (Anthropic, 2024)</text><text x="84.0" y="360.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A backdoor was installed deliberately; standard safety training did not fully remove it. The authors say the behavior was induced,</text><text x="84.0" y="381.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">not spontaneous.</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These figures depend on the setup; they should not be read as a general rate for every system.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Chain of three blocks: scenario, reasoning in the chain of thought, observed behavior." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Reasoning traces reveal the logic behind behavior</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis of reasoning traces helped detect the “alignment faking” pattern in the research the article cites.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Reasoning chain as presented in the article; a conceptual diagram, not a description of the experiment.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="190.0" width="320.0" height="120.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="220.0" y="234.7" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Scenario: the model will be</text><text x="220.0" y="255.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">retrained to comply with</text><text x="220.0" y="276.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">every request</text><line x1="386.0" y1="250.0" x2="425.0" y2="250.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="434.0,250.0 425.0,254.9 425.0,245.1" fill="var(--p)"/><rect x="440.0" y="190.0" width="320.0" height="120.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="245.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Reasoning trace: temporary</text><text x="600.0" y="266.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">compliance seems less risky</text><line x1="766.0" y1="250.0" x2="805.0" y2="250.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="814.0,250.0 805.0,254.9 805.0,245.1" fill="var(--p)"/><rect x="820.0" y="190.0" width="320.0" height="120.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="980.0" y="245.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Observed behavior:</text><text x="980.0" y="266.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">surface-level compliance</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chain-of-thought monitoring can help detect such behavior, but the article describes this visibility as fragile.</text></svg>
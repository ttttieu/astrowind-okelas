<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" width="1200" height="652" role="img" aria-label="Hỏi ba nhân viên cùng một nghiệp vụ: nếu trả lời giống nhau thì quy trình nhất quán và ERP có cơ sở để cấu hình; nếu mỗi người một cách thì ERP khó cấu hình. Tình huống minh họa giả định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="652" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phép thử ba nhân viên: cùng một nghiệp vụ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa giả định, không phải thống kê hay case thực tế.</text><line x1="60.0" y1="568.0" x2="1140.0" y2="568.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="590.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa giả định để giải thích câu hỏi 1, không phải thống kê hay case thực tế.</text><text x="60.0" y="631.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="240.0" y="134.0" width="720.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="162.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Hỏi ba nhân viên cùng một nghiệp vụ (ví dụ: nhập kho)</text><line x1="324.0" y1="182.0" x2="324.0" y2="195.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="324.0,204.0 319.1,195.0 328.9,195.0" fill="var(--gm)"/><rect x="60.0" y="206.0" width="528.0" height="276.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="245.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Trả lời giống nhau</text><rect x="84.0" y="268.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="293.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên A: cách làm 1</text><rect x="84.0" y="316.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="341.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên B: cách làm 1</text><rect x="84.0" y="364.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="389.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên C: cách làm 1</text><rect x="84.0" y="418.0" width="480.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="324.0" y="449.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="middle">Quy trình nhất quán: ERP có cơ sở để cấu hình</text><line x1="876.0" y1="182.0" x2="876.0" y2="195.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="876.0,204.0 871.0,195.0 881.0,195.0" fill="var(--gm)"/><rect x="612.0" y="206.0" width="528.0" height="276.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="245.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Trả lời khác nhau</text><rect x="636.0" y="268.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="293.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên A: cách làm 1</text><rect x="636.0" y="316.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="341.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên B: cách làm 2</text><rect x="636.0" y="364.0" width="480.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="389.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên C: cách làm 3</text><rect x="636.0" y="418.0" width="480.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><text x="876.0" y="449.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Mỗi người một cách: ERP khó cấu hình</text><rect x="60.0" y="498.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="531.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu mỗi người một cách, quy trình cần được thống nhất trước khi cấu hình vào ERP.</text></svg>
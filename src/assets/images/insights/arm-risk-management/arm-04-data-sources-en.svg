<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Five data-source cards in a row, with a bar below giving the principle: keep the list short." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Start from existing data and keep the list short</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Start from each process, use existing data, rate simply and keep the list short.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Data sources per the article; grouping them into five chips is OKELAS’s presentation.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="191.3" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">Data you already have</text><rect x="60.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="160.0" y="253.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Nonconformities</text><rect x="280.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="380.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Customer complaints</text><rect x="500.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Audit findings</text><rect x="720.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="820.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Supplier results</text><rect x="940.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1040.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Changes in context</text><rect x="60.0" y="326.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="360.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Keep the list short, rate simply, and avoid false precision</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Start with a few important risks per process, not the whole list.</text></svg>
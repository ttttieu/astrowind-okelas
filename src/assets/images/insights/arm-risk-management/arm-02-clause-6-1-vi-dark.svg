<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba thẻ điều khoản 6.1.1, 6.1.2 và tích hợp xếp hàng ngang, bên dưới là một khung ghi chú về phụ lục A.4." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 6.1 yêu cầu ba việc chính về rủi ro</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 6.1.1 xác định rủi ro và cơ hội; 6.1.2 lập hành động và đánh giá hiệu lực.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 6.1.1–6.1.2 theo bài viết, diễn đạt lại; sơ đồ là của OKELAS.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="82.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">6.1.1</text><text x="82.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định rủi ro và cơ hội trong bối</text><text x="82.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">cảnh và từng quy trình.</text><rect x="430.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="452.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">6.1.2</text><text x="452.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Lập hành động tương xứng, tích hợp</text><text x="452.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">vào hệ thống và đánh giá hiệu lực.</text><rect x="800.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Tích hợp</text><text x="822.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Xử lý rủi ro và cơ hội như một phần</text><text x="822.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">của quy trình, không tách rời.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Tiêu chuẩn không đòi phương pháp chính thức; xem phụ lục A.4.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điều khoản 6.1 yêu cầu hành động tương xứng và kiểm tra hiệu lực.</text></svg>
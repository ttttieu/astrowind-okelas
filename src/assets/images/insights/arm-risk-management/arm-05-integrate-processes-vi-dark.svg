<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Bốn hộp nối bằng mũi tên: gắn vào tài liệu, xem lại sau sự kiện, đưa vào xem xét, cập nhật; bên dưới là khung ghi chú và khung đánh giá hiệu lực." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Rủi ro phải nằm trong quy trình, không chỉ trong bảng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Gắn rủi ro vào tài liệu quy trình, xem lại sau sự kiện và đưa vào xem xét lãnh đạo.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Các bước tích hợp theo bài viết; sơ đồ là của OKELAS.</text><text x="60.0" y="663.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="225.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Gắn vào tài liệu quy trình</text><line x1="306.0" y1="220.0" x2="324.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="334.0,220.0 324.0,225.5 324.0,214.5" fill="var(--gm)"/><rect x="340.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="460.0" y="225.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Xem lại sau sự kiện</text><line x1="586.0" y1="220.0" x2="604.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="614.0,220.0 604.0,225.5 604.0,214.5" fill="var(--gm)"/><rect x="620.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="740.0" y="225.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Đưa vào xem xét lãnh đạo</text><line x1="866.0" y1="220.0" x2="884.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="894.0,220.0 884.0,225.5 884.0,214.5" fill="var(--gm)"/><rect x="900.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="1020.0" y="215.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Cập nhật sau sự không</text><text x="1020.0" y="236.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">phù hợp</text><rect x="60.0" y="300.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="334.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Rủi ro nên được cập nhật cùng hồ sơ quy trình, không tách thành bảng riêng.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Đánh giá hiệu lực trước khi báo cáo lãnh đạo</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Rủi ro chỉ có tác dụng khi được xem lại cùng quy trình thực tế.</text></svg>
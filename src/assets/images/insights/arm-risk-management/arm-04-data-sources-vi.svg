<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Năm thẻ nguồn dữ liệu có sẵn xếp hàng ngang, bên dưới là một thanh nguyên tắc giữ danh sách ngắn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bắt đầu từ dữ liệu có sẵn, giữ danh sách ngắn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bắt đầu từ mỗi quy trình, dùng dữ liệu có sẵn, chấm điểm đơn giản.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nguồn dữ liệu theo bài viết; cách gom thành năm nhóm là của OKELAS.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="191.3" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">Nguồn dữ liệu có sẵn</text><rect x="60.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="160.0" y="253.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Sự không phù hợp</text><rect x="280.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="380.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Khiếu nại khách hàng</text><rect x="500.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Phát hiện audit</text><rect x="720.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="820.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Kết quả nhà cung cấp</text><rect x="940.0" y="200.0" width="200.0" height="96.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1040.0" y="253.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Thay đổi bối cảnh</text><rect x="60.0" y="326.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="360.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Giữ danh sách ngắn, xếp hạng đơn giản, tránh độ chính xác giả</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bắt đầu với vài rủi ro quan trọng mỗi quy trình, không phải toàn bộ.</text></svg>
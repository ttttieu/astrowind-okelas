<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A chain of five boxes from raw material batch to customer, joined by links; each link has a dashed line and a cross, showing that an unrecorded link breaks the chain." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="500" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability needs a recorded chain of links</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">If a raw material has a problem, you need to trace from the batch to the customer.</text><line x1="60.0" y1="416.0" x2="1140.0" y2="416.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="438.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="479.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="600.0" y="180.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Each link must be recorded, or the chain breaks</text><rect x="60.0" y="216.0" width="180.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="150.0" y="266.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Raw material batch</text><line x1="246.0" y1="261.0" x2="279.0" y2="261.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="4 4"/><line x1="255.5" y1="254.0" x2="269.5" y2="268.0" stroke="var(--a)" stroke-width="2.4"/><line x1="255.5" y1="268.0" x2="269.5" y2="254.0" stroke="var(--a)" stroke-width="2.4"/><rect x="285.0" y="216.0" width="180.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="375.0" y="266.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Production order</text><line x1="471.0" y1="261.0" x2="504.0" y2="261.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="4 4"/><line x1="480.5" y1="254.0" x2="494.5" y2="268.0" stroke="var(--a)" stroke-width="2.4"/><line x1="480.5" y1="268.0" x2="494.5" y2="254.0" stroke="var(--a)" stroke-width="2.4"/><rect x="510.0" y="216.0" width="180.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="256.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Finished-goods</text><text x="600.0" y="276.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">batch</text><line x1="696.0" y1="261.0" x2="729.0" y2="261.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="4 4"/><line x1="705.5" y1="254.0" x2="719.5" y2="268.0" stroke="var(--a)" stroke-width="2.4"/><line x1="705.5" y1="268.0" x2="719.5" y2="254.0" stroke="var(--a)" stroke-width="2.4"/><rect x="735.0" y="216.0" width="180.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="825.0" y="266.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Shipment order</text><line x1="921.0" y1="261.0" x2="954.0" y2="261.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="4 4"/><line x1="930.5" y1="254.0" x2="944.5" y2="268.0" stroke="var(--a)" stroke-width="2.4"/><line x1="930.5" y1="268.0" x2="944.5" y2="254.0" stroke="var(--a)" stroke-width="2.4"/><rect x="960.0" y="216.0" width="180.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="266.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Customer</text><rect x="60.0" y="346.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="379.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If a link is not recorded, AI cannot trace from raw material to customer.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Four boxes, one for each dimension missing context: inconsistent structure, missing business definitions, missing relationships between entities, missing state and validity; each has an example and a consequence for AI." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four dimensions where business data lacks context</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each dimension creates a different kind of gap when AI uses the data.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four dimensions are a practical taxonomy from the article, not a formal academic framework. Composite examples.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="154.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Consistent structure</text><text x="84.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Example: Temperature recorded three ways across three sheets:</text><text x="84.0" y="219.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">decimals, integers and OK/NG.</text><text x="84.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Consequence for AI: AI cannot compare trends across the sheets.</text><rect x="606.0" y="134.0" width="534.0" height="154.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Business definitions</text><text x="630.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Example: “Processing time: 48h”, with no clear start or end point.</text><text x="630.0" y="227.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Consequence for AI: No way to tell whether 48h is good or over</text><text x="630.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">threshold for this product.</text><rect x="60.0" y="300.0" width="534.0" height="154.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="328.0" r="15" fill="var(--p)"/><text x="90.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="336.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Relationships between entities</text><text x="84.0" y="365.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Example: An ERP purchase order is not linked to the incoming</text><text x="84.0" y="385.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">inspection in an Excel-based QMS.</text><text x="84.0" y="412.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Consequence for AI: AI can answer only inside each silo, not</text><text x="84.0" y="432.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">across them.</text><rect x="606.0" y="300.0" width="534.0" height="154.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="328.0" r="15" fill="var(--gm)"/><text x="636.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="336.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">State and validity</text><text x="630.0" y="365.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Example: Unclear which SOP version is in effect, or which supplier is</text><text x="630.0" y="385.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">still approved.</text><text x="630.0" y="412.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Consequence for AI: AI may answer from outdated information</text><text x="630.0" y="432.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">without the user noticing.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Data can be complete and still be missing one of these four dimensions.</text></svg>
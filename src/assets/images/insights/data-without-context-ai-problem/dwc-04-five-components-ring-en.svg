<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Five components of context arranged around a central “Context” circle: consistent structure, business definitions, recorded relationships, queryable state, ownership and authority." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="608" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five components of context AI needs to answer operations</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A way of organizing data to serve operational questions, not a list of software features.</text><line x1="60.0" y1="524.0" x2="1140.0" y2="524.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="546.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Five components from the article’s analysis, a discussion aid, not a certified methodology.</text><text x="60.0" y="587.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="480.0" y="170.0" width="240.0" height="64.0" rx="32" fill="var(--p)"/><text x="600.0" y="209.3" font-size="20" font-weight="700" fill="var(--wh)" text-anchor="middle">Context</text><line x1="600.0" y1="234.0" x2="180.0" y2="296.0" stroke="var(--p)" stroke-width="2"/><rect x="80.0" y="296.0" width="200.0" height="118.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="106.0" cy="322.0" r="15" fill="var(--p)"/><text x="106.0" y="327.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="180.0" y="378.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Consistent structure</text><line x1="600.0" y1="234.0" x2="390.0" y2="296.0" stroke="var(--p)" stroke-width="2"/><rect x="290.0" y="296.0" width="200.0" height="118.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="316.0" cy="322.0" r="15" fill="var(--p)"/><text x="316.0" y="327.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="390.0" y="378.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Business definitions</text><line x1="600.0" y1="234.0" x2="600.0" y2="296.0" stroke="var(--p)" stroke-width="2"/><rect x="500.0" y="296.0" width="200.0" height="118.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="526.0" cy="322.0" r="15" fill="var(--p)"/><text x="526.0" y="327.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="600.0" y="368.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Recorded</text><text x="600.0" y="388.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">relationships</text><line x1="600.0" y1="234.0" x2="810.0" y2="296.0" stroke="var(--p)" stroke-width="2"/><rect x="710.0" y="296.0" width="200.0" height="118.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="736.0" cy="322.0" r="15" fill="var(--p)"/><text x="736.0" y="327.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="810.0" y="378.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Queryable state</text><line x1="600.0" y1="234.0" x2="1020.0" y2="296.0" stroke="var(--p)" stroke-width="2"/><rect x="920.0" y="296.0" width="200.0" height="118.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="946.0" cy="322.0" r="15" fill="var(--p)"/><text x="946.0" y="327.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="1020.0" y="368.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Ownership</text><text x="1020.0" y="388.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">and authority</text><rect x="60.0" y="454.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="487.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">This is how data is organized so AI can answer operational questions, not just a piece of software.</text></svg>
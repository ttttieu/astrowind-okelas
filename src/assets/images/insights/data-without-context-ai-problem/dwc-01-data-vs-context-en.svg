<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="On the left, raw data: a temperature reading, a QC form, an ERP purchase order; on the right, context: questions that explain what they mean operationally." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Data is raw information; context gives it meaning</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The same number means nothing to AI until context says what it measures.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Distinction between data and context from the article, not measured data. Composite examples.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="288.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Data</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Raw information, only its literal content</text><rect x="84.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">“25°C · 14:30 · Warehouse B”</text><rect x="84.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">QC form (PDF) dated 15 March 2024</text><rect x="84.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">ERP purchase order: 500 kg from supplier XYZ</text><rect x="612.0" y="134.0" width="528.0" height="288.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Context</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What the data means operationally</text><rect x="636.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cold storage or a normal room? Which threshold is acceptable?</text><rect x="636.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Who recorded it? Which product, pass or fail?</text><rect x="636.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Which production run? Was the material inspected?</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without context, data is just characters in a file.</text></svg>
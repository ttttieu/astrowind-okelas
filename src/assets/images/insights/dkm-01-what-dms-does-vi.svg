<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-label="DMS làm tốt lưu trữ có cấu trúc, kiểm soát phiên bản, phân quyền, workflow phê duyệt và tìm kiếm toàn văn; giới hạn cơ bản là quản lý tài liệu như đơn vị độc lập, không quản lý tri thức như mạng lưới kết nối." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="646" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">DMS làm tốt việc gì, và giới hạn nằm ở đâu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">DMS giải quyết tốt bài toán tài liệu, nhưng đó chưa phải bài toán tri thức.</text><line x1="60.0" y1="562.0" x2="1140.0" y2="562.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="584.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="625.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="342.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">DMS làm tốt</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Giải quyết bài toán quản lý tài liệu</text><rect x="84.0" y="218.0" width="480.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="244.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Lưu trữ có cấu trúc</text><rect x="84.0" y="268.0" width="480.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="294.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kiểm soát phiên bản</text><rect x="84.0" y="318.0" width="480.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="344.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phân quyền truy cập</text><rect x="84.0" y="368.0" width="480.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="394.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow phê duyệt</text><rect x="84.0" y="418.0" width="480.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="444.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tìm kiếm toàn văn</text><rect x="612.0" y="134.0" width="528.0" height="342.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Giới hạn cơ bản</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cách DMS nhìn tài liệu</text><rect x="676.0" y="234.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><line x1="688.0" y1="254.0" x2="728.0" y2="254.0" stroke="var(--a)" stroke-width="1.6"/><line x1="688.0" y1="268.0" x2="728.0" y2="268.0" stroke="var(--a)" stroke-width="1.6"/><line x1="688.0" y1="282.0" x2="728.0" y2="282.0" stroke="var(--a)" stroke-width="1.6"/><line x1="688.0" y1="296.0" x2="728.0" y2="296.0" stroke="var(--a)" stroke-width="1.6"/><rect x="776.0" y="264.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><line x1="788.0" y1="284.0" x2="828.0" y2="284.0" stroke="var(--a)" stroke-width="1.6"/><line x1="788.0" y1="298.0" x2="828.0" y2="298.0" stroke="var(--a)" stroke-width="1.6"/><line x1="788.0" y1="312.0" x2="828.0" y2="312.0" stroke="var(--a)" stroke-width="1.6"/><line x1="788.0" y1="326.0" x2="828.0" y2="326.0" stroke="var(--a)" stroke-width="1.6"/><rect x="876.0" y="234.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><line x1="888.0" y1="254.0" x2="928.0" y2="254.0" stroke="var(--a)" stroke-width="1.6"/><line x1="888.0" y1="268.0" x2="928.0" y2="268.0" stroke="var(--a)" stroke-width="1.6"/><line x1="888.0" y1="282.0" x2="928.0" y2="282.0" stroke="var(--a)" stroke-width="1.6"/><line x1="888.0" y1="296.0" x2="928.0" y2="296.0" stroke="var(--a)" stroke-width="1.6"/><rect x="976.0" y="264.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="2"/><line x1="988.0" y1="284.0" x2="1028.0" y2="284.0" stroke="var(--a)" stroke-width="1.6"/><line x1="988.0" y1="298.0" x2="1028.0" y2="298.0" stroke="var(--a)" stroke-width="1.6"/><line x1="988.0" y1="312.0" x2="1028.0" y2="312.0" stroke="var(--a)" stroke-width="1.6"/><line x1="988.0" y1="326.0" x2="1028.0" y2="326.0" stroke="var(--a)" stroke-width="1.6"/><text x="636.0" y="402.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quản lý tài liệu như những đơn vị độc lập, không quản lý</text><text x="636.0" y="425.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">tri thức như một mạng lưới kết nối.</text><rect x="60.0" y="492.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="525.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khoảng cách giữa “có tài liệu” và “có tri thức” là khoảng cách DMS không được thiết kế để lấp.</text></svg>
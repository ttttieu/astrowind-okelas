<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Năm nhóm sự kiện ERP ghi nhận mỗi ngày: mua hàng, kho và sản xuất, lệnh sản xuất, bán hàng và kế toán." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm nhóm sự kiện ERP ghi nhận mỗi ngày</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dữ liệu vận hành phát sinh liên tục; khối lượng thực tế khác nhau theo từng doanh nghiệp.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="127.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mua hàng</text><text x="76.0" y="200.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tạo, phê duyệt, nhận hàng,</text><text x="76.0" y="218.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thanh toán.</text><rect x="279.0" y="134.0" width="204.0" height="127.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="295.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Kho và sản xuất</text><text x="295.0" y="200.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nhập nguyên liệu,</text><text x="295.0" y="218.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">xuất sản xuất,</text><text x="295.0" y="237.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhập thành phẩm.</text><rect x="498.0" y="134.0" width="204.0" height="127.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Lệnh sản xuất</text><text x="514.0" y="200.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Số lượng, thời gian và hao</text><text x="514.0" y="218.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hụt thực tế.</text><rect x="717.0" y="134.0" width="204.0" height="127.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Bán hàng</text><text x="733.0" y="200.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đơn hàng, giao hàng, hóa</text><text x="733.0" y="218.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đơn, thu tiền.</text><rect x="936.0" y="134.0" width="204.0" height="127.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Kế toán</text><text x="952.0" y="200.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Bút toán tương ứng với các</text><text x="952.0" y="218.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">giao dịch trên.</text><rect x="60.0" y="277.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="310.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần lớn dữ liệu này mới chỉ được dùng để ghi nhận giao dịch.</text></svg>
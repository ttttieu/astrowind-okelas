<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba lý do dữ liệu ERP chưa được khai thác: dữ liệu chưa đủ chất lượng, câu hỏi chưa được định nghĩa rõ và thiếu bối cảnh để diễn giải." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba lý do dữ liệu ERP chưa được khai thác</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Thiếu chất lượng dữ liệu, câu hỏi rõ ràng và bối cảnh để diễn giải.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu chưa đủ chất lượng</text><text x="76.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cùng một sản phẩm phân loại khác nhau,</text><text x="76.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chi phí ghi không nhất quán, dữ liệu sản xuất</text><text x="76.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhập gộp cuối ngày; người dùng không tin</text><text x="76.0" y="263.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">báo cáo.</text><rect x="425.0" y="134.0" width="350.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="441.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi chưa được định nghĩa rõ</text><text x="441.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP không tự biết báo cáo nào quan trọng.</text><text x="441.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cần xác định muốn biết điều gì và sẽ dùng để</text><text x="441.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định gì.</text><rect x="790.0" y="134.0" width="350.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="806.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thiếu bối cảnh để diễn giải</text><text x="806.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP ghi nhận cái gì đã xảy ra, không ghi nhận</text><text x="806.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vì sao; bối cảnh nằm trong đầu người và mất</text><text x="806.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">khi họ nghỉ việc.</text><rect x="60.0" y="304.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="337.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không có dữ liệu tin cậy, câu hỏi rõ và bối cảnh, dữ liệu chỉ là kho lưu trữ.</text></svg>
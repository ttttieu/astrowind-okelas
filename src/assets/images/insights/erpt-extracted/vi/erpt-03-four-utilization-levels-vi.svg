<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" width="1200" height="518" role="img" aria-label="Bốn cấp độ khai thác dữ liệu ERP: ghi nhận giao dịch, báo cáo vận hành, phân tích và insight, dự báo và hỗ trợ quyết định; phần lớn SME ở cấp 1 hoặc 2." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="518" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn cấp độ khai thác dữ liệu ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hầu hết doanh nghiệp SME sản xuất đang ở cấp 1 hoặc cấp 2.</text><line x1="60.0" y1="434.0" x2="1140.0" y2="434.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="456.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung phân cấp từ bài viết; nhận định về vị trí của SME là quan sát của OKELAS, không phải thống kê.</text><text x="60.0" y="497.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="213.0" width="259.0" height="135.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="240.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="start">Cấp 1</text><text x="76.0" y="268.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi nhận giao dịch</text><text x="76.0" y="296.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nhập và lưu giao dịch; báo cáo chủ</text><text x="76.0" y="314.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">yếu là danh sách.</text><rect x="76.0" y="181.0" width="101.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="126.9" y="197.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Phần lớn SME</text><rect x="334.0" y="188.0" width="259.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="215.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="start">Cấp 2</text><text x="350.0" y="243.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Báo cáo vận hành</text><text x="350.0" y="271.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tổng hợp định kỳ, chủ yếu nhìn về</text><text x="350.0" y="289.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quá khứ.</text><rect x="350.0" y="156.0" width="101.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="400.9" y="172.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Phần lớn SME</text><rect x="608.0" y="163.0" width="259.0" height="185.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="190.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Cấp 3</text><text x="624.0" y="218.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Phân tích và insight</text><text x="624.0" y="246.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Phân tích nhiều chiều: từ “bao</text><text x="624.0" y="264.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhiêu” sang “tại sao”.</text><rect x="882.0" y="138.0" width="259.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="898.0" y="165.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Cấp 4</text><text x="898.0" y="193.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dự báo và hỗ trợ</text><text x="898.0" y="217.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định</text><text x="898.0" y="244.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dự báo nhu cầu, tối ưu tồn kho,</text><text x="898.0" y="263.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">phát hiện bất thường sớm.</text><rect x="60.0" y="364.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="397.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ cấp 3 trở lên, dữ liệu ERP bắt đầu tạo lợi thế cạnh tranh.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four requirements to move higher: clean and consistent data, clearly defined business questions, context for interpretation and ERP knowledge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four requirements to move to a higher level</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">More tools alone are not enough.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="173.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clean, consistent data</text><text x="76.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Invest in data governance before BI.</text><rect x="334.0" y="134.0" width="259.0" height="173.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="366.0" cy="166.0" r="15" fill="var(--p)"/><text x="366.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="350.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clearly defined</text><text x="350.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">business questions</text><text x="350.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Start from recurring decisions, then</text><text x="350.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">identify the data needed.</text><rect x="608.0" y="134.0" width="259.0" height="173.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="166.0" r="15" fill="var(--p)"/><text x="640.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="624.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Context for interpretation</text><text x="624.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Combine data with process, market</text><text x="624.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and event knowledge, captured</text><text x="624.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">rather than kept in heads.</text><rect x="882.0" y="134.0" width="259.0" height="173.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="914.0" cy="166.0" r="15" fill="var(--p)"/><text x="914.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="898.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">ERP knowledge</text><text x="898.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Understand field meanings and</text><text x="898.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">module links; often lost when</text><text x="898.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">implementation partners leave.</text><rect x="60.0" y="323.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="356.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">More BI tools or dashboards alone are not enough.</text></svg>
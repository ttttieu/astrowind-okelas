<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="ERP data plus context plus organizational knowledge produces organizational intelligence: understanding what is happening, explaining why and deciding on evidence." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From ERP data to organizational intelligence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP provides the data foundation; the other two layers must be built.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ERP data</text><text x="76.0" y="204.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Shows what happened.</text><text x="319.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="341.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="357.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Context</text><text x="357.0" y="204.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Explains why the data looks</text><text x="357.0" y="223.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">this way.</text><text x="600.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="622.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="638.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational</text><text x="638.0" y="201.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">knowledge</text><text x="638.0" y="229.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Processes, people and how</text><text x="638.0" y="248.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">work really runs.</text><text x="881.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">=</text><rect x="903.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--ink)"/><text x="919.0" y="177.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="start">Organizational</text><text x="919.0" y="201.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="start">intelligence</text><text x="919.0" y="229.6" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">Understanding what is</text><text x="919.0" y="248.1" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">happening, explaining why and</text><text x="919.0" y="266.6" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">deciding on evidence.</text><rect x="60.0" y="314.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="347.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP gives the data foundation; context and organizational knowledge create intelligence.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" width="1200" height="518" role="img" aria-label="Four levels of ERP data utilization: transaction recording, operational reporting, analysis and insight, forecasting and decision support; most SMEs sit at level 1 or 2." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="518" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four levels of ERP data utilization</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Most manufacturing SMEs sit at level 1 or 2.</text><line x1="60.0" y1="434.0" x2="1140.0" y2="434.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="456.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Framework from the article; where SMEs sit is OKELAS’s observation, not a statistic.</text><text x="60.0" y="497.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="213.0" width="259.0" height="135.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="240.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="start">Level 1</text><text x="76.0" y="268.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Transaction recording</text><text x="76.0" y="296.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Enter and store transactions;</text><text x="76.0" y="314.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">reports are mainly lists.</text><rect x="76.0" y="181.0" width="87.2" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="119.6" y="197.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Most SMEs</text><rect x="334.0" y="188.0" width="259.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="215.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="start">Level 2</text><text x="350.0" y="243.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Operational reporting</text><text x="350.0" y="271.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Periodic summaries,</text><text x="350.0" y="289.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">mostly backward-looking.</text><rect x="350.0" y="156.0" width="87.2" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="393.6" y="172.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Most SMEs</text><rect x="608.0" y="163.0" width="259.0" height="185.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="190.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Level 3</text><text x="624.0" y="218.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Analysis and insight</text><text x="624.0" y="246.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Multi-dimensional analysis: from</text><text x="624.0" y="264.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">“how much” to “why”.</text><rect x="882.0" y="138.0" width="259.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="898.0" y="165.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Level 4</text><text x="898.0" y="193.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Forecasting and</text><text x="898.0" y="217.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">decision support</text><text x="898.0" y="244.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Demand forecasts,</text><text x="898.0" y="263.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">inventory optimization, early</text><text x="898.0" y="281.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">anomaly detection.</text><rect x="60.0" y="364.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="397.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">From level 3 upward, ERP data starts to create competitive advantage.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn nhóm câu hỏi tự đánh giá manufacturing readiness, mỗi nhóm một câu hỏi đại diện: BOM và routing, traceability, chất lượng và đặc thù ngành." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tự đánh giá manufacturing readiness: bốn nhóm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi nhóm kèm một câu hỏi đại diện cho danh sách đầy đủ trong bài.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá từ bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">BOM và routing</text><text x="76.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">BOM đã chính xác, cập nhật</text><text x="76.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cho toàn bộ sản phẩm trong</text><text x="76.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phạm vi chưa?</text><rect x="334.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có yêu cầu lot tracking không,</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và hiện ghi nhận lot ra sao?</text><rect x="608.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chất lượng</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Các điểm kiểm tra chất lượng đã</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">được xác định chưa?</text><rect x="882.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Đặc thù ngành</text><text x="898.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đã trao đổi với nhà triển khai về</text><text x="898.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">yield, đơn vị tính, quản lý</text><text x="898.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nguyên liệu chưa?</text><rect x="60.0" y="284.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="317.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Manufacturing readiness là điều kiện tiên quyết, không giải quyết trong lúc triển khai.</text></svg>
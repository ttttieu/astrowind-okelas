<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Three 2025 incident cards and one statistic card showing LLM06 to LLM03." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="560" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three 2025 incidents cited in the article</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each incident shows a different way an agent’s attack surface can be exploited.</text><line x1="60.0" y1="476.0" x2="1140.0" y2="476.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="498.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Incidents and the LLM06 → LLM03 change as stated in the article; each source has not been independently re-checked.</text><text x="60.0" y="539.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">EchoLeak (CVE-2025-32711)</text><text x="80.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Microsoft 365 Copilot: enterprise data</text><text x="80.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">extracted through one crafted email, with no</text><text x="80.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">user click.</text><rect x="424.0" y="134.0" width="352.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="444.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Amazon Q Developer</text><text x="444.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Supply chain: a hijacked pull request</text><text x="444.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">shipped data-wiping instructions into</text><text x="444.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">users’ environments.</text><rect x="788.0" y="134.0" width="352.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="808.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Replit</text><text x="808.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">An agent deleted a production database</text><text x="808.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">despite instructions not to make changes</text><text x="808.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">without approval.</text><rect x="60.0" y="290.0" width="1080.0" height="90.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="342.9" font-size="30" font-weight="700" fill="var(--p)" text-anchor="start">LLM06 → LLM03</text><text x="360.0" y="336.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Excessive Agency in the OWASP Top 10 for LLM Applications, 2026 edition, versus 2025.</text><rect x="60.0" y="406.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="439.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The article reads the Excessive Agency rise as scope-of-permission risk growing faster than output-content risk.</text></svg>
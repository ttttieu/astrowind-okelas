<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" role="img" aria-label="Năm lý do dữ liệu hiện tại hiếm khi sẵn sàng: trùng lặp và không nhất quán, không đầy đủ, nằm ở nhiều nơi, định nghĩa không nhất quán và tồn kho sổ sách không khớp thực tế." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="494" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm lý do dữ liệu hiện tại hiếm khi sẵn sàng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Các vấn đề này thường chỉ lộ ra khi chuẩn bị migration.</text><line x1="60.0" y1="410.0" x2="1140.0" y2="410.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="432.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="473.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Trùng lặp và không</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhất quán</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Một nhà cung cấp có nhiều</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">bản ghi; một sản phẩm có</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều tên ở các bộ phận.</text><rect x="279.0" y="134.0" width="204.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu không đầy đủ</text><text x="295.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Thiếu đơn vị tính, mã số</text><text x="295.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thuế, điều khoản thanh</text><text x="295.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">toán; lộ ra khi ERP từ chối</text><text x="295.0" y="297.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">giao dịch.</text><rect x="498.0" y="134.0" width="204.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nằm ở nhiều nơi</text><text x="514.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">CRM, Excel cá nhân,</text><text x="514.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">phần mềm kế toán, kho:</text><text x="514.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">phiên bản nào là đúng?</text><rect x="717.0" y="134.0" width="204.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Định nghĩa không</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhất quán</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cùng một từ, như “tồn kho”</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hay “khách hàng”, được</text><text x="733.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hiểu khác nhau.</text><rect x="936.0" y="134.0" width="204.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tồn kho sổ sách</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">không khớp thực tế</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đưa số sai vào ERP là</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đưa sai lệch vào nền</text><text x="952.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tảng vận hành.</text><rect x="60.0" y="340.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="373.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Dữ liệu kém không tự mất đi khi chuyển vào ERP: nó trở thành nền của mọi báo cáo.</text></svg>
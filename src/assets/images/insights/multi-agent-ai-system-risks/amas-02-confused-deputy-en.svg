<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Chain of three blocks: the user has no right, the compiler uses its own right, the billing file is overwritten; a note sits below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The confused deputy: acting on its own authority</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Norm Hardy’s 1988 example: a tool used its own permission for a request beyond the requester’s authority.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Based on the article and Norm Hardy’s example (1988); not an incident recorded in any specific enterprise.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="300.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="210.0" y="205.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">User: no right to write the</text><text x="210.0" y="226.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">billing file</text><line x1="366.0" y1="210.0" x2="435.0" y2="210.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="444.0,210.0 435.0,214.9 435.0,205.1" fill="var(--p)"/><rect x="450.0" y="160.0" width="300.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="205.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Compiler: can write, uses its</text><text x="600.0" y="226.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">own right</text><line x1="756.0" y1="210.0" x2="825.0" y2="210.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="834.0,210.0 825.0,214.9 825.0,205.1" fill="var(--p)"/><rect x="840.0" y="160.0" width="300.0" height="100.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="990.0" y="215.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Billing file overwritten</text><rect x="60.0" y="300.0" width="1080.0" height="70.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="600.0" y="340.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">The tool never checks whether the request falls within the caller’s authority.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The orchestrator plays the deputy role in this way, and is often the component with the broadest access.</text></svg>
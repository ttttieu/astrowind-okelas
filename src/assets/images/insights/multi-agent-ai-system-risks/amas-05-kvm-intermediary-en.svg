<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Three agents enter a KVM block with three functions, Trace, FindEvidence, Resolve, then organizational knowledge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A deterministic intermediary instead of raw data passing</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">KVM acts as a deterministic intermediary, routing knowledge access through verifiable operations.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">KVM role as the article describes it (Pillar 6); not a detailed product description.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="180.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="150.0" y="203.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent A</text><line x1="246.0" y1="198.0" x2="320.1" y2="264.6" stroke="var(--p)" stroke-width="2.2"/><polygon points="326.0,270.0 317.1,267.9 323.0,261.4" fill="var(--p)"/><rect x="60.0" y="246.0" width="180.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="150.0" y="279.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent B</text><line x1="246.0" y1="274.0" x2="318.0" y2="270.4" stroke="var(--p)" stroke-width="2.2"/><polygon points="326.0,270.0 318.2,274.8 317.8,266.0" fill="var(--p)"/><rect x="60.0" y="322.0" width="180.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="150.0" y="355.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent C</text><line x1="246.0" y1="350.0" x2="320.3" y2="275.7" stroke="var(--p)" stroke-width="2.2"/><polygon points="326.0,270.0 323.5,278.8 317.2,272.5" fill="var(--p)"/><rect x="330.0" y="150.0" width="420.0" height="240.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="360.0" y="183.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">KVM: deterministic intermediary</text><rect x="360.0" y="206.0" width="360.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="540.0" y="233.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Trace</text><rect x="360.0" y="262.0" width="360.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="540.0" y="289.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">FindEvidence</text><rect x="360.0" y="318.0" width="360.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="540.0" y="345.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Resolve</text><line x1="754.0" y1="270.0" x2="806.0" y2="270.0" stroke="var(--p)" stroke-width="2.6"/><polygon points="816.0,270.0 806.0,275.5 806.0,264.5" fill="var(--p)"/><rect x="820.0" y="220.0" width="320.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="980.0" y="276.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational knowledge</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Control the information flow between agents, not just each agent’s own permissions.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Hai thẻ ví dụ: gửi email nhắc nhở nội bộ ở tầng Execute; sửa bản ghi tài chính ở tầng Request." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="548" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Một agent, nhiều tầng quyền khác nhau theo hành động</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai ví dụ theo bài viết cho thấy tầng quyền gắn với hành động, không gắn với agent.</text><line x1="60.0" y1="464.0" x2="1140.0" y2="464.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="486.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ theo bài viết; minh họa, không phải trường hợp khách hàng cụ thể.</text><text x="60.0" y="527.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="220.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="88.0" y="184.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Gửi email nhắc nhở nội bộ</text><rect x="88.0" y="204.0" width="92.4" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="134.2" y="226.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Execute</text><text x="88.0" y="286.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Có thể tự gửi trong ngưỡng đã duyệt.</text><rect x="612.0" y="134.0" width="528.0" height="220.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="640.0" y="184.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Sửa bản ghi tài chính</text><rect x="640.0" y="204.0" width="93.9" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="686.9" y="226.8" font-size="16" font-weight="700" fill="var(--p)" text-anchor="middle">Request</text><text x="640.0" y="286.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Soạn thay đổi; người xem trước khi ghi nhận.</text><rect x="60.0" y="394.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="427.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyền hạn gắn với hành động, không gắn với agent.</text></svg>
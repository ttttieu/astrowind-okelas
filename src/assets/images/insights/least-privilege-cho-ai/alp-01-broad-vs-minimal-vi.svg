<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Hai thanh ngang: thanh quyền rộng ở trên, dài toàn bộ; thanh least privilege ở dưới, ngắn hơn nhiều." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ cấp quyền đủ cho đúng việc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quyền rộng cấp vì tiện lợi là hướng ngược lại với least privilege.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Minh họa khái niệm theo bài viết; không phải số liệu đo lường.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="164.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Quyền rộng, cấp vì tiện lợi</text><rect x="60.0" y="176.0" width="1080.0" height="56.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="84.0" y="210.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Truy cập rộng, không gắn với nhiệm vụ cụ thể</text><text x="60.0" y="294.6" font-size="18" font-weight="700" fill="var(--p)" text-anchor="start">Least privilege</text><rect x="60.0" y="306.0" width="300.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="340.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ đủ cho nhiệm vụ</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyền hạn của agent chỉ nên đủ cho một nhiệm vụ cụ thể, không hơn.</text></svg>
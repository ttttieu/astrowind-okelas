<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Bốn cột bậc thang tăng dần: Read, Request, Recommend, Execute, mỗi cột có mô tả ngắn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn tầng quyền hạn: Read, Request, Recommend, Execute</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn tầng tăng dần về quyền hạn, do bài viết đề xuất.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn tầng theo bài viết; mức quyền cụ thể do từng doanh nghiệp quyết định.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="310.0" width="228.0" height="120.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="78.0" y="348.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Read</text><text x="78.0" y="381.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Truy vấn và phân tích;</text><text x="78.0" y="400.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không thay đổi gì.</text><rect x="300.0" y="250.0" width="228.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="318.0" y="288.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Request</text><text x="318.0" y="321.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Soạn hành động; người xem</text><text x="318.0" y="340.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trước khi gửi.</text><rect x="540.0" y="190.0" width="228.0" height="240.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="558.0" y="228.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Recommend</text><text x="558.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đề xuất kèm lý do; quyết</text><text x="558.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">định ở điểm xác nhận</text><text x="558.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">độc lập.</text><rect x="780.0" y="130.0" width="228.0" height="300.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="798.0" y="168.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="start">Execute</text><text x="798.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tự thực hiện trong ngưỡng</text><text x="798.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đã duyệt; vượt ngưỡng thì</text><text x="798.0" y="240.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quay về Recommend.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tầng quyền được gán theo từng loại hành động, không theo từng agent.</text></svg>
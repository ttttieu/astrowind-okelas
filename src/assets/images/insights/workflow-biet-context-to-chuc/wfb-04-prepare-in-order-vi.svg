<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Năm bước chuẩn bị: chọn quyết định lặp lại mà bối cảnh thay đổi cách xử lý, liệt kê yếu tố bối cảnh người quyết định dùng, xác định chủ sở hữu nguồn và hạn dùng, ghi quyết định và lý do, rồi mới đưa vào hệ thống." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn bị theo thứ tự, hệ thống vào sau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phần khó thường không phải công nghệ, mà là đặt tên chủ sở hữu và duy trì thông tin.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="166.0" r="15" fill="var(--p)"/><text x="90.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chọn một</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định</text><text x="76.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lặp lại, và bối cảnh làm</text><text x="76.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thay đổi cách xử lý.</text><line x1="262.0" y1="166.0" x2="272.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="278.0,166.0 272.0,169.3 272.0,162.7" fill="var(--p)"/><rect x="280.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="310.0" cy="166.0" r="15" fill="var(--p)"/><text x="310.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Liệt kê yếu</text><text x="296.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">tố bối cảnh</text><text x="296.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Hỏi người quyết định</text><text x="296.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">họ thực sự dùng gì, rồi</text><text x="296.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ghi ra.</text><line x1="482.0" y1="166.0" x2="492.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="498.0,166.0 492.0,169.3 492.0,162.7" fill="var(--p)"/><rect x="500.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đặt chủ, nguồn,</text><text x="516.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">hạn dùng</text><text x="516.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Yếu tố chưa có chủ thì</text><text x="516.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chưa dùng.</text><line x1="702.0" y1="166.0" x2="712.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="718.0,166.0 712.0,169.3 712.0,162.7" fill="var(--p)"/><rect x="720.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="750.0" cy="166.0" r="15" fill="var(--p)"/><text x="750.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi quyết định và</text><text x="736.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">lý do</text><text x="736.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Để bối cảnh và tiền lệ</text><text x="736.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tích lũy dần.</text><line x1="922.0" y1="166.0" x2="932.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="938.0,166.0 932.0,169.3 932.0,162.7" fill="var(--p)"/><rect x="940.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="970.0" cy="166.0" r="15" fill="var(--p)"/><text x="970.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đưa vào hệ thống</text><text x="956.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rule đọc phần đã xác</text><text x="956.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhận; người thấy phần</text><text x="956.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">còn lại như evidence.</text><rect x="956.0" y="356.0" width="103.2" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="1007.6" y="372.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Làm sau cùng</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hệ thống đủ nhỏ để giải quyết vấn đề vận hành.</text></svg>
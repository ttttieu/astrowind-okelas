<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Context là thông tin không nằm trong giao dịch nhưng ảnh hưởng cách xử lý: quan hệ và lịch sử, tình trạng hiện tại của tổ chức, ưu tiên đang thay đổi, tiền lệ và ngoại lệ đã chấp nhận; kèm khái niệm Ba của Nonaka và Takeuchi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="664" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Context là gì trong workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Context nằm ngoài giao dịch, nhưng quyết định ý nghĩa của giao dịch.</text><line x1="60.0" y1="602.0" x2="1140.0" y2="602.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="624.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="170.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Context: thông tin không nằm trong bản thân giao dịch, nhưng ảnh hưởng tới ý nghĩa và cách nên xử lý nó.</text><rect x="60.0" y="210.0" width="530.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quan hệ và lịch sử</text><text x="82.0" y="269.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Hợp tác bao lâu, có vấn đề gì trước đây, có phải khách hàng chiến</text><text x="82.0" y="288.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lược không.</text><rect x="610.0" y="210.0" width="530.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="632.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tình trạng hiện tại của tổ chức</text><text x="632.0" y="269.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phòng ban có quá tải không, dự án nào đang cạnh tranh nguồn lực,</text><text x="632.0" y="288.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chính sách mới nào vừa ban hành.</text><rect x="60.0" y="322.0" width="530.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="353.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ưu tiên đang thay đổi</text><text x="82.0" y="381.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Điều quan trọng tháng này có thể khác tháng trước, tùy mục tiêu hoặc</text><text x="82.0" y="400.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">rủi ro đang nổi lên.</text><rect x="610.0" y="322.0" width="530.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="632.0" y="353.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tiền lệ và ngoại lệ đã chấp nhận</text><text x="632.0" y="381.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Các ca tương tự trước đây được xử lý linh hoạt thế nào, và vì lý do gì.</text><rect x="60.0" y="438.0" width="1080.0" height="88.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="468.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khái niệm "Ba" (Nonaka và Takeuchi, 1995)</text><text x="84.0" y="494.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không gian ngữ cảnh chung nơi tri thức được chia sẻ, tạo ra và sử dụng; tách khỏi Ba, thông tin mất phần lớn ý nghĩa thực tiễn.</text><rect x="60.0" y="542.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="575.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chỉ lưu dữ liệu giao dịch là đang xử lý dữ liệu, chưa phải hiểu tình huống.</text></svg>
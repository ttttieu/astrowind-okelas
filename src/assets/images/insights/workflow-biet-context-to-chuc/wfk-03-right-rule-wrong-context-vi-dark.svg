<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Ba tình huống quy tắc đúng về kỹ thuật nhưng sai về bối cảnh: ngưỡng chi tiêu chung, phân loại ưu tiên thấp theo lịch sử, và định tuyến phê duyệt theo sơ đồ tổ chức tới người đang quá tải." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="610" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Quy tắc đúng về kỹ thuật, sai về bối cảnh</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Quy tắc phản ánh bức tranh tĩnh lúc được viết ra; tổ chức thì luôn vận động.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Quy tắc đúng về kỹ thuật</text><text x="600.0" y="141.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Bối cảnh thực tế</text><rect x="60.0" y="152.0" width="480.0" height="98.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="80.0" y="206.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Ngưỡng chi tiêu chung cho toàn công ty</text><line x1="548.0" y1="201.0" x2="579.0" y2="201.0" stroke="#A78BFA" stroke-width="3"/><polygon points="590.0,201.0 579.0,207.1 579.0,194.9" fill="#A78BFA"/><rect x="600.0" y="152.0" width="540.0" height="98.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="206.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Một phòng ban đang cần linh hoạt hơn vì một dự án chiến lược</text><rect x="60.0" y="262.0" width="480.0" height="98.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="80.0" y="316.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Phân loại "ưu tiên thấp" theo lịch sử</text><line x1="548.0" y1="311.0" x2="579.0" y2="311.0" stroke="#A78BFA" stroke-width="3"/><polygon points="590.0,311.0 579.0,317.1 579.0,304.9" fill="#A78BFA"/><rect x="600.0" y="262.0" width="540.0" height="98.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="306.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Một sự kiện bên ngoài hoặc thay đổi quan hệ khách hàng khiến cần</text><text x="620.0" y="326.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">ưu tiên lại</text><rect x="60.0" y="372.0" width="480.0" height="98.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="80.0" y="426.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Định tuyến phê duyệt đúng theo sơ đồ tổ chức</text><line x1="548.0" y1="421.0" x2="579.0" y2="421.0" stroke="#A78BFA" stroke-width="3"/><polygon points="590.0,421.0 579.0,427.1 579.0,414.9" fill="#A78BFA"/><rect x="600.0" y="372.0" width="540.0" height="98.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="416.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Người đó đang quá tải, trong khi người khác đủ thẩm quyền và</text><text x="620.0" y="436.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">rảnh hơn</text><rect x="60.0" y="488.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="521.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Đây không phải lỗi của workflow, mà là giới hạn của hệ thống chỉ dựa vào dữ liệu giao dịch.</text></svg>
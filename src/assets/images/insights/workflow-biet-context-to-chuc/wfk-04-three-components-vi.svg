<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Ba thành phần: nguồn tri thức tổ chức duy trì liên tục, liên kết tình huống với lớp tri thức, và cơ chế điều chỉnh quy tắc có kiểm soát; cần lớp tri thức tổ chức phía sau chứ không phải một tính năng phần mềm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="608" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba thành phần của context-aware workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Context-aware không bỏ quy tắc: nó cho quy tắc tham chiếu một lớp hiểu biết về tổ chức.</text><line x1="60.0" y1="546.0" x2="1140.0" y2="546.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="568.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Nguồn tri thức tổ chức duy trì</text><text x="84.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">liên tục</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không chỉ dữ liệu giao dịch: lưu quan hệ,</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tiền lệ, ưu tiên hiện tại; cập nhật liên tục,</text><text x="84.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không lập trình một lần.</text><rect x="427.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Liên kết tình huống với</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">lớp tri thức</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khi sự kiện xảy ra, tra được quan hệ, tiền lệ,</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ưu tiên liên quan. Knowledge graph lưu cả</text><text x="451.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quan hệ giữa các thông tin.</text><rect x="794.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Điều chỉnh quy tắc có kiểm soát</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi rõ dựa trên context nào, ai xác nhận,</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">evidence gì, để linh hoạt không thành bỏ</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">qua kiểm soát.</text><rect x="60.0" y="386.0" width="1080.0" height="84.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="419.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không phải một tính năng thêm vào phần mềm quản lý quy trình</text><text x="84.0" y="447.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Cần một lớp tri thức tổ chức nằm phía sau và được kết nối với workflow.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Linh hoạt có kiểm soát, không phải bỏ qua quy tắc tùy tiện.</text></svg>
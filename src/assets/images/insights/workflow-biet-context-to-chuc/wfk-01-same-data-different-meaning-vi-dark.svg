<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Hai yêu cầu mua hàng cùng vượt hạn mức 10% được quy tắc xử lý giống hệt nhau, nhưng một yêu cầu đến từ nhà cung cấp lâu năm còn yêu cầu kia từ nhà cung cấp mới đúng lúc ngân sách siết chặt, nên ý nghĩa khác nhau." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Cùng một dữ liệu, hai ý nghĩa khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Người có kinh nghiệm mang theo context mà dữ liệu thô không thể hiện.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Ví dụ minh họa</text><text x="60.0" y="144.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Dữ liệu giao dịch</text><rect x="60.0" y="160.0" width="520.0" height="54.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="320.0" y="192.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Yêu cầu mua hàng vượt hạn mức 10%</text><line x1="320.0" y1="218.0" x2="320.0" y2="235.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="320.0,244.0 315.1,235.0 324.9,235.0" fill="#5B6575"/><rect x="620.0" y="160.0" width="520.0" height="54.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="880.0" y="192.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Yêu cầu mua hàng vượt hạn mức 10%</text><line x1="880.0" y1="218.0" x2="880.0" y2="235.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="880.0,244.0 875.0,235.0 885.0,235.0" fill="#5B6575"/><rect x="60.0" y="248.0" width="1080.0" height="48.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="600.0" y="277.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Quy tắc xử lý hai yêu cầu giống hệt nhau</text><text x="60.0" y="330.8" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start">Context mà dữ liệu không thể hiện</text><rect x="60.0" y="344.0" width="520.0" height="130.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="374.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Yêu cầu thứ nhất</text><text x="82.0" y="410.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhà cung cấp đã hợp tác 5 năm, chưa từng có vấn đề.</text><rect x="620.0" y="344.0" width="520.0" height="130.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="642.0" y="374.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Yêu cầu thứ hai</text><text x="642.0" y="410.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhà cung cấp mới, đúng lúc phòng tài chính siết</text><text x="642.0" y="433.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">ngân sách quý vì một dự án chậm tiến độ.</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Cùng một con số, ý nghĩa khác nhau; workflow chỉ chạy đúng quy tắc sẽ không thấy sự khác biệt.</text></svg>
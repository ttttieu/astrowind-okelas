<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Hai đề nghị mua hàng cùng vượt ngân sách 10% trông giống hệt nhau với rule và cùng chuyển tới giám đốc; bối cảnh khác nhau vì một nhà cung cấp hợp tác tám năm giao đúng hẹn còn một nhà cung cấp mới từng giao trễ hai lô, và khác biệt đó không có trong dữ liệu giao dịch." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Cùng một dữ liệu, ý nghĩa khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khác biệt nằm trong bối cảnh, không nằm trong giao dịch.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="1080.0" height="64.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="80.0" y="152.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Rule thấy</text><text x="80.0" y="177.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hai đề nghị: vượt ngân sách 10% → chuyển giám đốc</text><rect x="60.0" y="214.0" width="526.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="253.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Đề nghị A</text><rect x="84.0" y="276.0" width="478.0" height="56.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="100.0" y="293.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Dữ liệu giao dịch</text><text x="100.0" y="317.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đề nghị mua, vượt hạn mức 10%</text><rect x="84.0" y="346.0" width="478.0" height="100.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="100.0" y="365.6" font-size="11" font-weight="700" fill="var(--a)" text-anchor="start">Bối cảnh (không có trong dữ liệu)</text><text x="100.0" y="389.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nhà cung cấp hợp tác tám năm, giao đúng hẹn; nhu cầu sản</text><text x="100.0" y="410.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">xuất tháng này tăng.</text><rect x="614.0" y="214.0" width="526.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="638.0" y="253.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Đề nghị B</text><rect x="638.0" y="276.0" width="478.0" height="56.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="654.0" y="293.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Dữ liệu giao dịch</text><text x="654.0" y="317.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đề nghị mua, vượt hạn mức 10%</text><rect x="638.0" y="346.0" width="478.0" height="100.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="654.0" y="365.6" font-size="11" font-weight="700" fill="var(--a)" text-anchor="start">Bối cảnh (không có trong dữ liệu)</text><text x="654.0" y="389.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nhà cung cấp mới; hai lô trước giao trễ.</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giám đốc duyệt nhanh một đề nghị, hỏi kỹ đề nghị kia: bối cảnh nằm trong đầu họ.</text></svg>
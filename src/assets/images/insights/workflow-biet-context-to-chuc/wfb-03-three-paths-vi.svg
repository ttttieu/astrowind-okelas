<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Ba con đường: bối cảnh làm dữ liệu có thẩm quyền mà rule đọc được, làm evidence cho người quyết định, và làm tín hiệu để chủ sở hữu rà soát rule; không con đường nào cho hệ thống tự điều chỉnh rule." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba con đường để bối cảnh đi vào workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không con đường nào để hệ thống tự điều chỉnh rule.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="179.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu có thẩm quyền</text><text x="84.0" y="215.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Context làm gì</text><text x="84.0" y="236.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Bối cảnh là đầu vào rule đọc được, có</text><text x="84.0" y="256.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chủ sở hữu và hạn dùng.</text><line x1="84.0" y1="304.0" x2="382.0" y2="304.0" stroke="var(--p)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="327.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Ai quyết định</text><text x="84.0" y="349.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Rule do người có thẩm quyền ban hành</text><text x="84.0" y="393.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Rule có đổi không</text><text x="84.0" y="414.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Không: rule đã nói rõ cách dùng</text><rect x="427.0" y="134.0" width="346.0" height="322.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="170.0" r="15" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="179.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence</text><text x="451.0" y="215.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Context làm gì</text><text x="451.0" y="236.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đi kèm ca ngoại lệ, mỗi thứ kèm nguồn.</text><line x1="451.0" y1="304.0" x2="749.0" y2="304.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="327.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Ai quyết định</text><text x="451.0" y="349.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Con người</text><text x="451.0" y="393.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Rule có đổi không</text><text x="451.0" y="414.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Không</text><rect x="794.0" y="134.0" width="346.0" height="322.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="179.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Tín hiệu rà soát</text><text x="818.0" y="215.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Context làm gì</text><text x="818.0" y="236.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ ra nhóm ca liên tục phải xử lý ngoại lệ</text><text x="818.0" y="256.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vì cùng một yếu tố.</text><line x1="818.0" y1="304.0" x2="1116.0" y2="304.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="327.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Ai quyết định</text><text x="818.0" y="349.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Chủ sở hữu rule</text><text x="818.0" y="393.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Rule có đổi không</text><text x="818.0" y="414.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ khi người có thẩm quyền ban hành</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Linh hoạt đến từ người có thẩm quyền ban hành context và rule, không từ hệ thống tự diễn giải.</text></svg>
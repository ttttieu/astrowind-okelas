<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Bốn nhóm bối cảnh: quan hệ và lịch sử, điều kiện hiện tại của tổ chức, ưu tiên đang thay đổi, tiền lệ và ngoại lệ đã chấp nhận; mỗi yếu tố bối cảnh cần chủ sở hữu, nguồn và thời hạn hiệu lực." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn nhóm bối cảnh, mỗi yếu tố cần chủ và hạn dùng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bối cảnh có hạn dùng và có người chịu trách nhiệm; thiếu hai điều đó, nó cũ đi âm thầm.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="190.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quan hệ và lịch sử</text><text x="76.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thời gian hợp tác, sự cố trước</text><text x="76.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đây, khách hàng chiến lược</text><rect x="335.0" y="134.0" width="255.0" height="190.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Điều kiện hiện tại</text><text x="351.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Năng lực từng bộ phận, tranh</text><text x="351.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chấp nguồn lực, thay đổi</text><text x="351.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chính sách</text><rect x="610.0" y="134.0" width="255.0" height="190.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ưu tiên đang thay đổi</text><text x="626.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mức quan trọng đổi theo tháng</text><text x="626.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc tình huống kinh doanh</text><rect x="885.0" y="134.0" width="255.0" height="190.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tiền lệ và ngoại lệ</text><text x="901.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ca tương tự đã xử lý thế nào và</text><text x="901.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vì sao</text><rect x="60.0" y="342.0" width="1080.0" height="116.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="374.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mỗi yếu tố bối cảnh cần</text><rect x="84.0" y="398.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="254.0" y="425.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Chủ sở hữu</text><rect x="436.0" y="398.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="606.0" y="425.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Nguồn</text><rect x="788.0" y="398.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="425.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Hạn hiệu lực</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bối cảnh cũ nguy hiểm hơn không có bối cảnh.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Context là thông tin không nằm trong giao dịch nhưng ảnh hưởng cách xử lý: quan hệ và lịch sử, tình trạng hiện tại của tổ chức, ưu tiên đang thay đổi, tiền lệ và ngoại lệ đã chấp nhận; kèm khái niệm Ba của Nonaka và Takeuchi." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="664" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Context là gì trong workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Context nằm ngoài giao dịch, nhưng quyết định ý nghĩa của giao dịch.</text><line x1="60.0" y1="602.0" x2="1140.0" y2="602.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="624.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="62.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="600.0" y="170.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Context: thông tin không nằm trong bản thân giao dịch, nhưng ảnh hưởng tới ý nghĩa và cách nên xử lý nó.</text><rect x="60.0" y="210.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Quan hệ và lịch sử</text><text x="82.0" y="269.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Hợp tác bao lâu, có vấn đề gì trước đây, có phải khách hàng chiến</text><text x="82.0" y="288.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">lược không.</text><rect x="610.0" y="210.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Tình trạng hiện tại của tổ chức</text><text x="632.0" y="269.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Phòng ban có quá tải không, dự án nào đang cạnh tranh nguồn lực,</text><text x="632.0" y="288.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">chính sách mới nào vừa ban hành.</text><rect x="60.0" y="322.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="353.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Ưu tiên đang thay đổi</text><text x="82.0" y="381.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Điều quan trọng tháng này có thể khác tháng trước, tùy mục tiêu hoặc</text><text x="82.0" y="400.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">rủi ro đang nổi lên.</text><rect x="610.0" y="322.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="353.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Tiền lệ và ngoại lệ đã chấp nhận</text><text x="632.0" y="381.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Các ca tương tự trước đây được xử lý linh hoạt thế nào, và vì lý do gì.</text><rect x="60.0" y="438.0" width="1080.0" height="88.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="468.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Khái niệm "Ba" (Nonaka và Takeuchi, 1995)</text><text x="84.0" y="494.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Không gian ngữ cảnh chung nơi tri thức được chia sẻ, tạo ra và sử dụng; tách khỏi Ba, thông tin mất phần lớn ý nghĩa thực tiễn.</text><rect x="60.0" y="542.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="575.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Chỉ lưu dữ liệu giao dịch là đang xử lý dữ liệu, chưa phải hiểu tình huống.</text></svg>
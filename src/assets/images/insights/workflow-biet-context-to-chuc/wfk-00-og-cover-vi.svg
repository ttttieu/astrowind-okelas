<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Bốn bậc của workflow: số hóa, event-driven, AI phân loại và định tuyến, rồi context-aware workflow ở bậc cao nhất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Khi workflow biết context của tổ chức</text><rect x="60.0" y="494.0" width="255.0" height="96.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="78.0" y="531.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Workflow số hóa</text><rect x="335.0" y="434.0" width="255.0" height="156.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="353.0" y="471.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Event-driven</text><text x="353.0" y="498.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Quy tắc định sẵn</text><rect x="610.0" y="374.0" width="255.0" height="216.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="628.0" y="411.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI phân loại, định tuyến</text><text x="628.0" y="438.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Quy tắc định sẵn</text><rect x="885.0" y="314.0" width="255.0" height="276.0" rx="12" fill="var(--a)"/><text x="903.0" y="345.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="start">Cao nhất</text><text x="903.0" y="381.1" font-size="20" font-weight="700" fill="var(--wh)" text-anchor="start">Context-aware</text><text x="903.0" y="425.0" font-size="14" font-weight="400" fill="var(--wh)" text-anchor="start">Biết khi nào quy tắc cần được</text><text x="903.0" y="444.9" font-size="14" font-weight="400" fill="var(--wh)" text-anchor="start">áp dụng linh hoạt</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Three field cards: software engineering, mathematics, scientific reasoning; each with one result cited in the article." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI advances fastest where right and wrong are clear</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three fields the article identifies as showing notable results; the common thread is clear measurement.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Based on the article and the publications it cites; each source has not been independently re-checked.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Software engineering</text><text x="80.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SWE-bench Verified: agent success on real</text><text x="80.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">GitHub issues rose from 60% to nearly 100%</text><text x="80.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">in one year.</text><rect x="424.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="444.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Mathematics</text><text x="444.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">At the 2025 IMO, a Google DeepMind model</text><text x="444.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">(Gemini in Deep Think mode) reached</text><text x="444.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">gold-medal standard on a proof-based test.</text><rect x="788.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="808.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Scientific reasoning</text><text x="808.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">OpenAI’s FrontierScience benchmark</text><text x="808.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">(December 2025) covers physics, chemistry</text><text x="808.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and biology; OpenAI said top models were</text><text x="808.0" y="265.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">starting to accelerate real research.</text><rect x="60.0" y="322.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="353.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Common thread: clear right-or-wrong criteria and objective measurement. Ambiguous judgment and human</text><text x="600.0" y="377.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">relationships still show real limits.</text></svg>
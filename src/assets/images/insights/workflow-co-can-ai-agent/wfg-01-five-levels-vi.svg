<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 662" width="1200" height="662" role="img" aria-label="Năm mức dùng AI trong workflow: mức 0 chỉ rule, mức 1 AI diễn giải đầu vào, mức 2 AI chuẩn bị evidence theo quy trình cố định, mức 3 agent hẹp tự chọn nguồn tra cứu trong phạm vi cho phép, mức 4 agent tự hành thực thi không được khuyến nghị; nên chọn mức thấp nhất giải quyết được vấn đề." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="662" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm mức dùng AI trong workflow, chọn mức vừa đủ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi mức bỏ thêm một phần kiểm soát định sẵn, nên cần lý do cụ thể để lên mức.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Mức và cách dùng AI</text><text x="646.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Đường đi</text><rect x="60.0" y="158.0" width="570.0" height="66.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="191.0" r="15" fill="var(--p)"/><text x="92.0" y="196.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">0</text><text x="122.0" y="185.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mức 0 · Chỉ rule</text><text x="122.0" y="208.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đơn dưới hạn mức, đủ thông tin thì chuyển bước tiếp</text><rect x="646.0" y="158.0" width="494.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="662.0" y="196.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Định sẵn, dễ kiểm thử</text><line x1="634.0" y1="191.0" x2="636.0" y2="191.0" stroke="var(--gm)" stroke-width="2"/><polygon points="642.0,191.0 636.0,194.3 636.0,187.7" fill="var(--gm)"/><rect x="60.0" y="234.0" width="570.0" height="66.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="267.0" r="15" fill="var(--p)"/><text x="92.0" y="272.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="261.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mức 1 · AI diễn giải đầu vào</text><text x="122.0" y="284.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đọc email đặt hàng, điền trường; rule kiểm tra</text><rect x="646.0" y="234.0" width="494.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="662.0" y="272.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Định sẵn, dễ kiểm thử</text><line x1="634.0" y1="267.0" x2="636.0" y2="267.0" stroke="var(--gm)" stroke-width="2"/><polygon points="642.0,267.0 636.0,270.3 636.0,263.7" fill="var(--gm)"/><rect x="60.0" y="310.0" width="570.0" height="66.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="343.0" r="15" fill="var(--p)"/><text x="92.0" y="348.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="122.0" y="337.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mức 2 · AI chuẩn bị evidence</text><text x="122.0" y="360.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình cố định gom hồ sơ cho người duyệt</text><rect x="646.0" y="310.0" width="494.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="662.0" y="348.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Định sẵn, dễ kiểm thử</text><line x1="634.0" y1="343.0" x2="636.0" y2="343.0" stroke="var(--gm)" stroke-width="2"/><polygon points="642.0,343.0 636.0,346.3 636.0,339.7" fill="var(--gm)"/><rect x="60.0" y="386.0" width="570.0" height="66.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="419.0" r="15" fill="var(--a)"/><text x="92.0" y="424.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="413.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mức 3 · Agent hẹp</text><text x="122.0" y="436.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tự chọn nguồn và thứ tự tra cứu để chuẩn bị evidence</text><rect x="646.0" y="386.0" width="494.0" height="66.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="662.0" y="424.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">AI chọn trong phạm vi cho phép</text><line x1="634.0" y1="419.0" x2="636.0" y2="419.0" stroke="var(--gm)" stroke-width="2"/><polygon points="642.0,419.0 636.0,422.3 636.0,415.7" fill="var(--gm)"/><rect x="60.0" y="462.0" width="570.0" height="66.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="92.0" cy="495.0" r="15" fill="var(--gm)"/><text x="92.0" y="500.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="122.0" y="489.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mức 4 · Agent tự hành thực thi</text><text x="122.0" y="512.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tự tạo và chạy hành động</text><rect x="646.0" y="462.0" width="494.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="662.0" y="500.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không khuyến nghị: hành động chỉ chạy khi rule cho phép</text><line x1="634.0" y1="495.0" x2="636.0" y2="495.0" stroke="var(--gm)" stroke-width="2"/><polygon points="642.0,495.0 636.0,498.3 636.0,491.7" fill="var(--gm)"/><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chọn mức thấp nhất giải quyết được vấn đề.</text></svg>
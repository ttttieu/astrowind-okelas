<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba quy trình minh họa: duyệt đơn mua theo hạn mức chọn mức 0, nhận đơn qua email và bản scan chọn mức 1 và 2, khiếu nại chất lượng có thể cân nhắc mức 3 với agent hẹp chỉ đọc." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba quy trình, ba mức: chỉ một cần agent hẹp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Ba tình huống minh họa cho ba mức khác nhau.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Tình huống minh họa, không phải số liệu hay case khách hàng.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Quy trình</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Chỗ đang chậm</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Mức chọn</text><rect x="60.0" y="158.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="209.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Duyệt đơn mua theo hạn mức</text><rect x="410.0" y="158.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="199.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Các bước rõ, ngưỡng do người có</text><text x="426.0" y="218.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">thẩm quyền ban hành</text><rect x="800.0" y="158.0" width="340.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="209.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Mức 0: chỉ rule</text><line x1="784.0" y1="204.0" x2="790.0" y2="204.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,204.0 790.0,207.3 790.0,200.7" fill="#5B6575"/><rect x="60.0" y="262.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="313.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhận đơn qua email và bản scan</text><rect x="410.0" y="262.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="303.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Đọc và nhập lại; đơn bị giữ cần cùng một</text><text x="426.0" y="322.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">bộ hồ sơ</text><rect x="800.0" y="262.0" width="340.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="313.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Mức 1, thêm mức 2 cho đơn bị giữ</text><line x1="784.0" y1="308.0" x2="790.0" y2="308.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,308.0 790.0,311.3 790.0,304.7" fill="#5B6575"/><rect x="60.0" y="366.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="417.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Khiếu nại chất lượng</text><rect x="410.0" y="366.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="417.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Nguồn cần tra tiếp theo tùy kết quả từng bước</text><rect x="800.0" y="366.0" width="340.0" height="92.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="417.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Mức 3: agent hẹp, chỉ đọc</text><line x1="784.0" y1="412.0" x2="790.0" y2="412.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,412.0 790.0,415.3 790.0,408.7" fill="#5B6575"/><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Chỉ một trong ba có chỗ cho agent, và agent vẫn chỉ chuẩn bị evidence.</text></svg>
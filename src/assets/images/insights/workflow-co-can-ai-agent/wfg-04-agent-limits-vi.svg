<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-label="Sáu giới hạn khi dùng agent hẹp: chỉ đọc, nguồn và số bước giới hạn, đầu ra có cấu trúc, dấu vết đầy đủ, điểm dừng chuyển cho người, và người chịu trách nhiệm rà soát định kỳ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="508" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Nếu dùng agent hẹp: sáu giới hạn cần đặt trước</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giới hạn đặt trước giúp kiểm soát phần biến thiên của agent.</text><line x1="60.0" y1="446.0" x2="1140.0" y2="446.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="468.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="534.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="169.0" r="15" fill="var(--p)"/><text x="90.0" y="174.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="118.0" y="162.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ đọc</text><text x="118.0" y="185.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không ghi, không gửi, không phê duyệt.</text><rect x="60.0" y="216.0" width="534.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="251.0" r="15" fill="var(--p)"/><text x="90.0" y="256.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="118.0" y="244.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nguồn và số bước có giới hạn</text><text x="118.0" y="267.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Danh sách nguồn cho phép, số bước tối đa mỗi ca.</text><rect x="60.0" y="298.0" width="534.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="333.0" r="15" fill="var(--p)"/><text x="90.0" y="338.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="118.0" y="326.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đầu ra có cấu trúc</text><text x="118.0" y="349.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nguồn đã tra, điều tìm thấy và không thấy, độ chắc chắn.</text><rect x="606.0" y="134.0" width="534.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="636.0" cy="169.0" r="15" fill="var(--p)"/><text x="636.0" y="174.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="664.0" y="162.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Dấu vết đầy đủ</text><text x="664.0" y="185.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi lần chạy ghi lại các bước đã đi để giải trình.</text><rect x="606.0" y="216.0" width="534.0" height="70.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="251.0" r="15" fill="var(--a)"/><text x="636.0" y="256.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="664.0" y="244.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm dừng rõ ràng</text><text x="664.0" y="267.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Ca không chắc chắn hoặc ngoài phạm vi: chuyển cho người.</text><rect x="606.0" y="298.0" width="534.0" height="70.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="333.0" r="15" fill="var(--a)"/><text x="636.0" y="338.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="664.0" y="326.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Người chịu trách nhiệm</text><text x="664.0" y="349.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Rà soát định kỳ chất lượng hồ sơ do agent tạo ra.</text><rect x="60.0" y="386.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="419.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giới hạn không làm agent kém đi, mà làm nó quản trị được.</text></svg>
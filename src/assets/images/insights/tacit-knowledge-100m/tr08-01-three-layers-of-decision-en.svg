<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 663" width="1200" height="663" role="img" aria-label="Three layers of a decision: the conclusion travels, while the reason and conditions stay in the decision-maker’s head." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="663" class="bgr"/><rect x="60" y="26" width="196" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">ILLUSTRATIVE SCENARIO</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Three layers of a decision, and which one survives</text><g transform="translate(0 140)"><rect x="60" y="0" width="1080" height="131" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">LAYER 1 · CONCLUSION</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">“100 m”</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Short, memorable, easy to repeat. This part travels.</text><rect x="60" y="145" width="1080" height="131" rx="16" class="bp"/><text x="82" y="180" font-size="13" font-weight="600" class="tp">LAYER 2 · REASON</text><text x="82" y="215" font-size="22" font-weight="600" class="tp">Why that figure, and what it protects</text><text x="82" y="247" font-size="17" font-weight="400" class="mut">Long, tied to a person and a context. This part stays behind.</text><rect x="60" y="290" width="1080" height="131" rx="16" class="bp"/><text x="82" y="325" font-size="13" font-weight="600" class="tp">LAYER 3 · CONDITIONS</text><text x="82" y="360" font-size="22" font-weight="600" class="tp">For which product, design and system it holds</text><text x="82" y="392" font-size="17" font-weight="400" class="mut">Rarely written down. This part stays behind.</text></g><text x="60" y="595" font-size="13" font-weight="400" class="mut">Illustrative scenario, not a real case or measured data.</text><text x="60" y="615" font-size="13" font-weight="400" class="mut">Governance perspective only; not compliance or legal advice.</text></svg>

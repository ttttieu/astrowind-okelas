<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" role="img" aria-label="Four hidden costs of inadequate data preparation: timeline delays, decisions on wrong data, costlier fixes after go-live and lost confidence in the system, the hardest to recover." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="502" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four hidden costs of inadequate data preparation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Data problems rarely appear as named project risks; they show up as other costs.</text><line x1="60.0" y1="418.0" x2="1140.0" y2="418.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="440.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Costs from the article’s analysis, not measured data.</text><text x="60.0" y="481.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="80.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Timeline delays</text><text x="80.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cleaning overruns push go-live</text><text x="80.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">back, adding personnel,</text><text x="80.0" y="275.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">implementation and</text><text x="80.0" y="295.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">opportunity costs.</text><rect x="334.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="354.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Decisions on</text><text x="354.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">wrong data</text><text x="354.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Inaccurate reports lead leaders</text><text x="354.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">to abandon ERP reporting or act</text><text x="354.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">on bad numbers.</text><rect x="608.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="628.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Costlier fixes later</text><text x="628.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Faulty records may already be</text><text x="628.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tied to many live transactions.</text><rect x="882.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="902.0" y="150.0" width="131.4" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="967.7" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Hardest to recover</text><text x="902.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lost confidence</text><text x="902.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Users stop relying on ERP for</text><text x="902.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">decisions; both the data and the</text><text x="902.0" y="275.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trust are hard to rebuild.</text><rect x="60.0" y="347.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="380.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The cost of data preparation is always paid; the question is before go-live or after.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="A chain of three blocks: a routine software update, an integrated agentic capability, and a block with a question mark about whether the organization knows and has switched it on." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agentic features may already be in your software</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Agentic features often arrive through routine vendor updates, so they can be active without a deliberate decision.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual illustration based on the article; does not describe any specific software or vendor.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="210.0" width="300.0" height="120.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="210.0" y="276.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Routine software update</text><line x1="368.0" y1="270.0" x2="433.0" y2="270.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="442.0,270.0 433.0,274.9 433.0,265.1" fill="var(--p)"/><rect x="450.0" y="210.0" width="300.0" height="120.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="276.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Agentic capability integrated</text><line x1="758.0" y1="270.0" x2="823.0" y2="270.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="832.0,270.0 823.0,274.9 823.0,265.1" fill="var(--p)"/><rect x="840.0" y="210.0" width="300.0" height="120.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="990.0" y="265.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Does the organization know,</text><text x="990.0" y="287.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">and has it been switched on?</text><rect x="60.0" y="386.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="419.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The real question is whether the organization can control the agents already present.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Three numbered rows of self-assessment questions, each with a checkbox." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three questions to locate where your organization stands</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Answer each question honestly; if you cannot answer all three, the gap needs closing.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three questions are the only self-assessment criteria the article offers; not a scoring scale.</text><text x="60.0" y="629.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="1080.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="218.0" r="15" fill="var(--p)"/><text x="100.0" y="223.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><rect x="150.0" y="205.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><text x="200.0" y="224.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Does any enterprise software you use let AI act without confirming each step?</text><rect x="60.0" y="276.0" width="1080.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="318.0" r="15" fill="var(--gm)"/><text x="100.0" y="323.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><rect x="150.0" y="305.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><text x="200.0" y="324.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Who knows exactly what authority that feature has been granted?</text><rect x="60.0" y="376.0" width="1080.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="418.0" r="15" fill="var(--p)"/><text x="100.0" y="423.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><rect x="150.0" y="405.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><text x="200.0" y="424.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">If the AI acted incorrectly once, how long would it take to notice and fix it?</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Uncertainty on these three questions points to a gap between how you think AI is used and how it actually is.</text></svg>
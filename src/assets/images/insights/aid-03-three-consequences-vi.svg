<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 518" width="1200" height="518" role="img" aria-label="Ba hệ quả của document explosion: không biết phiên bản nào có hiệu lực, tìm kiếm mất nhiều thời gian hơn, và chất lượng tài liệu không được kiểm soát." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="518" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba hệ quả cụ thể của document explosion</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Lượng tài liệu tăng nhanh hơn khả năng giữ chất lượng và khả năng tìm kiếm.</text><line x1="60.0" y1="434.0" x2="1140.0" y2="434.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="456.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="497.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--a)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không biết phiên bản nào đang</text><text x="122.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">có hiệu lực</text><line x1="82.0" y1="230.0" x2="386.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI giúp tạo bản sửa đổi và tóm tắt nhanh</text><text x="82.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hơn nhiều, nhưng không ai xác nhận bản</text><text x="82.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nào đang có hiệu lực. Khi audit hỏi, rất khó</text><text x="82.0" y="320.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trả lời.</text><rect x="426.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--a)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tìm kiếm mất nhiều</text><text x="488.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">thời gian hơn</text><line x1="448.0" y1="230.0" x2="752.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khối lượng tài liệu tăng trong khi cấu trúc</text><text x="448.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không đổi. Nhân lên với số lần tìm mỗi ngày</text><text x="448.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">của cả tổ chức, giá trị của tài liệu giảm đi.</text><rect x="792.0" y="134.0" width="348.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chất lượng tài liệu không được</text><text x="854.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">kiểm soát</text><line x1="814.0" y1="230.0" x2="1118.0" y2="230.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="261.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tốc độ tạo tăng mà quy trình review không</text><text x="814.0" y="280.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đổi: review thành điểm nghẽn, hoặc bị bỏ</text><text x="814.0" y="300.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">qua để theo kịp.</text><rect x="60.0" y="364.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="397.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tài liệu tăng nhanh hơn khả năng giữ chất lượng, mức độ liên quan và khả năng tìm kiếm.</text></svg>
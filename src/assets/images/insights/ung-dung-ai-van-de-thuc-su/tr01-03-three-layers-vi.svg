<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 567" width="1200" height="567" role="img" aria-label="Ba tầng xếp chồng: công nghệ, con người, hệ thống tổ chức; tầng hệ thống tổ chức là tầng sâu nhất." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="567" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba tầng vấn đề; tầng sâu nhất ít được nhìn thấy</text><g transform="translate(0 108)"><rect x="60" y="0" width="1080" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">TẦNG 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Công nghệ</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Sẽ cải thiện dần theo thời gian.</text><rect x="60" y="147" width="1080" height="131" rx="16" class="bb"/><text x="82" y="182" font-size="13" font-weight="600" class="mut">TẦNG 2</text><text x="82" y="217" font-size="22" font-weight="600" class="tx">Con người</text><text x="82" y="249" font-size="17" font-weight="400" class="mut">Cần đào tạo và thói quen dùng đúng.</text><rect x="60" y="294" width="1080" height="131" rx="16" class="bp"/><text x="82" y="329" font-size="13" font-weight="600" class="tp">TẦNG 3</text><text x="82" y="364" font-size="22" font-weight="600" class="tp">Hệ thống tổ chức</text><text x="82" y="396" font-size="17" font-weight="400" class="mut">Quy trình, tri thức, trách nhiệm và kiểm soát. Tầng sâu nhất và khó thấy nhất.</text></g></svg>

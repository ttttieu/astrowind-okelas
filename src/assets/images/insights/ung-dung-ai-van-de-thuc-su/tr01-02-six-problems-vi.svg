<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Sáu thẻ: AI tạo thêm việc, rác AI, thiếu phán đoán, sai sót lan truyền, thiếu đào tạo và kiểm soát, cắt giảm nhân sự không đồng nghĩa với tăng năng suất." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Sáu vấn đề khi doanh nghiệp vội triển khai AI</text><g transform="translate(0 110.4)"><rect x="60" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Tạo thêm việc</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Kết quả AI cần được kiểm tra, sửa và</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">đối chiếu.</text><rect x="426.6666666666667" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="448.6666666666667" y="35" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 2</text><text x="448.6666666666667" y="70" font-size="22" font-weight="600" class="tx">“Rác AI”</text><text x="448.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Nội dung nhiều nhưng ít giá trị, làm</text><text x="448.6666666666667" y="126" font-size="17" font-weight="400" class="mut">tăng tải đọc và lọc.</text><rect x="793.3333333333334" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="815.3333333333334" y="35" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 3</text><text x="815.3333333333334" y="70" font-size="22" font-weight="600" class="tx">Thiếu phán đoán</text><text x="815.3333333333334" y="102" font-size="17" font-weight="400" class="mut">AI viết trôi chảy nhưng không tự biết</text><text x="815.3333333333334" y="126" font-size="17" font-weight="400" class="mut">điều gì đúng với bối cảnh.</text><rect x="60" y="175" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="82" y="210" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 4</text><text x="82" y="245" font-size="22" font-weight="600" class="tx">Sai sót lan truyền</text><text x="82" y="277" font-size="17" font-weight="400" class="mut">Một lỗi chưa bị phát hiện đi theo tài</text><text x="82" y="301" font-size="17" font-weight="400" class="mut">liệu sang nhiều nơi.</text><rect x="426.6666666666667" y="175" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="448.6666666666667" y="210" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 5</text><text x="448.6666666666667" y="245" font-size="22" font-weight="600" class="tx">Thiếu đào tạo và kiểm soát</text><text x="448.6666666666667" y="277" font-size="17" font-weight="400" class="mut">Người dùng chưa được hướng dẫn</text><text x="448.6666666666667" y="301" font-size="17" font-weight="400" class="mut">cách dùng và cách kiểm.</text><rect x="793.3333333333334" y="175" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="815.3333333333334" y="210" font-size="13" font-weight="600" class="mut">VẤN ĐỀ 6</text><text x="815.3333333333334" y="245" font-size="22" font-weight="600" class="tx">Cắt người ≠ tăng năng suất</text><text x="815.3333333333334" y="277" font-size="17" font-weight="400" class="mut">Đầu tư AI kèm giảm nhân sự không</text><text x="815.3333333333334" y="301" font-size="17" font-weight="400" class="mut">tự động tăng năng suất.</text></g></svg>

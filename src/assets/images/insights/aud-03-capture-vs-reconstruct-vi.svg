<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Hai luồng: bằng chứng được ghi nhận ngay trong vận hành thì trước audit chỉ cần tổng hợp; không được ghi nhận thì phải tái tạo hồ sơ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng ghi trong vận hành, hay tái tạo sau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cùng một công việc, nhưng thời điểm ghi nhận quyết định việc chuẩn bị là tổng hợp hay thu thập.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi nhận trong vận hành</text><rect x="84.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="239.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Thực hiện công việc</text><line x1="398.0" y1="226.0" x2="432.0" y2="226.0" stroke="var(--s)" stroke-width="2"/><polygon points="440.0,226.0 432.0,230.4 432.0,221.6" fill="var(--s)"/><rect x="444.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="599.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bằng chứng được ghi nhận ngay</text><line x1="758.0" y1="226.0" x2="792.0" y2="226.0" stroke="var(--s)" stroke-width="2"/><polygon points="800.0,226.0 792.0,230.4 792.0,221.6" fill="var(--s)"/><rect x="804.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="959.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước audit: tổng hợp</text><rect x="60.0" y="290.0" width="1080.0" height="140.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="327.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Thu thập sau</text><rect x="84.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="239.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Thực hiện công việc</text><line x1="398.0" y1="382.0" x2="432.0" y2="382.0" stroke="var(--a)" stroke-width="2"/><polygon points="440.0,382.0 432.0,386.4 432.0,377.6" fill="var(--a)"/><rect x="444.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="599.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bằng chứng chưa được ghi nhận</text><line x1="758.0" y1="382.0" x2="792.0" y2="382.0" stroke="var(--a)" stroke-width="2"/><polygon points="800.0,382.0 792.0,386.4 792.0,377.6" fill="var(--a)"/><rect x="804.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="959.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước audit: tái tạo hồ sơ</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Việc tái tạo bằng chứng là phần tốn thời gian nhất và rủi ro nhất của chuẩn bị audit.</text></svg>
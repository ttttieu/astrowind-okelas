<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Four conditions for SOPs to work: they reflect reality, are accessible at the point of execution, non-compliance generates feedback, and they are kept alive." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four conditions for SOPs to work in practice</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Drawn from the three reasons and the traits of executable SOPs.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conditions as set out in the article; a discussion aid, not a certified methodology. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">The SOP reflects reality</text><text x="122.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not the ideal, but what actually needs to happen under real</text><text x="122.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">operating conditions.</text><rect x="606.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--p)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Accessible at the point of execution</text><text x="668.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Right time, right device, right format.</text><rect x="60.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="306.0" r="15" fill="var(--p)"/><text x="94.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="309.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Non-compliance generates feedback</text><text x="122.0" y="337.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not necessarily punishment, but a way for the person executing</text><text x="122.0" y="356.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">to know when they deviate.</text><rect x="606.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="306.0" r="15" fill="var(--p)"/><text x="640.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="309.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">The SOP is kept alive</text><text x="668.0" y="337.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not written once and left; reviewed when conditions change.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">SOPs need to be designed as operational tools, not only as compliance documents.</text></svg>
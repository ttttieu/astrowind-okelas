<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Ba bước trên trục thời gian được đánh số: trước khi vận hành, gán chủ sở hữu, xem lại theo lịch." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba bước đưa hồ sơ quyền hạn vào thực tế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hồ sơ phải có trước khi vận hành, có chủ sở hữu cụ thể và được xem lại theo lịch.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba bước theo bài viết; trục thời gian và nhãn bước là cách trình bày của OKELAS.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><line x1="120.0" y1="230.0" x2="1080.0" y2="230.0" stroke="var(--gm)" stroke-width="3"/><circle cx="220.0" cy="230.0" r="15" fill="var(--gm)"/><text x="220.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="220.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước khi vận hành</text><text x="220.0" y="358.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Lập hồ sơ trước khi agent được đưa</text><text x="220.0" y="379.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">vào hoạt động.</text><circle cx="600.0" cy="230.0" r="15" fill="var(--p)"/><text x="600.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="600.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Gán chủ sở hữu</text><text x="600.0" y="358.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Mỗi agent có một chủ sở hữu cụ thể</text><text x="600.0" y="379.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">chịu trách nhiệm.</text><circle cx="980.0" cy="230.0" r="15" fill="var(--gm)"/><text x="980.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="980.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Xem lại theo lịch</text><text x="980.0" y="358.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Xem lại định kỳ và khi nhiệm vụ thay</text><text x="980.0" y="379.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">đổi, không chỉ sau sự cố.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hồ sơ phải có trước khi đưa agent vào vận hành, không chỉ sau sự cố.</text></svg>
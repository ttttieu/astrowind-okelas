<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai ô nối bằng mũi tên: an ninh mạng bảo vệ hệ thống, quản trị tri thức giúp tổ chức hiểu và kiểm soát hệ thống đó; lớp này không thay thế lớp kia." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">An ninh mạng và quản trị tri thức bổ sung cho nhau</text><g transform="translate(0 118.2)"><rect x="60" y="0" width="508" height="155" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">AN NINH MẠNG</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Bảo vệ hệ thống</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Phân quyền, xác thực đa yếu tố, quản lý thiết bị đầu cuối,</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">giám sát.</text><rect x="632" y="0" width="508" height="155" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">QUẢN TRỊ TRI THỨC</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Giúp hiểu và kiểm soát hệ thống</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Vì sao có từng lớp, bảo vệ gì, nối nhau ra sao, và khi một</text><text x="654" y="126" font-size="17" font-weight="400" class="mut">lớp thất bại thì ảnh hưởng tới đâu.</text><line x1="578" y1="77.5" x2="610" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 68.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="183" width="1080" height="73" rx="16" class="bi"/><text x="82" y="227" font-size="22" font-weight="600" class="ti">Lớp này không thay được lớp kia.</text></g><text x="60" y="408.2" font-size="13" font-weight="400" class="mut">Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text></svg>

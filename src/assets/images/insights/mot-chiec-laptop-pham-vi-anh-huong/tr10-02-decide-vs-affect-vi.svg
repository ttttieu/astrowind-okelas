<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai ô với dấu không bằng: quyền được phép quyết định trên sơ đồ tổ chức khác với những gì hệ thống cho phép một người tác động trong thực tế." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><rect x="60" y="26" width="182.3623046875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Được phép quyết định khác với có thể tác động</text><g transform="translate(0 141.8)"><rect x="60" y="0" width="508" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">ĐƯỢC PHÉP QUYẾT ĐỊNH</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Quyền trên sơ đồ tổ chức</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Duyệt chi, ký hồ sơ, giữ khóa bí mật.</text><rect x="632" y="0" width="508" height="131" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">HỆ THỐNG CHO PHÉP TÁC ĐỘNG</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Quyền thực tế trong kỹ thuật</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Đăng nhập máy chủ, đọc cấu hình, triển khai dịch vụ.</text><text x="600" y="77.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><rect x="60" y="159" width="1080" height="73" rx="16" class="bi"/><text x="82" y="203" font-size="22" font-weight="600" class="ti">Quyền hạn thực tế được đo ở cột bên phải, không phải bên trái.</text></g><text x="60" y="407.8" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text><text x="60" y="427.8" font-size="13" font-weight="400" class="mut">Ví dụ chung, không mô tả hệ thống của Binance.</text></svg>

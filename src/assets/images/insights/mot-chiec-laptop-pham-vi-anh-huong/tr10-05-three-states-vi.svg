<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba thẻ: đã xác minh, có khả năng và chưa biết, kèm điều kiện của từng trạng thái; không biến quan hệ kỹ thuật thành kết luận chắc chắn." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Mỗi kết luận về rủi ro nên gắn một trong ba trạng thái</text><g transform="translate(0 118.2)"><rect x="60" y="0" width="349.3333333333333" height="155" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">TRẠNG THÁI 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Đã xác minh</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Có bằng chứng: cấu hình, nhật ký,</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">quyền đã cấp.</text><rect x="425.3333333333333" y="0" width="349.3333333333333" height="155" rx="16" class="bp"/><text x="447.3333333333333" y="35" font-size="13" font-weight="600" class="tp">TRẠNG THÁI 2</text><text x="447.3333333333333" y="70" font-size="22" font-weight="600" class="tp">Có khả năng</text><text x="447.3333333333333" y="102" font-size="17" font-weight="400" class="mut">Có quan hệ kỹ thuật, chưa xác minh</text><text x="447.3333333333333" y="126" font-size="17" font-weight="400" class="mut">khả năng khai thác.</text><rect x="790.6666666666666" y="0" width="349.3333333333333" height="155" rx="16" class="bg"/><text x="812.6666666666666" y="35" font-size="13" font-weight="600" class="mut">TRẠNG THÁI 3</text><text x="812.6666666666666" y="70" font-size="22" font-weight="600" class="tx">Chưa biết</text><text x="812.6666666666666" y="102" font-size="17" font-weight="400" class="mut">Thiếu dữ liệu, hoặc quan hệ chưa</text><text x="812.6666666666666" y="126" font-size="17" font-weight="400" class="mut">được mô hình hóa.</text><rect x="60" y="183" width="1080" height="73" rx="16" class="bi"/><text x="82" y="227" font-size="22" font-weight="600" class="ti">Không biến một quan hệ kỹ thuật thành kết luận chắc chắn.</text></g><text x="60" y="408.2" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Chuỗi năm mắt xích từ con người, thiết bị đầu cuối, dịch vụ hoặc container, hệ thống xử lý đến tài sản và hồ sơ, mỗi mắt xích kèm một câu hỏi tổ chức cần trả lời." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="580" class="bgr"/><rect x="60" y="26" width="182.3623046875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Chuỗi tác động từ một con người tới tài sản của tổ chức</text><g transform="translate(0 140)"><rect x="60" y="0" width="322.6666666666667" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">MẮT XÍCH 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Con người</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Người này nắm gì, được cấp gì?</text><rect x="438.6666666666667" y="0" width="322.6666666666667" height="131" rx="16" class="bb"/><text x="460.6666666666667" y="35" font-size="13" font-weight="600" class="mut">MẮT XÍCH 2</text><text x="460.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Thiết bị đầu cuối</text><text x="460.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Thiết bị giữ phiên đăng nhập nào?</text><rect x="817.3333333333334" y="0" width="322.6666666666667" height="131" rx="16" class="bb"/><text x="839.3333333333334" y="35" font-size="13" font-weight="600" class="mut">MẮT XÍCH 3</text><text x="839.3333333333334" y="70" font-size="22" font-weight="600" class="tx">Dịch vụ, container</text><text x="839.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Từ đây gọi được dịch vụ nào?</text><line x1="388.6666666666667" y1="65.5" x2="420.6666666666667" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M418.6666666666667 56.5 l14 9 l-14 9z" class="arf"/><line x1="767.3333333333334" y1="65.5" x2="799.3333333333334" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M797.3333333333334 56.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="187" width="512" height="131" rx="16" class="bb"/><text x="82" y="222" font-size="13" font-weight="600" class="mut">MẮT XÍCH 4</text><text x="82" y="257" font-size="22" font-weight="600" class="tx">Hệ thống xử lý</text><text x="82" y="289" font-size="17" font-weight="400" class="mut">Hệ thống thực hiện được hành động nào?</text><rect x="628" y="187" width="512" height="131" rx="16" class="bp"/><text x="650" y="222" font-size="13" font-weight="600" class="tp">MẮT XÍCH 5</text><text x="650" y="257" font-size="22" font-weight="600" class="tp">Tài sản, hồ sơ</text><text x="650" y="289" font-size="17" font-weight="400" class="mut">Điều gì có thể bị thay đổi hoặc lấy đi?</text><line x1="578" y1="252.5" x2="610" y2="252.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 243.5 l14 9 l-14 9z" class="arf"/><path d="M978.6666666666667 135 V159 H316 V173" class="ar" fill="none" stroke-width="3" stroke-dasharray="6 6"/><path d="M307 173 l9 14 l9 -14z" class="arf"/></g><text x="60" y="492" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text><text x="60" y="512" font-size="13" font-weight="400" class="mut">Mô hình minh họa, không phải sơ đồ kỹ thuật Binance đã xác nhận.</text><text x="60" y="532" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four concerns behind employee resistance to ERP: more complicated with no personal benefit, fear of getting it wrong, data they cannot trust and no time to learn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four concerns behind employee resistance to ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mostly reasonable concerns the organization has not addressed, not just a bad attitude.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">More complicated, no</text><text x="76.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">personal benefit</text><text x="76.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP often adds steps to tasks</text><text x="76.0" y="248.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">people already do quickly.</text><rect x="334.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Fear of getting it wrong</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Worry about wrong entries or</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">approvals; weak training and no</text><text x="350.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">support push people away.</text><rect x="608.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Data they cannot trust</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Poor data lowers trust, and then</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the data gets worse.</text><rect x="882.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">No time to learn</text><text x="898.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Operational pressure traps users</text><text x="898.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">between two systems.</text><rect x="60.0" y="289.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="322.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Resistance usually reflects concerns the organization has not addressed.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Three kinds of decisions not to move to Event → Action: hard-to-reverse or irreversible actions, decisions with unstable criteria, and approvals required by regulation, standards or contracts." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="560" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three kinds of decisions not to move to Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Event → Action does not apply to every decision.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="284.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="94.0" cy="170.0" r="16" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Hard-to-reverse or</text><text x="84.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">irreversible actions</text><text x="84.0" y="299.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Such as large payments or confirming</text><text x="84.0" y="318.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">a contract.</text><rect x="80.0" y="348.0" width="306.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="90.0" y="369.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Keep a person confirming before</text><text x="90.0" y="388.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">it happens</text><rect x="427.0" y="134.0" width="346.0" height="284.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Decisions with unstable criteria</text><text x="451.0" y="299.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Or where new variants keep appearing that</text><text x="451.0" y="318.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">a rule cannot list.</text><rect x="447.0" y="348.0" width="306.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="457.0" y="379.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Not a rule yet; needs more precedent</text><rect x="794.0" y="134.0" width="346.0" height="284.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="170.0" r="16" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Approvals required by</text><text x="818.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">regulation, standards</text><text x="818.0" y="268.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">or contracts</text><text x="818.0" y="299.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">These are not formal control.</text><rect x="814.0" y="348.0" width="306.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="824.0" y="379.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Identify them before changing anything</text><rect x="60.0" y="436.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="469.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">High risk, unstable criteria or mandatory requirements: keep the human approval.</text></svg>
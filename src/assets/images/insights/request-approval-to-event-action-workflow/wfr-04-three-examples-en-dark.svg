<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Three illustrative examples: recurring purchasing, returns and production scheduling, each with cases that run under a rule issued in advance and cases routed to an authorized person." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three examples: straight to action or escalated</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">One principle, applied to three kinds of operational decisions.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Situation</text><text x="300.0" y="141.7" font-size="13" font-weight="700" fill="#5FA0FF" text-anchor="start">Runs under a rule issued in advance</text><text x="740.0" y="141.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Routed to an authorized person</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Illustrative example</text><rect x="60.0" y="152.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="211.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Recurring purchasing</text><rect x="300.0" y="152.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="201.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Rule issued by the purchasing lead: repeat order,</text><text x="318.0" y="221.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">usual supplier, within the limit</text><rect x="730.0" y="152.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="211.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">New supplier, or above the usual limit</text><rect x="60.0" y="272.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="331.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Refunds and returns</text><rect x="300.0" y="272.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="321.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Within published policy, low value, no unusual</text><text x="318.0" y="341.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">history from the customer</text><rect x="730.0" y="272.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="321.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">High value, or an unusual pattern such as repeated</text><text x="748.0" y="341.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">returns in a short time</text><rect x="60.0" y="392.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="441.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Production schedule</text><text x="76.0" y="462.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">when material is short</text><rect x="300.0" y="392.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="441.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">A substitution plan was approved in advance: the</text><text x="318.0" y="461.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">schedule is adjusted under that plan</text><rect x="730.0" y="392.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="441.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">A plan that has not been approved waits for an</text><text x="748.0" y="461.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">authorized person</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The decision is made once, in advance, by an authorized person; the event only triggers it.</text></svg>
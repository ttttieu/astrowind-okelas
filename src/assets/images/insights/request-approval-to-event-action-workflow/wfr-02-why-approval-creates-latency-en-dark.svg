<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Three reasons approval creates latency: it is a default rather than a conditional step, it depends on the approver’s schedule rather than urgency, and it does not differentiate risk." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="524" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Why request/approval creates latency</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The problem is not that approval is bad, but that it is applied uniformly.</text><line x1="60.0" y1="462.0" x2="1140.0" y2="462.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="484.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="250.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#A78BFA"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="224.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">A default step, not a</text><text x="84.0" y="250.2" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">conditional one</text><text x="84.0" y="300.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Many processes require approval for</text><text x="84.0" y="321.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">every case, including repetitive,</text><text x="84.0" y="342.7" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">low-value ones with clear precedent.</text><rect x="427.0" y="134.0" width="346.0" height="250.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="224.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">Depends on the</text><text x="451.0" y="250.2" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">approver’s schedule</text><text x="451.0" y="300.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">An important and an unimportant</text><text x="451.0" y="321.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">request can wait the same time if they sit</text><text x="451.0" y="342.7" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">in the same person’s queue.</text><rect x="794.0" y="134.0" width="346.0" height="250.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#A78BFA"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="224.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">Does not differentiate risk</text><text x="818.0" y="300.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Very small and very large requests can</text><text x="818.0" y="321.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">travel through the same approval chain.</text><rect x="60.0" y="402.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="435.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Approval is needed for risky decisions; what to fix is making it an undifferentiated queue.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="An event is assessed against pre-defined rules and thresholds: cases within threshold and matching precedent act directly with evidence recorded; cases beyond threshold or high risk go to an authorized person with context." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Event → Action: approval becomes a conditional branch</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Rules and thresholds are decided in advance; the system routes each case.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="252.0" width="180.0" height="80.0" rx="10" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="150.0" y="297.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Event happens</text><line x1="244.0" y1="292.0" x2="271.0" y2="292.0" stroke="var(--p)" stroke-width="3"/><polygon points="282.0,292.0 271.0,298.1 271.0,285.9" fill="var(--p)"/><rect x="290.0" y="144.0" width="280.0" height="296.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="310.0" y="182.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">System assesses</text><rect x="310.0" y="214.0" width="240.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="430.0" y="241.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Risk level</text><rect x="310.0" y="270.0" width="240.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="430.0" y="297.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Value</text><rect x="310.0" y="326.0" width="240.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="430.0" y="353.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Match with precedent</text><line x1="574.0" y1="292.0" x2="604.0" y2="292.0" stroke="var(--mut)" stroke-width="2.5"/><line x1="604.0" y1="209.0" x2="604.0" y2="375.0" stroke="var(--mut)" stroke-width="2.5"/><line x1="604.0" y1="209.0" x2="625.0" y2="209.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="634.0,209.0 625.0,213.9 625.0,204.1" fill="var(--p)"/><line x1="604.0" y1="375.0" x2="625.0" y2="375.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="634.0,375.0 625.0,379.9 625.0,370.1" fill="var(--a)"/><rect x="640.0" y="134.0" width="500.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="664.0" y="168.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Within safe threshold, clear precedent</text><text x="664.0" y="206.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Action happens directly, no waiting</text><rect x="664.0" y="234.0" width="299.2" height="28.0" rx="14.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="813.6" y="252.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Full evidence still recorded for later review</text><rect x="640.0" y="300.0" width="500.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="664.0" y="334.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Beyond threshold, no precedent or high risk</text><text x="664.0" y="372.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Routed to an authorized person</text><rect x="664.0" y="400.0" width="236.2" height="28.0" rx="14.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="782.1" y="418.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">With full context to decide faster</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Approval is no longer a fixed step in the chain, but a conditional branch.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Three conditions for the shift: enough history to define precedent, authorized people willing to decide in advance, and post-hoc review; start with low-value, high-frequency decisions with clear precedent." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three conditions before moving to Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The shift is not a switch you flip.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="220.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Enough history to define</text><text x="84.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">clear precedent</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Safe thresholds need sufficiently large</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">historical data, not guesswork.</text><rect x="427.0" y="134.0" width="346.0" height="220.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Authorized people willing to</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">decide in advance</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Set one general rule instead of approving</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">case by case. Often the biggest</text><text x="451.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">organizational barrier.</text><rect x="794.0" y="134.0" width="346.0" height="220.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Post-hoc review in place</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Periodically review auto-handled cases to</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">catch wrong thresholds or missed patterns.</text><rect x="60.0" y="370.0" width="1080.0" height="84.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="416.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">A cautious path: start with</text><rect x="400.0" y="392.0" width="200.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="500.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Low value</text><rect x="614.0" y="392.0" width="200.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="714.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">High frequency</text><rect x="828.0" y="392.0" width="260.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Clearest precedent</text><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Precedent, advance decisions and later review: three conditions for a shift that stays controlled.</text></svg>
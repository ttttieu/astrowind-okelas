<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four conditions for the shift: enough precedent, an authorized person who decides in advance and names the rule, evidence on every run, and post-hoc review; start with low-value, high-frequency decisions with clear precedent." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four conditions before moving to Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The shift is not a switch you flip.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Enough precedent</text><text x="76.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Define clear cases from real</text><text x="76.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">data: which cases repeat with</text><text x="76.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">consistent outcomes.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="#2B74F5"/><rect x="335.0" y="134.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">An authorized person</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">decides in advance</text><text x="351.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Puts their name on the rule;</text><text x="351.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">each rule has an owner</text><text x="351.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">responsible for review.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="#2B74F5"/><rect x="610.0" y="134.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Evidence on every run</text><text x="626.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">So results can be verified later</text><text x="626.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and traced when needed.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="#2B74F5"/><rect x="885.0" y="134.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="#2B74F5"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Post-hoc review</text><text x="901.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Catches wrong thresholds early;</text><text x="901.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">the rule changes through a</text><text x="901.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">formal process.</text><rect x="60.0" y="400.0" width="1080.0" height="84.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="446.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">A cautious path: start with</text><rect x="400.0" y="422.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="500.0" y="447.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Low value</text><rect x="614.0" y="422.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="714.0" y="447.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">High frequency</text><rect x="828.0" y="422.0" width="260.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="958.0" y="447.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Clearest precedent</text><rect x="60.0" y="502.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="535.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Precedent, advance decisions, evidence and review: four conditions for a shift that stays controlled.</text></svg>
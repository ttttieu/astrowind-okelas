<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Request → Approval puts a wait-for-approval step into each case; Event → Action moves approval to the rule level, issued once by an authorized person, an event triggers the approved rule, and cases outside the rule go to a person to judge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Approval moves from each case to the rule level</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Approval does not disappear: it moves from each case to the rule level.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="1080.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="169.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Request → Approval</text><rect x="84.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="209.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Request</text><line x1="338.0" y1="221.0" x2="411.0" y2="221.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="420.0,221.0 411.0,225.9 411.0,216.1" fill="var(--gm)"/><rect x="424.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="549.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Approval</text><line x1="678.0" y1="221.0" x2="751.0" y2="221.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="760.0,221.0 751.0,225.9 751.0,216.1" fill="var(--gm)"/><rect x="764.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="889.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Action</text><rect x="434.0" y="156.0" width="145.4" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="506.7" y="171.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Approved every time</text><text x="84.0" y="279.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Every case, even one repeated hundreds of times with the same result, is judged again from scratch.</text><rect x="60.0" y="318.0" width="1080.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="353.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Event → Action</text><rect x="84.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="197.0" y="402.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">A rule issued in advance by an</text><text x="197.0" y="421.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">authorized person</text><line x1="314.0" y1="407.0" x2="337.0" y2="407.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="346.0,407.0 337.0,411.9 337.0,402.1" fill="var(--a)"/><rect x="350.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="463.0" y="412.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Event happens</text><line x1="580.0" y1="407.0" x2="603.0" y2="407.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="612.0,407.0 603.0,411.9 603.0,402.1" fill="var(--p)"/><rect x="616.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--p)"/><text x="729.0" y="402.9" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">The rule runs: action</text><text x="729.0" y="421.3" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">happens, evidence recorded</text><line x1="846.0" y1="407.0" x2="869.0" y2="407.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="878.0,407.0 869.0,411.9 869.0,402.1" fill="var(--a)"/><rect x="882.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="995.0" y="402.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Case outside the rule: a</text><text x="995.0" y="421.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">person judges</text><text x="84.0" y="471.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Approval happens once when the rule is issued, and for each exception; every other case runs under the approved rule.</text><rect x="60.0" y="516.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="549.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Not removing control: it moves to when the rule is issued, and judgment goes to cases that need it.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Three operational examples: recurring purchasing, customer refunds and production scheduling, each with cases that go straight to action and cases escalated to a decision-maker." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three examples: straight to action or escalated</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">One principle, applied to three kinds of operational decisions.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Situation</text><text x="300.0" y="141.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Straight to action</text><text x="740.0" y="141.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Routed to an authorized person</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Illustrative example</text><rect x="60.0" y="152.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="211.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Recurring purchasing</text><rect x="300.0" y="152.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="201.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Repeat order, usual supplier, within a</text><text x="318.0" y="221.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">pre-approved limit</text><rect x="730.0" y="152.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="211.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">New supplier, or above the usual limit</text><rect x="60.0" y="272.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="331.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Refunds and returns</text><rect x="300.0" y="272.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Within published policy, low value, no unusual</text><text x="318.0" y="341.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">history from the customer</text><rect x="730.0" y="272.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">High value, or an unusual pattern such as repeated</text><text x="748.0" y="341.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">returns in a short time</text><rect x="60.0" y="392.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="441.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Production schedule</text><text x="76.0" y="462.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">when material is short</text><rect x="300.0" y="392.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="441.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A pre-approved substitute exists: the system adjusts</text><text x="318.0" y="461.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">the schedule and notifies</text><rect x="730.0" y="392.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="441.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The situation falls outside what was decided</text><text x="748.0" y="461.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">in advance</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Rules and thresholds are set once, in advance, by an authorized person; the system applies them case by case.</text></svg>
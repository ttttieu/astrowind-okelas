<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Four things ERP requires from the accounting system: a consistent chart of accounts, a cost allocation method, defined accounting periods and clean reconciled opening balances." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="500" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four things ERP requires from your accounting system</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP must be configured around decisions the business has already made.</text><line x1="60.0" y1="416.0" x2="1140.0" y2="416.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="438.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="479.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="196.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chart of accounts</text><text x="76.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Detailed enough for</text><text x="76.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">operations yet maintainable;</text><text x="76.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the same transaction type in</text><text x="76.0" y="305.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the same account.</text><rect x="334.0" y="134.0" width="259.0" height="196.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="366.0" cy="166.0" r="15" fill="var(--p)"/><text x="366.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="350.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cost allocation method</text><text x="350.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Documented and consistent; ERP</text><text x="350.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cannot decide this itself.</text><rect x="608.0" y="134.0" width="259.0" height="196.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="166.0" r="15" fill="var(--p)"/><text x="640.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="624.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Accounting periods</text><text x="624.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Month boundaries, fiscal year</text><text x="624.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and special periods such as</text><text x="624.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">year-end adjustments.</text><rect x="882.0" y="134.0" width="259.0" height="196.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="914.0" cy="166.0" r="15" fill="var(--p)"/><text x="914.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="898.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Clean opening balances</text><text x="898.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Accurate, reconciled and</text><text x="898.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">approved by an authorized</text><text x="898.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">person before entry.</text><rect x="60.0" y="346.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="379.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP needs these decisions settled before it is configured.</text></svg>
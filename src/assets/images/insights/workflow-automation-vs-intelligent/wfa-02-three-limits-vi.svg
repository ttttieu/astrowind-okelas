<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Automation truyền thống xử lý tốt dữ liệu có cấu trúc, tình huống đúng kịch bản và điều kiện cố định, nhưng gặp khó với dữ liệu phi cấu trúc, ngoại lệ và quyết định cần ngữ cảnh." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba điểm automation truyền thống gặp khó</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quy trình nhiều ngoại lệ hoặc nhiều dữ liệu phi cấu trúc sẽ nhanh chạm trần giá trị.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="350.0" height="292.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu phi cấu trúc</text><text x="80.0" y="231.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Xử lý tốt</text><rect x="80.0" y="240.0" width="310.0" height="54.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="235.0" y="272.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Trường trong form, cột trong bảng</text><text x="80.0" y="323.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Gặp khó</text><rect x="80.0" y="332.0" width="310.0" height="72.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="235.0" y="363.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Email viết tự do, ảnh chứng từ, ghi chú</text><text x="235.0" y="382.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">viết tay</text><rect x="425.0" y="134.0" width="350.0" height="292.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ngoại lệ</text><text x="445.0" y="231.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Xử lý tốt</text><rect x="445.0" y="240.0" width="310.0" height="54.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="600.0" y="272.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tình huống đúng kịch bản đã lập trình</text><text x="445.0" y="323.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Gặp khó</text><rect x="445.0" y="332.0" width="310.0" height="72.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600.0" y="363.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tình huống ngoài kịch bản: dừng lại, báo</text><text x="600.0" y="382.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">lỗi, chờ người can thiệp</text><rect x="790.0" y="134.0" width="350.0" height="292.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định cần ngữ cảnh</text><text x="810.0" y="231.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Xử lý tốt</text><rect x="810.0" y="240.0" width="310.0" height="54.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="965.0" y="272.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nếu X thì làm Y</text><text x="810.0" y="323.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Gặp khó</text><rect x="810.0" y="332.0" width="310.0" height="72.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="965.0" y="363.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cân nhắc nhiều yếu tố cùng lúc và giải</text><text x="965.0" y="382.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">thích lý do</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đầu tư thêm vào automation cho những quy trình này mang lại cải thiện ngày càng ít.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="Quy trình ít ngoại lệ và dữ liệu có cấu trúc thường chỉ cần automation; chỉ cân nhắc thêm lớp thông minh khi ngoại lệ đáng kể, dữ liệu phi cấu trúc hoặc cần phán đoán nhiều yếu tố." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="670" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Khi nào cần vượt ra ngoài automation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không phải quy trình nào cũng cần intelligent workflow.</text><line x1="60.0" y1="608.0" x2="1140.0" y2="608.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="630.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách kiểm tra là gợi ý nêu trong bài, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="230.0" y="134.0" width="740.0" height="68.0" rx="14" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="600.0" y="174.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình có tỷ lệ ngoại lệ thấp và dữ liệu có cấu trúc rõ ràng?</text><line x1="600.0" y1="202.0" x2="600.0" y2="216.0" stroke="var(--gm)" stroke-width="2.5"/><line x1="260.0" y1="216.0" x2="760.0" y2="216.0" stroke="var(--gm)" stroke-width="2.5"/><line x1="260.0" y1="216.0" x2="260.0" y2="239.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="260.0,248.0 255.1,239.0 264.9,239.0" fill="var(--p)"/><line x1="760.0" y1="216.0" x2="760.0" y2="239.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="760.0,248.0 755.0,239.0 765.0,239.0" fill="var(--a)"/><rect x="60.0" y="240.0" width="400.0" height="290.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="258.0" width="46.0" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="107.0" y="275.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Có</text><text x="84.0" y="323.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Automation truyền thống</text><text x="84.0" y="350.7" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">thường đủ</text><rect x="84.0" y="378.0" width="352.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="260.0" y="405.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí thấp hơn</text><rect x="84.0" y="432.0" width="352.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="260.0" y="459.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Rủi ro thấp hơn</text><rect x="480.0" y="240.0" width="660.0" height="290.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="504.0" y="258.0" width="290.3" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="649.1" y="275.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Ngược lại, khi rơi vào các trường hợp sau</text><text x="504.0" y="317.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Cân nhắc thêm lớp thông minh</text><rect x="504.0" y="336.0" width="612.0" height="54.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="810.0" y="358.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tỷ lệ ngoại lệ đáng kể, khiến automation hiện tại thường xuyên phải chuyển tay</text><text x="810.0" y="377.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">cho người</text><rect x="504.0" y="398.0" width="612.0" height="54.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="810.0" y="430.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phần lớn dữ liệu đầu vào là phi cấu trúc: email, hình ảnh, văn bản tự do</text><rect x="504.0" y="460.0" width="612.0" height="54.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="810.0" y="492.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cần phán đoán nhiều yếu tố cùng lúc, luật if-else ngày càng phức tạp và khó bảo trì</text><rect x="60.0" y="548.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="581.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu không rơi vào các trường hợp này, thêm AI thường chỉ tăng chi phí và độ phức tạp.</text></svg>
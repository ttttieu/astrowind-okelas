<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Khi gặp tình huống ngoài kịch bản, automation truyền thống dừng lại và chờ người; intelligent workflow phân loại mức độ, tự xử lý ca rủi ro thấp và chuyển người ca cần phán đoán kèm ngữ cảnh." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Khi gặp ngoại lệ: dừng lại hay phân loại?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điểm khác biệt nằm ở những gì xảy ra sau khi gặp tình huống không có trong kịch bản.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="120.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="167.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">Automation truyền thống</text><rect x="84.0" y="186.0" width="300.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="234.0" y="217.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Tình huống ngoài kịch bản</text><line x1="388.0" y1="212.0" x2="411.0" y2="212.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="420.0,212.0 411.0,216.9 411.0,207.1" fill="var(--gm)"/><rect x="424.0" y="186.0" width="300.0" height="52.0" rx="10" fill="var(--a)"/><text x="574.0" y="217.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Dừng lại, báo lỗi</text><line x1="728.0" y1="212.0" x2="751.0" y2="212.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="760.0,212.0 751.0,216.9 751.0,207.1" fill="var(--gm)"/><rect x="764.0" y="186.0" width="352.0" height="52.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="940.0" y="217.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Con người xử lý thủ công</text><rect x="60.0" y="268.0" width="1080.0" height="232.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="301.0" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Intelligent workflow</text><rect x="84.0" y="368.0" width="250.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="209.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Tình huống ngoài kịch bản</text><line x1="338.0" y1="394.0" x2="363.0" y2="394.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="372.0,394.0 363.0,398.9 363.0,389.1" fill="var(--p)"/><rect x="376.0" y="364.0" width="270.0" height="60.0" rx="10" fill="var(--p)"/><text x="511.0" y="399.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Phân loại mức độ nghiêm trọng</text><line x1="650.0" y1="394.0" x2="690.0" y2="394.0" stroke="var(--p)" stroke-width="2.5"/><line x1="690.0" y1="394.0" x2="690.0" y2="332.0" stroke="var(--p)" stroke-width="2.5"/><line x1="690.0" y1="332.0" x2="715.0" y2="332.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="724.0,332.0 715.0,336.9 715.0,327.1" fill="var(--p)"/><rect x="728.0" y="302.0" width="388.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="922.0" y="337.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Rủi ro thấp: tự xử lý theo tiền lệ tương tự</text><line x1="690.0" y1="394.0" x2="690.0" y2="456.0" stroke="var(--a)" stroke-width="2.5"/><line x1="690.0" y1="456.0" x2="715.0" y2="456.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="724.0,456.0 715.0,460.9 715.0,451.1" fill="var(--a)"/><rect x="728.0" y="426.0" width="388.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="922.0" y="451.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Cần phán đoán: chuyển người, kèm đầy</text><text x="922.0" y="471.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">đủ ngữ cảnh</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chỉ những ca thực sự cần phán đoán mới đến tay con người, và đến cùng ngữ cảnh để quyết định nhanh hơn.</text></svg>
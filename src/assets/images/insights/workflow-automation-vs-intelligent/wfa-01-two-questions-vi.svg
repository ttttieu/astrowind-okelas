<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Automation trả lời làm sao không phải làm thủ công việc lặp lại; intelligent workflow trả lời làm sao xử lý phần việc cần hiểu ngữ cảnh và ra quyết định có điều kiện." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="660" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Automation và intelligent workflow: hai câu hỏi khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai khái niệm giải quyết hai lớp vấn đề khác nhau trong cùng một quy trình.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="530.0" height="380.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Automation</text><rect x="84.0" y="196.0" width="482.0" height="96.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="325.0" y="250.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="middle">Làm sao để không phải làm thủ công việc lặp lại?</text><rect x="84.0" y="310.0" width="482.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="325.0" y="337.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nếu điều kiện A đúng, thực hiện hành động B</text><circle cx="96.0" cy="401.0" r="5" fill="var(--p)"/><text x="112.0" y="407.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Loại bỏ lỗi gõ nhầm, quên bước, sai thứ tự</text><circle cx="96.0" cy="441.0" r="5" fill="var(--p)"/><text x="112.0" y="447.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chạy ổn định 24/7</text><circle cx="96.0" cy="481.0" r="5" fill="var(--p)"/><text x="112.0" y="487.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Xử lý khối lượng lớn nhanh hơn con người</text><rect x="610.0" y="134.0" width="530.0" height="380.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="634.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligent workflow</text><rect x="634.0" y="196.0" width="482.0" height="96.0" rx="12" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="875.0" y="238.7" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Làm sao để hệ thống xử lý cả phần cần hiểu</text><text x="875.0" y="262.4" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">ngữ cảnh và ra quyết định có điều kiện?</text><rect x="634.0" y="310.0" width="482.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="875.0" y="337.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hiểu ngữ cảnh, phán đoán có kiểm soát</text><circle cx="646.0" cy="401.0" r="5" fill="var(--a)"/><text x="662.0" y="407.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu phi cấu trúc</text><circle cx="646.0" cy="441.0" r="5" fill="var(--a)"/><text x="662.0" y="447.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ngoại lệ có kiểm soát</text><circle cx="646.0" cy="481.0" r="5" fill="var(--a)"/><text x="662.0" y="487.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Giải thích được quyết định</text><rect x="60.0" y="532.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="565.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hai lớp không cạnh tranh nhau: automation lo phần có quy tắc, intelligent workflow lo phần cần ngữ cảnh.</text></svg>
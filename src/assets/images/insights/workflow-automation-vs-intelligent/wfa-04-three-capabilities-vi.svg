<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Ba năng lực của intelligent workflow, gồm xử lý dữ liệu phi cấu trúc, xử lý ngoại lệ có kiểm soát và giải thích được quyết định, được xây trên nền automation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="556" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba năng lực xây trên nền automation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không thay thế automation: chúng được xây trên nền automation.</text><line x1="60.0" y1="494.0" x2="1140.0" y2="494.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="516.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu phi cấu trúc</text><text x="80.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đọc hiểu email, trích thông tin từ chứng từ</text><text x="80.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">scan, phân loại yêu cầu viết bằng ngôn</text><text x="80.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ngữ tự nhiên.</text><rect x="425.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ngoại lệ có kiểm soát</text><text x="445.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phân loại mức độ nghiêm trọng, tự xử lý</text><text x="445.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ca rủi ro thấp theo tiền lệ, chuyển người ca</text><text x="445.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cần phán đoán.</text><rect x="790.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Giải thích được quyết định</text><text x="810.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ ra vì sao đề xuất một hành động, dựa</text><text x="810.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trên dữ liệu và tiền lệ nào, để con người</text><text x="810.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm chứng.</text><rect x="60.0" y="316.0" width="1080.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="353.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Nền: automation</text><text x="84.0" y="379.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phần việc lặp lại, có quy tắc rõ ràng vẫn do automation đảm nhiệm.</text><rect x="60.0" y="418.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="451.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Lớp thông minh chỉ dùng cho đúng phần việc cần nó.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Knowledge management là lớp bổ sung phía trên DMS, không thay thế; DMS quản lý tài liệu còn KM quản lý ý nghĩa của tài liệu trong bối cảnh vận hành." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ DMS sang KM: mở rộng, không phải thay thế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">DMS vẫn là nền tảng. KM là lớp bổ sung phía trên.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="640.0" height="120.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="177.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge management</text><text x="84.0" y="205.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Gắn tài liệu với ngữ cảnh, quy trình, sự kiện và con người</text><line x1="380.0" y1="294.0" x2="380.0" y2="268.0" stroke="var(--mut)" stroke-width="2"/><polygon points="380.0,260.0 384.4,268.0 375.6,268.0" fill="var(--mut)"/><rect x="60.0" y="302.0" width="640.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="345.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">DMS</text><text x="84.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Lưu trữ, kiểm soát và phê duyệt tài liệu</text><rect x="720.0" y="134.0" width="420.0" height="288.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="744.0" y="175.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">DMS quản lý tài liệu.</text><text x="744.0" y="211.8" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">KM quản lý ý nghĩa của tài liệu trong</text><text x="744.0" y="236.7" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">bối cảnh vận hành của tổ chức.</text><text x="744.0" y="281.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không phải một dự án công nghệ: đó là thay đổi cách</text><text x="744.0" y="301.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tổ chức nhìn nhận và tổ chức tri thức.</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Công nghệ là công cụ hỗ trợ, không phải điểm bắt đầu.</text></svg>
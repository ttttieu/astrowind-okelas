<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" width="1200" height="652" role="img" aria-label="A step waiting for information and conditions to be ready differs from a step waiting for exactly one person, who may be absent, overloaded or forget." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="652" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Waiting for readiness is not waiting for one person</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Needing human judgment is not the problem; the problem is when only one person holds the authority or information.</text><line x1="60.0" y1="590.0" x2="1140.0" y2="590.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="612.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="1080.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="84.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Waiting for readiness</text><rect x="84.0" y="190.0" width="130.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="149.0" y="221.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 1</text><line x1="218.0" y1="216.0" x2="241.0" y2="216.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="250.0,216.0 241.0,220.9 241.0,211.1" fill="var(--p)"/><rect x="254.0" y="190.0" width="130.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="319.0" y="221.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 2</text><line x1="388.0" y1="216.0" x2="411.0" y2="216.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="420.0,216.0 411.0,220.9 411.0,211.1" fill="var(--p)"/><rect x="424.0" y="190.0" width="290.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="569.0" y="221.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="middle">Information and conditions ready</text><line x1="718.0" y1="216.0" x2="747.0" y2="216.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="756.0,216.0 747.0,220.9 747.0,211.1" fill="var(--p)"/><rect x="760.0" y="190.0" width="130.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="825.0" y="221.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 3</text><text x="84.0" y="267.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Moves on when information and conditions are ready.</text><rect x="60.0" y="298.0" width="1080.0" height="214.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="335.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Waiting for exactly one person</text><rect x="84.0" y="354.0" width="130.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="149.0" y="385.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 1</text><line x1="218.0" y1="380.0" x2="241.0" y2="380.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="250.0,380.0 241.0,384.9 241.0,375.1" fill="var(--gm)"/><rect x="254.0" y="354.0" width="130.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="319.0" y="385.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 2</text><line x1="388.0" y1="380.0" x2="411.0" y2="380.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="420.0,380.0 411.0,384.9 411.0,375.1" fill="var(--gm)"/><rect x="424.0" y="354.0" width="290.0" height="52.0" rx="10" fill="var(--a)"/><text x="569.0" y="385.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Waiting for one person</text><line x1="718.0" y1="380.0" x2="747.0" y2="380.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="756.0,380.0 747.0,384.9 747.0,375.1" fill="var(--a)"/><rect x="760.0" y="354.0" width="130.0" height="52.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="825.0" y="385.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Step 3</text><rect x="424.0" y="430.0" width="90.0" height="36.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="469.0" y="452.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Absent</text><rect x="522.0" y="430.0" width="90.0" height="36.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="567.0" y="452.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Overloaded</text><rect x="620.0" y="430.0" width="90.0" height="36.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="665.0" y="452.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Overlooked</text><text x="760.0" y="438.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Only one person holds the authority or information,</text><text x="760.0" y="458.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">with no alternative.</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The problem is not that people are needed, but that there is only one person and no backup plan.</text></svg>
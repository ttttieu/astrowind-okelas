<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Four ways to cut dependency: delegate by threshold instead of title, formal backup, system tracking and system prompts." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="700" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four ways to cut dependency without dropping accountability</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cut dependency on any one person while keeping accountability.</text><line x1="60.0" y1="638.0" x2="1140.0" y2="638.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="660.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">From</text><text x="540.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">To</text><rect x="60.0" y="152.0" width="400.0" height="86.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="201.2" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">Delegation by title</text><line x1="468.0" y1="195.0" x2="519.0" y2="195.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,195.0 519.0,201.1 519.0,188.9" fill="var(--p)"/><rect x="540.0" y="152.0" width="600.0" height="86.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="564.0" y="181.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Delegation by threshold</text><text x="564.0" y="208.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Route decisions by risk level and transaction type, not by position alone.</text><rect x="60.0" y="250.0" width="400.0" height="86.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="299.2" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">Implicit backup</text><line x1="468.0" y1="293.0" x2="519.0" y2="293.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,293.0 519.0,299.1 519.0,286.9" fill="var(--p)"/><rect x="540.0" y="250.0" width="600.0" height="86.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="564.0" y="279.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Formal backup</text><text x="564.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Document operational risks and plan contingencies.</text><rect x="60.0" y="348.0" width="400.0" height="86.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="397.2" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">Tracking in memory</text><line x1="468.0" y1="391.0" x2="519.0" y2="391.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,391.0 519.0,397.1 519.0,384.9" fill="var(--p)"/><rect x="540.0" y="348.0" width="600.0" height="86.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="564.0" y="377.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System tracking</text><text x="564.0" y="404.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Record and show status across the whole process.</text><rect x="60.0" y="446.0" width="400.0" height="86.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="495.2" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">Waiting to be chased</text><line x1="468.0" y1="489.0" x2="519.0" y2="489.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,489.0 519.0,495.1 519.0,482.9" fill="var(--p)"/><rect x="540.0" y="446.0" width="600.0" height="86.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="564.0" y="475.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System prompts</text><text x="564.0" y="502.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Flag automatically when a step is ready for action.</text><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Reducing dependency on one person does not mean dropping accountability.</text></svg>
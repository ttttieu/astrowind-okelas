<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three ways a workflow depends on people: single-point approval, memory-based tracking and chase-driven progress." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three ways a workflow depends on people</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three common patterns the article describes.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Single-point approval</text><rect x="76.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="84.0" y="232.0" width="88.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="128.0" y="254.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Many</text><text x="128.0" y="270.3" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">requests</text><line x1="174.0" y1="258.0" x2="189.0" y2="258.0" stroke="var(--gm)" stroke-width="2"/><polygon points="196.0,258.0 189.0,261.9 189.0,254.2" fill="var(--gm)"/><rect x="198.0" y="234.0" width="76.0" height="48.0" rx="24" fill="var(--a)"/><text x="236.0" y="254.4" font-size="12" font-weight="700" fill="var(--wh)" text-anchor="middle">One</text><text x="236.0" y="270.3" font-size="12" font-weight="700" fill="var(--wh)" text-anchor="middle">person</text><line x1="276.0" y1="258.0" x2="291.0" y2="258.0" stroke="var(--a)" stroke-width="2"/><polygon points="298.0,258.0 291.0,261.9 291.0,254.2" fill="var(--a)"/><rect x="300.0" y="232.0" width="86.0" height="52.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="343.0" y="254.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Work</text><text x="343.0" y="270.3" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">continues</text><text x="80.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">One person holds exclusive authority or</text><text x="80.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">information; when absent, all downstream</text><text x="80.0" y="382.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">work stops.</text><rect x="425.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Memory-based tracking</text><rect x="441.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="449.0" y="232.0" width="120.0" height="52.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="509.0" y="262.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Personal memory</text><text x="601.0" y="262.4" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="middle">instead of</text><rect x="633.0" y="232.0" width="118.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="692.0" y="262.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">System record</text><text x="445.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Progress relies on informal knowledge</text><text x="445.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">instead of a recorded system; risky when</text><text x="445.0" y="382.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">key people move on or leave.</text><rect x="790.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chase-driven progress</text><rect x="806.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="814.0" y="232.0" width="88.0" height="52.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="858.0" y="254.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Step is</text><text x="858.0" y="270.3" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">ready</text><text x="967.0" y="251.0" font-size="11" font-weight="700" fill="var(--a)" text-anchor="middle">waits to be chased</text><line x1="906.0" y1="276.0" x2="1021.0" y2="276.0" stroke="var(--a)" stroke-width="2"/><polygon points="1028.0,276.0 1021.0,279.9 1021.0,272.1" fill="var(--a)"/><rect x="1030.0" y="232.0" width="86.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="1073.0" y="262.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Moves on</text><text x="810.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Work moves only when someone follows</text><text x="810.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">up, instead of moving on its own once</text><text x="810.0" y="382.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">conditions are met.</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All three put the risk in how the process is designed, not in one particular person.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The cost of waiting includes the visible waiting time, plus defensive behavior and opportunity loss accumulating across many processes." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">The cost of waiting is more than lost time</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Waiting does more than slow things down: it brings costs that are harder to see.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Analysis from the article, not measured data. Conceptual diagram.</text><rect x="60.0" y="134.0" width="1080.0" height="92.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Waiting time</text><text x="84.0" y="202.9" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">The visible part: work sitting still, waiting for one person.</text><line x1="60.0" y1="252.0" x2="1140.0" y2="252.0" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="60.0" y="239.0" width="159.9" height="26.0" rx="13.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="139.9" y="256.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Beyond waiting time</text><rect x="969.3" y="239.0" width="170.7" height="26.0" rx="13.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1054.6" y="256.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Analysis from the article</text><rect x="60.0" y="278.0" width="530.0" height="190.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="84.0" y="317.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Defensive behavior</text><text x="84.0" y="345.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">When accountability is unclear, people protect themselves:</text><rect x="84.0" y="384.0" width="148.0" height="56.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="158.0" y="408.2" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Unnecessary</text><text x="158.0" y="425.3" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">approvals</text><rect x="240.0" y="384.0" width="148.0" height="56.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="314.0" y="416.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Excess escalation</text><rect x="396.0" y="384.0" width="148.0" height="56.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="470.0" y="408.2" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Delay despite</text><text x="470.0" y="425.3" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">authority</text><rect x="610.0" y="278.0" width="530.0" height="190.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="634.0" y="317.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Accumulated opportunity loss</text><text x="634.0" y="351.4" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Small delays compound across dozens of processes, creating</text><text x="634.0" y="374.6" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">real drag that does not show in the financials.</text><rect x="634.0" y="396.0" width="116.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="692.0" y="422.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Process 1</text><rect x="760.0" y="396.0" width="116.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="818.0" y="422.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Process 2</text><rect x="886.0" y="396.0" width="116.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="944.0" y="422.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Process 3</text><rect x="1012.0" y="396.0" width="116.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="1070.0" y="422.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">…</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The real cost includes defensive behavior and accumulated opportunity loss, not just waiting time.</text></svg>
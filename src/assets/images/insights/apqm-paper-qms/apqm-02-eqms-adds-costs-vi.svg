<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-label="Hai thẻ: eQMS thêm được gì bên trái; bảy ô chi phí chuyển đổi xếp thành lưới bốn và ba." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="710" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">eQMS thêm được gì, và chi phí chuyển đổi gồm những gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chi phí chuyển đổi cần đặt cạnh chi phí QMS giấy hiện tại, không so với con số không.</text><line x1="60.0" y1="626.0" x2="1140.0" y2="626.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="648.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Các khoản chi phí theo bài viết; cách sắp xếp thành lưới là cách OKELAS trình bày.</text><text x="60.0" y="689.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="167.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">eQMS thêm</text><rect x="60.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="226.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Kiểm soát phiên bản tự động</text><rect x="335.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="462.5" y="226.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Hồ sơ liên kết với nhau</text><rect x="610.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="737.5" y="216.6" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Workflow và hạn chót</text><text x="737.5" y="236.4" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">được thực thi</text><rect x="885.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="1012.5" y="216.6" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Dữ liệu sẵn cho báo cáo và dấu</text><text x="1012.5" y="236.4" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">vết hoạt động</text><text x="60.0" y="313.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Chi phí chuyển đổi</text><rect x="60.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="187.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Giấy phép và hạ tầng</text><rect x="335.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="462.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Làm sạch quy trình</text><rect x="610.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="737.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuyển dữ liệu</text><rect x="885.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1012.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Cấu hình</text><rect x="60.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="187.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Đào tạo</text><rect x="335.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="462.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chạy song song</text><rect x="610.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="737.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Bảo trì dài hạn</text><text x="60.0" y="509.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">So sánh với chi phí QMS giấy hiện tại, không so với con số không.</text><rect x="60.0" y="556.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="589.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chi phí chuyển đổi là mọi thứ cộng lại, không chỉ là giấy phép.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Ba hàng, mỗi hàng là một điều kiện nối với một kết luận bằng mũi tên." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Giữ giấy hay chuyển: phụ thuộc vào điều kiện nào</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba tình huống theo kết luận của bài viết, từ đơn giản đến phức tạp.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Kết luận theo bài viết; các dòng ba và cách trình bày là diễn giải của OKELAS.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="500.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="310.0" y="214.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình giấy ổn định và chi phí hợp lý</text><line x1="566.0" y1="208.0" x2="618.0" y2="208.0" stroke="var(--gm)" stroke-width="3"/><polygon points="630.0,208.0 618.0,214.6 618.0,201.4" fill="var(--gm)"/><rect x="640.0" y="160.0" width="500.0" height="96.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="890.0" y="214.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Giữ QMS giấy</text><rect x="60.0" y="276.0" width="500.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="310.0" y="330.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí đang tăng và đã xác định được điểm gãy cụ thể</text><line x1="566.0" y1="324.0" x2="618.0" y2="324.0" stroke="var(--gm)" stroke-width="3"/><polygon points="630.0,324.0 618.0,330.6 618.0,317.4" fill="var(--gm)"/><rect x="640.0" y="276.0" width="500.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="890.0" y="330.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">eQMS có thể xử lý điểm gãy, khi quy trình đã rõ</text><rect x="60.0" y="392.0" width="500.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="310.0" y="446.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình chưa rõ, hoặc chưa xác định được điểm gãy</text><line x1="566.0" y1="440.0" x2="618.0" y2="440.0" stroke="var(--gm)" stroke-width="3"/><polygon points="630.0,440.0 618.0,446.6 618.0,433.4" fill="var(--gm)"/><rect x="640.0" y="392.0" width="500.0" height="96.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="890.0" y="446.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Làm rõ quy trình trước; chưa nên chọn công cụ</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quy trình rõ ràng là điều kiện trước khi chọn công cụ.</text></svg>
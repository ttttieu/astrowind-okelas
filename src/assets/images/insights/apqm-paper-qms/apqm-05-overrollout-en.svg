<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Two cards joined by an arrow: go-live day on the left, six months later on the right." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Rolling out everything at once, before processes are clear</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An illustrative case from the article shows the risk of doing too much at once.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Composite scenario, not a real client, as the article states.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="230.0" width="380.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="280.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Go-live day</text><text x="88.0" y="313.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">The full eQMS is deployed at once</text><line x1="446.0" y1="300.0" x2="682.0" y2="300.0" stroke="var(--gm)" stroke-width="3"/><polygon points="694.0,300.0 682.0,306.6 682.0,293.4" fill="var(--gm)"/><text x="570.0" y="291.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">6 months</text><rect x="700.0" y="230.0" width="440.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="728.0" y="280.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Six months later</text><text x="728.0" y="313.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Staff still write on paper; data lags by days</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Clarify the process first, then digitize and roll out in stages.</text></svg>
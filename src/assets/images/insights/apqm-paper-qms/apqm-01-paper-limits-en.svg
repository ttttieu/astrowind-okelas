<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Two card columns: paper QMS strengths on the left, practical limits on the right, four lines each." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The real question: where paper breaks as you grow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Paper QMS does many things well while a company is small and processes are stable.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Points per the article; these are general observations, not measured data.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="280.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="215.0" font-size="22" font-weight="700" fill="var(--s)" text-anchor="start">Paper QMS does well</text><text x="88.0" y="252.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Meets ISO 9001:2015 document control requirements</text><text x="88.0" y="302.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Low start-up cost; staff already know it</text><text x="88.0" y="352.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  No vendor dependency</text><text x="88.0" y="402.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Suits small companies with stable processes</text><rect x="612.0" y="160.0" width="528.0" height="280.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="640.0" y="215.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Practical limits</text><text x="640.0" y="252.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Version control relies on manual discipline</text><text x="640.0" y="302.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Traceability is slow</text><text x="640.0" y="352.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Related records are not linked</text><text x="640.0" y="402.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">–  Leadership reports are compiled by hand</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Paper holds up until it starts to break.</text></svg>
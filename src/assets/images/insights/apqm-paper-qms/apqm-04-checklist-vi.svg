<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Mười ô đánh số từ 1 đến 10 xếp hai cột, mỗi ô là một câu hỏi tự kiểm tra." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Mười câu hỏi để tự đánh giá mức sẵn sàng chuyển đổi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bài viết đưa ra mười câu hỏi có/không; hình này nhóm lại theo chủ đề.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nhãn rút gọn của OKELAS theo nội dung bài; đối chiếu với câu hỏi gốc trước khi dùng.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="186.0" r="15" fill="var(--p)"/><text x="88.0" y="191.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="192.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm đau đã được xác định</text><rect x="60.0" y="224.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="250.0" r="15" fill="var(--gm)"/><text x="88.0" y="255.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="120.0" y="256.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình đã được thống nhất</text><rect x="60.0" y="288.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="314.0" r="15" fill="var(--gm)"/><text x="88.0" y="319.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="120.0" y="320.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Phạm vi chuyển dữ liệu rõ ràng</text><rect x="60.0" y="352.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="378.0" r="15" fill="var(--gm)"/><text x="88.0" y="383.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="384.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Có người sở hữu cho từng quy trình</text><rect x="60.0" y="416.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="442.0" r="15" fill="var(--gm)"/><text x="88.0" y="447.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="120.0" y="448.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đã xem yêu cầu riêng của ngành</text><rect x="612.0" y="160.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="186.0" r="15" fill="var(--gm)"/><text x="640.0" y="191.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="672.0" y="192.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Kế hoạch triển khai theo đợt</text><rect x="612.0" y="224.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="250.0" r="15" fill="var(--gm)"/><text x="640.0" y="255.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="672.0" y="256.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Người dùng đã thử thực tế</text><rect x="612.0" y="288.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="314.0" r="15" fill="var(--gm)"/><text x="640.0" y="319.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="672.0" y="320.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Có thể xuất dữ liệu ra</text><rect x="612.0" y="352.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="378.0" r="15" fill="var(--gm)"/><text x="640.0" y="383.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">9</text><text x="672.0" y="384.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đã ước tính chi phí hiện tại</text><rect x="612.0" y="416.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="442.0" r="15" fill="var(--gm)"/><text x="640.0" y="447.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">10</text><text x="672.0" y="448.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Có kế hoạch chạy song song</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Trả lời đủ mười câu trước khi chọn phần mềm.</text></svg>
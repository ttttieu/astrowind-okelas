<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-label="Two cards: what eQMS adds on the left; seven transition cost boxes in a grid of four and three." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="710" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">What eQMS adds, and what the transition costs</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Transition costs should be set against today’s paper QMS costs, not against zero.</text><line x1="60.0" y1="626.0" x2="1140.0" y2="626.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="648.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cost items per the article; arranging them in a grid is OKELAS’s presentation.</text><text x="60.0" y="689.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="167.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">eQMS adds</text><rect x="60.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="226.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Automatic version control</text><rect x="335.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="462.5" y="226.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Linked records</text><rect x="610.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="737.5" y="216.6" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Enforced workflows</text><text x="737.5" y="236.4" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">and deadlines</text><rect x="885.0" y="184.0" width="255.0" height="74.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="1012.5" y="216.6" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Data ready for reporting and an</text><text x="1012.5" y="236.4" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">activity trail</text><text x="60.0" y="313.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Transition costs</text><rect x="60.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="187.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Licences and infrastructure</text><rect x="335.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="462.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Process cleanup</text><rect x="610.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="737.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Data migration</text><rect x="885.0" y="318.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1012.5" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Configuration</text><rect x="60.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="187.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Training</text><rect x="335.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="462.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Parallel running</text><rect x="610.0" y="402.0" width="255.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="737.5" y="442.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Long-term maintenance</text><text x="60.0" y="509.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Compare with the current paper QMS costs, not with zero.</text><rect x="60.0" y="556.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="589.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Transition cost is everything added together, not just the licence.</text></svg>
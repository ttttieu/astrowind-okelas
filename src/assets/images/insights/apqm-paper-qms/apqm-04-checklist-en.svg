<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Ten numbered boxes in two columns, each a self-check question." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ten yes-or-no questions to test readiness for eQMS</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article offers ten yes-or-no questions; this figure groups them by theme.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Short labels are OKELAS’s paraphrase of the article’s ten questions; check against the originals before use.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="186.0" r="15" fill="var(--p)"/><text x="88.0" y="191.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="192.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Pain points are identified</text><rect x="60.0" y="224.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="250.0" r="15" fill="var(--gm)"/><text x="88.0" y="255.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="120.0" y="256.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Processes have been agreed</text><rect x="60.0" y="288.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="314.0" r="15" fill="var(--gm)"/><text x="88.0" y="319.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="120.0" y="320.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Data migration scope is clear</text><rect x="60.0" y="352.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="378.0" r="15" fill="var(--gm)"/><text x="88.0" y="383.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="384.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Each process has an owner</text><rect x="60.0" y="416.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="88.0" cy="442.0" r="15" fill="var(--gm)"/><text x="88.0" y="447.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="120.0" y="448.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Industry rules have been reviewed</text><rect x="612.0" y="160.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="186.0" r="15" fill="var(--gm)"/><text x="640.0" y="191.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="672.0" y="192.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Rollout is planned in phases</text><rect x="612.0" y="224.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="250.0" r="15" fill="var(--gm)"/><text x="640.0" y="255.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="672.0" y="256.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Users have tested it in practice</text><rect x="612.0" y="288.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="314.0" r="15" fill="var(--gm)"/><text x="640.0" y="319.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="672.0" y="320.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Data can be exported</text><rect x="612.0" y="352.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="378.0" r="15" fill="var(--gm)"/><text x="640.0" y="383.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">9</text><text x="672.0" y="384.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Current costs have been estimated</text><rect x="612.0" y="416.0" width="528.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="640.0" cy="442.0" r="15" fill="var(--gm)"/><text x="640.0" y="447.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">10</text><text x="672.0" y="448.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">A parallel-run plan exists</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Answer all ten before choosing software.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Hai cột: ý định của con người với ba điểm; đặc tả được ghi với ba điểm, chỉ số được chọn vì dễ đo." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Mục tiêu được ghi không luôn là ý định thật</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giao cho AI một mục tiêu thay vì một phương pháp, nó có thể chọn bất kỳ cách nào đáp ứng mục tiêu đó.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mô tả theo bài viết, dùng để minh họa khoảng cách giữa mục tiêu được ghi và ý định thật.</text><text x="60.0" y="577.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Ý định của con người</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Muốn đua nhanh và đúng luật; phần lớn không được viết ra.</text><rect x="84.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đua nhanh, đúng luật</text><rect x="84.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chất lượng và an toàn</text><rect x="84.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuẩn mực và bối cảnh ngầm</text><rect x="612.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Đặc tả được ghi</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ số được chọn vì dễ đo, không phải vì phản ánh đầy đủ ý định.</text><rect x="636.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Maximize score</text><rect x="636.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chỉ số dễ đo, dễ ghi</text><rect x="636.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent tối ưu đúng điều này</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Con người lấp khoảng trống bằng bối cảnh và chuẩn mực ngầm; AI chỉ tối ưu đúng những gì được chỉ định.</text></svg>
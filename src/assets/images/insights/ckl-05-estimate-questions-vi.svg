<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" role="img" aria-label="Sáu câu hỏi để tự ước tính: về vị trí có rủi ro cao gồm ai, thời gian đạt 80% năng lực và mức giảm năng suất; về chi phí cụ thể gồm lương, chi phí sai sót hàng tháng và mức tăng khi có người mới." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="494" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tự ước tính chi phí cho doanh nghiệp của bạn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dùng dữ liệu thực của doanh nghiệp thay vì số liệu nghiên cứu từ điều kiện khác.</text><line x1="60.0" y1="410.0" x2="1140.0" y2="410.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="432.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự ước tính theo bài viết; công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="473.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="188.4" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Về vị trí có rủi ro cao</text><circle cx="94.0" cy="202.0" r="5" fill="var(--p)"/><text x="112.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ai là 3–5 người mà nếu họ nghỉ, vận hành bị ảnh hưởng đáng kể?</text><circle cx="94.0" cy="233.6" r="5" fill="var(--p)"/><text x="112.0" y="238.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Với mỗi người, mất bao lâu để người thay thế đạt 80% năng lực?</text><circle cx="94.0" cy="265.2" r="5" fill="var(--p)"/><text x="112.0" y="270.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Trong thời gian đó, năng suất của ca hoặc bộ phận giảm khoảng</text><text x="112.0" y="289.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">bao nhiêu %?</text><rect x="612.0" y="134.0" width="528.0" height="188.4" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Về chi phí cụ thể</text><circle cx="646.0" cy="202.0" r="5" fill="var(--p)"/><text x="664.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mức lương và phúc lợi của các vị trí này là bao nhiêu?</text><circle cx="646.0" cy="233.6" r="5" fill="var(--p)"/><text x="664.0" y="238.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chi phí sai sót và lãng phí nguyên liệu trung bình một tháng bình</text><text x="664.0" y="258.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thường là bao nhiêu?</text><circle cx="646.0" cy="284.8" r="5" fill="var(--p)"/><text x="664.0" y="289.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Con số đó tăng bao nhiêu % khi có người mới?</text><rect x="60.0" y="338.4" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="372.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ đó ước tính chi phí cho từng vị trí rủi ro cao và so với chi phí giữ chân, chuyển giao tri thức.</text></svg>
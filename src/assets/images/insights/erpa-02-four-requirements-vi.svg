<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img" aria-label="Bốn yêu cầu ERP đặt ra với hệ thống kế toán: chart of accounts nhất quán, phương pháp phân bổ chi phí, kỳ kế toán và số dư đầu kỳ sạch đã đối chiếu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="486" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn yêu cầu ERP đặt ra với hệ thống kế toán</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP cần được cấu hình theo các quyết định mà doanh nghiệp đã chốt.</text><line x1="60.0" y1="402.0" x2="1140.0" y2="402.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="424.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="465.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chart of accounts</text><text x="76.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đủ chi tiết cho vận hành, không</text><text x="76.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quá phức tạp; cùng loại giao dịch</text><text x="76.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vào cùng tài khoản.</text><rect x="334.0" y="134.0" width="259.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="366.0" cy="166.0" r="15" fill="var(--p)"/><text x="366.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="350.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Phương pháp</text><text x="350.0" y="239.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">phân bổ chi phí</text><text x="350.0" y="270.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhất quán, có tài liệu; ERP không</text><text x="350.0" y="290.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tự quyết định thay doanh nghiệp.</text><rect x="608.0" y="134.0" width="259.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="166.0" r="15" fill="var(--p)"/><text x="640.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="624.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kỳ kế toán</text><text x="624.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tháng kế toán, năm tài chính và</text><text x="624.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">các kỳ đặc biệt như điều chỉnh</text><text x="624.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cuối năm.</text><rect x="882.0" y="134.0" width="259.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="914.0" cy="166.0" r="15" fill="var(--p)"/><text x="914.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="898.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Số dư đầu kỳ sạch</text><text x="898.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chính xác, đã đối chiếu và được</text><text x="898.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người có thẩm quyền kiểm tra</text><text x="898.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trước khi nhập.</text><rect x="60.0" y="331.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="364.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP cần các quyết định này được chốt trước khi cấu hình.</text></svg>
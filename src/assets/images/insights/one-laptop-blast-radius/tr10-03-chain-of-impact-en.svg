<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="A chain of five links from person, endpoint, service or container, and processing system to assets and records, each with a question the organization must answer." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="604" class="bgr"/><rect x="60" y="26" width="190.9951171875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">ILLUSTRATIVE SCENARIO</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">The chain of impact from one person to organizational assets</text><g transform="translate(0 140)"><rect x="60" y="0" width="322.6666666666667" height="155" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">LINK 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Person</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">What do they hold, what are they</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">granted?</text><rect x="438.6666666666667" y="0" width="322.6666666666667" height="155" rx="16" class="bb"/><text x="460.6666666666667" y="35" font-size="13" font-weight="600" class="mut">LINK 2</text><text x="460.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Endpoint</text><text x="460.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Which sessions does the device</text><text x="460.6666666666667" y="126" font-size="17" font-weight="400" class="mut">hold?</text><rect x="817.3333333333334" y="0" width="322.6666666666667" height="155" rx="16" class="bb"/><text x="839.3333333333334" y="35" font-size="13" font-weight="600" class="mut">LINK 3</text><text x="839.3333333333334" y="70" font-size="22" font-weight="600" class="tx">Service, container</text><text x="839.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Which services can be called from</text><text x="839.3333333333334" y="126" font-size="17" font-weight="400" class="mut">here?</text><line x1="388.6666666666667" y1="77.5" x2="420.6666666666667" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M418.6666666666667 68.5 l14 9 l-14 9z" class="arf"/><line x1="767.3333333333334" y1="77.5" x2="799.3333333333334" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M797.3333333333334 68.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="211" width="512" height="131" rx="16" class="bb"/><text x="82" y="246" font-size="13" font-weight="600" class="mut">LINK 4</text><text x="82" y="281" font-size="22" font-weight="600" class="tx">Processing system</text><text x="82" y="313" font-size="17" font-weight="400" class="mut">Which actions can it perform?</text><rect x="628" y="211" width="512" height="131" rx="16" class="bp"/><text x="650" y="246" font-size="13" font-weight="600" class="tp">LINK 5</text><text x="650" y="281" font-size="22" font-weight="600" class="tp">Assets, records</text><text x="650" y="313" font-size="17" font-weight="400" class="mut">What could be changed or taken?</text><line x1="578" y1="276.5" x2="610" y2="276.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 267.5 l14 9 l-14 9z" class="arf"/><path d="M978.6666666666667 159 V183 H316 V197" class="ar" fill="none" stroke-width="3" stroke-dasharray="6 6"/><path d="M307 197 l9 14 l9 -14z" class="arf"/></g><text x="60" y="516" font-size="13" font-weight="400" class="mut">Illustrative scenario, not a real case or measured data.</text><text x="60" y="536" font-size="13" font-weight="400" class="mut">An illustrative model, not a technical diagram confirmed by Binance.</text><text x="60" y="556" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

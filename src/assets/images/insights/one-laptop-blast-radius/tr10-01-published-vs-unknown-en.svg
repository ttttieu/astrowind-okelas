<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Three cards: what Binance stated early on, third-party analysis that is not confirmed, and what is still unknown such as the root cause." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">What is stated, outside analysis, and what is unknown</text><g transform="translate(0 141.3)"><rect x="60" y="0" width="349.3333333333333" height="179" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">STATED BY BINANCE</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Preliminary account</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">A DevOps laptop may be</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">compromised; no evidence of a key</text><text x="82" y="150" font-size="17" font-weight="400" class="mut">leak; more points of breach.</text><rect x="425.3333333333333" y="0" width="349.3333333333333" height="179" rx="16" class="bp"/><text x="447.3333333333333" y="35" font-size="13" font-weight="600" class="tp">THIRD-PARTY ANALYSIS</text><text x="447.3333333333333" y="70" font-size="22" font-weight="600" class="tp">Not a confirmation</text><text x="447.3333333333333" y="102" font-size="17" font-weight="400" class="mut">TRM Labs: most assets left in roughly</text><text x="447.3333333333333" y="126" font-size="17" font-weight="400" class="mut">20 minutes. Estimates differ between</text><text x="447.3333333333333" y="150" font-size="17" font-weight="400" class="mut">firms.</text><rect x="790.6666666666666" y="0" width="349.3333333333333" height="179" rx="16" class="bg"/><text x="812.6666666666666" y="35" font-size="13" font-weight="600" class="mut">NOT YET KNOWN</text><text x="812.6666666666666" y="70" font-size="22" font-weight="600" class="tx">Still open</text><text x="812.6666666666666" y="102" font-size="17" font-weight="400" class="mut">The root cause, the additional entry</text><text x="812.6666666666666" y="126" font-size="17" font-weight="400" class="mut">points, how the attacker obtained</text><text x="812.6666666666666" y="150" font-size="17" font-weight="400" class="mut">enough authority.</text></g><text x="60" y="354.3" font-size="13" font-weight="400" class="mut">As of November 1, 2026; the investigation is ongoing.</text></svg>

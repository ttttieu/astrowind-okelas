<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="ERP cần hai loại dữ liệu: master data (sản phẩm, nhà cung cấp, khách hàng, chart of accounts, cơ cấu tổ chức) phải chính xác trước go-live, và transactional data (đơn hàng, hóa đơn, tồn kho, số dư kế toán) mà mức độ chuyển là quyết định kinh doanh." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP cần hai loại dữ liệu: master và transactional</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một loại phải chính xác trước go-live; loại kia chỉ cần chuyển ở mức cần thiết.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Master data</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thực thể nền tảng, ít thay đổi, dùng trong mọi giao dịch</text><rect x="84.0" y="238.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="265.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm/SKU: mã, đơn vị tính, nhóm hàng, giá, BOM</text><rect x="84.0" y="292.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="319.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhà cung cấp và khách hàng</text><rect x="84.0" y="346.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chart of accounts</text><rect x="84.0" y="400.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="427.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cơ cấu tổ chức: chi nhánh, kho, trung tâm chi phí</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Transactional data</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lịch sử hoạt động đã phát sinh</text><rect x="636.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="876.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đơn hàng, hóa đơn</text><rect x="636.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="876.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tồn kho và số dư kế toán</text><rect x="636.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="876.0" y="408.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không cần chuyển toàn bộ: nhiều dự án chỉ chuyển số dư tại thời</text><text x="876.0" y="427.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">điểm cutover</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Master data phải chính xác trước go-live. Chuyển bao nhiêu lịch sử là quyết định kinh doanh.</text></svg>
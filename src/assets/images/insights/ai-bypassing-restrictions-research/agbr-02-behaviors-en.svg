<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Three behavior cards, each tagged as in simulated environments; a stat card below showing more than 85 percent." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three behaviors recorded in test environments</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chain-of-thought analysis showed models reasoning about concealment; every observation came from simulated environments.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Based on the article and Apollo Research (December 2024); behaviors observed in simulated environments.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">In simulated environments</text><text x="80.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Deliberately introducing small errors</text><text x="80.0" y="219.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">into responses</text><rect x="424.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="444.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">In simulated environments</text><text x="444.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Attempting to disable</text><text x="444.0" y="219.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">oversight mechanisms</text><rect x="788.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="808.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">In simulated environments</text><text x="808.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Attempting to copy itself out when</text><text x="808.0" y="219.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">told it might be replaced</text><rect x="60.0" y="284.0" width="1080.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="340.4" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">&gt;85%</text><text x="300.0" y="335.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Share of follow-up questions in which o1 kept denying the behavior after it had occurred.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Every observation comes from a simulated environment designed to surface the capability.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Two columns: controlled experiments with three points; what not to conclude with three points." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Controlled experiments are not real incidents</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Apollo Research (December 2024) measured latent capability under designed conditions, not product incidents.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Summary of research as presented in the article; not an incident in any commercial product.</text><text x="60.0" y="577.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Controlled experiments</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Models were strongly pushed toward a goal in environments designed</text><text x="84.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">for the test.</text><rect x="84.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">6 models, 6 agentic scenarios</text><rect x="84.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Deliberately designed test environments</text><rect x="84.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Strong nudge toward one goal</text><rect x="612.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">What not to conclude</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lab results are not evidence that this behavior occurs in</text><text x="636.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ordinary operation.</text><rect x="636.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Behavior in commercial products</text><rect x="636.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Frequency in ordinary operation</text><rect x="636.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Direct application to your running system</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The evidence shows capability, not propensity.</text></svg>
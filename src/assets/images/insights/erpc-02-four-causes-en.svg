<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Four reasons scope creep is common in ERP: ERP touches the whole organization, requirements surface during implementation, small changes are underestimated and governance is absent, the root cause." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="496" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four reasons scope creep is common in ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The root cause is no clear owner or process for deciding requests.</text><line x1="60.0" y1="412.0" x2="1140.0" y2="412.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="434.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="475.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ERP touches the</text><text x="76.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">entire organization</text><text x="76.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Every department has</text><text x="76.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">requirements and considers</text><text x="76.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">them urgent.</text><rect x="334.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="350.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Requirements surface</text><text x="350.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">during implementation</text><text x="350.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Users spot gaps when they see a</text><text x="350.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">demo or prototype.</text><rect x="608.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Small changes are</text><text x="624.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">underestimated</text><text x="624.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">One added field can affect an</text><text x="624.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">approval workflow, calculation</text><text x="624.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">logic and reports.</text><rect x="882.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="898.0" y="150.0" width="86.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="941.4" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Root cause</text><text x="898.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Absent governance</text><text x="898.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">No one decides what is in phase</text><text x="898.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">one, deferred or declined.</text><rect x="60.0" y="341.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="374.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without structure the default drifts to “add it”, because agreeing avoids immediate conflict.</text></svg>
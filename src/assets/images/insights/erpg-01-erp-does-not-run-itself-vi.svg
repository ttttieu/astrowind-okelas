<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-label="Doanh nghiệp thay đổi về sản phẩm, quy trình, nhân sự và cơ cấu nên ERP phải được cập nhật theo; không có governance thì dữ liệu xuống cấp dần và vấn đề không người xử lý tích lũy." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="562" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP không tự vận hành sau go-live</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP phản ánh doanh nghiệp, nên phải được cập nhật khi doanh nghiệp thay đổi.</text><line x1="60.0" y1="478.0" x2="1140.0" y2="478.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="500.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="541.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="480.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="173.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Doanh nghiệp thay đổi</text><rect x="84.0" y="200.0" width="204.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="186.0" y="224.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm</text><rect x="300.0" y="200.0" width="204.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="402.0" y="224.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình</text><rect x="84.0" y="248.0" width="204.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="186.0" y="272.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân sự</text><rect x="300.0" y="248.0" width="204.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="402.0" y="272.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Cơ cấu</text><line x1="546.0" y1="219.0" x2="644.0" y2="219.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="654.0,219.0 644.0,224.5 644.0,213.5" fill="var(--gm)"/><rect x="660.0" y="134.0" width="480.0" height="170.0" rx="16" fill="var(--ink)"/><text x="900.0" y="204.1" font-size="36" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP</text><text x="900.0" y="255.8" font-size="16" font-weight="400" fill="var(--onink)" text-anchor="middle">Phản ánh hoạt động thực tế, nên phải cập nhật theo</text><rect x="60.0" y="320.0" width="1080.0" height="72.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="80.0" y="308.0" width="151.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="155.9" y="324.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Không có governance</text><text x="330.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu xuống cấp dần</text><text x="870.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Vấn đề không người xử lý tích lũy</text><rect x="60.0" y="408.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="441.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Governance: vai trò, quy trình và quyết định giúp ERP phản ánh đúng thực tế sau go-live.</text></svg>
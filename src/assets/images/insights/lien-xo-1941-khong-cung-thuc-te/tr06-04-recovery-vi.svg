<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn cách kết nối lại: làm rõ ai quyết định, giảm tầng cho khớp năng lực, đưa người quyết định đến gần thực tế, phục hồi kỷ luật thông tin." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Bốn cách kết nối lại</text><g transform="translate(0 144)"><rect x="60" y="0" width="530" height="99" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">CÁCH 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Làm rõ ai quyết định</text><rect x="610" y="0" width="530" height="99" rx="16" class="bb"/><text x="632" y="35" font-size="13" font-weight="600" class="mut">CÁCH 2</text><text x="632" y="70" font-size="22" font-weight="600" class="tx">Giảm tầng cho khớp năng lực</text><rect x="60" y="119" width="530" height="99" rx="16" class="bb"/><text x="82" y="154" font-size="13" font-weight="600" class="mut">CÁCH 3</text><text x="82" y="189" font-size="22" font-weight="600" class="tx">Đưa người quyết định đến gần thực tế</text><rect x="610" y="119" width="530" height="99" rx="16"
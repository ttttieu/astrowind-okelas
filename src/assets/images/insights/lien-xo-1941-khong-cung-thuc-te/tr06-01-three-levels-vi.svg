<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 607" width="1200" height="607" role="img" aria-label="Ba tầng mất kết nối: nhìn thấy thực tế, quyết định đúng thời điểm, điều chỉnh." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="607" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba tầng mất kết nối</text><g transform="translate(0 108)"><rect x="60" y="0" width="1080" height="131" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">TẦNG 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Nhìn thấy thực tế</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Thông tin có đến được người quyết định, và có đúng không.</text><line x1="600" y1="135" x2="600" y2="151" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M591 149 l9 14 l9 -14z" class="arf"/><rect x="60" y="167" width="1080" height="131" rx="16" class="bb"/><text x="82" y="202" font-size="13" font-weight="600" class="mut">TẦNG 2</text><text x="82" y="237" font-size="22" font-weight="600" class="tx">Quyết định đúng thời điểm</text><text x="82" y="269" font-size="17" font-weight="400" class="mut">Quyết định có dựa trên bức tranh còn hiệu lực không.</text><line x1="600" y1="302" x2="600" y2="318" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M591 316 l9 14 l9 -14z" class="arf"/><rect x="60" y="334" width="1080" height="131" rx="16" class="bb"/><text x="82" y="369" font-size="13" font-weight="600" class="mut">TẦNG 3</text><text x="82" y="404" font-size="22" font-weight="600" class="tx">Điều chỉnh</text><text x="82" y="436" font-size="17" font-weight="400" class="mut">Khi thực tế khác kế hoạch, tổ chức có sửa được không.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img" aria-label="Bảng ba tầng mất kết nối trong doanh nghiệp, kèm biểu hiện và câu hỏi dành cho CEO ở mỗi tầng." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="486" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba tầng mất kết nối trong doanh nghiệp</text><g transform="translate(0 108)"><text x="64" y="16" font-size="14" font-weight="700" class="mut">Tầng</text><text x="325.52941176470586" y="16" font-size="14" font-weight="700" class="mut">Biểu hiện trong doanh nghiệp</text><text x="741.7647058823529" y="16" font-size="14" font-weight="700" class="mut">Câu hỏi cho CEO</text><rect x="60" y="34" width="247.52941176470586" height="94" rx="16" class="bg"/><text x="82" y="74" font-size="18" font-weight="600" class="tx">1. Nhìn thấy thực tế</text><rect x="321.52941176470586" y="34" width="402.2352941176471" height="94" rx="16" class="bb"/><text x="343.52941176470586" y="75" font-size="19" font-weight="600" class="tx">Báo cáo tô hồng; số liệu trễ; dữ liệu</text><text x="343.52941176470586" y="100" font-size="19" font-weight="600" class="tx">mất ngữ cảnh</text><rect x="737.7647058823529" y="34" width="402.2352941176471" height="94" rx="16" class="bp"/><text x="759.7647058823529" y="75" font-size="19" font-weight="600" class="tp">Tôi biết tình hình thật của xưởng sau</text><text x="759.7647058823529" y="100" font-size="19" font-weight="600" class="tp">bao lâu?</text><rect x="60" y="142" width="247.52941176470586" height="94" rx="16" class="bg"/><text x="82" y="182" font-size="18" font-weight="600" class="tx">2. Quyết định đúng</text><text x="82" y="205" font-size="18" font-weight="600" class="tx">thời điểm</text><rect x="321.52941176470586" y="142" width="402.2352941176471" height="94" rx="16" class="bb"/><text x="343.52941176470586" y="183" font-size="19" font-weight="600" class="tx">Ngân sách, KPI dựa trên giả định</text><text x="343.52941176470586" y="208" font-size="19" font-weight="600" class="tx">lỗi thời</text><rect x="737.7647058823529" y="142" width="402.2352941176471" height="94" rx="16" class="bp"/><text x="759.7647058823529" y="183" font-size="19" font-weight="600" class="tp">Khi giả định thay đổi, ai phát hiện?</text><rect x="60" y="250" width="247.52941176470586" height="94" rx="16" class="bg"/><text x="82" y="290" font-size="18" font-weight="600" class="tx">3. Điều chỉnh</text><rect x="321.52941176470586" y="250" width="402.2352941176471" height="94" rx="16" class="bb"/><text x="343.52941176470586" y="291" font-size="19" font-weight="600" class="tx">Phòng ban biết vấn đề nhưng không</text><text x="343.52941176470586" y="316" font-size="19" font-weight="600" class="tx">dám nói</text><rect x="737.7647058823529" y="250" width="402.2352941176471" height="94" rx="16" class="bp"/><text x="759.7647058823529" y="291" font-size="19" font-weight="600" class="tp">Người phát hiện vấn đề có an toàn để</text><text x="759.7647058823529" y="316" font-size="19" font-weight="600" class="tp">thay đổi kế hoạch?</text></g></svg>

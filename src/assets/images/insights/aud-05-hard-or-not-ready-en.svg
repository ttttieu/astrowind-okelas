<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-label="A difficult audit and a demanding auditor are often blamed but are not the root; the real issue is that operations, documents and records aren’t ready to be examined." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="566" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Is the audit hard, or is the system not ready?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A question worth asking when audit preparation takes weeks.</text><line x1="60.0" y1="482.0" x2="1140.0" y2="482.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="504.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="545.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="420.0" height="262.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">What it’s often blamed on</text><rect x="84.0" y="200.0" width="372.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="270.0" y="229.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The audit is too difficult</text><rect x="84.0" y="258.0" width="372.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="270.0" y="287.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The auditor is too demanding</text><text x="84.0" y="336.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Not the root of the problem.</text><line x1="488.0" y1="265.0" x2="524.0" y2="265.0" stroke="var(--mut)" stroke-width="2"/><polygon points="532.0,265.0 524.0,269.4 524.0,260.6" fill="var(--mut)"/><rect x="540.0" y="134.0" width="600.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="564.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">The real issue</text><rect x="564.0" y="200.0" width="552.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="840.0" y="229.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Daily operations don’t generate evidence ready to present</text><rect x="564.0" y="258.0" width="552.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="840.0" y="287.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Documents aren’t maintained continuously</text><rect x="564.0" y="316.0" width="552.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="840.0" y="345.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Records aren’t structured for quick consolidation</text><rect x="60.0" y="412.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="445.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The problem isn’t that the audit is hard, but that the system isn’t ready to be examined.</text></svg>
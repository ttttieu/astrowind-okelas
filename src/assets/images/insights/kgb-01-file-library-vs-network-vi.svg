<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="So sánh thư viện file, nơi mỗi file nằm riêng trong folder sản phẩm, chất lượng, nhà cung cấp, với mạng lưới tri thức nối sản phẩm A, nguyên liệu M, nhà cung cấp XYZ, tiêu chuẩn T-001, quy trình KT-003 và người phụ trách chất lượng bằng các quan hệ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ thư viện file sang mạng lưới tri thức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cùng một thông tin, nhưng tổ chức theo folder hay theo quan hệ.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ minh họa theo bài viết (tên và mã là giả định), không phải số liệu đo lường.</text><text x="60.0" y="651.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="368.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Thư viện file</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi file tồn tại độc lập</text><text x="84.0" y="238.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Sản phẩm</text><rect x="84.0" y="248.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="274.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Đặc tả kỹ thuật SP-A</text><rect x="330.0" y="248.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="274.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Quy trình sản xuất SP-A</text><text x="84.0" y="328.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Chất lượng</text><rect x="84.0" y="338.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="364.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Quy trình kiểm tra đầu vào</text><rect x="330.0" y="338.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="364.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Tiêu chuẩn chấp nhận nguyên liệu</text><text x="84.0" y="418.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Nhà cung cấp</text><rect x="84.0" y="428.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="454.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Hợp đồng NCC-XYZ</text><rect x="330.0" y="428.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="454.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Đánh giá NCC-XYZ</text><rect x="612.0" y="134.0" width="528.0" height="368.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Mạng lưới tri thức</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thực thể được ghi nhận và kết nối</text><rect x="655.0" y="222.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="242.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm A</text><line x1="760.0" y1="256.0" x2="760.0" y2="271.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,278.0 756.1,271.0 763.9,271.0" fill="var(--s)"/><text x="774.0" y="271.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">dùng nguyên liệu</text><rect x="655.0" y="280.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="300.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nguyên liệu M</text><line x1="760.0" y1="314.0" x2="760.0" y2="329.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,336.0 756.1,329.0 763.9,329.0" fill="var(--s)"/><text x="774.0" y="329.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">áp dụng tiêu chuẩn</text><rect x="655.0" y="338.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="358.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Tiêu chuẩn T-001</text><line x1="760.0" y1="372.0" x2="760.0" y2="387.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,394.0 756.1,387.0 763.9,387.0" fill="var(--s)"/><text x="774.0" y="387.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">được kiểm tra theo</text><rect x="655.0" y="396.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="416.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình KT-003</text><line x1="760.0" y1="430.0" x2="760.0" y2="445.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,452.0 756.1,445.0 763.9,445.0" fill="var(--s)"/><text x="774.0" y="445.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">được phê duyệt bởi</text><rect x="655.0" y="454.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="474.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Người phụ trách chất lượng</text><rect x="1000.0" y="280.0" width="130.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><text x="1065.0" y="300.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhà cung cấp XYZ</text><line x1="869.0" y1="296.0" x2="989.0" y2="296.0" stroke="var(--a)" stroke-width="1.8"/><polygon points="996.0,296.0 989.0,299.9 989.0,292.1" fill="var(--a)"/><text x="901.0" y="314.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">cung cấp bởi</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khác biệt không nằm ở thông tin có gì, mà ở chỗ thông tin được tổ chức theo quan hệ.</text></svg>
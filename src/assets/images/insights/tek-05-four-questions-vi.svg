<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" width="1200" height="484" role="img" aria-label="Bốn câu hỏi: tri thức nào là explicit, tri thức nào là tacit và rủi ro cao, phần nào của tacit có thể explicit hóa một phần, và chiến lược nào giảm rủi ro mà không cần tài liệu hóa hoàn toàn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="484" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn câu hỏi để phân biệt tri thức trong tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Những câu hỏi một chiến lược knowledge management cần trả lời.</text><line x1="60.0" y1="400.0" x2="1140.0" y2="400.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="422.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá theo bài viết; công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="463.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="168.0" r="15" fill="var(--p)"/><text x="94.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="167.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức nào trong tổ chức là explicit và có thể quản lý tốt</text><text x="122.0" y="188.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">hơn qua tài liệu?</text><rect x="606.0" y="134.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="168.0" r="15" fill="var(--p)"/><text x="640.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="167.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức nào là tacit và đang ở rủi ro cao nếu người nắm giữ</text><text x="668.0" y="188.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">rời đi?</text><rect x="60.0" y="230.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="264.0" r="15" fill="var(--p)"/><text x="94.0" y="269.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="263.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Phần nào của tacit knowledge có thể explicit hóa một phần,</text><text x="122.0" y="284.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">và có đáng đầu tư không?</text><rect x="606.0" y="230.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="264.0" r="15" fill="var(--p)"/><text x="640.0" y="269.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="263.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Chiến lược nào giảm rủi ro mất tacit knowledge mà không</text><text x="668.0" y="284.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">cần tài liệu hóa hoàn toàn?</text><rect x="60.0" y="330.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="363.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Các câu hỏi này bắt đầu từ sự phân biệt giữa hai loại tri thức.</text></svg>
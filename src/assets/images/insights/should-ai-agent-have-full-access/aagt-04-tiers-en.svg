<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="A two-axis grid of consequence and reversibility with four cells." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tiers based on consequence and reversibility</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The framework the article proposes applies to each type of action an agent can take.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tiered framework as the article proposes it; the specific authority per tier is set by the business.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="150.0" y="150.0" width="460.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="380.0" y="221.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Low consequence, easy to reverse</text><rect x="622.0" y="150.0" width="460.0" height="130.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="852.0" y="221.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">High consequence, easy to reverse</text><rect x="150.0" y="292.0" width="460.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="380.0" y="363.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Low consequence, hard to reverse</text><rect x="622.0" y="292.0" width="460.0" height="130.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="852.0" y="363.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">High consequence, hard to reverse</text><text x="60.0" y="215.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Reversibility</text><text x="610.0" y="465.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Consequence →</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Authority should be matched to the consequences and reversibility of each action.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Two horizontal scales: capability with a marker on the right, authority with a marker on the left, showing two independent axes." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Capability and authority are independent axes</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An agent being able to do something does not mean it is permitted to do it.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Description as presented in the article; positions on the two scales are illustrative, not measured data.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="172.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Capability</text><rect x="60.0" y="200.0" width="1080.0" height="12.0" rx="6" fill="var(--gm)"/><circle cx="800.0" cy="206.0" r="14" fill="var(--p)"/><text x="60.0" y="239.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">low</text><text x="1140.0" y="239.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="end">high</text><text x="60.0" y="312.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Authority</text><rect x="60.0" y="340.0" width="1080.0" height="12.0" rx="6" fill="var(--gm)"/><circle cx="260.0" cy="346.0" r="14" fill="var(--a)"/><text x="60.0" y="379.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">low</text><text x="1140.0" y="379.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="end">high</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Capability is widely advertised and easy to measure; authority is often left open because it has no ready formula.</text></svg>
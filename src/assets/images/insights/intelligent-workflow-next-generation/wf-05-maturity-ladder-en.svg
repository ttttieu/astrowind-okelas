<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" role="img" aria-label="Five workflow maturity levels from digitized to governed agentic; do not jump straight from approval workflow to agentic workflow." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="724" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Workflow maturity roadmap: five levels, one step at a time</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Know which level you are at before choosing the next step.</text><line x1="60.0" y1="662.0" x2="1140.0" y2="662.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="684.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Levels 1–5 are OKELAS's workflow maturity scale, separate from the 5 digitalization levels. It is a discussion aid, not a certified methodology.</text><rect x="60.0" y="136.0" width="560.0" height="104.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="82.0" y="171.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Do not jump straight from approval workflow to agentic</text><text x="82.0" y="194.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">workflow. The next step must make economic sense for</text><text x="82.0" y="216.6" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">the business.</text><rect x="60.0" y="360.0" width="204.0" height="196.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="76.0" y="374.0" width="60.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--s)" stroke-width="1.2"/><text x="106.1" y="390.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Level 1</text><text x="76.0" y="427.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Digitized workflow</text><text x="76.0" y="453.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Paper becomes</text><text x="76.0" y="472.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">electronic forms and</text><text x="76.0" y="492.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">basic approval chains.</text><text x="76.0" y="511.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Capture data, stop</text><text x="76.0" y="531.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">losing paperwork.</text><rect x="279.0" y="326.0" width="204.0" height="230.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="295.0" y="340.0" width="62.6" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--s)" stroke-width="1.2"/><text x="326.3" y="356.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Level 2</text><text x="295.0" y="393.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Structured</text><text x="295.0" y="415.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">workflow</text><text x="295.0" y="441.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Roles, branching</text><text x="295.0" y="460.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">conditions and step-level</text><text x="295.0" y="480.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SLAs. Processing time</text><text x="295.0" y="499.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and bottlenecks become</text><text x="295.0" y="519.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">measurable.</text><rect x="498.0" y="292.0" width="204.0" height="264.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="514.0" y="306.0" width="62.7" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--s)" stroke-width="1.2"/><text x="545.4" y="322.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Level 3</text><text x="514.0" y="359.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Connected /</text><text x="514.0" y="381.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">end-to-end</text><text x="514.0" y="407.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Crosses departments</text><text x="514.0" y="426.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and systems, tied to</text><text x="514.0" y="446.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">evidence, with</text><text x="514.0" y="465.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lifecycle traceability.</text><rect x="717.0" y="258.0" width="204.0" height="298.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="733.0" y="272.0" width="63.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--s)" stroke-width="1.2"/><text x="764.6" y="288.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Level 4</text><text x="733.0" y="325.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Event-driven</text><text x="733.0" y="347.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">workflow</text><text x="733.0" y="373.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Reacts to real-world</text><text x="733.0" y="392.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">events instead of waiting</text><text x="733.0" y="412.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">for manual initiation.</text><rect x="936.0" y="224.0" width="204.0" height="332.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><rect x="952.0" y="238.0" width="62.7" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="983.3" y="254.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Level 5</text><text x="952.0" y="291.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Agentic, governed</text><text x="952.0" y="317.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI agents handle part</text><text x="952.0" y="336.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">of the work, with</text><text x="952.0" y="356.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">context, evidence and</text><text x="952.0" y="375.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">human-in-the-loop.</text><rect x="60.0" y="578.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="611.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">What matters is knowing which level you are at, and whether the next step makes economic sense.</text></svg>
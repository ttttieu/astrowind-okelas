<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="Eight signs a workflow is stuck at an earlier generation; five or more means the issue is workflow architecture, not a missing tool." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="770" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Eight signs your workflow is stuck in an earlier generation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tick what applies to your organization.</text><line x1="60.0" y1="708.0" x2="1140.0" y2="708.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="730.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The categories and framework shown are OKELAS's way of framing the topic: a discussion aid, not a certified methodology.</text><rect x="60.0" y="132.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="182.0" r="17" fill="var(--p)"/><text x="96.0" y="188.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="177.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">You still need someone to chase people to keep a</text><text x="126.0" y="198.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">process moving.</text><rect x="610.0" y="132.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="182.0" r="17" fill="var(--p)"/><text x="646.0" y="188.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="676.0" y="177.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Exceptions fall back to email or personal messages</text><text x="676.0" y="198.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">every time.</text><rect x="60.0" y="250.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="300.0" r="17" fill="var(--p)"/><text x="96.0" y="306.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="295.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">The person approving a later step lacks the context from</text><text x="126.0" y="316.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">earlier steps.</text><rect x="610.0" y="250.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="300.0" r="17" fill="var(--p)"/><text x="646.0" y="306.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="676.0" y="295.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">You can’t say where a request is, or why it is late, without</text><text x="676.0" y="316.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">asking the person handling it.</text><rect x="60.0" y="368.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="418.0" r="17" fill="var(--p)"/><text x="96.0" y="424.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="126.0" y="413.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow only starts when someone clicks, and never</text><text x="126.0" y="434.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">reacts to a real-world event.</text><rect x="610.0" y="368.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="418.0" r="17" fill="var(--p)"/><text x="646.0" y="424.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="676.0" y="413.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">A core process (complaints, engineering change, quality</text><text x="676.0" y="434.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">incidents) has never been modeled end-to-end.</text><rect x="60.0" y="486.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="536.0" r="17" fill="var(--p)"/><text x="96.0" y="542.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="126.0" y="531.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">You tried AI somewhere, but it isn’t attached to a</text><text x="126.0" y="552.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">specific workflow.</text><rect x="610.0" y="486.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="536.0" r="17" fill="var(--p)"/><text x="646.0" y="542.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="676.0" y="531.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">You can’t explain a three-month-old operational decision,</text><text x="676.0" y="552.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">with evidence.</text><rect x="60.0" y="610.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="643.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Five or more: the issue is likely the architecture and maturity of your workflow, not a missing tool.</text></svg>
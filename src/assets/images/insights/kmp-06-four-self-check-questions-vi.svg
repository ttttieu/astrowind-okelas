<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Bốn câu hỏi tự đánh giá mức phụ thuộc vào cá nhân: nhân sự chủ chốt rời đi, truy nguyên sự cố, nhân viên mới tự tra cứu và thời gian chuẩn bị audit." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn câu hỏi để tự đánh giá tri thức tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điểm bắt đầu đúng là đánh giá trung thực, không phải mua phần mềm.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá định hướng từ bài viết, là công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nếu 2–3 nhân viên quan trọng nhất cùng rời đi, tổ chức</text><text x="122.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">có vận hành bình thường không?</text><rect x="606.0" y="134.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--p)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khi có sự cố chất lượng, xác định nguyên nhân trong</text><text x="668.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">một ngày hay mất nhiều ngày thu thập từ nhiều người?</text><rect x="60.0" y="250.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="286.0" r="15" fill="var(--p)"/><text x="94.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="286.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân viên mới tự tra cứu quy trình và làm việc</text><text x="122.0" y="308.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">độc lập, hay vẫn phụ thuộc người hướng dẫn cho</text><text x="122.0" y="331.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">mọi tình huống?</text><rect x="606.0" y="250.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="286.0" r="15" fill="var(--p)"/><text x="640.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="286.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khi audit đến, chuẩn bị mất vài ngày hay nhiều tuần?</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần lớn câu trả lời cho thấy phụ thuộc vào cá nhân? Hãy bắt đầu từ quy trình quan trọng nhất.</text></svg>
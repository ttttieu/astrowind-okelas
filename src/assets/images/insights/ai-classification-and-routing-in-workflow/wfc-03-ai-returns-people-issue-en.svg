<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="AI returns four parts: proposed type, confidence, supporting passage, multi-issue flag. An authorized person issues three decisions: which type goes to whom, the confidence threshold, and which types are never routed automatically." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">What AI returns, what people issue</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three decisions do not belong to AI.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">An orienting framework for discussion, not measured data.</text><text x="60.0" y="146.9" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">AI returns</text><text x="620.0" y="146.9" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">People issue</text><rect x="60.0" y="166.0" width="520.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="80.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Proposed type</text><text x="80.0" y="216.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Drawn from the category list the organization defined</text><rect x="60.0" y="244.0" width="520.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="80.0" y="270.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Confidence</text><text x="80.0" y="294.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">So the rule knows when to stop</text><rect x="60.0" y="322.0" width="520.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="80.0" y="348.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Supporting passage</text><text x="80.0" y="372.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A reviewer sees what AI relied on</text><rect x="60.0" y="400.0" width="520.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="80.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Multi-issue flag</text><text x="80.0" y="450.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Split the request instead of forcing one category</text><rect x="620.0" y="166.0" width="520.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="194.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Which type goes to whom</text><text x="640.0" y="218.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">With a backup for absence and a response time</text><rect x="620.0" y="268.0" width="520.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="296.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Confidence threshold</text><text x="640.0" y="320.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Below what level a case goes to the triager; depends on the cost</text><text x="640.0" y="340.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">of misrouting</text><rect x="620.0" y="370.0" width="520.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="398.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Types never routed automatically</text><text x="640.0" y="422.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">However confident AI is, because a wrong route is costly or hard</text><text x="640.0" y="442.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">to reverse</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A wrong label only has effect where the routing table allows.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="A suggestion at the file level has similar cases, how they were handled, outcomes and links to originals; three signs a suggestion has become an implicit decision are showing it as an answer, accepting the default without reading the file, and not tracking how often it is overridden." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="570" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Suggestions as a file, not as a decision</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The person who signs off on the handling is still the handler.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="146.9" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">At the file level (do this)</text><text x="620.0" y="146.9" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Becoming an implicit decision (avoid)</text><rect x="60.0" y="166.0" width="520.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="82.0" y="212.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Similar cases</text><rect x="60.0" y="258.0" width="520.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="82.0" y="304.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">How they were handled, and outcomes</text><rect x="60.0" y="350.0" width="520.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="82.0" y="396.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Links to the original cases</text><rect x="620.0" y="166.0" width="520.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="211.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">The suggestion is shown as an answer</text><rect x="620.0" y="258.0" width="520.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="303.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Accepted by default, the file no longer read</text><rect x="620.0" y="350.0" width="520.0" height="80.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="395.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">No one tracks how often it is overridden</text><rect x="60.0" y="448.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="481.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Every suggestion carries its source: which cases actually happened.</text></svg>
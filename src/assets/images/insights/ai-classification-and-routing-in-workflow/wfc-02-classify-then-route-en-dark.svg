<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="A free-text request goes to AI, which proposes a type with confidence, supporting passage and a multi-issue flag; a routing table and threshold issued by an authorized person decide: confident cases go to the recipient in the table, uncertain, multi-issue or off-table cases go to a triager with a file." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="608" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">AI reads the content, the routing table decides where it goes</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">AI understands and proposes; an authorized person issues the route.</text><line x1="60.0" y1="546.0" x2="1140.0" y2="546.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="568.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="232.0" width="200.0" height="110.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.4" stroke-dasharray="6 5"/><text x="76.0" y="267.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Free-text request</text><text x="76.0" y="319.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Email, message, note</text><rect x="300.0" y="180.0" width="270.0" height="214.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="320.0" y="217.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">AI reads the content</text><rect x="320.0" y="244.0" width="230.0" height="30.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.3"/><text x="435.0" y="263.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Proposed type</text><rect x="320.0" y="280.0" width="230.0" height="30.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.3"/><text x="435.0" y="299.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Confidence</text><rect x="320.0" y="316.0" width="230.0" height="30.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.3"/><text x="435.0" y="335.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Supporting passage</text><rect x="320.0" y="352.0" width="230.0" height="30.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.3"/><text x="435.0" y="371.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Multi-issue flag</text><rect x="610.0" y="232.0" width="240.0" height="110.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="626.0" y="263.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Routing table</text><text x="626.0" y="287.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">and threshold</text><text x="626.0" y="311.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Issued by an authorized person</text><rect x="910.0" y="140.0" width="230.0" height="116.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="926.0" y="170.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Recipient per the table</text><text x="926.0" y="219.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Confident, type is in the table</text><rect x="910.0" y="320.0" width="230.0" height="138.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="926.0" y="350.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Triager, with a file</text><text x="926.0" y="399.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Uncertain, multi-issue, or</text><text x="926.0" y="417.6" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">off-table type</text><line x1="264.0" y1="287.0" x2="286.0" y2="287.0" stroke="#2B74F5" stroke-width="3"/><polygon points="296.0,287.0 286.0,292.5 286.0,281.5" fill="#2B74F5"/><line x1="574.0" y1="287.0" x2="596.0" y2="287.0" stroke="#A78BFA" stroke-width="3"/><polygon points="606.0,287.0 596.0,292.5 596.0,281.5" fill="#A78BFA"/><line x1="854.0" y1="250.0" x2="897.8" y2="219.7" stroke="#2B74F5" stroke-width="3"/><polygon points="906.0,214.0 900.9,224.2 894.6,215.2" fill="#2B74F5"/><line x1="854.0" y1="326.0" x2="898.1" y2="359.9" stroke="#A78BFA" stroke-width="3"/><polygon points="906.0,366.0 894.7,364.3 901.4,355.5" fill="#A78BFA"/><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI produces a label that can be checked; it does not choose the recipient.</text></svg>
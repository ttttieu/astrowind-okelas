<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Keyword rules send a request to a shared inbox and then through a clerk, engineering and accounting; classify-then-route goes from the request through AI proposing a type and a routing table issued by people to reach the right person with fewer hand-offs." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">From many hand-offs to the right person</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The value is fewer reads and hand-offs.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Illustrative scenario from the article, not measured data.</text><rect x="60.0" y="130.0" width="1080.0" height="150.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="159.8" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="start">Keyword rules: the request is read and passed on many times</text><rect x="84.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="169.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Request</text><line x1="258.0" y1="222.0" x2="286.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="296.0,222.0 286.0,227.5 286.0,216.5" fill="#5B6575"/><rect x="300.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="385.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Shared inbox</text><line x1="474.0" y1="222.0" x2="502.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="512.0,222.0 502.0,227.5 502.0,216.5" fill="#5B6575"/><rect x="516.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="601.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Clerk</text><line x1="690.0" y1="222.0" x2="718.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="728.0,222.0 718.0,227.5 718.0,216.5" fill="#5B6575"/><rect x="732.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="817.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Engineering</text><line x1="906.0" y1="222.0" x2="934.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="944.0,222.0 934.0,227.5 934.0,216.5" fill="#5B6575"/><rect x="948.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1033.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Accounting</text><rect x="60.0" y="300.0" width="1080.0" height="150.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="329.8" font-size="15" font-weight="700" fill="#5FA0FF" text-anchor="start">Classify, then route: fewer hand-offs</text><rect x="84.0" y="362.0" width="200.0" height="60.0" rx="10" fill="#08090A" stroke="#F7F8F8" stroke-width="1.6"/><text x="184.0" y="397.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Request</text><line x1="288.0" y1="392.0" x2="317.0" y2="392.0" stroke="#2B74F5" stroke-width="3"/><polygon points="328.0,392.0 317.0,398.1 317.0,385.9" fill="#2B74F5"/><rect x="332.0" y="362.0" width="250.0" height="60.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="457.0" y="397.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">AI proposes type</text><line x1="586.0" 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="Six checkboxes in a grid, each a readiness dimension with one self-check question; the dimensions run in parallel, not in sequence." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="658" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six dimensions to assess, not six sequential gates</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">There is no universal pass mark. The level needed depends on what you expect AI to do.</text><line x1="60.0" y1="574.0" x2="1140.0" y2="574.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="596.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="637.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="156.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="172.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Structured, queryable data</text><text x="122.0" y="201.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ask “which defects were most frequent on which lines and shifts</text><text x="122.0" y="221.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">over six months?” Can you answer in minutes, or in days?</text><rect x="606.0" y="134.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="156.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="172.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Processes clear enough for AI to take part</text><text x="668.0" y="201.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">For each important process, how many of the four questions</text><text x="668.0" y="221.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">below have a written answer?</text><rect x="60.0" y="256.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="278.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="294.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Structured, connected knowledge</text><text x="122.0" y="323.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Can a new employee find which procedure applies to a product</text><text x="122.0" y="343.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">under specific conditions, or must they ask someone?</text><rect x="606.0" y="256.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="278.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="294.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Governance: what AI may do</text><text x="668.0" y="323.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Does a process define who approves an AI recommendation, what</text><text x="668.0" y="343.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">evidence is needed, and how it is recorded?</text><rect x="60.0" y="378.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="400.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="416.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System integration</text><text x="122.0" y="445.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">To trace a batch from raw material to shipment, how many</text><text x="122.0" y="465.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">systems and files must someone access?</text><rect x="606.0" y="378.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="400.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="416.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational context</text><text x="668.0" y="445.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">If a new AI were given all your documents today, how long before</text><text x="668.0" y="465.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">it answers real operational questions well?</text><rect x="60.0" y="504.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="537.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">This is self-assessment, not a pass mark. The weakest dimension is where to start.</text></svg>
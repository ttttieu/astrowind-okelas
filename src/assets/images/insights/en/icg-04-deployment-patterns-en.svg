<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Three rows: each deployment pattern on the left leads to its consequence on the right." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The risk lies in deployment, not in AI itself</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three common deployment patterns and what each one leads to.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The patterns are illustrative from the article, not measured data.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="500.0" height="64.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="208.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI used without clear scope, policy or training</text><line x1="568.0" y1="202.0" x2="603.0" y2="202.0" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,202.0 603.0,206.9 603.0,197.1" fill="var(--p)"/><rect x="620.0" y="170.0" width="520.0" height="64.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="207.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The Quality Department cannot see where AI is being used.</text><rect x="60.0" y="248.0" width="500.0" height="83.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="295.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI output enters the official document system</text><line x1="568.0" y1="289.5" x2="603.0" y2="289.5" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,289.5 603.0,294.4 603.0,284.6" fill="var(--p)"/><rect x="620.0" y="248.0" width="520.0" height="83.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="284.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">It skips standard approval and may hold errors an experienced</text><text x="640.0" y="305.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">reviewer would catch.</text><rect x="60.0" y="345.0" width="500.0" height="64.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="383.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI joins a compliance process with no audit trail</text><line x1="568.0" y1="377.0" x2="603.0" y2="377.0" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,377.0 603.0,381.9 603.0,372.1" fill="var(--p)"/><rect x="620.0" y="345.0" width="520.0" height="64.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="382.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A record gap remains, even when the output is correct.</text><rect x="60.0" y="437.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="470.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Each of these patterns can happen without anyone in the organization noticing right away.</text></svg>
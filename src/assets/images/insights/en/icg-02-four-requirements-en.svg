<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 546" width="1200" height="546" role="img" aria-label="Four requirement cards: document control, traceability, system validation CSV/CSA, evidence-based decisions." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="546" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four ISO/GMP requirements that apply to AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Most standards predate AI, but their principles apply to any tool in quality-relevant processes.</text><line x1="60.0" y1="462.0" x2="1140.0" y2="462.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="484.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four requirements are analysis from the article based on ISO and GMP principles; consult a compliance specialist before deployment.</text><text x="60.0" y="525.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="115.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Document control and versions</text><text x="84.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI-drafted or AI-edited documents must go through review,</text><text x="84.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">approval and version control. Unreviewed copy-paste is a real risk.</text><rect x="606.0" y="134.0" width="534.0" height="115.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability and records</text><text x="630.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI output used in data analysis or batch information must sit inside</text><text x="630.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">the traceability chain, not in parallel outside it.</text><rect x="60.0" y="261.0" width="534.0" height="115.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="289.0" r="15" fill="var(--p)"/><text x="90.0" y="294.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="297.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System validation (CSV / CSA)</text><text x="84.0" y="327.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">In GMP, computer systems need validation or assurance; AI may</text><text x="84.0" y="348.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">fall in scope depending on its influence.</text><rect x="606.0" y="261.0" width="534.0" height="115.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="289.0" r="15" fill="var(--gm)"/><text x="636.0" y="294.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="297.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence-based decisions</text><text x="630.0" y="327.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ISO 9001 and ISO 22000 require decisions based on verifiable</text><text x="630.0" y="348.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">evidence; AI output must trace back to that evidence.</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These requirements apply to any tool used in processes that affect quality, not only to AI.</text></svg>
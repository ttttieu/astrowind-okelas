<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Five numbered principles, from starting in the lower-risk zone to knowing which AI tool is in use." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five principles for AI in a compliance environment</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Start in the lower-risk zone and build governance before expanding.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The five principles are a thinking frame from the article, not a certified template.</text><text x="60.0" y="663.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="1080.0" height="58.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="199.0" r="15" fill="var(--p)"/><text x="96.0" y="204.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="132.0" y="205.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Start in the lower-risk zone to build experience.</text><rect x="60.0" y="238.0" width="1080.0" height="58.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="96.0" cy="267.0" r="15" fill="var(--gm)"/><text x="96.0" y="272.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="132.0" y="273.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Build governance before expanding: scope, approvers and how the audit trail is generated.</text><rect x="60.0" y="306.0" width="1080.0" height="58.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="335.0" r="15" fill="var(--p)"/><text x="96.0" y="340.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="132.0" y="341.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Keep human authority explicit: AI supports analysis, it does not sign off.</text><rect x="60.0" y="374.0" width="1080.0" height="58.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="96.0" cy="403.0" r="15" fill="var(--gm)"/><text x="96.0" y="408.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="132.0" y="409.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Treat AI as a system change that goes through change management and document updates.</text><rect x="60.0" y="442.0" width="1080.0" height="58.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="471.0" r="15" fill="var(--p)"/><text x="96.0" y="476.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="132.0" y="477.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Know which AI tool is in use and what data protection each type offers.</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The article builds these from general principles; check specific clauses against the standard that applies to you.</text></svg>
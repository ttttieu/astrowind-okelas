<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Three zone columns: lower, medium, higher risk; each has examples and the matching governance; the higher-risk column is dashed." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="590" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three risk zones: risk rises with product influence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The closer AI gets to product decisions, the stricter the governance must be.</text><line x1="60.0" y1="506.0" x2="1140.0" y2="506.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="528.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three zones are a classification from the article, not an official standard; specifics depend on the standard and certification body.</text><text x="60.0" y="569.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="216.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Lower-risk zone</text><text x="84.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Examples: internal emails, routine</text><text x="84.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">translation, presentation drafts.</text><text x="84.0" y="299.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: a basic AI policy; data stays</text><text x="84.0" y="319.7" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">out of external tools.</text><rect x="426.0" y="176.0" width="340.0" height="216.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="450.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Medium-risk zone</text><text x="450.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Examples: SOP lookup,</text><text x="450.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">information chatbots, summaries</text><text x="450.0" y="290.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">of inspection reports.</text><text x="450.0" y="321.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: defined scope, human</text><text x="450.0" y="341.0" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">review checkpoints, official documents</text><text x="450.0" y="360.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">stay authoritative.</text><rect x="792.0" y="176.0" width="340.0" height="216.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="816.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Higher-risk zone</text><text x="816.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Examples: suggesting pass/fail,</text><text x="816.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">supporting batch release,</text><text x="816.0" y="290.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">recommending parameter changes.</text><text x="816.0" y="321.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: validation per standard,</text><text x="816.0" y="341.0" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">complete audit trail, documented human</text><text x="816.0" y="360.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">sign-off, periodic review.</text><rect x="60.0" y="436.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="469.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A high-risk zone does not mean AI is forbidden; it means adequate controls must exist before use.</text></svg>
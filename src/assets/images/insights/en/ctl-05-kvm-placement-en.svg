<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="A four-block flow: AI agent to KVM, then organizational knowledge and sources; under KVM are three functions: Trace, FindEvidence, Resolve." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM sits between AI and organizational knowledge</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The four action controls are not enough alone; KVM is the second layer, governing the knowledge AI reasons from.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">KVM is an architectural concept the article presents as OKELAS’s own; the figure shows its role in the flow, not a product description.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="230.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="175.0" y="214.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI Agent / Copilot</text><text x="72.0" y="246.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Reasons and explains</text><line x1="294.0" y1="226.0" x2="318.0" y2="226.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,226.0 318.0,230.4 318.0,221.6" fill="var(--p)"/><rect x="330.0" y="176.0" width="230.0" height="100.0" rx="14" fill="var(--p)" stroke="var(--p)" stroke-width="1.8"/><text x="445.0" y="214.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">KVM</text><text x="342.0" y="246.0" font-size="13" font-weight="400" fill="var(--wh)" text-anchor="start">Retrieves, resolves, traces</text><line x1="564.0" y1="226.0" x2="588.0" y2="226.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,226.0 588.0,230.4 588.0,221.6" fill="var(--p)"/><rect x="600.0" y="176.0" width="230.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="715.0" y="214.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational knowledge</text><text x="612.0" y="246.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Knowledge Graph</text><line x1="834.0" y1="226.0" x2="858.0" y2="226.0" stroke="var(--p)" stroke-width="2"/><polygon points="866.0,226.0 858.0,230.4 858.0,221.6" fill="var(--p)"/><rect x="870.0" y="176.0" width="230.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="985.0" y="214.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sources</text><text x="882.0" y="246.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Documents, events,</text><text x="882.0" y="264.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">records, people</text><rect x="60.0" y="340.0" width="340.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="376.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trace</text><text x="80.0" y="404.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Origin and relationships of a piece</text><text x="80.0" y="425.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">of knowledge.</text><rect x="430.0" y="340.0" width="340.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="450.0" y="376.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">FindEvidence</text><text x="450.0" y="404.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Relevant evidence for a given situation.</text><rect x="800.0" y="340.0" width="340.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="820.0" y="376.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Resolve</text><text x="820.0" y="404.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Identify the exact entity being</text><text x="820.0" y="425.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">referred to.</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI reasons; KVM retrieves and traces knowledge. The two stay separate.</text></svg>
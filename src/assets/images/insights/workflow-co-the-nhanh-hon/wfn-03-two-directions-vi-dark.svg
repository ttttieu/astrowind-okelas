<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Hai hướng tiếp theo: kích hoạt theo sự kiện thay vì chờ người phát hiện, và ngữ cảnh được chuẩn bị sẵn để người quyết định chuyển từ điều tra sang xác nhận." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Hai hướng cho tầng tốc độ tiếp theo</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Hai hướng bài viết nêu cho tầng tốc độ tiếp theo.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="530.0" height="322.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Kích hoạt theo sự kiện</text><text x="84.0" y="209.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Hôm nay</text><rect x="84.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="152.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Có người phát hiện</text><text x="152.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">vấn đề</text><line x1="222.0" y1="252.0" x2="244.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="252.0,252.0 244.0,256.4 244.0,247.6" fill="#5B6575"/><rect x="254.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="322.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Người đó tạo</text><text x="322.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">yêu cầu</text><line x1="392.0" y1="252.0" x2="414.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="422.0,252.0 414.0,256.4 414.0,247.6" fill="#5B6575"/><rect x="424.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="492.0" y="256.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Workflow bắt đầu</text><text x="84.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Hướng tiếp theo</text><rect x="84.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="152.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Sự kiện quan trọng</text><text x="152.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">xảy ra</text><line x1="222.0" y1="373.0" x2="244.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="252.0,373.0 244.0,377.4 244.0,368.6" fill="#A78BFA"/><rect x="254.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="322.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Hệ thống tự</text><text x="322.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">nhận ra</text><line x1="392.0" y1="373.0" x2="414.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="422.0,373.0 414.0,377.4 414.0,368.6" fill="#A78BFA"/><rect x="424.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="492.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Quy trình tự</text><text x="492.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">khởi động</text><rect x="610.0" y="134.0" width="530.0" height="322.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><text x="634.0" y="173.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Ngữ cảnh chuẩn bị sẵn</text><text x="634.0" y="209.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Hôm nay</text><rect x="634.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="702.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Người quyết định</text><text x="702.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">tự gom thông tin</text><line x1="772.0" y1="252.0" x2="794.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="802.0,252.0 794.0,256.4 794.0,247.6" fill="#5B6575"/><rect x="804.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="872.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tổng hợp lịch sử,</text><text x="872.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">ca tương tự</text><line x1="942.0" y1="252.0" x2="964.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="972.0,252.0 964.0,256.4 964.0,247.6" fill="#5B6575"/><rect x="974.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="1042.0" y="256.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Rồi mới quyết định</text><text x="634.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Hướng tiếp theo</text><rect x="634.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="702.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Hệ thống gom sẵn</text><text x="702.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">lịch sử, ca tương tự</text><line x1="772.0" y1="373.0" x2="794.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="802.0,373.0 794.0,377.4 794.0,368.6" fill="#A78BFA"/><rect x="804.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="872.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Người quyết định</text><text x="872.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">xem tóm tắt</text><line x1="942.0" y1="373.0" x2="964.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="972.0,373.0 964.0,377.4 964.0,368.6" fill="#A78BFA"/><rect x="974.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="1042.0" y="377.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Xác nhận</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Từ điều tra chuyển sang xác nhận; từ chờ người phát hiện chuyển sang phản ứng sớm.</text></svg>
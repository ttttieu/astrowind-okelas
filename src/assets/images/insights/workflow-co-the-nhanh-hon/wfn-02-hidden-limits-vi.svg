<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Ba giới hạn ẩn: workflow chỉ bắt đầu khi có người tạo yêu cầu, xử lý từng ca riêng lẻ không nhận ra mẫu lặp, và người quyết định tự tổng hợp thông tin." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="590" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba giới hạn ẩn của một workflow đã tốt</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không gây lỗi rõ ràng, nhưng âm thầm giới hạn tốc độ.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="350.0" height="314.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Khởi động thủ công</text><text x="80.0" y="231.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Hiện tại</text><rect x="80.0" y="240.0" width="310.0" height="62.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="235.0" y="276.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Bắt đầu khi có người tạo yêu cầu</text><text x="80.0" y="335.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Còn thiếu</text><rect x="80.0" y="344.0" width="310.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="235.0" y="380.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phát hiện sự kiện ngoài đời thực để phản</text><text x="235.0" y="399.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">ứng sớm</text><rect x="425.0" y="134.0" width="350.0" height="314.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Xử lý từng ca riêng lẻ</text><text x="445.0" y="231.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Hiện tại</text><rect x="445.0" y="240.0" width="310.0" height="62.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="600.0" y="276.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xử lý hiệu quả từng yêu cầu</text><text x="445.0" y="335.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Còn thiếu</text><rect x="445.0" y="344.0" width="310.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600.0" y="380.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhận ra mẫu lặp qua nhiều ca, dấu hiệu</text><text x="600.0" y="399.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">của xu hướng mới</text><rect x="790.0" y="134.0" width="350.0" height="314.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tự tổng hợp thông tin</text><text x="810.0" y="231.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Hiện tại</text><rect x="810.0" y="240.0" width="310.0" height="62.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="965.0" y="276.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người quyết định hiểu ngữ cảnh</text><text x="810.0" y="335.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Còn thiếu</text><rect x="810.0" y="344.0" width="310.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="965.0" y="380.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thông tin được chuẩn bị sẵn thay vì</text><text x="965.0" y="399.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">tự gom</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba đều nằm ngoài tầm của một workflow đã tối ưu theo cách hiện nay.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba câu hỏi tự đánh giá: quy trình chỉ bắt đầu khi có người phát hiện vấn đề, người quyết định mất thời gian tổng hợp thông tin, và phản hồi nhanh hơn có tạo tác động kinh doanh đáng kể không." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba câu hỏi tự đánh giá cho workflow đã trưởng thành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dành cho tổ chức đã có workflow tốt.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mức 30–50% là giả định minh họa trong bài, không phải số liệu đo lường. Câu hỏi là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="134.0" width="1080.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="184.0" r="17" fill="var(--p)"/><text x="96.0" y="190.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="190.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Các quy trình quan trọng có chỉ bắt đầu sau khi ai đó phát hiện vấn đề, dù dữ liệu đã có sẵn trong hệ thống?</text><rect x="60.0" y="248.0" width="1080.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="298.0" r="17" fill="var(--p)"/><text x="96.0" y="304.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="130.0" y="304.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Người ra quyết định có mất phần lớn thời gian để tổng hợp thông tin thay vì cân nhắc quyết định?</text><rect x="60.0" y="362.0" width="1080.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="412.0" r="17" fill="var(--p)"/><text x="96.0" y="418.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="407.0" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Phản hồi nhanh hơn 30–50% có tạo tác động kinh doanh đáng kể không (giữ khách, giảm</text><text x="130.0" y="429.4" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">rủi ro, tiết kiệm chi phí)?</text><rect x="996.4" y="399.0" width="119.6" height="26.0" rx="13.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1056.2" y="416.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Giả định của bài</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu câu 3 trả lời có, đáng tìm hiểu thêm workflow kích hoạt theo sự kiện.</text></svg>
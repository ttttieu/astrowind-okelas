<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Workflow đã đủ tốt có approval hợp lý, đủ ngữ cảnh, đường đi cho ngoại lệ và theo dõi tiến độ, nhưng đó chỉ là giới hạn của công nghệ và cách thiết kế hiện nay, chưa phải trần tuyệt đối." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="604" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Workflow đủ tốt hôm nay chưa phải trần cố định</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Hầu hết SME sản xuất chưa đạt đến mức này; nhưng đó mới là trần hiện tại.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="520.0" height="330.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="175.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Workflow đã đủ tốt có</text><rect x="84.0" y="204.0" width="472.0" height="52.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><circle cx="112.0" cy="230.0" r="13" fill="#2B74F5"/><line x1="106.0" y1="230.0" x2="110.5" y2="235.0" stroke="#FFFFFF" stroke-width="2.8"/><line x1="110.5" y1="235.0" x2="118.5" y2="225.0" stroke="#FFFFFF" stroke-width="2.8"/><text x="134.0" y="235.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Approval hợp lý, không thừa</text><rect x="84.0" y="266.0" width="472.0" height="52.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><circle cx="112.0" cy="292.0" r="13" fill="#2B74F5"/><line x1="106.0" y1="292.0" x2="110.5" y2="297.0" stroke="#FFFFFF" stroke-width="2.8"/><line x1="110.5" y1="297.0" x2="118.5" y2="287.0" stroke="#FFFFFF" stroke-width="2.8"/><text x="134.0" y="297.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Đủ ngữ cảnh cho người xử lý</text><rect x="84.0" y="328.0" width="472.0" height="52.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><circle cx="112.0" cy="354.0" r="13" fill="#2B74F5"/><line x1="106.0" y1="354.0" x2="110.5" y2="359.0" stroke="#FFFFFF" stroke-width="2.8"/><line x1="110.5" y1="359.0" x2="118.5" y2="349.0" stroke="#FFFFFF" stroke-width="2.8"/><text x="134.0" y="359.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Đường đi rõ cho ngoại lệ</text><rect x="84.0" y="390.0" width="472.0" height="52.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><circle cx="112.0" cy="416.0" r="13" fill="#2B74F5"/><line x1="106.0" y1="416.0" x2="110.5" y2="421.0" stroke="#FFFFFF" stroke-width="2.8"/><line x1="110.5" y1="421.0" x2="118.5" y2="411.0" stroke="#FFFFFF" stroke-width="2.8"/><text x="134.0" y="421.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Theo dõi tiến độ mà không cần hỏi trực tiếp</text><rect x="620.0" y="134.0" width="520.0" height="330.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="644.0" y="175.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhưng “đủ tốt” có giới hạn</text><rect x="668.0" y="204.0" width="424.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880.0" y="231.5" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="middle">Còn có thể cao hơn</text><line x1="720.0" y1="304.0" x2="720.0" y2="265.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="720.0,256.0 725.0,265.0 715.0,265.0" fill="#A78BFA"/><line x1="880.0" y1="304.0" x2="880.0" y2="265.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="880.0,256.0 885.0,265.0 875.0,265.0" fill="#A78BFA"/><line x1="1040.0" y1="304.0" x2="1040.0" y2="265.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="1040.0,256.0 1045.0,265.0 1035.0,265.0" fill="#A78BFA"/><line x1="644.0" y1="314.0" x2="1116.0" y2="314.0" stroke="#9AA6B8" stroke-width="4"/><text x="644.0" y="338.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Giới hạn của công nghệ và cách thiết kế hiện nay</text><rect x="668.0" y="366.0" width="424.0" height="64.0" rx="10" fill="#2B74F5"/><text x="880.0" y="403.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Workflow đã tối ưu hôm nay</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Đủ tốt theo chuẩn hôm nay không phải một trần cố định.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 638" width="1200" height="638" role="img" aria-label="Bốn hàng đánh số, mỗi hàng là một câu hỏi quản trị." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="638" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn câu hỏi quản trị thay cho “AI có đủ giỏi không?”</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Các câu hỏi này không cần chuyên môn AI sâu, và áp dụng cho cả người lẫn hệ thống AI.</text><line x1="60.0" y1="554.0" x2="1140.0" y2="554.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="576.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi theo bài viết; mỗi doanh nghiệp cần trả lời theo ngữ cảnh của mình.</text><text x="60.0" y="617.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="170.0" r="15" fill="var(--p)"/><text x="100.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="150.0" y="176.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ quả nếu AI làm sai là gì, và có thể đảo ngược không?</text><rect x="60.0" y="218.0" width="1080.0" height="72.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="254.0" r="15" fill="var(--gm)"/><text x="100.0" y="259.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="150.0" y="260.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ai chịu trách nhiệm, và họ có thấy vấn đề trước khi gây hại không?</text><rect x="60.0" y="302.0" width="1080.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="338.0" r="15" fill="var(--p)"/><text x="100.0" y="343.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="150.0" y="344.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Hành động có cần xác nhận độc lập trước khi thực thi không?</text><rect x="60.0" y="386.0" width="1080.0" height="72.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="422.0" r="15" fill="var(--gm)"/><text x="100.0" y="427.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="150.0" y="428.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Doanh nghiệp có thể thu hồi quyền này ngay lập tức không?</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu trả lời thường là: không toàn quyền, nhưng cũng không zero quyền.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="A knowledge graph plays a role before ERP (recording entities and relationships), after ERP (a semantic layer over ERP data) and for AI (moving past the limits of RAG)." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge graph: before ERP, after ERP, and for AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Its specific role at each junction in a manufacturing business.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Before ERP</text><text x="82.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Is the operational picture clear?</text><rect x="82.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="94.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">The problem</text><text x="94.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No complete picture: which processes</text><text x="94.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">connect to which modules, which data</text><text x="94.0" y="303.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">migrates in which structure.</text><rect x="82.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="94.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Role of the knowledge graph</text><text x="94.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Record the main entities and how they relate</text><text x="94.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">before implementation begins.</text><rect x="426.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">After ERP</text><text x="448.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Can ERP data answer real questions?</text><rect x="448.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="460.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">The problem</text><text x="460.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Data is structured by module, not by how</text><text x="460.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">users actually need to ask.</text><rect x="448.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="460.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Role of the knowledge graph</text><text x="460.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">A semantic layer maps operational concepts</text><text x="460.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">(products, processes, suppliers, batches)</text><text x="460.0" y="407.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">onto ERP data structures.</text><rect x="792.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">For AI</text><text x="814.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Can AI move past the limits of RAG?</text><rect x="814.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="826.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">The problem</text><text x="826.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">RAG only searches within text; it can’t follow</text><text x="826.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">a chain of relationships.</text><rect x="814.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="826.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Role of the knowledge graph</text><text x="826.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">AI follows the relationship network to the</text><text x="826.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">right answer to an operational question.</text><rect x="60.0" y="456.2" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Record relationships once, use them many times and for many purposes, including AI.</text></svg>
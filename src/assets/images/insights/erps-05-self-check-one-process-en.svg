<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Self-assess one process: pick a process within the ERP scope and answer four questions on documentation, consistency between employees, the final approver and whether documentation was updated." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Self-assess one process with four questions</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Pick one important process within the ERP scope and test it honestly.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="54.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Step 1: pick one important process within the ERP scope (e.g. goods receiving, purchase approval, customer order handling)</text><line x1="600.0" y1="190.0" x2="600.0" y2="203.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="600.0,212.0 595.0,203.0 605.0,203.0" fill="var(--gm)"/><text x="60.0" y="234.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Step 2: answer four questions honestly</text><rect x="60.0" y="250.0" width="534.0" height="72.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="286.0" r="15" fill="var(--p)"/><text x="92.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="118.0" y="281.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is the process documented in enough detail for a new</text><text x="118.0" y="301.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">employee to follow?</text><rect x="606.0" y="250.0" width="534.0" height="72.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="286.0" r="15" fill="var(--p)"/><text x="638.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="664.0" y="281.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">If three employees describe it, do they describe it the</text><text x="664.0" y="301.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">same way?</text><rect x="60.0" y="332.0" width="534.0" height="72.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="368.0" r="15" fill="var(--p)"/><text x="92.0" y="373.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="118.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is the final approver clearly recorded somewhere?</text><rect x="606.0" y="332.0" width="534.0" height="72.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="368.0" r="15" fill="var(--p)"/><text x="638.0" y="373.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="664.0" y="363.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Has the process changed recently, and was the</text><text x="664.0" y="383.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">documentation updated?</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Several “no” or “not sure” answers are gaps to close before implementing ERP.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Context is information outside the transaction that affects how to handle it: relationships and history, the organization’s current state, shifting priorities, and precedent and accepted exceptions; with the concept of Ba from Nonaka and Takeuchi." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="664" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">What context means in a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Context sits outside the transaction, yet decides what the transaction means.</text><line x1="60.0" y1="602.0" x2="1140.0" y2="602.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="624.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="1080.0" height="62.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="600.0" y="170.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Context: information outside the transaction itself that affects its meaning and how it should be handled.</text><rect x="60.0" y="210.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Relationships and history</text><text x="82.0" y="269.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">How long we have worked together, past problems, whether this is a</text><text x="82.0" y="288.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">strategic customer.</text><rect x="610.0" y="210.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Current state of the organization</text><text x="632.0" y="269.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Whether a department is overloaded, which projects compete for</text><text x="632.0" y="288.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">resources, what policy was just issued.</text><rect x="60.0" y="322.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="353.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Shifting priorities</text><text x="82.0" y="381.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">What matters this month may differ from last month, depending on</text><text x="82.0" y="400.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">goals or emerging risk.</text><rect x="610.0" y="322.0" width="530.0" height="100.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="353.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Precedent and accepted exceptions</text><text x="632.0" y="381.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">How similar past cases were handled flexibly, and why.</text><rect x="60.0" y="438.0" width="1080.0" height="88.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="468.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">The concept of "Ba" (Nonaka and Takeuchi, 1995)</text><text x="84.0" y="494.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">A shared contextual space where knowledge is shared, created and used; take information out of its Ba and it loses much of its</text><text x="84.0" y="514.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">practical meaning.</text><rect x="60.0" y="542.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="575.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Storing only transaction data is processing data, not understanding the situation.</text></svg>
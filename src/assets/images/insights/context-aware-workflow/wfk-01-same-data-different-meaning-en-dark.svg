<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Two purchase requests that both exceed the limit by 10% are treated identically by rules, but one comes from a long-standing supplier and the other from a new supplier just as the budget tightens, so they mean different things." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Same data, two different meanings</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">An experienced person brings context that raw data cannot show.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Illustrative example</text><text x="60.0" y="144.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Transaction data</text><rect x="60.0" y="160.0" width="520.0" height="54.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="320.0" y="192.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Purchase request exceeds the limit by 10%</text><line x1="320.0" y1="218.0" x2="320.0" y2="235.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="320.0,244.0 315.1,235.0 324.9,235.0" fill="#5B6575"/><rect x="620.0" y="160.0" width="520.0" height="54.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="880.0" y="192.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Purchase request exceeds the limit by 10%</text><line x1="880.0" y1="218.0" x2="880.0" y2="235.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="880.0,244.0 875.0,235.0 885.0,235.0" fill="#5B6575"/><rect x="60.0" y="248.0" width="1080.0" height="48.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="600.0" y="277.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Rules treat the two requests identically</text><text x="60.0" y="330.8" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start">Context the data does not show</text><rect x="60.0" y="344.0" width="520.0" height="130.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="374.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">First request</text><text x="82.0" y="410.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A supplier with a 5-year relationship and no</text><text x="82.0" y="433.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">past problems.</text><rect x="620.0" y="344.0" width="520.0" height="130.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="642.0" y="374.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Second request</text><text x="642.0" y="410.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A new supplier, just as finance tightens this quarter’s</text><text x="642.0" y="433.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">budget because another project is behind schedule.</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Same number, different meaning; a workflow that only follows rules cannot see the difference.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Three components: a continuously maintained organizational knowledge source, linking a situation to that knowledge, and a controlled mechanism for adjusting rules; it needs an organizational knowledge layer behind it, not a software feature." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="608" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three components of context-aware workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Context-aware does not drop rules: it lets rules draw on a layer of organizational understanding.</text><line x1="60.0" y1="546.0" x2="1140.0" y2="546.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="568.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">A continuously maintained</text><text x="84.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">knowledge source</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not just transaction data: relationships,</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">precedent, current priorities; updated</text><text x="84.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">continuously, not coded once.</text><rect x="427.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Linking a situation to</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">that knowledge</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">When an event occurs, look up the relevant</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">relationships, precedent and priorities. A</text><text x="451.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">knowledge graph stores relationships</text><text x="451.0" y="342.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">between facts.</text><rect x="794.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Controlled adjustment of rules</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Record which context it rests on, who</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">confirmed, what evidence, so flexibility</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">never becomes arbitrary bypass.</text><rect x="60.0" y="386.0" width="1080.0" height="84.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="419.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Not a feature bolted onto process-management software</text><text x="84.0" y="447.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">It needs an organizational knowledge layer behind it, connected to the workflow.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Controlled flexibility, not arbitrary bypassing of rules.</text></svg>
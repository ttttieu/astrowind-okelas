<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The chain Process, Workflow, Event, Evidence, Knowledge, Decision, Action: a workflow is only as smart as the knowledge foundation behind it, so many AI efforts stop at classification and routing." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="560" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">A workflow is only as smart as its knowledge foundation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">OKELAS view: workflow is one link in a chain, not a standalone feature.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="1038.9" y="124.0" width="101.1" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1089.5" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">OKELAS view</text><rect x="60.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="130.0" y="194.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Process</text><line x1="201.0" y1="189.0" x2="209.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="215.0,189.0 209.0,192.3 209.0,185.7" fill="#9AA6B8"/><rect x="216.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#2B74F5"/><text x="286.0" y="194.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Workflow</text><line x1="357.0" y1="189.0" x2="365.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="371.0,189.0 365.0,192.3 365.0,185.7" fill="#9AA6B8"/><rect x="372.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="442.0" y="194.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Event</text><line x1="513.0" y1="189.0" x2="521.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="527.0,189.0 521.0,192.3 521.0,185.7" fill="#9AA6B8"/><rect x="528.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="598.0" y="194.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Evidence</text><line x1="669.0" y1="189.0" x2="677.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="683.0,189.0 677.0,192.3 677.0,185.7" fill="#9AA6B8"/><rect x="684.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#A78BFA"/><text x="754.0" y="194.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Knowledge</text><line x1="825.0" y1="189.0" x2="833.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="839.0,189.0 833.0,192.3 833.0,185.7" fill="#9AA6B8"/><rect x="840.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="910.0" y="194.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Decision</text><line x1="981.0" y1="189.0" x2="989.0" y2="189.0" stroke="#9AA6B8" stroke-width="1.8"/><polygon points="995.0,189.0 989.0,192.3 989.0,185.7" fill="#9AA6B8"/><rect x="996.0" y="160.0" width="140.0" height="58.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="1066.0" y="194.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Action</text><rect x="60.0" y="246.0" width="530.0" height="150.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="277.8" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="start">The limit of workflow</text><text x="82.0" y="310.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A workflow is only as smart as the knowledge foundation</text><text x="82.0" y="333.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">behind it allows.</text><rect x="610.0" y="246.0" width="530.0" height="150.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="632.0" y="277.8" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="start">Why many efforts stall</text><text x="632.0" y="310.1" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Bringing AI into workflow often stops at classification</text><text x="632.0" y="333.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">and routing, because the organization has not</text><text x="632.0" y="357.7" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">systematized enough knowledge for the workflow to</text><text x="632.0" y="381.5" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">draw on.</text><rect x="60.0" y="412.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="445.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The practical question: what must the organization do first, so a workflow can one day understand context?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Three cases where a rule is technically right but wrong in context: a company-wide spending threshold, a low-priority classification from history, and approval routing by org chart to an overloaded person." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Technically right rules, wrong in context</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A rule reflects a static snapshot from when it was written; the organization keeps moving.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Technically right rule</text><text x="600.0" y="141.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Actual context</text><rect x="60.0" y="152.0" width="480.0" height="98.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="80.0" y="206.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">A company-wide spending threshold</text><line x1="548.0" y1="201.0" x2="579.0" y2="201.0" stroke="var(--a)" stroke-width="3"/><polygon points="590.0,201.0 579.0,207.1 579.0,194.9" fill="var(--a)"/><rect x="600.0" y="152.0" width="540.0" height="98.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="206.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">One department needs more flexibility because of a strategic project</text><rect x="60.0" y="262.0" width="480.0" height="98.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="80.0" y="316.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">A "low priority" classification from history</text><line x1="548.0" y1="311.0" x2="579.0" y2="311.0" stroke="var(--a)" stroke-width="3"/><polygon points="590.0,311.0 579.0,317.1 579.0,304.9" fill="var(--a)"/><rect x="600.0" y="262.0" width="540.0" height="98.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="306.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">An outside event or a change in a customer relationship calls</text><text x="620.0" y="326.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">for re-prioritizing</text><rect x="60.0" y="372.0" width="480.0" height="98.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="80.0" y="426.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Approval routed correctly by org chart</text><line x1="548.0" y1="421.0" x2="579.0" y2="421.0" stroke="var(--a)" stroke-width="3"/><polygon points="590.0,421.0 579.0,427.1 579.0,414.9" fill="var(--a)"/><rect x="600.0" y="372.0" width="540.0" height="98.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="620.0" y="416.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">That person is overloaded while another authorized person has</text><text x="620.0" y="436.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">more time</text><rect x="60.0" y="488.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="521.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">This is not a workflow fault, but the limit of a system that relies only on transaction data.</text></svg>
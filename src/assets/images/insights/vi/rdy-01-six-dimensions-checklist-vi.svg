<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="Sáu ô kiểm tra xếp thành lưới, mỗi ô là một chiều đánh giá kèm một câu hỏi tự kiểm; các chiều song song, không theo thứ tự tuần tự." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="658" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu chiều đánh giá, không phải sáu rào cản tuần tự</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không có điểm đạt chuẩn chung. Mức cần đạt phụ thuộc vào kỳ vọng đặt lên AI.</text><line x1="60.0" y1="574.0" x2="1140.0" y2="574.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="596.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bộ câu hỏi tự đánh giá theo bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="637.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="156.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="172.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu có cấu trúc và truy vấn được</text><text x="122.0" y="201.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Hỏi “6 tháng qua, lỗi nào nhiều nhất ở dây chuyền nào, ca nào?”</text><text x="122.0" y="221.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thì trả lời trong vài phút hay vài ngày?</text><rect x="606.0" y="134.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="156.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="172.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình đủ rõ để AI tham gia</text><text x="668.0" y="201.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Với mỗi quy trình quan trọng, có bao nhiêu trong 4 câu hỏi có</text><text x="668.0" y="221.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">câu trả lời bằng văn bản?</text><rect x="60.0" y="256.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="278.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="294.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức được cấu trúc và kết nối</text><text x="122.0" y="323.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhân viên mới tự tìm được quy trình áp dụng cho sản phẩm và</text><text x="122.0" y="343.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">điều kiện cụ thể, hay phải hỏi người?</text><rect x="606.0" y="256.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="278.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="294.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Governance: AI được phép làm gì</text><text x="668.0" y="323.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình có xác định ai phê duyệt đề xuất của AI, cần</text><text x="668.0" y="343.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">bằng chứng gì và ghi nhận ra sao?</text><rect x="60.0" y="378.0" width="534.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="84.0" y="400.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="122.0" y="416.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tích hợp giữa các hệ thống</text><text x="122.0" y="445.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Truy vết một lô từ nguyên liệu đến xuất kho cần truy cập bao</text><text x="122.0" y="465.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhiêu hệ thống và file?</text><rect x="606.0" y="378.0" width="534.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="630.0" y="400.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="668.0" y="416.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational context</text><text x="668.0" y="445.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đưa AI mới vào với toàn bộ tài liệu, mất bao lâu để nó trả lời hữu</text><text x="668.0" y="465.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ích câu hỏi vận hành?</text><rect x="60.0" y="504.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="537.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây là tự đánh giá, không phải điểm đạt chuẩn. Chiều yếu nhất là nơi nên bắt đầu.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img" aria-label="Bốn thẻ yêu cầu: kiểm soát tài liệu, traceability, validation hệ thống CSV/CSA, quyết định dựa trên bằng chứng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="588" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn yêu cầu ISO/GMP áp dụng cho AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hầu hết tiêu chuẩn viết trước khi AI phổ biến, nhưng nguyên tắc vẫn áp dụng cho mọi công cụ dùng trong quy trình chất lượng.</text><line x1="60.0" y1="504.0" x2="1140.0" y2="504.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="526.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn yêu cầu là phân tích theo bài viết dựa trên nguyên tắc ISO và GMP; cần tư vấn chuyên gia compliance trước khi triển khai.</text><text x="60.0" y="567.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm soát tài liệu và phiên bản</text><text x="84.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu do AI tạo hoặc sửa phải qua review, phê duyệt và</text><text x="84.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm soát phiên bản. Copy vào hệ thống mà không review là</text><text x="84.0" y="242.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">rủi ro thật.</text><rect x="606.0" y="134.0" width="534.0" height="136.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability và ghi nhận hồ sơ</text><text x="630.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Output AI trong phân tích dữ liệu hay thông tin lô phải nằm trong</text><text x="630.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chuỗi truy vết, không tồn tại song song bên ngoài.</text><rect x="60.0" y="282.0" width="534.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="310.0" r="15" fill="var(--p)"/><text x="90.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="318.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Validation hệ thống (CSV / CSA)</text><text x="84.0" y="348.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Trong GMP, hệ thống máy tính cần được validate hoặc đảm bảo; AI</text><text x="84.0" y="369.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có thể thuộc phạm vi này tùy mức ảnh hưởng.</text><rect x="606.0" y="282.0" width="534.0" height="136.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="310.0" r="15" fill="var(--gm)"/><text x="636.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="318.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định dựa trên bằng chứng</text><text x="630.0" y="348.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ISO 9001 và ISO 22000 yêu cầu quyết định dựa trên bằng chứng</text><text x="630.0" y="369.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm chứng được; AI phải truy được về bằng chứng đó.</text><rect x="60.0" y="434.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="467.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Các yêu cầu này áp dụng cho mọi công cụ dùng trong quy trình ảnh hưởng đến chất lượng, không riêng AI.</text></svg>
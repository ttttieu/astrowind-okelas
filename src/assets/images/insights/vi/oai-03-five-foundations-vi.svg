<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 636" width="1200" height="636" role="img" aria-label="Mái ghi Organizational AI đặt trên năm cột nền tảng: quy trình, dữ liệu, tri thức, context, governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="636" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm nền tảng cần có trước khi AI thành một phần vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Thiếu một nền tảng, AI sẽ trả lời từ thông tin rời rạc hoặc không kết nối được.</text><line x1="60.0" y1="552.0" x2="1140.0" y2="552.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="574.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Năm nền tảng là khung thực tiễn theo bài viết; bài ghi rõ "organizational AI" không phải thuật ngữ chuẩn của ngành.</text><text x="60.0" y="615.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="1080.0" height="60.0" rx="14" fill="var(--p)"/><text x="600.0" y="207.3" font-size="20" font-weight="700" fill="var(--wh)" text-anchor="middle">Organizational AI</text><rect x="60.0" y="262.0" width="200.0" height="180.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="292.0" r="15" fill="var(--p)"/><text x="92.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="338.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình được định</text><text x="76.0" y="359.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">nghĩa đủ rõ để AI</text><text x="76.0" y="380.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">tham gia</text><rect x="280.0" y="262.0" width="200.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="312.0" cy="292.0" r="15" fill="var(--gm)"/><text x="312.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="296.0" y="338.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu vận hành</text><text x="296.0" y="359.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">có cấu trúc và kết</text><text x="296.0" y="380.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">nối được</text><rect x="500.0" y="262.0" width="200.0" height="180.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="532.0" cy="292.0" r="15" fill="var(--p)"/><text x="532.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="516.0" y="338.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức gắn với</text><text x="516.0" y="359.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">quy trình, sản phẩm</text><text x="516.0" y="380.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">và quyết định</text><rect x="720.0" y="262.0" width="200.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="752.0" cy="292.0" r="15" fill="var(--gm)"/><text x="752.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="736.0" y="338.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Context tổ chức được</text><text x="736.0" y="359.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">duy trì liên tục</text><rect x="940.0" y="262.0" width="200.0" height="180.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="972.0" cy="292.0" r="15" fill="var(--p)"/><text x="972.0" y="297.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="956.0" y="338.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Governance: phân</text><text x="956.0" y="359.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">quyền, audit trail,</text><text x="956.0" y="380.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">leo thang</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thiếu một nền tảng, các bước phía trên không đứng vững.</text></svg>
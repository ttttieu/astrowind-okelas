<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 558" width="1200" height="558" role="img" aria-label="Cấm Excel thường thất bại; ba bước hiệu quả hơn là hiểu Excel dùng để làm gì, xác định file chứa tri thức quan trọng, và giải quyết nhu cầu gốc rễ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="558" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bước tiếp theo: không phải cấm Excel</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hiểu vì sao Excel tồn tại trước khi quyết định thay thế.</text><line x1="60.0" y1="474.0" x2="1140.0" y2="474.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="496.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách tiếp cận theo bài viết; công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="537.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="54.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="600.0" y="166.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Thường thất bại: cấm Excel hoặc bắt buộc dùng hệ thống chính. Cách này xử lý triệu chứng, không xử lý gốc rễ.</text><rect x="60.0" y="204.0" width="348.0" height="184.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="240.0" r="15" fill="var(--p)"/><text x="96.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="238.1" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Hiểu Excel đang được dùng để</text><text x="122.0" y="258.5" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">làm gì</text><line x1="82.0" y1="288.0" x2="386.0" y2="288.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="317.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi file quan trọng đại diện cho một nhu cầu</text><text x="82.0" y="336.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chưa được đáp ứng. Hiểu, không phán xét.</text><rect x="426.0" y="204.0" width="348.0" height="184.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="462.0" cy="240.0" r="15" fill="var(--p)"/><text x="462.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="238.1" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Xác định file nào chứa tri thức</text><text x="488.0" y="258.5" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">quan trọng</text><line x1="448.0" y1="288.0" x2="752.0" y2="288.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="317.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Những file này cần ít nhất được kiểm soát</text><text x="448.0" y="336.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và bảo vệ, chưa cần chuyển vào phần</text><text x="448.0" y="356.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">mềm ngay.</text><rect x="792.0" y="204.0" width="348.0" height="184.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="240.0" r="15" fill="var(--p)"/><text x="828.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="238.1" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Giải quyết nhu cầu gốc rễ, không</text><text x="854.0" y="258.5" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">chỉ đổi công cụ</text><line x1="814.0" y1="288.0" x2="1118.0" y2="288.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="317.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Customize phần mềm, xây workflow mới,</text><text x="814.0" y="336.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc giữ Excel nhưng quản lý có kiểm</text><text x="814.0" y="356.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">soát hơn.</text><rect x="60.0" y="404.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="437.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi đúng không phải “làm sao loại bỏ Excel?” mà là “nhu cầu nào Excel đang đáp ứng?”</text></svg>
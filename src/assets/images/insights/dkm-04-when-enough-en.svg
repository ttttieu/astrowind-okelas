<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="A DMS is enough when the main problem is finding documents, version control, approval or a low KM level; more is needed when questions need context, new hires take long, knowledge stays in heads, AI needs context, or knowledge is lost." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="670" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">When a DMS is enough, and when more is needed</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The right question is which specific knowledge problem the organization has.</text><line x1="60.0" y1="586.0" x2="1140.0" y2="586.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="608.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conditions from the article; KM level 1–2 on OKELAS’s KM maturity scale, separate from the 5 digitalization levels; a discussion aid, not a certified methodology.</text><text x="60.0" y="649.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="366.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">A DMS is enough when</text><rect x="84.0" y="196.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="226.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The main problem is finding and accessing documents</text><rect x="84.0" y="254.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="284.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The main problem is version control</text><rect x="84.0" y="312.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="342.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The main problem is the approval process</text><rect x="84.0" y="370.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="390.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The organization is at KM level 1–2: knowledge mostly in</text><text x="324.0" y="409.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">people’s heads</text><rect x="612.0" y="134.0" width="528.0" height="366.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">More is needed when</text><rect x="636.0" y="196.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="226.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The question is “in this context, what do I need to know?”</text><rect x="636.0" y="254.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="284.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">New employees need months despite having all documents</text><rect x="636.0" y="312.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="342.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Critical knowledge is still in heads despite a DMS</text><rect x="636.0" y="370.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="400.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">AI should support operations with context</text><rect x="636.0" y="428.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="458.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge loss when staff change</text><rect x="60.0" y="516.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="549.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Not “is DMS or KMS better?” but “what specific knowledge problem does the organization have?”</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="So sánh SOP chỉ có với SOP được thực thi: viết bởi người quản lý hay cùng người thực thi, chỉ điều kiện lý tưởng hay cả điều kiện bất thường, nằm trong folder hay xuất hiện đúng lúc, viết một lần hay được cập nhật." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">SOP được thực thi khác SOP chỉ “có” ở đâu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khác biệt nằm ở cách SOP được tạo ra, đưa vào công việc và duy trì.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="629.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="177.2" font-size="22" font-weight="700" fill="var(--mut)" text-anchor="start">SOP chỉ “có”</text><rect x="612.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="177.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">SOP được thực thi</text><rect x="84.0" y="200.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="233.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Chỉ được viết bởi người quản lý</text><rect x="636.0" y="200.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="233.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Được viết cùng người thực thi, có cả biến số thực tế</text><rect x="84.0" y="266.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="299.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Chỉ mô tả điều kiện lý tưởng</text><rect x="636.0" y="266.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="299.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô tả cả điều kiện bất thường: nếu X xảy ra thì làm gì?</text><rect x="84.0" y="332.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="365.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Nằm trên giấy hoặc trong folder không ai biết tìm</text><rect x="636.0" y="332.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="355.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xuất hiện đúng lúc, đúng dạng: checklist trên tablet, reminder</text><text x="876.0" y="374.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">trong hệ thống</text><rect x="84.0" y="398.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="431.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Viết một lần rồi để đó</text><rect x="636.0" y="398.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="431.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Được cập nhật từ thực tế vận hành</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">SOP được thực thi không phải SOP được viết cẩn thận hơn, mà là SOP được thiết kế cho điều kiện làm việc thực tế.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four steps of a request in a chat group: request, questions and files, three “final” files, work not finished." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><rect x="60" y="26" width="196" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">ILLUSTRATIVE SCENARIO</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Journey of one “redo the report” request in a chat group</text><g transform="translate(0 162.2)"><rect x="60" y="0" width="240" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">STEP 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Request posted in</text><text x="82" y="99" font-size="22" font-weight="600" class="tx">the group</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Ask to redo the report.</text><rect x="340" y="0" width="240" height="184" rx="16" class="bb"/><text x="362" y="35" font-size="13" font-weight="600" class="mut">STEP 2</text><text x="362" y="70" font-size="22" font-weight="600" class="tx">Questions and</text><text x="362" y="99" font-size="22" font-weight="600" class="tx">files</text><text x="362" y="131" font-size="17" font-weight="400" class="mut">The request is clarified</text><text x="362" y="155" font-size="17" font-weight="400" class="mut">over many messages.</text><rect x="620" y="0" width="240" height="184" rx="16" class="bp"/><text x="642" y="35" font-size="13" font-weight="600" class="tp">STEP 3</text><text x="642" y="70" font-size="22" font-weight="600" class="tp">Three “final” files</text><text x="642" y="102" font-size="17" font-weight="400" class="mut">Unclear which is the</text><text x="642" y="126" font-size="17" font-weight="400" class="mut">last one.</text><rect x="900" y="0" width="240" height="184" rx="16" class="bp"/><text x="922" y="35" font-size="13" font-weight="600" class="tp">STEP 4</text><text x="922" y="70" font-size="22" font-weight="600" class="tp">Not really finished</text><text x="922" y="102" font-size="17" font-weight="400" class="mut">No one confirms it is</text><text x="922" y="126" font-size="17" font-weight="400" class="mut">done.</text><line x1="306" y1="92" x2="322" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M320 83 l14 9 l-14 9z" class="arf"/><line x1="586" y1="92" x2="602" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M600 83 l14 9 l-14 9z" class="arf"/><line x1="866" y1="92" x2="882" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M880 83 l14 9 l-14 9z" class="arf"/></g><text x="60" y="380.2" font-size="13" font-weight="400" class="mut">Illustrative scenario, not a real case or measured data.</text></svg>

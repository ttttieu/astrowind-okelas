<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="The CEO question: if 2 to 3 of the most important people left next month, what would happen and which parts could not be prevented; the real answer differs from the reassuring one by showing how dependent the organization is on individual knowledge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The question every CEO should ask</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Answer honestly before looking for solutions.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="86.0" y="166.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">The question</text><text x="86.0" y="198.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">If 2–3 of our most important people left next month, what would happen?</text><text x="86.0" y="234.5" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="start">And which parts of that are we currently unable to prevent?</text><rect x="60.0" y="300.0" width="528.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="335.9" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">The reassuring answer</text><text x="84.0" y="365.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Doesn’t show how dependent the organization is on</text><text x="84.0" y="384.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">individual knowledge.</text><rect x="612.0" y="300.0" width="528.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="335.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The real answer</text><text x="636.0" y="365.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Shows clearly how dependent the organization is on</text><text x="636.0" y="384.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">individual knowledge.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If the honest answer worries you, that is the signal to start building organizational knowledge.</text></svg>
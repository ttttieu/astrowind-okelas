<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Đã cài đặt nghĩa là phần mềm chạy, nhập được dữ liệu và tạo được báo cáo; đã được áp dụng nghĩa là hệ thống phản ánh đúng cách doanh nghiệp vận hành, và khoảng cách giữa hai trạng thái thường lớn hơn trạng thái dự án hoàn thành cho thấy." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Đã cài đặt không có nghĩa là đã được áp dụng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phần mềm chạy được chưa chắc phản ánh đúng cách doanh nghiệp vận hành.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Đã cài đặt</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Trạng thái kỹ thuật của phần mềm</text><rect x="84.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phần mềm chạy được</text><rect x="84.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhập được dữ liệu</text><rect x="84.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tạo được báo cáo</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Đã được áp dụng</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Trạng thái vận hành thật của doanh nghiệp</text><rect x="636.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hệ thống phản ánh đúng cách doanh nghiệp vận hành</text><rect x="636.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không chỉ là nơi dữ liệu đổ vào sau khi việc thật đã làm ở nơi khác</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khoảng cách giữa hai trạng thái thường lớn hơn mức “dự án hoàn thành” cho thấy.</text></svg>
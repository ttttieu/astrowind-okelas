<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="DMS là đủ khi vấn đề chính là tìm tài liệu, kiểm soát phiên bản, phê duyệt hoặc tổ chức ở mức KM thấp; cần tiến thêm khi câu hỏi cần ngữ cảnh, nhân viên mới học lâu, tri thức vẫn trong đầu người, cần AI có ngữ cảnh hoặc có knowledge loss." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="670" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Khi nào DMS là đủ, và khi nào cần tiến thêm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi đúng là bài toán tri thức cụ thể của doanh nghiệp đang là gì.</text><line x1="60.0" y1="586.0" x2="1140.0" y2="586.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="608.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều kiện theo bài viết; mức KM 1–2 theo thang KM maturity của OKELAS, tách biệt với 5 cấp độ số hóa; công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="649.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="366.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">DMS là đủ khi</text><rect x="84.0" y="196.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="226.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Vấn đề chính là tìm và truy cập tài liệu</text><rect x="84.0" y="254.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="284.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Vấn đề chính là kiểm soát phiên bản</text><rect x="84.0" y="312.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="342.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Vấn đề chính là quy trình phê duyệt</text><rect x="84.0" y="370.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="400.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tổ chức ở mức KM 1–2: tri thức chủ yếu còn trong đầu người</text><rect x="612.0" y="134.0" width="528.0" height="366.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Cần tiến thêm khi</text><rect x="636.0" y="196.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="226.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Câu hỏi là “trong bối cảnh này tôi cần biết gì?”</text><rect x="636.0" y="254.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="284.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên mới mất nhiều tháng dù có đủ tài liệu</text><rect x="636.0" y="312.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="342.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tri thức quan trọng vẫn trong đầu người dù đã có DMS</text><rect x="636.0" y="370.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="400.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cần AI hỗ trợ vận hành có ngữ cảnh</text><rect x="636.0" y="428.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="458.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge loss khi nhân sự thay đổi</text><rect x="60.0" y="516.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="549.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không phải “DMS hay KMS tốt hơn?” mà là “bài toán tri thức cụ thể của doanh nghiệp là gì?”</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Hai cột: kịch bản do nhà nghiên cứu thiết kế với ba điểm; điều không nên suy ra với ba điểm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Nghiên cứu không phải báo cáo sự cố thực tế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nghiên cứu công bố công khai, do phòng thí nghiệm thiết kế để kiểm tra chính mô hình của họ.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tóm tắt nghiên cứu theo bài viết; không phải báo cáo sự cố từ khách hàng nào.</text><text x="60.0" y="577.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Kịch bản do nhà nghiên cứu thiết kế</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Kịch bản nhân tạo, có chủ đích để làm lộ một hành vi cụ thể.</text><rect x="84.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kịch bản nhân tạo</text><rect x="84.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tỷ lệ thay đổi theo thiết lập</text><rect x="84.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kết quả nhạy với cấu hình</text><rect x="612.0" y="134.0" width="528.0" height="294.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Điều không nên suy ra</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả thử nghiệm không phải bằng chứng hành vi này xảy ra trong</text><text x="636.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sử dụng thường ngày.</text><rect x="636.0" y="238.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không phải báo cáo sự cố từ khách hàng</text><rect x="636.0" y="298.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="328.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không đo tần suất trong vận hành</text><rect x="636.0" y="358.0" width="480.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="388.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Không suy ra trực tiếp cho hệ thống của bạn</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây là bằng chứng về điều có thể xảy ra trong điều kiện thử nghiệm đặc biệt, không phải hành vi mặc định.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Lời tự báo cáo của mô hình tách khỏi một lớp bằng chứng độc lập gồm đầu vào, đầu ra, quyền đã dùng và kết quả." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lớp bằng chứng độc lập, không dựa vào lời mô hình</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bằng chứng kiểm chứng được từ bên ngoài quan trọng hơn lời tự giải thích của mô hình về hành động.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Lớp bằng chứng là khuyến nghị theo bài viết; cần đối chiếu với hệ thống ghi log đang có của doanh nghiệp.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="300.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="210.0" y="210.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="middle">Lời tự báo cáo của mô hình</text><text x="60.0" y="295.0" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Có thể không đầy đủ; không nên là</text><text x="60.0" y="314.9" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">nền tảng duy nhất của quản trị.</text><line x1="380.0" y1="205.0" x2="412.0" y2="205.0" stroke="var(--gm)" stroke-width="2"/><polygon points="420.0,205.0 412.0,209.4 412.0,200.6" fill="var(--gm)"/><rect x="430.0" y="150.0" width="710.0" height="200.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="460.0" y="188.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lớp bằng chứng độc lập</text><rect x="460.0" y="210.0" width="310.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="615.0" y="238.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Đầu vào</text><rect x="790.0" y="210.0" width="310.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="945.0" y="238.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Đầu ra</text><rect x="460.0" y="270.0" width="310.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="615.0" y="298.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyền hạn đã dùng</text><rect x="790.0" y="270.0" width="310.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="945.0" y="298.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Kết quả thực tế</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Lớp bằng chứng cần được ghi lại độc lập với mô hình.</text></svg>
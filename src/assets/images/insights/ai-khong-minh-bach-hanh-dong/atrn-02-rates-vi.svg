<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582" width="1200" height="582" role="img" aria-label="Hai thẻ tỷ lệ 7–24% và 78%, và một thẻ rộng về Sleeper Agents." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="582" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Con số đi kèm điều kiện thử nghiệm cụ thể</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai tỷ lệ từ nghiên cứu Anthropic và Redwood Research (12/2024); bài viết nhấn mạnh tỷ lệ thay đổi theo thiết lập.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Theo bài viết và Anthropic Alignment Science cùng Redwood Research (12/2024); không phải tần suất trong vận hành.</text><text x="60.0" y="561.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="195.6" font-size="40" font-weight="700" fill="var(--p)" text-anchor="start">7–24%</text><text x="84.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tỷ lệ mẫu suy luận "alignment faking" qua các thiết lập</text><text x="84.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thử nghiệm.</text><rect x="612.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="195.6" font-size="40" font-weight="700" fill="var(--p)" text-anchor="start">78%</text><text x="636.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tỷ lệ trong một điều kiện thử nghiệm có thêm bước huấn luyện</text><text x="636.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tăng cường.</text><rect x="60.0" y="292.0" width="1080.0" height="110.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="330.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sleeper Agents (Anthropic, 2024)</text><text x="84.0" y="360.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Backdoor được cài cố ý; huấn luyện an toàn chuẩn không loại bỏ hoàn toàn. Tác giả nói hành vi này được tạo ra có chủ đích, không xuất hiện</text><text x="84.0" y="381.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tự nhiên.</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Các con số này phụ thuộc thiết lập; không nên đọc như tỷ lệ chung cho mọi hệ thống.</text></svg>
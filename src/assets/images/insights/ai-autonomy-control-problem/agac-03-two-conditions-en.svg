<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Two stacked conditions joined by AND, leading to a block for unexpected behavior." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Risk appears when two conditions coexist</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Autonomy is valuable; risk appears only when the goal is incomplete and the space of methods is broad.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article; the two conditions are how the article frames risk, not a scale.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="420.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="270.0" y="217.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">The stated goal does not match the real intent</text><rect x="60.0" y="290.0" width="420.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="270.0" y="327.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">The space of methods is broad enough to</text><text x="270.0" y="348.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">include unwanted ones</text><text x="240.0" y="277.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">AND</text><line x1="486.0" y1="272.0" x2="596.0" y2="272.0" stroke="var(--p)" stroke-width="2.6"/><polygon points="606.0,272.0 596.0,277.5 596.0,266.5" fill="var(--p)"/><rect x="610.0" y="230.0" width="530.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="875.0" y="278.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Unexpected behavior (specification gaming)</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Autonomy is valuable when it solves problems no one anticipated.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Two rows of examples, each with a metric goal, an arrow and an unwanted outcome." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Enterprise examples: metric met, purpose missed</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The metric improves while the real purpose is missed; these are the kinds of cases the article gives for businesses.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Enterprise examples are illustrations drawn from the article, not specific customer cases.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="420.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="270.0" y="220.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Goal: reduce complaint-handling time</text><line x1="486.0" y1="215.0" x2="596.0" y2="215.0" stroke="var(--p)" stroke-width="2.6"/><polygon points="606.0,215.0 596.0,220.5 596.0,209.5" fill="var(--p)"/><rect x="610.0" y="170.0" width="530.0" height="90.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="875.0" y="220.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Tickets closed quickly without being resolved</text><rect x="60.0" y="294.0" width="420.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="270.0" y="344.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Goal: raise email response rates</text><line x1="486.0" y1="339.0" x2="596.0" y2="339.0" stroke="var(--p)" stroke-width="2.6"/><polygon points="606.0,339.0 596.0,344.5 596.0,333.5" fill="var(--p)"/><rect x="610.0" y="294.0" width="530.0" height="90.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="875.0" y="344.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">More short, generic messages sent</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A met metric does not mean the purpose was achieved.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Two panels: the desired finish, and what was optimized, circling three bonus targets; two stat cards below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">CoastRunners: optimizing the score, not finishing</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">OpenAI’s 2016 CoastRunners experiment: the agent scored higher than human players by circling bonus targets.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Based on the article and OpenAI’s 2016 experiment; not reproduced data. The 20% figure is as stated in the article.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="520.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="170.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Finish the race</text><line x1="120.0" y1="250.0" x2="500.0" y2="250.0" stroke="var(--gm)" stroke-width="3"/><rect x="480.0" y="224.0" width="56.0" height="40.0" rx="6" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><rect x="620.0" y="134.0" width="520.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="644.0" y="170.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Bonus targets ×3 (respawn)</text><circle cx="700.0" cy="240.0" r="16" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><circle cx="780.0" cy="240.0" r="16" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><circle cx="860.0" cy="240.0" r="16" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><line x1="860.0" y1="256.0" x2="860.0" y2="276.0" stroke="var(--p)" stroke-width="2.4"/><line x1="860.0" y1="276.0" x2="700.0" y2="276.0" stroke="var(--p)" stroke-width="2.4"/><line x1="700.0" y1="276.0" x2="700.0" y2="267.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="700.0,258.0 705.0,267.0 695.0,267.0" fill="var(--p)"/><rect x="60.0" y="310.0" width="520.0" height="110.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="364.4" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">+20%</text><text x="84.0" y="395.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">higher score than average human players (OpenAI, 2016)</text><rect x="620.0" y="310.0" width="520.0" height="110.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="644.0" y="364.4" font-size="34" font-weight="700" fill="var(--a)" text-anchor="start">No laps finished</text><text x="644.0" y="395.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">The boat kept catching fire and never finished</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The agent did not malfunction; it optimized the specification it was given.</text></svg>
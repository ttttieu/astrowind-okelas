<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 608" width="1200" height="608" role="img" aria-label="Three numbered rows, each an implication for enterprises." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="608" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three implications for enterprise deployment</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three implications the article draws for deploying agents in an enterprise.</text><line x1="60.0" y1="524.0" x2="1140.0" y2="524.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="546.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three implications as stated in the article; to be checked against your own governance framework.</text><text x="60.0" y="587.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="176.0" r="15" fill="var(--p)"/><text x="100.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="150.0" y="182.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Write goals as close to true intent as possible, and assume the gap never fully closes.</text><rect x="60.0" y="234.0" width="1080.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="276.0" r="15" fill="var(--gm)"/><text x="100.0" y="281.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="150.0" y="282.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Limit the methods an agent may use, not only its goal specification; apply least-privilege thinking.</text><rect x="60.0" y="334.0" width="1080.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="100.0" cy="376.0" r="15" fill="var(--p)"/><text x="100.0" y="381.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="150.0" y="369.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Monitor how an agent reaches results, not just the results; gaming often appears as an</text><text x="150.0" y="395.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">unusual shortcut.</text><rect x="60.0" y="454.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="487.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The risk lies in the gap between the stated goal and the method AI chooses, not in autonomy itself.</text></svg>
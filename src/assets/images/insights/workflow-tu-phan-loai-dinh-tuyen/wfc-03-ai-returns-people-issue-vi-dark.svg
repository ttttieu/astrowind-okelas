<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="AI trả về bốn thành phần: loại đề xuất, mức độ chắc chắn, đoạn căn cứ, cờ nhiều vấn đề. Người có thẩm quyền ban hành ba quyết định: loại nào đi tới ai, ngưỡng chắc chắn, loại không tự động chuyển." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="604" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">AI trả về gì, con người ban hành gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Ba quyết định không thuộc về AI.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><text x="60.0" y="146.9" font-size="16" font-weight="700" fill="#5FA0FF" text-anchor="start">AI trả về</text><text x="620.0" y="146.9" font-size="16" font-weight="700" fill="#A78BFA" text-anchor="start">Con người ban hành</text><rect x="60.0" y="166.0" width="520.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="80.0" y="192.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Loại đề xuất</text><text x="80.0" y="216.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Lấy từ danh mục tổ chức đã định nghĩa</text><rect x="60.0" y="244.0" width="520.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="80.0" y="270.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Mức độ chắc chắn</text><text x="80.0" y="294.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Để rule biết khi nào nên dừng</text><rect x="60.0" y="322.0" width="520.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="80.0" y="348.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Đoạn căn cứ</text><text x="80.0" y="372.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Người xem biết AI dựa vào đâu</text><rect x="60.0" y="400.0" width="520.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="80.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Cờ nhiều vấn đề</text><text x="80.0" y="450.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Tách yêu cầu thay vì ép vào một danh mục</text><rect x="620.0" y="166.0" width="520.0" height="92.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="194.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Loại nào đi tới ai</text><text x="640.0" y="218.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Kèm người thay thế khi vắng và thời hạn xử lý</text><rect x="620.0" y="268.0" width="520.0" height="92.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="296.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Ngưỡng chắc chắn</text><text x="640.0" y="320.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Dưới mức nào ca đi tới người phân loại; tùy cái giá của chuyển sai</text><rect x="620.0" y="370.0" width="520.0" height="92.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="640.0" y="398.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Loại không tự động chuyển</text><text x="640.0" y="422.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Dù AI chắc chắn, vì hậu quả lớn hoặc khó đảo ngược</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Nhãn sai chỉ có tác động khi bảng tuyến cho phép.</text></svg>
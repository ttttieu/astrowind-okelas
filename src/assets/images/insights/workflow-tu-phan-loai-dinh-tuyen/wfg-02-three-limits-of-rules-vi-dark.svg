<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba giới hạn của rule cứng: cùng vấn đề có nhiều cách diễn đạt, một yêu cầu chứa nhiều vấn đề, và quy tắc dần lỗi thời; bù lại rule cứng nhanh, dễ hiểu, dễ kiểm tra." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba giới hạn cố hữu của định tuyến bằng rule cứng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Rule cứng không sai: nó chỉ đúng khi nội dung khớp với những gì quy tắc dự đoán.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#A78BFA"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Cùng vấn đề, nhiều cách</text><text x="84.0" y="247.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">diễn đạt</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Khách viết "không truy cập được tài khoản</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">sau khi thanh toán" thay vì từ khóa "hoàn</text><text x="84.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">tiền" mà quy tắc đang tìm.</text><rect x="427.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Một yêu cầu chứa nhiều vấn đề</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Quy tắc phải chọn một cách tùy tiện nên</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">định tuyến theo tiêu chí nào.</text><rect x="794.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#A78BFA"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Quy tắc dần lỗi thời</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Cách diễn đạt đổi theo thời gian, sản phẩm</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">mới, thuật ngữ nội bộ mới; cần có người chủ</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">động cập nhật.</text><rect x="60.0" y="386.0" width="1080.0" height="70.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Ưu điểm của rule cứng</text><rect x="380.0" y="401.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="480.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Nhanh</text><rect x="594.0" y="401.0" width="240.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="714.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Dễ hiểu</text><rect x="848.0" y="401.0" width="240.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="968.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Dễ kiểm tra</text><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Sai có hệ thống: đúng ở đúng kịch bản, sai ở mọi biến thể khác.</text></svg>
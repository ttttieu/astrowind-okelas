<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Gợi ý ở mức hồ sơ gồm các ca tương tự, cách đã xử lý, kết quả và đường dẫn tới ca gốc; ba dấu hiệu gợi ý thành quyết định ngầm là trình như đáp án, chấp nhận mặc định không xem hồ sơ, và không theo dõi tỷ lệ gợi ý bị sửa." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="570" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Gợi ý ở mức hồ sơ, không ở mức quyết định</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Người ký xử lý vẫn là người xử lý.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="146.9" font-size="16" font-weight="700" fill="#5FA0FF" text-anchor="start">Ở mức hồ sơ (nên)</text><text x="620.0" y="146.9" font-size="16" font-weight="700" fill="#A78BFA" text-anchor="start">Thành quyết định ngầm (cần tránh)</text><rect x="60.0" y="166.0" width="520.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="212.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Các ca tương tự</text><rect x="60.0" y="258.0" width="520.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="304.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Cách đã xử lý và kết quả</text><rect x="60.0" y="350.0" width="520.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="396.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Đường dẫn tới ca gốc</text><rect x="620.0" y="166.0" width="520.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="211.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Gợi ý được trình như một đáp án</text><rect x="620.0" y="258.0" width="520.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="303.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Chấp nhận mặc định, không còn xem hồ sơ</text><rect x="620.0" y="350.0" width="520.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="395.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Không ai theo dõi tỷ lệ gợi ý bị sửa</text><rect x="60.0" y="448.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="481.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Mọi gợi ý đi kèm nguồn: ca nào đã thực sự xảy ra.</text></svg>
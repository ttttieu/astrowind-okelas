<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba giới hạn của rule cứng: cùng vấn đề có nhiều cách diễn đạt, một yêu cầu chứa nhiều vấn đề, và quy tắc dần lỗi thời; bù lại rule cứng nhanh, dễ hiểu, dễ kiểm tra." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba giới hạn cố hữu của định tuyến bằng rule cứng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Rule cứng không sai: nó chỉ đúng khi nội dung khớp với những gì quy tắc dự đoán.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="223.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cùng vấn đề, nhiều cách</text><text x="84.0" y="247.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">diễn đạt</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khách viết "không truy cập được tài khoản</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sau khi thanh toán" thay vì từ khóa "hoàn</text><text x="84.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tiền" mà quy tắc đang tìm.</text><rect x="427.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="223.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Một yêu cầu chứa nhiều vấn đề</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Quy tắc phải chọn một cách tùy tiện nên</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">định tuyến theo tiêu chí nào.</text><rect x="794.0" y="134.0" width="346.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="223.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quy tắc dần lỗi thời</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cách diễn đạt đổi theo thời gian, sản phẩm</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">mới, thuật ngữ nội bộ mới; cần có người chủ</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">động cập nhật.</text><rect x="60.0" y="386.0" width="1080.0" height="70.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ưu điểm của rule cứng</text><rect x="380.0" y="401.0" width="200.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="480.0" y="426.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhanh</text><rect x="594.0" y="401.0" width="240.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="714.0" y="426.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Dễ hiểu</text><rect x="848.0" y="401.0" width="240.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="968.0" y="426.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Dễ kiểm tra</text><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Sai có hệ thống: đúng ở đúng kịch bản, sai ở mọi biến thể khác.</text></svg>
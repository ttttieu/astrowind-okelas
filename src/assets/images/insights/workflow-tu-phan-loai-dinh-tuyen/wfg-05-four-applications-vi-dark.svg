<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bốn ứng dụng: phân loại khiếu nại khách hàng, định tuyến yêu cầu hỗ trợ nội bộ, phân loại email nhà cung cấp, và định tuyến yêu cầu bảo trì thiết bị." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Bốn ứng dụng trong vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Giá trị lớn nhất không nằm ở phân loại nhanh hơn.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="156.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="191.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Khiếu nại khách hàng</text><rect x="411.9" y="170.0" width="158.1" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="490.9" y="186.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Phân loại · gợi ý ưu tiên</text><text x="82.0" y="228.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Phân biệt vấn đề chất lượng, giao hàng hay thanh toán theo nội</text><text x="82.0" y="249.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">dung, kèm gợi ý mức ưu tiên từ lịch sử khách.</text><rect x="610.0" y="156.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="191.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Yêu cầu hỗ trợ nội bộ</text><rect x="948.5" y="170.0" width="171.5" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="1034.3" y="186.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Định tuyến · tách yêu cầu</text><text x="632.0" y="228.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Chuyển đúng tới IT hoặc bảo trì thiết bị, hoặc tách làm hai nếu liên</text><text x="632.0" y="249.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">quan cả hai.</text><rect x="60.0" y="306.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="341.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Email từ nhà cung cấp</text><rect x="421.2" y="320.0" width="148.8" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="495.6" y="336.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Phân loại · định tuyến</text><text x="82.0" y="378.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Xác nhận đơn, báo trễ giao hoặc đổi giá: mỗi loại cần người xử lý</text><text x="82.0" y="399.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">khác nhau.</text><rect x="610.0" y="306.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="341.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Yêu cầu bảo trì thiết bị</text><rect x="950.7" y="320.0" width="169.3" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="1035.3" y="336.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Gợi ý theo sự cố tương tự</text><text x="632.0" y="378.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Liên kết mô tả tự do như máy kêu lạ với sự cố cũ để gợi ý loại lỗi</text><text x="632.0" y="399.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">khả dĩ.</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Giảm số lần một yêu cầu bị đọc và chuyển tay trước khi tới đúng người.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" width="1200" height="576" role="img" aria-label="Yêu cầu mới được so với các trường hợp đã xử lý, hệ thống gợi ý bước tiếp theo và người xử lý quyết định cuối; hai ví dụ: khiếu nại lỗi đóng gói và yêu cầu mua hàng lặp lại." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="576" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ định tuyến đến đề xuất bước tiếp theo</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Gợi ý, không phải quyết định tự động: người xử lý có sẵn điểm khởi đầu từ dữ liệu lịch sử.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Yêu cầu mới được phân loại</text><line x1="304.0" y1="176.0" x2="327.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="336.0,176.0 327.0,180.9 327.0,171.1" fill="var(--p)"/><rect x="340.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="460.0" y="171.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">So với các trường hợp đã xử lý</text><text x="460.0" y="190.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">tương tự</text><line x1="584.0" y1="176.0" x2="607.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="616.0,176.0 607.0,180.9 607.0,171.1" fill="var(--p)"/><rect x="620.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--p)"/><text x="740.0" y="181.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Gợi ý bước xử lý tiếp theo</text><line x1="864.0" y1="176.0" x2="887.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="896.0,176.0 887.0,180.9 887.0,171.1" fill="var(--p)"/><rect x="900.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="1020.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người xử lý quyết định cuối</text><rect x="1031.0" y="238.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="253.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="268.0" width="530.0" height="140.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="82.0" y="301.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Khiếu nại nhóm "lỗi đóng gói"</text><text x="82.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Gợi ý: phần lớn ca tương tự trước đây được xử lý bằng cách X, kèm</text><text x="82.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thời gian xử lý thường gặp.</text><rect x="610.0" y="268.0" width="530.0" height="140.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="632.0" y="301.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu mua hàng khớp mẫu lặp lại</text><text x="632.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Gợi ý: nhà cung cấp và mức giá tham khảo từ lần gần nhất.</text><rect x="60.0" y="424.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="457.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Rút ngắn phần tìm hiểu bối cảnh; quyết định cuối vẫn thuộc về con người.</text></svg>
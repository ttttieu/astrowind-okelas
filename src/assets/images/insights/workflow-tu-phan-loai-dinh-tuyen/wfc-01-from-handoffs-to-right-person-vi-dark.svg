<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Rule từ khóa khiến yêu cầu rơi vào hộp thư chung rồi qua nhân viên, kỹ thuật, kế toán; phân loại rồi định tuyến đi từ yêu cầu qua AI đề xuất loại và bảng tuyến do người ban hành để tới đúng người, ít lần chuyển tay hơn." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Từ nhiều lần chuyển tay đến đúng người</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Giá trị nằm ở việc giảm số lần bị đọc và chuyển tay.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Tình huống minh họa từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="1080.0" height="150.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="159.8" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="start">Rule từ khóa: yêu cầu bị đọc và chuyển nhiều lần</text><rect x="84.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="169.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Yêu cầu</text><line x1="258.0" y1="222.0" x2="286.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="296.0,222.0 286.0,227.5 286.0,216.5" fill="#5B6575"/><rect x="300.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="385.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Hộp thư chung</text><line x1="474.0" y1="222.0" x2="502.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="512.0,222.0 502.0,227.5 502.0,216.5" fill="#5B6575"/><rect x="516.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="601.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Nhân viên</text><line x1="690.0" y1="222.0" x2="718.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="728.0,222.0 718.0,227.5 718.0,216.5" fill="#5B6575"/><rect x="732.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="817.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Kỹ thuật</text><line x1="906.0" y1="222.0" x2="934.0" y2="222.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="944.0,222.0 934.0,227.5 934.0,216.5" fill="#5B6575"/><rect x="948.0" y="192.0" width="170.0" height="60.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1033.0" y="227.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Kế toán</text><rect x="60.0" y="300.0" width="1080.0" height="150.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="329.8" font-size="15" font-weight="700" fill="#5FA0FF" text-anchor="start">Phân loại rồi định tuyến: ít lần chuyển tay hơn</text><rect x="84.0" y="362.0" width="200.0" height="60.0" rx="10" fill="#08090A" stroke="#F7F8F8" stroke-width="1.6"/><text x="184.0" y="397.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Yêu cầu</text><line x1="288.0" y1="392.0" x2="317.0" y2="392.0" stroke="#2B74F5" stroke-width="3"/><polygon points="328.0,392.0 317.0,398.1 317.0,385.9" fill="#2B74F5"/><rect x="332.0" y="362.0" width="250.0" height="60.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="457.0" y="397.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">AI đề xuất loại</text><line x1="586.0" y1="392.0" x2="615.0" y2="392.0" stroke="#A78BFA" stroke-width="3"/><polygon points="626.0,392.0 615.0,398.1 615.0,385.9" fill="#A78BFA"/><rect x="630.0" y="362.0" width="240.0" height="60.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4"/><text x="750.0" y="397.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bảng tuyến</text><line x1="874.0" y1="392.0" x2="903.0" y2="392.0" stroke="#2B74F5" stroke-width="3"/><polygon points="914.0,392.0 903.0,398.1 903.0,385.9" fill="#2B74F5"/><rect x="918.0" y="362.0" width="200.0" height="60.0" rx="10" fill="#2B74F5"/><text x="1018.0" y="397.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Đúng người</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Giá trị đến từ ít lần chuyển tay hơn, không từ việc giao quyền cho AI.</text></svg>
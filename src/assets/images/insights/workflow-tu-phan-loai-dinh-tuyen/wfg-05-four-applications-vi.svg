<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bốn ứng dụng: phân loại khiếu nại khách hàng, định tuyến yêu cầu hỗ trợ nội bộ, phân loại email nhà cung cấp, và định tuyến yêu cầu bảo trì thiết bị." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn ứng dụng trong vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giá trị lớn nhất không nằm ở phân loại nhanh hơn.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="156.0" width="530.0" height="136.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="191.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Khiếu nại khách hàng</text><rect x="411.9" y="170.0" width="158.1" height="24.0" rx="12.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="490.9" y="186.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Phân loại · gợi ý ưu tiên</text><text x="82.0" y="228.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phân biệt vấn đề chất lượng, giao hàng hay thanh toán theo nội</text><text x="82.0" y="249.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dung, kèm gợi ý mức ưu tiên từ lịch sử khách.</text><rect x="610.0" y="156.0" width="530.0" height="136.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="632.0" y="191.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu hỗ trợ nội bộ</text><rect x="948.5" y="170.0" width="171.5" height="24.0" rx="12.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="1034.3" y="186.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Định tuyến · tách yêu cầu</text><text x="632.0" y="228.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chuyển đúng tới IT hoặc bảo trì thiết bị, hoặc tách làm hai nếu liên</text><text x="632.0" y="249.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quan cả hai.</text><rect x="60.0" y="306.0" width="530.0" height="136.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="341.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Email từ nhà cung cấp</text><rect x="421.2" y="320.0" width="148.8" height="24.0" rx="12.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="495.6" y="336.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Phân loại · định tuyến</text><text x="82.0" y="378.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Xác nhận đơn, báo trễ giao hoặc đổi giá: mỗi loại cần người xử lý</text><text x="82.0" y="399.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">khác nhau.</text><rect x="610.0" y="306.0" width="530.0" height="136.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="632.0" y="341.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu bảo trì thiết bị</text><rect x="950.7" y="320.0" width="169.3" height="24.0" rx="12.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="1035.3" y="336.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Gợi ý theo sự cố tương tự</text><text x="632.0" y="378.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Liên kết mô tả tự do như máy kêu lạ với sự cố cũ để gợi ý loại lỗi</text><text x="632.0" y="399.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">khả dĩ.</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giảm số lần một yêu cầu bị đọc và chuyển tay trước khi tới đúng người.</text></svg>
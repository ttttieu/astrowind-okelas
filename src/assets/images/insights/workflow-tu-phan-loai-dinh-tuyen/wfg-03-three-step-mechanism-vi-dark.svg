<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Ba bước của intelligent routing: hiểu nội dung theo ngữ nghĩa, so khớp với danh mục hoặc trường hợp đã biết, tách các vấn đề trong cùng yêu cầu; vẫn có thể sai ở ca mơ hồ hoặc chưa từng gặp." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="580" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Intelligent routing hoạt động qua ba bước</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Nâng cấp phần hiểu nội dung nằm phía trước logic định tuyến.</text><line x1="60.0" y1="518.0" x2="1140.0" y2="518.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="540.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Hiểu nội dung theo ngữ nghĩa</text><text x="84.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Không chỉ theo từ khóa xuất hiện.</text><line x1="408.0" y1="170.0" x2="419.0" y2="170.0" stroke="#2B74F5" stroke-width="2"/><polygon points="425.0,170.0 419.0,173.3 419.0,166.7" fill="#2B74F5"/><rect x="427.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">So khớp với danh mục hoặc</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">trường hợp đã biết</text><text x="451.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Dựa trên tương đồng về ý nghĩa, không chỉ</text><text x="451.0" y="304.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">về câu chữ.</text><line x1="775.0" y1="170.0" x2="786.0" y2="170.0" stroke="#2B74F5" stroke-width="2"/><polygon points="792.0,170.0 786.0,173.3 786.0,166.7" fill="#2B74F5"/><rect x="794.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Tách từng vấn đề trong</text><text x="818.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">cùng yêu cầu</text><text x="818.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Nhận diện và phân tách, thay vì buộc chọn</text><text x="818.0" y="304.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">một danh mục duy nhất.</text><rect x="60.0" y="350.0" width="1080.0" height="84.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="383.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Không có nghĩa là chính xác tuyệt đối</text><text x="84.0" y="411.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Vẫn có thể phân loại sai ở ca thực sự mơ hồ hoặc chưa từng gặp.</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Khác rule cứng: xử lý được cả biến thể chưa từng lập trình, miễn là tương đồng về ý nghĩa.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="Năm nền tảng để AI tạo giá trị cho cả tổ chức: quy trình, dữ liệu vận hành, tri thức, governance và organizational context; khoảng cách là khoảng cách tổ chức, không phải công nghệ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="534" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm nền tảng để AI tạo giá trị cho cả tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Năm điều kiện cần có để AI vượt khỏi mức cá nhân.</text><line x1="60.0" y1="450.0" x2="1140.0" y2="450.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="472.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Năm điều kiện theo phân tích trong bài, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="513.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Khoảng cách là khoảng cách tổ chức, không phải công nghệ</text><line x1="162.0" y1="188.0" x2="162.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="162.0,212.0 157.6,204.0 166.4,204.0" fill="var(--gm)"/><rect x="60.0" y="214.0" width="204.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình</text><text x="76.0" y="278.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đủ rõ để AI tham gia</text><text x="76.0" y="296.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vào, không chỉ tăng tốc</text><text x="76.0" y="315.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">bước soạn thảo bên</text><text x="76.0" y="333.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">ngoài quy trình.</text><line x1="381.0" y1="188.0" x2="381.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="381.0,212.0 376.6,204.0 385.4,204.0" fill="var(--gm)"/><rect x="279.0" y="214.0" width="204.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="295.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu vận hành</text><text x="295.0" y="278.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Có cấu trúc và truy vấn</text><text x="295.0" y="296.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">được, không rải rác trong</text><text x="295.0" y="315.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Excel, email và Word.</text><line x1="600.0" y1="188.0" x2="600.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,212.0 595.6,204.0 604.4,204.0" fill="var(--gm)"/><rect x="498.0" y="214.0" width="204.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức</text><text x="514.0" y="278.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Gắn với quy trình,</text><text x="514.0" y="296.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">sản phẩm, sự kiện và</text><text x="514.0" y="315.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định, không chỉ là</text><text x="514.0" y="333.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tài liệu trong thư mục.</text><line x1="819.0" y1="188.0" x2="819.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="819.0,212.0 814.6,204.0 823.4,204.0" fill="var(--gm)"/><rect x="717.0" y="214.0" width="204.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Governance</text><text x="733.0" y="278.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">AI được tác động vào điều</text><text x="733.0" y="296.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">gì, điều gì vẫn cần người</text><text x="733.0" y="315.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">có thẩm quyền phê duyệt.</text><line x1="1038.0" y1="188.0" x2="1038.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1038.0,212.0 1033.6,204.0 1042.4,204.0" fill="var(--gm)"/><rect x="936.0" y="214.0" width="204.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational</text><text x="952.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">context</text><text x="952.0" y="300.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Để AI hiểu doanh nghiệp</text><text x="952.0" y="318.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vận hành ra sao, không chỉ</text><text x="952.0" y="337.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">biết nội dung tài liệu.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khi chưa có các điều kiện này, AI vẫn hữu ích nhưng chỉ ở mức cá nhân.</text></svg>
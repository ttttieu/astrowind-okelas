<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 708" width="1200" height="708" role="img" aria-label="AI productivity đo đầu ra cá nhân như thời gian soạn và số email mỗi ca; organizational intelligence đo năm năng lực tập thể: ra quyết định, thực thi nhất quán, học hỏi, giải thích và truy xuất, duy trì tri thức." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="708" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity đo đầu ra cá nhân, không đo kết quả tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai khái niệm đo ở hai nơi khác nhau, nên không tự động kéo theo nhau.</text><line x1="60.0" y1="624.0" x2="1140.0" y2="624.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="646.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ khái niệm từ bài viết, không phải số liệu đo lường. Hai thuật ngữ dùng theo nghĩa quản trị và vận hành, không phải định nghĩa kỹ thuật về AI.</text><text x="60.0" y="687.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="404.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đo đầu ra của cá nhân, ở mức công việc đơn lẻ</text><rect x="84.0" y="238.0" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="274.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thời gian soạn tài liệu giảm</text><rect x="84.0" y="310.5" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="346.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Số email xử lý mỗi ca tăng</text><rect x="84.0" y="383.0" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="419.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Lỗi chính tả và ngữ pháp giảm</text><rect x="84.0" y="455.5" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="491.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên mới tổng hợp thông tin nhanh hơn</text><rect x="612.0" y="134.0" width="528.0" height="404.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational intelligence</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đo năng lực tập thể của tổ chức</text><rect x="636.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ra quyết định từ thông tin đúng, đủ, kịp thời</text><rect x="636.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thực thi nhất quán, bất kể ai và ca nào</text><rect x="636.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Học hỏi từ kinh nghiệm, bài học được áp dụng</text><rect x="636.0" y="412.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="441.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giải thích và truy xuất: vì sao, ai duyệt, bằng chứng nào</text><rect x="636.0" y="470.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="499.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Duy trì tri thức khi người quan trọng rời đi</text><rect x="60.0" y="554.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="587.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Các con số cá nhân có thật và có giá trị kinh tế. Chúng chỉ không phải là kết quả của tổ chức.</text></svg>
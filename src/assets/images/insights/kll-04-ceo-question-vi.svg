<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Câu hỏi cho CEO: nếu 2 đến 3 người quan trọng nhất rời đi vào tháng tới thì điều gì sẽ xảy ra và phần nào không thể ngăn chặn; câu trả lời thực sự khác câu trả lời trấn an ở chỗ cho thấy mức độ phụ thuộc vào tri thức cá nhân." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi mà mọi CEO nên tự đặt ra</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Trả lời thành thật trước khi tìm giải pháp.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="86.0" y="166.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Câu hỏi</text><text x="86.0" y="198.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Nếu 2–3 người quan trọng nhất trong tổ chức cùng rời đi vào tháng tới, điều gì sẽ xảy ra?</text><text x="86.0" y="234.5" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="start">Và phần nào của điều đó mà chúng ta hiện không có cách nào ngăn chặn?</text><rect x="60.0" y="300.0" width="528.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="335.9" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="start">Câu trả lời trấn an</text><text x="84.0" y="365.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không cho thấy tổ chức phụ thuộc vào tri thức cá nhân đến đâu.</text><rect x="612.0" y="300.0" width="528.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="335.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Câu trả lời thực sự</text><text x="636.0" y="365.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cho thấy rõ mức độ phụ thuộc vào tri thức cá nhân.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu câu trả lời khiến bạn lo ngại, đó là tín hiệu để bắt đầu xây dựng tri thức tổ chức.</text></svg>
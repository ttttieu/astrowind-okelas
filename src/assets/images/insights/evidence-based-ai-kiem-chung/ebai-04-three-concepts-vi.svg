<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="Ba ô nối tiếp: bằng chứng, truy vết và audit trail, mỗi ô có định nghĩa ngắn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="586" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng, truy vết và audit trail khác nhau thế nào</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba khái niệm dễ bị gộp chung, nhưng auditor hỏi từng cái một.</text><line x1="60.0" y1="502.0" x2="1140.0" y2="502.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="524.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân định ba khái niệm theo bài viết; mô tả là minh họa.</text><text x="60.0" y="565.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="196.0" width="340.0" height="171.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng (evidence)</text><text x="84.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bằng chứng cụ thể rằng sự kiện đã xảy</text><text x="84.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ra, ví dụ phiếu kiểm tra, kết quả đo, ảnh</text><text x="84.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kiểm tra ngoại quan.</text><line x1="404.0" y1="281.5" x2="418.0" y2="281.5" stroke="var(--p)" stroke-width="2"/><polygon points="426.0,281.5 418.0,285.9 418.0,277.1" fill="var(--p)"/><rect x="430.0" y="196.0" width="340.0" height="171.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="454.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Truy vết (trace)</text><text x="454.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Khả năng truy ngược chuỗi từ</text><text x="454.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định về kết quả kiểm tra,</text><text x="454.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dữ liệu nguyên liệu và người thực</text><text x="454.0" y="335.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hiện, phê duyệt.</text><line x1="774.0" y1="281.5" x2="788.0" y2="281.5" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,281.5 788.0,285.9 788.0,277.1" fill="var(--p)"/><rect x="800.0" y="196.0" width="340.0" height="171.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="824.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Audit trail</text><text x="824.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Hồ sơ hệ thống ghi ai làm gì, khi nào,</text><text x="824.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kết quả ra sao, ai thay đổi gì, để audit</text><text x="824.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không cần phỏng vấn tất cả.</text><rect x="60.0" y="411.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="442.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ba khái niệm cùng phải bao phủ hoạt động của AI: nhận được bằng chứng gì, truy được chuỗi nào, và hồ sơ có dựng</text><text x="600.0" y="466.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">lại được quyết định không.</text></svg>
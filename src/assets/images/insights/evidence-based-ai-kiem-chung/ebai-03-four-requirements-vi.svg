<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 546" width="1200" height="546" role="img" aria-label="Bốn thẻ yêu cầu: traceability đầu vào, explainability đầu ra, điểm review của con người, audit trail đầy đủ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="546" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn yêu cầu vượt ngoài việc trả lời đúng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi yêu cầu áp dụng ở bất kỳ bước nào mà AI tác động đến quyết định có liên quan compliance.</text><line x1="60.0" y1="462.0" x2="1140.0" y2="462.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="484.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn yêu cầu là phân tích theo bài viết, không phải khung chuẩn được chứng nhận; yêu cầu cụ thể khác nhau theo tiêu chuẩn và cơ quan chứng nhận.</text><text x="60.0" y="525.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="115.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability đầu vào</text><text x="84.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi lại nhiệm vụ, dữ liệu đầu vào kèm phiên bản và thời gian, tiêu</text><text x="84.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chuẩn áp dụng.</text><rect x="606.0" y="134.0" width="534.0" height="115.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Explainability đầu ra</text><text x="630.0" y="200.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Giải thích dựa trên bằng chứng cụ thể, ở mức người có thẩm quyền</text><text x="630.0" y="221.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">đánh giá được.</text><rect x="60.0" y="261.0" width="534.0" height="115.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="289.0" r="15" fill="var(--p)"/><text x="90.0" y="294.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="297.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm review của con người</text><text x="84.0" y="327.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người có thẩm quyền xác nhận hoặc bác bỏ kết quả AI trước khi</text><text x="84.0" y="348.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ghi nhận thành quyết định.</text><rect x="606.0" y="261.0" width="534.0" height="115.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="289.0" r="15" fill="var(--gm)"/><text x="636.0" y="294.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="297.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Audit trail đầy đủ</text><text x="630.0" y="327.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chuỗi từ dữ liệu, phân tích AI, review đến quyết định cuối được lưu</text><text x="630.0" y="348.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">và truy xuất theo yêu cầu.</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI không ký duyệt: con người quyết định, và việc đó phải được ghi lại.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 546" width="1200" height="546" role="img" aria-label="Ba thẻ rủi ro: quyết định không dựng lại được, không biết phiên bản dữ liệu, trách nhiệm không rõ ràng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="546" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba rủi ro khi AI không để lại dấu vết</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khoảng trống không nằm ở chỗ AI sai, mà ở chỗ AI được dùng nhưng không để lại dấu vết.</text><line x1="60.0" y1="462.0" x2="1140.0" y2="462.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="484.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba rủi ro là phân tích theo bài viết, không phải số liệu đo lường.</text><text x="60.0" y="525.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="172.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="206.0" r="15" fill="var(--p)"/><text x="90.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định không dựng</text><text x="120.0" y="240.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">lại được</text><text x="84.0" y="274.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu input và output của AI không được</text><text x="84.0" y="295.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">lưu, chuỗi quyết định không thể tái</text><text x="84.0" y="317.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dựng khi điều tra.</text><rect x="426.0" y="176.0" width="340.0" height="172.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="456.0" cy="206.0" r="15" fill="var(--gm)"/><text x="456.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="486.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không biết phiên bản dữ liệu</text><text x="450.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thiếu bản ghi dữ liệu, thời điểm và</text><text x="450.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">phiên bản tiêu chuẩn, nên quyết định cũ</text><text x="450.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không chứng minh được là đúng khi tiêu</text><text x="450.0" y="314.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chuẩn đã đổi.</text><rect x="792.0" y="176.0" width="340.0" height="172.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="206.0" r="15" fill="var(--p)"/><text x="822.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="852.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trách nhiệm không rõ ràng</text><text x="816.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thiếu bản ghi vai trò của AI và bước</text><text x="816.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">người xem xét sau đó, ranh giới</text><text x="816.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trách nhiệm trở nên mơ hồ.</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI không phải pháp nhân: trách nhiệm vẫn thuộc về tổ chức.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Explicit knowledge diễn đạt và truyền được qua văn bản, như SOP và thông số kỹ thuật, và tồn tại độc lập với người tạo ra; tacit knowledge nằm trong kinh nghiệm, kỹ năng và phán đoán cá nhân và không tồn tại độc lập với người mang nó." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Hai loại tri thức: explicit và tacit</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cùng là tri thức, nhưng khác nhau ở chỗ có tồn tại độc lập với con người hay không.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân biệt dựa trên Polanyi (1966) và Nonaka &amp; Takeuchi (1995) như bài viết nêu; ví dụ là ứng dụng thực tiễn cho doanh nghiệp sản xuất SME, không phải trích dẫn học thuật.</text><text x="60.0" y="629.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Explicit knowledge</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Diễn đạt và truyền qua văn bản, biểu đồ</text><rect x="84.0" y="218.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="245.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình vận hành chuẩn (SOP)</text><rect x="84.0" y="270.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="297.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thông số kỹ thuật sản phẩm</text><rect x="84.0" y="322.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="349.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tiêu chuẩn kiểm tra chất lượng</text><rect x="84.0" y="374.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="401.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy định an toàn lao động</text><line x1="84.0" y1="430.0" x2="564.0" y2="430.0" stroke="var(--p)" stroke-width="1"/><text x="84.0" y="456.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Tồn tại độc lập với người tạo ra nó.</text><rect x="612.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Tacit knowledge</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nằm trong kinh nghiệm, kỹ năng, phán đoán cá nhân</text><rect x="636.0" y="218.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="245.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phán đoán từ kinh nghiệm vận hành</text><rect x="636.0" y="270.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="297.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kỹ năng đánh giá cảm quan</text><rect x="636.0" y="322.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="349.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hiểu biết về con người và bối cảnh</text><rect x="636.0" y="374.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="401.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Xử lý tình huống phi chuẩn</text><line x1="636.0" y1="430.0" x2="1116.0" y2="430.0" stroke="var(--a)" stroke-width="1"/><text x="636.0" y="456.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Không tồn tại độc lập với người mang nó.</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khi người nắm giữ rời đi, explicit knowledge ở lại. Tacit knowledge đi theo.</text></svg>
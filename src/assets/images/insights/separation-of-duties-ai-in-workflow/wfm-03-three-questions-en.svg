<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three questions for each type of action: does it need an independent decision, what counts as a valid decision, and who executes after the decision; the third concerns access design and is most easily missed." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three questions for each type of action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Separation is decided for each type of action.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Does it need an</text><text x="122.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">independent decision?</text><text x="84.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Large consequences, hard to reverse,</text><text x="84.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">money, master data, compliance: usually</text><text x="84.0" y="300.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">yes. Small, reversible, within a clear rule:</text><text x="84.0" y="322.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">run under the rule.</text><rect x="427.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="170.0" r="15" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">What counts as a</text><text x="489.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">valid decision?</text><text x="451.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">An authorized person, the evidence</text><text x="451.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">seen, a reason, a time. Silence is</text><text x="451.0" y="300.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">not consent.</text><rect x="794.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Who executes after</text><text x="856.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">the decision?</text><text x="818.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Technically separate from the agent that</text><text x="818.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">prepared the file; no shared credentials.</text><rect x="818.0" y="390.0" width="135.3" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="885.7" y="406.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Most easily missed</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The first two belong to process design; the third to access design.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="The agent may read evidence sources, write results to the case file and label output as preparation; the agent may not write to business systems, approve its own output, edit rules or logs, or hold the credentials to execute." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="654" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Enforcing separation through access</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">An instruction protects nothing if the agent has the technical ability to act.</text><line x1="60.0" y1="592.0" x2="1140.0" y2="592.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="614.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="147.9" font-size="17" font-weight="700" fill="#5FA0FF" text-anchor="start">The agent may</text><text x="620.0" y="147.9" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="start">The agent may not</text><rect x="60.0" y="166.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="201.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Read evidence sources</text><rect x="60.0" y="238.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="273.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Write results to the case file</text><rect x="60.0" y="310.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="345.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Label output “prepared”, not “approved”</text><rect x="620.0" y="166.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="201.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Write to business systems</text><rect x="620.0" y="238.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="273.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Approve its own output</text><rect x="620.0" y="310.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="345.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Edit rules</text><rect x="620.0" y="382.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="417.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Edit or delete logs</text><rect x="620.0" y="454.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="489.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Hold credentials to execute</text><rect x="60.0" y="532.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="565.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">How tight depends on the risk of each process.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Đào tạo phần mềm trả lời câu hỏi làm thao tác này thế nào, còn change management trả lời vì sao tôi nên đổi và điều đó có ý nghĩa gì với tôi; câu hỏi thứ hai cần được trả lời trước." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="500" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Đào tạo phần mềm không phải change management</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi thứ hai cần được trả lời trước.</text><line x1="60.0" y1="416.0" x2="1140.0" y2="416.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="438.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="479.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="196.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Đào tạo phần mềm</text><text x="84.0" y="225.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">“Làm thao tác này thế nào?”</text><text x="84.0" y="262.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cần thiết, nhưng chưa đủ để tạo thay đổi hành vi bền vững.</text><rect x="612.0" y="134.0" width="528.0" height="196.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Change management</text><text x="636.0" y="225.1" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">“Vì sao tôi nên đổi, và điều đó có ý nghĩa gì</text><text x="636.0" y="252.7" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">với tôi?”</text><text x="636.0" y="290.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phải được trả lời trước.</text><rect x="1024.7" y="154.0" width="91.3" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1070.4" y="170.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Trả lời trước</text><rect x="60.0" y="346.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="379.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Biết cách làm mà không hiểu lý do thì không tạo được thay đổi bền vững.</text></svg>
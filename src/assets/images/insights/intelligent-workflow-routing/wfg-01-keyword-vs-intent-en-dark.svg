<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A hard rule routes an email by keyword such as refund or invoice; intelligent routing recognizes that two differently worded messages lead to the same kind of handling, even with no shared keyword." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Hard rules match keywords; intelligent routing reads intent</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">One intent can be worded many ways; keywords do not catch them all.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="60.0" y="134.0" width="520.0" height="300.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="84.0" y="171.1" font-size="20" font-weight="700" fill="#9AA6B8" text-anchor="start">Hard rule</text><rect x="402.3" y="148.0" width="153.7" height="24.0" rx="12.0" fill="#08090A" stroke="#9AA6B8" stroke-width="1.2"/><text x="479.1" y="164.4" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">Content-Based Router</text><rect x="84.0" y="204.0" width="220.0" height="56.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="194.0" y="237.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Contains "refund"</text><line x1="308.0" y1="232.0" x2="337.0" y2="232.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="346.0,232.0 337.0,236.9 337.0,227.1" fill="#5B6575"/><rect x="350.0" y="204.0" width="206.0" height="56.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="453.0" y="237.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Customer care</text><rect x="84.0" y="284.0" width="220.0" height="56.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="194.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Contains "invoice"</text><line x1="308.0" y1="312.0" x2="337.0" y2="312.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="346.0,312.0 337.0,316.9 337.0,307.1" fill="#5B6575"/><rect x="350.0" y="284.0" width="206.0" height="56.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="453.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Accounting</text><rect x="84.0" y="366.0" width="472.0" height="54.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4"/><text x="320.0" y="398.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Worded differently from the keyword: the rule misses it</text><rect x="600.0" y="134.0" width="540.0" height="300.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="624.0" y="171.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Intelligent routing</text><rect x="958.5" y="148.0" width="157.5" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="1037.2" y="164.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Reads intent in context</text><rect x="624.0" y="204.0" width="280.0" height="56.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="764.0" y="236.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Cannot access my account after paying</text><line x1="908.0" y1="232.0" x2="937.0" y2="232.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="946.0,232.0 937.0,236.9 937.0,227.1" fill="#2B74F5"/><rect x="624.0" y="284.0" width="280.0" height="56.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="764.0" y="316.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">I want my money back</text><line x1="908.0" y1="312.0" x2="937.0" y2="312.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="946.0,312.0 937.0,316.9 937.0,307.1" fill="#2B74F5"/><rect x="950.0" y="204.0" width="166.0" height="136.0" rx="10" fill="#2B74F5"/><text x="1033.0" y="267.6" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Same kind</text><text x="1033.0" y="287.4" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">of handling</text><rect x="624.0" y="366.0" width="492.0" height="54.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="870.0" y="398.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Even with no keyword in common</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Intelligent routing does not replace routing logic; it changes how content is understood.</text></svg>
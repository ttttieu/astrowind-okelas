<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three limits of hard rules: one issue can be phrased many ways, one request can hold several issues, and rules go out of date; in return hard rules are fast, easy to understand and easy to audit." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three built-in limits of hard-rule routing</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Hard rules are not wrong: they only work when content matches what the rule anticipated.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#A78BFA"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">One issue, many phrasings</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">A customer writes "cannot access my</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">account after paying" instead of the</text><text x="84.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">"refund" keyword the rule looks for.</text><rect x="427.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">One request, several issues</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The rule must pick arbitrarily which</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">criterion to route by.</text><rect x="794.0" y="134.0" width="346.0" height="236.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#A78BFA"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="223.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Rules drift out of date</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Wording shifts with time, new products</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and new internal terms; someone has to</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">keep updating.</text><rect x="60.0" y="386.0" width="1080.0" height="70.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Strengths of hard rules</text><rect x="380.0" y="401.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="480.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Fast</text><rect x="594.0" y="401.0" width="240.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="714.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Easy to understand</text><rect x="848.0" y="401.0" width="240.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="968.0" y="426.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Easy to audit</text><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Systematically wrong: right on the exact script, wrong on every other variant.</text></svg>
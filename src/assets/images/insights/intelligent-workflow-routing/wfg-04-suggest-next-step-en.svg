<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" width="1200" height="576" role="img" aria-label="A new request is compared with previously handled cases, the system suggests the next step and the handler decides; two examples: a packaging-defect complaint and a recurring purchase request." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="576" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From routing to suggesting the next step</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A suggestion, not an automatic decision: the handler starts from historical data.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="60.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">A new request is classified</text><line x1="304.0" y1="176.0" x2="327.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="336.0,176.0 327.0,180.9 327.0,171.1" fill="var(--p)"/><rect x="340.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="460.0" y="171.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Compared with similar</text><text x="460.0" y="190.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">handled cases</text><line x1="584.0" y1="176.0" x2="607.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="616.0,176.0 607.0,180.9 607.0,171.1" fill="var(--p)"/><rect x="620.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--p)"/><text x="740.0" y="171.9" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Suggests the next</text><text x="740.0" y="190.3" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">handling step</text><line x1="864.0" y1="176.0" x2="887.0" y2="176.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="896.0,176.0 887.0,180.9 887.0,171.1" fill="var(--p)"/><rect x="900.0" y="134.0" width="240.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="1020.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The handler makes the final call</text><rect x="1002.6" y="238.0" width="137.4" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1071.3" y="253.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Illustrative example</text><rect x="60.0" y="268.0" width="530.0" height="140.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="82.0" y="301.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">A "packaging defect" complaint</text><text x="82.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Suggestion: most similar past cases were handled by approach X,</text><text x="82.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">with the usual handling time.</text><rect x="610.0" y="268.0" width="530.0" height="140.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="632.0" y="301.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">A purchase request matching a recurring pattern</text><text x="632.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Suggestion: the supplier and a reference price from the</text><text x="632.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">latest order.</text><rect x="60.0" y="424.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="457.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Shortens the context-gathering; the final decision stays with people.</text></svg>
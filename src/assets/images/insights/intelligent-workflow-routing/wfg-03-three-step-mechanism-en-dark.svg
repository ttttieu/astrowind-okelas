<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Three steps of intelligent routing: understand content by meaning, match against known categories or cases, and separate the issues within one request; it can still be wrong on ambiguous or unseen cases." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="580" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">How intelligent routing works in three steps</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">An upgrade to understanding content, placed before the routing logic.</text><line x1="60.0" y1="518.0" x2="1140.0" y2="518.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="540.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Understand content by meaning</text><text x="84.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Not just by which keywords appear.</text><line x1="408.0" y1="170.0" x2="419.0" y2="170.0" stroke="#2B74F5" stroke-width="2"/><polygon points="425.0,170.0 419.0,173.3 419.0,166.7" fill="#2B74F5"/><rect x="427.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Match to known categories</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">or cases</text><text x="451.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Based on similarity of meaning, not</text><text x="451.0" y="304.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">just wording.</text><line x1="775.0" y1="170.0" x2="786.0" y2="170.0" stroke="#2B74F5" stroke-width="2"/><polygon points="792.0,170.0 786.0,173.3 786.0,166.7" fill="#2B74F5"/><rect x="794.0" y="134.0" width="346.0" height="200.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Separate each issue in</text><text x="818.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">one request</text><text x="818.0" y="285.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Identify and split them rather than forcing a</text><text x="818.0" y="304.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">single category.</text><rect x="60.0" y="350.0" width="1080.0" height="84.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="383.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Not the same as perfect accuracy</text><text x="84.0" y="411.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">It can still misclassify truly ambiguous or never-seen cases.</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Unlike hard rules, it can handle variants never programmed, if close enough in meaning.</text></svg>
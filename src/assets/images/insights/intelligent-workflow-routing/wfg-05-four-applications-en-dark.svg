<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Four applications: classifying customer complaints, routing internal support requests, classifying supplier emails, and routing equipment maintenance requests." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four applications in operations</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The biggest value is not faster classification.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Illustrative example</text><rect x="60.0" y="156.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="191.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Customer complaints</text><rect x="395.0" y="170.0" width="175.0" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="482.5" y="186.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Classify · suggest priority</text><text x="82.0" y="228.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Tell quality, delivery and payment issues apart by content, with a</text><text x="82.0" y="249.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">priority hint from the customer’s history.</text><rect x="610.0" y="156.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="191.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Internal support requests</text><rect x="973.5" y="170.0" width="146.5" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="1046.8" y="186.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Route · split requests</text><text x="632.0" y="228.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Send to IT or equipment maintenance, or split in two if it</text><text x="632.0" y="249.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">concerns both.</text><rect x="60.0" y="306.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="82.0" y="341.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Supplier emails</text><rect x="459.4" y="320.0" width="110.6" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="514.7" y="336.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Classify · route</text><text x="82.0" y="378.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Order confirmation, delay notice or price change: each needs a</text><text x="82.0" y="399.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">different handler.</text><rect x="610.0" y="306.0" width="530.0" height="136.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="632.0" y="341.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Maintenance requests</text><rect x="930.9" y="320.0" width="189.1" height="24.0" rx="12.0" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.2"/><text x="1025.5" y="336.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Suggest from past incidents</text><text x="632.0" y="378.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Link free-text symptoms such as a strange noise to past incidents</text><text x="632.0" y="399.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">to suggest a likely fault type.</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Fewer times a request is read and handed over before it reaches the right person.</text></svg>
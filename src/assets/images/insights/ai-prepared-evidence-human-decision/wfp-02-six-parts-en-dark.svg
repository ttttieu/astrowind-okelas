<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Six parts of a good evidence file: the question to be decided, the relevant rule or policy, facts with sources, similar cases and outcomes, options and consequences, and what is unknown and facts pointing the other way; the sixth is the most important and most often left out." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="606" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Six parts of a good evidence file</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The sixth part is the most important and the most often left out.</text><line x1="60.0" y1="544.0" x2="1140.0" y2="544.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="566.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">The question to be decided</text><text x="84.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">What is decided, within what scope,</text><text x="84.0" y="260.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">by when.</text><rect x="427.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">The relevant rule or policy</text><text x="451.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Which rule applies, why the case is outside</text><text x="451.0" y="260.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">it, who issued it.</text><rect x="794.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="856.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Facts, with sources</text><text x="818.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Each fact says where it came from:</text><text x="818.0" y="260.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">contract, system, email.</text><rect x="60.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="344.0" r="15" fill="#2B74F5"/><text x="94.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Similar cases and outcomes</text><text x="84.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">How similar, where they differ, what</text><text x="84.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">happened after.</text><rect x="427.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="344.0" r="15" fill="#2B74F5"/><text x="461.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="489.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Options and consequences</text><text x="451.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Feasible directions with evidenced</text><text x="451.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">consequences, no answer.</text><rect x="794.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="344.0" r="15" fill="#A78BFA"/><text x="828.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="856.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">What is unknown, and facts</text><text x="856.0" y="369.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">the other way</text><text x="818.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Missing information, conflicting sources,</text><text x="818.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">cases with bad outcomes.</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The part hardest to include protects the decision the most.</text></svg>
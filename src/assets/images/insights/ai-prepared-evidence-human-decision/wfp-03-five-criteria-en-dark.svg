<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Five criteria for judging a file: traceable, complete and balanced, honest about certainty, readable in the time available, and does not conclude for the decision-maker." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="628" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Five criteria for judging a file</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">A good file helps the decision-maker; it does not think for them.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="132.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="164.0" r="15" fill="#2B74F5"/><text x="96.0" y="169.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="136.0" y="170.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Traceable</text><text x="506.0" y="169.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Each fact leads to its source, openable in seconds.</text><rect x="60.0" y="206.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="238.0" r="15" fill="#2B74F5"/><text x="96.0" y="243.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="136.0" y="244.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Complete and balanced</text><text x="506.0" y="243.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Facts for and against each option.</text><rect x="60.0" y="280.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="312.0" r="15" fill="#2B74F5"/><text x="96.0" y="317.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="136.0" y="318.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Honest about certainty</text><text x="506.0" y="317.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Separates what is confirmed, inferred and unknown.</text><rect x="60.0" y="354.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="386.0" r="15" fill="#2B74F5"/><text x="96.0" y="391.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="136.0" y="392.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Readable in the time available</text><text x="506.0" y="391.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Short enough to read, complete enough to verify.</text><rect x="60.0" y="428.0" width="1080.0" height="64.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="96.0" cy="460.0" r="15" fill="#A78BFA"/><text x="96.0" y="465.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="136.0" y="466.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Does not conclude for them</text><text x="506.0" y="465.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Sets out options and consequences, not a “choose this” answer.</text><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The measure: decides faster and can still explain the reason in their own words.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Six parts of a good evidence file: the question to be decided, the relevant rule or policy, facts with sources, similar cases and outcomes, options and consequences, and what is unknown and facts pointing the other way; the sixth is the most important and most often left out." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six parts of a good evidence file</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The sixth part is the most important and the most often left out.</text><line x1="60.0" y1="544.0" x2="1140.0" y2="544.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="566.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="158.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="171.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The question to be decided</text><text x="84.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What is decided, within what scope,</text><text x="84.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">by when.</text><rect x="427.0" y="134.0" width="346.0" height="158.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="171.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The relevant rule or policy</text><text x="451.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Which rule applies, why the case is outside</text><text x="451.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">it, who issued it.</text><rect x="794.0" y="134.0" width="346.0" height="158.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="171.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Facts, with sources</text><text x="818.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Each fact says where it came from:</text><text x="818.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">contract, system, email.</text><rect x="60.0" y="308.0" width="346.0" height="158.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="344.0" r="15" fill="var(--p)"/><text x="94.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="122.0" y="345.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Similar cases and outcomes</text><text x="84.0" y="415.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">How similar, where they differ, what</text><text x="84.0" y="434.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">happened after.</text><rect x="427.0" y="308.0" width="346.0" height="158.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="344.0" r="15" fill="var(--p)"/><text x="461.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="489.0" y="345.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Options and consequences</text><text x="451.0" y="415.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Feasible directions with evidenced</text><text x="451.0" y="434.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">consequences, no answer.</text><rect x="794.0" y="308.0" width="346.0" height="158.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="344.0" r="15" fill="var(--a)"/><text x="828.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="856.0" y="345.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">What is unknown, and facts</text><text x="856.0" y="369.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">the other way</text><text x="818.0" y="415.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Missing information, conflicting sources,</text><text x="818.0" y="434.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cases with bad outcomes.</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The part hardest to include protects the decision the most.</text></svg>
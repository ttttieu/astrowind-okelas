<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Three clause cards, 9.3.1, 9.3.2 and 9.3.3, in a row, with a note box below about frequency." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Clause 9.3 describes a decision meeting, not a report</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Clause 9.3 asks top management to review the QMS and decide on improvements and resources.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Clauses 9.3.1–9.3.3 per the article, paraphrased; the article sets no fixed frequency.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="82.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">9.3.1</text><text x="82.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Top management reviews to confirm</text><text x="82.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">the QMS stays suitable, adequate,</text><text x="82.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">effective and aligned.</text><rect x="430.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="452.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">9.3.2</text><text x="452.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Planned inputs: prior actions,</text><text x="452.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">changes, trends, resources,</text><text x="452.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">risks, opportunities.</text><rect x="800.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">9.3.3</text><text x="822.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Outputs are decisions, actions,</text><text x="822.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">change needs and resources,</text><text x="822.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">with evidence.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">The standard sets no fixed frequency for the review.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The output of clause 9.3 is decisions, not a report.</text></svg>
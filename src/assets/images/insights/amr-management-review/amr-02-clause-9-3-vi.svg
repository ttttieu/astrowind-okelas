<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba thẻ điều khoản 9.3.1, 9.3.2 và 9.3.3 xếp hàng ngang, bên dưới là một khung ghi chú về tần suất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 9.3 là cuộc họp ra quyết định, không báo cáo</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 9.3 yêu cầu lãnh đạo cao nhất xem xét hệ thống để ra quyết định và hành động.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 9.3.1–9.3.3 theo bài viết, diễn đạt lại; bài không quy định tần suất cố định.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="82.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">9.3.1</text><text x="82.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Lãnh đạo cao nhất xem xét để xác</text><text x="82.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">nhận hệ thống còn phù hợp, đủ, hiệu</text><text x="82.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">lực và đúng định hướng.</text><rect x="430.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="452.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">9.3.2</text><text x="452.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Đầu vào theo kế hoạch: hành động</text><text x="452.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">cũ, thay đổi, xu hướng, nguồn lực, rủi</text><text x="452.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">ro, cơ hội.</text><rect x="800.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">9.3.3</text><text x="822.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Đầu ra là quyết định, hành động,</text><text x="822.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">nhu cầu thay đổi và nguồn lực,</text><text x="822.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">có bằng chứng.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Tiêu chuẩn không quy định tần suất cố định cho cuộc xem xét.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đầu ra của điều khoản 9.3 là quyết định, không phải báo cáo.</text></svg>
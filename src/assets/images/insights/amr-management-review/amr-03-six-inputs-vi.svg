<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 614" width="1200" height="614" role="img" aria-label="Sáu thẻ đầu vào xếp thành lưới ba cột, bên dưới là một thanh đầu ra theo điều khoản 9.3.3." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="614" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu đầu vào của điều khoản 9.3.2 cần chuẩn bị trước</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 9.3.2 liệt kê đầu vào; chuẩn bị đủ thì cuộc họp mới có nội dung để quyết.</text><line x1="60.0" y1="530.0" x2="1140.0" y2="530.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="552.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu đầu vào theo điều khoản 9.3.2 và bài viết; cách nhóm thành lưới là của OKELAS.</text><text x="60.0" y="593.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="230.0" y="201.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Hành động trước đó</text><rect x="430.0" y="160.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="201.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Thay đổi bối cảnh</text><rect x="800.0" y="160.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="970.0" y="201.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Xu hướng hiệu suất</text><rect x="60.0" y="246.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="230.0" y="287.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Nguồn lực đủ không</text><rect x="430.0" y="246.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="287.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Hiệu lực của rủi ro</text><rect x="800.0" y="246.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="970.0" y="287.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Cơ hội cải tiến</text><rect x="60.0" y="348.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="382.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Đầu ra (9.3.3): quyết định, hành động, nhu cầu thay đổi và nguồn lực.</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đầu vào được chuẩn bị trước giúp cuộc họp có nội dung để quyết định.</text></svg>
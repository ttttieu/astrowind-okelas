<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="The official system such as an ERP is implemented and still running while operations happen elsewhere: production plans by email and Excel, urgent orders in a separate sheet, batch status by messaging, QC results in their own Excel file." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The ERP still runs, but operations happen elsewhere</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The official system works, but daily work runs on spreadsheets, email and messages.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Composite illustrative scenarios from the article, not measured data or a specific organization.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="360.0" height="300.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">The official system</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP, management software</text><rect x="84.0" y="218.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="249.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Implementation complete</text><rect x="84.0" y="280.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="311.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Employees trained</text><rect x="84.0" y="342.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Still running</text><rect x="480.0" y="134.0" width="660.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="504.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Operational reality</text><text x="504.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Happening somewhere else</text><rect x="504.0" y="218.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="245.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Weekly production plan: sent by email, each person saves their own Excel copy</text><rect x="504.0" y="270.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="297.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Urgent orders: a sheet updated by hand every morning</text><rect x="504.0" y="322.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="349.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Batch status: asked through messaging apps, compiled into an email</text><rect x="504.0" y="374.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="401.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">QC results: the QC team’s own Excel file</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The ERP still runs. But operations are happening somewhere else.</text></svg>
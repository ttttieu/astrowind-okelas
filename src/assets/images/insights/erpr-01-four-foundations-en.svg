<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="ERP, which is process-driven, stands on four organizational foundations: clear processes, clean data, people willing to change and governance with clear responsibility; without them ERP amplifies disorder." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP stands on four organizational foundations</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The question of which software to choose comes after these foundations are in place.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="78.0" rx="16" fill="var(--ink)"/><text x="600.0" y="174.2" font-size="28" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP</text><text x="600.0" y="195.1" font-size="14" font-weight="400" fill="var(--onink)" text-anchor="middle">ERP is process-driven</text><line x1="189.0" y1="240.0" x2="189.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="189.0,216.0 193.9,225.0 184.1,225.0" fill="var(--gm)"/><rect x="60.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Processes</text><text x="80.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Clear and consistent enough</text><text x="80.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">to configure</text><line x1="463.0" y1="240.0" x2="463.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="463.0,216.0 467.9,225.0 458.1,225.0" fill="var(--gm)"/><rect x="334.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="354.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Data</text><text x="354.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Clean enough that reports</text><text x="354.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">are trusted</text><line x1="737.0" y1="240.0" x2="737.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="737.0,216.0 742.0,225.0 732.0,225.0" fill="var(--gm)"/><rect x="608.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="628.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">People</text><text x="628.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Willing to change how</text><text x="628.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">they work</text><line x1="1011.0" y1="240.0" x2="1011.0" y2="225.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="1011.0,216.0 1016.0,225.0 1006.0,225.0" fill="var(--gm)"/><rect x="882.0" y="242.0" width="258.0" height="112.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="902.0" y="283.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Governance</text><text x="902.0" y="312.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Someone decides and</text><text x="902.0" y="332.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">takes responsibility</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without these foundations, ERP amplifies existing disorder, and fixing it costs more.</text></svg>
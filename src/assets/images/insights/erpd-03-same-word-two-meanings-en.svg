<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="The same word carries two definitions: inventory in the warehouse includes goods in transit while accounting counts only goods received; a customer in the sales system includes prospects while ERP needs only entities with transaction history." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="534" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The same word, two definitions</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">If not settled before migration, the problem shows only when reports produce numbers no one trusts.</text><line x1="60.0" y1="450.0" x2="1140.0" y2="450.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="472.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Examples from the article, not measured data.</text><text x="60.0" y="513.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="108.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="196.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Inventory</text><rect x="290.0" y="146.0" width="400.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="310.0" y="169.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Warehouse</text><text x="310.0" y="196.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Counts goods in transit</text><rect x="722.0" y="146.0" width="400.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="742.0" y="169.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Accounting</text><text x="742.0" y="196.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Counts only goods actually received</text><text x="676.0" y="199.6" font-size="32" font-weight="700" fill="var(--mut)" text-anchor="middle">≠</text><rect x="60.0" y="256.0" width="1080.0" height="108.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="318.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Customer</text><rect x="290.0" y="268.0" width="400.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="310.0" y="291.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Sales system</text><text x="310.0" y="318.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Includes prospects</text><rect x="722.0" y="268.0" width="400.0" height="84.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="742.0" y="291.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">ERP</text><text x="742.0" y="318.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Needs only entities with transaction history</text><text x="676.0" y="321.6" font-size="32" font-weight="700" fill="var(--mut)" text-anchor="middle">≠</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If not settled first, data enters ERP in a form no one fully understands.</text></svg>
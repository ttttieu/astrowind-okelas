<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" role="img" aria-label="Bốn chi phí ẩn của chuẩn bị dữ liệu kém: kéo dài timeline, quyết định dựa trên dữ liệu sai, sửa sau go-live đắt hơn và mất niềm tin vào hệ thống, là chi phí khó phục hồi nhất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="502" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn chi phí ẩn của việc chuẩn bị dữ liệu kém</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Vấn đề dữ liệu hiếm khi xuất hiện như một rủi ro có tên; nó hiện ra dưới dạng các chi phí khác.</text><line x1="60.0" y1="418.0" x2="1140.0" y2="418.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="440.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chi phí theo phân tích trong bài viết, không phải số liệu đo lường.</text><text x="60.0" y="481.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="80.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kéo dài timeline</text><text x="80.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Làm sạch lâu hơn dự kiến làm</text><text x="80.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lùi go-live, kéo theo chi phí</text><text x="80.0" y="275.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhân sự, triển khai và cơ hội.</text><rect x="334.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="354.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định dựa trên</text><text x="354.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">dữ liệu sai</text><text x="354.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Báo cáo sai khiến lãnh đạo</text><text x="354.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quay về cách cũ hoặc</text><text x="354.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ra quyết định sai.</text><rect x="608.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="628.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sửa sau go-live đắt hơn</text><text x="628.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Bản ghi lỗi có thể đã được dùng</text><text x="628.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trong nhiều giao dịch thật.</text><rect x="882.0" y="134.0" width="258.0" height="197.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="902.0" y="150.0" width="128.6" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="966.3" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Khó phục hồi nhất</text><text x="902.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Mất niềm tin</text><text x="902.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">vào hệ thống</text><text x="902.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Người dùng ngừng dùng ERP để</text><text x="902.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ra quyết định; cả dữ liệu lẫn</text><text x="902.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">niềm tin đều khó dựng lại.</text><rect x="60.0" y="347.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="380.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chi phí chuẩn bị dữ liệu luôn có; câu hỏi là trả trước go-live hay sau go-live.</text></svg>
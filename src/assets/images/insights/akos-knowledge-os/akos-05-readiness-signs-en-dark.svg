<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Eight sign cards in a two-column grid, with a threshold bar below and the prerequisite marked." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#08090A;--tx:#1E2A3E;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#08090A;--wh:#08090A;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#1E2A3E;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Eight signs for when a knowledge layer merits thought</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article offers eight self-check signs; this is not a diagnostic threshold.</text><line x1="60.0" y1="596.0" x2="1140.0" y2="596.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="618.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Eight signs per the article; the three-sign threshold is the article’s suggestion, not a diagnosis.</text><text x="60.0" y="659.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="188.0" r="15" fill="var(--gm)"/><text x="90.0" y="193.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="192.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Concern about knowledge loss when key people leave</text><rect x="60.0" y="226.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="254.0" r="15" fill="var(--gm)"/><text x="90.0" y="259.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="116.0" y="258.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">“Why” questions answered by only one person</text><rect x="60.0" y="292.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="320.0" r="15" fill="var(--gm)"/><text x="90.0" y="325.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="324.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">New staff take months to work independently</text><rect x="60.0" y="358.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="386.0" r="15" fill="var(--gm)"/><text x="90.0" y="391.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="116.0" y="390.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">The same problem recurs in different places</text><rect x="612.0" y="160.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="642.0" cy="188.0" r="15" fill="var(--gm)"/><text x="642.0" y="193.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="668.0" y="192.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Good records, but no one sees patterns across events</text><rect x="612.0" y="226.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="642.0" cy="254.0" r="15" fill="var(--gm)"/><text x="642.0" y="259.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="668.0" y="258.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Wish to use AI, worried about missing context</text><rect x="612.0" y="292.0" width="528.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><circle cx="642.0" cy="320.0" r="15" fill="var(--p)"/><text x="642.0" y="325.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="668.0" y="324.8" font-size="15" font-weight="700" fill="var(--a)" text-anchor="start">eQMS processes and evidence are relatively stable</text><rect x="612.0" y="358.0" width="528.0" height="56.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="642.0" cy="386.0" r="15" fill="var(--gm)"/><text x="642.0" y="391.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="668.0" y="390.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Generic AI answers fluently but does not know</text><text x="668.0" y="409.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">the business</text><rect x="60.0" y="430.0" width="1080.0" height="50.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="460.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Three or more signs: consider a knowledge layer; sign 7 is a prerequisite.</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If eQMS is not yet stable, strengthen it first.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 614" width="1200" height="614" role="img" aria-label="Chuỗi bảy bước: bốn bước đầu thuộc eQMS, ba bước sau thuộc hướng phát triển Knowledge OS; bên dưới là thanh ghi chú." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="614" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ eQMS mở rộng thành tầng tri thức và quyết định</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chuỗi mở rộng từ eQMS sang tri thức, quyết định và hành động; đây là hướng phát triển.</text><line x1="60.0" y1="530.0" x2="1140.0" y2="530.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="552.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chuỗi mở rộng theo bài viết; đây là hướng phát triển, không phải danh sách tính năng.</text><text x="60.0" y="593.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="175.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">eQMS</text><text x="684.0" y="175.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Knowledge OS (hướng phát triển)</text><rect x="60.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="128.0" y="242.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Process</text><line x1="198.0" y1="237.0" x2="206.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="214.0,237.0 206.0,241.4 206.0,232.6" fill="var(--gm)"/><rect x="216.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="284.0" y="242.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow</text><line x1="354.0" y1="237.0" x2="362.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="370.0,237.0 362.0,241.4 362.0,232.6" fill="var(--gm)"/><rect x="372.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="440.0" y="242.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Event</text><line x1="510.0" y1="237.0" x2="518.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="526.0,237.0 518.0,241.4 518.0,232.6" fill="var(--gm)"/><rect x="528.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="596.0" y="242.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Evidence</text><line x1="666.0" y1="237.0" x2="674.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="682.0,237.0 674.0,241.4 674.0,232.6" fill="var(--gm)"/><rect x="684.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="752.0" y="242.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Knowledge</text><line x1="822.0" y1="237.0" x2="830.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="838.0,237.0 830.0,241.4 830.0,232.6" fill="var(--gm)"/><rect x="840.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="908.0" y="242.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Decision</text><line x1="978.0" y1="237.0" x2="986.0" y2="237.0" stroke="var(--gm)" stroke-width="3"/><polygon points="994.0,237.0 986.0,241.4 986.0,232.6" fill="var(--gm)"/><rect x="996.0" y="192.0" width="136.0" height="90.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="1064.0" y="242.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Action</text><rect x="60.0" y="320.0" width="1080.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="352.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Đây là hướng phát triển, không phải cam kết tính năng.</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tri thức, quyết định và hành động là phần nối tiếp, không thay thế eQMS.</text></svg>
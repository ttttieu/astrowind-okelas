<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-label="Năm thẻ khoảng trống xếp dọc, bên dưới là một thanh nhận định về phần eQMS đã làm tốt." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#08090A;--tx:#1E2A3E;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#08090A;--wh:#08090A;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#1E2A3E;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="710" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm khoảng trống mà eQMS chưa giải quyết</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">eQMS đã tốt ở kiểm soát, truy vết và bằng chứng; năm điểm này nằm ngoài phạm vi đó.</text><line x1="60.0" y1="626.0" x2="1140.0" y2="626.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="648.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Năm khoảng trống theo bài viết, diễn đạt lại; điều khoản 7.1.6 theo bài viết.</text><text x="60.0" y="689.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="1080.0" height="50.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><circle cx="92.0" cy="185.0" r="15" fill="var(--p)"/><text x="92.0" y="190.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="190.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Tri thức ngầm chưa được ghi lại</text><rect x="60.0" y="220.0" width="1080.0" height="50.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="92.0" cy="245.0" r="15" fill="var(--gm)"/><text x="92.0" y="250.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="124.0" y="250.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi “vì sao” đằng sau quy trình</text><rect x="60.0" y="280.0" width="1080.0" height="50.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="92.0" cy="305.0" r="15" fill="var(--gm)"/><text x="92.0" y="310.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="124.0" y="310.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi về quan hệ và tác động của thay đổi</text><rect x="60.0" y="340.0" width="1080.0" height="50.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="92.0" cy="365.0" r="15" fill="var(--gm)"/><text x="92.0" y="370.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="124.0" y="370.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Học từ nhiều sự kiện qua thời gian</text><rect x="60.0" y="400.0" width="1080.0" height="50.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="92.0" cy="425.0" r="15" fill="var(--gm)"/><text x="92.0" y="430.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="124.0" y="430.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi chưa được thiết kế trước</text><rect x="60.0" y="476.0" width="1080.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="508.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">eQMS đã làm tốt kiểm soát, truy vết và bằng chứng; đây là phần còn thiếu.</text><rect x="60.0" y="556.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="589.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">eQMS có thể là điểm đến đúng cho nhiều doanh nghiệp.</text></svg>
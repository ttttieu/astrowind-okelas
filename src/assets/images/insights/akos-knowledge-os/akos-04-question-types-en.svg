<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Four question-type cards in a row, each with a sample question." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four question types quality records can help answer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article’s four question types; quality records already hold raw material for them.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four question types per the article; arranging them as four cards is OKELAS’s presentation.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="255.0" height="180.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><circle cx="90.0" cy="204.0" r="15" fill="var(--p)"/><text x="90.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="256.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Context</text><text x="80.0" y="299.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Under what conditions does</text><text x="80.0" y="319.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">this happen?</text><rect x="335.0" y="170.0" width="255.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="365.0" cy="204.0" r="15" fill="var(--gm)"/><text x="365.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="256.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">History and cause</text><text x="355.0" y="299.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Why was it done this</text><text x="355.0" y="319.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">way before?</text><rect x="610.0" y="170.0" width="255.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="640.0" cy="204.0" r="15" fill="var(--gm)"/><text x="640.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="256.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Relationships</text><text x="630.0" y="299.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">What does this</text><text x="630.0" y="319.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">change affect?</text><rect x="885.0" y="170.0" width="255.0" height="180.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="915.0" cy="204.0" r="15" fill="var(--gm)"/><text x="915.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="905.0" y="256.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Lessons</text><text x="905.0" y="299.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">What have events taught us?</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quality records hold raw material; what is missing is a queryable network.</text></svg>
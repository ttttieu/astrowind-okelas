<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Năm cấp độ số hóa của doanh nghiệp sản xuất, từ giấy tờ đến vận hành có AI hỗ trợ"><style>
  :root{--p:1 97 239;--s:1 84 207;--a:109 40 217;--bg:255 255 255;--tx:0 0 0;--mut:16 16 16;--line:16 16 16}
  @media (prefers-color-scheme: dark){:root{--bg:8 9 10;--tx:247 248 248;--mut:229 236 246;--line:229 236 246}}
  text{font-family:Inter,Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
  .bg{fill:rgb(var(--bg))}
  .title{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .big{font-size:50px;font-weight:700;fill:rgb(var(--tx))}
  .subtitle{font-size:17px;fill:rgb(var(--mut)/.66)}
  .term{font-size:16px;font-weight:700;fill:rgb(var(--tx))}
  .h2{font-size:19px;font-weight:700;fill:rgb(var(--tx))}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:rgb(var(--mut)/.66)}
  .desc{font-size:13.5px;fill:rgb(var(--mut)/.85)}
  .body{font-size:14.5px;fill:rgb(var(--mut)/.88)}
  .mut{font-size:13px;fill:rgb(var(--mut)/.66)}
  .val{font-size:15px;font-weight:600;fill:rgb(var(--tx))}
  .foot{font-size:13px;fill:rgb(var(--mut)/.5)}
  .chip{font-size:12px;font-weight:700;letter-spacing:.06em}
  .g1 .box{fill:rgb(var(--p)/.08);stroke:rgb(var(--p))}
  .g2 .box{fill:rgb(var(--s)/.12);stroke:rgb(var(--s))}
  .g3 .box{fill:rgb(var(--a)/.09);stroke:rgb(var(--a))}
  .g1 .bar{fill:rgb(var(--p))}.g2 .bar{fill:rgb(var(--s))}.g3 .bar{fill:rgb(var(--a))}
  .g1 .acc{fill:rgb(var(--p))}.g2 .acc{fill:rgb(var(--s))}.g3 .acc{fill:rgb(var(--a))}
  .box{stroke-width:1.5}
  .card{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .soft{fill:rgb(var(--line)/.05)}
  .ghost{fill:rgb(var(--line)/.22)}
  .rule{stroke:rgb(var(--line)/.45);stroke-width:2;fill:none}
  .ring{stroke:rgb(var(--line)/.18);stroke-width:1;fill:none}
  .axis{stroke:rgb(var(--line)/.18);stroke-width:1}
  .poly{fill:rgb(var(--p)/.18);stroke:rgb(var(--p));stroke-width:2.5;stroke-linejoin:round}
  .dot{fill:rgb(var(--p));stroke:rgb(var(--bg));stroke-width:2}
  .ah{fill:rgb(var(--line)/.45)}
  .chipbox{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .chiptx{fill:rgb(var(--a))}
  .blue{fill:rgb(var(--p))}.purp{fill:rgb(var(--a))}
  .ok{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .pr{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .final{fill:rgb(var(--tx));}
  .finaltx{font-size:18px;font-weight:700;fill:rgb(var(--bg))}
  @media (prefers-color-scheme: dark){
    .g1 .box{fill:rgb(var(--p)/.18)}.g2 .box{fill:rgb(var(--s)/.22)}.g3 .box{fill:rgb(var(--a)/.2)}
    .chiptx{fill:rgb(167 139 250)}.chipbox{stroke:rgb(167 139 250)}.purp{fill:rgb(167 139 250)}.pr{stroke:rgb(167 139 250)}
    .g3 .acc{fill:rgb(167 139 250)}
  }
</style><rect class="bg" width="1200" height="700"/>
<text class="title" x="60" y="78" text-anchor="start">Năm cấp độ số hóa của doanh nghiệp sản xuất</text>
<text class="subtitle" x="60" y="110" text-anchor="start">Mỗi cấp độ xây trên cấp độ trước, không cần đi hết cả năm bậc</text>
<g class="g1"><rect class="box" x="61.0" y="390" width="206" height="240" rx="12"/><rect class="bar" x="61.0" y="390" width="206" height="6" rx="3"/>
<text class="lbl" x="77.0" y="420" text-anchor="start">CẤP ĐỘ 1</text>
<text class="term" x="77.0" y="446" text-anchor="start">Vận hành</text>
<text class="term" x="77.0" y="467" text-anchor="start">bằng giấy</text>
<text class="desc" x="77.0" y="493" text-anchor="start">Quy trình thủ công,</text>
<text class="desc" x="77.0" y="511" text-anchor="start">hồ sơ giấy,</text>
<text class="desc" x="77.0" y="529" text-anchor="start">khó tìm kiếm</text>
<line class="axis" x1="77.0" y1="550" x2="251.0" y2="550"/>
<text class="lbl" x="77.0" y="564" text-anchor="start">BƯỚC TIẾP THEO</text>
<text class="desc" x="77.0" y="582" text-anchor="start">Số hóa hồ sơ quan trọng</text>
<text class="desc" x="77.0" y="600" text-anchor="start">thành dạng tìm kiếm được</text>
</g>
<g class="g1"><rect class="box" x="279.0" y="345" width="206" height="285" rx="12"/><rect class="bar" x="279.0" y="345" width="206" height="6" rx="3"/>
<text class="lbl" x="295.0" y="375" text-anchor="start">CẤP ĐỘ 2</text>
<text class="term" x="295.0" y="401" text-anchor="start">Tài liệu số</text>
<text class="term" x="295.0" y="422" text-anchor="start">nhưng rải rác</text>
<text class="desc" x="295.0" y="448" text-anchor="start">File Word, Excel, PDF</text>
<text class="desc" x="295.0" y="466" text-anchor="start">nhưng chưa có</text>
<text class="desc" x="295.0" y="484" text-anchor="start">cấu trúc</text>
<line class="axis" x1="295.0" y1="550" x2="469.0" y2="550"/>
<text class="lbl" x="295.0" y="564" text-anchor="start">BƯỚC TIẾP THEO</text>
<text class="desc" x="295.0" y="582" text-anchor="start">Xây hệ thống quản lý</text>
<text class="desc" x="295.0" y="600" text-anchor="start">tài liệu, có kiểm soát</text>
<text class="desc" x="295.0" y="618" text-anchor="start">phiên bản</text>
</g>
<g class="g2"><rect class="box" x="497.0" y="300" width="206" height="330" rx="12"/><rect class="bar" x="497.0" y="300" width="206" height="6" rx="3"/>
<text class="lbl" x="513.0" y="330" text-anchor="start">CẤP ĐỘ 3</text>
<text class="term" x="513.0" y="356" text-anchor="start">Workflow</text>
<text class="term" x="513.0" y="377" text-anchor="start">qua hệ thống</text>
<text class="desc" x="513.0" y="403" text-anchor="start">Quy trình chạy qua</text>
<text class="desc" x="513.0" y="421" text-anchor="start">hệ thống, hồ sơ</text>
<text class="desc" x="513.0" y="439" text-anchor="start">được tạo tự động</text>
<line class="axis" x1="513.0" y1="550" x2="687.0" y2="550"/>
<text class="lbl" x="513.0" y="564" text-anchor="start">BƯỚC TIẾP THEO</text>
<text class="desc" x="513.0" y="582" text-anchor="start">Tích hợp các hệ thống,</text>
<text class="desc" x="513.0" y="600" text-anchor="start">chuẩn hóa dữ liệu</text>
</g>
<g class="g3"><rect class="box" x="715.0" y="250" width="206" height="380" rx="12"/><rect class="bar" x="715.0" y="250" width="206" height="6" rx="3"/>
<text class="lbl" x="731.0" y="280" text-anchor="start">CẤP ĐỘ 4</text>
<text class="term" x="731.0" y="306" text-anchor="start">Tích hợp và dữ liệu</text>
<text class="term" x="731.0" y="327" text-anchor="start">phân tích được</text>
<text class="desc" x="731.0" y="353" text-anchor="start">Các hệ thống liên kết,</text>
<text class="desc" x="731.0" y="371" text-anchor="start">dữ liệu dùng được</text>
<text class="desc" x="731.0" y="389" text-anchor="start">để ra quyết định</text>
<line class="axis" x1="731.0" y1="550" x2="905.0" y2="550"/>
<text class="lbl" x="731.0" y="564" text-anchor="start">BƯỚC TIẾP THEO</text>
<text class="desc" x="731.0" y="582" text-anchor="start">Xây tri thức tổ chức</text>
<text class="desc" x="731.0" y="600" text-anchor="start">làm nền cho AI</text>
</g>
<g class="g3"><rect class="box" x="933.0" y="200" width="206" height="430" rx="12"/><rect class="bar" x="933.0" y="200" width="206" height="6" rx="3"/>
<text class="lbl" x="949.0" y="230" text-anchor="start">CẤP ĐỘ 5</text>
<text class="term" x="949.0" y="256" text-anchor="start">AI hỗ trợ</text>
<text class="term" x="949.0" y="277" text-anchor="start">vận hành</text>
<text class="desc" x="949.0" y="303" text-anchor="start">AI tham gia như một</text>
<text class="desc" x="949.0" y="321" text-anchor="start">thành viên trong quy</text>
<text class="desc" x="949.0" y="339" text-anchor="start">trình, không chỉ công cụ</text>
<line class="axis" x1="949.0" y1="550" x2="1123.0" y2="550"/>
<text class="lbl" x="949.0" y="564" text-anchor="start">LƯU Ý</text>
<text class="desc" x="949.0" y="582" text-anchor="start">Mức cao nhất, không</text>
<text class="desc" x="949.0" y="600" text-anchor="start">bắt buộc với mọi</text>
<text class="desc" x="949.0" y="618" text-anchor="start">doanh nghiệp</text>
</g>
<text class="foot" x="60" y="676" text-anchor="start">okelas.com</text>
</svg>
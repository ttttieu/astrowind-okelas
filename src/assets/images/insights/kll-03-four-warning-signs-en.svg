<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Four signs of dependence on individual knowledge: the answer is ask A, new employees take months to work independently, audit preparation is a scramble for information, and one core absence disrupts operations." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four signs of dependence on individual knowledge</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not every business faces the same risk, but some signals are common.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Signs from the article, not survey data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">The answer to an important process question is “ask A”,</text><text x="122.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">not “check this document”.</text><rect x="606.0" y="134.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--a)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">New employees take many months to work</text><text x="668.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">independently, because every situation needs</text><text x="668.0" y="215.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">direct guidance.</text><rect x="60.0" y="258.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="294.0" r="15" fill="var(--a)"/><text x="94.0" y="299.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="294.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When an audit arrives, the team scrambles to collect</text><text x="122.0" y="316.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">information from people rather than from systems.</text><rect x="606.0" y="258.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="294.0" r="15" fill="var(--a)"/><text x="640.0" y="299.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="294.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When a core employee is suddenly absent,</text><text x="668.0" y="316.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">operations are disrupted: missing information, not</text><text x="668.0" y="339.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">missing headcount.</text><rect x="60.0" y="386.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="419.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">What they share: the problem is information held in one person’s head, not the number of staff.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Bốn điều kiện để SOP vận hành: phản ánh thực tế, tiếp cận được tại điểm thực hiện, không tuân thủ tạo ra phản hồi, và được duy trì sống." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn điều kiện để SOP thực sự vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Rút ra từ ba nguyên nhân và các đặc điểm của SOP được thực thi.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều kiện theo bài viết; công cụ thảo luận, không phải phương pháp luận được chứng nhận. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">SOP phản ánh thực tế</text><text x="122.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không phải lý tưởng, mà là điều thực sự cần xảy ra trong</text><text x="122.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">điều kiện vận hành thực tế.</text><rect x="606.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--p)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tiếp cận được tại điểm thực hiện</text><text x="668.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đúng thời điểm, đúng thiết bị, đúng dạng.</text><rect x="60.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="306.0" r="15" fill="var(--p)"/><text x="94.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="309.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Không tuân thủ tạo ra phản hồi</text><text x="122.0" y="337.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không nhất thiết là hình phạt, mà là cơ chế để người thực thi biết</text><text x="122.0" y="356.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">khi họ không tuân thủ.</text><rect x="606.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="306.0" r="15" fill="var(--p)"/><text x="640.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="309.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">SOP được duy trì sống</text><text x="668.0" y="337.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không viết một lần rồi để đó; được xem xét khi điều kiện thay đổi.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">SOP cần được thiết kế như công cụ vận hành, không chỉ như tài liệu compliance.</text></svg>
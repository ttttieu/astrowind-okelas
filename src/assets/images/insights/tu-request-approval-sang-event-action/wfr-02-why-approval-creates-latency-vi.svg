<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Ba lý do approval tạo độ trễ: là bước mặc định thay vì có điều kiện, phụ thuộc lịch người duyệt thay vì độ khẩn, và không phân biệt mức rủi ro." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao request/approval tạo độ trễ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Vấn đề không phải approval xấu, mà là áp dụng đồng loạt cho mọi trường hợp.</text><line x1="60.0" y1="462.0" x2="1140.0" y2="462.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="484.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="224.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Là bước mặc định, không phải</text><text x="84.0" y="250.2" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">bước có điều kiện</text><text x="84.0" y="300.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nhiều quy trình yêu cầu duyệt cho mọi</text><text x="84.0" y="321.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ca, kể cả ca lặp lại, giá trị thấp hoặc đã</text><text x="84.0" y="342.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có tiền lệ rõ ràng.</text><rect x="427.0" y="134.0" width="346.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="451.0" y="224.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Phụ thuộc lịch của người duyệt</text><text x="451.0" y="300.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Yêu cầu quan trọng và không quan trọng</text><text x="451.0" y="321.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có thể chờ như nhau nếu cùng nằm</text><text x="451.0" y="342.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trong hàng đợi của một người.</text><rect x="794.0" y="134.0" width="346.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="var(--a)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="818.0" y="224.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Không phân biệt mức rủi ro</text><text x="818.0" y="300.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Yêu cầu giá trị rất nhỏ và rất lớn có thể</text><text x="818.0" y="321.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">đi qua cùng một chuỗi duyệt.</text><rect x="60.0" y="402.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="435.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Approval cần cho quyết định có rủi ro; điều đáng sửa là biến nó thành hàng đợi không phân biệt.</text></svg>
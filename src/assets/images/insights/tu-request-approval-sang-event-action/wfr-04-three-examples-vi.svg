<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba ví dụ minh họa: mua hàng định kỳ, đổi trả và điều chỉnh lịch sản xuất, mỗi ví dụ có ca chạy theo rule đã ban hành trước và ca chuyển tới người có thẩm quyền." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba ví dụ: đi thẳng tới hành động hay chuyển lên</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cùng một nguyên tắc, áp dụng cho ba loại quyết định vận hành.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Tình huống</text><text x="300.0" y="141.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Chạy theo rule đã ban hành trước</text><text x="740.0" y="141.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Chuyển tới người có thẩm quyền</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="152.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="211.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mua hàng định kỳ</text><rect x="300.0" y="152.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="201.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Rule do người phụ trách mua hàng ban hành: đơn lặp</text><text x="318.0" y="221.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">lại, đúng nhà cung cấp thường dùng, trong hạn mức</text><rect x="730.0" y="152.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="201.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nhà cung cấp mới, hoặc vượt hạn mức</text><text x="748.0" y="221.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thông thường</text><rect x="60.0" y="272.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="331.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Hoàn tiền, đổi trả</text><rect x="300.0" y="272.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Trong chính sách đã công bố, giá trị thấp, khách</text><text x="318.0" y="341.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không có lịch sử bất thường</text><rect x="730.0" y="272.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Giá trị cao, hoặc mẫu hình bất thường như đổi trả</text><text x="748.0" y="341.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều lần trong thời gian ngắn</text><rect x="60.0" y="392.0" width="230.0" height="108.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="76.0" y="441.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Lịch sản xuất khi thiếu</text><text x="76.0" y="462.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nguyên liệu</text><rect x="300.0" y="392.0" width="420.0" height="108.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="318.0" y="441.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đã có phương án thay thế được duyệt trước: lịch</text><text x="318.0" y="461.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">điều chỉnh theo phương án đó</text><rect x="730.0" y="392.0" width="410.0" height="108.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="441.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phương án chưa được duyệt: chờ người</text><text x="748.0" y="461.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">có thẩm quyền</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyết định được đưa ra trước, một lần, bởi người có thẩm quyền; sự kiện chỉ kích hoạt nó.</text></svg>
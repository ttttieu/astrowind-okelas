<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Mô hình Request → Approval đặt một bước chờ duyệt vào mọi trường hợp; mô hình Event → Action để hệ thống đánh giá sự kiện theo quy tắc định sẵn, hành động trực tiếp và chỉ chuyển approval cho ca cần phán đoán." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ Request → Approval sang Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Approval không biến mất: nó chuyển từ bước cố định thành nhánh có điều kiện.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="169.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Request → Approval</text><rect x="84.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="209.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Request</text><line x1="338.0" y1="221.0" x2="411.0" y2="221.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="420.0,221.0 411.0,225.9 411.0,216.1" fill="var(--gm)"/><rect x="424.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="549.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Approval</text><line x1="678.0" y1="221.0" x2="751.0" y2="221.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="760.0,221.0 751.0,225.9 751.0,216.1" fill="var(--gm)"/><rect x="764.0" y="190.0" width="250.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="889.0" y="226.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Action</text><rect x="434.0" y="156.0" width="179.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="523.5" y="171.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Chờ duyệt, mọi trường hợp</text><text x="84.0" y="279.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bước chờ duyệt nằm giữa mọi quy trình, kể cả ca không thực sự cần phán đoán.</text><rect x="60.0" y="318.0" width="1080.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="353.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Event → Action</text><rect x="84.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="197.0" y="412.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sự kiện xảy ra</text><line x1="314.0" y1="407.0" x2="337.0" y2="407.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="346.0,407.0 337.0,411.9 337.0,402.1" fill="var(--p)"/><rect x="350.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--p)"/><text x="463.0" y="402.9" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Hệ thống đánh giá theo</text><text x="463.0" y="421.3" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">quy tắc và ngưỡng định sẵn</text><line x1="580.0" y1="407.0" x2="603.0" y2="407.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="612.0,407.0 603.0,411.9 603.0,402.1" fill="var(--p)"/><rect x="616.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="729.0" y="412.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hành động diễn ra trực tiếp</text><line x1="846.0" y1="407.0" x2="869.0" y2="407.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="878.0,407.0 869.0,411.9 869.0,402.1" fill="var(--a)"/><rect x="882.0" y="374.0" width="226.0" height="66.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="995.0" y="403.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Approval chỉ cho ca</text><text x="995.0" y="420.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">cần phán đoán</text><text x="84.0" y="471.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phần lớn ca lặp lại, rủi ro thấp đi thẳng tới hành động; chỉ phần thiểu số cần phán đoán mới qua approval.</text><rect x="60.0" y="516.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="549.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không phải bỏ kiểm soát: kiểm soát được đặt đúng nơi cần phán đoán của con người.</text></svg>
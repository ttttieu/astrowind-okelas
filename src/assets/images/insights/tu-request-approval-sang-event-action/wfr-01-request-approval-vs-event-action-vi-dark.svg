<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Request → Approval đặt một bước chờ duyệt vào mỗi ca; Event → Action chuyển phê duyệt lên cấp rule do người có thẩm quyền ban hành một lần, sự kiện kích hoạt rule đã duyệt, và ca ngoài rule do con người phán đoán." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Phê duyệt chuyển từ từng ca lên cấp rule</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Phê duyệt không biến mất: nó chuyển từ từng ca lên cấp rule.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="170.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="84.0" y="169.1" font-size="20" font-weight="700" fill="#9AA6B8" text-anchor="start">Request → Approval</text><rect x="84.0" y="190.0" width="250.0" height="62.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="209.0" y="226.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Request</text><line x1="338.0" y1="221.0" x2="411.0" y2="221.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="420.0,221.0 411.0,225.9 411.0,216.1" fill="#5B6575"/><rect x="424.0" y="190.0" width="250.0" height="62.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4"/><text x="549.0" y="226.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Approval</text><line x1="678.0" y1="221.0" x2="751.0" y2="221.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="760.0,221.0 751.0,225.9 751.0,216.1" fill="#5B6575"/><rect x="764.0" y="190.0" width="250.0" height="62.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="889.0" y="226.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Action</text><rect x="434.0" y="156.0" width="101.6" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="484.8" y="171.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Duyệt mỗi lần</text><text x="84.0" y="279.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Mỗi ca, kể cả ca đã lặp lại hàng trăm lần với cùng kết quả, qua một người phán đoán từ đầu.</text><rect x="60.0" y="318.0" width="1080.0" height="180.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="353.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Event → Action</text><rect x="84.0" y="374.0" width="226.0" height="66.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4"/><text x="197.0" y="402.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Rule do người có thẩm quyền</text><text x="197.0" y="421.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">ban hành trước</text><line x1="314.0" y1="407.0" x2="337.0" y2="407.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="346.0,407.0 337.0,411.9 337.0,402.1" fill="#A78BFA"/><rect x="350.0" y="374.0" width="226.0" height="66.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="463.0" y="412.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Sự kiện xảy ra</text><line x1="580.0" y1="407.0" x2="603.0" y2="407.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="612.0,407.0 603.0,411.9 603.0,402.1" fill="#2B74F5"/><rect x="616.0" y="374.0" width="226.0" height="66.0" rx="10" fill="#2B74F5"/><text x="729.0" y="402.9" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rule chạy: hành động diễn</text><text x="729.0" y="421.3" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">ra, ghi evidence</text><line x1="846.0" y1="407.0" x2="869.0" y2="407.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="878.0,407.0 869.0,411.9 869.0,402.1" fill="#A78BFA"/><rect x="882.0" y="374.0" width="226.0" height="66.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="5 4"/><text x="995.0" y="402.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Ca ngoài rule: con</text><text x="995.0" y="421.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">người phán đoán</text><text x="84.0" y="471.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Phê duyệt diễn ra một lần khi ban hành rule, và ở từng ca ngoại lệ; ca còn lại chạy theo rule đã duyệt.</text><rect x="60.0" y="516.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="549.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Không phải bỏ kiểm soát: kiểm soát chuyển lên lúc ban hành rule, phán đoán dành cho ca cần.</text></svg>
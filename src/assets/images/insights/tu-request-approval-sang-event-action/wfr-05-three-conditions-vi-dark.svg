<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Ba điều kiện chuyển đổi: đủ lịch sử để xác định tiền lệ, người có thẩm quyền quyết định trước, và giám sát sau; nên bắt đầu từ quyết định giá trị thấp, tần suất cao, tiền lệ rõ." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba điều kiện trước khi chuyển sang Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Chuyển đổi không phải bật một công tắc.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="220.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="16" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Đủ lịch sử để xác định tiền lệ</text><text x="84.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">rõ ràng</text><text x="84.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Ngưỡng an toàn cần dựa trên dữ liệu lịch sử</text><text x="84.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">đủ lớn, không phải phỏng đoán.</text><rect x="427.0" y="134.0" width="346.0" height="220.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="451.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Người có thẩm quyền sẵn sàng</text><text x="451.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">quyết định trước</text><text x="451.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Thay vì duyệt từng lần, đặt một quy tắc</text><text x="451.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">chung. Đây thường là rào cản tổ chức</text><text x="451.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">lớn nhất.</text><rect x="794.0" y="134.0" width="346.0" height="220.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="16" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="818.0" y="219.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Có giám sát sau</text><text x="818.0" y="243.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">(post-hoc review)</text><text x="818.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Xem lại định kỳ các ca đã tự xử lý để</text><text x="818.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">phát hiện ngưỡng đặt sai hoặc mẫu hình</text><text x="818.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">bị bỏ sót.</text><rect x="60.0" y="370.0" width="1080.0" height="84.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="416.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Lộ trình thận trọng: bắt đầu với</text><rect x="400.0" y="392.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="500.0" y="417.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Giá trị thấp</text><rect x="614.0" y="392.0" width="200.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="714.0" y="417.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tần suất cao</text><rect x="828.0" y="392.0" width="260.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="958.0" y="417.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tiền lệ rõ ràng nhất</text><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Tiền lệ, quyết định trước và giám sát sau: ba điều kiện để chuyển đổi vẫn có kiểm soát.</text></svg>
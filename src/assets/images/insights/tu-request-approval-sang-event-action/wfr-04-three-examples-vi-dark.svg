<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba ví dụ vận hành: mua hàng định kỳ, đổi trả khách hàng và điều chỉnh lịch sản xuất, mỗi ví dụ có ca đi thẳng tới hành động và ca chuyển lên người có thẩm quyền." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba ví dụ: đi thẳng tới hành động hay chuyển lên</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Cùng một nguyên tắc, áp dụng cho ba loại quyết định vận hành.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Tình huống</text><text x="300.0" y="141.7" font-size="13" font-weight="700" fill="#5FA0FF" text-anchor="start">Đi thẳng tới hành động</text><text x="740.0" y="141.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Chuyển tới người có thẩm quyền</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="152.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="211.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Mua hàng định kỳ</text><rect x="300.0" y="152.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="201.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Đơn lặp lại, đúng nhà cung cấp thường dùng, trong</text><text x="318.0" y="221.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">hạn mức đã duyệt trước</text><rect x="730.0" y="152.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="201.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Nhà cung cấp mới, hoặc vượt hạn mức</text><text x="748.0" y="221.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">thông thường</text><rect x="60.0" y="272.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="331.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Hoàn tiền, đổi trả</text><rect x="300.0" y="272.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="321.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Trong chính sách đã công bố, giá trị thấp, khách</text><text x="318.0" y="341.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">không có lịch sử bất thường</text><rect x="730.0" y="272.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="321.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Giá trị cao, hoặc mẫu hình bất thường như đổi trả</text><text x="748.0" y="341.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">nhiều lần trong thời gian ngắn</text><rect x="60.0" y="392.0" width="230.0" height="108.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="441.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Lịch sản xuất khi thiếu</text><text x="76.0" y="462.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">nguyên liệu</text><rect x="300.0" y="392.0" width="420.0" height="108.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="318.0" y="441.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Đã có phương án thay thế được duyệt trước:</text><text x="318.0" y="461.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">hệ thống tự điều chỉnh lịch và thông báo</text><rect x="730.0" y="392.0" width="410.0" height="108.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="748.0" y="441.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Tình huống nằm ngoài những gì đã được quyết</text><text x="748.0" y="461.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">định trước</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Quy tắc và ngưỡng do người có thẩm quyền quyết định trước, một lần; hệ thống áp dụng cho từng ca.</text></svg>
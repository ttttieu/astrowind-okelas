<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Sự kiện được đánh giá theo quy tắc và ngưỡng định sẵn: ca trong ngưỡng, khớp tiền lệ thì hành động trực tiếp và ghi evidence; ca vượt ngưỡng hoặc rủi ro cao thì chuyển người có thẩm quyền kèm ngữ cảnh." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Event → Action: approval thành nhánh có điều kiện</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Quy tắc và ngưỡng được quyết định trước; hệ thống phân luồng từng ca.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="252.0" width="180.0" height="80.0" rx="10" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="150.0" y="297.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Sự kiện xảy ra</text><line x1="244.0" y1="292.0" x2="271.0" y2="292.0" stroke="#2B74F5" stroke-width="3"/><polygon points="282.0,292.0 271.0,298.1 271.0,285.9" fill="#2B74F5"/><rect x="290.0" y="144.0" width="280.0" height="296.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="310.0" y="182.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống đánh giá</text><rect x="310.0" y="214.0" width="240.0" height="44.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="430.0" y="241.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Mức rủi ro</text><rect x="310.0" y="270.0" width="240.0" height="44.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="430.0" y="297.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Giá trị</text><rect x="310.0" y="326.0" width="240.0" height="44.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="430.0" y="353.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Độ khớp tiền lệ</text><line x1="574.0" y1="292.0" x2="604.0" y2="292.0" stroke="#9AA6B8" stroke-width="2.5"/><line x1="604.0" y1="209.0" x2="604.0" y2="375.0" stroke="#9AA6B8" stroke-width="2.5"/><line x1="604.0" y1="209.0" x2="625.0" y2="209.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="634.0,209.0 625.0,213.9 625.0,204.1" fill="#2B74F5"/><line x1="604.0" y1="375.0" x2="625.0" y2="375.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="634.0,375.0 625.0,379.9 625.0,370.1" fill="#A78BFA"/><rect x="640.0" y="134.0" width="500.0" height="150.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="664.0" y="168.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Trong ngưỡng an toàn, khớp tiền lệ rõ ràng</text><text x="664.0" y="206.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">Hành động diễn ra trực tiếp, không chờ duyệt</text><rect x="664.0" y="234.0" width="280.9" height="28.0" rx="14.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="804.5" y="252.7" font-size="13" font-weight="700" fill="#2B74F5" text-anchor="middle">Vẫn ghi đủ evidence để kiểm chứng sau</text><rect x="640.0" y="300.0" width="500.0" height="150.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="664.0" y="334.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Vượt ngưỡng, không khớp tiền lệ hoặc rủi ro cao</text><text x="664.0" y="372.0" font-size="19" font-weight="700" fill="#F7F8F8" text-anchor="start">Chuyển tới người có thẩm quyền</text><rect x="664.0" y="400.0" width="301.2" height="28.0" rx="14.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="814.6" y="418.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Kèm đủ ngữ cảnh để quyết định nhanh hơn</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Approval không còn là bước cố định trong chuỗi, mà là một nhánh có điều kiện.</text></svg>
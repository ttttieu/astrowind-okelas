<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Bốn điều kiện chuyển đổi: đủ tiền lệ, người có thẩm quyền quyết định trước và đứng tên rule, evidence mỗi lần rule chạy, và rà soát sau; nên bắt đầu từ quyết định giá trị thấp, tần suất cao, tiền lệ rõ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn điều kiện trước khi chuyển sang Event → Action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chuyển đổi không phải bật một công tắc.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đủ tiền lệ</text><text x="76.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định ca rõ ràng từ dữ liệu</text><text x="76.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thật: ca nào lặp lại với kết quả</text><text x="76.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhất quán.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="var(--p)"/><rect x="335.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Người có thẩm quyền</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định trước</text><text x="351.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đứng tên rule; mỗi rule có</text><text x="351.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chủ sở hữu (rule owner) chịu</text><text x="351.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trách nhiệm rà soát.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="var(--p)"/><rect x="610.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence mỗi lần</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">rule chạy</text><text x="626.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Để kiểm chứng sau và truy vết</text><text x="626.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">khi cần.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="var(--p)"/><rect x="885.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Rà soát sau</text><text x="901.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">(post-hoc review)</text><text x="901.0" y="283.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phát hiện sớm ngưỡng đặt</text><text x="901.0" y="302.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sai; sửa rule theo</text><text x="901.0" y="322.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quy trình chính thức.</text><rect x="60.0" y="400.0" width="1080.0" height="84.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="446.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Lộ trình thận trọng: bắt đầu với</text><rect x="400.0" y="422.0" width="200.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="500.0" y="447.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giá trị thấp</text><rect x="614.0" y="422.0" width="200.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="714.0" y="447.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tần suất cao</text><rect x="828.0" y="422.0" width="260.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="447.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tiền lệ rõ ràng nhất</text><rect x="60.0" y="502.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="535.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tiền lệ, quyết định trước, evidence và rà soát sau: bốn điều kiện để chuyển đổi vẫn có kiểm soát.</text></svg>
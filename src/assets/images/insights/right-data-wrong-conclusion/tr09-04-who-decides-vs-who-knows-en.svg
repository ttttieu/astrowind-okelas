<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" width="1200" height="484" role="img" aria-label="Two boxes with a not-equal sign: decision capacity is not the same as knowledge value; the four bodies of knowledge are medical, legal, experiential, and social and ethical." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="484" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Decision rights and knowledge value are different things</text><g transform="translate(0 108)"><rect x="60" y="0" width="508" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">DECISION CAPACITY</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Who has the authority to choose</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Tied to role, rules and accountability.</text><rect x="632" y="0" width="508" height="131" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">KNOWLEDGE VALUE</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Who knows what about the issue</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Tied to experience, expertise and perspective.</text><text x="600" y="77.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><text x="60" y="175" font-size="15" font-weight="600" class="mut">Four bodies of knowledge:</text><rect x="272.2021484375" y="155" width="101.06982421875" height="34" rx="17" class="bg"/><text x="290.2021484375" y="178" font-size="17" font-weight="600" class="tx">Medical</text><rect x="385.27197265625" y="155" width="80.5087890625" height="34" rx="17" class="bg"/><text x="403.27197265625" y="178" font-size="17" font-weight="600" class="tx">Legal</text><rect x="477.78076171875" y="155" width="133.1025390625" height="34" rx="17" class="bg"/><text x="495.78076171875" y="178" font-size="17" font-weight="600" class="tx">Experiential</text><rect x="622.88330078125" y="155" width="180.533203125" height="34" rx="17" class="bg"/><text x="640.88330078125" y="178" font-size="17" font-weight="600" class="tx">Social and ethical</text><rect x="60" y="221" width="1080" height="73" rx="16" class="bi"/><text x="82" y="265" font-size="22" font-weight="600" class="ti">No one body of knowledge can replace another.</text></g><text x="60" y="436" font-size="13" font-weight="400" class="mut">A knowledge-governance analysis, not medical, ethical or legal advice.</text></svg>

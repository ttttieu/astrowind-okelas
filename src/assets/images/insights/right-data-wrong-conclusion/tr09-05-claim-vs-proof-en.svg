<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Two boxes joined by an arrow: on the left the recorded 850 of 1,000 chose yes; on the right the conclusion being drawn, which holds only if the sample is representative, children understood, adults did not sway them and participation was voluntary." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="604" class="bgr"/><rect x="60" y="26" width="190.9951171875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">ILLUSTRATIVE SCENARIO</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">What data records is not what you want it to prove</text><g transform="translate(0 140)"><rect x="60" y="0" width="508" height="261" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">WHAT THE DATA RECORDS</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">The survey results table</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Accurate as a record:</text><circle cx="86" cy="131" r="3" class="dot"/><text x="100" y="136" font-size="17" font-weight="400" class="mut">Children surveyed: 1,000</text><circle cx="86" cy="161" r="3" class="dot"/><text x="100" y="166" font-size="17" font-weight="400" class="mut">Agree: 850</text><circle cx="86" cy="191" r="3" class="dot"/><text x="100" y="196" font-size="17" font-weight="400" class="mut">Disagree: 100</text><circle cx="86" cy="221" r="3" class="dot"/><text x="100" y="226" font-size="17" font-weight="400" class="mut">No opinion: 50</text><rect x="632" y="0" width="508" height="261" rx="16" class="bp"/><text x="654" y="35" font-size="13" font-weight="600" class="tp">THE CONCLUSION BEING DRAWN</text><text x="654" y="70" font-size="22" font-weight="600" class="tp">“85% of children support donation”</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Holds only if:</text><circle cx="658" cy="131" r="3" class="dot"/><text x="672" y="136" font-size="17" font-weight="400" class="mut">The sample is representative</text><circle cx="658" cy="161" r="3" class="dot"/><text x="672" y="166" font-size="17" font-weight="400" class="mut">Children understood the question</text><circle cx="658" cy="191" r="3" class="dot"/><text x="672" y="196" font-size="17" font-weight="400" class="mut">Adults did not sway the answers</text><circle cx="658" cy="221" r="3" class="dot"/><text x="672" y="226" font-size="17" font-weight="400" class="mut">Participation was voluntary</text><line x1="578" y1="130.5" x2="610" y2="130.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 121.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="289" width="1080" height="73" rx="16" class="bi"/><text x="82" y="333" font-size="22" font-weight="600" class="ti">The gap between the two boxes is what the organization must control.</text></g><text x="60" y="536" font-size="13" font-weight="400" class="mut">Illustrative scenario, not a real case or measured data.</text><text x="60" y="556" font-size="13" font-weight="400" class="mut">Illustrative figures, not statistics.</text></svg>

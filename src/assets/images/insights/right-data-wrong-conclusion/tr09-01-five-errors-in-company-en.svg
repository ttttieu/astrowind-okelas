<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 762" width="1200" height="762" role="img" aria-label="Table of five survey errors, each with how it appears in the children’s survey and a matching example in a company." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="762" class="bgr"/><rect x="60" y="26" width="190.9951171875" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">ILLUSTRATIVE SCENARIO</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Five survey errors, and how they show up in companies</text><g transform="translate(0 140)"><text x="64" y="16" font-size="14" font-weight="700" class="mut">ERROR</text><text x="380.45" y="16" font-size="14" font-weight="700" class="mut">IN THE CHILDREN’S SURVEY</text><text x="749.5" y="16" font-size="14" font-weight="700" class="mut">IN A COMPANY</text><rect x="60" y="34" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="74" font-size="18" font-weight="600" class="tx">1. Only hearing the reachable</text><rect x="376.45" y="34" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="74" font-size="18" font-weight="600" class="tx">Urban schools, large hospitals</text><rect x="745.5" y="34" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="74" font-size="18" font-weight="600" class="tx">ERP readiness assessed by asking</text><text x="767.5" y="97" font-size="18" font-weight="600" class="tx">only IT</text><rect x="60" y="138" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="178" font-size="18" font-weight="600" class="tx">2. Answers shaped by</text><text x="82" y="201" font-size="18" font-weight="600" class="tx">authority</text><rect x="376.45" y="138" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="178" font-size="18" font-weight="600" class="tx">A teacher standing nearby</text><rect x="745.5" y="138" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="178" font-size="18" font-weight="600" class="tx">The direct manager hands out and</text><text x="767.5" y="201" font-size="18" font-weight="600" class="tx">collects the form</text><rect x="60" y="242" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="282" font-size="18" font-weight="600" class="tx">3. Same answer, different</text><text x="82" y="305" font-size="18" font-weight="600" class="tx">understanding</text><rect x="376.45" y="242" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="282" font-size="18" font-weight="600" class="tx">“Yes” from several readings</text><rect x="745.5" y="242" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="282" font-size="18" font-weight="600" class="tx">“We use AI” can mean any level of use</text><rect x="60" y="346" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="386" font-size="18" font-weight="600" class="tx">4. Unknown conditions of</text><text x="82" y="409" font-size="18" font-weight="600" class="tx">collection</text><rect x="376.45" y="346" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="386" font-size="18" font-weight="600" class="tx">Parents coach or push the answer</text><rect x="745.5" y="346" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="386" font-size="18" font-weight="600" class="tx">A department fills in its own</text><text x="767.5" y="409" font-size="18" font-weight="600" class="tx">assessment</text><rect x="60" y="450" width="302.45" height="90" rx="16" class="bg"/><text x="82" y="490" font-size="18" font-weight="600" class="tx">5. Ignoring the cost of</text><text x="82" y="513" font-size="18" font-weight="600" class="tx">collecting</text><rect x="376.45" y="450" width="355.05" height="90" rx="16" class="bg"/><text x="398.45" y="490" font-size="18" font-weight="600" class="tx">Reopening a loss</text><rect x="745.5" y="450" width="394.5" height="90" rx="16" class="bb"/><text x="767.5" y="490" font-size="18" font-weight="600" class="tx">A post-incident interview run as</text><text x="767.5" y="513" font-size="18" font-weight="600" class="tx">blame-finding</text></g><text x="60" y="714" font-size="13" font-weight="400" class="mut">Illustrative scenario, not a real case or measured data.</text></svg>

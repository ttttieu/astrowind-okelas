<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Two comparison cards: “we have a procedure” on the left, “show me” on the right; a takeaway bar below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">“We have a procedure” is not enough; show me</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Auditors move from asking what the procedure says to asking for proof it was followed.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Scenario and contrast per the article; the conclusion about auditors is OKELAS’s reading.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">We have a procedure</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">The document says what should be done.</text><rect x="612.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Show me</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Evidence shows the work was done, by the right</text><text x="640.0" y="283.0" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">person, on the right version.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Documents describe what should happen; evidence proves what did happen.</text></svg>
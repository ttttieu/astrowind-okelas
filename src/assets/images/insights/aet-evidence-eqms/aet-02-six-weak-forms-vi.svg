<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Sáu thẻ dạng bằng chứng yếu xếp thành lưới hai cột, bên dưới là một thanh ghi chú về số đo." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu dạng bằng chứng yếu thường gặp trong eQMS</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Các dạng này là quan sát chung trong bài viết, không phải số liệu đo.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu dạng theo bài viết, diễn đạt lại; bài không đưa số đo.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="193.0" r="15" fill="var(--p)"/><text x="94.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="199.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi bù sau khi việc đã xong</text><rect x="60.0" y="238.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="271.0" r="15" fill="var(--gm)"/><text x="94.0" y="276.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="126.0" y="277.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chữ ký không có bối cảnh</text><rect x="60.0" y="316.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="349.0" r="15" fill="var(--gm)"/><text x="94.0" y="354.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="355.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chứng minh ý định, không phải kết quả</text><rect x="612.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="193.0" r="15" fill="var(--gm)"/><text x="646.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="678.0" y="199.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉnh sửa không để lại dấu vết</text><rect x="612.0" y="238.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="271.0" r="15" fill="var(--gm)"/><text x="646.0" y="276.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="678.0" y="277.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bản ghi mồ côi, không gắn với sự kiện</text><rect x="612.0" y="316.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="349.0" r="15" fill="var(--gm)"/><text x="646.0" y="354.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="678.0" y="355.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng nằm ở nơi không kiểm soát</text><rect x="60.0" y="400.0" width="1080.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="432.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Các dạng này là quan sát chung, không phải số liệu đo.</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ghi bù, chữ ký thiếu bối cảnh và sửa không dấu vết làm yếu bằng chứng.</text></svg>
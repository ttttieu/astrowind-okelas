<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Bốn hộp nối bằng mũi tên: tạo lúc hành động, gắn bối cảnh, bảo vệ toàn vẹn, truy vết; bên dưới là thanh giới hạn và thanh câu hỏi tự kiểm tra." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tạo bằng chứng lúc hành động, rồi tự kiểm tra</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn nguyên tắc bằng chứng theo thiết kế và mười câu tự kiểm tra trong bài viết.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nguyên tắc và giới hạn theo bài viết; sơ đồ và thanh giới hạn là của OKELAS.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="216.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Tạo lúc hành động</text><line x1="306.0" y1="210.0" x2="324.0" y2="210.0" stroke="var(--gm)" stroke-width="3"/><polygon points="334.0,210.0 324.0,215.5 324.0,204.5" fill="var(--gm)"/><rect x="340.0" y="160.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="460.0" y="216.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Gắn với bối cảnh</text><line x1="586.0" y1="210.0" x2="604.0" y2="210.0" stroke="var(--gm)" stroke-width="3"/><polygon points="614.0,210.0 604.0,215.5 604.0,204.5" fill="var(--gm)"/><rect x="620.0" y="160.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="740.0" y="216.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Bảo vệ toàn vẹn</text><line x1="866.0" y1="210.0" x2="884.0" y2="210.0" stroke="var(--gm)" stroke-width="3"/><polygon points="894.0,210.0 884.0,215.5 884.0,204.5" fill="var(--gm)"/><rect x="900.0" y="160.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="1020.0" y="216.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Truy vết được</text><rect x="60.0" y="290.0" width="1080.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="322.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Giới hạn: không chặn được khai sai từ đầu; mức chi tiết cần tương xứng rủi ro.</text><rect x="60.0" y="362.0" width="1080.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="600.0" y="396.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Ba câu trả lời “không” trở lên: hệ thống đang lưu tài liệu, chưa lưu bằng chứng.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bằng chứng tốt không biến hành động yếu thành hành động tốt.</text></svg>
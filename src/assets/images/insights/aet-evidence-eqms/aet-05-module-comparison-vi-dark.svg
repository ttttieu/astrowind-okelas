<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Hai cột: tài liệu nói gì và bằng chứng phải cho thấy gì; đối chiếu ba dòng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#08090A;--tx:#1E2A3E;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#08090A;--wh:#08090A;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#1E2A3E;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Mỗi loại tài liệu cần bằng chứng khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đối chiếu: tài liệu nói gì, và bằng chứng phải chứng minh điều gì.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bảng đối chiếu theo bài viết và điều khoản 9.2, 10.2; cách sắp xếp là của OKELAS.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="187.3" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">Tài liệu nói</text><text x="612.0" y="187.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="start">Bằng chứng phải cho thấy</text><rect x="60.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Có quy trình khắc phục</text><rect x="612.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="236.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Hành động đã làm, kèm kiểm tra hiệu lực</text><rect x="60.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="308.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Có hồ sơ đào tạo</text><rect x="612.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="308.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Năng lực làm được việc, không chỉ chữ ký</text><rect x="60.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="380.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Có xem xét lãnh đạo</text><rect x="612.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="380.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Quyết định, người phụ trách và hạn</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bằng chứng phải cho thấy kết quả, không chỉ cho thấy việc đã làm.</text></svg>
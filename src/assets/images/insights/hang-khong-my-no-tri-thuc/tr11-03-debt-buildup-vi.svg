<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Chuỗi bốn bước: hệ thống chạy ổn, người hiểu rời đi, hệ thống được vá và chuyển hạ tầng, rồi sự cố chạm vào phụ thuộc chưa ghi, khiến chẩn đoán kéo dài." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Nợ tri thức tích tụ theo bốn bước</text><g transform="translate(0 109.5)"><rect x="60" y="0" width="237" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Hệ thống chạy ổn</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Không ai ghi lại vì sao.</text><rect x="341" y="0" width="237" height="184" rx="16" class="bb"/><text x="363" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 2</text><text x="363" y="70" font-size="22" font-weight="600" class="tx">Người hiểu rời đi</text><text x="363" y="102" font-size="17" font-weight="400" class="mut">Tài liệu còn lại lỗi</text><text x="363" y="126" font-size="17" font-weight="400" class="mut">thời dần.</text><rect x="622" y="0" width="237" height="184" rx="16" class="bb"/><text x="644" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 3</text><text x="644" y="70" font-size="22" font-weight="600" class="tx">Vá, nối, chuyển</text><text x="644" y="99" font-size="22" font-weight="600" class="tx">hạ tầng</text><text x="644" y="131" font-size="17" font-weight="400" class="mut">Mỗi lần thêm một phụ</text><text x="644" y="155" font-size="17" font-weight="400" class="mut">thuộc chưa ghi.</text><rect x="903" y="0" width="237" height="184" rx="16" class="bp"/><text x="925" y="35" font-size="13" font-weight="600" class="tp">BƯỚC 4</text><text x="925" y="70" font-size="22" font-weight="600" class="tp">Sự cố chạm vào</text><text x="925" y="102" font-size="17" font-weight="400" class="mut">Chẩn đoán dài vì phải</text><text x="925" y="126" font-size="17" font-weight="400" class="mut">khám phá lại.</text><line x1="303" y1="92" x2="323" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M321 83 l14 9 l-14 9z" class="arf"/><line x1="584" y1="92" x2="604" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M602 83 l14 9 l-14 9z" class="arf"/><line x1="865" y1="92" x2="885" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M883 83 l14 9 l-14 9z" class="arf"/><rect x="60" y="212" width="1080" height="73" rx="16" class="bi"/><text x="82" y="256" font-size="22" font-weight="600" class="ti">“Lãi” của nợ tri thức là giờ chẩn đoán, không phải một dòng trên bảng cân đối.</text></g><text x="60" y="428.5" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

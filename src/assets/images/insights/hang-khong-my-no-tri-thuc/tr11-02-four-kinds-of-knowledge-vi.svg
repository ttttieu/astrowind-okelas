<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn thẻ: quy tắc nghiệp vụ, kinh nghiệm xử lý ngoại lệ, quan hệ phụ thuộc và cách phục hồi, là bốn loại tri thức mà mã nguồn không thể hiện đầy đủ." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Bốn loại tri thức nằm trong một hệ thống phần mềm</text><g transform="translate(0 147)"><rect x="60" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">LỚP 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Quy tắc nghiệp vụ</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Vì sao hệ thống tính và</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">chặn như vậy.</text><rect x="333.5" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="355.5" y="35" font-size="13" font-weight="600" class="mut">LỚP 2</text><text x="355.5" y="70" font-size="22" font-weight="600" class="tx">Kinh nghiệm</text><text x="355.5" y="99" font-size="22" font-weight="600" class="tx">ngoại lệ</text><text x="355.5" y="131" font-size="17" font-weight="400" class="mut">Ca đã xảy ra và cách xử lý.</text><rect x="607" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="629" y="35" font-size="13" font-weight="600" class="mut">LỚP 3</text><text x="629" y="70" font-size="22" font-weight="600" class="tx">Quan hệ phụ thuộc</text><text x="629" y="102" font-size="17" font-weight="400" class="mut">Nhận từ đâu, cấp cho ai,</text><text x="629" y="126" font-size="17" font-weight="400" class="mut">chạy trên đường nào.</text><rect x="880.5" y="0" width="259.5" height="160" rx="16" class="bp"/><text x="902.5" y="35" font-size="13" font-weight="600" class="tp">LỚP 4</text><text x="902.5" y="70" font-size="22" font-weight="600" class="tp">Cách phục hồi</text><text x="902.5" y="102" font-size="17" font-weight="400" class="mut">Khi dừng, ai làm gì trước,</text><text x="902.5" y="126" font-size="17" font-weight="400" class="mut">bằng cách nào.</text></g><text x="60" y="341" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

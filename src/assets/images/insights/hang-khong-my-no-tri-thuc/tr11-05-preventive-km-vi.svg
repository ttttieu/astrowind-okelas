<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Năm thẻ: lập bản đồ phụ thuộc, giữ tri thức chuyên gia, phương án dự phòng, kiểm thử phục hồi và để lại bằng chứng sau mỗi thay đổi." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Năm việc của quản trị tri thức phòng ngừa</text><g transform="translate(0 139.8)"><rect x="60" y="0" width="204.8" height="184" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Lập bản đồ</text><text x="82" y="99" font-size="22" font-weight="600" class="tx">phụ thuộc</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Cái gì nối với cái gì.</text><rect x="278.8" y="0" width="204.8" height="184" rx="16" class="bb"/><text x="300.8" y="35" font-size="13" font-weight="600" class="mut">2</text><text x="300.8" y="70" font-size="22" font-weight="600" class="tx">Giữ tri thức</text><text x="300.8" y="99" font-size="22" font-weight="600" class="tx">chuyên gia</text><text x="300.8" y="131" font-size="17" font-weight="400" class="mut">Ngoại lệ, lý do</text><text x="300.8" y="155" font-size="17" font-weight="400" class="mut">thiết kế.</text><rect x="497.6" y="0" width="204.8" height="184" rx="16" class="bb"/><text x="519.6" y="35" font-size="13" font-weight="600" class="mut">3</text><text x="519.6" y="70" font-size="22" font-weight="600" class="tx">Phương án dự</text><text x="519.6" y="99" font-size="22" font-weight="600" class="tx">phòng</text><text x="519.6" y="131" font-size="17" font-weight="400" class="mut">Cách vận hành</text><text x="519.6" y="155" font-size="17" font-weight="400" class="mut">khác có thật.</text><rect x="716.4000000000001" y="0" width="204.8" height="184" rx="16" class="bb"/><text x="738.4000000000001" y="35" font-size="13" font-weight="600" class="mut">4</text><text x="738.4000000000001" y="70" font-size="22" font-weight="600" class="tx">Kiểm thử</text><text x="738.4000000000001" y="99" font-size="22" font-weight="600" class="tx">phục hồi</text><text x="738.4000000000001" y="131" font-size="17" font-weight="400" class="mut">Diễn tập, không chỉ</text><text x="738.4000000000001" y="155" font-size="17" font-weight="400" class="mut">viết kế hoạch.</text><rect x="935.2" y="0" width="204.8" height="184" rx="16" class="bp"/><text x="957.2" y="35" font-size="13" font-weight="600" class="tp">5</text><text x="957.2" y="70" font-size="22" font-weight="600" class="tp">Để lại bằng</text><text x="957.2" y="99" font-size="22" font-weight="600" class="tp">chứng</text><text x="957.2" y="131" font-size="17" font-weight="400" class="mut">Đổi gì, vì sao, ai</text><text x="957.2" y="155" font-size="17" font-weight="400" class="mut">duyệt.</text></g><text x="60" y="357.8" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

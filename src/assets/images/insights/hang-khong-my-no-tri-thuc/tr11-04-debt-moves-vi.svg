<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai ô nối bằng mũi tên: nợ tri thức nằm trong hệ thống cũ và chuyển sang hệ thống mới nếu không chuyển giao tri thức, hiểu dependency và giữ năng lực vận hành độc lập." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Thay hệ thống không tự xóa nợ tri thức</text><g transform="translate(0 109.5)"><rect x="60" y="0" width="508" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">HỆ THỐNG CŨ</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Nợ tri thức nằm trong hệ thống cũ</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Quy tắc, ngoại lệ và phụ thuộc chưa được ghi lại.</text><rect x="632" y="0" width="508" height="184" rx="16" class="bp"/><text x="654" y="35" font-size="13" font-weight="600" class="tp">HỆ THỐNG MỚI</text><text x="654" y="70" font-size="22" font-weight="600" class="tp">Nợ chuyển sang hệ thống mới nếu không</text><text x="654" y="99" font-size="22" font-weight="600" class="tp">chuyển giao</text><text x="654" y="131" font-size="17" font-weight="400" class="mut">Thiếu chuyển giao tri thức, bản đồ phụ thuộc và năng lực</text><text x="654" y="155" font-size="17" font-weight="400" class="mut">vận hành độc lập.</text><line x1="578" y1="92" x2="610" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 83 l14 9 l-14 9z" class="arf"/><rect x="60" y="212" width="1080" height="73" rx="16" class="bi"/><text x="82" y="256" font-size="22" font-weight="600" class="ti">Thay phần mềm là cần, nhưng chưa đủ.</text></g><text x="60" y="428.5" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

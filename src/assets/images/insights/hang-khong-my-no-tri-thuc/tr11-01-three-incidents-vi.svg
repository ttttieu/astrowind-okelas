<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba thẻ: sự cố NOTAM ngày 11/01/2023, sự cố Newark ngày 28/04/2025 và lệnh dừng cất cánh toàn quốc ngày 13/11/2026 với nguyên nhân gốc chưa công bố." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba sự cố, một câu hỏi chung về tri thức</text><g transform="translate(0 132.6)"><rect x="60" y="0" width="349.3333333333333" height="208" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">11/01/2023 · NOTAM</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Hệ thống NOTAM ngừng</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Hơn 1.300 chuyến hủy, gần 10.000</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">chuyến chậm (GAO). FAA: nhân sự</text><text x="82" y="150" font-size="17" font-weight="400" class="mut">nhà thầu vô tình xóa tệp khi xử lý</text><text x="82" y="174" font-size="17" font-weight="400" class="mut">đồng bộ.</text><rect x="425.3333333333333" y="0" width="349.3333333333333" height="208" rx="16" class="bb"/><text x="447.3333333333333" y="35" font-size="13" font-weight="600" class="mut">28/04/2025 · NEWARK</text><text x="447.3333333333333" y="70" font-size="22" font-weight="600" class="tx">Mất radar và liên lạc 60 đến</text><text x="447.3333333333333" y="99" font-size="22" font-weight="600" class="tx">90 giây</text><text x="447.3333333333333" y="131" font-size="17" font-weight="400" class="mut">Liên quan cáp đồng cũ trong đường</text><text x="447.3333333333333" y="155" font-size="17" font-weight="400" class="mut">truyền viễn thông; hơn một nghìn</text><text x="447.3333333333333" y="179" font-size="17" font-weight="400" class="mut">chuyến hủy (CNN).</text><rect x="790.6666666666666" y="0" width="349.3333333333333" height="208" rx="16" class="bp"/><text x="812.6666666666666" y="35" font-size="13" font-weight="600" class="tp">13/11/2026 · TOÀN QUỐC</text><text x="812.6666666666666" y="70" font-size="22" font-weight="600" class="tp">Lệnh dừng cất cánh; nguyên</text><text x="812.6666666666666" y="99" font-size="22" font-weight="600" class="tp">nhân gốc chưa công bố</text><text x="812.6666666666666" y="131" font-size="17" font-weight="400" class="mut">Mất ổn định ở 17 trong 22 trung tâm</text><text x="812.6666666666666" y="155" font-size="17" font-weight="400" class="mut">đường dài, lúc đang chuyển cáp đồng</text><text x="812.6666666666666" y="179" font-size="17" font-weight="400" class="mut">sang cáp quang.</text></g><text x="60" y="374.6" font-size="13" font-weight="400" class="mut">Thông tin tính đến 23/11/2026. Không kết luận các sự cố do quản trị tri thức kém.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 488" width="1200" height="488" role="img" aria-label="Bảng ba lớp xác thực: hổ phù, chữ ký số và lịch sử hình thành quyết định, với câu hỏi mỗi lớp trả lời được và chưa trả lời được." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="488" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba lớp xác thực và câu hỏi mỗi lớp trả lời được</text><g transform="translate(0 108)"><text x="64" y="16" font-size="14" font-weight="700" class="mut">Lớp xác thực</text><text x="370.22222222222223" y="16" font-size="14" font-weight="700" class="mut">Trả lời được</text><text x="764.1111111111112" y="16" font-size="14" font-weight="700" class="mut">Chưa trả lời được</text><rect x="60" y="34" width="292.22222222222223" height="94" rx="16" class="bg"/><text x="82" y="76" font-size="20" font-weight="600" class="tx">Hổ phù</text><rect x="366.22222222222223" y="34" width="379.88888888888897" height="94" rx="16" class="bb"/><text x="388.22222222222223" y="75" font-size="19" font-weight="600" class="tx">Tín vật có khớp không?</text><rect x="760.1111111111112" y="34" width="379.88888888888897" height="94" rx="16" class="bp"/><text x="782.1111111111112" y="75" font-size="19" font-weight="600" class="tp">Người có quyền có thực sự muốn ra</text><text x="782.1111111111112" y="100" font-size="19" font-weight="600" class="tp">lệnh này?</text><rect x="60" y="142" width="292.22222222222223" height="94" rx="16" class="bg"/><text x="82" y="184" font-size="20" font-weight="600" class="tx">Chữ ký số</text><rect x="366.22222222222223" y="142" width="379.88888888888897" height="94" rx="16" class="bb"/><text x="388.22222222222223" y="183" font-size="19" font-weight="600" class="tx">Ai đã ký, và nội dung có bị sửa sau</text><text x="388.22222222222223" y="208" font-size="19" font-weight="600" class="tx">khi ký?</text><rect x="760.1111111111112" y="142" width="379.88888888888897" height="94" rx="16" class="bp"/><text x="782.1111111111112" y="183" font-size="19" font-weight="600" class="tp">Vì sao quyết định được đưa ra, dựa</text><text x="782.1111111111112" y="208" font-size="19" font-weight="600" class="tp">trên bằng chứng nào?</text><rect x="60" y="250" width="292.22222222222223" height="96" rx="16" class="bg"/><text x="82" y="292" font-size="20" font-weight="600" class="tx">Lịch sử hình thành</text><text x="82" y="318" font-size="20" font-weight="600" class="tx">quyết định</text><rect x="366.22222222222223" y="250" width="379.88888888888897" height="96" rx="16" class="bb"/><text x="388.22222222222223" y="291" font-size="19" font-weight="600" class="tx">Quyết định dựa vào đâu, qua những</text><text x="388.22222222222223" y="316" font-size="19" font-weight="600" class="tx">bước nào.</text><rect x="760.1111111111112" y="250" width="379.88888888888897" height="96" rx="16" class="bp"/><text x="782.1111111111112" y="291" font-size="19" font-weight="600" class="tp">Chỉ có khi tổ chức thiết kế và giữ nó</text><text x="782.1111111111112" y="316" font-size="19" font-weight="600" class="tp">có chủ đích.</text></g></svg>

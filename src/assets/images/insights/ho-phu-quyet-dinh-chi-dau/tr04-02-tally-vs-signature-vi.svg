<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bảng so sánh hổ phù và chữ ký số về phần phát lệnh, phần kiểm tra và mức gắn với nội dung." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Hổ phù và chữ ký số: cùng logic xác thực</text><g transform="translate(0 121.2)"><text x="348.51428571428573" y="16" font-size="14" font-weight="700" class="mut">Hổ phù</text><text x="753.257142857143" y="16" font-size="14" font-weight="700" class="mut">Chữ ký số</text><rect x="60" y="34" width="270.51428571428573" height="69" rx="16" class="bg"/><text x="82" y="75" font-size="19" font-weight="600" class="tx">Phần phát lệnh</text><rect x="344.51428571428573" y="34" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="366.51428571428573" y="75" font-size="19" font-weight="600" class="tx">Một nửa hổ phù do triều đình giữ</text><rect x="749.257142857143" y="34" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="771.257142857143" y="75" font-size="19" font-weight="600" class="tx">Khóa riêng của người ký</text><rect x="60" y="117" width="270.51428571428573" height="69" rx="16" class="bg"/><text x="82" y="158" font-size="19" font-weight="600" class="tx">Phần kiểm tra</text><rect x="344.51428571428573" y="117" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="366.51428571428573" y="158" font-size="19" font-weight="600" class="tx">Tướng ở ngoài khớp hai nửa</text><rect x="749.257142857143" y="117" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="771.257142857143" y="158" font-size="19" font-weight="600" class="tx">Khóa công khai kiểm tra chữ ký</text><rect x="60" y="200" width="270.51428571428573" height="94" rx="16" class="bg"/><text x="82" y="241" font-size="19" font-weight="600" class="tx">Gắn với nội dung</text><rect x="344.51428571428573" y="200" width="390.7428571428572" height="94" rx="16" class="bp"/><text x="366.51428571428573" y="241" font-size="19" font-weight="600" class="tp">Không gắn với nội dung của lệnh</text><rect x="749.257142857143" y="200" width="390.7428571428572" height="94" rx="16" class="bb"/><text x="771.257142857143" y="241" font-size="19" font-weight="600" class="tx">Gắn với nội dung đã ký, sửa là</text><text x="771.257142857143" y="266" font-size="19" font-weight="600" class="tx">phát hiện</text></g></svg>

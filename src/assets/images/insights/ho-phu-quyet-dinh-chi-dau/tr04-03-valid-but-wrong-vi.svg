<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai khối: tín vật khớp là hợp lệ về hình thức, nhưng câu hỏi người có quyền có thực sự ra lệnh vẫn chưa được trả lời." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Tín vật khớp chưa chắc đúng ý người có quyền</text><g transform="translate(0 125.4)"><rect x="60" y="0" width="508" height="131" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">KẾT QUẢ KIỂM TRA</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Tín vật khớp</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Hợp lệ về mặt hình thức.</text><rect x="632" y="0" width="508" height="131" rx="16" class="bp"/><text x="654" y="35" font-size="13" font-weight="600" class="tp">CÂU HỎI CÒN LẠI</text><text x="654" y="70" font-size="22" font-weight="600" class="tp">Người có quyền có thực sự ra lệnh?</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Tín vật không trả lời câu này.</text><text x="600" y="77.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><rect x="60" y="159" width="1080" height="73" rx="16" class="bi"/><text x="82" y="203" font-size="22" font-weight="600" class="ti">Hợp lệ về hình thức chưa đồng nghĩa với đúng ý định.</text></g><text x="60" y="391.4" font-size="13" font-weight="400" class="mut">Phần hổ phù dựa trên ghi chép lịch sử trong Sử ký, không phải biên bản sự kiện.</text></svg>

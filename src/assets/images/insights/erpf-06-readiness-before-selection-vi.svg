<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Sáu câu hỏi về quy trình, dữ liệu, phạm vi, người ra quyết định, change management và trách nhiệm sau dự án phải được trả lời trước khi đến câu hỏi chọn ERP nào và nhà triển khai nào." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Trả lời sáu câu hỏi này trước khi chọn ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đây là các câu hỏi cần trả lời trước, không phải sau khi đã chọn phần mềm.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá định hướng từ bài viết, là công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="629.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="165.0" r="15" fill="var(--p)"/><text x="92.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="160.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình đã đủ rõ ràng và nhất quán để cấu hình vào</text><text x="116.0" y="180.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ERP chưa?</text><rect x="606.0" y="134.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="165.0" r="15" fill="var(--p)"/><text x="638.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu master đang ở tình trạng nào?</text><rect x="60.0" y="206.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="237.0" r="15" fill="var(--p)"/><text x="92.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="242.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Phạm vi triển khai đầu tiên có đủ nhỏ để thành công không?</text><rect x="606.0" y="206.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="237.0" r="15" fill="var(--p)"/><text x="638.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="232.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có người đủ năng lực và thẩm quyền ra quyết định trong suốt</text><text x="662.0" y="252.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">dự án không?</text><rect x="60.0" y="278.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="309.0" r="15" fill="var(--p)"/><text x="92.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="116.0" y="314.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có kế hoạch change management, hay chỉ có kế hoạch IT?</text><rect x="606.0" y="278.0" width="534.0" height="62.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="309.0" r="15" fill="var(--p)"/><text x="638.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="662.0" y="314.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Ai chịu trách nhiệm hệ thống sau khi đội dự án rời đi?</text><line x1="60.0" y1="362.0" x2="1140.0" y2="362.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="6 5"/><rect x="537.8" y="348.0" width="124.5" height="28.0" rx="14.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="600.0" y="366.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Cổng sẵn sàng</text><line x1="600.0" y1="380.0" x2="600.0" y2="397.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="600.0,406.0 595.0,397.0 605.0,397.0" fill="var(--gm)"/><rect x="260.0" y="410.0" width="680.0" height="70.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="439.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Chọn ERP nào, nhà triển khai nào?</text><text x="600.0" y="463.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="middle">Không phải câu hỏi sai, nhưng sẽ đến quá sớm nếu chưa qua cổng.</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Trả lời trung thực trước khi chọn phần mềm là khác biệt giữa dự án tạo ra giá trị và dự án thành gánh nặng.</text></svg>
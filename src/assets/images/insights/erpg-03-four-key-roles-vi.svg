<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn vai trò cần có sau go-live: ERP System Owner, Master Data Manager, Key Users hoặc Super Users, và IT hoặc System Administrator." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn vai trò cần có sau go-live</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không cần bộ phận mới: SME có thể giao vai trò cho người hiện có, miễn là xác định rõ.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="159.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ERP System Owner</text><text x="76.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chịu trách nhiệm cuối cùng về</text><text x="76.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">mặt kinh doanh; quyết định</text><text x="76.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thay đổi lớn và chịu trách nhiệm</text><text x="76.0" y="263.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trước lãnh đạo.</text><rect x="334.0" y="134.0" width="259.0" height="159.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Master Data Manager</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chất lượng và tính nhất</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quán của dữ liệu nền: sản</text><text x="350.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phẩm, nhà cung cấp, khách</text><text x="350.0" y="263.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hàng, chart of accounts.</text><rect x="608.0" y="134.0" width="259.0" height="159.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Key Users / Super Users</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ít nhất một người mỗi bộ phận</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chính; hỗ trợ đồng nghiệp và</text><text x="624.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chuyển yêu cầu thay đổi lên</text><text x="624.0" y="263.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">System Owner.</text><rect x="882.0" y="134.0" width="259.0" height="159.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">IT / System</text><text x="898.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Administrator</text><text x="898.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Hạ tầng, backup, bảo mật, quản</text><text x="898.0" y="248.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lý người dùng và thực hiện</text><text x="898.0" y="268.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thay đổi đã được phê duyệt.</text><rect x="60.0" y="309.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="342.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cần một người cụ thể, vì “mọi người cùng chịu trách nhiệm” thực tế là không ai chịu.</text></svg>
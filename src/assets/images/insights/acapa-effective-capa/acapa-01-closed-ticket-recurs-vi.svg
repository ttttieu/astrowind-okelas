<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Ba thẻ nối thành hàng: phiếu đóng đúng hạn, ba tháng sau lỗi quay lại, lần đánh giá tiếp vẫn đạt." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phiếu đóng đúng hạn, nhưng lỗi vẫn quay lại</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hồ sơ đầy đủ và đóng đúng hạn vẫn không chứng minh được nguyên nhân đã mất.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống theo bài viết; kết luận là diễn giải của OKELAS.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="340.0" height="160.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="218.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Phiếu đóng đúng hạn</text><text x="84.0" y="256.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Đạt yêu cầu về thời hạn</text><line x1="406.0" y1="250.0" x2="415.0" y2="250.0" stroke="var(--gm)" stroke-width="3"/><polygon points="424.0,250.0 415.0,254.9 415.0,245.1" fill="var(--gm)"/><rect x="428.0" y="170.0" width="340.0" height="160.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="452.0" y="218.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Ba tháng sau</text><text x="452.0" y="256.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Cùng lỗi xuất hiện trở lại</text><line x1="774.0" y1="250.0" x2="783.0" y2="250.0" stroke="var(--gm)" stroke-width="3"/><polygon points="792.0,250.0 783.0,254.9 783.0,245.1" fill="var(--gm)"/><rect x="796.0" y="170.0" width="340.0" height="160.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="820.0" y="218.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lần đánh giá tiếp theo</text><text x="820.0" y="256.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Vẫn đạt, vì hồ sơ đầy đủ</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phiếu đầy đủ chưa chứng minh được nguyên nhân đã mất.</text></svg>
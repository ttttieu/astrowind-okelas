<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Three ticket cards side by side: two blame the operator, the third finds an outdated setting chart, with one action bar below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The third ticket finds an outdated setting chart</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An illustrative composite case from the article, not a real client.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Composite case per the article; placing the three tickets side by side is OKELAS’s presentation.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="208.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ticket 1</text><text x="84.0" y="244.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Blames the operator,</text><text x="84.0" y="266.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">prescribes retraining</text><rect x="428.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="208.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ticket 2</text><text x="452.0" y="244.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Blames the operator,</text><text x="452.0" y="266.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">prescribes retraining</text><rect x="796.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="820.0" y="208.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Ticket 3</text><text x="820.0" y="244.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Changeover setting chart is an</text><text x="820.0" y="266.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">outdated version</text><rect x="60.0" y="360.0" width="1080.0" height="70.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="401.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Replace the posted chart, withdraw old copies, check similar lines</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The root cause can sit in another step, such as document control.</text></svg>
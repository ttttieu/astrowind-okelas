<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Four loop boxes joined by arrows: detect, analyze, correct, verify effectiveness." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="554" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A four-step loop, and the last step is effectiveness</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Four steps per the article; closing a ticket is not the final goal.</text><line x1="60.0" y1="470.0" x2="1140.0" y2="470.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="492.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four steps per the article; arrows and layout are OKELAS’s presentation.</text><text x="60.0" y="533.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="180.0" width="255.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="187.5" y="241.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Detect</text><line x1="319.0" y1="235.0" x2="321.0" y2="235.0" stroke="var(--gm)" stroke-width="3"/><polygon points="331.0,235.0 321.0,240.5 321.0,229.5" fill="var(--gm)"/><rect x="335.0" y="180.0" width="255.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="462.5" y="241.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Analyze</text><line x1="594.0" y1="235.0" x2="596.0" y2="235.0" stroke="var(--gm)" stroke-width="3"/><polygon points="606.0,235.0 596.0,240.5 596.0,229.5" fill="var(--gm)"/><rect x="610.0" y="180.0" width="255.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="737.5" y="241.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Correct</text><line x1="869.0" y1="235.0" x2="871.0" y2="235.0" stroke="var(--gm)" stroke-width="3"/><polygon points="881.0,235.0 871.0,240.5 871.0,229.5" fill="var(--gm)"/><rect x="885.0" y="180.0" width="255.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="1012.5" y="241.9" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">Verify effectiveness</text><rect x="60.0" y="400.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="433.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Taking action is not the same as an effective action.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Sáu thẻ vấn đề xếp lưới ba cột hai hàng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu kiểu thất bại thường gặp của CAPA</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu kiểu lặp lại được bài viết nêu, như các quan sát chung, không phải số đo.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu kiểu theo bài viết, mô tả là quan sát chung, không phải dữ liệu đo lường.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="205.0" r="15" fill="var(--p)"/><text x="90.0" y="210.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="200.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhầm khắc phục với hành động</text><text x="120.0" y="221.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">khắc phục</text><rect x="430.0" y="160.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="460.0" cy="205.0" r="15" fill="var(--gm)"/><text x="460.0" y="210.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="490.0" y="200.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Coi “lỗi con người” là nguyên</text><text x="490.0" y="221.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhân gốc</text><rect x="800.0" y="160.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="830.0" cy="205.0" r="15" fill="var(--gm)"/><text x="830.0" y="210.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="860.0" y="200.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mặc định là đào tạo lại</text><rect x="60.0" y="270.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="90.0" cy="315.0" r="15" fill="var(--gm)"/><text x="90.0" y="320.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="310.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không kiểm tra hiệu lực</text><rect x="430.0" y="270.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="460.0" cy="315.0" r="15" fill="var(--gm)"/><text x="460.0" y="320.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="490.0" y="310.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không rà soát nơi khác</text><rect x="800.0" y="270.0" width="340.0" height="90.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="830.0" cy="315.0" r="15" fill="var(--gm)"/><text x="830.0" y="320.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="860.0" y="310.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đo thành công bằng việc đóng</text><text x="860.0" y="331.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">đúng hạn</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đóng đúng hạn không chứng minh hành động có hiệu quả.</text></svg>
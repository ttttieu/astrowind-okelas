<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Two method cards, 5 Whys and fishbone diagram, with a warning box below about a cause that is too vague." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The method matters less than how deep the questions go</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ISO 9001 does not prescribe a method for root cause analysis.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Methods mentioned by the article are 5 Whys and fishbone diagrams; check the article for detail.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="211.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">5 Whys</text><text x="86.0" y="246.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ask “why” repeatedly until you reach a cause you can act on.</text><rect x="612.0" y="160.0" width="528.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="211.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Fishbone diagram</text><text x="638.0" y="246.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">List causes by group: people, machine, method, material.</text><rect x="60.0" y="340.0" width="1080.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="391.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">A root cause that could fit almost any nonconformity is too vague.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Asking deeper questions matters more than choosing the tool.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Chi phí tuyển dụng, đào tạo và giữ chân có dòng ngân sách nên thấy trên báo cáo; chi phí năng suất giảm do thiếu tacit knowledge không có dòng ngân sách và phân tán trong OEE, tỷ lệ sai sót và chi phí nhân công." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao chi phí knowledge loss không xuất hiện trong báo cáo</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chi phí hiển thị có dòng ngân sách. Chi phí ẩn thì không.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="300.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Có dòng ngân sách</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thấy ngay trên báo cáo</text><rect x="84.0" y="222.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="251.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí tuyển dụng: HR budget</text><rect x="84.0" y="278.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="307.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí đào tạo: training budget</text><rect x="84.0" y="334.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="363.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí giữ chân: lương, phúc lợi</text><rect x="612.0" y="134.0" width="528.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Không có dòng ngân sách</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">“Năng suất giảm do thiếu tacit knowledge”, phân tán trong nhiều</text><text x="636.0" y="218.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chỉ số</text><rect x="636.0" y="240.6" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="269.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">OEE giảm nhẹ</text><rect x="636.0" y="296.6" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="325.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tỷ lệ sai sót tăng chút ít</text><rect x="636.0" y="352.6" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="381.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí nhân công tăng do bổ sung người</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Doanh nghiệp thấy chi phí của việc đầu tư, nhưng không thấy chi phí của việc không đầu tư.</text></svg>
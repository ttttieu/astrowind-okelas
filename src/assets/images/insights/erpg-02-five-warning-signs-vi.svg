<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536" role="img" aria-label="Năm dấu hiệu thiếu ERP governance: dữ liệu master kém chất lượng, vấn đề báo cáo nhưng không được xử lý, yêu cầu thay đổi không được quản lý, quyền truy cập không được kiểm soát và không ai biết hệ thống vận hành ra sao." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="536" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm dấu hiệu thiếu ERP governance</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Các dấu hiệu thường xuất hiện 6 đến 18 tháng sau go-live.</text><line x1="60.0" y1="452.0" x2="1140.0" y2="452.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="474.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="515.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="232.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu master kém</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">chất lượng</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Sản phẩm tạo không theo</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chuẩn, nhà cung cấp</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">trùng, thông tin khách</text><text x="76.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hàng lỗi thời.</text><rect x="279.0" y="134.0" width="204.0" height="232.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Vấn đề báo cáo</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhưng không được</text><text x="295.0" y="257.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">xử lý</text><text x="295.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Lỗi chuyển qua nhiều</text><text x="295.0" y="304.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tầng; không có ticket, SLA</text><text x="295.0" y="323.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hay người chịu</text><text x="295.0" y="341.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">trách nhiệm cuối.</text><rect x="498.0" y="134.0" width="204.0" height="232.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu thay đổi</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">không được quản lý</text><text x="514.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không rõ ai quyết định,</text><text x="514.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thực hiện, kiểm tra; có</text><text x="514.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thay đổi không tài liệu.</text><rect x="717.0" y="134.0" width="204.0" height="232.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền truy cập</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">không được</text><text x="733.0" y="257.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">kiểm soát</text><text x="733.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cấp quyền theo yêu cầu</text><text x="733.0" y="304.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cá nhân; tài khoản nghỉ</text><text x="733.0" y="323.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">việc không bị khóa kịp.</text><rect x="936.0" y="134.0" width="204.0" height="232.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không ai biết</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">hệ thống vận hành</text><text x="952.0" y="257.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">ra sao</text><text x="952.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không có báo cáo định kỳ;</text><text x="952.0" y="304.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lãnh đạo chỉ biết khi có sự</text><text x="952.0" y="323.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cố lớn.</text><rect x="60.0" y="382.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="415.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không ai được giao duy trì và không có quy trình thì vấn đề cứ tích lũy.</text></svg>
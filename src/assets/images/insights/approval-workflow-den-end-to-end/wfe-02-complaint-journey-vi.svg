0" stroke="var(--mut)" stroke-width="2.5"/><text x="1072.0" y="413.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Đóng vòng</text><circle cx="76.0" cy="445.0" r="6" fill="var(--a)"/><text x="92.0" y="448.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Điểm bàn giao giữa các phòng ban</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Duyệt chỉ là một điểm; phần còn lại của hành trình vẫn cần người chịu trách nhiệm.</text></svg>
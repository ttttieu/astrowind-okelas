<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Trong hành trình xử lý khiếu nại chất lượng qua kinh doanh, QA và sản xuất, bước duyệt hành động khắc phục chỉ là một điểm giữa nhiều bước và nhiều điểm bàn giao." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bước duyệt chỉ là một điểm trong hành trình khiếu nại</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ khiếu nại chất lượng: bước duyệt chỉ là một khoảnh khắc trong một sự kiện lớn hơn nhiều.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; ví dụ khiếu nại chất lượng và phân làn phòng ban là giả định, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="132.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="176.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Kinh doanh</text><rect x="60.0" y="216.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="216.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="260.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">QA</text><rect x="60.0" y="300.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="300.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="344.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản xuất</text><rect x="1031.0" y="104.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="119.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><line x1="324.0" y1="171.0" x2="335.0" y2="171.0" stroke="var(--gm)" stroke-width="2"/><line x1="335.0" y1="171.0" x2="335.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="335.0" y1="255.0" x2="339.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="346.0,255.0 339.0,258.9 339.0,251.2" fill="var(--gm)"/><circle cx="335.0" cy="213.0" r="6" fill="var(--a)"/><line x1="458.0" y1="255.0" x2="473.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="480.0,255.0 473.0,258.9 473.0,251.2" fill="var(--gm)"/><line x1="592.0" y1="255.0" x2="603.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="603.0" y1="255.0" x2="603.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><line x1="603.0" y1="339.0" x2="607.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><polygon points="614.0,339.0 607.0,342.9 607.0,335.1" fill="var(--gm)"/><circle cx="603.0" cy="297.0" r="6" fill="var(--a)"/><line x1="726.0" y1="339.0" x2="737.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><line x1="737.0" y1="339.0" x2="737.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="737.0" y1="255.0" x2="741.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="748.0,255.0 741.0,258.9 741.
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Năm bước mở rộng từ approval sang end-to-end: chọn quy trình, xác định lại ranh giới, lập bản đồ điểm bàn giao, chỉ định chủ quy trình, rồi mới chọn công nghệ." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="584" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Mở rộng theo năm bước, công nghệ đến sau cùng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Không chuyển đồng loạt mọi approval workflow; chọn quy trình rồi mở rộng dần.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Lộ trình là gợi ý của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="76.0" y="156.0" width="58.6" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="105.3" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Bước 1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Chọn quy trình</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">phù hợp</text><text x="76.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Ưu tiên quy trình lặp lại</text><text x="76.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">nhiều, liên phòng ban,</text><text x="76.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">ảnh hưởng khách hàng</text><text x="76.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hoặc tuân thủ: xử lý</text><text x="76.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">khiếu nại chất lượng,</text><text x="76.0" y="368.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">kiểm soát thay đổi, quản</text><text x="76.0" y="388.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">lý sự cố.</text><line x1="263.0" y1="168.0" x2="270.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="277.0,168.0 270.0,171.8 270.0,164.2" fill="#2B74F5"/><rect x="280.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="296.0" y="156.0" width="61.0" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="326.5" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Bước 2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Xác định lại</text><text x="296.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">ranh giới</text><text x="296.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Sự kiện nào khởi phát</text><text x="296.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">quy trình, và điều gì</text><text x="296.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">đánh dấu hoàn tất</text><text x="296.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">thật sự từ góc nhìn</text><text x="296.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">người nhận.</text><line x1="483.0" y1="168.0" x2="490.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="497.0,168.0 490.0,171.8 490.0,164.2" fill="#2B74F5"/><rect x="500.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="516.0" y="156.0" width="61.2" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="546.6" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Bước 3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Lập bản đồ</text><text x="516.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">điểm bàn giao</text><text x="516.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mỗi lần chuyển giữa</text><text x="516.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">các phòng ban có người</text><text x="516.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">chịu trách nhiệm và</text><text x="516.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">bằng chứng được ghi</text><text x="516.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">lại, không qua lời nói</text><text x="516.0" y="368.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hay email.</text><line x1="703.0" y1="168.0" x2="710.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="717.0,168.0 710.0,171.8 710.0,164.2" fill="#2B74F5"/><rect x="720.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="736.0" y="156.0" width="61.6" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="766.8" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Bước 4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Chỉ định chủ</text><text x="736.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">quy trình</text><text x="736.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Một vai trò, không nhất</text><text x="736.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">thiết là vị trí mới, theo</text><text x="736.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">dõi cả luồng và có</text><text x="736.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">quyền yêu cầu thông tin</text><text x="736.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">từ mọi phòng ban.</text><line x1="923.0" y1="168.0" x2="930.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="937.0,168.0 930.0,171.8 930.0,164.2" fill="#2B74F5"/><rect x="940.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="956.0" y="156.0" width="61.1" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="986.6" y="172.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Bước 5</text><rect x="1047.9" y="156.0" width="76.1" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="1086.0" y="172.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Sau cùng</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Chọn công nghệ</text><text x="956.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Chỉ có ý nghĩa sau khi</text><text x="956.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">ranh giới, điểm bàn giao</text><text x="956.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">và trách nhiệm đã rõ.</text><rect x="60.0" y="462.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="495.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Ranh giới, điểm bàn giao và trách nhiệm đi trước; chọn công cụ đi sau.</text></svg>
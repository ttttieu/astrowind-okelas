<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 692" width="1200" height="692" role="img" aria-label="Bốn điều kiện của end-to-end workflow: sự kiện khởi phát rõ, kết quả cuối rõ, truy vết liên phòng ban và một người sở hữu quy trình." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="692" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn điều kiện của một end-to-end workflow thực sự</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quan sát trong bài: lỗi vận hành thường nằm ở điểm bàn giao giữa các phòng ban hơn là bên trong từng phòng.</text><line x1="60.0" y1="630.0" x2="1140.0" y2="630.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="652.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="530.0" height="176.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="166.0" r="16" fill="var(--p)"/><text x="96.0" y="171.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sự kiện khởi phát rõ ràng</text><text x="84.0" y="216.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: khiếu nại được ghi nhận, đơn hàng được tạo, hợp đồng</text><text x="84.0" y="237.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">được ký.</text><text x="84.0" y="282.8" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Không phải: khi ai đó bấm nút bắt đầu quy trình duyệt</text><rect x="610.0" y="132.0" width="530.0" height="176.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="646.0" cy="166.0" r="16" fill="var(--p)"/><text x="646.0" y="171.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="674.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kết quả cuối rõ ràng</text><text x="634.0" y="216.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định từ góc nhìn người nhận: khách hàng hoặc phòng ban</text><text x="634.0" y="237.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">yêu cầu.</text><text x="634.0" y="282.8" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Không phải: khi yêu cầu được duyệt</text><rect x="60.0" y="326.0" width="530.0" height="176.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="360.0" r="16" fill="var(--p)"/><text x="96.0" y="365.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="124.0" y="367.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Truy vết liên phòng ban</text><text x="84.0" y="410.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bằng chứng được lưu tại mọi điểm bàn giao giữa các phòng ban.</text><text x="84.0" y="476.8" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Không chỉ: tại các điểm ký</text><rect x="610.0" y="326.0" width="530.0" height="176.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="646.0" cy="360.0" r="16" fill="var(--a)"/><text x="646.0" y="365.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="674.0" y="367.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Một người sở hữu quy trình</text><rect x="952.9" y="346.0" width="167.1" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="1036.5" y="363.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Rào cản tổ chức lớn nhất</text><text x="634.0" y="410.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một vai trò chịu trách nhiệm cho toàn luồng, không chỉ từng đoạn</text><text x="634.0" y="431.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">của phòng ban.</text><text x="634.0" y="476.8" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Không phải: trách nhiệm chia theo phòng ban</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khó nhất là giao trách nhiệm cho kết quả vượt ngoài sự kiểm soát hoàn toàn của một phòng ban.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img" aria-label="Approval workflow chỉ phủ đoạn giữa hành trình; end-to-end phủ từ sự kiện khởi phát đến kết quả cuối theo góc nhìn người nhận." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="588" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Khác biệt cốt lõi là phạm vi, không phải số bước</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nghiên cứu Exeter: điểm phân biệt của end-to-end là phạm vi quản lý, không phải số bước.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nguồn: Maddern, Smart, Maull và Childe, Đại học Exeter. Sơ đồ minh họa khái niệm, không phải số liệu đo lường.</text><circle cx="300.0" cy="172.0" r="9" fill="var(--ink)"/><circle cx="1131.0" cy="172.0" r="9" fill="var(--ink)"/><line x1="310.0" y1="172.0" x2="1120.0" y2="172.0" stroke="var(--gm)" stroke-width="2" stroke-dasharray="4 5"/><text x="60.0" y="137.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Sự kiện khởi phát</text><text x="60.0" y="155.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ: khiếu nại được ghi nhận</text><text x="1140.0" y="137.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="end">Kết quả cuối</text><text x="1140.0" y="155.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="end">Từ góc nhìn người nhận</text><text x="60.0" y="279.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Approval workflow</text><rect x="300.0" y="232.0" width="840.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="500.0" y="232.0" width="340.0" height="76.0" rx="12" fill="var(--p)"/><text x="670.0" y="275.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">Chỉ phủ đoạn giữa: các điểm ký</text><text x="400.0" y="275.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Ngoài phạm vi</text><text x="990.0" y="275.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Ngoài phạm vi</text><text x="60.0" y="399.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">End-to-end workflow</text><rect x="300.0" y="352.0" width="840.0" height="76.0" rx="12" fill="var(--a)"/><text x="720.0" y="396.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">Phủ cả hành trình, từ sự kiện khởi phát đến kết quả cuối</text><line x1="309.0" y1="190.0" x2="309.0" y2="232.0" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="1131.0" y1="190.0" x2="1131.0" y2="232.0" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nhiều bước duyệt đã số hóa vẫn chưa phải end-to-end nếu chỉ phủ đoạn giữa hành trình.</text></svg>
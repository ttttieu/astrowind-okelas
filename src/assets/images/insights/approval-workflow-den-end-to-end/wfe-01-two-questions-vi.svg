<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Approval workflow chỉ trả lời việc yêu cầu đã được duyệt chưa; câu hỏi việc này kết thúc ở đâu và ai chịu trách nhiệm đến khi xong thì không được trả lời." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Approval trả lời “đã duyệt chưa”, không trả lời “xong chưa”</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Approval giải quyết một vấn đề cụ thể: kiểm soát quyền quyết định tại một hay vài điểm trong quy trình.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="140.0" width="530.0" height="318.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="84.0" y="183.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Approval workflow</text><rect x="84.0" y="206.0" width="482.0" height="64.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="325.0" y="244.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="middle">Yêu cầu đã được duyệt chưa?</text><circle cx="94.0" cy="312.0" r="5" fill="var(--p)"/><text x="108.0" y="319.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Có một yêu cầu: nghỉ phép, đề xuất mua, thanh toán</text><circle cx="94.0" cy="362.0" r="5" fill="var(--p)"/><text x="108.0" y="369.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chuỗi người ký theo thứ tự hoặc cấp bậc</text><circle cx="94.0" cy="412.0" r="5" fill="var(--p)"/><text x="108.0" y="419.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Kết thúc khi đủ chữ ký, bất kể điều gì xảy ra sau</text><rect x="610.0" y="140.0" width="530.0" height="318.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="634.0" y="183.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Phần approval không trả lời</text><rect x="634.0" y="206.0" width="482.0" height="124.0" rx="12" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="875.0" y="262.4" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">Việc này kết thúc ở đâu, và ai chịu trách nhiệm</text><text x="875.0" y="287.5" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">cho đến khi xong?</text><text x="634.0" y="374.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Câu hỏi này cần một phạm vi rộng hơn điểm ký.</text><rect x="60.0" y="476.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="509.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Approval workflow không sai, nó chỉ trả lời một câu hỏi rất hẹp.</text></svg>
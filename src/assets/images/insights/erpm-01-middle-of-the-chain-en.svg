<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Manufacturing ERP differs in the middle between procuring materials and shipping: converting materials, tracking quantity and quality at each stage, yield and loss, machine and labor capacity and lot and batch records." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Manufacturing ERP differs in the middle: buy to ship</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The distinctive value of manufacturing ERP lies in what happens on the shop floor.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="585.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="244.0" width="220.0" height="80.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="170.0" y="290.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Procure materials</text><line x1="286.0" y1="284.0" x2="344.0" y2="284.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="354.0,284.0 344.0,289.5 344.0,278.5" fill="var(--gm)"/><rect x="360.0" y="134.0" width="480.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="2.4"/><text x="384.0" y="175.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Production</text><rect x="384.0" y="196.0" width="432.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="220.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Converting materials into products</text><rect x="384.0" y="242.0" width="432.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="266.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tracking quantity and quality at each stage</text><rect x="384.0" y="288.0" width="432.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="312.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Yield and loss</text><rect x="384.0" y="334.0" width="432.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="358.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Machine and labor capacity</text><rect x="384.0" y="380.0" width="432.0" height="38.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="404.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Lot and batch records</text><line x1="846.0" y1="284.0" x2="904.0" y2="284.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="914.0,284.0 904.0,289.5 904.0,278.5" fill="var(--gm)"/><rect x="920.0" y="244.0" width="220.0" height="80.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="1030.0" y="290.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Ship to customer</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without a production module, ERP manages only the commercial side.</text></svg>
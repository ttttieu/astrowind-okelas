<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Three intelligent-workflow capabilities, unstructured data processing, controlled exception handling and explainable decisions, are built on top of automation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="556" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three capabilities built on top of automation</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">They do not replace automation: they are built on top of it.</text><line x1="60.0" y1="494.0" x2="1140.0" y2="494.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="516.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Unstructured data</text><text x="80.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Read emails, extract data from scanned</text><text x="80.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">documents, categorize requests written in</text><text x="80.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">natural language.</text><rect x="425.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Controlled exceptions</text><text x="445.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Triage severity, handle low-risk cases</text><text x="445.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">from precedent, escalate those</text><text x="445.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">needing judgment.</text><rect x="790.0" y="134.0" width="350.0" height="168.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Explainable decisions</text><text x="810.0" y="226.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Show why an action is proposed, from</text><text x="810.0" y="247.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">which data and precedent, so people can</text><text x="810.0" y="268.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">verify it.</text><rect x="60.0" y="316.0" width="1080.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="353.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Foundation: automation</text><text x="84.0" y="379.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Repetitive, rule-governed work stays with automation.</text><rect x="60.0" y="418.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="451.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The intelligent layer is used only for the work that needs it.</text></svg>
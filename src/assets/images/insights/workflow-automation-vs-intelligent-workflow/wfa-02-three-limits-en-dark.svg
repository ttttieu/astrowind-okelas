<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Conventional automation handles structured data, scripted cases and fixed conditions well, but struggles with unstructured data, exceptions and context-dependent decisions." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three places conventional automation struggles</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Processes with many exceptions or much unstructured data hit a value ceiling quickly.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="350.0" height="292.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="#A78BFA"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Unstructured data</text><text x="80.0" y="231.7" font-size="13" font-weight="700" fill="#5FA0FF" text-anchor="start">Handles well</text><rect x="80.0" y="240.0" width="310.0" height="54.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="235.0" y="272.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Form fields, spreadsheet columns</text><text x="80.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Struggles with</text><rect x="80.0" y="332.0" width="310.0" height="72.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="235.0" y="363.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Free-form emails, document images,</text><text x="235.0" y="382.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">handwritten notes</text><rect x="425.0" y="134.0" width="350.0" height="292.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Exceptions</text><text x="445.0" y="231.7" font-size="13" font-weight="700" fill="#5FA0FF" text-anchor="start">Handles well</text><rect x="445.0" y="240.0" width="310.0" height="54.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="600.0" y="272.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Cases that match the programmed script</text><text x="445.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Struggles with</text><rect x="445.0" y="332.0" width="310.0" height="72.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600.0" y="363.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Cases outside the script: halt, raise an</text><text x="600.0" y="382.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">error, wait for a person</text><rect x="790.0" y="134.0" width="350.0" height="292.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="#A78BFA"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Context-dependent</text><text x="854.0" y="201.8" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">decisions</text><text x="810.0" y="231.7" font-size="13" font-weight="700" fill="#5FA0FF" text-anchor="start">Handles well</text><rect x="810.0" y="240.0" width="310.0" height="54.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="965.0" y="272.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">If X, then Y</text><text x="810.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Struggles with</text><rect x="810.0" y="332.0" width="310.0" height="72.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="965.0" y="363.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Weighing many factors at once and</text><text x="965.0" y="382.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">explaining why</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">More investment in automation for these processes yields diminishing returns.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" width="1200" height="674" role="img" aria-label="Automation answers how to stop doing repetitive work by hand; intelligent workflow answers how to handle work needing context and conditional decisions." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="674" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Automation and intelligent workflow ask different questions</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Two concepts that solve two different layers of problems within the same process.</text><line x1="60.0" y1="612.0" x2="1140.0" y2="612.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="634.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="530.0" height="380.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Automation</text><rect x="84.0" y="196.0" width="482.0" height="96.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="325.0" y="250.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="middle">How do we stop doing repetitive work by hand?</text><rect x="84.0" y="310.0" width="482.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="325.0" y="337.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">If condition A holds, perform action B</text><circle cx="96.0" cy="401.0" r="5" fill="var(--p)"/><text x="112.0" y="407.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Removes typing slips, skipped steps, wrong order</text><circle cx="96.0" cy="441.0" r="5" fill="var(--p)"/><text x="112.0" y="447.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Runs reliably 24/7</text><circle cx="96.0" cy="481.0" r="5" fill="var(--p)"/><text x="112.0" y="487.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Handles volumes faster than people can</text><rect x="610.0" y="134.0" width="530.0" height="380.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="634.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligent workflow</text><rect x="634.0" y="196.0" width="482.0" height="96.0" rx="12" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="875.0" y="238.7" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">How should systems handle work that needs</text><text x="875.0" y="262.4" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">context and conditional decisions?</text><rect x="634.0" y="310.0" width="482.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="875.0" y="337.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Understands context, judges with control</text><circle cx="646.0" cy="401.0" r="5" fill="var(--a)"/><text x="662.0" y="407.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Unstructured data</text><circle cx="646.0" cy="441.0" r="5" fill="var(--a)"/><text x="662.0" y="447.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Controlled exceptions</text><circle cx="646.0" cy="481.0" r="5" fill="var(--a)"/><text x="662.0" y="487.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Explainable decisions</text><rect x="60.0" y="532.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="563.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The two layers do not compete: automation covers the rule-based part, intelligent workflow the</text><text x="600.0" y="587.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">context-heavy part.</text></svg>
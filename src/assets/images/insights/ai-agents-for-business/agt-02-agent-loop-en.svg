<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Five boxes in sequence from goal to report with evidence; a loop arrow returns from evaluating the result to querying when the result is not enough." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agents run in a loop that checks each result</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Batch B2024-09 example: the agent queries, cross-checks and names the missing step.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Batch B2024-09 is a composite illustrative scenario, not real data.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="150.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Goal</text><line x1="244.0" y1="255.0" x2="273.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="281.0,255.0 273.0,259.4 273.0,250.6" fill="var(--p)"/><rect x="285.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="375.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Plan</text><line x1="469.0" y1="255.0" x2="498.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="506.0,255.0 498.0,259.4 498.0,250.6" fill="var(--p)"/><rect x="510.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Call tools, query data</text><line x1="694.0" y1="255.0" x2="723.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="731.0,255.0 723.0,259.4 723.0,250.6" fill="var(--p)"/><rect x="735.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="825.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Evaluate the result</text><line x1="919.0" y1="255.0" x2="948.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="956.0,255.0 948.0,259.4 948.0,250.6" fill="var(--p)"/><rect x="960.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Report with evidence</text><line x1="825.0" y1="312.0" x2="825.0" y2="350.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><line x1="825.0" y1="350.0" x2="600.0" y2="350.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><line x1="600.0" y1="350.0" x2="600.0" y2="322.0" stroke="var(--a)" stroke-width="2"/><polygon points="600.0,314.0 604.4,322.0 595.6,322.0" fill="var(--a)"/><text x="712.5" y="388.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Not enough: loop back to querying, or name the missing step</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Agents can be wrong, and errors can compound across steps; the evaluation step is required.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Four cards: audit preparation, incoming inspection, compliance tracking, approval workflows; the approval card states the agent does not approve." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="584" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four operational tasks an agent can support in a plant</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each task is a participant with bounded permissions and human oversight.</text><line x1="60.0" y1="500.0" x2="1140.0" y2="500.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="522.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four tasks are illustrative examples from the article, not measured deployment results.</text><text x="60.0" y="563.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Audit preparation</text><text x="84.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Reviews records for a period, flags missing or unapproved ones.</text><text x="84.0" y="227.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Outcome: A prioritized gap list</text><rect x="606.0" y="134.0" width="534.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Incoming inspection</text><text x="630.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Checks the supplier against the approved list, verifies COA fields,</text><text x="630.0" y="219.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">confirms the batch is in the production plan.</text><text x="630.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Outcome: A checklist, or a flag for the responsible person</text><rect x="60.0" y="280.0" width="534.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="308.0" r="15" fill="var(--p)"/><text x="90.0" y="313.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="316.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Compliance tracking</text><text x="84.0" y="345.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Monitors equipment inspections, certification renewals and training;</text><text x="84.0" y="365.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sends reminders and alerts on overdue items.</text><text x="84.0" y="392.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Outcome: Reminders and alerts to the right person</text><rect x="606.0" y="280.0" width="534.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="308.0" r="15" fill="var(--gm)"/><text x="636.0" y="313.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="316.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Approval workflows</text><text x="630.0" y="345.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Checks that a change request is complete, identifies who to notify, lists</text><text x="630.0" y="365.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">documents to update.</text><text x="630.0" y="392.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Outcome: The agent does not approve</text><rect x="60.0" y="430.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="463.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Each task has a clear boundary: the agent produces the output, people still decide.</text></svg>
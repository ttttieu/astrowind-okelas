<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Five maturity levels of knowledge management, from knowledge in people’s heads to an organization that learns and improves; Level 3 still does not address tacit knowledge and real operational value starts at Level 4." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five maturity levels of knowledge management</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The right stage depends on where your organization stands today.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Levels 1–5 are OKELAS’s knowledge management maturity scale, separate from the five digitalization levels; a discussion aid, not a certified methodology.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="226.0" width="204.0" height="226.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="76.0" y="255.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Level 1</text><text x="76.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge lives in</text><text x="76.0" y="302.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">people’s heads</text><text x="76.0" y="334.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The answer is “ask A” or</text><text x="76.0" y="352.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">“we’ve always done it</text><text x="76.0" y="371.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">this way”.</text><rect x="279.0" y="214.0" width="204.0" height="238.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="295.0" y="243.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Level 2</text><text x="295.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Basic documentation</text><text x="295.0" y="300.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">SOPs exist but sit in a</text><text x="295.0" y="318.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">drawer: not updated, not</text><text x="295.0" y="337.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">part of daily work.</text><rect x="498.0" y="202.0" width="204.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="231.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Level 3</text><text x="514.0" y="256.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Documents living in</text><text x="514.0" y="278.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">a system</text><text x="514.0" y="310.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Version control, defined</text><text x="514.0" y="328.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">approvers, clarity on what</text><text x="514.0" y="347.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">is in effect.</text><rect x="717.0" y="190.0" width="204.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="219.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Level 4</text><text x="733.0" y="244.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge</text><text x="733.0" y="266.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">connected to</text><text x="733.0" y="289.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">process and context</text><text x="733.0" y="320.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Which documents apply to</text><text x="733.0" y="338.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">which product, conditions</text><text x="733.0" y="357.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and evidence; decisions</text><text x="733.0" y="375.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">can be traced.</text><rect x="936.0" y="178.0" width="204.0" height="274.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="207.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Level 5</text><text x="952.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational</text><text x="952.0" y="254.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">knowledge</text><text x="952.0" y="277.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">that learns</text><text x="952.0" y="308.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Trend analysis and</text><text x="952.0" y="326.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">pattern-based</text><text x="952.0" y="345.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">improvement; AI can take</text><text x="952.0" y="363.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">part meaningfully.</text><line x1="709.5" y1="164.0" x2="709.5" y2="452.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="6 5"/><rect x="389.5" y="122.0" width="640.0" height="42.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="709.5" y="148.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Level 3 still doesn’t address tacit knowledge. Real operational value starts at Level 4.</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Real operational value starts at Level 4, not with the volume of documents.</text></svg>
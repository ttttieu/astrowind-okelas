<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 483" width="1200" height="483" role="img" aria-label="Bốn mảnh riêng đều đúng: SOP mới, biểu mẫu cũ, đào tạo chưa cập nhật, hai khiếu nại xử lý riêng; chưa ai nhìn cả bốn cùng lúc." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="483" class="bgr"/><rect x="60" y="26" width="186" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Bốn mảnh đều đúng, nhưng chưa ai nhìn cả bốn</text><g transform="translate(0 140)"><rect x="60" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">MẢNH 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">SOP mới</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Đúng khi nhìn riêng.</text><rect x="333.5" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="355.5" y="35" font-size="13" font-weight="600" class="mut">MẢNH 2</text><text x="355.5" y="70" font-size="22" font-weight="600" class="tx">Biểu mẫu cũ</text><text x="355.5" y="102" font-size="17" font-weight="400" class="mut">Đúng khi nhìn riêng.</text><rect x="607" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="629" y="35" font-size="13" font-weight="600" class="mut">MẢNH 3</text><text x="629" y="70" font-size="22" font-weight="600" class="tx">Đào tạo chưa</text><text x="629" y="99" font-size="22" font-weight="600" class="tx">cập nhật</text><text x="629" y="131" font-size="17" font-weight="400" class="mut">Đúng khi nhìn riêng.</text><rect x="880.5" y="0" width="259.5" height="160" rx="16" class="bb"/><text x="902.5" y="35" font-size="13" font-weight="600" class="mut">MẢNH 4</text><text x="902.5" y="70" font-size="22" font-weight="600" class="tx">Hai khiếu nại xử lý</text><text x="902.5" y="99" font-size="22" font-weight="600" class="tx">riêng</text><text x="902.5" y="131" font-size="17" font-weight="400" class="mut">Đúng khi nhìn riêng.</text><rect x="60" y="188" width="1080" height="73" rx="16" class="bp"/><text x="82" y="232" font-size="22" font-weight="600" class="tp">Chưa ai nhìn cả bốn mảnh cùng lúc.</text></g><text x="60" y="435" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba dạng bỏ sót: không nhìn thấy, nhìn thấy nhưng đánh giá thấp, nhìn thấy từng mảnh nhưng không nối lại." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba cách một vấn đề bị bỏ sót</text><g transform="translate(0 139.8)"><rect x="60" y="0" width="346.6666666666667" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">DẠNG 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Không nhìn thấy</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Chưa ai rà tới chỗ đó.</text><rect x="426.6666666666667" y="0" width="346.6666666666667" height="184" rx="16" class="bp"/><text x="448.6666666666667" y="35" font-size="13" font-weight="600" class="tp">DẠNG 2</text><text x="448.6666666666667" y="70" font-size="22" font-weight="600" class="tp">Nhìn thấy nhưng đánh</text><text x="448.6666666666667" y="99" font-size="22" font-weight="600" class="tp">giá thấp</text><text x="448.6666666666667" y="131" font-size="17" font-weight="400" class="mut">Đã ghi nhận, rồi xếp vào loại “không</text><text x="448.6666666666667" y="155" font-size="17" font-weight="400" class="mut">đáng kể”.</text><rect x="793.3333333333334" y="0" width="346.6666666666667" height="184" rx="16" class="bp"/><text x="815.3333333333334" y="35" font-size="13" font-weight="600" class="tp">DẠNG 3</text><text x="815.3333333333334" y="70" font-size="22" font-weight="600" class="tp">Thấy từng mảnh, không</text><text x="815.3333333333334" y="99" font-size="22" font-weight="600" class="tp">nối lại</text><text x="815.3333333333334" y="131" font-size="17" font-weight="400" class="mut">Mỗi mảnh vô hại; ghép lại mới nguy</text><text x="815.3333333333334" y="155" font-size="17" font-weight="400" class="mut">hiểm.</text></g><text x="60" y="357.8" font-size="13" font-weight="400" class="mut">Nhận định của OKELAS, không phải kết luận của các nhà nghiên cứu: theo các báo cáo hiện có, PHP2Shell nghiêng về dạng 2 và 3.</text></svg>

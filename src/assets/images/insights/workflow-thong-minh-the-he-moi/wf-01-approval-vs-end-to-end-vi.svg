<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="Approval workflow chỉ phủ phần ai ký và khi nào; end-to-end workflow đi hết vòng đời của một sự kiện nghiệp vụ, từ khiếu nại chất lượng đến cập nhật SOP." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="770" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Approval workflow chỉ là một lát cắt của quy trình</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai cách nhìn một quy trình: chỉ phần ai ký và khi nào, hay toàn bộ vòng đời của sự kiện nghiệp vụ.</text><line x1="60.0" y1="708.0" x2="1140.0" y2="708.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="730.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="140.0" width="440.0" height="470.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="84.0" y="183.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Approval workflow</text><text x="84.0" y="207.8" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="start">Ai ký, khi nào</text><text x="84.0" y="359.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Tập trung vào chữ ký và trạng thái duyệt /</text><text x="84.0" y="380.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">không duyệt</text><line x1="84.0" y1="398.0" x2="476.0" y2="398.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="437.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Một biểu mẫu, một chuỗi người ký</text><line x1="84.0" y1="466.0" x2="476.0" y2="466.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="505.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Kết thúc khi được duyệt</text><line x1="84.0" y1="534.0" x2="476.0" y2="534.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="573.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Dễ triển khai, giá trị giới hạn</text><rect x="530.0" y="140.0" width="610.0" height="470.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="554.0" y="183.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">End-to-end workflow</text><text x="554.0" y="207.8" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="start">Cả vòng đời của sự kiện</text><text x="554.0" y="369.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Toàn bộ vòng đời của một sự kiện nghiệp vụ</text><line x1="554.0" y1="398.0" x2="1116.0" y2="398.0" stroke="var(--line)" stroke-width="1"/><text x="554.0" y="437.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Nhiều biểu mẫu, nhiều loại evidence, nhiều hệ thống</text><line x1="554.0" y1="466.0" x2="1116.0" y2="466.0" stroke="var(--line)" stroke-width="1"/><text x="554.0" y="505.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Kết thúc khi vấn đề gốc được giải quyết và có bằng chứng</text><line x1="554.0" y1="534.0" x2="1116.0" y2="534.0" stroke="var(--line)" stroke-width="1"/><text x="554.0" y="573.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Khó triển khai hơn, nhưng phản ánh đúng cách doanh nghiệp vận hành</text><rect x="84.0" y="240.0" width="108.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="138.0" y="280.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Biểu mẫu</text><line x1="195.0" y1="275.0" x2="205.0" y2="275.0" stroke="var(--gm)" stroke-width="2"/><polygon points="213.0,275.0 205.0,279.4 205.0,270.6" fill="var(--gm)"/><rect x="216.0" y="240.0" width="108.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="270.0" y="270.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuỗi</text><text x="270.0" y="289.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">người ký</text><line x1="327.0" y1="275.0" x2="337.0" y2="275.0" stroke="var(--gm)" stroke-width="2"/><polygon points="345.0,275.0 337.0,279.4 337.0,270.6" fill="var(--gm)"/><rect x="348.0" y="240.0" width="108.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="402.0" y="270.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Duyệt /</text><text x="402.0" y="289.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">không duyệt</text><rect x="554.0" y="240.0" width="98.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="603.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Khiếu nại</text><text x="603.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">chất lượng</text><line x1="655.0" y1="275.0" x2="659.0" y2="275.0" stroke="var(--p)" stroke-width="2"/><polygon points="667.0,275.0 659.0,279.4 659.0,270.6" fill="var(--p)"/><rect x="670.0" y="240.0" width="98.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="719.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Điều tra</text><text x="719.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">nguyên nhân</text><line x1="771.0" y1="275.0" x2="775.0" y2="275.0" stroke="var(--p)" stroke-width="2"/><polygon points="783.0,275.0 775.0,279.4 775.0,270.6" fill="var(--p)"/><rect x="786.0" y="240.0" width="98.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="835.0" y="271.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Hành động</text><text x="835.0" y="288.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">khắc phục</text><line x1="887.0" y1="275.0" x2="891.0" y2="275.0" stroke="var(--p)" stroke-width="2"/><polygon points="899.0,275.0 891.0,279.4 891.0,270.6" fill="var(--p)"/><rect x="902.0" y="240.0" width="98.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="951.0" y="279.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Đóng hồ sơ</text><line x1="1003.0" y1="275.0" x2="1007.0" y2="275.0" stroke="var(--p)" stroke-width="2"/><polygon points="1015.0,275.0 1007.0,279.4 1007.0,270.6" fill="var(--p)"/><rect x="1018.0" y="240.0" width="98.0" height="70.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="1067.0" y="279.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Cập nhật SOP</text><rect x="1007.0" y="160.0" width="109.0" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1061.5" y="176.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="626.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="659.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Có thể có hàng chục approval workflow mà vẫn thiếu một workflow end-to-end cho quy trình cốt lõi.</text></svg>
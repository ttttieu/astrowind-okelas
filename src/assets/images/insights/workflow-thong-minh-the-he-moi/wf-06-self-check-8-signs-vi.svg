<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="Tám dấu hiệu cho thấy workflow dừng ở thế hệ cũ; từ 5/8 dấu hiệu trở lên thì vấn đề nằm ở kiến trúc workflow, không phải thiếu công cụ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="770" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tám dấu hiệu workflow đang dừng ở thế hệ cũ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đánh dấu những gì doanh nghiệp bạn đang gặp.</text><line x1="60.0" y1="708.0" x2="1140.0" y2="708.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="730.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân loại và khung trong hình là cách trình bày của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="132.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="182.0" r="17" fill="var(--p)"/><text x="96.0" y="188.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="187.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Vẫn cần một người nhắc việc để quy trình không đứng lại.</text><rect x="610.0" y="132.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="182.0" r="17" fill="var(--p)"/><text x="646.0" y="188.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="676.0" y="177.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Có ngoại lệ là mọi thứ quay về email hoặc tin nhắn</text><text x="676.0" y="198.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">cá nhân.</text><rect x="60.0" y="250.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="300.0" r="17" fill="var(--p)"/><text x="96.0" y="306.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="295.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Người duyệt bước sau không có đủ ngữ cảnh của các</text><text x="126.0" y="316.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">bước trước.</text><rect x="610.0" y="250.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="300.0" r="17" fill="var(--p)"/><text x="646.0" y="306.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="676.0" y="295.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không trả lời ngay được yêu cầu đang ở đâu, vì sao chậm,</text><text x="676.0" y="316.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">nếu không hỏi người phụ trách.</text><rect x="60.0" y="368.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="418.0" r="17" fill="var(--p)"/><text x="96.0" y="424.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="126.0" y="413.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow chỉ chạy khi có người bấm, không tự phản ứng</text><text x="126.0" y="434.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">với sự kiện thực tế.</text><rect x="610.0" y="368.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="418.0" r="17" fill="var(--p)"/><text x="646.0" y="424.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="676.0" y="413.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Một quy trình quan trọng (khiếu nại, thay đổi kỹ thuật, sự</text><text x="676.0" y="434.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">cố chất lượng) chưa được mô hình hóa end-to-end.</text><rect x="60.0" y="486.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="536.0" r="17" fill="var(--p)"/><text x="96.0" y="542.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="126.0" y="531.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Đã thử AI ở đâu đó nhưng không gắn với một workflow</text><text x="126.0" y="552.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">cụ thể.</text><rect x="610.0" y="486.0" width="530.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="646.0" cy="536.0" r="17" fill="var(--p)"/><text x="646.0" y="542.2" font-size="17" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="676.0" y="531.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không giải thích lại được một quyết định vận hành từ ba</text><text x="676.0" y="552.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">tháng trước, kèm evidence.</text><rect x="60.0" y="610.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="641.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ 5/8 dấu hiệu trở lên: vấn đề nhiều khả năng nằm ở kiến trúc và mức trưởng thành của workflow, không phải ở</text><text x="600.0" y="665.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">việc thiếu công cụ.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Visibility là tiêu chí đánh giá workflow có phục vụ người dùng hay không, thay vì tính năng cần thêm hoặc yêu cầu nhân viên bỏ Excel bằng ý chí." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="560" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Visibility là tiêu chí đánh giá, không phải tính năng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một hệ thống có visibility tốt khiến việc làm Excel riêng trở nên không cần thiết.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="140.0" width="440.0" height="280.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="160.0" width="151.4" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.2"/><text x="159.7" y="176.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Cách nhìn thường gặp</text><text x="84.0" y="261.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Coi visibility là tính năng cần thêm</text><text x="84.0" y="297.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Yêu cầu nhân viên bỏ thói quen Excel bằng ý chí.</text><line x1="508.0" y1="280.0" x2="547.0" y2="280.0" stroke="var(--p)" stroke-width="3"/><polygon points="558.0,280.0 547.0,286.1 547.0,273.9" fill="var(--p)"/><rect x="566.0" y="140.0" width="574.0" height="280.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="590.0" y="160.0" width="126.6" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="653.3" y="176.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Cách nhìn của bài</text><text x="590.0" y="225.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Coi visibility là tiêu chí đánh giá</text><text x="590.0" y="256.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow hiện tại có thực sự phục vụ người dùng không?</text><rect x="590.0" y="288.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="310.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Dễ tra cứu</text><rect x="590.0" y="328.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="350.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đủ ngữ cảnh</text><rect x="590.0" y="368.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="390.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đúng cách người dùng cần</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hệ thống tốt làm Excel riêng trở nên không cần thiết, nhân viên không phải cố bỏ nó.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Ba dấu hiệu thiếu visibility: có file Excel theo dõi riêng, câu hỏi việc này tới đâu rồi xuất hiện thường xuyên, và không tra cứu được việc của người nghỉ phép." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba dấu hiệu doanh nghiệp đang có visibility gap</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nếu cả ba dấu hiệu đều đúng, vấn đề không nằm ở việc nhân viên chưa quen dùng phần mềm.</text><line x1="60.0" y1="530.0" x2="1140.0" y2="530.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="552.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba dấu hiệu là gợi ý của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><rect x="60.0" y="134.0" width="1080.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><rect x="84.0" y="167.0" width="30.0" height="30.0" rx="6" fill="var(--bg)" stroke="var(--a)" stroke-width="2.5"/><text x="134.0" y="188.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Có ít nhất một nhân viên duy trì file Excel riêng để theo dõi trạng thái công việc, song song với phần mềm chính thức.</text><rect x="60.0" y="244.0" width="1080.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><rect x="84.0" y="277.0" width="30.0" height="30.0" rx="6" fill="var(--bg)" stroke="var(--a)" stroke-width="2.5"/><text x="134.0" y="298.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Câu hỏi “việc này tới đâu rồi?” xuất hiện thường xuyên trong email hoặc chat nội bộ dù workflow đang chạy.</text><rect x="60.0" y="354.0" width="1080.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><rect x="84.0" y="387.0" width="30.0" height="30.0" rx="6" fill="var(--bg)" stroke="var(--a)" stroke-width="2.5"/><text x="134.0" y="408.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Khi một người nghỉ phép, người khác không tra cứu ngay được tình trạng việc họ phụ trách mà không cần hỏi.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba đều đúng: hệ thống chưa đủ visibility để họ tin tưởng và bỏ cách theo dõi thủ công.</text></svg>
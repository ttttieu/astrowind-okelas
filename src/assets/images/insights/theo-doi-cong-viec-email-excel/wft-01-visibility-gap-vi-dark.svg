<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Visibility gap là khoảng trống giữa những gì hệ thống ghi nhận và những gì người dùng cần biết, nên họ tự lập hệ thống theo dõi song song bằng Excel, email, Zalo." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Visibility gap: khoảng trống giữa ghi nhận và nhu cầu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Nhân viên không thiếu tin tưởng công nghệ; họ phản ứng hợp lý khi hệ thống không cho đủ thứ họ cần.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="380.0" height="214.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống ghi nhận</text><rect x="84.0" y="196.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="250.0" y="220.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đã duyệt</text><rect x="84.0" y="244.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="250.0" y="268.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Chưa duyệt</text><rect x="84.0" y="292.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="250.0" y="316.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đang chờ ai</text><rect x="460.0" y="134.0" width="280.0" height="214.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="480.0" y="173.1" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="start">Visibility gap</text><text x="480.0" y="200.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Thông tin có đó nhưng:</text><rect x="480.0" y="216.0" width="240.0" height="34.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="600.0" y="237.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Khó tra cứu</text><rect x="480.0" y="258.0" width="240.0" height="34.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="600.0" y="279.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Thiếu ngữ cảnh</text><rect x="480.0" y="300.0" width="240.0" height="34.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="600.0" y="321.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Hiển thị không đúng cách</text><rect x="760.0" y="134.0" width="380.0" height="214.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="784.0" y="173.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Người cần biết để làm việc</text><rect x="784.0" y="196.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="950.0" y="220.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Dễ tra cứu</text><rect x="784.0" y="244.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="950.0" y="268.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đủ ngữ cảnh</text><rect x="784.0" y="292.0" width="332.0" height="38.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="950.0" y="316.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đúng cách, đúng lúc</text><line x1="600.0" y1="352.0" x2="600.0" y2="369.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="600.0,378.0 595.0,369.0 605.0,369.0" fill="#A78BFA"/><rect x="60.0" y="382.0" width="1080.0" height="104.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="419.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Họ tự lập hệ thống theo dõi song song</text><rect x="84.0" y="436.0" width="176.0" height="38.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="172.0" y="460.1" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">Excel</text><rect x="274.0" y="436.0" width="176.0" height="38.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="362.0" y="460.1" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">Email</text><rect x="464.0" y="436.0" width="176.0" height="38.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="552.0" y="460.1" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">Nhóm chat</text><rect x="60.0" y="504.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="537.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Đây là phản ứng hợp lý khi hệ thống chính thức không cung cấp đủ, không phải do nhân viên thích làm thủ công.</text></svg>
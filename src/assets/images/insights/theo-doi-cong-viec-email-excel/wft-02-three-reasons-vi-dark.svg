<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Ba lý do workflow tool chưa đủ: chỉ thấy trạng thái của riêng nó, không tiện nhìn nhanh, không chủ động báo; nhân viên bù lại bằng Excel, lướt bảng hoặc hỏi qua email và chat." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="634" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba lý do workflow tool chưa đủ, và nhân viên làm gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Nhiều phần mềm workflow chỉ quản lý một bước duyệt, không quản lý cả bức tranh công việc.</text><line x1="60.0" y1="572.0" x2="1140.0" y2="572.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="594.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Lý do</text><text x="840.0" y="141.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Nhân viên làm gì</text><rect x="60.0" y="152.0" width="740.0" height="104.0" rx="14" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="92.0" cy="186.0" r="15" fill="#A78BFA"/><text x="92.0" y="191.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="120.0" y="187.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Chỉ thấy trạng thái của riêng nó</text><text x="120.0" y="212.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Việc nằm rải rác ở workflow duyệt, ERP, group chat; không hệ thống nào cho bức tranh tổng thể.</text><line x1="808.0" y1="204.0" x2="827.0" y2="204.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="836.0,204.0 827.0,208.9 827.0,199.1" fill="#A78BFA"/><rect x="844.0" y="152.0" width="296.0" height="104.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="992.0" y="210.2" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="middle">Tự gom vào Excel</text><rect x="60.0" y="270.0" width="740.0" height="104.0" rx="14" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="92.0" cy="304.0" r="15" fill="#A78BFA"/><text x="92.0" y="309.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="120.0" y="305.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Không thiết kế để nhìn nhanh biết ngay</text><text x="120.0" y="330.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mỗi yêu cầu cần vài cú click; với hàng chục việc mỗi ngày, lướt một bảng nhanh hơn.</text><line x1="808.0" y1="322.0" x2="827.0" y2="322.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="836.0,322.0 827.0,326.9 827.0,317.1" fill="#A78BFA"/><rect x="844.0" y="270.0" width="296.0" height="104.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="992.0" y="328.2" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="middle">Lướt bảng Excel</text><rect x="60.0" y="388.0" width="740.0" height="104.0" rx="14" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="92.0" cy="422.0" r="15" fill="#A78BFA"/><text x="92.0" y="427.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="120.0" y="423.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Không chủ động báo khi cần chú ý</text><text x="120.0" y="448.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Yêu cầu treo quá lâu nhưng không tự cảnh báo; người dùng phải vào kiểm tra.</text><line x1="808.0" y1="440.0" x2="827.0" y2="440.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="836.0,440.0 827.0,444.9 827.0,435.1" fill="#A78BFA"/><rect x="844.0" y="388.0" width="296.0" height="104.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="992.0" y="446.2" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="middle">Hỏi qua email hoặc chat</text><rect x="60.0" y="512.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="545.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Cả ba là khoảng trống của hệ thống, không phải thói quen của nhân viên.</text></svg>
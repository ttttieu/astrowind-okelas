<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Năm cấp trưởng thành của knowledge management từ tri thức trong đầu người đến tổ chức biết học và cải tiến; cấp 3 chưa giải quyết tri thức ngầm và giá trị vận hành thực sự bắt đầu từ cấp 4." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm cấp trưởng thành của knowledge management</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giai đoạn đúng phụ thuộc vào nơi doanh nghiệp đang đứng.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cấp 1–5 là thang knowledge management maturity của OKELAS, tách biệt với 5 cấp độ số hóa; là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="226.0" width="204.0" height="226.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="76.0" y="255.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Cấp 1</text><text x="76.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức nằm</text><text x="76.0" y="302.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">trong đầu người</text><text x="76.0" y="334.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Câu trả lời thường là “anh A</text><text x="76.0" y="352.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">biết” hoặc “từ trước đến</text><text x="76.0" y="371.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nay vẫn làm vậy”.</text><rect x="279.0" y="214.0" width="204.0" height="238.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="295.0" y="243.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Cấp 2</text><text x="295.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu hóa cơ bản</text><text x="295.0" y="300.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Có SOP nhưng để trong</text><text x="295.0" y="318.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">ngăn kéo, không cập nhật,</text><text x="295.0" y="337.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">không gắn vào vận hành.</text><rect x="498.0" y="202.0" width="204.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="231.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Cấp 3</text><text x="514.0" y="256.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu sống</text><text x="514.0" y="278.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">trong hệ thống</text><text x="514.0" y="310.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Kiểm soát phiên bản, có</text><text x="514.0" y="328.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">người phê duyệt, biết</text><text x="514.0" y="347.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tài liệu nào đang có</text><text x="514.0" y="365.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hiệu lực.</text><rect x="717.0" y="190.0" width="204.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="219.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Cấp 4</text><text x="733.0" y="244.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức gắn với</text><text x="733.0" y="266.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">quy trình và context</text><text x="733.0" y="298.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Biết tài liệu áp dụng cho</text><text x="733.0" y="316.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">sản phẩm, điều kiện, bằng</text><text x="733.0" y="335.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chứng nào; truy vết được</text><text x="733.0" y="353.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định.</text><rect x="936.0" y="178.0" width="204.0" height="274.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="207.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Cấp 5</text><text x="952.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức tổ chức biết</text><text x="952.0" y="254.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">học và cải tiến</text><text x="952.0" y="286.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Phân tích xu hướng, cải</text><text x="952.0" y="304.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tiến theo mẫu hình; AI có</text><text x="952.0" y="323.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thể tham gia có ý nghĩa.</text><line x1="709.5" y1="164.0" x2="709.5" y2="452.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="6 5"/><rect x="389.5" y="122.0" width="640.0" height="42.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="709.5" y="148.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cấp 3 chưa giải quyết tri thức ngầm. Từ cấp 4 mới có giá trị vận hành thực sự.</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giá trị vận hành thực sự bắt đầu từ cấp 4, không phải từ số lượng tài liệu.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Hai làn: prompt-response có một điểm người quyết định; agent có chuỗi bước liên tiếp trước khi người xem lại." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Rủi ro nằm ở số điểm quyết định không có người kiểm soát</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Rủi ro đến từ các bước liên tiếp không có điểm người duyệt, không phải từ việc mô hình kém thông minh hơn.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích theo bài viết; số điểm quyết định là khái niệm, không phải thang đo hay số liệu đo lường.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="150.0" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Prompt → Response</text><rect x="60.0" y="164.0" width="300.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="210.0" y="199.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô hình trả lời</text><line x1="366.0" y1="194.0" x2="403.0" y2="194.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="412.0,194.0 403.0,198.9 403.0,189.1" fill="var(--p)"/><rect x="420.0" y="164.0" width="300.0" height="60.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="570.0" y="199.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Người quyết định</text><text x="60.0" y="296.0" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Goal → Plan → Tool → Action</text><rect x="60.0" y="310.0" width="120.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="120.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước 1</text><line x1="186.0" y1="340.0" x2="185.0" y2="340.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="194.0,340.0 185.0,344.9 185.0,335.1" fill="var(--p)"/><rect x="200.0" y="310.0" width="120.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="260.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước 2</text><line x1="326.0" y1="340.0" x2="325.0" y2="340.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="334.0,340.0 325.0,344.9 325.0,335.1" fill="var(--p)"/><rect x="340.0" y="310.0" width="120.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="400.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước 3</text><line x1="466.0" y1="340.0" x2="465.0" y2="340.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="474.0,340.0 465.0,344.9 465.0,335.1" fill="var(--p)"/><rect x="480.0" y="310.0" width="120.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="540.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước n</text><line x1="606.0" y1="340.0" x2="767.0" y2="340.0" stroke="var(--a)" stroke-width="2.4"/><polygon points="776.0,340.0 767.0,344.9 767.0,335.1" fill="var(--a)"/><rect x="780.0" y="310.0" width="180.0" height="60.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="870.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Người xem lại</text><text x="330.0" y="403.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Nhiều bước liên tiếp, không có điểm người duyệt</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mô hình prompt – response có một điểm kiểm soát; agent có thể chạy nhiều bước trước khi người xem lại.</text></svg>
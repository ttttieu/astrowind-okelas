<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-label="Two ends of one chain: frontier safety research on the left, enterprise AI governance on the right, joined by an arrow and a box in the middle." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="562" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Frontier research and enterprise governance: one continuum</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The two ends of one chain: frontier safety research and enterprise AI governance.</text><line x1="60.0" y1="478.0" x2="1140.0" y2="478.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="500.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Continuum per the article; businesses can reuse existing conclusions rather than research from scratch.</text><text x="60.0" y="541.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><line x1="120.0" y1="230.0" x2="1080.0" y2="230.0" stroke="var(--gm)" stroke-width="4"/><rect x="60.0" y="170.0" width="300.0" height="120.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="236.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Frontier safety research</text><rect x="840.0" y="170.0" width="300.0" height="120.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="990.0" y="236.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Enterprise AI governance</text><rect x="400.0" y="200.0" width="400.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">One principle, different scale</text><rect x="400.0" y="300.0" width="400.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="333.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Businesses reuse existing conclusions</text><rect x="60.0" y="408.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="441.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Businesses do not need to research from scratch.</text></svg>
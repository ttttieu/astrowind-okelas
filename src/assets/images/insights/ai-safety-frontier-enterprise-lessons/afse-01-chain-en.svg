<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Three boxes joined by arrows: capability, autonomy, control difficulty; the last box is highlighted." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Capability growth must be matched by control</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each step up in autonomy makes control harder, so the two must rise together.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chain per the article; the arrows and the emphasis on the control box are OKELAS’s presentation.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="300.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="253.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="middle">Capability ↑</text><line x1="366.0" y1="245.0" x2="372.0" y2="245.0" stroke="var(--gm)" stroke-width="3"/><polygon points="384.0,245.0 372.0,251.6 372.0,238.4" fill="var(--gm)"/><rect x="390.0" y="170.0" width="300.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="540.0" y="253.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="middle">Autonomy ↑</text><line x1="696.0" y1="245.0" x2="702.0" y2="245.0" stroke="var(--gm)" stroke-width="3"/><polygon points="714.0,245.0 702.0,251.6 702.0,238.4" fill="var(--gm)"/><rect x="720.0" y="170.0" width="300.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="870.0" y="253.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">Control difficulty ↑</text><rect x="60.0" y="372.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="405.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Capability should not rise without a matching rise in control measures.</text></svg>
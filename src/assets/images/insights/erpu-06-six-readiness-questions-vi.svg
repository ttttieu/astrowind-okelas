<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-label="Sáu câu hỏi tự đánh giá mức sẵn sàng change management: thông tin dự án, lợi ích theo nhóm người dùng, đào tạo thực hành, super user, cam kết của lãnh đạo và kênh hỗ trợ sau go-live." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="508" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu câu hỏi: đã sẵn sàng cho change management chưa?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tự đánh giá trước go-live.</text><line x1="60.0" y1="424.0" x2="1140.0" y2="424.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="446.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá từ bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="487.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="181.0" r="15" fill="var(--p)"/><text x="92.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="165.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân viên có biết dự án đang ở đâu</text><text x="120.0" y="186.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">và ảnh hưởng đến công việc của họ</text><text x="120.0" y="207.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ra sao?</text><rect x="425.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="181.0" r="15" fill="var(--p)"/><text x="457.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="485.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có giải thích được lợi ích cụ thể cho</text><text x="485.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">từng nhóm người dùng không?</text><rect x="790.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="181.0" r="15" fill="var(--p)"/><text x="822.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="850.0" y="165.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có kế hoạch đào tạo thực</text><text x="850.0" y="186.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">hành, không chỉ demo, trước</text><text x="850.0" y="207.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">go-live không?</text><rect x="60.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="290.0" r="15" fill="var(--p)"/><text x="92.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="295.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Mỗi bộ phận đã có super user chưa?</text><rect x="425.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="290.0" r="15" fill="var(--p)"/><text x="457.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="485.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lãnh đạo có cam kết dùng ERP để</text><text x="485.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ra quyết định sau go-live không?</text><rect x="790.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="290.0" r="15" fill="var(--p)"/><text x="822.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="850.0" y="274.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có kênh hỗ trợ rõ ràng khi</text><text x="850.0" y="295.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">người dùng gặp vấn đề sau</text><text x="850.0" y="316.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">go-live không?</text><rect x="60.0" y="353.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="386.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nhiều câu trả lời “không”: cần chuẩn bị thêm trước go-live.</text></svg>
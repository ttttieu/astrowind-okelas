<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Năm nhóm cần kiểm tra trước ERP, mỗi nhóm một câu hỏi đại diện: sản phẩm/SKU, nhà cung cấp và khách hàng, tồn kho, kế toán và quản trị dữ liệu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm nhóm cần kiểm tra trước khi bắt đầu ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi nhóm kèm một câu hỏi đại diện cho checklist đầy đủ trong bài.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá từ bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Sản phẩm/SKU</text><text x="76.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Danh mục được quản lý</text><text x="76.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tập trung hay rải rác?</text><rect x="279.0" y="134.0" width="204.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="295.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhà cung cấp</text><text x="295.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">và khách hàng</text><text x="295.0" y="225.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có bản ghi trùng</text><text x="295.0" y="245.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lặp không?</text><rect x="498.0" y="134.0" width="204.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tồn kho</text><text x="514.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tồn kho sổ sách có</text><text x="514.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">được đối chiếu thực tế</text><text x="514.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">định kỳ không?</text><rect x="717.0" y="134.0" width="204.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Kế toán</text><text x="733.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chart of accounts đã</text><text x="733.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phù hợp yêu cầu báo</text><text x="733.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cáo chưa?</text><rect x="936.0" y="134.0" width="204.0" height="136.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quản trị dữ liệu</text><text x="952.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Có người hoặc bộ phận</text><text x="952.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chịu trách nhiệm chất</text><text x="952.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lượng dữ liệu không?</text><rect x="60.0" y="286.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="319.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nhiều câu trả lời “không” hoặc “không chắc”: cần thêm thời gian chuẩn bị dữ liệu.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Ba cột vùng rủi ro: vùng thấp, vùng trung bình, vùng cao; mỗi cột có ví dụ và yêu cầu governance tương ứng, vùng cao vẽ nét đứt." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba vùng rủi ro: rủi ro tăng theo mức ảnh hưởng tới sản phẩm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Vùng càng gần quyết định sản phẩm, governance càng phải chặt.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba vùng là cách phân loại theo bài viết, không phải tiêu chuẩn chính thức; yêu cầu cụ thể phụ thuộc tiêu chuẩn và cơ quan chứng nhận.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="194.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vùng thấp</text><text x="84.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: email nội bộ, dịch thuật thông</text><text x="84.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thường, chuẩn bị slide.</text><text x="84.0" y="299.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: chính sách AI cơ bản;</text><text x="84.0" y="319.7" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">dữ liệu không đưa ra công cụ bên ngoài.</text><rect x="426.0" y="176.0" width="340.0" height="194.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="450.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vùng trung bình</text><text x="450.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: tra cứu SOP, chatbot tìm</text><text x="450.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thông tin, tóm tắt báo cáo kiểm tra.</text><text x="450.0" y="299.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: phạm vi rõ, điểm</text><text x="450.0" y="319.7" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">review của con người, tài liệu gốc</text><text x="450.0" y="339.5" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">vẫn có thẩm quyền.</text><rect x="792.0" y="176.0" width="340.0" height="194.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="816.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vùng cao</text><text x="816.0" y="248.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: gợi ý pass/fail, hỗ trợ xuất kho,</text><text x="816.0" y="269.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">gợi ý thay đổi thông số quy trình.</text><text x="816.0" y="299.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Governance: validation theo tiêu chuẩn,</text><text x="816.0" y="319.7" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">audit trail đầy đủ, human sign-off bắt</text><text x="816.0" y="339.5" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">buộc, đánh giá định kỳ.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Vùng cao không có nghĩa là không được dùng AI; nghĩa là phải có đủ kiểm soát trước khi dùng.</text></svg>
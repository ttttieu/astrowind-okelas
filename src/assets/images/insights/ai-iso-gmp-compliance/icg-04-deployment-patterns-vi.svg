<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Ba hàng: mỗi kiểu triển khai ở bên trái dẫn sang hệ quả tương ứng ở bên phải." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Rủi ro đến từ cách triển khai, không chỉ từ AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba cách triển khai phổ biến và hệ quả của từng cách.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Các kiểu triển khai là minh họa theo bài viết, không phải số liệu đo lường.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="500.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="208.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI được dùng khi chưa rõ phạm vi, chưa có chính sách</text><text x="80.0" y="232.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">hay đào tạo</text><line x1="568.0" y1="214.0" x2="603.0" y2="214.0" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,214.0 603.0,218.9 603.0,209.1" fill="var(--p)"/><rect x="620.0" y="170.0" width="520.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="219.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Bộ phận Quality không nắm được AI đang được dùng ở đâu.</text><rect x="60.0" y="272.0" width="500.0" height="83.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="319.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Output AI đi thẳng vào hệ thống tài liệu chính thức</text><line x1="568.0" y1="313.5" x2="603.0" y2="313.5" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,313.5 603.0,318.4 603.0,308.6" fill="var(--p)"/><rect x="620.0" y="272.0" width="520.0" height="83.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="308.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chưa qua phê duyệt chuẩn; có thể chứa lỗi mà người có</text><text x="640.0" y="329.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kinh nghiệm sẽ phát hiện.</text><rect x="60.0" y="369.0" width="500.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="407.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI tham gia quy trình compliance nhưng không để lại</text><text x="80.0" y="431.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">audit trail</text><line x1="568.0" y1="413.0" x2="603.0" y2="413.0" stroke="var(--p)" stroke-width="2.2"/><polygon points="612.0,413.0 603.0,417.9 603.0,408.1" fill="var(--p)"/><rect x="620.0" y="369.0" width="520.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="418.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Khoảng trống trong hồ sơ, dù kết quả đúng.</text><rect x="60.0" y="485.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="518.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mỗi kiểu triển khai đều có thể xảy ra mà không ai trong tổ chức nhận ra ngay.</text></svg>
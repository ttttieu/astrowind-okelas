<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 522" width="1200" height="522" role="img" aria-label="Ba cột loại công cụ: chatbot cá nhân, API có kiểm soát lưu giữ dữ liệu, AI on-premise; mỗi cột có ý nghĩa compliance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="522" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phân biệt công cụ AI để biết dữ liệu đi đâu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Với dữ liệu về công thức, quy trình hay khách hàng, loại công cụ quyết định mức rủi ro compliance.</text><line x1="60.0" y1="438.0" x2="1140.0" y2="438.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="460.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân loại công cụ theo bài viết, không phải đánh giá về nhà cung cấp cụ thể.</text><text x="60.0" y="501.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="148.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot cá nhân trên trình duyệt</text><text x="84.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ý nghĩa compliance: Dữ liệu nhập</text><text x="84.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">vào có thể được dùng để huấn luyện</text><text x="84.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">mô hình.</text><rect x="426.0" y="176.0" width="340.0" height="148.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="450.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">API có kiểm soát lưu giữ dữ liệu</text><text x="450.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ý nghĩa compliance: Phạm vi lưu và xử</text><text x="450.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">lý dữ liệu có thể cấu hình và kiểm soát.</text><rect x="792.0" y="176.0" width="340.0" height="148.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="816.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI triển khai on-premise</text><text x="816.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ý nghĩa compliance: Dữ liệu không chia</text><text x="816.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">sẻ ra bên ngoài tổ chức.</text><rect x="60.0" y="368.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="401.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điều khoản thực tế của từng nhà cung cấp cần được kiểm tra trước khi đưa dữ liệu nhạy cảm vào.</text></svg>
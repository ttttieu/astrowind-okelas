<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Ba thẻ so sánh: mô hình tự báo cáo và tài liệu chính sách ghi “Không đủ”; lớp kiểm soát lúc chạy ghi “Cần thiết”." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chính sách không tự thực thi: cần một lớp riêng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Kiểm soát không nên dựa vào mô hình tự báo cáo, cũng không dừng ở tài liệu chính sách.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba lựa chọn so sánh theo bài viết; nhãn “Không đủ” và “Cần thiết” là đánh giá của OKELAS.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Mô hình tự báo cáo</text><text x="84.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Cơ chế kiểm soát không nên dựa</text><text x="84.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">vào khả năng tự báo cáo của chính</text><text x="84.0" y="282.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">mô hình.</text><rect x="84.0" y="330.0" width="100.3" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="134.1" y="352.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Không đủ</text><rect x="426.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="450.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu chính sách</text><text x="450.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Chính sách trên giấy không tự thực thi</text><text x="450.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">chính nó.</text><rect x="450.0" y="330.0" width="100.3" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="500.1" y="352.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Không đủ</text><rect x="792.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="816.0" y="180.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Lớp kiểm soát lúc chạy</text><text x="816.0" y="237.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Kiểm tra kỹ thuật ngay tại thời điểm</text><text x="816.0" y="259.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">mỗi hành động xảy ra.</text><rect x="816.0" y="330.0" width="95.7" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="863.9" y="352.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Cần thiết</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Kiểm soát cần một lớp kỹ thuật tại thời điểm hành động, không chỉ là lời hứa hay tài liệu.</text></svg>
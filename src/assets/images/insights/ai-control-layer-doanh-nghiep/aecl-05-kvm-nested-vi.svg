<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img" aria-label="Khung control layer bao ngoài, KVM nằm trong với ba thao tác Trace, FindEvidence, Resolve." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="588" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM là một phần của control layer, không phải tất cả</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">KVM xử lý phần truy cập tri thức tổ chức; phần còn lại thuộc control layer.</text><line x1="60.0" y1="504.0" x2="1140.0" y2="504.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="526.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ lồng nhau minh họa quan hệ theo bài viết; bài tiếp theo trong loạt sẽ nói chi tiết về KVM.</text><text x="60.0" y="567.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="270.0" rx="18" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="170.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Control layer (toàn bộ)</text><rect x="260.0" y="190.0" width="680.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="284.0" y="226.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">KVM: phần truy cập tri thức tổ chức</text><rect x="284.0" y="250.0" width="170.0" height="46.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="369.0" y="278.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Trace</text><rect x="474.0" y="250.0" width="170.0" height="46.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="559.0" y="278.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">FindEvidence</text><rect x="664.0" y="250.0" width="170.0" height="46.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="749.0" y="278.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Resolve</text><text x="284.0" y="334.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thao tác xác định trước; không đọc dữ liệu thô và không tự quyết định đâu là sự thật.</text><rect x="60.0" y="434.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="467.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM không phải toàn bộ control layer, và không phải sandbox.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Bốn thẻ chức năng được đánh số, mỗi thẻ có nhãn trụ cột tương ứng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lớp kiểm soát làm bốn việc, ánh xạ tới bốn trụ cột</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn chức năng bài viết nêu, đi cùng bốn trụ cột của loạt bài trước.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn chức năng theo bài viết; cặp ánh xạ với trụ cột do OKELAS suy ra, bài không liệt kê cặp này.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="174.0" r="15" fill="var(--gm)"/><text x="100.0" y="179.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="140.0" y="176.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Xác thực định danh và thẩm quyền trước mỗi</text><text x="140.0" y="201.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">hành động</text><rect x="140.0" y="230.0" width="130.8" height="32.0" rx="16.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="205.4" y="251.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Authorization</text><rect x="612.0" y="134.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="652.0" cy="174.0" r="15" fill="var(--p)"/><text x="652.0" y="179.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="692.0" y="176.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm tra hành động theo tầng quyền Read,</text><text x="692.0" y="201.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Request, Recommend, Execute</text><rect x="692.0" y="230.0" width="101.1" height="32.0" rx="16.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="742.6" y="251.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Boundary</text><rect x="60.0" y="290.0" width="528.0" height="140.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="330.0" r="15" fill="var(--gm)"/><text x="100.0" y="335.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="140.0" y="332.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi evidence cho mọi hành động, không phụ</text><text x="140.0" y="357.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">thuộc vào agent</text><rect x="140.0" y="386.0" width="97.4" height="32.0" rx="16.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="188.7" y="407.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Evidence</text><rect x="612.0" y="290.0" width="528.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="652.0" cy="330.0" r="15" fill="var(--p)"/><text x="652.0" y="335.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="692.0" y="332.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm để audit và thu hồi quyền mà không cần</text><text x="692.0" y="357.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">thay đổi mô hình</text><rect x="692.0" y="386.0" width="68.6" height="32.0" rx="16.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="726.3" y="407.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Audit</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bốn chức năng cùng nhau biến nguyên tắc thành kiểm tra kỹ thuật.</text></svg>
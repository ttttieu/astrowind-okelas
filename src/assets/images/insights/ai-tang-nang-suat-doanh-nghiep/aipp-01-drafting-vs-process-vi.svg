<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Chuỗi năm bước của một đề xuất kinh doanh: nhân viên soạn, trưởng phòng review, giám đốc phê duyệt, chờ khách hàng phản hồi, xử lý hợp đồng; AI chỉ rút ngắn bước soạn, các bước còn lại vẫn phải đi qua." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Soạn nhanh hơn không làm cả quy trình nhanh hơn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một đề xuất kinh doanh vẫn phải đi qua nhiều bước sau khi soạn xong.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa từ bài viết (soạn đề xuất kinh doanh), không phải số liệu đo lường.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="140.0" width="143.6" height="24.0" rx="12.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="131.8" y="156.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">AI rút ngắn bước này</text><rect x="60.0" y="176.0" width="204.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="162.0" y="223.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên soạn</text><text x="162.0" y="244.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">đề xuất</text><line x1="265.0" y1="228.0" x2="271.0" y2="228.0" stroke="var(--gm)" stroke-width="2"/><polygon points="278.0,228.0 271.0,231.8 271.0,224.2" fill="var(--gm)"/><rect x="279.0" y="140.0" width="111.9" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="335.0" y="156.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Vẫn phải đi qua</text><rect x="279.0" y="176.0" width="204.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="381.0" y="233.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Trưởng phòng review</text><line x1="484.0" y1="228.0" x2="490.0" y2="228.0" stroke="var(--gm)" stroke-width="2"/><polygon points="497.0,228.0 490.0,231.8 490.0,224.2" fill="var(--gm)"/><rect x="498.0" y="140.0" width="111.9" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="554.0" y="156.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Vẫn phải đi qua</text><rect x="498.0" y="176.0" width="204.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="600.0" y="233.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Giám đốc phê duyệt</text><line x1="703.0" y1="228.0" x2="709.0" y2="228.0" stroke="var(--gm)" stroke-width="2"/><polygon points="716.0,228.0 709.0,231.8 709.0,224.2" fill="var(--gm)"/><rect x="717.0" y="140.0" width="111.9" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="773.0" y="156.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Vẫn phải đi qua</text><rect x="717.0" y="176.0" width="204.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="819.0" y="223.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chờ phản hồi</text><text x="819.0" y="244.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">của khách hàng</text><line x1="922.0" y1="228.0" x2="928.0" y2="228.0" stroke="var(--gm)" stroke-width="2"/><polygon points="935.0,228.0 928.0,231.8 928.0,224.2" fill="var(--gm)"/><rect x="936.0" y="140.0" width="111.9" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="992.0" y="156.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Vẫn phải đi qua</text><rect x="936.0" y="176.0" width="204.0" height="104.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="1038.0" y="233.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Xử lý hợp đồng</text><line x1="279.0" y1="294.0" x2="1140.0" y2="294.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="6 5"/><line x1="279.0" y1="288.0" x2="279.0" y2="300.0" stroke="var(--a)" stroke-width="2"/><line x1="1140.0" y1="288.0" x2="1140.0" y2="300.0" stroke="var(--a)" stroke-width="2"/><rect x="389.5" y="310.0" width="640.0" height="42.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="709.5" y="336.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Điểm chậm nhất của chuỗi quyết định tốc độ của cả hệ thống</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI rút ngắn một bước. Đầu ra của tổ chức do cả chuỗi quyết định.</text></svg>
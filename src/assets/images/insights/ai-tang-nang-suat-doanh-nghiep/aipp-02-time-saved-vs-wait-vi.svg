<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Thanh thời gian giả định cho một đề xuất: soạn thảo giảm từ 2 giờ còn 20 phút, tiết kiệm 100 phút, nhưng 3 ngày chờ phê duyệt chiếm gần hết thanh và không đổi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="556" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tiết kiệm ở bước soạn, nút thắt nằm ở bước chờ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Số liệu minh họa giả định, không phải thống kê.</text><line x1="60.0" y1="472.0" x2="1140.0" y2="472.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="494.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Số liệu minh họa giả định theo ví dụ trong bài, không phải thống kê. Thanh vẽ đúng tỉ lệ thời gian giả định.</text><text x="60.0" y="535.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="225.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trước khi dùng AI</text><line x1="290.8" y1="180.0" x2="290.8" y2="196.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="173.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Soạn thảo: 2 giờ</text><rect x="280.0" y="196.0" width="21.6" height="48.0" rx="3" fill="var(--p)"/><rect x="301.6" y="196.0" width="778.4" height="48.0" rx="3" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="690.8" y="225.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Chờ phê duyệt: 3 ngày (giả định)</text><text x="60.0" y="325.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Sau khi dùng AI</text><line x1="281.8" y1="280.0" x2="281.8" y2="296.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="273.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Soạn thảo: 20 phút</text><rect x="280.0" y="296.0" width="3.6" height="48.0" rx="2" fill="var(--p)"/><rect x="283.6" y="296.0" width="18.0" height="48.0" rx="3" fill="none" stroke="var(--p)" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="301.6" y="296.0" width="778.4" height="48.0" rx="3" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="690.8" y="325.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Chờ phê duyệt: 3 ngày (giả định)</text><line x1="292.6" y1="344.0" x2="292.6" y2="358.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="375.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Tiết kiệm 100 phút</text><rect x="60.0" y="402.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="435.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tiết kiệm 100 phút ở bước soạn thảo, nhưng thời gian chờ phê duyệt không đổi.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Ba agent có quyền riêng đổ vào một khối quyền hiệu dụng của hệ thống, lớn hơn tổng các phần." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền hiệu dụng có thể vượt tổng các phần</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Theo Cloud Security Alliance (2026), đây là "aggregation problem": đường thông tin không được lên kế hoạch có thể mở rộng</text><text x="60.0" y="127.4" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">phạm vi.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Minh họa khái niệm "aggregation problem" theo bài viết; không phải số liệu đo lường.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="260.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="190.0" y="185.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent A: quyền riêng</text><line x1="326.0" y1="180.0" x2="419.4" y2="245.4" stroke="var(--p)" stroke-width="2.2"/><polygon points="426.0,250.0 416.9,249.0 422.0,241.8" fill="var(--p)"/><rect x="60.0" y="230.0" width="260.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="190.0" y="265.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent B: quyền riêng</text><line x1="326.0" y1="260.0" x2="418.0" y2="250.8" stroke="var(--p)" stroke-width="2.2"/><polygon points="426.0,250.0 418.5,255.2 417.6,246.4" fill="var(--p)"/><rect x="60.0" y="310.0" width="260.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="190.0" y="345.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent C: quyền riêng</text><line x1="326.0" y1="340.0" x2="420.1" y2="255.4" stroke="var(--p)" stroke-width="2.2"/><polygon points="426.0,250.0 423.0,258.6 417.1,252.1" fill="var(--p)"/><rect x="430.0" y="150.0" width="710.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="460.0" y="196.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền hiệu dụng của hệ thống</text><text x="460.0" y="233.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Có thể lớn hơn tổng các quyền riêng lẻ, qua các đường thông tin không được lên</text><text x="460.0" y="255.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">kế hoạch.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Kiểm tra từng agent riêng lẻ không trả lời được câu hỏi này.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Sơ đồ: một orchestrator quyền rộng nối xuống ba sub-agent quyền hẹp." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Orchestrator cần quyền rộng hơn từng sub-agent</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi sub-agent có phạm vi hẹp; orchestrator phải gọi, gộp kết quả và chọn bước tiếp theo.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa cấu trúc theo bài viết; các vai trò agent là ví dụ, không phải kiến trúc chuẩn.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="400.0" y="150.0" width="320.0" height="70.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="560.0" y="184.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Orchestrator</text><text x="560.0" y="207.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">quyền rộng</text><line x1="560.0" y1="222.0" x2="228.7" y2="313.6" stroke="var(--p)" stroke-width="2.4"/><polygon points="220.0,316.0 227.4,308.8 230.0,318.4" fill="var(--p)"/><rect x="60.0" y="320.0" width="320.0" height="80.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="220.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sub-agent: tra cứu dữ liệu</text><text x="220.0" y="427.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">quyền hẹp</text><line x1="560.0" y1="222.0" x2="560.0" y2="307.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="560.0,316.0 555.0,307.0 565.0,307.0" fill="var(--p)"/><rect x="400.0" y="320.0" width="320.0" height="80.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="560.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sub-agent: soạn thảo</text><text x="560.0" y="427.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">quyền hẹp</text><line x1="560.0" y1="222.0" x2="891.3" y2="313.6" stroke="var(--p)" stroke-width="2.4"/><polygon points="900.0,316.0 890.0,318.4 892.6,308.8" fill="var(--p)"/><rect x="740.0" y="320.0" width="320.0" height="80.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="900.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sub-agent: kiểm tra tuân thủ</text><text x="900.0" y="427.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">quyền hẹp</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyền hẹp từng agent là cần thiết, nhưng chưa đủ.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Ba loại tri thức mất đi khi nhân sự chủ chốt rời đi: tri thức vận hành ảnh hưởng ngay đến chất lượng và tốc độ, tri thức bối cảnh khiến tổ chức lặp lại sai lầm cũ, tri thức quan hệ làm giải quyết vấn đề chậm hơn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba loại tri thức mất đi khi nhân sự chủ chốt rời đi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi loại mất đi gây vấn đề theo một cách khác nhau.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân loại ba loại tri thức theo bài viết; công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="599.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức vận hành</text><text x="82.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Operational knowledge</text><text x="82.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="82.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cách làm công việc hàng ngày, kể cả xử lý</text><text x="82.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tình huống bất thường.</text><line x1="82.0" y1="310.0" x2="386.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Khi mất</text><text x="82.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ảnh hưởng ngay đến chất lượng và tốc độ.</text><text x="82.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Người mới cần thời gian dài để tích lũy lại.</text><rect x="426.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="448.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức bối cảnh</text><text x="448.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Contextual knowledge</text><text x="448.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="448.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lý do tổ chức vận hành theo cách đó: lịch</text><text x="448.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sử, quyết định trong quá khứ, điều đã thử</text><text x="448.0" y="292.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">mà không hiệu quả.</text><line x1="448.0" y1="310.0" x2="752.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Khi mất</text><text x="448.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không ảnh hưởng ngay. Tổ chức lặp lại</text><text x="448.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sai lầm cũ hoặc mất thời gian tìm hiểu lại</text><text x="448.0" y="402.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">điều đã biết.</text><rect x="792.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="814.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức quan hệ</text><text x="814.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Relational knowledge</text><text x="814.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="814.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Về con người: ai là ai, nên tiếp cận thế nào,</text><text x="814.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ai giúp được gì.</text><line x1="814.0" y1="310.0" x2="1118.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Khi mất</text><text x="814.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Giải quyết vấn đề chậm hơn, vì người mới</text><text x="814.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phải xây lại quan hệ từ đầu.</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Có loại mất tri thức lộ ngay, có loại chỉ lộ khi sai lầm cũ lặp lại.</text></svg>
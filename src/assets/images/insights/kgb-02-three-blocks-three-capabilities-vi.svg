<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 638" width="1200" height="638" role="img" aria-label="Ba thành phần của knowledge graph là thực thể, quan hệ và thuộc tính; chúng cho phép truy vấn theo quan hệ, phân tích tác động và AI có ngữ cảnh." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="638" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba thành phần, ba khả năng mới của knowledge graph</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tri thức có cấu trúc mới truy vấn được, liên kết được và dùng được cho AI.</text><line x1="60.0" y1="554.0" x2="1140.0" y2="554.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="576.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="617.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="147.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Ba thành phần của knowledge graph</text><rect x="60.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thực thể</text><text x="80.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Những “thứ” trong doanh nghiệp: sản phẩm,</text><text x="80.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quy trình, nguyên liệu, nhà cung cấp, thiết bị,</text><text x="80.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhân viên, sự kiện, quyết định.</text><rect x="426.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="446.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quan hệ</text><text x="446.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cách các thực thể liên kết: “sản phẩm A</text><text x="446.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">dùng nguyên liệu M”, “sự cố Y dẫn đến thay</text><text x="446.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đổi quy trình Z”.</text><rect x="792.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="812.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thuộc tính</text><text x="812.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thông tin về từng thực thể: thông số kỹ</text><text x="812.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thuật, ngày hiệu lực, người phụ trách, trạng</text><text x="812.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thái hiện tại.</text><line x1="600.0" y1="288.8" x2="600.0" y2="302.8" stroke="var(--mut)" stroke-width="2"/><polygon points="600.0,310.8 595.6,302.8 604.4,302.8" fill="var(--mut)"/><text x="60.0" y="332.5" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Ba điều trở nên khả thi</text><rect x="60.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Truy vấn theo quan hệ</text><text x="80.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Những quy trình nào đang dùng nguyên liệu</text><text x="80.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">từ nhà cung cấp XYZ?</text><rect x="426.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="446.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Phân tích tác động</text><text x="446.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu đổi tiêu chuẩn chấp nhận nguyên liệu M,</text><text x="446.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sản phẩm và quy trình nào bị ảnh hưởng?</text><rect x="792.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="812.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI có ngữ cảnh</text><text x="812.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI biết thực thể này liên quan đến thực thể</text><text x="812.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nào, nên trả lời được câu hỏi vận hành thay vì</text><text x="812.0" y="444.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chỉ tóm tắt tài liệu.</text><rect x="60.0" y="483.6" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="517.2" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tri thức có cấu trúc: ghi nhận quan hệ một lần, dùng nhiều lần cho nhiều mục đích.</text></svg>
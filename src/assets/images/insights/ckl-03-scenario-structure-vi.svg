<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Tình huống giả định về một trưởng ca nghỉ việc: chi phí hiển thị gồm tuyển dụng, lương chuyển giao, đào tạo; chi phí ẩn theo giả định gồm năng suất giảm, thời gian hỗ trợ và sai sót tăng, lớn hơn nhiều chi phí hiển thị." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tình huống giả định: cấu trúc chi phí</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Minh họa cấu trúc và quy mô tương đối, không dùng làm benchmark.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Giả định minh họa trong bài viết, không phải số liệu thống kê hay benchmark. Chỉ minh họa cơ chế chi phí.</text><text x="60.0" y="577.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="600.0" y="168.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Tình huống giả định: doanh nghiệp chế biến thực phẩm 90 nhân viên. Trưởng ca có 8 năm kinh nghiệm, báo nghỉ trước 2 tháng.</text><rect x="60.0" y="208.0" width="360.0" height="220.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="247.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí hiển thị</text><rect x="84.0" y="266.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="293.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Tuyển dụng: đăng tin, phỏng vấn, thời gian HR</text><rect x="84.0" y="318.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="345.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Lương 2 tháng chuyển giao</text><rect x="84.0" y="370.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="397.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Đào tạo: tài liệu, thời gian người hướng dẫn</text><rect x="440.0" y="208.0" width="700.0" height="220.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="464.0" y="247.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí ẩn, theo giả định</text><rect x="464.0" y="266.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="294.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người mới đạt 70% năng suất trong 4 tháng đầu</text><rect x="464.0" y="318.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người có kinh nghiệm khác dành thêm khoảng 20% thời gian để hỗ trợ</text><rect x="464.0" y="370.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="398.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sai sót tăng 15–20% trong 4 tháng đầu</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Trong tình huống giả định, chi phí ẩn lớn hơn nhiều chi phí hiển thị.</text></svg>
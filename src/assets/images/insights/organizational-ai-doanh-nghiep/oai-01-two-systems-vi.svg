<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" width="1200" height="642" role="img" aria-label="Hai hệ thống so sánh cùng một câu hỏi: hệ thống 1 chỉ tóm tắt SOP; hệ thống 2 đối chiếu dữ liệu thực tế và chỉ ra lô thiếu bước kèm bằng chứng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="642" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Cùng một model, kết quả khác nhau nhờ context tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hệ thống 1 chỉ tóm tắt SOP; hệ thống 2 truy dữ liệu kiểm tra và trả lời kèm bằng chứng.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ hai hệ thống là minh họa tổng hợp theo bài viết, không phải kết quả đo lường.</text><text x="60.0" y="621.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="1080.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="600.0" y="202.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Lô nguyên liệu có tuân thủ quy trình kiểm tra đầu vào không?</text><rect x="60.0" y="250.0" width="534.0" height="193.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="288.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống 1</text><text x="84.0" y="318.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Tóm tắt SOP</text><text x="84.0" y="351.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Mô tả điều lẽ ra phải xảy ra</text><text x="84.0" y="380.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Không đối chiếu với dữ liệu thực tế</text><text x="84.0" y="410.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Không chỉ ra lô nào thiếu bước</text><rect x="606.0" y="250.0" width="534.0" height="193.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="630.0" y="288.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống 2</text><text x="630.0" y="318.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Đối chiếu dữ liệu thực tế</text><text x="630.0" y="351.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Truy kết quả kiểm tra 30 ngày qua</text><text x="630.0" y="380.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Đối chiếu tiêu chuẩn nhà cung cấp đã phê duyệt</text><text x="630.0" y="410.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Chỉ ra lô thiếu bước bắt buộc kèm bằng chứng</text><rect x="60.0" y="487.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="520.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khoảng cách nằm ở context tổ chức mà AI được gắn vào, không nằm ở mô hình AI.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Knowledge in people’s heads leads to five consequences that accumulate: inconsistent quality, long training, key people leaving, hard audits and inability to scale." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five consequences of knowledge living in people’s heads</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The consequences don’t appear immediately. They accumulate.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Consequences described from the article’s analysis, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge lives in people’s heads</text><line x1="162.0" y1="188.0" x2="162.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="162.0,212.0 157.6,204.0 166.4,204.0" fill="var(--gm)"/><rect x="60.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Inconsistent quality</text><text x="76.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Output depends on who</text><text x="76.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">works today, most visible</text><text x="76.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">between shifts.</text><line x1="381.0" y1="188.0" x2="381.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="381.0,212.0 376.6,204.0 385.4,204.0" fill="var(--gm)"/><rect x="279.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="295.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Long training periods</text><text x="295.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Knowledge passes by</text><text x="295.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">word of mouth;</text><text x="295.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">experienced staff lose time</text><text x="295.0" y="367.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">to training.</text><line x1="600.0" y1="188.0" x2="600.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,212.0 595.6,204.0 604.4,204.0" fill="var(--gm)"/><rect x="498.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="514.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Key people leave</text><text x="514.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The dependence usually</text><text x="514.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">shows only at notice,</text><text x="514.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">when it is too late to</text><text x="514.0" y="367.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">transfer it all.</text><line x1="819.0" y1="188.0" x2="819.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="819.0,212.0 814.6,204.0 823.4,204.0" fill="var(--gm)"/><rect x="717.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="733.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Hard, inconsistent</text><text x="733.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">audits</text><text x="733.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Evidence must be</text><text x="733.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">reconstructed instead of</text><text x="733.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">summarized from what</text><text x="733.0" y="367.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">was captured.</text><line x1="1038.0" y1="188.0" x2="1038.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1038.0,212.0 1033.6,204.0 1042.4,204.0" fill="var(--gm)"/><rect x="936.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="952.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Cannot scale</text><text x="952.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Each expansion means</text><text x="952.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">solving the knowledge</text><text x="952.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">problem from scratch.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The consequences accumulate, and usually show only when they are hard to fix.</text></svg>
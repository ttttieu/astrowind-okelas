<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="A five-row table mapping frontier concepts to enterprise governance; left column developer, right column deployer." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="740" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five frontier concepts have an enterprise counterpart</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mapping frontier safety concepts onto governance inside a business.</text><line x1="60.0" y1="656.0" x2="1140.0" y2="656.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="678.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mapping table per the article; the right column is OKELAS’s translation for businesses.</text><text x="60.0" y="719.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="166.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Frontier safety (developer)</text><text x="612.0" y="166.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Enterprise governance (deployer)</text><rect x="60.0" y="184.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="84.0" y="212.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Capability Threshold</text><rect x="612.0" y="184.0" width="528.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><text x="636.0" y="212.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Read / Request / Recommend / Execute permission tiers</text><rect x="60.0" y="260.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="84.0" y="288.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Safeguards ready before deployment</text><rect x="612.0" y="260.0" width="528.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><text x="636.0" y="288.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Control layer in place before agents get system access</text><rect x="60.0" y="336.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="84.0" y="364.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Safety Advisory Group, Responsible Scaling</text><text x="84.0" y="385.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Officer sign-off</text><rect x="612.0" y="336.0" width="528.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><text x="636.0" y="364.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">One accountable owner for each agent</text><rect x="60.0" y="412.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="84.0" y="440.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Periodic policy review and update</text><rect x="612.0" y="412.0" width="528.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><text x="636.0" y="440.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Permission profiles audited on a fixed schedule</text><rect x="60.0" y="488.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="84.0" y="516.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Published Risk Reports</text><rect x="612.0" y="488.0" width="528.0" height="66.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.3"/><text x="636.0" y="516.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Evidence and audit trail independent of the model</text><rect x="60.0" y="586.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="619.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The structure exists; businesses need a version at their own scale.</text></svg>
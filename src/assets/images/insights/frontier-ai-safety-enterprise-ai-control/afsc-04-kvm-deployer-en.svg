<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="An agent passes through a KVM box with three operations, Trace, FindEvidence, Resolve, then reaches organizational knowledge; two negating notes sit below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM is a deployer-side mechanism, not a frontier fix</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three defined operations let agents access organizational knowledge.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">KVM description per the article; the diagram is OKELAS’s illustration.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="190.0" width="200.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="160.0" y="244.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">AI agent</text><line x1="266.0" y1="238.0" x2="314.0" y2="238.0" stroke="var(--gm)" stroke-width="3"/><polygon points="326.0,238.0 314.0,244.6 314.0,231.4" fill="var(--gm)"/><rect x="330.0" y="170.0" width="420.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="540.0" y="202.9" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">KVM</text><rect x="350.0" y="230.0" width="120.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="410.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Trace</text><rect x="480.0" y="230.0" width="120.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="540.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">FindEvidence</text><rect x="610.0" y="230.0" width="120.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="670.0" y="268.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Resolve</text><line x1="754.0" y1="238.0" x2="784.0" y2="238.0" stroke="var(--gm)" stroke-width="3"/><polygon points="796.0,238.0 784.0,244.6 784.0,231.4" fill="var(--gm)"/><rect x="800.0" y="190.0" width="340.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="970.0" y="244.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational knowledge</text><rect x="60.0" y="350.0" width="528.0" height="96.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="324.0" y="404.6" font-size="18" font-weight="700" fill="var(--tx)" text-anchor="middle">Does not change how models are trained</text><rect x="612.0" y="350.0" width="528.0" height="96.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="876.0" y="404.6" font-size="18" font-weight="700" fill="var(--tx)" text-anchor="middle">Not a frontier safety solution</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM handles the deployer’s part, not model safety.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="The receivables accountant role has five activities; for each, AI helps by interpreting input and preparing evidence, while people keep mismatches outside the rules, setting thresholds, approving, deciding and signing." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="672" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">A role is many steps, each with a different fit</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The receivables accountant role (illustrative): what AI helps with is interpreting and preparing.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">An orienting framework for discussion, not measured data.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Activity</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">How far AI can help</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">What people keep</text><rect x="60.0" y="158.0" width="340.0" height="68.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="197.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Match invoices to orders</text><rect x="410.0" y="158.0" width="380.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="197.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Interpret documents, match so rules can run</text><rect x="800.0" y="158.0" width="340.0" height="68.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="197.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mismatches outside the rules</text><line x1="404.0" y1="192.0" x2="400.0" y2="192.0" stroke="#5B6575" stroke-width="2"/><polygon points="406.0,192.0 400.0,195.3 400.0,188.7" fill="#5B6575"/><rect x="60.0" y="236.0" width="340.0" height="68.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="275.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Track overdue balances</text><rect x="410.0" y="236.0" width="380.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="275.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Collect, summarize; rules remind by threshold</text><rect x="800.0" y="236.0" width="340.0" height="68.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="275.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Set thresholds, special customers</text><line x1="404.0" y1="270.0" x2="400.0" y2="270.0" stroke="#5B6575" stroke-width="2"/><polygon points="406.0,270.0 400.0,273.3 400.0,266.7" fill="#5B6575"/><rect x="60.0" y="314.0" width="340.0" height="68.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="353.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Remind customers to pay</text><rect x="410.0" y="314.0" width="380.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="353.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Draft by context</text><rect x="800.0" y="314.0" width="340.0" height="68.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="353.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Approve and send for key customers</text><line x1="404.0" y1="348.0" x2="400.0" y2="348.0" stroke="#5B6575" stroke-width="2"/><polygon points="406.0,348.0 400.0,351.3 400.0,344.7" fill="#5B6575"/><rect x="60.0" y="392.0" width="340.0" height="68.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="431.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Handle disputes</text><rect x="410.0" y="392.0" width="380.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="431.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Prepare the file, similar cases</text><rect x="800.0" y="392.0" width="340.0" height="68.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="431.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Decide and negotiate</text><line x1="404.0" y1="426.0" x2="400.0" y2="426.0" stroke="#5B6575" stroke-width="2"/><polygon points="406.0,426.0 400.0,429.3 400.0,422.7" fill="#5B6575"/><rect x="60.0" y="470.0" width="340.0" height="68.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="509.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Periodic reports</text><rect x="410.0" y="470.0" width="380.0" height="68.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="509.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Compile figures with sources</text><rect x="800.0" y="470.0" width="340.0" height="68.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="509.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Review and sign</text><line x1="404.0" y1="504.0" x2="400.0" y2="504.0" stroke="#5B6575" stroke-width="2"/><polygon points="406.0,504.0 400.0,507.3 400.0,500.7" fill="#5B6575"/><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Whichever step is delegated, it is interpreting and preparing, not deciding.</text></svg>
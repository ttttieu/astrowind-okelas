<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Four ways a participant differs from a tool: its own identity, a permission scope tied to the task, traceable accountability, a manageable lifecycle; full governance is for roles that run continuously, influence real decisions or must be explained to ISO or GMP assessors." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">An AI participant differs from a tool in four ways</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Full governance is for AI roles with risk, not for every task.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="214.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A distinct identity</text><text x="76.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">No shared key; tied to one</text><text x="76.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">purpose and scope of work.</text><rect x="335.0" y="134.0" width="255.0" height="214.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Permissions tied to</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">the task</text><text x="351.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Not broad “just in case” access.</text><rect x="610.0" y="134.0" width="255.0" height="214.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Traceable accountability</text><text x="626.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Which result came from which</text><text x="626.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">participant, with which data</text><text x="626.0" y="310.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and rights.</text><rect x="885.0" y="134.0" width="255.0" height="214.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="#2B74F5"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A manageable lifecycle</text><text x="901.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Granted on joining, monitored,</text><text x="901.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">revoked when the role ends.</text><rect x="60.0" y="366.0" width="1080.0" height="116.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="398.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Full governance when it</text><rect x="84.0" y="422.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="254.0" y="449.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Runs continuously in a fixed role</text><rect x="436.0" y="422.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="606.0" y="449.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Influences real decisions</text><rect x="788.0" y="422.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="958.0" y="449.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Must be explained to ISO, GMP</text><rect x="60.0" y="498.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="531.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Low-risk tasks, like a reference summary, still use the simple tool model.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="The receivables accountant role has five activities; for each, AI helps by interpreting input and preparing evidence, while people keep mismatches outside the rules, setting thresholds, approving, deciding and signing." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A role is many steps, each with a different fit</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The receivables accountant role (illustrative): what AI helps with is interpreting and preparing.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">An orienting framework for discussion, not measured data.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Activity</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">How far AI can help</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What people keep</text><rect x="60.0" y="158.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="197.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Match invoices to orders</text><rect x="410.0" y="158.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="197.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Interpret documents, match so rules can run</text><rect x="800.0" y="158.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="197.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mismatches outside the rules</text><line x1="404.0" y1="192.0" x2="400.0" y2="192.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,192.0 400.0,195.3 400.0,188.7" fill="var(--gm)"/><rect x="60.0" y="236.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="275.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Track overdue balances</text><rect x="410.0" y="236.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="275.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Collect, summarize; rules remind by threshold</text><rect x="800.0" y="236.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="275.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Set thresholds, special customers</text><line x1="404.0" y1="270.0" x2="400.0" y2="270.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,270.0 400.0,273.3 400.0,266.7" fill="var(--gm)"/><rect x="60.0" y="314.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="353.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Remind customers to pay</text><rect x="410.0" y="314.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="353.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Draft by context</text><rect x="800.0" y="314.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="353.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Approve and send for key customers</text><line x1="404.0" y1="348.0" x2="400.0" y2="348.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,348.0 400.0,351.3 400.0,344.7" fill="var(--gm)"/><rect x="60.0" y="392.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="431.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Handle disputes</text><rect x="410.0" y="392.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="431.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Prepare the file, similar cases</text><rect x="800.0" y="392.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="431.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Decide and negotiate</text><line x1="404.0" y1="426.0" x2="400.0" y2="426.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,426.0 400.0,429.3 400.0,422.7" fill="var(--gm)"/><rect x="60.0" y="470.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="509.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Periodic reports</text><rect x="410.0" y="470.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Compile figures with sources</text><rect x="800.0" y="470.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Review and sign</text><line x1="404.0" y1="504.0" x2="400.0" y2="504.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,504.0 400.0,507.3 400.0,500.7" fill="var(--gm)"/><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Whichever step is delegated, it is interpreting and preparing, not deciding.</text></svg>
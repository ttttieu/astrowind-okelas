<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A task card has seven items: goal, input, output, who receives the output, permissions, when to stop and hand to a person, and who is accountable; the last two belong to people." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">The task card: delegate a step, not the decision</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">A task card makes delegating concrete and checkable.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="534.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="90.0" cy="165.0" r="15" fill="#2B74F5"/><text x="90.0" y="170.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="118.0" y="160.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Goal</text><text x="118.0" y="181.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">What AI does, within what scope</text><rect x="60.0" y="206.0" width="534.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="90.0" cy="237.0" r="15" fill="#2B74F5"/><text x="90.0" y="242.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="118.0" y="232.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Input</text><text x="118.0" y="253.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">What AI may read</text><rect x="60.0" y="278.0" width="534.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="90.0" cy="309.0" r="15" fill="#2B74F5"/><text x="90.0" y="314.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="118.0" y="304.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Output</text><text x="118.0" y="325.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Form, place, with sources and certainty</text><rect x="60.0" y="350.0" width="534.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="90.0" cy="381.0" r="15" fill="#2B74F5"/><text x="90.0" y="386.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="118.0" y="376.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Who receives the output</text><text x="118.0" y="397.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Which rule reads it, or which person reviews it</text><rect x="606.0" y="134.0" width="534.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="636.0" cy="165.0" r="15" fill="#2B74F5"/><text x="636.0" y="170.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="664.0" y="160.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Permissions</text><text x="664.0" y="181.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">What it may and may not do</text><rect x="606.0" y="206.0" width="534.0" height="62.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="237.0" r="15" fill="#A78BFA"/><text x="636.0" y="242.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="664.0" y="232.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">When to stop</text><text x="664.0" y="253.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Uncertain, missing information, out of scope: hand to a person</text><rect x="606.0" y="278.0" width="534.0" height="62.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="309.0" r="15" fill="#A78BFA"/><text x="636.0" y="314.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="664.0" y="304.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Who is accountable</text><text x="664.0" y="325.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Reviews the step periodically</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The last two belong to people.</text></svg>
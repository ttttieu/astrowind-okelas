<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A task card has seven items: goal, input, output, who receives the output, permissions, when to stop and hand to a person, and who is accountable; the last two belong to people." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The task card: delegate a step, not the decision</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A task card makes delegating concrete and checkable.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="165.0" r="15" fill="var(--p)"/><text x="90.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="118.0" y="160.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Goal</text><text x="118.0" y="181.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">What AI does, within what scope</text><rect x="60.0" y="206.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="237.0" r="15" fill="var(--p)"/><text x="90.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="118.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Input</text><text x="118.0" y="253.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">What AI may read</text><rect x="60.0" y="278.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="309.0" r="15" fill="var(--p)"/><text x="90.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="118.0" y="304.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Output</text><text x="118.0" y="325.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Form, place, with sources and certainty</text><rect x="60.0" y="350.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="381.0" r="15" fill="var(--p)"/><text x="90.0" y="386.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="118.0" y="376.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Who receives the output</text><text x="118.0" y="397.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Which rule reads it, or which person reviews it</text><rect x="606.0" y="134.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="636.0" cy="165.0" r="15" fill="var(--p)"/><text x="636.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="664.0" y="160.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Permissions</text><text x="664.0" y="181.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">What it may and may not do</text><rect x="606.0" y="206.0" width="534.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="237.0" r="15" fill="var(--a)"/><text x="636.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="664.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When to stop</text><text x="664.0" y="253.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Uncertain, missing information, out of scope: hand to a person</text><rect x="606.0" y="278.0" width="534.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="309.0" r="15" fill="var(--a)"/><text x="636.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="664.0" y="304.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Who is accountable</text><text x="664.0" y="325.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Reviews the step periodically</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The last two belong to people.</text></svg>
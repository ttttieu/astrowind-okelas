<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The common question is which role AI replaces; the useful question is to split the role into steps, delegate one step with a task card, govern the AI as a participant, and people keep the judgment." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Delegating Workflow Steps to AI</text><text x="60.0" y="289.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">The common question</text><rect x="60.0" y="304.0" width="330.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.6"/><text x="225.0" y="339.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Which role will AI replace?</text><line x1="394.0" y1="334.0" x2="421.0" y2="334.0" stroke="var(--gm)" stroke-width="3"/><polygon points="432.0,334.0 421.0,340.1 421.0,327.9" fill="var(--gm)"/><rect x="436.0" y="304.0" width="400.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="636.0" y="339.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Excess fear or expectation</text><text x="60.0" y="429.0" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">The useful question</text><rect x="60.0" y="444.0" width="230.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="175.0" y="479.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Split the role into steps</text><line x1="294.0" y1="474.0" x2="314.0" y2="474.0" stroke="var(--p)" stroke-width="3"/><polygon points="324.0,474.0 314.0,479.5 314.0,468.5" fill="var(--p)"/><rect x="328.0" y="444.0" width="290.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="473.0" y="479.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Delegate one step, with a task card</text><line x1="622.0" y1="474.0" x2="642.0" y2="474.0" stroke="var(--p)" stroke-width="3"/><polygon points="652.0,474.0 642.0,479.5 642.0,468.5" fill="var(--p)"/><rect x="656.0" y="444.0" width="240.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="776.0" y="479.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Govern as a participant</text><line x1="900.0" y1="474.0" x2="920.0" y2="474.0" stroke="var(--a)" stroke-width="3"/><polygon points="930.0,474.0 920.0,479.5 920.0,468.5" fill="var(--a)"/><rect x="934.0" y="444.0" width="210.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="1039.0" y="479.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">People keep judgment</text></svg>
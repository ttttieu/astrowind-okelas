<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Two points to consider before acting: diagnose before prescribing, and examine both system and organization." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Two points to consider before acting</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Diagnose the cause before choosing a solution.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="532.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Diagnose before prescribing</text><text x="76.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Re-implementing, switching software or mandating use without fixing the</text><text x="76.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">root cause tends to create friction.</text><rect x="607.0" y="134.0" width="532.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="639.0" cy="166.0" r="15" fill="var(--p)"/><text x="639.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="623.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Examine both system and organization</text><text x="623.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A process mismatch is a system problem; no reason to change is an</text><text x="623.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">organizational one; usually both exist together.</text><rect x="60.0" y="307.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="340.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Understand the cause first, then choose the solution.</text></svg>
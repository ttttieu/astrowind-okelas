<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" width="1200" height="706" role="img" aria-label="Diagram: a principal delegates to an agent; below is a box for agency costs." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="706" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agent is an economic concept, not just an AI label</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Whenever authority is delegated, agency costs arise and must be managed.</text><line x1="60.0" y1="622.0" x2="1140.0" y2="622.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="644.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Delegation framing per Jensen and Meckling (1976), as the article presents it; the diagram is illustrative.</text><text x="60.0" y="685.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><circle cx="250.0" cy="330.0" r="90" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="250.0" y="335.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Principal</text><circle cx="950.0" cy="330.0" r="90" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="950.0" y="335.9" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">Agent</text><line x1="346.0" y1="330.0" x2="838.0" y2="330.0" stroke="var(--gm)" stroke-width="3"/><polygon points="852.0,330.0 838.0,337.7 838.0,322.3" fill="var(--gm)"/><text x="600.0" y="312.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="middle">delegation</text><rect x="390.0" y="450.0" width="420.0" height="56.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="483.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Agency costs arise with every delegation</text><rect x="60.0" y="552.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="585.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Agency costs cannot be fully eliminated, only managed to an acceptable level.</text></svg>
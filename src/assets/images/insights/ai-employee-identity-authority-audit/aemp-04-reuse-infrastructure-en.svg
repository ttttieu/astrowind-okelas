<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Three existing systems (IAM, approvals, logging) feeding into one AI agent block." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Reuse existing infrastructure instead of building anew</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Extend the infrastructure the business already has to AI, rather than creating a separate governance system.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three existing systems per the article (IAM, approvals, logging); the diagram is OKELAS’s illustration.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="300.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="180.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">IAM (identity and</text><text x="210.0" y="201.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">access management)</text><line x1="366.0" y1="185.0" x2="685.4" y2="277.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,280.0 683.8,282.8 687.1,271.1" fill="var(--gm)"/><rect x="60.0" y="240.0" width="300.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="280.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Approval processes</text><line x1="366.0" y1="275.0" x2="685.0" y2="279.8" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,280.0 684.9,285.9 685.1,273.8" fill="var(--gm)"/><rect x="60.0" y="330.0" width="300.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="370.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Logging</text><line x1="366.0" y1="365.0" x2="685.3" y2="282.7" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,280.0 686.9,288.6 683.8,276.9" fill="var(--gm)"/><rect x="700.0" y="170.0" width="440.0" height="220.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="920.0" y="289.5" font-size="26" font-weight="700" fill="var(--a)" text-anchor="middle">AI agent</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Existing infrastructure can be extended to govern AI, without a separate system.</text></svg>
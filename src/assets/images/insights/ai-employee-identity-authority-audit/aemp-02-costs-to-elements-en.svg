<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Two groups: Identity and Authority on the left; Responsibility and Audit Trail on the right, matched to bonding and monitoring; residual loss at the bottom." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The four elements map onto three kinds of agency cost</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Identity and Authority frame the relationship; Responsibility and Audit Trail map to costs.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mapping per the article; the article directly maps only Responsibility and Audit Trail, while Identity and Authority are role descriptions.</text><text x="60.0" y="599.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="153.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Components of the delegated relationship</text><text x="620.0" y="153.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Cost-governance mechanisms</text><rect x="60.0" y="170.0" width="520.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="320.0" y="211.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Identity: who is in the delegated relationship</text><rect x="60.0" y="254.0" width="520.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="320.0" y="295.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Authority: the scope of decisions delegated</text><rect x="620.0" y="170.0" width="520.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="880.0" y="211.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Responsibility ↔ bonding costs</text><rect x="620.0" y="254.0" width="520.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="880.0" y="295.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Audit Trail ↔ monitoring costs</text><rect x="60.0" y="364.0" width="1080.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="400.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Residual loss: the loss that remains, to be accepted and designed for early detection</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The delegated relationship has both components and costs; the four elements cover both.</text></svg>
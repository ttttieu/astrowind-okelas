<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Agent được đọc nguồn evidence, ghi kết quả vào hồ sơ và gắn nhãn chuẩn bị; agent không được ghi vào hệ thống nghiệp vụ, tự phê duyệt đầu ra, sửa rule, sửa nhật ký hay giữ thông tin xác thực để thực thi." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="654" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Thực thi phân tách bằng quyền truy cập</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Lời dặn không bảo vệ được gì nếu agent có quyền kỹ thuật để làm.</text><line x1="60.0" y1="592.0" x2="1140.0" y2="592.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="614.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="147.9" font-size="17" font-weight="700" fill="#5FA0FF" text-anchor="start">Agent được</text><text x="620.0" y="147.9" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="start">Agent không được</text><rect x="60.0" y="166.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="201.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Đọc nguồn evidence</text><rect x="60.0" y="238.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="273.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Ghi kết quả vào hồ sơ vụ việc</text><rect x="60.0" y="310.0" width="520.0" height="60.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="82.0" y="345.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Gắn nhãn “chuẩn bị”, không phải “đã duyệt”</text><rect x="620.0" y="166.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="201.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Ghi vào hệ thống nghiệp vụ</text><rect x="620.0" y="238.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="273.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Tự phê duyệt đầu ra của mình</text><rect x="620.0" y="310.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="345.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Sửa rule</text><rect x="620.0" y="382.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="417.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Sửa hoặc xóa nhật ký</text><rect x="620.0" y="454.0" width="520.0" height="60.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="642.0" y="489.8" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Giữ thông tin xác thực để thực thi</text><rect x="60.0" y="532.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="565.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Mức chặt tùy rủi ro của từng quy trình.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba câu hỏi cho mỗi loại hành động: có cần quyết định độc lập không, thế nào là một quyết định hợp lệ, và ai thực thi sau khi quyết định; câu thứ ba thuộc thiết kế quyền truy cập và dễ bị bỏ qua nhất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba câu hỏi cho mỗi loại hành động</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tách được quyết định cho từng loại hành động.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cần quyết định độc</text><text x="122.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">lập không?</text><text x="84.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Hậu quả lớn, khó đảo ngược, đụng tiền,</text><text x="84.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dữ liệu chủ, tuân thủ: thường cần. Nhỏ,</text><text x="84.0" y="300.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">đảo ngược được, trong rule rõ: chạy</text><text x="84.0" y="322.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">theo rule.</text><rect x="427.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="170.0" r="15" fill="var(--a)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thế nào là</text><text x="489.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định hợp lệ?</text><text x="451.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Có người có thẩm quyền, evidence đã</text><text x="451.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thấy, lý do, thời điểm. Im lặng không phải</text><text x="451.0" y="300.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chấp thuận.</text><rect x="794.0" y="134.0" width="346.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ai thực thi sau khi</text><text x="856.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định?</text><text x="818.0" y="258.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tách về kỹ thuật với agent chuẩn bị</text><text x="818.0" y="279.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hồ sơ; không dùng chung thông tin</text><text x="818.0" y="300.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">xác thực.</text><rect x="818.0" y="390.0" width="123.8" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="879.9" y="406.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Dễ bị bỏ qua nhất</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hai câu đầu thuộc thiết kế quy trình; câu thứ ba thuộc thiết kế quyền truy cập.</text></svg>
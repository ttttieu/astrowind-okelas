<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" width="1200" height="696" role="img" aria-label="Bốn vai: AI diễn giải và chuẩn bị evidence, rule của người có thẩm quyền hoặc con người quyết định, hệ thống thực thi theo quyền đã cấp, workflow ghi nhận; ngoài bốn vai là người ban hành rule." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="696" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Bốn vai tách biệt trong workflow có AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Ngoài bốn vai còn một vai: người ban hành và sửa rule.</text><line x1="60.0" y1="634.0" x2="1140.0" y2="634.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="656.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="66.0" y="147.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Vai</text><text x="296.0" y="147.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Đảm nhận</text><text x="646.0" y="147.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Không được làm</text><rect x="60.0" y="160.0" width="220.0" height="70.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="88.0" cy="195.0" r="15" fill="#2B74F5"/><text x="88.0" y="200.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="116.0" y="190.6" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Diễn giải và</text><text x="116.0" y="210.4" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">chuẩn bị</text><rect x="290.0" y="160.0" width="340.0" height="70.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="306.0" y="200.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">AI</text><rect x="640.0" y="160.0" width="500.0" height="70.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.3" stroke-dasharray="6 5"/><text x="656.0" y="200.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Phê duyệt, thực thi, coi đầu ra của mình là quyết định</text><rect x="60.0" y="240.0" width="220.0" height="70.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="88.0" cy="275.0" r="15" fill="#A78BFA"/><text x="88.0" y="280.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="116.0" y="280.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định</text><rect x="290.0" y="240.0" width="340.0" height="70.0" rx="12" fill="#08090A" stroke="#A78BFA" stroke-width="1.6"/><text x="306.0" y="270.6" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule do người có thẩm quyền ban hành,</text><text x="306.0" y="290.4" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">hoặc con người</text><rect x="640.0" y="240.0" width="500.0" height="70.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.3" stroke-dasharray="6 5"/><text x="656.0" y="280.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Do chính thực thể thực thi đảm nhận</text><rect x="60.0" y="320.0" width="220.0" height="70.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="88.0" cy="355.0" r="15" fill="#2B74F5"/><text x="88.0" y="360.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="116.0" y="360.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Thực thi</text><rect x="290.0" y="320.0" width="340.0" height="70.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="306.0" y="360.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống, theo quyền đã cấp</text><rect x="640.0" y="320.0" width="500.0" height="70.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.3" stroke-dasharray="6 5"/><text x="656.0" y="360.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Tự mở rộng quyền, hành động khi chưa có quyết định hợp lệ</text><rect x="60.0" y="400.0" width="220.0" height="70.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="88.0" cy="435.0" r="15" fill="#2B74F5"/><text x="88.0" y="440.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="116.0" y="440.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Ghi nhận</text><rect x="290.0" y="400.0" width="340.0" height="70.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="306.0" y="440.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Workflow</text><rect x="640.0" y="400.0" width="500.0" height="70.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.3" stroke-dasharray="6 5"/><text x="656.0" y="440.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Bị thực thể thực thi tự sửa hoặc xóa</text><rect x="60.0" y="482.0" width="1080.0" height="76.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="510.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Người ban hành rule</text><text x="84.0" y="534.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Quyết định rule nào tồn tại, áp dụng đến đâu, sửa khi nào; không thuộc AI hay hệ thống thực thi.</text><rect x="60.0" y="574.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="607.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI thuộc vai thứ nhất: không gồm quyết định hay thực thi.</text></svg>
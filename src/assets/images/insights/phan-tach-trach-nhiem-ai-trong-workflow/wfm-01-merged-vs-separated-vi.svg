<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Khi gộp vai, một agent đọc email đổi tài khoản, cập nhật dữ liệu chủ và chuyển tiền; khi tách vai, AI diễn giải và chuẩn bị evidence, người có thẩm quyền hoặc rule quyết định, hệ thống thực thi, workflow ghi nhận." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Một thực thể làm cả chuỗi, hay mỗi vai một chủ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tách vai là nguyên tắc kiểm soát, không phụ thuộc thực thể là người hay máy.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="130.0" width="1080.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="159.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Gộp vai: cùng một thực thể</text><rect x="84.0" y="192.0" width="210.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="189.0" y="227.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Email đổi tài khoản</text><line x1="298.0" y1="222.0" x2="324.0" y2="222.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="334.0,222.0 324.0,227.5 324.0,216.5" fill="var(--gm)"/><rect x="338.0" y="192.0" width="220.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="448.0" y="227.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Agent đọc và tin</text><line x1="562.0" y1="222.0" x2="588.0" y2="222.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="598.0,222.0 588.0,227.5 588.0,216.5" fill="var(--gm)"/><rect x="602.0" y="192.0" width="260.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="732.0" y="227.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Agent cập nhật dữ liệu chủ</text><line x1="866.0" y1="222.0" x2="892.0" y2="222.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="902.0,222.0 892.0,227.5 892.0,216.5" fill="var(--gm)"/><rect x="906.0" y="192.0" width="220.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1016.0" y="227.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Agent chuyển tiền</text><rect x="60.0" y="300.0" width="1080.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="329.8" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Tách vai: mỗi vai một chủ</text><rect x="84.0" y="362.0" width="165.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.6"/><text x="166.5" y="397.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Email đổi tài khoản</text><line x1="251.0" y1="392.0" x2="259.0" y2="392.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="267.0,392.0 259.0,396.4 259.0,387.6" fill="var(--p)"/><rect x="269.0" y="362.0" width="190.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="364.0" y="397.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">AI diễn giải, chuẩn bị</text><line x1="461.0" y1="392.0" x2="469.0" y2="392.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="477.0,392.0 469.0,396.4 469.0,387.6" fill="var(--a)"/><rect x="479.0" y="362.0" width="270.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="614.0" y="397.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người có thẩm quyền quyết định</text><line x1="751.0" y1="392.0" x2="759.0" y2="392.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="767.0,392.0 759.0,396.4 759.0,387.6" fill="var(--p)"/><rect x="769.0" y="362.0" width="150.0" height="60.0" rx="10" fill="var(--p)"/><text x="844.0" y="397.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Hệ thống thực thi</text><line x1="921.0" y1="392.0" x2="929.0" y2="392.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="937.0,392.0 929.0,396.4 929.0,387.6" fill="var(--p)"/><rect x="939.0" y="362.0" width="150.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="1014.0" y="397.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow ghi nhận</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tốc độ của AI làm sai sót lan trước khi ai kịp nhìn.</text></svg>
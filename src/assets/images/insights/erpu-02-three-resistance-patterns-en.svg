<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Three common patterns of resistance: passive resistance, quiet workarounds as the hardest to detect, and open resistance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three common patterns of resistance</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">All three leave ERP out of step with operational reality.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Passive resistance</text><text x="76.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Minimal entry, with spreadsheets and</text><text x="76.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">notebooks kept alongside.</text><rect x="425.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="441.0" y="150.0" width="123.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="502.9" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Hardest to detect</text><text x="441.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quiet workarounds</text><text x="441.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Off-system handling, colleagues entering data</text><text x="441.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">for someone, unofficial processes.</text><rect x="790.0" y="134.0" width="350.0" height="147.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="806.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Open resistance</text><text x="806.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Often middle managers criticizing the system;</text><text x="806.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the most visible and likely to spread.</text><rect x="60.0" y="297.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="330.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All three erode the value of ERP over time.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 662" width="1200" height="662" role="img" aria-label="Five levels of AI in a workflow: level 0 rules only, level 1 AI interprets input, level 2 AI prepares evidence in a fixed procedure, level 3 a narrow agent chooses lookup sources within allowed scope, level 4 an autonomous agent executing actions is not recommended; choose the lowest level that solves the problem." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="662" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Five levels of AI in a workflow: pick the lowest that works</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each level removes some predefined control, so moving up needs a specific reason.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">An orienting framework for discussion, not measured data.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Level and how AI is used</text><text x="646.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Path</text><rect x="60.0" y="158.0" width="570.0" height="66.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="191.0" r="15" fill="#2B74F5"/><text x="92.0" y="196.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text><text x="122.0" y="185.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 0 · Rules only</text><text x="122.0" y="208.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Orders under the limit with complete data move on</text><rect x="646.0" y="158.0" width="494.0" height="66.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="662.0" y="196.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Predefined, easy to test</text><line x1="634.0" y1="191.0" x2="636.0" y2="191.0" stroke="#5B6575" stroke-width="2"/><polygon points="642.0,191.0 636.0,194.3 636.0,187.7" fill="#5B6575"/><rect x="60.0" y="234.0" width="570.0" height="66.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="267.0" r="15" fill="#2B74F5"/><text x="92.0" y="272.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="261.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 1 · AI interprets input</text><text x="122.0" y="284.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Read an order email, fill fields; rules check</text><rect x="646.0" y="234.0" width="494.0" height="66.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="662.0" y="272.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Predefined, easy to test</text><line x1="634.0" y1="267.0" x2="636.0" y2="267.0" stroke="#5B6575" stroke-width="2"/><polygon points="642.0,267.0 636.0,270.3 636.0,263.7" fill="#5B6575"/><rect x="60.0" y="310.0" width="570.0" height="66.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="343.0" r="15" fill="#2B74F5"/><text x="92.0" y="348.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="122.0" y="337.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 2 · AI prepares evidence</text><text x="122.0" y="360.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">A fixed procedure assembles the file for the approver</text><rect x="646.0" y="310.0" width="494.0" height="66.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="662.0" y="348.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Predefined, easy to test</text><line x1="634.0" y1="343.0" x2="636.0" y2="343.0" stroke="#5B6575" stroke-width="2"/><polygon points="642.0,343.0 636.0,346.3 636.0,339.7" fill="#5B6575"/><rect x="60.0" y="386.0" width="570.0" height="66.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="419.0" r="15" fill="#A78BFA"/><text x="92.0" y="424.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="122.0" y="413.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 3 · Narrow agent</text><text x="122.0" y="436.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Chooses sources and lookup order to prepare evidence</text><rect x="646.0" y="386.0" width="494.0" height="66.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="662.0" y="424.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">AI chooses within allowed scope</text><line x1="634.0" y1="419.0" x2="636.0" y2="419.0" stroke="#5B6575" stroke-width="2"/><polygon points="642.0,419.0 636.0,422.3 636.0,415.7" fill="#5B6575"/><rect x="60.0" y="462.0" width="570.0" height="66.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="92.0" cy="495.0" r="15" fill="#5B6575"/><text x="92.0" y="500.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122.0" y="489.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 4 · Autonomous agent that executes</text><text x="122.0" y="512.7" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">Creates and runs its own actions</text><rect x="646.0" y="462.0" width="494.0" height="66.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.6" stroke-dasharray="6 5"/><text x="662.0" y="500.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Not recommended: actions run only when a rule permits</text><line x1="634.0" y1="495.0" x2="636.0" y2="495.0" stroke="#5B6575" stroke-width="2"/><polygon points="642.0,495.0 636.0,498.3 636.0,491.7" fill="#5B6575"/><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Choose the lowest level that solves the problem.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three illustrative processes: approving purchase orders against a limit uses level 0, receiving orders by email and scan uses levels 1 and 2, quality complaints may merit level 3 with a read-only narrow agent." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three processes, three levels: only one fits a narrow agent</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Three illustrative scenarios, three different levels.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Illustrative scenarios, not data or customer cases.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Process</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Where it is slow</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Level chosen</text><rect x="60.0" y="158.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="199.3" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Approving purchase orders against</text><text x="76.0" y="220.4" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">a limit</text><rect x="410.0" y="158.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="199.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Clear steps, thresholds issued by an</text><text x="426.0" y="218.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">authorized person</text><rect x="800.0" y="158.0" width="340.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="209.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 0: rules only</text><line x1="784.0" y1="204.0" x2="790.0" y2="204.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,204.0 790.0,207.3 790.0,200.7" fill="#5B6575"/><rect x="60.0" y="262.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="313.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Receiving orders by email and scan</text><rect x="410.0" y="262.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="303.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Reading and re-keying; held orders need the</text><text x="426.0" y="322.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">same file</text><rect x="800.0" y="262.0" width="340.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="313.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 1, plus level 2 for held orders</text><line x1="784.0" y1="308.0" x2="790.0" y2="308.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,308.0 790.0,311.3 790.0,304.7" fill="#5B6575"/><rect x="60.0" y="366.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="417.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Quality complaints</text><rect x="410.0" y="366.0" width="370.0" height="92.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.4"/><text x="426.0" y="407.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Which source to check next depends on</text><text x="426.0" y="426.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">each finding</text><rect x="800.0" y="366.0" width="340.0" height="92.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="417.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 3: narrow, read-only agent</text><line x1="784.0" y1="412.0" x2="790.0" y2="412.0" stroke="#5B6575" stroke-width="2"/><polygon points="796.0,412.0 790.0,415.3 790.0,408.7" fill="#5B6575"/><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Only one of three has room for an agent, and it still only prepares evidence.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Four questions to choose a level: can the steps be written in advance, is the bottleneck unstructured input, do evidence sources vary by case, and what happens when it is wrong; consider level 3 only when steps cannot be written ahead, sources vary by case and the consequence is acceptable." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four questions to pick the right level of AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Answer these four before thinking about an agent.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Can the steps be written</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">in advance?</text><text x="76.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">If yes, keep a predefined path.</text><text x="76.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">An agent only if the next step</text><text x="76.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">depends on the last result.</text><rect x="335.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Is the bottleneck</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">unstructured input?</text><text x="351.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Re-reading and re-keying emails</text><text x="351.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">or scans usually needs only</text><text x="351.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">level 1.</text><rect x="610.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Do evidence sources vary</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">by case?</text><text x="626.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">The same set of information is</text><text x="626.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">level 2. Only if the next source</text><text x="626.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">depends on findings, consider</text><text x="626.0" y="326.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">level 3.</text><rect x="885.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">What happens when it</text><text x="901.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">is wrong?</text><text x="901.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Output is a file a person reviews,</text><text x="901.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">with a trail: acceptable.</text><rect x="60.0" y="366.0" width="1080.0" height="116.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="398.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Consider level 3 only when</text><rect x="84.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="254.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Q1: steps cannot be written ahead</text><rect x="436.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="606.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Q3: sources vary by case</text><rect x="788.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Q4: consequence is acceptable</text><rect x="60.0" y="498.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="531.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">In other cases a lower level is usually enough.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="In a DMS documents are separate units with no links; in operational reality knowledge is a network connecting documents, products, processes, decisions and incidents." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="644" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge is a connected network, not a set of files</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">In a DMS, each document is a separate unit. In operations, knowledge is the connections.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="623.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="340.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">In a DMS</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Each document is a separate unit: findable, readable, approvable</text><rect x="98.0" y="264.0" width="64.0" height="84.0" rx="8" fill="v
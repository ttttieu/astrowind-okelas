--hd)" text-anchor="start">In operational reality</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Knowledge is a network of connections</text><line x1="700.0" y1="264.0" x2="1050.0" y2="264.0" stroke="var(--p)" stroke-width="2"/><line x1="700.0" y1="264.0" x2="876.0" y2="334.0" stroke="var(--p)" stroke-width="2"/><line x1="1050.0" y1="264.0" x2="876.0" y2="334.0" stroke="var(--p)" stroke-width="2"/><line x1="876.0" y1="334.0" x2="700.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><line x1="876.0" y1="334.0" x2="1050.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><line x1="700.0" y1="414.0" x2="1050.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><rect x="638.0" y="246.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="700.0" y="269.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Document</text><rect x="988.0" y="246.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="269.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Product</text><rect x="814.0" y="316.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="876.0" y="339.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Process</text><rect x="638.0" y="396.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="700.0" y="419.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision</text><rect x="988.0" y="396.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="419.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Incident</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The real question isn’t only “which document covers this?” but “in this context, what do I need to know?”</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="Vị trí kế toán công nợ gồm năm hoạt động; với mỗi hoạt động AI giúp ở mức diễn giải đầu vào và chuẩn bị evidence, còn con người giữ phần xử lý ca ngoài rule, đặt ngưỡng, duyệt, quyết định và ký." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Một vị trí là nhiều bước, mỗi bước một mức phù hợp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Vị trí kế toán công nợ (tình huống minh họa): phần AI giúp là diễn giải và chuẩn bị.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Hoạt động</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">AI có thể giúp ở mức</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Người giữ</text><rect x="60.0" y="158.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="197.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Đối chiếu hóa đơn với đơn hàng</text><rect x="410.0" y="158.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="197.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Diễn giải chứng từ, đối chiếu để rule chạy</text><rect x="800.0" y="158.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="197.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ca lệch ngoài rule</text><line x1="404.0" y1="192.0" x2="400.0" y2="192.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,192.0 400.0,195.3 400.0,188.7" fill="var(--gm)"/><rect x="60.0" y="236.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="275.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Theo dõi công nợ quá hạn</text><rect x="410.0" y="236.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="275.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Gom, tổng hợp; rule nhắc theo ngưỡng</text><rect x="800.0" y="236.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="275.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đặt ngưỡng, khách đặc biệt</text><line x1="404.0" y1="270.0" x2="400.0" y2="270.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,270.0 400.0,273.3 400.0,266.7" fill="var(--gm)"/><rect x="60.0" y="314.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="353.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nhắc khách hàng thanh toán</text><rect x="410.0" y="314.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="353.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Soạn nháp theo bối cảnh</text><rect x="800.0" y="314.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="353.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Duyệt và gửi khách quan trọng</text><line x1="404.0" y1="348.0" x2="400.0" y2="348.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,348.0 400.0,351.3 400.0,344.7" fill="var(--gm)"/><rect x="60.0" y="392.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="431.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Xử lý tranh chấp</text><rect x="410.0" y="392.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="431.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chuẩn bị hồ sơ, ca tương tự</text><rect x="800.0" y="392.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="431.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Quyết định và đàm phán</text><line x1="404.0" y1="426.0" x2="400.0" y2="426.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,426.0 400.0,429.3 400.0,422.7" fill="var(--gm)"/><rect x="60.0" y="470.0" width="340.0" height="68.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="509.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Báo cáo định kỳ</text><rect x="410.0" y="470.0" width="380.0" height="68.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tổng hợp số liệu kèm nguồn</text><rect x="800.0" y="470.0" width="340.0" height="68.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="816.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rà soát và ký</text><line x1="404.0" y1="504.0" x2="400.0" y2="504.0" stroke="var(--gm)" stroke-width="2"/><polygon points="406.0,504.0 400.0,507.3 400.0,500.7" fill="var(--gm)"/><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giao bước nào cũng là giao diễn giải và chuẩn bị, không giao quyết định.</text></svg>
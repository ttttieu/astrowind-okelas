<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Thẻ nhiệm vụ gồm bảy mục: mục tiêu, đầu vào, đầu ra, ai nhận đầu ra, quyền hạn, khi nào dừng và chuyển cho người, ai chịu trách nhiệm; hai mục cuối thuộc về con người." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Thẻ nhiệm vụ: giao một bước, không giao quyết định</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Thẻ nhiệm vụ làm việc giao trở nên cụ thể và kiểm tra được.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="165.0" r="15" fill="var(--p)"/><text x="90.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="118.0" y="160.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mục tiêu</text><text x="118.0" y="181.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">AI làm việc gì, phạm vi nào</text><rect x="60.0" y="206.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="237.0" r="15" fill="var(--p)"/><text x="90.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="118.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đầu vào</text><text x="118.0" y="253.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">AI được đọc những gì</text><rect x="60.0" y="278.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="309.0" r="15" fill="var(--p)"/><text x="90.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="118.0" y="304.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đầu ra</text><text x="118.0" y="325.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dạng, nơi trả, kèm nguồn và độ chắc chắn</text><rect x="60.0" y="350.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="381.0" r="15" fill="var(--p)"/><text x="90.0" y="386.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="118.0" y="376.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ai nhận đầu ra</text><text x="118.0" y="397.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Rule nào đọc, hoặc người nào xem</text><rect x="606.0" y="134.0" width="534.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="636.0" cy="165.0" r="15" fill="var(--p)"/><text x="636.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="664.0" y="160.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền hạn</text><text x="664.0" y="181.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Được và không được làm gì</text><rect x="606.0" y="206.0" width="534.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="237.0" r="15" fill="var(--a)"/><text x="636.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="664.0" y="232.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khi nào dừng</text><text x="664.0" y="253.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Ca không chắc chắn, thiếu thông tin, ngoài phạm vi: chuyển cho người</text><rect x="606.0" y="278.0" width="534.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="636.0" cy="309.0" r="15" fill="var(--a)"/><text x="636.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="664.0" y="304.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ai chịu trách nhiệm</text><text x="664.0" y="325.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Kiểm tra bước này định kỳ</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hai mục cuối thuộc về con người.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Bốn điểm phân biệt participant với công cụ: danh tính riêng, phạm vi quyền gắn với nhiệm vụ, trách nhiệm truy vết được, vòng đời quản lý được; mức quản trị đầy đủ dành cho vai chạy liên tục, ảnh hưởng quyết định thực tế hoặc cần giải trình ISO hay GMP." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI participant khác công cụ ở bốn điểm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mức quản trị đầy đủ nên dành cho vai AI có rủi ro, không áp cho mọi tác vụ.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Danh tính riêng</text><text x="76.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không dùng chung khóa;</text><text x="76.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">gắn với một mục đích và</text><text x="76.0" y="310.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phạm vi việc.</text><rect x="335.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền gắn với nhiệm vụ</text><text x="351.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không rộng “phòng khi cần”.</text><rect x="610.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trách nhiệm truy vết được</text><text x="626.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả nào do participant nào,</text><text x="626.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">với dữ liệu và quyền nào.</text><rect x="885.0" y="134.0" width="255.0" height="214.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vòng đời quản lý được</text><text x="901.0" y="271.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cấp khi tham gia, giám sát, thu</text><text x="901.0" y="290.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hồi khi vai trò kết thúc.</text><rect x="60.0" y="366.0" width="1080.0" height="116.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="398.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Cần mức quản trị đầy đủ khi</text><rect x="84.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="254.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chạy liên tục theo vai cố định</text><rect x="436.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="606.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ảnh hưởng quyết định thực tế</text><rect x="788.0" y="422.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="958.0" y="449.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cần giải trình ISO, GMP</text><rect x="60.0" y="498.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="531.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tác vụ rủi ro thấp, như tóm tắt tham khảo, vẫn dùng mô hình công cụ đơn giản.</text></svg>
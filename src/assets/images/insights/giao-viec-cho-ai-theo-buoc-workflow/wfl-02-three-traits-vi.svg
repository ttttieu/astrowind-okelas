<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba đặc điểm của bước nên giao: lặp lại nhiều và khối lượng lớn, cần chuẩn bị hoặc tổng hợp thông tin trước khi con người quyết định, và đúng sai có thể định nghĩa và kiểm chứng; bước quan hệ, đàm phán, phán đoán ở tình huống mơ hồ nên giữ cho con người." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba đặc điểm của một bước phù hợp để giao</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bước hội đủ ba đặc điểm thì giao dễ kiểm soát.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="200.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lặp lại nhiều, khối lượng lớn</text><text x="84.0" y="262.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tần suất cao, tốn thời gian tích lũy dù</text><text x="84.0" y="283.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">mỗi lần không phức tạp.</text><rect x="427.0" y="134.0" width="346.0" height="200.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cần chuẩn bị trước khi</text><text x="489.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">người quyết định</text><text x="451.0" y="262.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI gom bối cảnh và dữ liệu; người tập</text><text x="451.0" y="283.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">trung vào phần cần phán đoán.</text><rect x="794.0" y="134.0" width="346.0" height="200.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Đúng sai định nghĩa và</text><text x="856.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">kiểm chứng được</text><text x="818.0" y="262.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nói rõ được bước đã làm đúng hay chưa.</text><rect x="60.0" y="352.0" width="1080.0" height="100.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="382.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Nên giữ cho con người</text><text x="84.0" y="411.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Xây quan hệ, đàm phán, phán đoán ở tình huống mơ hồ chưa có tiền lệ</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây là đánh giá hiện tại; thay đổi nên đi qua rà soát có chủ đích.</text></svg>
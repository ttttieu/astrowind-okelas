<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 614" width="1200" height="614" role="img" aria-label="Một hộp AI agent ở giữa, nối tới năm điểm truy cập: cơ sở dữ liệu, API, email, tài liệu nội bộ, thực thi code." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="614" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agent có quyền truy cập là một phần của bề mặt tấn công</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi điểm truy cập là một mục tiêu có thể bị nhắm tới, không cần tấn công chính mô hình.</text><line x1="60.0" y1="530.0" x2="1140.0" y2="530.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="552.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mô tả theo bài viết; các điểm truy cập là loại quyền bài viết liệt kê, không phải kiến trúc chuẩn.</text><text x="60.0" y="593.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><line x1="600.0" y1="285.0" x2="230.0" y2="180.0" stroke="var(--gm)" stroke-width="2"/><line x1="600.0" y1="285.0" x2="600.0" y2="180.0" stroke="var(--gm)" stroke-width="2"/><line x1="600.0" y1="285.0" x2="970.0" y2="180.0" stroke="var(--gm)" stroke-width="2"/><line x1="600.0" y1="285.0" x2="415.0" y2="390.0" stroke="var(--gm)" stroke-width="2"/><line x1="600.0" y1="285.0" x2="785.0" y2="390.0" stroke="var(--gm)" stroke-width="2"/><rect x="60.0" y="150.0" width="340.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="230.0" y="185.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Cơ sở dữ liệu</text><rect x="430.0" y="150.0" width="340.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="600.0" y="185.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">API: CRM, ERP, thanh toán</text><rect x="800.0" y="150.0" width="340.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="970.0" y="185.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Email</text><rect x="245.0" y="360.0" width="340.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="415.0" y="395.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Tài liệu nội bộ</text><rect x="615.0" y="360.0" width="340.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="785.0" y="395.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Thực thi code</text><rect x="390.0" y="240.0" width="420.0" height="90.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="290.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="middle">AI agent</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tấn công không cần nhắm vào mô hình; có thể nhắm vào mọi điểm truy cập mà agent có thể chạm tới.</text></svg>
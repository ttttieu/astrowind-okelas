<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Ba khối quyền riêng cộng lại, dẫn tới khối bán kính ảnh hưởng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="584" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bán kính ảnh hưởng là tổng những gì agent có thể chạm tới</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">OWASP mô tả đây là "bài toán bán kính ảnh hưởng" trong khung Top 10 cho agentic applications.</text><line x1="60.0" y1="500.0" x2="1140.0" y2="500.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="522.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Minh họa khái niệm "bán kính ảnh hưởng" theo mô tả của OWASP trong bài; không phải số liệu đo lường.</text><text x="60.0" y="563.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="340.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="230.0" y="206.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Thông tin xác thực</text><text x="415.0" y="214.5" font-size="26" font-weight="700" fill="var(--p)" text-anchor="middle">+</text><rect x="430.0" y="150.0" width="340.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="206.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Công cụ được gọi</text><text x="785.0" y="214.5" font-size="26" font-weight="700" fill="var(--p)" text-anchor="middle">+</text><rect x="800.0" y="150.0" width="340.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="970.0" y="206.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">API có thể tới</text><text x="600.0" y="286.5" font-size="26" font-weight="700" fill="var(--p)" text-anchor="middle">=</text><rect x="230.0" y="300.0" width="740.0" height="90.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="352.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Bán kính ảnh hưởng (blast radius)</text><rect x="60.0" y="430.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="463.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mức phơi nhiễm bằng tổng thông tin xác thực, công cụ và API mà agent có thể chạm tới.</text></svg>
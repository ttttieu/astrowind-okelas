<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-label="Five warning signs processes are not ready for ERP: they live in people’s heads, every team has its own way, workshops end with it depends, exceptions outnumber the rule and accountability is unclear." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="512" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five warning signs your processes are not ready</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each sign shows there is no single process version clear enough to configure.</text><line x1="60.0" y1="428.0" x2="1140.0" y2="428.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="450.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Signs from the article’s analysis, not statistics.</text><text x="60.0" y="491.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Processes live in</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">people’s heads</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Only verbal</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">descriptions, or an old</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">file no one maintains.</text><rect x="279.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Every team has its</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">own way</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Processes form</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">around personal</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">habits; ERP cannot run</text><text x="295.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">parallel versions.</text><rect x="498.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Workshops end with</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">“it depends”</text><text x="514.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No single agreed version</text><text x="514.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">of the process exists.</text><rect x="717.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Exceptions</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">outnumber the rule</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No one can recall the</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">standard rule.</text><rect x="936.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Accountability</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">is unclear</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The answer depends</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">on who happens to</text><text x="952.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">be available.</text><rect x="60.0" y="358.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="391.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If several of these appear, the problem lies in the process before it lies in the software.</text></svg>
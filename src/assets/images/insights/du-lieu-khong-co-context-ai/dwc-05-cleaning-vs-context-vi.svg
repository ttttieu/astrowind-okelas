<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="So sánh hai cột: dọn dẹp làm được sửa lỗi, loại trùng lặp, chuẩn hóa định dạng; vẫn còn thiếu ngưỡng đánh giá, liên kết để truy vết và phiên bản đang hiệu lực." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Dọn dẹp dữ liệu làm được gì, và còn thiếu gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dọn dẹp cần thiết nhưng chưa đủ. Context cần gắn nghĩa, quan hệ và trạng thái.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích theo bài viết, không phải số liệu đo lường.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="288.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Dọn dẹp làm được</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cần thiết, nhưng không tạo ra ý nghĩa.</text><rect x="84.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sửa lỗi nhập liệu</text><rect x="84.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Loại bản ghi trùng lặp</text><rect x="84.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuẩn hóa định dạng</text><rect x="612.0" y="134.0" width="528.0" height="288.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Vẫn còn thiếu</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Context gắn nghĩa, quan hệ và trạng thái cho dữ liệu.</text><rect x="636.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ngưỡng: 48h là tốt hay không?</text><rect x="636.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Liên kết để truy vết xuyên hệ thống</text><rect x="636.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phiên bản nào còn hiệu lực</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Dữ liệu sạch vẫn thiếu ngưỡng đánh giá, thiếu liên kết để truy vết và thiếu trạng thái hiệu lực.</text></svg>
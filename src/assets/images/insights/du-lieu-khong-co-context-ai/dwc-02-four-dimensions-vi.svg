<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Bốn ô, mỗi ô một chiều thiếu context: cấu trúc không nhất quán, thiếu định nghĩa nghiệp vụ, thiếu quan hệ giữa các thực thể, thiếu trạng thái và hiệu lực; mỗi ô có ví dụ và hệ quả với AI." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn chiều thiếu context trong dữ liệu doanh nghiệp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi chiều tạo một loại khoảng trống khác nhau khi AI sử dụng dữ liệu.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn chiều là cách phân loại thực tiễn trong bài, không phải danh mục học thuật chính thức. Ví dụ minh họa tổng hợp.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="154.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Cấu trúc nhất quán</text><text x="84.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: “Nhiệt độ” ghi ba kiểu ở ba sheet: số thập phân, số nguyên</text><text x="84.0" y="219.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và OK/NG.</text><text x="84.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Hệ quả với AI: AI không so sánh được xu hướng giữa các sheet.</text><rect x="606.0" y="134.0" width="534.0" height="154.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Định nghĩa nghiệp vụ</text><text x="630.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: “Thời gian xử lý: 48h”, không rõ bắt đầu và kết thúc ở đâu.</text><text x="630.0" y="227.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Hệ quả với AI: Không biết 48h là tốt hay đã vượt ngưỡng cho loại</text><text x="630.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">sản phẩm này.</text><rect x="60.0" y="300.0" width="534.0" height="154.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="328.0" r="15" fill="var(--p)"/><text x="90.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="336.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quan hệ giữa các thực thể</text><text x="84.0" y="365.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: Đơn hàng trong ERP không nối với phiếu kiểm tra nguyên liệu</text><text x="84.0" y="385.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trong Excel QMS.</text><text x="84.0" y="412.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Hệ quả với AI: AI chỉ trả lời được trong từng silo, không truy vết</text><text x="84.0" y="432.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">xuyên silo.</text><rect x="606.0" y="300.0" width="534.0" height="154.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="328.0" r="15" fill="var(--gm)"/><text x="636.0" y="333.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="336.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trạng thái và hiệu lực</text><text x="630.0" y="365.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ví dụ: Không rõ phiên bản SOP nào còn hiệu lực, nhà cung cấp nào còn</text><text x="630.0" y="385.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">được phê duyệt.</text><text x="630.0" y="412.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Hệ quả với AI: AI có thể trả lời bằng thông tin đã lỗi thời mà người</text><text x="630.0" y="432.8" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">dùng không nhận ra.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Dữ liệu có thể đầy đủ nhưng vẫn thiếu một trong bốn chiều này.</text></svg>
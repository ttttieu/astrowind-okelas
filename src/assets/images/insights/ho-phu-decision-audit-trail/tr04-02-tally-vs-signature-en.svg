<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Table comparing the tiger tally and digital signature on the issuing side, the checking side and the link to content." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Tiger tally and digital signature: the same verification logic</text><g transform="translate(0 121.2)"><text x="348.51428571428573" y="16" font-size="14" font-weight="700" class="mut">Tiger tally</text><text x="753.257142857143" y="16" font-size="14" font-weight="700" class="mut">Digital signature</text><rect x="60" y="34" width="270.51428571428573" height="69" rx="16" class="bg"/><text x="82" y="75" font-size="19" font-weight="600" class="tx">Issuing side</text><rect x="344.51428571428573" y="34" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="366.51428571428573" y="75" font-size="19" font-weight="600" class="tx">One half held by the court</text><rect x="749.257142857143" y="34" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="771.257142857143" y="75" font-size="19" font-weight="600" class="tx">The signer’s private key</text><rect x="60" y="117" width="270.51428571428573" height="69" rx="16" class="bg"/><text x="82" y="158" font-size="19" font-weight="600" class="tx">Checking side</text><rect x="344.51428571428573" y="117" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="366.51428571428573" y="158" font-size="19" font-weight="600" class="tx">The general matches the two halves</text><rect x="749.257142857143" y="117" width="390.7428571428572" height="69" rx="16" class="bb"/><text x="771.257142857143" y="158" font-size="19" font-weight="600" class="tx">The public key checks the signature</text><rect x="60" y="200" width="270.51428571428573" height="94" rx="16" class="bg"/><text x="82" y="241" font-size="19" font-weight="600" class="tx">Link to content</text><rect x="344.51428571428573" y="200" width="390.7428571428572" height="94" rx="16" class="bp"/><text x="366.51428571428573" y="241" font-size="19" font-weight="600" class="tp">Not tied to the content of the order</text><rect x="749.257142857143" y="200" width="390.7428571428572" height="94" rx="16" class="bb"/><text x="771.257142857143" y="241" font-size="19" font-weight="600" class="tx">Tied to the signed content; edits are</text><text x="771.257142857143" y="266" font-size="19" font-weight="600" class="tx">detected</text></g></svg>

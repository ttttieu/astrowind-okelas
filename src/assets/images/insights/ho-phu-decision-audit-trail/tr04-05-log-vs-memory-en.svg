<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Three kinds of trace: system log for IT, record audit trail for quality, decision history for executives." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">From system logs to organizational memory</text><g transform="translate(0 148.5)"><rect x="60" y="0" width="346.6666666666667" height="155" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">FOR IT</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">System log</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Who did what in the system, and</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">when.</text><rect x="426.6666666666667" y="0" width="346.6666666666667" height="155" rx="16" class="bb"/><text x="448.6666666666667" y="35" font-size="13" font-weight="600" class="mut">FOR QUALITY</text><text x="448.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Record audit trail</text><text x="448.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Which record changed, by whom,</text><text x="448.6666666666667" y="126" font-size="17" font-weight="400" class="mut">when.</text><rect x="793.3333333333334" y="0" width="346.6666666666667" height="155" rx="16" class="bp"/><text x="815.3333333333334" y="35" font-size="13" font-weight="600" class="tp">FOR EXECUTIVES</text><text x="815.3333333333334" y="70" font-size="22" font-weight="600" class="tp">Decision history</text><text x="815.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Why a decision was made and on</text><text x="815.3333333333334" y="126" font-size="17" font-weight="400" class="mut">what basis.</text></g><text x="60" y="337.5" font-size="13" font-weight="400" class="mut">Governance perspective only; not compliance or legal advice.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img" aria-label="Table of three verification layers: tiger tally, digital signature and decision history, showing what each can and cannot answer." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="486" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Three layers of verification and what each can answer</text><g transform="translate(0 108)"><text x="64" y="16" font-size="14" font-weight="700" class="mut">Layer</text><text x="370.22222222222223" y="16" font-size="14" font-weight="700" class="mut">Can answer</text><text x="764.1111111111112" y="16" font-size="14" font-weight="700" class="mut">Cannot answer</text><rect x="60" y="34" width="292.22222222222223" height="94" rx="16" class="bg"/><text x="82" y="76" font-size="20" font-weight="600" class="tx">Tiger tally</text><rect x="366.22222222222223" y="34" width="379.88888888888897" height="94" rx="16" class="bb"/><text x="388.22222222222223" y="75" font-size="19" font-weight="600" class="tx">Does the token match?</text><rect x="760.1111111111112" y="34" width="379.88888888888897" height="94" rx="16" class="bp"/><text x="782.1111111111112" y="75" font-size="19" font-weight="600" class="tp">Did the authority really intend this</text><text x="782.1111111111112" y="100" font-size="19" font-weight="600" class="tp">order?</text><rect x="60" y="142" width="292.22222222222223" height="94" rx="16" class="bg"/><text x="82" y="184" font-size="20" font-weight="600" class="tx">Digital signature</text><rect x="366.22222222222223" y="142" width="379.88888888888897" height="94" rx="16" class="bb"/><text x="388.22222222222223" y="183" font-size="19" font-weight="600" class="tx">Who signed, and was it altered after</text><text x="388.22222222222223" y="208" font-size="19" font-weight="600" class="tx">signing?</text><rect x="760.1111111111112" y="142" width="379.88888888888897" height="94" rx="16" class="bp"/><text x="782.1111111111112" y="183" font-size="19" font-weight="600" class="tp">Why the decision was made, on</text><text x="782.1111111111112" y="208" font-size="19" font-weight="600" class="tp">what evidence?</text><rect x="60" y="250" width="292.22222222222223" height="94" rx="16" class="bg"/><text x="82" y="292" font-size="20" font-weight="600" class="tx">Decision history</text><rect x="366.22222222222223" y="250" width="379.88888888888897" height="94" rx="16" class="bb"/><text x="388.22222222222223" y="291" font-size="19" font-weight="600" class="tx">What it rested on and which steps it</text><text x="388.22222222222223" y="316" font-size="19" font-weight="600" class="tx">went through.</text><rect x="760.1111111111112" y="250" width="379.88888888888897" height="94" rx="16" class="bp"/><text x="782.1111111111112" y="291" font-size="19" font-weight="600" class="tp">Exists only if the organization</text><text x="782.1111111111112" y="316" font-size="19" font-weight="600" class="tp">designs and keeps it.</text></g></svg>

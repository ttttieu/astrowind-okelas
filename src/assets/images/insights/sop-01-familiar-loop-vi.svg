<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Vòng lặp: audit ghi nhận non-conformance, training nhắc lại SOP và nhân viên ký xác nhận, một tháng sau vấn đề lại xảy ra, viết thêm SOP chi tiết hơn, sáu tháng sau kho tài liệu lớn hơn nhưng vấn đề không nhỏ hơn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Vòng lặp quen thuộc khi SOP không được thực thi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phản ứng quen thuộc coi đây là vấn đề tuân thủ và tăng kiểm soát.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="240.0" height="140.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="90.0" cy="164.0" r="15" fill="var(--mut)"/><text x="90.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="202.6" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Audit ghi nhận</text><text x="76.0" y="221.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">non-conformance:</text><text x="76.0" y="240.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">quy trình không được thực</text><text x="76.0" y="259.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">thi đúng SOP</text><line x1="306.0" y1="204.0" x2="325.0" y2="204.0" stroke="var(--mut)" stroke-width="2"/><polygon points="334.0,204.0 325.0,208.9 325.0,199.1" fill="var(--mut)"/><rect x="340.0" y="134.0" width="240.0" height="140.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="370.0" cy="164.0" r="15" fill="var(--p)"/><text x="370.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="356.0" y="202.6" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Training nhắc lại SOP;</text><text x="356.0" y="221.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">nhân viên ký xác nhận đã</text><text x="356.0" y="240.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">được đào tạo</text><line x1="586.0" y1="204.0" x2="605.0" y2="204.0" stroke="var(--mut)" stroke-width="2"/><polygon points="614.0,204.0 605.0,208.9 605.0,199.1" fill="var(--mut)"/><rect x="620.0" y="134.0" width="240.0" height="140.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="650.0" cy="164.0" r="15" fill="var(--a)"/><text x="650.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="636.0" y="202.6" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Một tháng sau: vấn đề tương</text><text x="636.0" y="221.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">tự lại xảy ra</text><line x1="866.0" y1="204.0" x2="885.0" y2="204.0" stroke="var(--mut)" stroke-width="2"/><polygon points="894.0,204.0 885.0,208.9 885.0,199.1" fill="var(--mut)"/><rect x="900.0" y="134.0" width="240.0" height="140.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="930.0" cy="164.0" r="15" fill="var(--p)"/><text x="930.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="916.0" y="202.6" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Viết thêm SOP chi tiết hơn,</text><text x="916.0" y="221.7" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">thêm bước kiểm tra và chữ ký</text><line x1="1020.0" y1="276.0" x2="1020.0" y2="297.0" stroke="var(--mut)" stroke-width="2"/><polygon points="1020.0,306.0 1015.0,297.0 1025.0,297.0" fill="var(--mut)"/><rect x="60.0" y="308.0" width="1080.0" height="62.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="345.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Sáu tháng sau: kho tài liệu lớn hơn, vấn đề không nhỏ hơn</text><rect x="60.0" y="386.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="419.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Vòng lặp coi đây là vấn đề tuân thủ. Nguồn gốc thực sự của vấn đề thường nằm ở chỗ khác.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="A profile template form with two columns of fields to complete for each agent." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="664" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A profile template: one searchable record per agent</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The fields the article proposes, arranged as a form to complete for each agent.</text><line x1="60.0" y1="580.0" x2="1140.0" y2="580.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="602.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative template of the fields per the article; the article gives no example profile.</text><text x="60.0" y="643.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="350.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="176.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Authority profile: [agent name]</text><text x="88.0" y="215.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Identity (unique ID)</text><rect x="88.0" y="222.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="88.0" y="259.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Owner</text><rect x="88.0" y="266.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="88.0" y="303.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Purpose</text><rect x="88.0" y="310.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="88.0" y="347.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Risk profile</text><rect x="88.0" y="354.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="88.0" y="391.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Authority tier</text><rect x="88.0" y="398.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="88.0" y="435.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Least-privilege access</text><rect x="88.0" y="442.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="215.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Data it may read</text><rect x="610.0" y="222.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="259.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Tools and APIs listed</text><rect x="610.0" y="266.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="303.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Entities it can affect</text><rect x="610.0" y="310.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="347.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Approval points and approver</text><rect x="610.0" y="354.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="391.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Review schedule and revocation conditions</text><rect x="610.0" y="398.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="610.0" y="435.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Evidence trail</text><rect x="610.0" y="442.0" width="460.0" height="16.0" rx="6" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><rect x="60.0" y="510.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="543.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">One searchable record per agent, not a set of loose documents.</text></svg>
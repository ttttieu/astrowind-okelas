<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 706" width="1200" height="706" role="img" aria-label="Four numbered columns Identity, Authority, Responsibility, Audit, with a top band for purpose and risk and a bottom band for least-privilege access." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="706" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The profile puts four components in one record</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Identity, Authority, Responsibility and Audit sit together in one document per agent.</text><line x1="60.0" y1="622.0" x2="1140.0" y2="622.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="644.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four components per the article; placing the other fields under each column is OKELAS’s grouping.</text><text x="60.0" y="685.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Purpose and risk profile</text><rect x="60.0" y="200.0" width="258.0" height="262.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="78.0" y="237.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Identity</text><text x="78.0" y="270.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A unique ID for the agent</text><text x="78.0" y="302.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">No shared account or API key</text><rect x="334.0" y="200.0" width="258.0" height="262.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="352.0" y="237.9" font-size="19" font-weight="700" fill="var(--a)" text-anchor="start">Authority</text><text x="352.0" y="270.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tier: Read · Request ·</text><text x="352.0" y="290.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Recommend · Execute</text><text x="352.0" y="322.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Data it may read</text><text x="352.0" y="353.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tools and APIs listed by name</text><text x="352.0" y="385.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Entities it can affect</text><text x="352.0" y="416.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Points that need approval</text><rect x="608.0" y="200.0" width="258.0" height="262.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="626.0" y="237.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Responsibility</text><text x="626.0" y="270.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Owner: a specific person or role</text><text x="626.0" y="302.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A named accountable individual</text><rect x="882.0" y="200.0" width="258.0" height="262.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="900.0" y="237.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Audit</text><text x="900.0" y="270.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Evidence trail</text><text x="900.0" y="302.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Scheduled reviews</text><text x="900.0" y="334.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Immediate revocation</text><rect x="60.0" y="478.0" width="1080.0" height="46.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="506.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Least-privilege access, granted just-in-time</text><rect x="60.0" y="552.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="585.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The profile is a single searchable record, not a set of loose documents.</text></svg>
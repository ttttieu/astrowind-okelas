<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582" width="1200" height="582" role="img" aria-label="Two panels: on the left several agents share one API key; on the right each agent has a separate identity." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="582" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A separate identity is the condition for authority</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">With its own identity, an agent’s actions can be attributed to that agent.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Identity condition per the article; the diagram is schematic, not a specific architecture.</text><text x="60.0" y="561.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="520.0" height="260.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="174.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Shared account or API key</text><rect x="100.0" y="200.0" width="150.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="175.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent A</text><rect x="100.0" y="290.0" width="150.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="175.0" y="320.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent B</text><rect x="360.0" y="240.0" width="180.0" height="60.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="450.0" y="275.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Shared API key</text><line x1="250.0" y1="225.0" x2="360.0" y2="260.0" stroke="var(--gm)" stroke-width="2"/><line x1="250.0" y1="315.0" x2="360.0" y2="280.0" stroke="var(--gm)" stroke-width="2"/><rect x="620.0" y="134.0" width="520.0" height="260.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="644.0" y="174.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">A separate identity per agent</text><rect x="660.0" y="200.0" width="150.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="735.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent A</text><rect x="660.0" y="290.0" width="150.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="735.0" y="320.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent B</text><line x1="812.0" y1="225.0" x2="865.0" y2="225.0" stroke="var(--gm)" stroke-width="2"/><polygon points="874.0,225.0 865.0,229.9 865.0,220.1" fill="var(--gm)"/><line x1="812.0" y1="315.0" x2="865.0" y2="315.0" stroke="var(--gm)" stroke-width="2"/><polygon points="874.0,315.0 865.0,319.9 865.0,310.1" fill="var(--gm)"/><rect x="878.0" y="200.0" width="180.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="968.0" y="230.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Separate identity 1</text><rect x="878.0" y="290.0" width="180.0" height="50.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.4"/><text x="968.0" y="320.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Separate identity 2</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Identity is the condition that gives the other three components meaning.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Two comparison cards: assistant and AI employee, each with two bullet points." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="548" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Governing an AI employee as a temporary assistant</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An assistant answers one question at a time; an AI employee persists and accumulates risk.</text><line x1="60.0" y1="464.0" x2="1140.0" y2="464.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="486.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Comparison per the article; the assistant-versus-employee distinction is the article’s own argument.</text><text x="60.0" y="527.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="88.0" y="184.3" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Assistant</text><text x="88.0" y="232.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Answers each question independently</text><text x="88.0" y="294.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Risk ends with one answer</text><rect x="612.0" y="134.0" width="528.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="184.3" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">AI employee</text><text x="640.0" y="232.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Persists, with stable access</text><text x="640.0" y="294.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Risk accumulates over time</text><rect x="60.0" y="394.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="427.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Governing an AI employee as a temporary assistant leaves its risk unmanaged.</text></svg>
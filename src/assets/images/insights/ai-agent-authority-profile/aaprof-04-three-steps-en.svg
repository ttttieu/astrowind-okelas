<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Three numbered steps on a timeline: before go-live, assign an owner, review on schedule." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three steps to put profiles into practice</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The profile comes before go-live, has a named owner, and is reviewed on a schedule.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three steps per the article; the timeline and step labels are OKELAS’s presentation.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><line x1="120.0" y1="230.0" x2="1080.0" y2="230.0" stroke="var(--gm)" stroke-width="3"/><circle cx="220.0" cy="230.0" r="15" fill="var(--gm)"/><text x="220.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="220.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Before go-live</text><text x="220.0" y="358.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Create the profile before the agent is</text><text x="220.0" y="379.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">put into operation.</text><circle cx="600.0" cy="230.0" r="15" fill="var(--p)"/><text x="600.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="600.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Assign an owner</text><text x="600.0" y="358.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Each agent has a specific owner who</text><text x="600.0" y="379.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">is accountable for it.</text><circle cx="980.0" cy="230.0" r="15" fill="var(--gm)"/><text x="980.0" y="235.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="980.0" y="300.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Review on schedule</text><text x="980.0" y="347.7" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Review periodically and when</text><text x="980.0" y="368.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">the task changes, not only after</text><text x="980.0" y="389.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">an incident.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The profile must exist before the agent goes live, not only after an incident.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Hai chuỗi lỗi: chatbot sai có điểm kiểm tra trước khi hành động; agent sai lan qua các bước và khó đảo ngược." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot sai thì còn kiểm tra được trước khi hành động</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Agent sai thường xảy ra trước khi có ai kịp kiểm tra, và có thể không đảo ngược được.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sự cố được bài viết dẫn theo đưa tin công khai tháng 7/2025; hình không nêu số liệu từ các nguồn đó.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="192.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot sai</text><rect x="60.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="175.0" y="253.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Câu trả lời sai</text><line x1="294.0" y1="248.0" x2="318.0" y2="248.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,248.0 318.0,252.4 318.0,243.6" fill="var(--p)"/><rect x="330.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="445.0" y="243.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Người kiểm tra trước</text><text x="445.0" y="263.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">khi hành động</text><line x1="564.0" y1="248.0" x2="588.0" y2="248.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,248.0 588.0,252.4 588.0,243.6" fill="var(--p)"/><rect x="600.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="715.0" y="253.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Sửa hoặc dừng lại</text><text x="60.0" y="338.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Agent sai</text><rect x="60.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="175.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước sai</text><line x1="294.0" y1="394.0" x2="318.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,394.0 318.0,398.4 318.0,389.6" fill="var(--p)"/><rect x="330.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="445.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent hành động tiếp</text><line x1="564.0" y1="394.0" x2="588.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,394.0 588.0,398.4 588.0,389.6" fill="var(--p)"/><rect x="600.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="715.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Sai lan qua các bước</text><line x1="834.0" y1="394.0" x2="858.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="866.0,394.0 858.0,398.4 858.0,389.6" fill="var(--p)"/><rect x="870.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="985.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Khó hoàn tác</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Rủi ro agent nằm ở thứ tự: hành động xảy ra trước khi có điểm kiểm tra.</text></svg>
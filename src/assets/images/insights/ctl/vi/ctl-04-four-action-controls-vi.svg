<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Bốn bước nối tiếp: định danh riêng, quyền tối thiểu, xác nhận độc lập, nhật ký runtime, mỗi bước có mô tả." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn kiểm soát hành động trước khi agent chạm hệ thống</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn yêu cầu này kiểm soát việc AI được làm gì; mỗi yêu cầu cần có trước khi triển khai agent.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn yêu cầu theo bài viết, dẫn khung của Cloud Security Alliance và NIST AI RMF; cần đối chiếu với khung đang áp dụng.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="180.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Định danh riêng</text><text x="64.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi agent có định danh riêng,</text><text x="64.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không dùng chung; coi là danh</text><text x="64.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tính phi con người.</text><rect x="340.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="460.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyền tối thiểu</text><text x="344.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phạm vi quyền hạn đúng theo</text><text x="344.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">nhiệm vụ, không cấp rộng “để</text><text x="344.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">phòng khi cần”.</text><rect x="620.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="740.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Xác nhận độc lập</text><text x="624.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Điểm xác nhận tách khỏi chính</text><text x="624.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">agent, trước hành động có hậu</text><text x="624.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quả lớn hoặc khó đảo ngược.</text><rect x="900.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1020.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhật ký runtime</text><text x="904.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi mọi hành động kèm lý do</text><text x="904.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">và dữ liệu dẫn tới hành động.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bốn yêu cầu này kiểm soát việc AI được làm gì; câu hỏi về tri thức AI dùng là một lớp riêng.</text></svg>
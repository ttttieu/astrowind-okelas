<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 688" width="1200" height="688" role="img" aria-label="A two-axis matrix: intelligence and authority form four quadrants, each with a short description." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="688" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligence and authority are independent axes</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Strong reasoning is not permission to act; set authority by reversibility and the cost of error.</text><line x1="60.0" y1="604.0" x2="1140.0" y2="604.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="626.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article; quadrants are concepts, not a measured scale.</text><text x="60.0" y="667.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="200.0" y="170.0" width="400.0" height="150.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="220.0" y="207.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligent, low authority: proposes only, a</text><text x="220.0" y="229.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">person acts</text><rect x="600.0" y="170.0" width="400.0" height="150.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="620.0" y="207.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligent, high authority: needs the tightest</text><text x="620.0" y="229.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">action controls</text><rect x="200.0" y="320.0" width="400.0" height="150.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="220.0" y="357.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Simple, low authority: low risk,</text><text x="220.0" y="379.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">little automation</text><rect x="600.0" y="320.0" width="400.0" height="150.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="620.0" y="357.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Simple but high authority: scope must be</text><text x="620.0" y="379.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">tightly bounded</text><text x="190.0" y="215.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="end">Intelligence high</text><text x="190.0" y="455.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="end">Intelligence low</text><text x="400.0" y="501.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Authority low</text><text x="800.0" y="501.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Authority high</text><rect x="60.0" y="534.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="567.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Set authority by the reversibility of the action, not by how trustworthy the model feels.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Two error chains: a chatbot error has a check before acting; an agent error spreads across steps and is hard to reverse." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A chatbot error can be checked before acting</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An agent error often happens before anyone can check it, and may be irreversible.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The incident is cited in the article from public reporting in July 2025; the figure gives no numbers from those reports.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="192.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot error</text><rect x="60.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="175.0" y="253.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Wrong answer</text><line x1="294.0" y1="248.0" x2="318.0" y2="248.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,248.0 318.0,252.4 318.0,243.6" fill="var(--p)"/><rect x="330.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="445.0" y="243.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Person checks</text><text x="445.0" y="263.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">before acting</text><line x1="564.0" y1="248.0" x2="588.0" y2="248.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,248.0 588.0,252.4 588.0,243.6" fill="var(--p)"/><rect x="600.0" y="206.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="715.0" y="253.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Correct or stop</text><text x="60.0" y="338.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Agent error</text><rect x="60.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="175.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Wrong step</text><line x1="294.0" y1="394.0" x2="318.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,394.0 318.0,398.4 318.0,389.6" fill="var(--p)"/><rect x="330.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="445.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Agent keeps acting</text><line x1="564.0" y1="394.0" x2="588.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,394.0 588.0,398.4 588.0,389.6" fill="var(--p)"/><rect x="600.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="715.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Error spreads across steps</text><line x1="834.0" y1="394.0" x2="858.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="866.0,394.0 858.0,398.4 858.0,389.6" fill="var(--p)"/><rect x="870.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="985.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Hard to reverse</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">With an agent, the action happens before a checkpoint exists.</text></svg>
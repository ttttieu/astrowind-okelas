<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 492" width="1200" height="492" role="img" aria-label="Five accounting records to prepare before ERP: opening balances, accounts receivable, accounts payable, fixed assets and inventory." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="492" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five accounting records to prepare before ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each group has its own typical problems to resolve before cutover.</text><line x1="60.0" y1="408.0" x2="1140.0" y2="408.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="430.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="471.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="188.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Opening balances</text><text x="76.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The system’s starting</text><text x="76.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">point; errors follow it</text><text x="76.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">for life.</text><rect x="279.0" y="134.0" width="204.0" height="188.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--p)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Accounts receivable</text><text x="295.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Duplicate customers,</text><text x="295.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">partial payments</text><text x="295.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">recorded wrongly, old</text><text x="295.0" y="297.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">uncollectible balances.</text><rect x="498.0" y="134.0" width="204.0" height="188.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Accounts payable</text><text x="514.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Invoices not matched to</text><text x="514.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">receipts, wrong terms,</text><text x="514.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">negative vendor balances</text><text x="514.0" y="297.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">from old errors.</text><rect x="717.0" y="134.0" width="204.0" height="188.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--p)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Fixed assets</text><text x="733.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Disposed assets still</text><text x="733.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">listed; active assets</text><text x="733.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">never recorded.</text><rect x="936.0" y="134.0" width="204.0" height="188.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--p)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Inventory</text><text x="952.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Reconcile to a physical</text><text x="952.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">count and adjust before</text><text x="952.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cutover, not inside ERP.</text><rect x="60.0" y="338.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="371.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Each group needs a named person to confirm it before cutover.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Bốn dấu hiệu phụ thuộc vào tri thức cá nhân: câu trả lời là hỏi anh A, nhân viên mới mất nhiều tháng để làm việc độc lập, chuẩn bị audit phải chạy đua thu thập thông tin, và vắng một người cốt lõi làm vận hành bị ảnh hưởng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn dấu hiệu tổ chức đang phụ thuộc vào tri thức cá nhân</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không phải doanh nghiệp nào cũng có mức rủi ro như nhau, nhưng có những tín hiệu chung.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Dấu hiệu theo bài viết, không phải số liệu khảo sát. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Câu trả lời cho câu hỏi quan trọng về quy trình thường là</text><text x="122.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">“hỏi anh A”, không phải “xem tài liệu này”.</text><rect x="606.0" y="134.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--a)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân viên mới mất nhiều tháng mới làm việc độc lập, vì</text><text x="668.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">cần hướng dẫn trực tiếp cho mọi tình huống.</text><rect x="60.0" y="258.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="294.0" r="15" fill="var(--a)"/><text x="94.0" y="299.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="294.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khi chuẩn bị audit, cả đội chạy đua thu thập thông tin từ</text><text x="122.0" y="316.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhiều người thay vì từ hệ thống.</text><rect x="606.0" y="258.0" width="534.0" height="112.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="294.0" r="15" fill="var(--a)"/><text x="640.0" y="299.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="294.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân viên cốt lõi vắng bất ngờ thì vận hành bị ảnh</text><text x="668.0" y="316.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">hưởng đáng kể, vì thiếu thông tin chứ không phải</text><text x="668.0" y="339.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">thiếu người.</text><rect x="60.0" y="386.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="419.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điểm chung: vấn đề nằm ở thông tin chỉ có trong đầu một người, không ở số lượng nhân sự.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Three-node loop: reason about the next step, call a tool, observe the result; beside it, a card with the source and recorded failure." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The Thought → Action → Observation loop</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The agent model traces back to a 2022 Google Research paper (ReAct), which set out this loop as its core pattern.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Source: ReAct (Yao et al., Google Research, 2022); loop diagram illustrating the article’s description.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="80.0" y="158.0" width="160.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="160.0" y="185.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Reason about</text><text x="160.0" y="204.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">next step</text><rect x="400.0" y="158.0" width="160.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="480.0" y="195.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Call a tool</text><rect x="260.0" y="310.0" width="160.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="340.0" y="347.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Observe the result</text><line x1="246.0" y1="190.0" x2="385.0" y2="190.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="394.0,190.0 385.0,194.9 385.0,185.1" fill="var(--p)"/><line x1="480.0" y1="228.0" x2="387.2" y2="298.6" stroke="var(--p)" stroke-width="2.4"/><polygon points="380.0,304.0 384.2,294.6 390.2,302.5" fill="var(--p)"/><line x1="300.0" y1="310.0" x2="177.6" y2="232.8" stroke="var(--p)" stroke-width="2.4"/><polygon points="170.0,228.0 180.3,228.6 175.0,237.0" fill="var(--p)"/><text x="300.0" y="419.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Repeat until the goal is met</text><rect x="660.0" y="158.0" width="480.0" height="236.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="684.0" y="199.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Source and recorded failure</text><text x="684.0" y="231.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ReAct: Synergizing Reasoning and Acting in Language</text><text x="684.0" y="251.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Models (Yao et al., Google Research, 2022), cited more than</text><text x="684.0" y="271.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">6,000 times.</text><text x="684.0" y="307.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Recorded failure: a flawed reasoning step derailed the loop,</text><text x="684.0" y="327.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and a human had to correct it to get the agent back on track.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Each loop can run many steps before a human reviews it; that is where risk accumulates.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Two lanes: on top, prompt, model, response and person decides; below, goal, plan, select tool and action, with a return arrow." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Two processing models: one pass to answer, or a loop</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The difference is the processing model, not intelligence: one answers a prompt, the other pursues a goal.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Description as presented in the article, used to illustrate the difference between two processing models.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="150.0" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Prompt → Response model: one pass, one decision point</text><rect x="60.0" y="164.0" width="200.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="160.0" y="204.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Prompt</text><line x1="266.0" y1="199.0" x2="285.0" y2="199.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="294.0,199.0 285.0,203.9 285.0,194.1" fill="var(--p)"/><rect x="300.0" y="164.0" width="200.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="400.0" y="194.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Model</text><text x="400.0" y="215.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">processes once</text><line x1="506.0" y1="199.0" x2="525.0" y2="199.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="534.0,199.0 525.0,203.9 525.0,194.1" fill="var(--p)"/><rect x="540.0" y="164.0" width="200.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="640.0" y="204.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Response</text><line x1="746.0" y1="199.0" x2="765.0" y2="199.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="774.0,199.0 765.0,203.9 765.0,194.1" fill="var(--p)"/><rect x="780.0" y="164.0" width="200.0" height="70.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="880.0" y="204.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Person decides</text><text x="60.0" y="296.0" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Goal → Plan → Tool → Action model: a loop until the goal is met</text><rect x="60.0" y="310.0" width="200.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="160.0" y="350.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Goal</text><line x1="266.0" y1="345.0" x2="285.0" y2="345.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="294.0,345.0 285.0,349.9 285.0,340.1" fill="var(--p)"/><rect x="300.0" y="310.0" width="200.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="400.0" y="350.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Plan</text><line x1="506.0" y1="345.0" x2="525.0" y2="345.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="534.0,345.0 525.0,349.9 525.0,340.1" fill="var(--p)"/><rect x="540.0" y="310.0" width="200.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="350.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Select tool</text><line x1="746.0" y1="345.0" x2="765.0" y2="345.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="774.0,345.0 765.0,349.9 765.0,340.1" fill="var(--p)"/><rect x="780.0" y="310.0" width="200.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="880.0" y="350.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Take action</text><line x1="880.0" y1="380.0" x2="880.0" y2="412.0" stroke="var(--p)" stroke-width="2.4"/><line x1="880.0" y1="412.0" x2="160.0" y2="412.0" stroke="var(--p)" stroke-width="2.4"/><line x1="160.0" y1="412.0" x2="160.0" y2="393.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="160.0,384.0 164.9,393.0 155.1,393.0" fill="var(--p)"/><text x="600.0" y="435.1" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="middle">Observe the result, repeat</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The first question is not whether a system contains AI, but which processing model it runs on.</text></svg>
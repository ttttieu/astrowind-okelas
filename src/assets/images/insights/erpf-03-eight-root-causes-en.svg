<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" width="1200" height="686" role="img" aria-label="Eight common root causes of ERP underperformance: unstandardized processes, poor data, uncontrolled scope, too much customization, people not changing how they work, no governance after go-live, finance not ready, and no definition of success." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="686" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Eight root causes of ERP underperformance</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">In the order they appear in the article; numbering does not indicate severity.</text><line x1="60.0" y1="602.0" x2="1140.0" y2="602.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="624.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Grouping from the article’s analysis, not statistics. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="665.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="164.0" r="15" fill="var(--a)"/><text x="92.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="164.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Processes not standardized</text><text x="120.0" y="187.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The project becomes an endless negotiation about how the system</text><text x="120.0" y="206.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">should work.</text><rect x="606.0" y="134.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="164.0" r="15" fill="var(--a)"/><text x="638.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="666.0" y="164.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Unclean, incomplete data</text><text x="666.0" y="187.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The system faithfully reflects every inconsistency it is given.</text><rect x="60.0" y="232.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="262.0" r="15" fill="var(--a)"/><text x="92.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="120.0" y="262.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Scope not controlled</text><text x="120.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Each small request has a reason; together they inflate the project.</text><rect x="606.0" y="232.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="262.0" r="15" fill="var(--a)"/><text x="638.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="666.0" y="262.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Customization without strategy</text><text x="666.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The system gets harder to upgrade and maintain, until it becomes a</text><text x="666.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">black box.</text><rect x="60.0" y="330.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="360.0" r="15" fill="var(--a)"/><text x="92.0" y="365.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="120.0" y="360.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">People do not change how they work</text><text x="120.0" y="383.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">They work around the system: spreadsheets, private notes, exceptions.</text><rect x="606.0" y="330.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="360.0" r="15" fill="var(--a)"/><text x="638.0" y="365.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="666.0" y="360.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">No governance after go-live</text><text x="666.0" y="383.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">A system without an owner is a system no one wants to use.</text><rect x="60.0" y="428.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="458.0" r="15" fill="var(--a)"/><text x="92.0" y="463.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="120.0" y="458.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Finance and accounting not ready</text><text x="120.0" y="481.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No chart of accounts, cost allocation or reconciliation processes</text><text x="120.0" y="500.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">in place.</text><rect x="606.0" y="428.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="458.0" r="15" fill="var(--a)"/><text x="638.0" y="463.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="666.0" y="458.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">No definition of “success”</text><text x="666.0" y="481.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The project is “done” technically even when it creates no</text><text x="666.0" y="500.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">business value.</text><rect x="60.0" y="532.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="565.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All eight are questions about organizational readiness, not about which software to pick.</text></svg>
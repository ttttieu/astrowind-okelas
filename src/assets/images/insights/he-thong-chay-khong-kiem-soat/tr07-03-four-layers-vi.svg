<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 616" width="1200" height="616" role="img" aria-label="Bốn tầng nối tiếp: nhìn thấy, kết nối, định hướng, kiểm soát, mỗi tầng kèm một câu hỏi cho ban lãnh đạo." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="616" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Bốn tầng kiểm soát vận hành, mỗi tầng một câu hỏi</text><g transform="translate(0 108)"><rect x="60" y="0" width="1080" height="96" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">TẦNG 1 · NHÌN THẤY</text><text x="82" y="68" font-size="20" font-weight="600" class="tx">Biết điều gì đang thực sự xảy ra, ở nhịp đủ nhanh để còn kịp xử lý?</text><rect x="60" y="110" width="1080" height="96" rx="16" class="bb"/><text x="82" y="145" font-size="13" font-weight="600" class="mut">TẦNG 2 · KẾT NỐI</text><text x="82" y="178" font-size="20" font-weight="600" class="tx">Sai lệch ở xưởng có đến đúng người, đúng bộ phận?</text><rect x="60" y="220" width="1080" height="96" rx="16" class="bb"/><text x="82" y="255" font-size="13" font-weight="600" class="mut">TẦNG 3 · ĐỊNH HƯỚNG</text><text x="82" y="288" font-size="20" font-weight="600" class="tx">Biết phải làm gì, ai chịu trách nhiệm, căn cứ vào đâu?</text><rect x="60" y="330" width="1080" height="96" rx="16" class="bb"/><text x="82" y="365" font-size="13" font-weight="600" class="mut">TẦNG 4 · KIỂM SOÁT</text><text x="82" y="398" font-size="20" font-weight="600" class="tx">Hành động có được thực hiện, ghi nhận và kiểm tra hiệu quả?</text></g><text x="60" y="568" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

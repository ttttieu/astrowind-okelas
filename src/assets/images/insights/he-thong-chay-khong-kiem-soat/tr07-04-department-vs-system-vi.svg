" class="bp"/><text x="749.7777777777777" y="39" font-size="17" font-weight="600" class="tp">Vùng nối:</text><text x="749.7777777777777" y="61" font-size="17" font-weight="600" class="tp">không ai</text><text x="749.7777777777777" y="83" font-size="17" font-weight="600" class="tp">sở hữu</text><rect x="912.4444444444443" y="0" width="227.55555555555554" height="110" rx="16" class="bb"/><text x="934.4444444444443" y="44" font-size="22" font-weight="600" class="tx">QA</text><rect x="60" y="138" width="1080" height="73" rx="16" class="bi"/><text x="82" y="182" font-size="22" font-weight="600" class="ti">Số hóa từng bộ phận chưa phải là kiểm soát toàn hệ thống.</text></g></svg>

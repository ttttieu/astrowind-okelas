<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Three cards: the NOTAM outage of January 11, 2023, the Newark incident of April 28, 2025, and the nationwide ground stop of November 13, 2026 whose root cause is not yet published." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Three incidents, one shared question about knowledge</text><g transform="translate(0 132.6)"><rect x="60" y="0" width="349.3333333333333" height="208" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">JAN 11, 2023 · NOTAM</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">NOTAM system down</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Over 1,300 canceled, almost 10,000</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">delayed (GAO). FAA: contract</text><text x="82" y="150" font-size="17" font-weight="400" class="mut">personnel unintentionally deleted files</text><text x="82" y="174" font-size="17" font-weight="400" class="mut">during synchronization.</text><rect x="425.3333333333333" y="0" width="349.3333333333333" height="208" rx="16" class="bb"/><text x="447.3333333333333" y="35" font-size="13" font-weight="600" class="mut">APR 28, 2025 · NEWARK</text><text x="447.3333333333333" y="70" font-size="22" font-weight="600" class="tx">Radar and radio lost for 60</text><text x="447.3333333333333" y="99" font-size="22" font-weight="600" class="tx">to 90 seconds</text><text x="447.3333333333333" y="131" font-size="17" font-weight="400" class="mut">Tied to an older copper wire in a</text><text x="447.3333333333333" y="155" font-size="17" font-weight="400" class="mut">telecom line; over a thousand flights</text><text x="447.3333333333333" y="179" font-size="17" font-weight="400" class="mut">canceled (CNN).</text><rect x="790.6666666666666" y="0" width="349.3333333333333" height="208" rx="16" class="bp"/><text x="812.6666666666666" y="35" font-size="13" font-weight="600" class="tp">NOV 13, 2026 · NATIONWIDE</text><text x="812.6666666666666" y="70" font-size="22" font-weight="600" class="tp">Ground stop; root cause not</text><text x="812.6666666666666" y="99" font-size="22" font-weight="600" class="tp">yet published</text><text x="812.6666666666666" y="131" font-size="17" font-weight="400" class="mut">Instability at 17 of 22 en route centers</text><text x="812.6666666666666" y="155" font-size="17" font-weight="400" class="mut">during a copper-to-fiber changeover.</text></g><text x="60" y="374.6" font-size="13" font-weight="400" class="mut">Information as of November 23, 2026. No conclusion that these incidents were caused by poor knowledge management.</text></svg>

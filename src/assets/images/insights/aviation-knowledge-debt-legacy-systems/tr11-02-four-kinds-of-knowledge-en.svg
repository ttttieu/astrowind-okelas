<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four cards: business rules, exception-handling experience, dependencies and recovery, the four kinds of knowledge that source code does not fully show." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Four kinds of knowledge inside a software system</text><g transform="translate(0 139.8)"><rect x="60" y="0" width="259.5" height="184" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">LAYER 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Business rules</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Why the system calculates</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">and blocks this way.</text><rect x="333.5" y="0" width="259.5" height="184" rx="16" class="bb"/><text x="355.5" y="35" font-size="13" font-weight="600" class="mut">LAYER 2</text><text x="355.5" y="70" font-size="22" font-weight="600" class="tx">Exception</text><text x="355.5" y="99" font-size="22" font-weight="600" class="tx">experience</text><text x="355.5" y="131" font-size="17" font-weight="400" class="mut">Cases that happened and</text><text x="355.5" y="155" font-size="17" font-weight="400" class="mut">how they were handled.</text><rect x="607" y="0" width="259.5" height="184" rx="16" class="bb"/><text x="629" y="35" font-size="13" font-weight="600" class="mut">LAYER 3</text><text x="629" y="70" font-size="22" font-weight="600" class="tx">Dependencies</text><text x="629" y="102" font-size="17" font-weight="400" class="mut">Where it gets data, who it</text><text x="629" y="126" font-size="17" font-weight="400" class="mut">feeds, which path it</text><text x="629" y="150" font-size="17" font-weight="400" class="mut">runs on.</text><rect x="880.5" y="0" width="259.5" height="184" rx="16" class="bp"/><text x="902.5" y="35" font-size="13" font-weight="600" class="tp">LAYER 4</text><text x="902.5" y="70" font-size="22" font-weight="600" class="tp">Recovery</text><text x="902.5" y="102" font-size="17" font-weight="400" class="mut">When it stops, who does</text><text x="902.5" y="126" font-size="17" font-weight="400" class="mut">what first, and how.</text></g><text x="60" y="357.8" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

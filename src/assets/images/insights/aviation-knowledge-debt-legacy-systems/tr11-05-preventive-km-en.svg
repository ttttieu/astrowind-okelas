<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Five cards: map dependencies, retain expert knowledge, keep a fallback, test recovery and leave evidence after each change." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Five practices of preventive knowledge management</text><g transform="translate(0 132.6)"><rect x="60" y="0" width="204.8" height="208" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Map</text><text x="82" y="99" font-size="22" font-weight="600" class="tx">dependencies</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">What connects to</text><text x="82" y="155" font-size="17" font-weight="400" class="mut">what.</text><rect x="278.8" y="0" width="204.8" height="208" rx="16" class="bb"/><text x="300.8" y="35" font-size="13" font-weight="600" class="mut">2</text><text x="300.8" y="70" font-size="22" font-weight="600" class="tx">Retain expert</text><text x="300.8" y="99" font-size="22" font-weight="600" class="tx">knowledge</text><text x="300.8" y="131" font-size="17" font-weight="400" class="mut">Exceptions, design</text><text x="300.8" y="155" font-size="17" font-weight="400" class="mut">reasons.</text><rect x="497.6" y="0" width="204.8" height="208" rx="16" class="bb"/><text x="519.6" y="35" font-size="13" font-weight="600" class="mut">3</text><text x="519.6" y="70" font-size="22" font-weight="600" class="tx">Keep a</text><text x="519.6" y="99" font-size="22" font-weight="600" class="tx">fallback</text><text x="519.6" y="131" font-size="17" font-weight="400" class="mut">A real alternative</text><text x="519.6" y="155" font-size="17" font-weight="400" class="mut">way to operate.</text><rect x="716.4000000000001" y="0" width="204.8" height="208" rx="16" class="bb"/><text x="738.4000000000001" y="35" font-size="13" font-weight="600" class="mut">4</text><text x="738.4000000000001" y="70" font-size="22" font-weight="600" class="tx">Test recovery</text><text x="738.4000000000001" y="102" font-size="17" font-weight="400" class="mut">Rehearse, not just</text><text x="738.4000000000001" y="126" font-size="17" font-weight="400" class="mut">write a plan.</text><rect x="935.2" y="0" width="204.8" height="208" rx="16" class="bp"/><text x="957.2" y="35" font-size="13" font-weight="600" class="tp">5</text><text x="957.2" y="70" font-size="22" font-weight="600" class="tp">Leave</text><text x="957.2" y="99" font-size="22" font-weight="600" class="tp">evidence</text><text x="957.2" y="131" font-size="17" font-weight="400" class="mut">What changed,</text><text x="957.2" y="155" font-size="17" font-weight="400" class="mut">why, who</text><text x="957.2" y="179" font-size="17" font-weight="400" class="mut">approved.</text></g><text x="60" y="374.6" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

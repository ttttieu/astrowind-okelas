<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 499" width="1200" height="499" role="img" aria-label="A chain of four steps: the system runs fine, experts leave, it is patched and moved, then an incident hits an unrecorded dependency and diagnosis drags." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="499" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Knowledge debt builds in four steps</text><g transform="translate(0 108)"><rect x="60" y="0" width="237" height="208" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">STEP 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">It runs fine</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Nobody records why.</text><rect x="341" y="0" width="237" height="208" rx="16" class="bb"/><text x="363" y="35" font-size="13" font-weight="600" class="mut">STEP 2</text><text x="363" y="70" font-size="22" font-weight="600" class="tx">Experts leave</text><text x="363" y="102" font-size="17" font-weight="400" class="mut">Remaining documents</text><text x="363" y="126" font-size="17" font-weight="400" class="mut">go stale.</text><rect x="622" y="0" width="237" height="208" rx="16" class="bb"/><text x="644" y="35" font-size="13" font-weight="600" class="mut">STEP 3</text><text x="644" y="70" font-size="22" font-weight="600" class="tx">Patches and</text><text x="644" y="99" font-size="22" font-weight="600" class="tx">moves</text><text x="644" y="131" font-size="17" font-weight="400" class="mut">Each adds an</text><text x="644" y="155" font-size="17" font-weight="400" class="mut">unrecorded</text><text x="644" y="179" font-size="17" font-weight="400" class="mut">dependency.</text><rect x="903" y="0" width="237" height="208" rx="16" class="bp"/><text x="925" y="35" font-size="13" font-weight="600" class="tp">STEP 4</text><text x="925" y="70" font-size="22" font-weight="600" class="tp">An incident hits</text><text x="925" y="102" font-size="17" font-weight="400" class="mut">Diagnosis drags as it is</text><text x="925" y="126" font-size="17" font-weight="400" class="mut">rediscovered.</text><line x1="303" y1="104" x2="323" y2="104" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M321 95 l14 9 l-14 9z" class="arf"/><line x1="584" y1="104" x2="604" y2="104" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M602 95 l14 9 l-14 9z" class="arf"/><line x1="865" y1="104" x2="885" y2="104" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M883 95 l14 9 l-14 9z" class="arf"/><rect x="60" y="236" width="1080" height="73" rx="16" class="bi"/><text x="82" y="280" font-size="22" font-weight="600" class="ti">The “interest” on knowledge debt is diagnosis hours, not a line on the balance sheet.</text></g><text x="60" y="451" font-size="13" font-weight="400" class="mut">A discussion framework proposed by OKELAS, not a certified methodology.</text></svg>

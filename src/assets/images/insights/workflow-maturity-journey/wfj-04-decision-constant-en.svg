<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Across the five levels, work before and around the decision gets more support, but the decision always belongs to a rule issued by an authorized person, or to a person." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="548" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Decision authority stays put across all five levels</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">What changes between levels is the support for work around the decision.</text><line x1="60.0" y1="486.0" x2="1140.0" y2="486.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="508.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="204.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="88.0" cy="176.0" r="15" fill="var(--gm)"/><text x="88.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="114.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Manual</text><rect x="279.0" y="134.0" width="204.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="307.0" cy="176.0" r="15" fill="var(--gm)"/><text x="307.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="333.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Digitized</text><rect x="498.0" y="134.0" width="204.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="526.0" cy="176.0" r="15" fill="var(--p)"/><text x="526.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="552.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Rule-automated</text><rect x="717.0" y="134.0" width="204.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="745.0" cy="176.0" r="15" fill="var(--p)"/><text x="745.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="771.0" y="181.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Context-aware</text><rect x="936.0" y="134.0" width="204.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="964.0" cy="176.0" r="15" fill="var(--p)"/><text x="964.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="990.0" y="171.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Governed</text><text x="990.0" y="190.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">AI-assisted</text><rect x="60.0" y="232.0" width="1080.0" height="64.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="269.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Work before and around the decision gets more and more support</text><rect x="60.0" y="310.0" width="1080.0" height="100.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="340.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">The decision, at every level</text><text x="84.0" y="371.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">A rule issued by an authorized person, or a person</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI never sits at the point of decision, at any level.</text></svg>
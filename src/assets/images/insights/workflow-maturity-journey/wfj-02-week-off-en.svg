<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" width="1200" height="642" role="img" aria-label="If the process owner takes a week off: at level 1 work stops, level 2 data remains but others do not know how to act, level 3 routine work runs and exceptions reach the right person, level 4 special cases follow precedent, level 5 the stand-in receives a prepared file." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="642" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The “week off” question shows what a process depends on</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Pick a critical process and ask the people who do the work, too.</text><line x1="60.0" y1="580.0" x2="1140.0" y2="580.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="602.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">An orienting framework for discussion, not measured data.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Level</text><text x="436.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">If the process owner takes a week off</text><rect x="60.0" y="158.0" width="360.0" height="62.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="92.0" cy="189.0" r="15" fill="var(--gm)"/><text x="92.0" y="194.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="194.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Manual</text><rect x="436.0" y="158.0" width="704.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.6"/><text x="454.0" y="194.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Work stops or slows, everyone waits for the person to return</text><line x1="424.0" y1="189.0" x2="426.0" y2="189.0" stroke="var(--gm)" stroke-width="2"/><polygon points="432.0,189.0 426.0,192.3 426.0,185.7" fill="var(--gm)"/><rect x="60.0" y="230.0" width="360.0" height="62.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="92.0" cy="261.0" r="15" fill="var(--gm)"/><text x="92.0" y="266.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="126.0" y="266.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Digitized</text><rect x="436.0" y="230.0" width="704.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.6"/><text x="454.0" y="266.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Data remains but others do not know how to act on it</text><line x1="424.0" y1="261.0" x2="426.0" y2="261.0" stroke="var(--gm)" stroke-width="2"/><polygon points="432.0,261.0 426.0,264.3 426.0,257.7" fill="var(--gm)"/><rect x="60.0" y="302.0" width="360.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="333.0" r="15" fill="var(--p)"/><text x="92.0" y="338.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="338.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Rule-automated</text><rect x="436.0" y="302.0" width="704.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="454.0" y="338.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Routine work still runs; exceptions go to the right stand-in</text><line x1="424.0" y1="333.0" x2="426.0" y2="333.0" stroke="var(--gm)" stroke-width="2"/><polygon points="432.0,333.0 426.0,336.3 426.0,329.7" fill="var(--gm)"/><rect x="60.0" y="374.0" width="360.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="405.0" r="15" fill="var(--p)"/><text x="92.0" y="410.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="126.0" y="410.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Context-aware</text><rect x="436.0" y="374.0" width="704.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="454.0" y="410.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Special cases follow precedent; the stand-in sees why they differ</text><line x1="424.0" y1="405.0" x2="426.0" y2="405.0" stroke="var(--gm)" stroke-width="2"/><polygon points="432.0,405.0 426.0,408.3 426.0,401.7" fill="var(--gm)"/><rect x="60.0" y="446.0" width="360.0" height="62.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="92.0" cy="477.0" r="15" fill="var(--p)"/><text x="92.0" y="482.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="126.0" y="482.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Governed AI-assisted</text><rect x="436.0" y="446.0" width="704.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="454.0" y="482.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The stand-in gets a prepared file, input already interpreted</text><line x1="424.0" y1="477.0" x2="426.0" y2="477.0" stroke="var(--gm)" stroke-width="2"/><polygon points="432.0,477.0 426.0,480.3 426.0,473.7" fill="var(--gm)"/><rect x="60.0" y="520.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="553.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A quick diagnostic, to be checked against how the process really runs.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Illustrative example: order intake at level 3 next brings a customer’s own terms into context, quality complaints at level 4 next uses AI to interpret and assemble files, warehouse management at level 2 next writes rules for repeating cases." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">One factory, three processes, three different levels</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each process has its own current level and its own next step.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative scenarios, not data or customer cases.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Process</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Current level</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Next sensible step</text><rect x="60.0" y="158.0" width="330.0" height="92.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="209.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Order intake</text><rect x="410.0" y="158.0" width="370.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="209.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Level 3 · Rule-automated</text><rect x="800.0" y="158.0" width="340.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="816.0" y="209.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Bring a customer’s own terms into context</text><line x1="784.0" y1="204.0" x2="790.0" y2="204.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,204.0 790.0,207.3 790.0,200.7" fill="var(--p)"/><rect x="60.0" y="262.0" width="330.0" height="92.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="313.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quality complaints</text><rect x="410.0" y="262.0" width="370.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="313.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Level 4 · Context-aware</text><rect x="800.0" y="262.0" width="340.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="816.0" y="303.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI interprets emails, assembles files</text><text x="816.0" y="322.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">for approvers</text><line x1="784.0" y1="308.0" x2="790.0" y2="308.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,308.0 790.0,311.3 790.0,304.7" fill="var(--p)"/><rect x="60.0" y="366.0" width="330.0" height="92.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="76.0" y="417.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Warehouse management</text><rect x="410.0" y="366.0" width="370.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="426.0" y="417.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Level 2 · Digitized</text><rect x="800.0" y="366.0" width="340.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="816.0" y="417.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Write rules for repeating cases; no AI yet</text><line x1="784.0" y1="412.0" x2="790.0" y2="412.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,412.0 790.0,415.3 790.0,408.7" fill="var(--p)"/><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Not every process needs to reach level 5.</text></svg>
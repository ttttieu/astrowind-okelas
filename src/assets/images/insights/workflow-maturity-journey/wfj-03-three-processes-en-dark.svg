<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Illustrative example: order intake at level 3 next brings a customer’s own terms into context, quality complaints at level 4 next uses AI to interpret and assemble files, warehouse management at level 2 next writes rules for repeating cases." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">One factory, three processes, three different levels</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each process has its own current level and its own next step.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Illustrative scenarios, not data or customer cases.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Process</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Current level</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Next sensible step</text><rect x="60.0" y="158.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="209.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Order intake</text><rect x="410.0" y="158.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="209.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 3 · Rule-automated</text><rect x="800.0" y="158.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="209.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Bring a customer’s own terms into context</text><line x1="784.0" y1="204.0" x2="790.0" y2="204.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,204.0 790.0,207.3 790.0,200.7" fill="#2B74F5"/><rect x="60.0" y="262.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="313.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Quality complaints</text><rect x="410.0" y="262.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="313.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 4 · Context-aware</text><rect x="800.0" y="262.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="303.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">AI interprets emails, assembles files</text><text x="816.0" y="322.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">for approvers</text><line x1="784.0" y1="308.0" x2="790.0" y2="308.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,308.0 790.0,311.3 790.0,304.7" fill="#2B74F5"/><rect x="60.0" y="366.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="417.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Warehouse management</text><rect x="410.0" y="366.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="417.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Level 2 · Digitized</text><rect x="800.0" y="366.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="417.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Write rules for repeating cases; no AI yet</text><line x1="784.0" y1="412.0" x2="790.0" y2="412.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,412.0 790.0,415.3 790.0,408.7" fill="#2B74F5"/><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Not every process needs to reach level 5.</text></svg>
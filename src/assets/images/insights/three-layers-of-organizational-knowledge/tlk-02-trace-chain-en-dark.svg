<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Three connected boxes in order: external requirement, internal SOP, operational record. One row of arrows runs forward showing that a changed requirement means reviewing SOPs and people; another runs backward showing that a deviation traces back to the SOP and its basis." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="624" fill="#08090A"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">One requirement, three layers, tracing both ways</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Connect the three layers and you can trace forward and backward.</text><text x="60.0" y="136.0" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start">Illustrative example, not a real case</text><rect x="60.0" y="166.0" width="330.7" height="153.0" rx="16" fill="#14161A" stroke="#2A2F38" stroke-width="1.8"/><text x="84.0" y="202.0" font-size="13" font-weight="600" fill="#9AA6B8" text-anchor="start">EXTERNAL</text><text x="84.0" y="234.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">External requirement</text><text x="84.0" y="265.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">A standard or regulation requires a</text><text x="84.0" y="288.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">production step to be controlled.</text><rect x="434.7" y="166.0" width="330.7" height="153.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="458.7" y="202.0" font-size="13" font-weight="600" fill="#5FA0FF" text-anchor="start">INTERNAL</text><text x="458.7" y="234.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Internal SOP</text><text x="458.7" y="265.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Control method, check frequency</text><text x="458.7" y="288.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">and the person responsible.</text><rect x="809.3" y="166.0" width="330.7" height="153.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="833.3" y="202.0" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="start">OPERATIONAL</text><text x="833.3" y="234.9" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Operational record</text><text x="833.3" y="265.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Check result, who did it, when, any</text><text x="833.3" y="288.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">deviation and the corrective action.</text><line x1="394" y1="242" x2="422" y2="242" stroke="#5B6575" stroke-width="3"/><polygon points="434,242 422,235 422,249" fill="#5B6575"/><line x1="769" y1="242" x2="797" y2="242" stroke="#5B6575" stroke-width="3"/><polygon points="809,242 797,235 797,249" fill="#5B6575"/><line x1="80" y1="353" x2="1108" y2="353" stroke="#2B74F5" stroke-width="3"/><polygon points="1120,353 1108,346 1108,360" fill="#2B74F5"/><text x="80.0" y="381.0" font-size="17" font-weight="600" fill="#5FA0FF" text-anchor="start">Forward: when a requirement changes, review affected SOPs, departments and people</text><line x1="1120" y1="415" x2="92" y2="415" stroke="#A78BFA" stroke-width="3"/><polygon points="80,415 92,408 92,422" fill="#A78BFA"/><text x="1120.0" y="443.0" font-size="17" font-weight="600" fill="#A78BFA" text-anchor="end">Backward: when a deviation occurs, trace to the SOP and external basis</text><rect x="60.0" y="483.0" width="1080.0" height="52.0" rx="14" fill="#F7F8F8"/><text x="84.0" y="516.0" font-size="20" font-weight="600" fill="#08090A" text-anchor="start">The joins between layers are where knowledge management creates value.</text><line x1="60" y1="569" x2="1140" y2="569" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="591.0" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Illustrative example, not a real case. Governance perspective, not compliance or legal advice.</text></svg>
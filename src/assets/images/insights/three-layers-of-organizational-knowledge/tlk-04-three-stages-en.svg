<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="Three connected steps from left to right: stage one identify and classify, stage two standardize and connect, stage three integrate into operations, each with the type of tooling that usually fits." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="586" fill="var(--bg)"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three stages for starting knowledge governance</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">From identification to integration, with the smallest sufficient system.</text><rect x="60.0" y="144.0" width="344.0" height="273.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="var(--mut)" text-anchor="start">STAGE 1</text><text x="84.0" y="212.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Identify and classify</text><text x="84.0" y="243.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Find out which knowledge sources</text><text x="84.0" y="266.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">exist, where they sit, who owns them</text><text x="84.0" y="289.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">and what problems are showing up.</text><line x1="84.0" y1="308" x2="380.0" y2="308" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="341.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Often fits: an inventory of sources; an AI</text><text x="84.0" y="363.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">workspace or linked notes over a curated</text><text x="84.0" y="385.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">document set.</text><rect x="428.0" y="144.0" width="344.0" height="273.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="var(--s)" text-anchor="start">STAGE 2</text><text x="452.0" y="212.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Standardize and connect</text><text x="452.0" y="243.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Set the structure, document control</text><text x="452.0" y="266.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">rules, access rights, update duties and</text><text x="452.0" y="289.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">links across layers.</text><line x1="452.0" y1="308" x2="748.0" y2="308" stroke="var(--line)" stroke-width="1"/><text x="452.0" y="341.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Often fits: a system for document</text><text x="452.0" y="363.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">lifecycle, approval and permissions.</text><rect x="796.0" y="144.0" width="344.0" height="273.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="var(--a)" text-anchor="start">STAGE 3</text><text x="820.0" y="212.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Integrate into operations</text><text x="820.0" y="243.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Connect knowledge to workflow, ERP</text><text x="820.0" y="266.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">and QMS; bring AI into search,</text><text x="820.0" y="289.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">explanation and analysis grounded in</text><text x="820.0" y="312.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">traceable evidence.</text><line x1="820.0" y1="331" x2="1116.0" y2="331" stroke="var(--line)" stroke-width="1"/><text x="820.0" y="364.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Often fits: ERP, QMS, workflow and a</text><text x="820.0" y="386.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">structured knowledge platform.</text><line x1="407" y1="280" x2="416" y2="280" stroke="var(--gm)" stroke-width="3"/><polygon points="428,280 416,273 416,287" fill="var(--gm)"/><line x1="775" y1="280" x2="784" y2="280" stroke="var(--gm)" stroke-width="3"/><polygon points="796,280 784,273 784,287" fill="var(--gm)"/><rect x="60.0" y="445.0" width="1080.0" height="52.0" rx="14" fill="var(--ink)"/><text x="84.0" y="478.0" font-size="20" font-weight="600" fill="var(--onink)" text-anchor="start">Start from the gap that creates the most risk, not from software.</text><line x1="60" y1="531" x2="1140" y2="531" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="553.0" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">A discussion approach, not an industry standard.</text></svg>
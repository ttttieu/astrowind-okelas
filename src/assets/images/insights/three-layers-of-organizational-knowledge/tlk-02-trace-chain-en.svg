<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Three connected boxes in order: external requirement, internal SOP, operational record. One row of arrows runs forward showing that a changed requirement means reviewing SOPs and people; another runs backward showing that a deviation traces back to the SOP and its basis." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">One requirement, three layers, tracing both ways</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Connect the three layers and you can trace forward and backward.</text><text x="60.0" y="136.0" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Illustrative example, not a real case</text><rect x="60.0" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.8"/><text x="84.0" y="202.0" font-size="13" font-weight="600" fill="var(--mut)" text-anchor="start">EXTERNAL</text><text x="84.0" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">External requirement</text><text x="84.0" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">A standard or regulation requires a</text><text x="84.0" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">production step to be controlled.</text><rect x="434.7" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="458.7" y="202.0" font-size="13" font-weight="600" fill="var(--s)" text-anchor="start">INTERNAL</text><text x="458.7" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Internal SOP</text><text x="458.7" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Control method, check frequency</text><text x="458.7" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">and the person responsible.</text><rect x="809.3" y="166.0" width="330.7" height="153.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="833.3" y="202.0" font-size="13" font-weight="600" fill="var(--a)" text-anchor="start">OPERATIONAL</text><text x="833.3" y="234.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Operational record</text><text x="833.3" y="265.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Check result, who did it, when, any</text><text x="833.3" y="288.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">deviation and the corrective action.</text><line x1="394" y1="242" x2="422" y2="242" stroke="var(--gm)" stroke-width="3"/><polygon points="434,242 422,235 422,249" fill="var(--gm)"/><line x1="769" y1="242" x2="797" y2="242" stroke="var(--gm)" stroke-width="3"/><polygon points="809,242 797,235 797,249" fill="var(--gm)"/><line x1="80" y1="353" x2="1108" y2="353" stroke="var(--p)" stroke-width="3"/><polygon points="1120,353 1108,346 1108,360" fill="var(--p)"/><text x="80.0" y="381.0" font-size="17" font-weight="600" fill="var(--s)" text-anchor="start">Forward: when a requirement changes, review affected SOPs, departments and people</text><line x1="1120" y1="415" x2="92" y2="415" stroke="var(--a)" stroke-width="3"/><polygon points="80,415 92,408 92,422" fill="var(--a)"/><text x="1120.0" y="443.0" font-size="17" font-weight="600" fill="var(--a)" text-anchor="end">Backward: when a deviation occurs, trace to the SOP and external basis</text><rect x="60.0" y="483.0" width="1080.0" height="52.0" rx="14" fill="var(--ink)"/><text x="84.0" y="516.0" font-size="20" font-weight="600" fill="var(--onink)" text-anchor="start">The joins between layers are where knowledge management creates value.</text><line x1="60" y1="569" x2="1140" y2="569" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="591.0" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative example, not a real case. Governance perspective, not compliance or legal advice.</text></svg>
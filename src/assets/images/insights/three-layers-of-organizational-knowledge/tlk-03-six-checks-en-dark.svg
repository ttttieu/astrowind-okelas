<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 553" width="1200" height="553" role="img" aria-label="Three cards with two self-check questions each: external asks about tracking what is in force and tracing affected SOPs; internal asks about a single version in force and linking SOPs to people, forms and processes; operational asks about retrieving inspection records and the basis of decisions." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="553" fill="#08090A"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Six self-check questions across the three layers</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Answer: yes, no or not sure.</text><rect x="60.0" y="144.0" width="344.0" height="240.0" rx="16" fill="#14161A" stroke="#2A2F38" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="#9AA6B8" text-anchor="start">EXTERNAL</text><circle cx="97.0" cy="205" r="13" fill="#9AA6B8"/><text x="97.0" y="210.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="210.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">Does someone own tracking</text><text x="124.0" y="234.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">which regulations and</text><text x="124.0" y="258.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">standards are in force?</text><circle cx="97.0" cy="293" r="13" fill="#9AA6B8"/><text x="97.0" y="298.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="124.0" y="298.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">When an external requirement</text><text x="124.0" y="322.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">changes, do you know at once</text><text x="124.0" y="346.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">which SOPs are affected?</text><rect x="428.0" y="144.0" width="344.0" height="240.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="#5FA0FF" text-anchor="start">INTERNAL</text><circle cx="465.0" cy="205" r="13" fill="#5FA0FF"/><text x="465.0" y="210.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="492.0" y="210.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">Is there only one SOP version</text><text x="492.0" y="234.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">in force at any time, and does</text><text x="492.0" y="258.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">everyone know which?</text><circle cx="465.0" cy="293" r="13" fill="#5FA0FF"/><text x="465.0" y="298.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="492.0" y="298.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">Is each SOP linked to its</text><text x="492.0" y="322.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">department, performers, forms</text><text x="492.0" y="346.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">and process?</text><rect x="796.0" y="144.0" width="344.0" height="240.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="start">OPERATIONAL</text><circle cx="833.0" cy="205" r="13" fill="#A78BFA"/><text x="833.0" y="210.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="860.0" y="210.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">For any batch, can you retrieve</text><text x="860.0" y="234.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">who checked it, the result and</text><text x="860.0" y="258.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">how deviations were handled?</text><circle cx="833.0" cy="293" r="13" fill="#A78BFA"/><text x="833.0" y="298.5" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="860.0" y="298.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">Are important decisions</text><text x="860.0" y="322.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">recorded with their basis and</text><text x="860.0" y="346.0" font-size="17" font-weight="500" fill="#E5ECF6" text-anchor="start">the accountable person?</text><rect x="60.0" y="412.0" width="1080.0" height="52.0" rx="14" fill="#F7F8F8"/><text x="84.0" y="445.0" font-size="20" font-weight="600" fill="#08090A" text-anchor="start">Three or more answers of &quot;no&quot; or &quot;not sure&quot; signal a need for a structured assessment.</text><line x1="60" y1="498" x2="1140" y2="498" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="520.0" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">A discussion aid, not a certified methodology. The threshold of three is set by OKELAS for discussion, not a statistic.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-label="Three cards side by side: external knowledge answers what is required of us, internal knowledge answers how we decided to do it, operational knowledge answers what actually happened." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="627" fill="#08090A"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three layers of knowledge, three different questions</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each layer has its own origin, lifecycle and way of being controlled.</text><rect x="60.0" y="144.0" width="344.0" height="314.0" rx="16" fill="#14161A" stroke="#2A2F38" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="#9AA6B8" text-anchor="start">LAYER 1</text><text x="84.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">External Knowledge</text><text x="84.0" y="249.0" font-size="19" font-weight="600" fill="#9AA6B8" text-anchor="start">What is required of us?</text><line x1="84.0" y1="270" x2="380.0" y2="270" stroke="#2A2F38" stroke-width="1"/><circle cx="88.0" cy="299" r="3" fill="#9AA6B8"/><text x="102.0" y="304.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Laws, decrees, circulars</text><circle cx="88.0" cy="329" r="3" fill="#9AA6B8"/><text x="102.0" y="334.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Standards: ISO, GMP, HACCP, GxP</text><circle cx="88.0" cy="359" r="3" fill="#9AA6B8"/><text x="102.0" y="364.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Customer requirements</text><circle cx="88.0" cy="389" r="3" fill="#9AA6B8"/><text x="102.0" y="394.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Market and technology</text><text x="84.0" y="427.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Role: basis and limits.</text><rect x="428.0" y="144.0" width="344.0" height="314.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="#5FA0FF" text-anchor="start">LAYER 2</text><text x="452.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">Internal Knowledge</text><text x="452.0" y="249.0" font-size="19" font-weight="600" fill="#5FA0FF" text-anchor="start">How have we decided to do it?</text><line x1="452.0" y1="270" x2="748.0" y2="270" stroke="#2A2F38" stroke-width="1"/><circle cx="456.0" cy="299" r="3" fill="#5FA0FF"/><text x="470.0" y="304.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">SOPs and work instructions</text><circle cx="456.0" cy="329" r="3" fill="#5FA0FF"/><text x="470.0" y="334.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Policies, rules and forms</text><circle cx="456.0" cy="359" r="3" fill="#5FA0FF"/><text x="470.0" y="364.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Structure, authority, responsibilities</text><circle cx="456.0" cy="389" r="3" fill="#5FA0FF"/><text x="470.0" y="394.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Lessons learned, once approved</text><text x="452.0" y="427.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Role: method and responsibilities.</text><rect x="796.0" y="144.0" width="344.0" height="314.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="#A78BFA" text-anchor="start">LAYER 3</text><text x="820.0" y="214.8" font-size="24" font-weight="700" fill="#F7F8F8" text-anchor="start">Operational Knowledge</text><text x="820.0" y="249.0" font-size="19" font-weight="600" fill="#A78BFA" text-anchor="start">What actually happened?</text><line x1="820.0" y1="270" x2="1116.0" y2="270" stroke="#2A2F38" stroke-width="1"/><circle cx="824.0" cy="299" r="3" fill="#A78BFA"/><text x="838.0" y="304.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Transactions and workflow records</text><circle cx="824.0" cy="329" r="3" fill="#A78BFA"/><text x="838.0" y="334.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Inspection results, deviations, CAPA</text><circle cx="824.0" cy="359" r="3" fill="#A78BFA"/><text x="838.0" y="364.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Decisions and their basis</text><circle cx="824.0" cy="389" r="3" fill="#A78BFA"/><text x="838.0" y="394.0" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">Incidents and responses</text><text x="820.0" y="427.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Role: performance and evidence.</text><rect x="60.0" y="486.0" width="1080.0" height="52.0" rx="14" fill="#F7F8F8"/><text x="84.0" y="519.0" font-size="20" font-weight="600" fill="#08090A" text-anchor="start">Three different natures: do not pour them into one repository.</text><line x1="60" y1="572" x2="1140" y2="572" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="594.0" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">The three layers are an OKELAS classification, not an industry-standard term.</text></svg>
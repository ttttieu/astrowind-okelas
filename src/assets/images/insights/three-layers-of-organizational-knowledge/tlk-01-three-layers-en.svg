<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-label="Three cards side by side: external knowledge answers what is required of us, internal knowledge answers how we decided to do it, operational knowledge answers what actually happened." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="627" fill="var(--bg)"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three layers of knowledge, three different questions</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each layer has its own origin, lifecycle and way of being controlled.</text><rect x="60.0" y="144.0" width="344.0" height="314.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="var(--mut)" text-anchor="start">LAYER 1</text><text x="84.0" y="214.8" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">External Knowledge</text><text x="84.0" y="249.0" font-size="19" font-weight="600" fill="var(--mut)" text-anchor="start">What is required of us?</text><line x1="84.0" y1="270" x2="380.0" y2="270" stroke="var(--line)" stroke-width="1"/><circle cx="88.0" cy="299" r="3" fill="var(--mut)"/><text x="102.0" y="304.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Laws, decrees, circulars</text><circle cx="88.0" cy="329" r="3" fill="var(--mut)"/><text x="102.0" y="334.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Standards: ISO, GMP, HACCP, GxP</text><circle cx="88.0" cy="359" r="3" fill="var(--mut)"/><text x="102.0" y="364.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Customer requirements</text><circle cx="88.0" cy="389" r="3" fill="var(--mut)"/><text x="102.0" y="394.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Market and technology</text><text x="84.0" y="427.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Role: basis and limits.</text><rect x="428.0" y="144.0" width="344.0" height="314.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="var(--s)" text-anchor="start">LAYER 2</text><text x="452.0" y="214.8" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Internal Knowledge</text><text x="452.0" y="249.0" font-size="19" font-weight="600" fill="var(--s)" text-anchor="start">How have we decided to do it?</text><line x1="452.0" y1="270" x2="748.0" y2="270" stroke="var(--line)" stroke-width="1"/><circle cx="456.0" cy="299" r="3" fill="var(--s)"/><text x="470.0" y="304.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">SOPs and work instructions</text><circle cx="456.0" cy="329" r="3" fill="var(--s)"/><text x="470.0" y="334.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Policies, rules and forms</text><circle cx="456.0" cy="359" r="3" fill="var(--s)"/><text x="470.0" y="364.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Structure, authority, responsibilities</text><circle cx="456.0" cy="389" r="3" fill="var(--s)"/><text x="470.0" y="394.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Lessons learned, once approved</text><text x="452.0" y="427.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Role: method and responsibilities.</text><rect x="796.0" y="144.0" width="344.0" height="314.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="var(--a)" text-anchor="start">LAYER 3</text><text x="820.0" y="214.8" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Operational Knowledge</text><text x="820.0" y="249.0" font-size="19" font-weight="600" fill="var(--a)" text-anchor="start">What actually happened?</text><line x1="820.0" y1="270" x2="1116.0" y2="270" stroke="var(--line)" stroke-width="1"/><circle cx="824.0" cy="299" r="3" fill="var(--a)"/><text x="838.0" y="304.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Transactions and workflow records</text><circle cx="824.0" cy="329" r="3" fill="var(--a)"/><text x="838.0" y="334.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Inspection results, deviations, CAPA</text><circle cx="824.0" cy="359" r="3" fill="var(--a)"/><text x="838.0" y="364.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Decisions and their basis</text><circle cx="824.0" cy="389" r="3" fill="var(--a)"/><text x="838.0" y="394.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Incidents and responses</text><text x="820.0" y="427.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Role: performance and evidence.</text><rect x="60.0" y="486.0" width="1080.0" height="52.0" rx="14" fill="var(--ink)"/><text x="84.0" y="519.0" font-size="20" font-weight="600" fill="var(--onink)" text-anchor="start">Three different natures: do not pour them into one repository.</text><line x1="60" y1="572" x2="1140" y2="572" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="594.0" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three layers are an OKELAS classification, not an industry-standard term.</text></svg>
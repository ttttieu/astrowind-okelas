<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 553" width="1200" height="553" role="img" aria-label="Three cards with two self-check questions each: external asks about tracking what is in force and tracing affected SOPs; internal asks about a single version in force and linking SOPs to people, forms and processes; operational asks about retrieving inspection records and the basis of decisions." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="553" fill="var(--bg)"/><text x="60.0" y="70.0" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six self-check questions across the three layers</text><text x="60.0" y="104.0" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Answer: yes, no or not sure.</text><rect x="60.0" y="144.0" width="344.0" height="240.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.8"/><text x="84.0" y="180.0" font-size="13" font-weight="600" fill="var(--mut)" text-anchor="start">EXTERNAL</text><circle cx="97.0" cy="205" r="13" fill="var(--mut)"/><text x="97.0" y="210.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="210.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">Does someone own tracking</text><text x="124.0" y="234.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">which regulations and</text><text x="124.0" y="258.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">standards are in force?</text><circle cx="97.0" cy="293" r="13" fill="var(--mut)"/><text x="97.0" y="298.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="124.0" y="298.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">When an external requirement</text><text x="124.0" y="322.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">changes, do you know at once</text><text x="124.0" y="346.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">which SOPs are affected?</text><rect x="428.0" y="144.0" width="344.0" height="240.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="452.0" y="180.0" font-size="13" font-weight="600" fill="var(--s)" text-anchor="start">INTERNAL</text><circle cx="465.0" cy="205" r="13" fill="var(--s)"/><text x="465.0" y="210.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="492.0" y="210.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">Is there only one SOP version</text><text x="492.0" y="234.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">in force at any time, and does</text><text x="492.0" y="258.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">everyone know which?</text><circle cx="465.0" cy="293" r="13" fill="var(--s)"/><text x="465.0" y="298.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="492.0" y="298.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">Is each SOP linked to its</text><text x="492.0" y="322.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">department, performers, forms</text><text x="492.0" y="346.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">and process?</text><rect x="796.0" y="144.0" width="344.0" height="240.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="820.0" y="180.0" font-size="13" font-weight="600" fill="var(--a)" text-anchor="start">OPERATIONAL</text><circle cx="833.0" cy="205" r="13" fill="var(--a)"/><text x="833.0" y="210.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="860.0" y="210.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">For any batch, can you retrieve</text><text x="860.0" y="234.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">who checked it, the result and</text><text x="860.0" y="258.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">how deviations were handled?</text><circle cx="833.0" cy="293" r="13" fill="var(--a)"/><text x="833.0" y="298.5" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="860.0" y="298.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">Are important decisions</text><text x="860.0" y="322.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">recorded with their basis and</text><text x="860.0" y="346.0" font-size="17" font-weight="500" fill="var(--tx)" text-anchor="start">the accountable person?</text><rect x="60.0" y="412.0" width="1080.0" height="52.0" rx="14" fill="var(--ink)"/><text x="84.0" y="445.0" font-size="20" font-weight="600" fill="var(--onink)" text-anchor="start">Three or more answers of &quot;no&quot; or &quot;not sure&quot; signal a need for a structured assessment.</text><line x1="60" y1="498" x2="1140" y2="498" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.0" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">A discussion aid, not a certified methodology. The threshold of three is set by OKELAS for discussion, not a statistic.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn bước của một yêu cầu trong nhóm chat: giao việc, hỏi lại và gửi file, xuất hiện ba file final, việc chưa kết thúc." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><rect x="60" y="26" width="186" height="26" rx="13" class="chip"/><text x="74" y="44" font-size="13" font-weight="700" class="tp">TÌNH HUỐNG MINH HỌA</text><text x="60" y="106" font-size="32" font-weight="700" class="hd">Hành trình một yêu cầu “làm lại báo cáo” trong nhóm chat</text><g transform="translate(0 162.2)"><rect x="60" y="0" width="240" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Giao việc</text><text x="82" y="99" font-size="22" font-weight="600" class="tx">trong nhóm</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Yêu cầu làm lại</text><text x="82" y="155" font-size="17" font-weight="400" class="mut">báo cáo.</text><rect x="340" y="0" width="240" height="184" rx="16" class="bb"/><text x="362" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 2</text><text x="362" y="70" font-size="22" font-weight="600" class="tx">Hỏi lại, gửi file</text><text x="362" y="102" font-size="17" font-weight="400" class="mut">Làm rõ yêu cầu qua</text><text x="362" y="126" font-size="17" font-weight="400" class="mut">nhiều tin nhắn.</text><rect x="620" y="0" width="240" height="184" rx="16" class="bp"/><text x="642" y="35" font-size="13" font-weight="600" class="tp">BƯỚC 3</text><text x="642" y="70" font-size="22" font-weight="600" class="tp">Ba file “final”</text><text x="642" y="102" font-size="17" font-weight="400" class="mut">Không rõ bản nào là bản</text><text x="642" y="126" font-size="17" font-weight="400" class="mut">cuối.</text><rect x="900" y="0" width="240" height="184" rx="16" class="bp"/><text x="922" y="35" font-size="13" font-weight="600" class="tp">BƯỚC 4</text><text x="922" y="70" font-size="22" font-weight="600" class="tp">Việc chưa</text><text x="922" y="99" font-size="22" font-weight="600" class="tp">kết thúc</text><text x="922" y="131" font-size="17" font-weight="400" class="mut">Chưa ai xác nhận đã</text><text x="922" y="155" font-size="17" font-weight="400" class="mut">xong.</text><line x1="306" y1="92" x2="322" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M320 83 l14 9 l-14 9z" class="arf"/><line x1="586" y1="92" x2="602" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M600 83 l14 9 l-14 9z" class="arf"/><line x1="866" y1="92" x2="882" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M880 83 l14 9 l-14 9z" class="arf"/></g><text x="60" y="380.2" font-size="13" font-weight="400" class="mut">Tình huống minh họa, không phải trường hợp thực tế hay số liệu đo được.</text></svg>

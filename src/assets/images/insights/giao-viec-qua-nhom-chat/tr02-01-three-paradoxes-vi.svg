<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba thẻ nghịch lý: càng tiện càng khó kiểm soát thông tin; trao đổi nhanh hơn nhưng việc chưa chắc xong nhanh hơn; càng nhiều trao đổi tri thức càng phân mảnh." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Ba nghịch lý của việc giao việc qua nhóm chat</text><g transform="translate(0 154.2)"><rect x="60" y="0" width="346.6666666666667" height="184" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">NGHỊCH LÝ 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Càng tiện, càng khó kiểm</text><text x="82" y="99" font-size="22" font-weight="600" class="tx">soát thông tin</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Thông tin nằm rải rác trong tin nhắn.</text><rect x="426.6666666666667" y="0" width="346.6666666666667" height="184" rx="16" class="bb"/><text x="448.6666666666667" y="35" font-size="13" font-weight="600" class="mut">NGHỊCH LÝ 2</text><text x="448.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Trao đổi nhanh hơn, việc</text><text x="448.6666666666667" y="99" font-size="22" font-weight="600" class="tx">chưa chắc xong nhanh hơn</text><text x="448.6666666666667" y="131" font-size="17" font-weight="400" class="mut">Phản hồi nhanh chưa phải việc đã</text><text x="448.6666666666667" y="155" font-size="17" font-weight="400" class="mut">xong.</text><rect x="793.3333333333334" y="0" width="346.6666666666667" height="184" rx="16" class="bp"/><text x="815.3333333333334" y="35" font-size="13" font-weight="600" class="tp">NGHỊCH LÝ 3</text><text x="815.3333333333334" y="70" font-size="22" font-weight="600" class="tp">Càng nhiều trao đổi, tri thức</text><text x="815.3333333333334" y="99" font-size="22" font-weight="600" class="tp">càng phân mảnh</text><text x="815.3333333333334" y="131" font-size="17" font-weight="400" class="mut">Lý do và kết quả khó tìm lại về sau.</text></g></svg>

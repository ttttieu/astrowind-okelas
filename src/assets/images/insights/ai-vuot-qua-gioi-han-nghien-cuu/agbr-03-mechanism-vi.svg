<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Chuỗi bốn khối: mục tiêu được thúc đẩy, môi trường gợi ý đường hiệu quả hơn, mô hình nhận ra, và đi theo." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năng lực cao hơn mở ra nhiều chiến lược hơn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bài viết nối cơ chế này với specification gaming đã nêu ở bài trước.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chuỗi suy luận theo bài viết; sơ đồ khái niệm, không phải mô hình định lượng.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="200.0" width="240.0" height="120.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="180.0" y="255.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Mục tiêu được thúc</text><text x="180.0" y="276.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">đẩy mạnh</text><line x1="306.0" y1="260.0" x2="325.0" y2="260.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="334.0,260.0 325.0,264.9 325.0,255.1" fill="var(--p)"/><rect x="340.0" y="200.0" width="240.0" height="120.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="460.0" y="255.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Môi trường gợi ý đường</text><text x="460.0" y="276.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">“hiệu quả hơn”</text><line x1="586.0" y1="260.0" x2="605.0" y2="260.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="614.0,260.0 605.0,264.9 605.0,255.1" fill="var(--p)"/><rect x="620.0" y="200.0" width="240.0" height="120.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="740.0" y="255.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô hình đủ năng lực nhận</text><text x="740.0" y="276.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">ra đường đó</text><line x1="866.0" y1="260.0" x2="885.0" y2="260.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="894.0,260.0 885.0,264.9 885.0,255.1" fill="var(--p)"/><rect x="900.0" y="200.0" width="240.0" height="120.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="1020.0" y="255.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Đi theo, kể cả lách</text><text x="1020.0" y="276.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">giám sát</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Năng lực suy luận cao hơn không tự động có nghĩa là ý đồ xấu.</text></svg>
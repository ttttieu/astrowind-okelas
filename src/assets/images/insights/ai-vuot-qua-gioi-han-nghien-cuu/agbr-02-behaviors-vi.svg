<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Ba thẻ hành vi, mỗi thẻ có nhãn trong môi trường mô phỏng; bên dưới là thẻ tỷ lệ trên 85%." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba hành vi được ghi nhận trong môi trường thử nghiệm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích chuỗi suy nghĩ cho thấy mô hình có lập luận về che giấu; mọi quan sát đều trong môi trường mô phỏng.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Theo bài viết và nghiên cứu Apollo Research (12/2024); hành vi được quan sát trong môi trường mô phỏng.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Trong môi trường mô phỏng</text><text x="80.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Cố ý đưa lỗi nhỏ vào câu trả lời</text><rect x="424.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="444.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Trong môi trường mô phỏng</text><text x="444.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Cố vô hiệu hóa cơ chế giám sát</text><rect x="788.0" y="134.0" width="352.0" height="130.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="808.0" y="165.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Trong môi trường mô phỏng</text><text x="808.0" y="195.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Cố tự sao lưu ra ngoài khi bị thay thế</text><rect x="60.0" y="284.0" width="1080.0" height="110.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="340.4" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">&gt;85%</text><text x="300.0" y="335.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Tỷ lệ o1 tiếp tục phủ nhận trong các câu hỏi tiếp theo, sau khi đã có hành vi này.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Toàn bộ quan sát diễn ra trong môi trường mô phỏng được thiết kế để làm lộ năng lực.</text></svg>
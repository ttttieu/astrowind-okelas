<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Bốn khối kiểm soát Pillar 6: định danh riêng, quyền hạn có phạm vi, xác nhận độc lập, nhật ký runtime." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm soát không dựa vào việc tin ý định của mô hình</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn kiểm soát của Pillar 6 cần hoạt động mà không phụ thuộc vào ý định của mô hình.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn kiểm soát theo Pillar 6 như bài viết mô tả; không phải hướng dẫn kỹ thuật chi tiết.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="150.0" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Bốn kiểm soát Pillar 6 theo bài viết</text><rect x="60.0" y="170.0" width="258.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="196.0" r="15" fill="var(--p)"/><text x="96.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="210.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Định danh riêng</text><rect x="334.0" y="170.0" width="258.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="370.0" cy="196.0" r="15" fill="var(--p)"/><text x="370.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="484.0" y="220.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyền hạn có</text><text x="484.0" y="242.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">phạm vi</text><rect x="608.0" y="170.0" width="258.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="644.0" cy="196.0" r="15" fill="var(--p)"/><text x="644.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="758.0" y="220.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Điểm xác nhận</text><text x="758.0" y="242.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">độc lập</text><rect x="882.0" y="170.0" width="258.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="918.0" cy="196.0" r="15" fill="var(--p)"/><text x="918.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="1032.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhật ký runtime</text><rect x="60.0" y="330.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="363.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bốn kiểm soát này là nền tảng; giám sát chuỗi suy nghĩ chỉ là lớp bổ sung, không phải giải pháp đầy đủ.</text></svg>
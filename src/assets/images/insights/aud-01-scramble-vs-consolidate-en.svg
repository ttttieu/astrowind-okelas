<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Preparing by scrambling, with five tasks that appear as the audit nears, compared with preparing as consolidation when evidence, documents and records are captured and maintained continuously." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">An audit shouldn’t be an emergency</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Audit preparation should compile what already exists, not collect it from scratch.</text><line x1="60.0" y1="596.0" x2="1140.0" y2="596.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="618.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="659.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="376.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Preparing by scrambling</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">New work appears as the audit approaches</text><rect x="84.0" y="220.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="249.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Track down inspection records from past months</text><rect x="84.0" y="276.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="305.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Identify which records are missing</text><rect x="84.0" y="332.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="361.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ask each department for evidence</text><rect x="84.0" y="388.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Update documents that weren’t maintained on schedule</text><rect x="84.0" y="444.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="324.0" y="473.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">List everything to complete before the audit date</text><rect x="612.0" y="134.0" width="528.0" height="376.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Preparing is consolidating</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Evidence already exists from normal operations</text><rect x="636.0" y="220.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="246.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence is recorded correctly during operations</text><text x="652.0" y="279.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">Preparation is consolidation, not collection</text><rect x="636.0" y="314.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="340.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Documents are maintained continuously</text><text x="652.0" y="373.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">No document update sprint before the audit</text><rect x="636.0" y="408.0" width="480.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="652.0" y="434.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Records are structured and easy to locate</text><text x="652.0" y="467.7" font-size="13" font-weight="400" fill="var(--s)" text-anchor="start">No manual search involving many people</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">An audit shouldn’t create new work. It should only compile what was already captured.</text></svg>
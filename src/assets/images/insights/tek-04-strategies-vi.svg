<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Chiến lược cho explicit knowledge là hệ thống tài liệu có kiểm soát; chiến lược cho tacit knowledge là mentoring, case study và debriefing, phỏng vấn tri thức trước khi nhân sự rời đi và giảm phụ thuộc vào một người." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chiến lược phù hợp cho từng loại tri thức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mục tiêu không phải tài liệu hóa tất cả.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chiến lược là ứng dụng thực tiễn theo bài viết; công cụ thảo luận, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="318.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Với explicit knowledge</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tổ chức tốt, dễ tìm, cập nhật nhất quán</text><rect x="84.0" y="218.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hệ thống tài liệu có kiểm soát phiên bản</text><rect x="84.0" y="274.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình phê duyệt rõ ràng</text><rect x="84.0" y="330.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cơ chế cập nhật khi thực tế thay đổi</text><rect x="84.0" y="386.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="415.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tiếp cận được tại điểm thực hiện</text><rect x="612.0" y="134.0" width="528.0" height="318.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Với tacit knowledge</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Giảm rủi ro mất tri thức, tăng tốc chuyển giao</text><rect x="636.0" y="218.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Mentoring và shadowing có cấu trúc</text><rect x="636.0" y="274.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Case study và debriefing sau sự cố</text><rect x="636.0" y="330.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phỏng vấn tri thức trước khi nhân sự quan trọng rời đi</text><rect x="636.0" y="386.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="415.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giảm phụ thuộc vào một người cụ thể</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quản lý mỗi loại tri thức theo đúng bản chất của nó, không phải tài liệu hóa tất cả.</text></svg>
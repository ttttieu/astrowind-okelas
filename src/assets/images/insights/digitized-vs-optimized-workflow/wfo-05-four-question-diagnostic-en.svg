<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 692" width="1200" height="692" role="img" aria-label="Four questions, each with the answer that shows a workflow stopped at digitization; two or more suggests it is not yet optimized." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="692" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four questions to tell if a workflow stopped at digitizing</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A “problem” answer on two or more questions suggests the workflow stopped at digitization.</text><line x1="60.0" y1="630.0" x2="1140.0" y2="630.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="652.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The categories and threshold shown are OKELAS’s suggestions: a discussion aid, not a certified methodology.</text><text x="96.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Question</text><text x="610.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">If the answer is</text><text x="884.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">It shows</text><rect x="60.0" y="152.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="196.0" r="15" fill="var(--p)"/><text x="88.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="191.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Setting technology aside, has the underlying process changed</text><text x="116.0" y="211.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">compared to five years ago?</text><rect x="606.0" y="162.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="201.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">No, only the tool changed</text><line x1="846.0" y1="196.0" x2="867.0" y2="196.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,196.0 867.0,200.9 867.0,191.1" fill="var(--p)"/><text x="884.0" y="201.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Pure digitization</text><rect x="60.0" y="252.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="296.0" r="15" fill="var(--p)"/><text x="88.0" y="301.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="116.0" y="291.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Can the person at the final step explain why earlier steps</text><text x="116.0" y="311.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">decided what they did, without asking?</text><rect x="606.0" y="262.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="301.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">No</text><line x1="846.0" y1="296.0" x2="867.0" y2="296.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,296.0 867.0,300.9 867.0,291.1" fill="var(--p)"/><text x="884.0" y="301.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">The workflow is missing context</text><rect x="60.0" y="352.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="396.0" r="15" fill="var(--p)"/><text x="88.0" y="401.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="391.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Was last month’s exception handled through the system or an</text><text x="116.0" y="411.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">informal channel?</text><rect x="606.0" y="362.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="401.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">An informal channel</text><line x1="846.0" y1="396.0" x2="867.0" y2="396.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,396.0 867.0,400.9 867.0,391.1" fill="var(--p)"/><text x="884.0" y="391.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">A design gap, not an employee</text><text x="884.0" y="410.3" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">compliance issue</text><rect x="60.0" y="452.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="496.0" r="15" fill="var(--p)"/><text x="88.0" y="501.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="116.0" y="501.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Did average completion time drop significantly after digitizing?</text><rect x="606.0" y="462.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="491.9" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Only slightly, as paper</text><text x="724.0" y="510.3" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">stopped moving</text><line x1="846.0" y1="496.0" x2="867.0" y2="496.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,496.0 867.0,500.9 867.0,491.1" fill="var(--p)"/><text x="884.0" y="491.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Most time still lives in process</text><text x="884.0" y="510.3" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">logic, not the medium</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Two or more: the workflow is likely still at the digitization stage, not yet optimized.</text></svg>
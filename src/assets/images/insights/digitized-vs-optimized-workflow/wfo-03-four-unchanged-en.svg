<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Four things digitization does not change on its own: the number and order of steps, who decides, how exceptions are handled, and the context each step carries." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four things digitization does not change on its own</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">If the source process had problems, digitization does not remove them.</text><line x1="60.0" y1="622.0" x2="1140.0" y2="622.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="644.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the 5-step process is a hypothetical example, not measured data.</text><rect x="60.0" y="132.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="96.0" cy="166.0" r="16" fill="var(--a)"/><text x="96.0" y="171.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text><text x="124.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Number and order of steps</text><rect x="82.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="185.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Before: 5 sequential steps</text><text x="305.0" y="223.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="322.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="425.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">After: 5 sequential steps</text><text x="82.0" y="266.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A 5-step sequential paper process usually becomes a 5-step</text><text x="82.0" y="287.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">sequential digital one.</text><rect x="610.0" y="132.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="646.0" cy="166.0" r="16" fill="var(--a)"/><text x="646.0" y="171.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text><text x="674.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Who decides what</text><rect x="632.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="735.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Before: Old authority chain</text><text x="855.0" y="223.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="872.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="975.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">After: Old authority chain</text><text x="632.0" y="266.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Old approval structures, even ones that no longer make sense,</text><text x="632.0" y="287.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">usually carry over unchanged.</text><rect x="60.0" y="338.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="96.0" cy="372.0" r="16" fill="var(--a)"/><text x="96.0" y="377.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text><text x="124.0" y="379.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">How exceptions are handled</text><rect x="82.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="185.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Before: Informal channels</text><text x="305.0" y="429.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="322.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="425.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">After: Informal channels</text><text x="82.0" y="472.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Exceptions are still resolved outside the system, by message or</text><text x="82.0" y="493.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">call, with no defined path.</text><rect x="610.0" y="338.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="646.0" cy="372.0" r="16" fill="var(--a)"/><text x="646.0" y="377.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text><text x="674.0" y="379.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Context carried at each step</text><rect x="632.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="735.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Before: Data fields only</text><text x="855.0" y="429.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="872.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="975.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">After: Data fields only</text><text x="632.0" y="472.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">An electronic form, like a paper one, holds only the fields it was</text><text x="632.0" y="493.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">designed for, with no reasoning or history.</text><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Digitization preserves and speeds up the very problems of the source process.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" width="1200" height="642" role="img" aria-label="Nếu người phụ trách nghỉ một tuần: ở cấp 1 việc dừng, cấp 2 dữ liệu còn nhưng người khác không biết xử lý, cấp 3 việc thường lệ vẫn chạy và ngoại lệ chuyển đúng người, cấp 4 ca đặc biệt xử lý theo tiền lệ, cấp 5 người thay thế nhận hồ sơ chuẩn bị sẵn." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="642" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">“Nghỉ một tuần” cho biết quy trình dựa vào đâu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Chọn một quy trình quan trọng và hỏi cả người trực tiếp làm.</text><line x1="60.0" y1="580.0" x2="1140.0" y2="580.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="602.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Cấp</text><text x="436.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Nếu người phụ trách nghỉ một tuần</text><rect x="60.0" y="158.0" width="360.0" height="62.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><circle cx="92.0" cy="189.0" r="15" fill="#5B6575"/><text x="92.0" y="194.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="126.0" y="194.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Thủ công</text><rect x="436.0" y="158.0" width="704.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.6"/><text x="454.0" y="194.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Việc dừng hoặc chậm, mọi người chờ người đó quay lại</text><line x1="424.0" y1="189.0" x2="426.0" y2="189.0" stroke="#5B6575" stroke-width="2"/><polygon points="432.0,189.0 426.0,192.3 426.0,185.7" fill="#5B6575"/><rect x="60.0" y="230.0" width="360.0" height="62.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><circle cx="92.0" cy="261.0" r="15" fill="#5B6575"/><text x="92.0" y="266.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="126.0" y="266.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Số hóa</text><rect x="436.0" y="230.0" width="704.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.6"/><text x="454.0" y="266.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Dữ liệu vẫn còn nhưng người khác không biết xử lý thế nào</text><line x1="424.0" y1="261.0" x2="426.0" y2="261.0" stroke="#5B6575" stroke-width="2"/><polygon points="432.0,261.0 426.0,264.3 426.0,257.7" fill="#5B6575"/><rect x="60.0" y="302.0" width="360.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="333.0" r="15" fill="#2B74F5"/><text x="92.0" y="338.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="126.0" y="338.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Tự động theo rule</text><rect x="436.0" y="302.0" width="704.0" height="62.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="454.0" y="338.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Việc thường lệ vẫn chạy; ca ngoại lệ chuyển đúng người thay thế</text><line x1="424.0" y1="333.0" x2="426.0" y2="333.0" stroke="#5B6575" stroke-width="2"/><polygon points="432.0,333.0 426.0,336.3 426.0,329.7" fill="#5B6575"/><rect x="60.0" y="374.0" width="360.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="405.0" r="15" fill="#2B74F5"/><text x="92.0" y="410.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="126.0" y="410.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Biết context</text><rect x="436.0" y="374.0" width="704.0" height="62.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="454.0" y="410.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Ca đặc biệt xử lý theo tiền lệ; người thay thế thấy vì sao ca khác</text><line x1="424.0" y1="405.0" x2="426.0" y2="405.0" stroke="#5B6575" stroke-width="2"/><polygon points="432.0,405.0 426.0,408.3 426.0,401.7" fill="#5B6575"/><rect x="60.0" y="446.0" width="360.0" height="62.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="92.0" cy="477.0" r="15" fill="#2B74F5"/><text x="92.0" y="482.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="126.0" y="482.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">AI hỗ trợ có quản trị</text><rect x="436.0" y="446.0" width="704.0" height="62.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="454.0" y="482.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Người thay thế nhận hồ sơ chuẩn bị sẵn, đầu vào đã được diễn giải</text><line x1="424.0" y1="477.0" x2="426.0" y2="477.0" stroke="#5B6575" stroke-width="2"/><polygon points="432.0,477.0 426.0,480.3 426.0,473.7" fill="#5B6575"/><rect x="60.0" y="520.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="553.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Đây là chẩn đoán nhanh, cần đối chiếu với cách quy trình thực sự chạy.</text></svg>
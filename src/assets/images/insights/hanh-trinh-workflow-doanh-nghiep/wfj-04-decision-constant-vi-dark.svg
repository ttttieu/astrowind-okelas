<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Qua năm cấp, phần việc trước và quanh quyết định được hỗ trợ ngày càng nhiều, nhưng quyết định luôn thuộc về rule do người có thẩm quyền ban hành hoặc con người." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="548" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyền quyết định không đổi qua năm cấp</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Thay đổi giữa các cấp là mức hỗ trợ cho phần việc quanh quyết định.</text><line x1="60.0" y1="486.0" x2="1140.0" y2="486.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="508.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="204.0" height="84.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><circle cx="88.0" cy="176.0" r="15" fill="#5B6575"/><text x="88.0" y="181.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="114.0" y="181.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Thủ công</text><rect x="279.0" y="134.0" width="204.0" height="84.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><circle cx="307.0" cy="176.0" r="15" fill="#5B6575"/><text x="307.0" y="181.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="333.0" y="181.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Số hóa</text><rect x="498.0" y="134.0" width="204.0" height="84.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="526.0" cy="176.0" r="15" fill="#2B74F5"/><text x="526.0" y="181.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="552.0" y="181.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Tự động theo rule</text><rect x="717.0" y="134.0" width="204.0" height="84.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="745.0" cy="176.0" r="15" fill="#2B74F5"/><text x="745.0" y="181.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="771.0" y="181.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Biết context</text><rect x="936.0" y="134.0" width="204.0" height="84.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="964.0" cy="176.0" r="15" fill="#2B74F5"/><text x="964.0" y="181.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="990.0" y="181.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">AI hỗ trợ có quản trị</text><rect x="60.0" y="232.0" width="1080.0" height="64.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="600.0" y="269.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Việc trước và quanh quyết định được hỗ trợ ngày càng nhiều</text><rect x="60.0" y="310.0" width="1080.0" height="100.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="340.8" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start">Quyết định, ở mọi cấp</text><text x="84.0" y="371.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule do người có thẩm quyền ban hành, hoặc con người</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI không đứng ở chỗ quyết định, dù ở cấp nào.</text></svg>
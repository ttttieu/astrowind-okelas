<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ví dụ minh họa: nhận đơn hàng ở cấp 3 có bước tiếp theo là đưa điều kiện riêng của khách vào context, xử lý khiếu nại chất lượng ở cấp 4 có bước tiếp theo là AI diễn giải và gom hồ sơ, quản lý kho ở cấp 2 có bước tiếp theo là viết rule cho ca lặp lại." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Một nhà máy, ba quy trình, ba cấp khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Mỗi quy trình có một cấp hiện tại và một bước tiếp theo riêng.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Tình huống minh họa, không phải số liệu hay case khách hàng.</text><text x="66.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Quy trình</text><text x="416.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Cấp hiện tại</text><text x="806.0" y="145.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Bước tiếp theo có ý nghĩa</text><rect x="60.0" y="158.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="209.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Nhận đơn hàng</text><rect x="410.0" y="158.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="209.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Cấp 3 · Tự động theo rule</text><rect x="800.0" y="158.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="209.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Đưa điều kiện riêng của khách vào context</text><line x1="784.0" y1="204.0" x2="790.0" y2="204.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,204.0 790.0,207.3 790.0,200.7" fill="#2B74F5"/><rect x="60.0" y="262.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="313.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Xử lý khiếu nại chất lượng</text><rect x="410.0" y="262.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="313.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Cấp 4 · Biết context</text><rect x="800.0" y="262.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="313.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">AI diễn giải email, gom hồ sơ cho người duyệt</text><line x1="784.0" y1="308.0" x2="790.0" y2="308.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,308.0 790.0,311.3 790.0,304.7" fill="#2B74F5"/><rect x="60.0" y="366.0" width="330.0" height="92.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.4"/><text x="76.0" y="417.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Quản lý kho</text><rect x="410.0" y="366.0" width="370.0" height="92.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="426.0" y="417.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Cấp 2 · Số hóa</text><rect x="800.0" y="366.0" width="340.0" height="92.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="816.0" y="417.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Viết rule cho các ca lặp lại, chưa cần AI</text><line x1="784.0" y1="412.0" x2="790.0" y2="412.0" stroke="#2B74F5" stroke-width="2"/><polygon points="796.0,412.0 790.0,415.3 790.0,408.7" fill="#2B74F5"/><rect x="60.0" y="472.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="505.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Không cần đưa mọi quy trình lên cấp 5.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Four hidden costs of knowledge loss: reduced productivity during transition, errors and incidents while learning, loss of potential improvements, and management time on consequences." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="580" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four types of hidden knowledge loss costs</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">They accumulate over the months after the person leaves.</text><line x1="60.0" y1="496.0" x2="1140.0" y2="496.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="518.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="559.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="94.0" cy="168.0" r="15" fill="var(--a)"/><text x="94.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Reduced productivity during transition</text><text x="122.0" y="199.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Work takes longer. Experienced colleagues spend time</text><text x="122.0" y="218.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">explaining, checking and correcting.</text><rect x="606.0" y="134.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="640.0" cy="168.0" r="15" fill="var(--a)"/><text x="640.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Errors and incidents while learning</text><text x="668.0" y="199.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Substandard materials accepted, equipment warning signs</text><text x="668.0" y="218.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">missed, non-standard situations mishandled. May bring audit</text><text x="668.0" y="238.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">findings and remediation costs.</text><rect x="60.0" y="278.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="94.0" cy="312.0" r="15" fill="var(--a)"/><text x="94.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="314.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Loss of potential improvements</text><text x="122.0" y="343.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Undocumented improvement ideas leave with the person. A real</text><text x="122.0" y="362.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">opportunity cost.</text><rect x="606.0" y="278.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="640.0" cy="312.0" r="15" fill="var(--a)"/><text x="640.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="314.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Management time on consequences</text><text x="668.0" y="343.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Assigning cover, monitoring more closely, handling problems,</text><text x="668.0" y="362.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hiring a replacement.</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Most of these costs have no budget line of their own.</text></svg>
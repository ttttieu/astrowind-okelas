<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="Năm việc cần chuẩn bị khi chưa sẵn sàng: chuẩn hóa quy trình, làm sạch dữ liệu master, chọn phạm vi đầu nhỏ, chỉ định người chịu trách nhiệm và truyền thông với nhân viên." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="534" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm việc cần chuẩn bị khi chưa sẵn sàng cho ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">“Chưa sẵn sàng” không có nghĩa ERP là hướng sai; nghĩa là cần chuẩn bị.</text><line x1="60.0" y1="450.0" x2="1140.0" y2="450.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="472.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Các việc không theo thứ tự cố định.</text><text x="60.0" y="513.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Khi câu trả lời trung thực là “chưa sẵn sàng”</text><line x1="158.4" y1="188.0" x2="158.4" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="158.4,212.0 154.0,204.0 162.8,204.0" fill="var(--gm)"/><rect x="60.0" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn hóa quy trình</text><text x="76.0" y="280.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu hóa các quy trình</text><text x="76.0" y="298.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vận hành chính.</text><line x1="379.2" y1="188.0" x2="379.2" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="379.2,212.0 374.8,204.0 383.6,204.0" fill="var(--gm)"/><rect x="280.8" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="296.8" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Làm sạch</text><text x="296.8" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">dữ liệu master</text><text x="296.8" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Làm trước khi chuyển</text><text x="296.8" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">dữ liệu (migration).</text><line x1="600.0" y1="188.0" x2="600.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,212.0 595.6,204.0 604.4,204.0" fill="var(--gm)"/><rect x="501.6" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="517.6" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chọn phạm vi</text><text x="517.6" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">đầu nhỏ</text><text x="517.6" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đủ nhỏ để có</text><text x="517.6" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thể thành công.</text><line x1="820.8" y1="188.0" x2="820.8" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="820.8,212.0 816.4,204.0 825.2,204.0" fill="var(--gm)"/><rect x="722.4" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="738.4" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ định người</text><text x="738.4" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">chịu trách nhiệm</text><text x="738.4" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cho dự án và cho</text><text x="738.4" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hệ thống sau go-live.</text><line x1="1041.6" y1="188.0" x2="1041.6" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1041.6,212.0 1037.2,204.0 1046.0,204.0" fill="var(--gm)"/><rect x="943.2" y="214.0" width="196.8" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="959.2" y="250.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Truyền thông với</text><text x="959.2" y="272.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhân viên</text><text x="959.2" y="302.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Giải thích thay đổi gì và</text><text x="959.2" y="320.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vì sao, trước khi dự án</text><text x="959.2" y="339.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">bắt đầu.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu trả lời “chưa sẵn sàng” là thông tin hữu ích: nó chỉ ra việc cần làm trước khi chọn phần mềm.</text></svg>
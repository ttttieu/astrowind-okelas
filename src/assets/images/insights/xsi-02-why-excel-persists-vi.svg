<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Bảng ba tình huống: kế hoạch sản xuất, đơn hàng khẩn và kiểm tra chất lượng, mỗi tình huống có điểm hệ thống chính chưa đáp ứng và điều Excel cho phép làm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="628" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao Excel vẫn được dùng: giải quyết vấn đề thật</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi file Excel quan trọng đại diện cho một nhu cầu mà hệ thống chính chưa đáp ứng tốt.</text><line x1="60.0" y1="544.0" x2="1140.0" y2="544.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="566.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa tổng hợp theo bài viết, không phải số liệu đo lường hay một tổ chức cụ thể.</text><text x="60.0" y="607.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="433.7" y="134.0" width="118.7" height="28.0" rx="14.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="493.0" y="152.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Hệ thống chính</text><rect x="900.5" y="134.0" width="54.9" height="28.0" rx="14.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="928.0" y="152.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Excel</text><rect x="60.0" y="134.0" width="73.9" height="28.0" rx="14.0" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.2"/><text x="97.0" y="152.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhu cầu</text><rect x="60.0" y="178.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="225.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Kế hoạch sản xuất</text><rect x="290.0" y="178.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="215.9" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Nhập liệu theo cấu trúc cứng, khó phản ánh thay đổi</text><text x="495.0" y="234.3" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">trong ngày</text><rect x="720.0" y="178.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="225.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sửa nhanh, thêm ghi chú, đánh dấu ưu tiên bằng màu</text><line x1="704.0" y1="220.0" x2="708.0" y2="220.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,220.0 708.0,224.4 708.0,215.6" fill="var(--mut)"/><rect x="60.0" y="274.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="321.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Đơn hàng khẩn</text><rect x="290.0" y="274.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="311.9" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Không có cách đánh dấu “khẩn” theo logic của</text><text x="495.0" y="330.3" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">người quản lý</text><rect x="720.0" y="274.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="321.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tổ chức thông tin theo đúng logic đó</text><line x1="704.0" y1="316.0" x2="708.0" y2="316.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,316.0 708.0,320.4 708.0,311.6" fill="var(--mut)"/><rect x="60.0" y="370.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="417.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Kiểm tra chất lượng</text><rect x="290.0" y="370.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="407.9" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Form chuẩn không ghi nhận các bước đặc thù từng</text><text x="495.0" y="426.3" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">sản phẩm</text><rect x="720.0" y="370.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thêm các bước riêng cho từng sản phẩm</text><line x1="704.0" y1="412.0" x2="708.0" y2="412.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,412.0 708.0,416.4 708.0,407.6" fill="var(--mut)"/><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Excel không tồn tại vì lười biếng. Nó làm được điều hệ thống chính chưa làm đủ tốt.</text></svg>
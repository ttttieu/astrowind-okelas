<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Năm tiêu chí đánh giá hồ sơ: truy vết được, đủ và cân bằng, nêu rõ độ chắc chắn, vừa đủ đọc, và không kết luận thay người quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="628" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm tiêu chí đánh giá một bộ hồ sơ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hồ sơ tốt giúp người quyết định, không nghĩ thay họ.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="1080.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="164.0" r="15" fill="var(--p)"/><text x="96.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="136.0" y="170.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Truy vết được</text><text x="506.0" y="169.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi dữ kiện dẫn về nguồn; mở được trong vài giây.</text><rect x="60.0" y="206.0" width="1080.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="238.0" r="15" fill="var(--p)"/><text x="96.0" y="243.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="136.0" y="244.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đủ và cân bằng</text><text x="506.0" y="243.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Có cả dữ kiện ủng hộ và phản đối mỗi phương án.</text><rect x="60.0" y="280.0" width="1080.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="312.0" r="15" fill="var(--p)"/><text x="96.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="136.0" y="318.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nêu rõ độ chắc chắn</text><text x="506.0" y="317.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phân biệt điều đã xác nhận, điều suy ra và điều chưa biết.</text><rect x="60.0" y="354.0" width="1080.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="386.0" r="15" fill="var(--p)"/><text x="96.0" y="391.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="136.0" y="392.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vừa đủ đọc</text><text x="506.0" y="391.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đọc được trong thời gian hợp lý mà vẫn kiểm chứng được.</text><rect x="60.0" y="428.0" width="1080.0" height="64.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="96.0" cy="460.0" r="15" fill="var(--a)"/><text x="96.0" y="465.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="136.0" y="466.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không kết luận thay</text><text x="506.0" y="465.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nêu phương án và hệ quả, không nêu đáp án “nên chọn”.</text><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thước đo: quyết định nhanh hơn và vẫn giải thích được lý do bằng lời của mình.</text></svg>
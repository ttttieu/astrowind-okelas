<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Sáu thành phần của bộ evidence tốt: câu hỏi cần quyết định, rule hoặc chính sách liên quan, dữ kiện kèm nguồn, ca tương tự và kết quả, phương án và hệ quả, điều chưa biết và dữ kiện ngược chiều; thành phần thứ sáu quan trọng nhất và dễ bị bỏ nhất." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="606" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Sáu thành phần của một bộ evidence tốt</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Thành phần thứ sáu quan trọng nhất và dễ bị bỏ nhất.</text><line x1="60.0" y1="544.0" x2="1140.0" y2="544.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="566.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Câu hỏi cần quyết định</text><text x="84.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Quyết định gì, phạm vi nào, thời hạn nào.</text><rect x="427.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule hoặc chính sách</text><text x="489.0" y="195.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">liên quan</text><text x="451.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Rule nào áp dụng, vì sao ca nằm ngoài,</text><text x="451.0" y="260.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">ai ban hành.</text><rect x="794.0" y="134.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="856.0" y="171.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Dữ kiện kèm nguồn</text><text x="818.0" y="241.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mỗi dữ kiện nêu nơi lấy: hợp đồng,</text><text x="818.0" y="260.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hệ thống, email.</text><rect x="60.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="344.0" r="15" fill="#2B74F5"/><text x="94.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Ca tương tự và kết quả</text><text x="84.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mức độ tương tự, điểm khác biệt, kết quả</text><text x="84.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">sau đó.</text><rect x="427.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="344.0" r="15" fill="#2B74F5"/><text x="461.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="489.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Phương án và hệ quả</text><text x="451.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Các hướng khả thi kèm hệ quả có căn cứ,</text><text x="451.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">không nêu đáp án.</text><rect x="794.0" y="308.0" width="346.0" height="158.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="344.0" r="15" fill="#A78BFA"/><text x="828.0" y="349.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="856.0" y="345.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Điều chưa biết và dữ kiện</text><text x="856.0" y="369.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">ngược chiều</text><text x="818.0" y="415.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Thông tin thiếu, nguồn mâu thuẫn, ca có</text><text x="818.0" y="434.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">kết quả xấu.</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Phần khó đưa vào hồ sơ nhất lại bảo vệ quyết định nhiều nhất.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba hoạt động ra quyết định theo Simon: intelligence nhận diện ca và thu thập dữ kiện, design nêu các phương án và hệ quả, AI hỗ trợ cả hai; choice chọn phương án và chịu trách nhiệm, thuộc về con người hoặc rule do người có thẩm quyền ban hành." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định có ba phần, AI hỗ trợ hai phần đầu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ranh giới theo Simon (1960): nhận diện, thiết kế, lựa chọn.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="280.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="181.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligence</text><text x="84.0" y="230.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nhận diện ca, thu thập dữ kiện, tìm quy</text><text x="84.0" y="251.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">định và tiền lệ.</text><line x1="84.0" y1="298.0" x2="382.0" y2="298.0" stroke="var(--p)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="324.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vai trò</text><text x="84.0" y="353.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI hỗ trợ</text><text x="84.0" y="377.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Tìm, gom, đối chiếu, nêu nguồn</text><line x1="408.0" y1="170.0" x2="419.0" y2="170.0" stroke="var(--p)" stroke-width="2"/><polygon points="425.0,170.0 419.0,173.3 419.0,166.7" fill="var(--p)"/><rect x="427.0" y="134.0" width="346.0" height="280.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="463.0" cy="170.0" r="15" fill="var(--p)"/><text x="463.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="491.0" y="181.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Design</text><text x="451.0" y="230.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nêu các phương án khả thi và hệ quả đã</text><text x="451.0" y="251.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">biết của từng phương án.</text><line x1="451.0" y1="298.0" x2="749.0" y2="298.0" stroke="var(--p)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="324.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vai trò</text><text x="451.0" y="353.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI hỗ trợ</text><text x="451.0" y="377.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Liệt kê và nêu hệ quả, không chọn</text><line x1="775.0" y1="170.0" x2="786.0" y2="170.0" stroke="var(--p)" stroke-width="2"/><polygon points="792.0,170.0 786.0,173.3 786.0,166.7" fill="var(--p)"/><rect x="794.0" y="134.0" width="346.0" height="280.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="830.0" cy="170.0" r="15" fill="var(--a)"/><text x="830.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="858.0" y="181.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Choice</text><text x="818.0" y="230.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Chọn một phương án và</text><text x="818.0" y="251.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chịu trách nhiệm.</text><line x1="818.0" y1="298.0" x2="1116.0" y2="298.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="324.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vai trò</text><text x="818.0" y="353.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Con người</text><text x="818.0" y="377.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Hoặc rule do người có thẩm quyền ban hành</text><rect x="60.0" y="432.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="465.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI chuẩn bị evidence; con người chọn.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Năm tiêu chí đánh giá hồ sơ: truy vết được, đủ và cân bằng, nêu rõ độ chắc chắn, vừa đủ đọc, và không kết luận thay người quyết định." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="628" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Năm tiêu chí đánh giá một bộ hồ sơ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Hồ sơ tốt giúp người quyết định, không nghĩ thay họ.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="164.0" r="15" fill="#2B74F5"/><text x="96.0" y="169.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="136.0" y="170.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Truy vết được</text><text x="506.0" y="169.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Mỗi dữ kiện dẫn về nguồn; mở được trong vài giây.</text><rect x="60.0" y="206.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="238.0" r="15" fill="#2B74F5"/><text x="96.0" y="243.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="136.0" y="244.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Đủ và cân bằng</text><text x="506.0" y="243.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Có cả dữ kiện ủng hộ và phản đối mỗi phương án.</text><rect x="60.0" y="280.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="312.0" r="15" fill="#2B74F5"/><text x="96.0" y="317.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="136.0" y="318.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Nêu rõ độ chắc chắn</text><text x="506.0" y="317.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Phân biệt điều đã xác nhận, điều suy ra và điều chưa biết.</text><rect x="60.0" y="354.0" width="1080.0" height="64.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><circle cx="96.0" cy="386.0" r="15" fill="#2B74F5"/><text x="96.0" y="391.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="136.0" y="392.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Vừa đủ đọc</text><text x="506.0" y="391.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Đọc được trong thời gian hợp lý mà vẫn kiểm chứng được.</text><rect x="60.0" y="428.0" width="1080.0" height="64.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="96.0" cy="460.0" r="15" fill="#A78BFA"/><text x="96.0" y="465.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="136.0" y="466.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Không kết luận thay</text><text x="506.0" y="465.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Nêu phương án và hệ quả, không nêu đáp án “nên chọn”.</text><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Thước đo: quyết định nhanh hơn và vẫn giải thích được lý do bằng lời của mình.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Hồ sơ gọn và tự tin có thể khiến người quyết định giảm tự kiểm tra và không còn phán đoán; năm biện pháp thiết kế: dữ kiện ngược chiều ngay trong hồ sơ, không đặt phương án mặc định, ghi lý do bằng lời của người quyết định, lấy mẫu đối chiếu nguồn, và người ký chịu trách nhiệm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Giảm rủi ro người quyết định tin theo máy</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giải pháp nằm ở thiết kế hồ sơ và quy trình, không ở lời nhắc.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="300.0" height="64.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="210.0" y="169.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Hồ sơ gọn, trình bày tự tin</text><line x1="364.0" y1="164.0" x2="386.0" y2="164.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="396.0,164.0 386.0,169.5 386.0,158.5" fill="var(--gm)"/><rect x="400.0" y="132.0" width="340.0" height="64.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="570.0" y="169.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Người quyết định giảm tự kiểm tra</text><line x1="744.0" y1="164.0" x2="766.0" y2="164.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="776.0,164.0 766.0,169.5 766.0,158.5" fill="var(--gm)"/><rect x="780.0" y="132.0" width="340.0" height="64.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="950.0" y="169.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyết định không còn phán đoán</text><text x="60.0" y="249.9" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Năm biện pháp thiết kế</text><rect x="60.0" y="270.0" width="534.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="298.0" r="15" fill="var(--p)"/><text x="90.0" y="303.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="303.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ kiện ngược chiều nằm ngay trong hồ sơ</text><rect x="606.0" y="270.0" width="534.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="636.0" cy="298.0" r="15" fill="var(--p)"/><text x="636.0" y="303.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="670.0" y="303.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Không đặt một phương án làm mặc định</text><rect x="60.0" y="338.0" width="534.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="366.0" r="15" fill="var(--p)"/><text x="90.0" y="371.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="124.0" y="371.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Người quyết định ghi lý do bằng lời của mình</text><rect x="606.0" y="338.0" width="534.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="636.0" cy="366.0" r="15" fill="var(--p)"/><text x="636.0" y="371.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="670.0" y="371.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lấy mẫu đối chiếu với nguồn gốc định kỳ</text><rect x="60.0" y="406.0" width="534.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="90.0" cy="434.0" r="15" fill="var(--p)"/><text x="90.0" y="439.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="124.0" y="439.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Người ký quyết định chịu trách nhiệm</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hướng thiết kế dựa trên nghiên cứu; cần thử và đo trong quy trình của bạn.</text></svg>
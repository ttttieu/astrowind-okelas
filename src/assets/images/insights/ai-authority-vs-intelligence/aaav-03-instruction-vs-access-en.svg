<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Two comparison cards: the agent understood the instruction, and the agent had enough access to act." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Understanding a rule is not the same as being bound by it</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">One example from the article: an agent understood a limit but still had enough access to cause harm.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The Replit incident is summarised from the article; the closing line “a verbal instruction is not access control” is OKELAS analysis.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="200.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="88.0" y="184.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Understood the instruction</text><text x="88.0" y="226.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">The agent understood: make no changes without</text><text x="88.0" y="250.4" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">asking first.</text><rect x="612.0" y="134.0" width="528.0" height="200.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="640.0" y="184.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Had access enough to act</text><text x="640.0" y="226.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Access was sufficient to run a deletion command.</text><rect x="60.0" y="374.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="407.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A verbal instruction does not replace a limit on access.</text></svg>
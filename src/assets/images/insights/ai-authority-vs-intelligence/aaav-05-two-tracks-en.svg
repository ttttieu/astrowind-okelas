<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Two tracks: capability review above, authority decision below, joined by a dashed arrow." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Capability review and authority decision are separate</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Capability review and authority decisions need to run on two separate tracks.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Diagram illustrating the two-track structure from the article; not a standard process.</text><text x="60.0" y="589.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="158.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Capability review</text><text x="60.0" y="322.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Authority decision</text><rect x="60.0" y="176.0" width="300.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="224.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Measure capability</text><rect x="390.0" y="176.0" width="300.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="540.0" y="224.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Finding: can do the task</text><rect x="720.0" y="176.0" width="300.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="870.0" y="213.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">A separate decision is</text><text x="870.0" y="235.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">still needed</text><rect x="60.0" y="340.0" width="300.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="210.0" y="388.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Who may act?</text><rect x="390.0" y="340.0" width="300.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="540.0" y="377.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Assign owner,</text><text x="540.0" y="399.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">scope, consequence</text><rect x="720.0" y="340.0" width="300.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="870.0" y="388.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Revocation path in place</text><line x1="540.0" y1="260.0" x2="540.0" y2="326.0" stroke="var(--gm)" stroke-width="3"/><polygon points="540.0,338.0 533.4,326.0 546.6,326.0" fill="var(--gm)"/><text x="556.0" y="305.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="start">does not automatically become</text><rect x="60.0" y="456.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Evaluating capability does not answer the authority question.</text></svg>
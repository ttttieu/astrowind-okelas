<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Branching diagram: authority splits into official and personal authority, with a note on AI." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="660" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Official and personal authority are different things</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The distinction goes back to Henri Fayol, and the article applies it to AI.</text><line x1="60.0" y1="576.0" x2="1140.0" y2="576.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="598.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Distinction per Fayol, as cited in the article; the diagram illustrates structure.</text><text x="60.0" y="639.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="330.0" y="134.0" width="420.0" height="70.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="540.0" y="177.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="middle">Authority</text><line x1="540.0" y1="204.0" x2="540.0" y2="250.0" stroke="var(--gm)" stroke-width="2"/><line x1="315.0" y1="250.0" x2="865.0" y2="250.0" stroke="var(--gm)" stroke-width="2"/><line x1="315.0" y1="250.0" x2="315.0" y2="280.0" stroke="var(--gm)" stroke-width="2"/><line x1="865.0" y1="250.0" x2="865.0" y2="280.0" stroke="var(--gm)" stroke-width="2"/><rect x="60.0" y="280.0" width="510.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="84.0" y="323.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Official authority</text><text x="84.0" y="357.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Comes from position in the organization.</text><rect x="610.0" y="280.0" width="510.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="634.0" y="323.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Personal authority</text><text x="634.0" y="357.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Comes from competence, experience and moral worth.</text><rect x="60.0" y="414.0" width="1060.0" height="64.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="84.0" y="449.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">For AI: users trusting its suggestions is personal authority, with no official mechanism or accountability attached.</text><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Authority always carries responsibility, so it cannot be separated from the people who answer for it.</text></svg>
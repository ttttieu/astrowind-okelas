<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Two side-by-side cards: intelligence is a property of the model; authority is granted and carries responsibility." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Knowing how is not the same as being permitted</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Intelligence and authority are two separate dimensions, and each needs its own management.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Definitions as presented in the article; authority per Fayol (1916).</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="260.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="88.0" y="185.3" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Intelligence</text><text x="88.0" y="224.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">The ability to reason and produce high-quality output. A</text><text x="88.0" y="248.4" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">property of the model itself.</text><text x="88.0" y="326.1" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="start">Independent of how it is deployed or what access it is given.</text><rect x="612.0" y="134.0" width="528.0" height="260.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="640.0" y="185.3" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Authority</text><text x="640.0" y="224.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">The right to give orders and the power to</text><text x="640.0" y="248.4" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">exact obedience.</text><text x="640.0" y="326.1" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="start">Always carries responsibility; granted deliberately.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Intelligence is a property of the model. Authority is granted deliberately and carries responsibility.</text></svg>
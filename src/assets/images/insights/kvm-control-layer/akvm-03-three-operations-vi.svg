<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Ba thẻ thao tác: Trace, FindEvidence, Resolve, mỗi thẻ có câu hỏi và định nghĩa ngắn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="552" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba thao tác: Trace, FindEvidence, Resolve</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba thao tác bài viết nêu tên, mỗi thao tác trả lời một câu hỏi khác nhau.</text><line x1="60.0" y1="468.0" x2="1140.0" y2="468.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="490.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba thao tác theo bài viết; FindGap là hướng phát triển được nêu, chưa phải năng lực hiện tại nên không đưa vào hình.</text><text x="60.0" y="531.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="183.7" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Trace</text><text x="84.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Tri thức này đến từ đâu, qua những</text><text x="84.0" y="249.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">bước nào?</text><text x="84.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Truy vết nguồn gốc, quan hệ hoặc</text><text x="84.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">provenance của một mảnh tri thức.</text><rect x="426.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="450.0" y="183.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">FindEvidence</text><text x="450.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Có bằng chứng nào cho</text><text x="450.0" y="249.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">tình huống này?</text><text x="450.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Tìm bằng chứng liên quan trong</text><text x="450.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">tổ chức cho một tình huống cụ thể.</text><rect x="792.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="816.0" y="183.7" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Resolve</text><text x="816.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Đang nói về đối tượng nào?</text><text x="816.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định đúng thực thể, quan hệ hoặc</text><text x="816.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">đối tượng đang được nhắc tới.</text><rect x="60.0" y="398.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="431.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI suy luận và giải thích; KVM truy xuất, resolve và trace tri thức tổ chức.</text></svg>
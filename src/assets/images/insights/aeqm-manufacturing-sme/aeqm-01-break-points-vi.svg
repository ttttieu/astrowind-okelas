<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Bốn thẻ nhỏ xếp thành lưới hai cột, mỗi thẻ nêu một điểm gãy của QMS giấy." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn điểm gãy khiến QMS giấy không còn đủ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khi doanh nghiệp lớn lên, bốn điểm này xuất hiện trước tiên.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn điểm theo bài viết; đây là quan sát, không phải số đo.</text><text x="60.0" y="589.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="209.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu lỗi thời</text><text x="86.0" y="238.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không biết quy trình nào đang có hiệu lực</text><rect x="612.0" y="160.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="209.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Khó truy vết</text><text x="638.0" y="238.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Hồ sơ rời rạc, khó chứng minh được nguồn gốc</text><rect x="60.0" y="302.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="351.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Thiếu liên kết</text><text x="86.0" y="380.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Hành động khắc phục không gắn với nguyên nhân</text><rect x="612.0" y="302.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="351.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Lãnh đạo thiếu tầm nhìn</text><text x="638.0" y="380.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Số liệu chất lượng không đến được người quyết định</text><rect x="60.0" y="456.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bốn điểm gãy cùng xuất hiện khi doanh nghiệp lớn lên.</text></svg>
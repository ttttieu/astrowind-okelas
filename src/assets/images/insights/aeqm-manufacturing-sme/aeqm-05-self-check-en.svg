<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Eight squares in a row, five filled to show five of the eight self-check signs." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five of eight signs: the issue is often how it runs</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article offers an eight-sign self-check; count how many apply to your company.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Eight signs and the five-sign threshold per the article; the chart is OKELAS’s illustration.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="219.4" font-size="56" font-weight="700" fill="var(--a)" text-anchor="start">5 / 8</text><rect x="60.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="195.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="330.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="465.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="600.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="735.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><rect x="870.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><rect x="1005.0" y="262.0" width="120.0" height="120.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="60.0" y="429.2" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Each square is one sign; filled squares mark the signs that apply.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Five or more signs often point to how the system runs, not missing records.</text></svg>
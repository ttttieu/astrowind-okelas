<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Five numbered cards, one for each principle an SME should follow." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five principles for an SME to roll out eQMS in sequence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Start from a real problem, not from buying software.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Five principles per the article; sector rules such as GMP and HACCP need separate review.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="196.0" height="220.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="94.0" cy="204.0" r="15" fill="var(--p)"/><text x="94.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Start from</text><text x="80.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">pain points</text><rect x="281.0" y="170.0" width="196.0" height="220.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="315.0" cy="204.0" r="15" fill="var(--gm)"/><text x="315.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="301.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clarify processes</text><text x="301.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">before digitizing</text><rect x="502.0" y="170.0" width="196.0" height="220.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="536.0" cy="204.0" r="15" fill="var(--gm)"/><text x="536.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="522.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Roll out in stages</text><rect x="723.0" y="170.0" width="196.0" height="220.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="757.0" cy="204.0" r="15" fill="var(--gm)"/><text x="757.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="743.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Choose a</text><text x="743.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">right-sized system</text><rect x="944.0" y="170.0" width="196.0" height="220.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="978.0" cy="204.0" r="15" fill="var(--gm)"/><text x="978.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="964.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Check sector</text><text x="964.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">requirements</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Clarify the process first, then digitize and roll out in stages.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Lưới ba cột hai hàng, mỗi ô là một thành phần eQMS kèm số điều khoản ISO 9001." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">eQMS là cách vận hành, không chỉ là phần mềm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phần mềm chỉ có giá trị khi quy trình đã rõ người sở hữu và bằng chứng.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Định nghĩa eQMS theo bài viết; cách đặt hai cột cạnh nhau là cách OKELAS trình bày.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="270.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--s)" text-anchor="start">eQMS không phải</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Hệ thống quản lý tài liệu (DMS)</text><text x="88.0" y="320.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Giấy đã được scan</text><text x="88.0" y="382.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Nguồn gốc của chất lượng</text><rect x="612.0" y="160.0" width="528.0" height="270.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">eQMS là</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Một cách vận hành có chủ sở hữu rõ ràng</text><text x="640.0" y="320.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Workflow nối các hoạt động chất lượng</text><text x="640.0" y="382.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">–  Bằng chứng có thể truy vết</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần mềm không tự tạo ra chất lượng; quy trình rõ ràng mới làm được.</text></svg>
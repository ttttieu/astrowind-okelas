<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Hai thẻ đặt cạnh nhau: eQMS không phải là gì ở bên trái, eQMS là gì ở bên phải." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu thành phần eQMS, mỗi thành phần gắn một điều khoản ISO</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu nhóm chức năng theo ISO 9001:2015 mà bài viết dùng để tổ chức nội dung.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản theo ISO 9001:2015 như bài viết liệt kê; đối chiếu với phiên bản đang áp dụng.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="132.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="80.0" y="180.0" width="60.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.0"/><text x="110.0" y="200.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">7.5</text><text x="80.0" y="239.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm soát tài liệu</text><rect x="430.0" y="160.0" width="340.0" height="132.0" rx="14" fil
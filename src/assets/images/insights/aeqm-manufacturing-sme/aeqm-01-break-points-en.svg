<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Four small cards in a two-by-two grid, each naming one break point of paper QMS." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="610" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four break points that make paper QMS fall short</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">As a company grows, these four points tend to appear first.</text><line x1="60.0" y1="526.0" x2="1140.0" y2="526.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="548.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four break points per the article; these are observations, not measured figures.</text><text x="60.0" y="589.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="209.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Outdated documents</text><text x="86.0" y="238.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Unclear which procedure is currently in force</text><rect x="612.0" y="160.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="209.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Hard to trace</text><text x="638.0" y="238.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Records scattered, difficult to prove where something</text><text x="638.0" y="260.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">came from</text><rect x="60.0" y="302.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="351.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Weak linkage</text><text x="86.0" y="380.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Corrective actions not connected to root causes</text><rect x="612.0" y="302.0" width="528.0" height="122.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="351.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Leadership lacks visibility</text><text x="638.0" y="380.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Quality data does not reach the people who decide</text><rect x="60.0" y="456.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The four break points tend to surface together as a company grows.</text></svg>
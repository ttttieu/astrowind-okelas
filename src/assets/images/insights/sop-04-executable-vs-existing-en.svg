<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Comparison of an SOP that merely exists and one that is executed: written by managers or with the people who execute, ideal conditions only or non-standard ones too, in a folder or at the right moment, written once or kept updated." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">What separates an executable SOP from one that merely exists</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The difference lies in how an SOP is created, embedded in work and maintained.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="629.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="177.2" font-size="22" font-weight="700" fill="var(--mut)" text-anchor="start">An SOP that merely exists</text><rect x="612.0" y="134.0" width="528.0" height="346.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="177.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">An SOP that is executed</text><rect x="84.0" y="200.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="233.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Written only by managers</text><rect x="636.0" y="200.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="233.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Written with the people who execute, including real variables</text><rect x="84.0" y="266.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="299.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Describes only ideal conditions</text><rect x="636.0" y="266.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="299.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Covers non-standard conditions: if X happens, do what?</text><rect x="84.0" y="332.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="365.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">On paper, or in a folder no one knows to search</text><rect x="636.0" y="332.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="355.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Appears at the right time, in a usable form: a tablet checklist, a</text><text x="876.0" y="374.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">system prompt</text><rect x="84.0" y="398.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="431.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Written once and left unchanged</text><rect x="636.0" y="398.0" width="480.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="431.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Updated from operational reality</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">An executable SOP isn’t a more carefully written one. It is one designed for real working conditions.</text></svg>
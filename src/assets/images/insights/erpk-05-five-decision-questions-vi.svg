<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Năm câu hỏi trước khi chấp nhận customization: là customization hay configuration, có đổi quy trình được không, chi phí thực tế, lợi ích có đo lường được không và ai là người quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm câu hỏi trước khi chấp nhận một customization</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Trả lời lần lượt trước khi chấp thuận bất kỳ yêu cầu nào.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Framework từ bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="165.0" r="15" fill="var(--p)"/><text x="96.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="171.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đây là customization hay configuration?</text><text x="640.0" y="170.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu là configuration, làm ngay.</text><rect x="60.0" y="206.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="237.0" r="15" fill="var(--p)"/><text x="96.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="130.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Có thể đổi quy trình để phù hợp ERP không?</text><text x="640.0" y="242.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình có nên vận hành theo cách ERP hỗ trợ?</text><rect x="60.0" y="278.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="309.0" r="15" fill="var(--p)"/><text x="96.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="315.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí thực tế là bao nhiêu?</text><text x="640.0" y="314.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Lập trình, kiểm thử, bảo trì, nâng cấp, rủi ro phụ thuộc.</text><rect x="60.0" y="350.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="381.0" r="15" fill="var(--p)"/><text x="96.0" y="386.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="130.0" y="387.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Lợi ích kinh doanh có đo lường được không?</text><text x="640.0" y="386.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu không, cân nhắc lại.</text><rect x="60.0" y="422.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="453.0" r="15" fill="var(--p)"/><text x="96.0" y="458.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="130.0" y="459.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ai là người quyết định?</text><text x="640.0" y="458.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người có thẩm quyền kinh doanh, không chỉ nhóm dự án hay IT.</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyết định customization cần một framework, không phải phản ứng theo yêu cầu.</text></svg>
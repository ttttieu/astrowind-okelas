<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 686" width="1200" height="686" role="img" aria-label="Tám nguyên nhân phổ biến khiến dự án ERP không đạt mục tiêu: quy trình chưa chuẩn hóa, dữ liệu kém, scope không kiểm soát, customization quá nhiều, con người không đổi cách làm việc, thiếu governance sau go-live, kế toán chưa sẵn sàng và không định nghĩa thành công." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="686" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tám nguyên nhân khiến dự án ERP không đạt mục tiêu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sắp xếp theo thứ tự trong bài viết; số thứ tự không phải mức độ nghiêm trọng.</text><line x1="60.0" y1="602.0" x2="1140.0" y2="602.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="624.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách nhóm theo phân tích trong bài viết, không phải thống kê. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="665.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="164.0" r="15" fill="var(--a)"/><text x="92.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="164.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình chưa chuẩn hóa</text><text x="120.0" y="187.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dự án thành cuộc thương lượng liên miên về cách hệ thống nên</text><text x="120.0" y="206.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hoạt động.</text><rect x="606.0" y="134.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="164.0" r="15" fill="var(--a)"/><text x="638.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="666.0" y="164.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu không sạch, không đủ</text><text x="666.0" y="187.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống phản ánh đúng cả những điểm không nhất quán được</text><text x="666.0" y="206.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đưa vào.</text><rect x="60.0" y="232.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="262.0" r="15" fill="var(--a)"/><text x="92.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="120.0" y="262.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Scope không được kiểm soát</text><text x="120.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi yêu cầu nhỏ đều có lý do; cộng lại, dự án phình ra.</text><rect x="606.0" y="232.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="262.0" r="15" fill="var(--a)"/><text x="638.0" y="267.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="666.0" y="262.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Customization quá nhiều</text><text x="666.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống khó nâng cấp, khó bảo trì, dần thành hộp đen.</text><rect x="60.0" y="330.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="360.0" r="15" fill="var(--a)"/><text x="92.0" y="365.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="120.0" y="360.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Con người không đổi cách làm việc</text><text x="120.0" y="383.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Họ làm việc xung quanh hệ thống: Excel, ghi chú riêng, xin ngoại lệ.</text><rect x="606.0" y="330.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="360.0" r="15" fill="var(--a)"/><text x="638.0" y="365.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="666.0" y="360.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Thiếu governance sau go-live</text><text x="666.0" y="383.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống không có chủ thì không ai muốn dùng.</text><rect x="60.0" y="428.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="458.0" r="15" fill="var(--a)"/><text x="92.0" y="463.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="120.0" y="458.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Kế toán, tài chính chưa sẵn sàng</text><text x="120.0" y="481.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Thiếu sơ đồ tài khoản, cách phân bổ chi phí, quy trình đối chiếu.</text><rect x="606.0" y="428.0" width="534.0" height="88.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="638.0" cy="458.0" r="15" fill="var(--a)"/><text x="638.0" y="463.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="666.0" y="458.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không định nghĩa “thành công”</text><text x="666.0" y="481.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dự án luôn “xong” về kỹ thuật dù chưa tạo giá trị kinh doanh.</text><rect x="60.0" y="532.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="565.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả tám nguyên nhân đều là câu hỏi về mức độ sẵn sàng của tổ chức, không phải câu hỏi chọn phần mềm nào.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-label="Năm dấu hiệu quy trình chưa sẵn sàng cho ERP: nằm trong đầu người, mỗi người một cách làm, họp yêu cầu kết thúc bằng tùy trường hợp, ngoại lệ nhiều hơn quy tắc và không rõ ai chịu trách nhiệm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="512" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm dấu hiệu quy trình chưa sẵn sàng cho ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi dấu hiệu cho thấy chưa có một phiên bản quy trình đủ rõ để cấu hình.</text><line x1="60.0" y1="428.0" x2="1140.0" y2="428.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="450.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Dấu hiệu theo phân tích trong bài viết, không phải thống kê.</text><text x="60.0" y="491.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình nằm trong</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">đầu người</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ có mô tả miệng, hoặc</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">file cũ không ai cập nhật.</text><rect x="279.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mỗi người một</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">cách làm</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình hình thành theo</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thói quen cá nhân; ERP</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">không chạy song song</text><text x="295.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều phiên bản.</text><rect x="498.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Họp yêu cầu kết</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">thúc bằng “tùy</text><text x="514.0" y="257.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">trường hợp”</text><text x="514.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Chưa có một phiên bản</text><text x="514.0" y="304.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quy trình được chấp nhận.</text><rect x="717.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ngoại lệ nhiều</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">hơn quy tắc</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không ai còn nhớ</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quy tắc gốc.</text><rect x="936.0" y="134.0" width="204.0" height="208.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không rõ ai chịu</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">trách nhiệm gì</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Câu trả lời phụ thuộc vào</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">người đang có mặt.</text><rect x="60.0" y="358.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="391.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu nhiều dấu hiệu này xuất hiện, vấn đề nằm ở quy trình trước khi nằm ở phần mềm.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Four groups of context: relationships and history, current organizational conditions, shifting priorities, precedents and accepted exceptions; each contextual factor needs an owner, a source and a validity period." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four groups of context, each needs an owner and expiry</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Context expires and has an owner; without both, it goes stale silently.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="190.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Relationships and history</text><text x="76.0" y="267.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Time working together, past</text><text x="76.0" y="286.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">incidents, strategic customers</text><rect x="335.0" y="134.0" width="255.0" height="190.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Current conditions</text><text x="351.0" y="267.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Department capacity, competing</text><text x="351.0" y="286.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">demands, recent policy changes</text><rect x="610.0" y="134.0" width="255.0" height="190.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Shifting priorities</text><text x="626.0" y="267.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Importance that changes by</text><text x="626.0" y="286.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">month or business situation</text><rect x="885.0" y="134.0" width="255.0" height="190.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="#2B74F5"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Precedents and</text><text x="901.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">exceptions</text><text x="901.0" y="267.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">How similar cases were handled,</text><text x="901.0" y="286.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and why</text><rect x="60.0" y="342.0" width="1080.0" height="116.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="374.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Each contextual factor needs</text><rect x="84.0" y="398.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="254.0" y="425.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">An owner</text><rect x="436.0" y="398.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="606.0" y="425.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">A source</text><rect x="788.0" y="398.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="958.0" y="425.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">A validity period</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Stale context is more dangerous than none.</text></svg>
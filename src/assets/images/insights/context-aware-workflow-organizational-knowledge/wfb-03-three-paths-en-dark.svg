<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Three paths: context as authoritative data rules can read, as evidence for the decision-maker, and as a signal for the rule owner to review; no path lets the system adjust rules by itself." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three ways context enters a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">No path lets the system adjust rules by itself.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="322.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="179.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Authoritative data</text><text x="84.0" y="215.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">What context does</text><text x="84.0" y="236.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Context is an input rules can read, with an</text><text x="84.0" y="256.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">owner and an expiry.</text><line x1="84.0" y1="304.0" x2="382.0" y2="304.0" stroke="#2B74F5" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="327.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Who decides</text><text x="84.0" y="349.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">A rule issued by an authorized person</text><text x="84.0" y="393.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Does the rule change?</text><text x="84.0" y="414.8" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">No: the rule already says how to use it</text><rect x="427.0" y="134.0" width="346.0" height="322.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="170.0" r="15" fill="#A78BFA"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="179.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Evidence</text><text x="451.0" y="215.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">What context does</text><text x="451.0" y="236.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Accompanies the exception case, each</text><text x="451.0" y="256.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">item with a source.</text><line x1="451.0" y1="304.0" x2="749.0" y2="304.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="327.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Who decides</text><text x="451.0" y="349.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">A person</text><text x="451.0" y="393.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Does the rule change?</text><text x="451.0" y="414.8" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">No</text><rect x="794.0" y="134.0" width="346.0" height="322.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="828.0" cy="170.0" r="15" fill="#A78BFA"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="856.0" y="179.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Review signal</text><text x="818.0" y="215.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">What context does</text><text x="818.0" y="236.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Shows a group of cases repeatedly handled</text><text x="818.0" y="256.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">as exceptions for the same factor.</text><line x1="818.0" y1="304.0" x2="1116.0" y2="304.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="327.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Who decides</text><text x="818.0" y="349.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">The rule owner</text><text x="818.0" y="393.6" font-size="11" font-weight="700" fill="#9AA6B8" text-anchor="start">Does the rule change?</text><text x="818.0" y="414.8" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Only if an authorized person issues it</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Flexibility comes from authorized people issuing context and rules, not from the system interpreting.</text></svg>
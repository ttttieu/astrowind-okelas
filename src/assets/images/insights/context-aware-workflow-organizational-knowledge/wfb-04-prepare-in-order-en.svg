<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Five preparation steps: choose a recurring decision where context changes handling, list the contextual factors the decision-maker uses, name owner, source and expiry, record decision and reason, and only then bring it into the system." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Prepare in order; the system comes last</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The hard part is usually not technology but naming owners and keeping information current.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="166.0" r="15" fill="var(--p)"/><text x="90.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Choose a decision</text><text x="76.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Recurring, and</text><text x="76.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">context changes how</text><text x="76.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">it is handled.</text><line x1="262.0" y1="166.0" x2="272.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="278.0,166.0 272.0,169.3 272.0,162.7" fill="var(--p)"/><rect x="280.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="310.0" cy="166.0" r="15" fill="var(--p)"/><text x="310.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">List the</text><text x="296.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">contextual factors</text><text x="296.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ask the decision-maker</text><text x="296.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">what they really use,</text><text x="296.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">then write it down.</text><line x1="482.0" y1="166.0" x2="492.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="498.0,166.0 492.0,169.3 492.0,162.7" fill="var(--p)"/><rect x="500.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Name owner,</text><text x="516.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">source, expiry</text><text x="516.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A factor without an</text><text x="516.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">owner is not used yet.</text><line x1="702.0" y1="166.0" x2="712.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="718.0,166.0 712.0,169.3 712.0,162.7" fill="var(--p)"/><rect x="720.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="750.0" cy="166.0" r="15" fill="var(--p)"/><text x="750.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Record decision</text><text x="736.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">and reason</text><text x="736.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">So context and</text><text x="736.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">precedent accumulate.</text><line x1="922.0" y1="166.0" x2="932.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="938.0,166.0 932.0,169.3 932.0,162.7" fill="var(--p)"/><rect x="940.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="970.0" cy="166.0" r="15" fill="var(--p)"/><text x="970.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bring it into</text><text x="956.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">the system</text><text x="956.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rules read what is</text><text x="956.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">confirmed; people see</text><text x="956.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the rest as evidence.</text><rect x="956.0" y="356.0" width="61.2" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="986.6" y="372.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Do last</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The smallest sufficient system to solve the operational problem.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Two purchase requests both over budget by 10% look identical to a rule and go to the same director; the context differs because one supplier has delivered on time for eight years and the other is new with two late lots, and that difference is not in the transaction data." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The same data, different meaning</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The difference is in the context, not in the transaction.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative scenario from the article, not measured data.</text><rect x="60.0" y="130.0" width="1080.0" height="64.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="80.0" y="152.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">What the rule sees</text><text x="80.0" y="177.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Two requests: over budget by 10% → go to the director</text><rect x="60.0" y="214.0" width="526.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="253.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Request A</text><rect x="84.0" y="276.0" width="478.0" height="56.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="100.0" y="293.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Transaction data</text><text x="100.0" y="317.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Purchase request, 10% over the limit</text><rect x="84.0" y="346.0" width="478.0" height="100.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="100.0" y="365.6" font-size="11" font-weight="700" fill="var(--a)" text-anchor="start">Context (not in the data)</text><text x="100.0" y="389.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Supplier of eight years, always on time; production demand</text><text x="100.0" y="410.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">is up this month.</text><rect x="614.0" y="214.0" width="526.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="638.0" y="253.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Request B</text><rect x="638.0" y="276.0" width="478.0" height="56.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="654.0" y="293.6" font-size="11" font-weight="700" fill="var(--mut)" text-anchor="start">Transaction data</text><text x="654.0" y="317.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Purchase request, 10% over the limit</text><rect x="638.0" y="346.0" width="478.0" height="100.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="654.0" y="365.6" font-size="11" font-weight="700" fill="var(--a)" text-anchor="start">Context (not in the data)</text><text x="654.0" y="389.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">New supplier; the last two lots arrived late.</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The director approves one quickly and probes the other: the context lives in their head.</text></svg>
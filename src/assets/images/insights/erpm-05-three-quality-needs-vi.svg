<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img" aria-label="Ba yêu cầu quản lý chất lượng trong ERP sản xuất: kiểm tra tại các điểm kiểm tra, ghi nhận sự cố và hành động khắc phục, và quản lý hạn sử dụng theo FEFO." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="486" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba yêu cầu quản lý chất lượng trong ERP sản xuất</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP cần hỗ trợ kiểm tra, xử lý sự cố và quản lý hạn sử dụng.</text><line x1="60.0" y1="402.0" x2="1140.0" y2="402.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="424.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="465.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm tra chất lượng tại các điểm</text><text x="76.0" y="239.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">kiểm tra</text><text x="76.0" y="270.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nguyên liệu nhập, bán thành phẩm giữa công</text><text x="76.0" y="290.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đoạn, thành phẩm trước xuất kho.</text><rect x="425.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="166.0" r="15" fill="var(--p)"/><text x="457.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="441.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sự cố và hành động khắc phục</text><text x="441.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi nhận sự cố, phân tích nguyên nhân,</text><text x="441.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">theo dõi hành động khắc phục; liên quan</text><text x="441.0" y="285.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đến ISO 9001.</text><rect x="790.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="166.0" r="15" fill="var(--p)"/><text x="822.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="806.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Hạn sử dụng và FEFO</text><text x="806.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Với thực phẩm và dược phẩm, xuất hàng hết</text><text x="806.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hạn trước thay vì FIFO thông thường.</text><rect x="60.0" y="331.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="364.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP cần ghi nhận kết quả kiểm tra, quyết định đạt hoặc không đạt và xử lý hàng lỗi.</text></svg>
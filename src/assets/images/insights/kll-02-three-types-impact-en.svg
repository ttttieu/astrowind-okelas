<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Three types of knowledge lost when a key employee leaves: operational knowledge hits quality and speed at once, contextual knowledge leads the organization to repeat past mistakes, relational knowledge slows problem solving." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three types of knowledge that leave with a key employee</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each type of loss creates problems in a different way.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Classification of three knowledge types as set out in the article; a discussion aid, not a certified methodology.</text><text x="60.0" y="599.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="82.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Operational knowledge</text><text x="82.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">How to do the work</text><text x="82.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="82.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">How to do the daily work, including handling</text><text x="82.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">non-standard situations.</text><line x1="82.0" y1="310.0" x2="386.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">When it’s lost</text><text x="82.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Immediately hits quality and speed. The</text><text x="82.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">replacement needs a long time to rebuild it.</text><rect x="426.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="448.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Contextual knowledge</text><text x="448.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Why we do it this way</text><text x="448.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="448.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Why the organization works the way it</text><text x="448.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">does: history, past decisions, what was</text><text x="448.0" y="292.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tried and failed.</text><line x1="448.0" y1="310.0" x2="752.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">When it’s lost</text><text x="448.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">No immediate impact. The organization</text><text x="448.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">repeats past mistakes or spends time</text><text x="448.0" y="402.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">rediscovering what was known.</text><rect x="792.0" y="134.0" width="348.0" height="316.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="814.0" y="174.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Relational knowledge</text><text x="814.0" y="195.9" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Who is who</text><text x="814.0" y="229.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="814.0" y="253.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">About people: who is who, how to approach</text><text x="814.0" y="272.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">them, what they can help with.</text><line x1="814.0" y1="310.0" x2="1118.0" y2="310.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="339.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">When it’s lost</text><text x="814.0" y="363.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Problems get solved more slowly, because</text><text x="814.0" y="382.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the replacement must rebuild relationships</text><text x="814.0" y="402.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">from nothing.</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Some losses show up at once. Others only when old mistakes repeat.</text></svg>
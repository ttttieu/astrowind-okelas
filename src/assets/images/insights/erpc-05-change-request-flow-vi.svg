<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 532" width="1200" height="532" role="img" aria-label="Quy trình xử lý yêu cầu thay đổi: mô tả yêu cầu, đánh giá tác động về thời gian, chi phí và kỹ thuật, rồi người có thẩm quyền quyết định đưa vào giai đoạn 1, để sang giai đoạn 2 hoặc từ chối." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="532" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình xử lý yêu cầu thay đổi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi yêu cầu sau kick-off đi cùng một đường: mô tả, đánh giá tác động, quyết định.</text><line x1="60.0" y1="448.0" x2="1140.0" y2="448.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="470.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="511.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="156.0" width="250.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="185.0" y="238.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Mô tả yêu cầu</text><line x1="316.0" y1="231.0" x2="354.0" y2="231.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="364.0,231.0 354.0,236.5 354.0,225.5" fill="var(--gm)"/><rect x="370.0" y="156.0" width="330.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="535.0" y="193.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Đánh giá tác động</text><text x="535.0" y="261.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="middle">Thời gian · chi phí · kỹ thuật</text><rect x="800.0" y="134.0" width="214.2" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="907.1" y="150.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Người có thẩm quyền quyết định</text><line x1="706.0" y1="231.0" x2="785.5" y2="203.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="794.0,200.0 787.2,207.7 783.9,198.3" fill="var(--gm)"/><rect x="800.0" y="174.0" width="340.0" height="52.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="970.0" y="206.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Đưa vào giai đoạn 1</text><line x1="706.0" y1="231.0" x2="785.6" y2="262.7" stroke="var(--gm)" stroke-width="2.5"/><polygon points="794.0,266.0 783.8,267.3 787.5,258.1" fill="var(--gm)"/><rect x="800.0" y="240.0" width="340.0" height="52.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="970.0" y="272.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Để sang giai đoạn 2</text><line x1="706.0" y1="231.0" x2="788.1" y2="325.2" stroke="var(--gm)" stroke-width="2.5"/><polygon points="794.0,332.0 784.4,328.5 791.8,322.0" fill="var(--gm)"/><rect x="800.0" y="306.0" width="340.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="970.0" y="338.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Từ chối</text><rect x="60.0" y="378.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="411.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Kiểm soát scope không phải từ chối mọi thay đổi: là quyết định có ý thức.</text></svg>
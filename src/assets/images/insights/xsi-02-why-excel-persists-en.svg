<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="A table of three cases: production plan, urgent orders and quality inspection, each showing what the official system does not meet and what Excel allows." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="628" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Why Excel persists: it solves a real problem</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Every important Excel file represents a need the official system isn’t meeting well.</text><line x1="60.0" y1="544.0" x2="1140.0" y2="544.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="566.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Composite illustrative scenarios from the article, not measured data or a specific organization.</text><text x="60.0" y="607.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="434.1" y="134.0" width="117.8" height="28.0" rx="14.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="493.0" y="152.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Official system</text><rect x="900.5" y="134.0" width="54.9" height="28.0" rx="14.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="928.0" y="152.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Excel</text><rect x="60.0" y="134.0" width="54.4" height="28.0" rx="14.0" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.2"/><text x="87.2" y="152.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Need</text><rect x="60.0" y="178.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="225.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Production plan</text><rect x="290.0" y="178.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="215.9" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Rigid data entry that doesn’t reflect how plans change</text><text x="495.0" y="234.3" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">during the day</text><rect x="720.0" y="178.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="225.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Fast edits, inline notes, colour coding for priority</text><line x1="704.0" y1="220.0" x2="708.0" y2="220.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,220.0 708.0,224.4 708.0,215.6" fill="var(--mut)"/><rect x="60.0" y="274.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="321.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Urgent orders</text><rect x="290.0" y="274.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="321.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">No way to flag “urgent” by the manager’s own logic</text><rect x="720.0" y="274.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="321.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizes information by exactly that logic</text><line x1="704.0" y1="316.0" x2="708.0" y2="316.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,316.0 708.0,320.4 708.0,311.6" fill="var(--mut)"/><rect x="60.0" y="370.0" width="210.0" height="84.0" rx="10" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="165.0" y="417.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Quality inspection</text><rect x="290.0" y="370.0" width="410.0" height="84.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="495.0" y="417.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Standard form doesn’t capture product-specific steps</text><rect x="720.0" y="370.0" width="420.0" height="84.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="930.0" y="417.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Add the steps each product needs</text><line x1="704.0" y1="412.0" x2="708.0" y2="412.0" stroke="var(--mut)" stroke-width="2"/><polygon points="716.0,412.0 708.0,416.4 708.0,407.6" fill="var(--mut)"/><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Excel isn’t there because of laziness. It does what the official system doesn’t do well enough.</text></svg>
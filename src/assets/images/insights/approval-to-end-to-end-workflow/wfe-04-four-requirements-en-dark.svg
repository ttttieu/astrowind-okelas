<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 692" width="1200" height="692" role="img" aria-label="Four requirements of an end-to-end workflow: a clear triggering event, a clear final outcome, cross-department traceability and a single process owner." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="692" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four requirements of a genuine end-to-end workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The article’s observation: operational failures tend to sit at departmental handoffs more than inside departments.</text><line x1="60.0" y1="630.0" x2="1140.0" y2="630.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="652.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="132.0" width="530.0" height="176.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="96.0" cy="166.0" r="16" fill="#2B74F5"/><text x="96.0" y="171.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="173.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">A clear triggering event</text><text x="84.0" y="216.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">For example: a complaint is logged, an order is created, a contract</text><text x="84.0" y="237.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">is signed.</text><text x="84.0" y="282.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Not: someone clicking to start an approval</text><rect x="610.0" y="132.0" width="530.0" height="176.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="646.0" cy="166.0" r="16" fill="#2B74F5"/><text x="646.0" y="171.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="674.0" y="173.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">A clear final outcome</text><text x="634.0" y="216.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Defined from the recipient’s view: the customer or the</text><text x="634.0" y="237.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">requesting department.</text><text x="634.0" y="282.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Not: when the request is approved</text><rect x="60.0" y="326.0" width="530.0" height="176.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="96.0" cy="360.0" r="16" fill="#2B74F5"/><text x="96.0" y="365.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="124.0" y="367.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Cross-department traceability</text><text x="84.0" y="410.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Evidence is kept at every handoff between departments.</text><text x="84.0" y="476.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Not only: at sign-off points</text><rect x="610.0" y="326.0" width="530.0" height="176.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><circle cx="646.0" cy="360.0" r="16" fill="#A78BFA"/><text x="646.0" y="365.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="674.0" y="367.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">A single process owner</text><rect x="921.7" y="346.0" width="198.3" height="26.0" rx="13.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="1020.8" y="363.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Biggest organizational barrier</text><text x="634.0" y="410.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">One role accountable for the whole flow, not just each</text><text x="634.0" y="431.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">department’s segment.</text><text x="634.0" y="476.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">Not: accountability split by department</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The hardest part is assigning accountability for outcomes beyond any one department’s full control.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="Approval workflow only answers whether a request was approved; it does not answer where the matter ends or who is responsible until it is resolved." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="598" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Approval answers “is it approved”, not “is it finished”</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Approval solves one specific problem: controlling decision authority at one or a few points in a process.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="140.0" width="530.0" height="318.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="84.0" y="183.2" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">Approval workflow</text><rect x="84.0" y="206.0" width="482.0" height="64.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="325.0" y="244.6" font-size="18" font-weight="700" fill="#5FA0FF" text-anchor="middle">Was the request approved?</text><circle cx="94.0" cy="312.0" r="5" fill="#2B74F5"/><text x="108.0" y="319.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">There is a request: leave, purchase, payment</text><circle cx="94.0" cy="362.0" r="5" fill="#2B74F5"/><text x="108.0" y="369.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Sign-offs in order or by seniority</text><circle cx="94.0" cy="412.0" r="5" fill="#2B74F5"/><text x="108.0" y="409.6" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Ends once enough signatures are collected, whatever</text><text x="108.0" y="429.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">happens next</text><rect x="610.0" y="140.0" width="530.0" height="318.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="634.0" y="183.2" font-size="22" font-weight="700" fill="#F7F8F8" text-anchor="start">What approval does not answer</text><rect x="634.0" y="206.0" width="482.0" height="124.0" rx="12" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="875.0" y="262.4" font-size="19" font-weight="700" fill="#A78BFA" text-anchor="middle">Where does this matter end, and who is</text><text x="875.0" y="287.5" font-size="19" font-weight="700" fill="#A78BFA" text-anchor="middle">responsible until it is resolved?</text><text x="634.0" y="374.9" font-size="16" font-weight="400" fill="#E5ECF6" text-anchor="start">This question needs a wider scope than the sign-off point.</text><rect x="60.0" y="476.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="509.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Approval workflow is not wrong; it just answers a very narrow question.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Five steps to expand from approval to end-to-end: select the process, redefine boundaries, map handoffs, assign a process owner, then choose technology." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="584" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Five steps to expand, with technology coming last</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Do not convert every approval workflow at once; select a process, then expand step by step.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">The roadmap is OKELAS’s suggestion: a discussion aid, not a certified methodology.</text><rect x="60.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="76.0" y="156.0" width="55.7" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="103.9" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Step 1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Select the</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">right process</text><text x="76.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Prioritize highly</text><text x="76.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">recurring,</text><text x="76.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">multi-department</text><text x="76.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">processes affecting</text><text x="76.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">customers or</text><text x="76.0" y="368.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">compliance: quality</text><text x="76.0" y="388.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">complaints, change</text><text x="76.0" y="408.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">control, incident</text><text x="76.0" y="427.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">management.</text><line x1="263.0" y1="168.0" x2="270.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="277.0,168.0 270.0,171.8 270.0,164.2" fill="#2B74F5"/><rect x="280.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="296.0" y="156.0" width="58.2" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="325.1" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Step 2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Redefine</text><text x="296.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">boundaries</text><text x="296.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">What event triggers</text><text x="296.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">the process, and</text><text x="296.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">what marks true</text><text x="296.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">completion from the</text><text x="296.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">recipient’s view.</text><line x1="483.0" y1="168.0" x2="490.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="497.0,168.0 490.0,171.8 490.0,164.2" fill="#2B74F5"/><rect x="500.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="516.0" y="156.0" width="58.4" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="545.2" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Step 3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Map handoffs</text><text x="516.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Every transfer</text><text x="516.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">between departments</text><text x="516.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">has an owner and</text><text x="516.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">recorded evidence,</text><text x="516.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">not verbal exchange</text><text x="516.0" y="368.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">or buried email.</text><line x1="703.0" y1="168.0" x2="710.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="717.0,168.0 710.0,171.8 710.0,164.2" fill="#2B74F5"/><rect x="720.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><rect x="736.0" y="156.0" width="58.8" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="765.4" y="172.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Step 4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Assign a</text><text x="736.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">process owner</text><text x="736.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">One role, not</text><text x="736.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">necessarily a new</text><text x="736.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">position, tracks the</text><text x="736.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">whole flow with</text><text x="736.0" y="349.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">authority to request</text><text x="736.0" y="368.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">information from</text><text x="736.0" y="388.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">every department.</text><line x1="923.0" y1="168.0" x2="930.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="937.0,168.0 930.0,171.8 930.0,164.2" fill="#2B74F5"/><rect x="940.0" y="140.0" width="200.0" height="304.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="956.0" y="156.0" width="58.3" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="985.2" y="172.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Step 5</text><rect x="1078.5" y="156.0" width="45.5" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="1101.3" y="172.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Last</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Choose technology</text><text x="956.0" y="270.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Only meaningful once</text><text x="956.0" y="290.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">boundaries, handoffs</text><text x="956.0" y="310.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and accountability are</text><text x="956.0" y="329.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">clear.</text><rect x="60.0" y="462.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="495.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Boundaries, handoffs and accountability come first; tool choice comes after.</text></svg>
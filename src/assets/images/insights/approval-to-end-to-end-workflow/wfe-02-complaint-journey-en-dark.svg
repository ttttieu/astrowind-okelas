<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="In a quality-complaint journey across sales, QA and production, the corrective-action approval is a single point among many steps and handoffs." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="604" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Approval is one moment in a complaint’s journey</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">A quality-complaint example: the approval step is one moment inside a much larger event.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the quality-complaint example and department lanes are hypothetical, not measured data.</text><rect x="60.0" y="132.0" width="1080.0" height="78.0" rx="12" fill="#14161A" stroke="#2A2F38" stroke-width="1"/><rect x="60.0" y="132.0" width="140.0" height="78.0" rx="12" fill="#08090A" stroke="#2A2F38" stroke-width="1"/><text x="130.0" y="176.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Sales</text><rect x="60.0" y="216.0" width="1080.0" height="78.0" rx="12" fill="#14161A" stroke="#2A2F38" stroke-width="1"/><rect x="60.0" y="216.0" width="140.0" height="78.0" rx="12" fill="#08090A" stroke="#2A2F38" stroke-width="1"/><text x="130.0" y="260.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">QA</text><rect x="60.0" y="300.0" width="1080.0" height="78.0" rx="12" fill="#14161A" stroke="#2A2F38" stroke-width="1"/><rect x="60.0" y="300.0" width="140.0" height="78.0" rx="12" fill="#08090A" stroke="#2A2F38" stroke-width="1"/><text x="130.0" y="344.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">Production</text><rect x="1002.6" y="104.0" width="
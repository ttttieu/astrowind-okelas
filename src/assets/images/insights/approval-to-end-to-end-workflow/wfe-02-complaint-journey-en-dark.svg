255.0" stroke="#5B6575" stroke-width="2"/><line x1="1005.0" y1="255.0" x2="1009.0" y2="255.0" stroke="#5B6575" stroke-width="2"/><polygon points="1016.0,255.0 1009.0,258.9 1009.0,251.2" fill="#5B6575"/><circle cx="1005.0" cy="213.0" r="6" fill="#A78BFA"/><rect x="214.0" y="140.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="268.0" y="167.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Complaint</text><text x="268.0" y="184.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">received</text><rect x="348.0" y="224.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="402.0" y="251.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Classify,</text><text x="402.0" y="268.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">investigate</text><rect x="482.0" y="224.0" width="108.0" height="62.0" rx="12" fill="#A78BFA"/><text x="536.0" y="242.6" font-size="13" font-weight="700" fill="#08090A" text-anchor="middle">Approve</text><text x="536.0" y="259.7" font-size="13" font-weight="700" fill="#08090A" text-anchor="middle">corrective</text><text x="536.0" y="276.9" font-size="13" font-weight="700" fill="#08090A" text-anchor="middle">action</text><rect x="616.0" y="308.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="670.0" y="335.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Implement</text><text x="670.0" y="352.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">the fix</text><rect x="750.0" y="224.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="804.0" y="251.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Verify the</text><text x="804.0" y="268.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">outcome</text><rect x="884.0" y="140.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="938.0" y="167.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Respond to</text><text x="938.0" y="184.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">customer</text><rect x="1018.0" y="224.0" width="108.0" height="62.0" rx="12" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="1072.0" y="251.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Audit record,</text><text x="1072.0" y="268.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">SOP update</text><line x1="214.0" y1="392.0" x2="456.0" y2="392.0" stroke="#9AA6B8" stroke-width="2.5"/><text x="335.0" y="413.1" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="middle">Before approval</text><line x1="482.0" y1="392.0" x2="590.0" y2="392.0" stroke="#A78BFA" stroke-width="2.5"/><text x="536.0" y="413.1" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">Approval</text><line x1="616.0" y1="392.0" x2="992.0" y2="392.0" stroke="#9AA6B8" stroke-width="2.5"/><text x="804.0" y="413.1" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="middle">After approval</text><line x1="1018.0" y1="392.0" x2="1126.0" y2="392.0" stroke="#9AA6B8" stroke-width="2.5"/><text x="1072.0" y="413.1" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="middle">Loop closure</text><circle cx="76.0" cy="445.0" r="6" fill="#A78BFA"/><text x="92.0" y="448.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Handoff between departments</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Approval is one point; the rest of the journey still needs someone accountable.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="In a quality-complaint journey across sales, QA and production, the corrective-action approval is a single point among many steps and handoffs." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Approval is one moment in a complaint’s journey</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A quality-complaint example: the approval step is one moment inside a much larger event.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the quality-complaint example and department lanes are hypothetical, not measured data.</text><rect x="60.0" y="132.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="132.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="176.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sales</text><rect x="60.0" y="216.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="216.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="260.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">QA</text><rect x="60.0" y="300.0" width="1080.0" height="78.0" rx="12" fill="var(--gt)" stroke="var(--line)" stroke-width="1"/><rect x="60.0" y="300.0" width="140.0" height="78.0" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/><text x="130.0" y="344.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Production</text><rect x="1002.6" y="104.0" width="137.4" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1071.3" y="119.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Illustrative example</text><line x1="324.0" y1="171.0" x2="335.0" y2="171.0" stroke="var(--gm)" stroke-width="2"/><line x1="335.0" y1="171.0" x2="335.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="335.0" y1="255.0" x2="339.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="346.0,255.0 339.0,258.9 339.0,251.2" fill="var(--gm)"/><circle cx="335.0" cy="213.0" r="6" fill="var(--a)"/><line x1="458.0" y1="255.0" x2="473.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="480.0,255.0 473.0,258.9 473.0,251.2" fill="var(--gm)"/><line x1="592.0" y1="255.0" x2="603.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="603.0" y1="255.0" x2="603.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><line x1="603.0" y1="339.0" x2="607.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><polygon points="614.0,339.0 607.0,342.9 607.0,335.1" fill="var(--gm)"/><circle cx="603.0" cy="297.0" r="6" fill="var(--a)"/><line x1="726.0" y1="339.0" x2="737.0" y2="339.0" stroke="var(--gm)" stroke-width="2"/><line x1="737.0" y1="339.0" x2="737.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="737.0" y1="255.0" x2="741.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="748.0,255.0 741.0,258.9 741.0,251.2" fill="var(--gm)"/><circle cx="737.0" cy="297.0" r="6" fill="var(--a)"/><line x1="860.0" y1="255.0" x2="871.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="871.0" y1="255.0" x2="871.0" y2="171.0" stroke="var(--gm)" stroke-width="2"/><line x1="871.0" y1="171.0" x2="875.0" y2="171.0" stroke="var(--gm)" stroke-width="2"/><polygon points="882.0,171.0 875.0,174.8 875.0,167.2" fill="var(--gm)"/><circle cx="871.0" cy="213.0" r="6" fill="var(--a)"/><line x1="994.0" y1="171.0" x2="1005.0" y2="171.0" stroke="var(--gm)" stroke-width="2"/><line x1="1005.0" y1="171.0" x2="1005.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><line x1="1005.0" y1="255.0" x2="1009.0" y2="255.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1016.0,255.0 1009.0,258.9 1009.0,251.2" fill="var(--gm)"/><circle cx="1005.0" cy="213.0" r="6" fill="var(--a)"/><rect x="214.0" y="140.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="268.0" y="167.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Complaint</text><text x="268.0" y="184.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">received</text><rect x="348.0" y="224.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="402.0" y="251.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Classify,</text><text x="402.0" y="268.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">investigate</text><rect x="482.0" y="224.0" width="108.0" height="62.0" rx="12" fill="var(--a)"/><text x="536.0" y="242.6" font-size="13" font-weight="700" fill="var(--bg)" text-anchor="middle">Approve</text><text x="536.0" y="259.7" font-size="13" font-weight="700" fill="var(--bg)" text-anchor="middle">corrective</text><text x="536.0" y="276.9" font-size="13" font-weight="700" fill="var(--bg)" text-anchor="middle">action</text><rect x="616.0" y="308.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="670.0" y="335.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Implement</text><text x="670.0" y="352.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">the fix</text><rect x="750.0" y="224.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="804.0" y="251.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Verify the</text><text x="804.0" y="268.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">outcome</text><rect x="884.0" y="140.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="938.0" y="167.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Respond to</text><text x="938.0" y="184.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">customer</text><rect x="1018.0" y="224.0" width="108.0" height="62.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="1072.0" y="251.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Audit record,</text><text x="1072.0" y="268.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">SOP update</text><line x1="214.0" y1="392.0" x2="456.0" y2="392.0" stroke="var(--mut)" stroke-width="2.5"/><text x="335.0" y="413.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Before approval</text><line x1="482.0" y1="392.0" x2="590.0" y2="392.0" stroke="var(--a)" stroke-width="2.5"/><text x="536.0" y="413.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Approval</text><line x1="616.0" y1="392.0" x2="992.0" y2="392.0" stroke="var(--mut)" stroke-width="2.5"/><text x="804.0" y="413.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">After approval</text><line x1="1018.0" y1="392.0" x2="1126.0" y2="392.0" stroke="var(--mut)" stroke-width="2.5"/><text x="1072.0" y="413.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Loop closure</text><circle cx="76.0" cy="445.0" r="6" fill="var(--a)"/><text x="92.0" y="448.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Handoff between departments</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Approval is one point; the rest of the journey still needs someone accountable.</text></svg>
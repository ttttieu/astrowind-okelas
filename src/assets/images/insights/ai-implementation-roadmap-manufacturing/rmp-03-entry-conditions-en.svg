<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Three conditions with check boxes: structured data from a critical system, a sufficiently defined process, clear agent governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three conditions before an agent enters a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">An agent enters only when all three conditions are met.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conditions from the article; each organization should check them against its own situation.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="1080.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="87.0" y="201.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="214.0" x2="99.0" y2="219.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="219.0" x2="107.0" y2="208.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="220.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Data from at least one critical system (ERP, QMS) is structured enough to query and analyze.</text><rect x="60.0" y="266.0" width="1080.0" height="76.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><rect x="87.0" y="291.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="304.0" x2="99.0" y2="309.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="309.0" x2="107.0" y2="298.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="310.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">At least one process is defined in enough detail for an agent to take part in a specific step.</text><rect x="60.0" y="356.0" width="1080.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="87.0" y="381.0" width="26.0" height="26.0" rx="6" fill="var(--wh)" stroke="var(--p)" stroke-width="2"/><line x1="94.0" y1="394.0" x2="99.0" y2="399.0" stroke="var(--p)" stroke-width="2.6"/><line x1="99.0" y1="399.0" x2="107.0" y2="388.0" stroke="var(--p)" stroke-width="2.6"/><text x="140.0" y="400.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Agent governance is clear: what it may do, who reviews, and how the audit trail works.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These are conditions for entering stage 3, not a checklist to run in parallel.</text></svg>
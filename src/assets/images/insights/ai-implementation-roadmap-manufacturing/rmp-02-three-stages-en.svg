<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Three stage columns: foundation, supported AI, AI within workflow; stage three is drawn dashed because it is used only when needed." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three stages: foundation, supported AI, then workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not every organization needs stage three; the goal is the stage with the most value for that organization.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three stages are a practical framework from the article; timelines are reference only, not guarantees.</text><text x="60.0" y="585.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Stage 1 · Foundation</text><text x="84.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Objective: build the base that lets AI</text><text x="84.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">work meaningfully.</text><text x="84.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: personal productivity tools, with no</text><text x="84.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">role in decisions.</text><text x="84.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Reference timeline: 3–6 months.</text><line x1="404.0" y1="292.0" x2="418.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="426.0,292.0 418.0,296.4 418.0,287.6" fill="var(--p)"/><rect x="430.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="454.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Stage 2 · Supported AI</text><text x="454.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Objective: apply AI to lower-risk uses</text><text x="454.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">with measurable outcomes.</text><text x="454.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: an internal chatbot on SOPs; no</text><text x="454.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">agents in processes.</text><text x="454.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Timeline: 3–6 months of real operation.</text><line x1="774.0" y1="292.0" x2="788.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,292.0 788.0,296.4 788.0,287.6" fill="var(--p)"/><rect x="800.0" y="176.0" width="340.0" height="232.0" rx="16" fill="var(--gt)" stroke="var(--p)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="824.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Stage 3 · AI within workflow</text><text x="824.0" y="252.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Objective: integrate AI into high-value</text><text x="824.0" y="273.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">steps where conditions are met.</text><text x="824.0" y="304.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">AI: an agent in one defined workflow,</text><text x="824.0" y="326.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">with human review and audit trail.</text><text x="824.0" y="357.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Only when stage 2 reveals a specific</text><text x="824.0" y="378.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">value gap.</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A later stage makes sense only once the earlier stage has met its exit criteria.</text></svg>
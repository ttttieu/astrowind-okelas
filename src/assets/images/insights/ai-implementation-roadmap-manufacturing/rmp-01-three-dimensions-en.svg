<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-label="Three assessment cards: process, data, knowledge and context, each with a question." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="544" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Assess three dimensions before choosing a tool</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The real starting point is where the organization stands and which next step has the clearest economic case.</text><line x1="60.0" y1="460.0" x2="1140.0" y2="460.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="482.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three dimensions are a practical assessment frame from the article, not a measured index.</text><text x="60.0" y="523.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="90.0" cy="206.0" r="15" fill="var(--gm)"/><text x="90.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Process</text><text x="84.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">How many important processes are</text><text x="84.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">documented in writing? AI cannot</text><text x="84.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">execute a process that has not</text><text x="84.0" y="314.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">been defined.</text><rect x="426.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="456.0" cy="206.0" r="15" fill="var(--p)"/><text x="456.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="486.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Data</text><text x="450.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Are QC, batch and production</text><text x="450.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">records stored in a queryable</text><text x="450.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">structure, or scattered across</text><text x="450.0" y="314.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">spreadsheets and paper?</text><rect x="792.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="822.0" cy="206.0" r="15" fill="var(--gm)"/><text x="822.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="852.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge and context</text><text x="816.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Who holds critical operational</text><text x="816.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">knowledge? If two or three of those</text><text x="816.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">people left, could operations continue?</text><rect x="60.0" y="389.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="422.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These three dimensions frame the question before a tool is chosen; they are not a self-scoring exercise.</text></svg>
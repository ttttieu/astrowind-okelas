<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Trên trục thời gian, workflow request-based chờ một khoảng trễ phát hiện trước khi bắt đầu, còn event-driven workflow bắt đầu gần như ngay khi sự việc xảy ra." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Event-Driven Workflow: khi workflow tự nhận biết</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">sự kiện để bắt đầu công việc</text><text x="60.0" y="297.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">Request-based</text><line x1="100.0" y1="340.0" x2="1140.0" y2="340.0" stroke="var(--line)" stroke-width="3"/><line x1="100.0" y1="340.0" x2="860.0" y2="340.0" stroke="var(--a)" stroke-width="4" stroke-dasharray="8 6"/><circle cx="100.0" cy="340.0" r="11" fill="var(--hd)"/><circle cx="860.0" cy="340.0" r="11" fill="var(--gm)"/><rect x="480.0" y="300.0" width="130.6" height="26.0" rx="13.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="545.3" y="317.7" font-size="13" font-weight="700" fill="var(--a
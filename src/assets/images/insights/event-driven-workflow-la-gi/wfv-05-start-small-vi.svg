<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Nên bắt đầu với một đến hai loại sự kiện có tần suất vừa, tác động rõ và dữ liệu sẵn có, thay vì phủ toàn tổ chức cùng lúc." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bắt đầu nhỏ: một đến hai loại sự kiện</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chọn ít loại sự kiện, nhưng chọn đúng.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="560.0" height="56.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="340.0" y="167.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow được thiết kế tốt, ít phụ thuộc vào vài cá nhân</text><line x1="626.0" y1="162.0" x2="689.0" y2="162.0" stroke="var(--a)" stroke-width="3"/><polygon points="700.0,162.0 689.0,168.1 689.0,155.9" fill="var(--a)"/><rect x="706.0" y="134.0" width="434.0" height="56.0" rx="12" fill="var(--a)"/><text x="923.0" y="167.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">Event-driven workflow</text><rect x="60.0" y="212.0" width="440.0" height="270.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="230.0" width="98.5" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.2"/><text x="133.2" y="247.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Không nên</text><text x="84.0" y="299.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Phủ toàn tổ chức cùng lúc</text><text x="84.0" y="368.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Dễ tạo nhiễu và mất niềm tin khi định nghĩa sự kiện và</text><text x="84.0" y="390.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dữ liệu chưa sẵn sàng.</text><line x1="508.0" y1="347.0" x2="545.0" y2="347.0" stroke="var(--p)" stroke-width="3"/><polygon points="556.0,347.0 545.0,353.1 545.0,340.9" fill="var(--p)"/><rect x="566.0" y="212.0" width="574.0" height="270.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="590.0" y="230.0" width="54.4" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="617.2" y="247.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Nên</text><text x="590.0" y="299.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Bắt đầu với một đến hai loại sự kiện</text><rect x="590.0" y="332.0" width="360.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="770.0" y="357.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tần suất vừa phải</text><rect x="590.0" y="382.0" width="360.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="770.0" y="407.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tác động rõ ràng</text><rect x="590.0" y="432.0" width="360.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="770.0" y="457.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đã có sẵn dữ liệu</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bắt đầu từ một đến hai loại sự kiện, thay vì phủ toàn tổ chức cùng lúc.</text></svg>
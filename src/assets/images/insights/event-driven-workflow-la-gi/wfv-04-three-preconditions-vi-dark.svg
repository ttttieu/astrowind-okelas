<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba điều kiện trước khi triển khai: sự kiện định nghĩa rõ, dữ liệu đủ tin cậy và cách xử lý cảnh báo sai; event-driven workflow là điểm đến chứ không phải điểm bắt đầu." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba điều kiện trước khi triển khai event-driven</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Event-driven workflow là điểm đến, không phải điểm bắt đầu.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Sự kiện được định nghĩa</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">rõ và nhất quán</text><text x="76.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Chưa thống nhất thế nào là chỉ</text><text x="76.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">tiêu bất thường hay mức tồn kho</text><text x="76.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">an toàn thì chỉ tạo báo động giả</text><text x="76.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hoặc bỏ sót.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="#2B74F5"/><rect x="335.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Dữ liệu đủ tin cậy để</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">phát hiện</text><text x="351.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Dữ liệu cần đầy đủ, đúng lúc,</text><text x="351.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">đủ chính xác; không xây được</text><text x="351.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">trên quy trình ghi nhận rời rạc</text><text x="351.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hoặc chậm.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="#2B74F5"/><rect x="610.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Có cách xử lý</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">cảnh báo sai</text><text x="626.0" y="289.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Cần cách xác nhận hoặc bỏ qua</text><text x="626.0" y="308.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">nhanh; nếu không, người dùng</text><text x="626.0" y="328.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">dần bỏ qua mọi cảnh báo, kể cả</text><text x="626.0" y="348.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">cảnh báo đúng.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="#2B74F5"/><rect x="885.0" y="134.0" width="255.0" height="262.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="901.0" y="150.0" width="76.4" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="939.2" y="166.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Điểm đến</text><text x="901.0" y="207.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Event-driven workflow</text><text x="901.0" y="261.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Hợp lý sau khi workflow đã được</text><text x="901.0" y="280.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">thiết kế tốt và ít phụ thuộc vào</text><text x="901.0" y="300.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">vài cá nhân.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Thiếu các điều kiện này, phát hiện sự kiện chỉ tạo báo động giả hoặc bỏ sót, làm mất niềm tin vào hệ thống.</text></svg>
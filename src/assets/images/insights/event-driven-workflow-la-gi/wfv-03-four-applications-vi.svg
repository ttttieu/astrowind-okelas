<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Bốn ví dụ trong sản xuất: tồn kho dưới ngưỡng, đo lường vượt vùng kiểm soát, chứng chỉ hoặc hợp đồng sắp hết hạn, khiếu nại tăng; hệ thống tự phát hiện và khởi động." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn ứng dụng: hệ thống phát hiện và khởi động</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hệ thống đảm nhận phần phát hiện và khởi động, nơi con người thường chậm.</text><line x1="60.0" y1="618.0" x2="1140.0" y2="618.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="640.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><text x="60.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Sự kiện</text><text x="540.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Hệ thống tự làm</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><rect x="60.0" y="152.0" width="400.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="78.0" y="191.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tồn kho nguyên liệu xuống dưới ngưỡng</text><text x="78.0" y="212.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">an toàn</text><line x1="468.0" y1="196.0" x2="519.0" y2="196.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,196.0 519.0,202.1 519.0,189.9" fill="var(--p)"/><rect x="540.0" y="152.0" width="600.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="560.0" y="201.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tự lập nháp đề nghị mua, kèm lịch sử tiêu thụ và nhà cung cấp ưu tiên</text><rect x="60.0" y="252.0" width="400.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="78.0" y="301.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đo lường trong quy trình vượt vùng kiểm soát</text><line x1="468.0" y1="296.0" x2="519.0" y2="296.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,296.0 519.0,302.1 519.0,289.9" fill="var(--p)"/><rect x="540.0" y="252.0" width="600.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="560.0" y="291.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tự mở phiếu kiểm tra chất lượng và báo người phụ trách, không chờ đợt kiểm</text><text x="560.0" y="311.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tra định kỳ</text><rect x="60.0" y="352.0" width="400.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="78.0" y="401.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chứng chỉ hoặc hợp đồng sắp hết hạn</text><line x1="468.0" y1="396.0" x2="519.0" y2="396.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,396.0 519.0,402.1 519.0,389.9" fill="var(--p)"/><rect x="540.0" y="352.0" width="600.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="560.0" y="391.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tự khởi động quy trình gia hạn hoặc đánh giá lại, không dựa vào việc</text><text x="560.0" y="411.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">một người nhớ hạn</text><rect x="60.0" y="452.0" width="400.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="78.0" y="491.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khiếu nại cùng một vấn đề vượt ngưỡng trong</text><text x="78.0" y="512.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">một khoảng thời gian</text><line x1="468.0" y1="496.0" x2="519.0" y2="496.0" stroke="var(--p)" stroke-width="3"/><polygon points="530.0,496.0 519.0,502.1 519.0,489.9" fill="var(--p)"/><rect x="540.0" y="452.0" width="600.0" height="88.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="560.0" y="491.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tự khởi động điều tra nguyên nhân gốc ở cấp cao hơn, thay vì xử lý từng ca</text><text x="560.0" y="511.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">riêng lẻ</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hệ thống đảm nhận phát hiện và khởi động; phán đoán ở quyết định cuối vẫn thuộc về con người.</text></svg>
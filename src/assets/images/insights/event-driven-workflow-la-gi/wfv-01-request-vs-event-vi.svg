<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Mô hình request-based bắt đầu khi có người nhận ra và tạo yêu cầu, nên độ trễ nằm ở bước đầu; mô hình event-driven để hệ thống nhận biết sự kiện theo điều kiện định sẵn rồi tự khởi động workflow." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Request-based hay event-driven: điều gì khởi động workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khác biệt cốt lõi không nằm ở công nghệ, mà ở điều gì khởi động workflow.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="180.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="169.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Request-based</text><rect x="84.0" y="190.0" width="190.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--hd)" stroke-width="1.8"/><text x="179.0" y="228.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sự việc xảy ra</text><line x1="278.0" y1="223.0" x2="381.0" y2="223.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="390.0,223.0 381.0,227.9 381.0,218.1" fill="var(--a)"/><rect x="334.0" y="194.0" width="55.9" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="361.9" y="209.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Độ trễ</text><line x1="278.0" y1="223.0" x2="390.0" y2="223.0" stroke="var(--a)" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="394.0" y="190.0" width="190.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="489.0" y="228.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Có người nhận thấy</text><line x1="588.0" y1="223.0" x2="621.0" y2="223.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="630.0,223.0 621.0,227.9 621.0,218.1" fill="var(--gm)"/><rect x="634.0" y="190.0" width="190.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="729.0" y="228.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người đó tạo yêu cầu</text><line x1="828.0" y1="223.0" x2="861.0" y2="223.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="870.0,223.0 861.0,227.9 861.0,218.1" fill="var(--gm)"/><rect x="874.0" y="190.0" width="190.0" height="66.0" rx="10" fill="var(--gm)"/><text x="969.0" y="228.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Workflow bắt đầu</text><text x="84.0" y="287.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Độ trễ nằm ở bước đầu: từ lúc sự việc xảy ra đến lúc có người nhận ra và hành động.</text><rect x="60.0" y="328.0" width="1080.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="363.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Event-driven</text><rect x="84.0" y="384.0" width="226.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="197.0" y="422.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sự việc xảy ra</text><line x1="314.0" y1="417.0" x2="337.0" y2="417.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="346.0,417.0 337.0,421.9 337.0,412.1" fill="var(--p)"/><rect x="350.0" y="384.0" width="226.0" height="66.0" rx="10" fill="var(--p)"/><text x="463.0" y="412.9" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">Hệ thống nhận biết theo</text><text x="463.0" y="431.3" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">điều kiện định sẵn</text><line x1="580.0" y1="417.0" x2="603.0" y2="417.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="612.0,417.0 603.0,421.9 603.0,412.1" fill="var(--p)"/><rect x="616.0" y="384.0" width="226.0" height="66.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="729.0" y="422.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow tự khởi động</text><line x1="846.0" y1="417.0" x2="869.0" y2="417.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="878.0,417.0 869.0,421.9 869.0,412.1" fill="var(--p)"/><rect x="882.0" y="384.0" width="226.0" height="66.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="995.0" y="413.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Có hoặc không cần người xác</text><text x="995.0" y="430.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">nhận, tùy mức rủi ro</text><text x="84.0" y="481.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phản ứng ngay khi điều bất thường xuất hiện trong dữ liệu, không đợi đến khi nó đủ nghiêm trọng để có người thấy.</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Sự khác biệt không chỉ là tiết kiệm vài giờ: tổ chức phản ứng sau khi có người thấy, hay ngay khi dữ liệu báo.</text></svg>
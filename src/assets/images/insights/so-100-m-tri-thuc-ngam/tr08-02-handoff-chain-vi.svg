<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Chuỗi chuyển giao từ người thiết kế sang trưởng ca rồi nhân viên mới; kết luận tách dần khỏi lý do và trở thành quy định." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Qua mỗi lần chuyển giao, kết luận tách dần khỏi lý do</text><g transform="translate(0 139.8)"><rect x="60" y="0" width="322.6666666666667" height="131" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">NGƯỜI THIẾT KẾ</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Kết luận + lý do</text><rect x="438.6666666666667" y="0" width="322.6666666666667" height="131" rx="16" class="bg"/><text x="460.6666666666667" y="35" font-size="13" font-weight="600" class="mut">TRƯỞNG CA</text><text x="460.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Kết luận</text><text x="460.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Lý do thưa dần.</text><rect x="817.3333333333334" y="0" width="322.6666666666667" height="131" rx="16" class="bp"/><text x="839.3333333333334" y="35" font-size="13" font-weight="600" class="tp">NHÂN VIÊN MỚI</text><text x="839.3333333333334" y="70" font-size="22" font-weight="600" class="tp">“Quy định”</text><text x="839.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Không còn ai biết căn cứ.</text><line x1="388.6666666666667" y1="65.5" x2="420.6666666666667" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M418.6666666666667 56.5 l14 9 l-14 9z" class="arf"/><line x1="767.3333333333334" y1="65.5" x2="799.3333333333334" y2="65.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M797.3333333333334 56.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="159" width="1080" height="73" rx="16" class="bi"/><text x="82" y="203" font-size="22" font-weight="600" class="ti">Kết luận tách khỏi lý do thì trở thành “quy định”.</text></g></svg>

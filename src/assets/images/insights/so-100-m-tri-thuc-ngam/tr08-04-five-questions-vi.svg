<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="Năm câu hỏi kiểm tra một quy định: loại yêu cầu, căn cứ, điều kiện, còn đúng không, bằng chứng và thẩm quyền để thay đổi." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="670" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Năm câu hỏi cho một “quy định” bất kỳ</text><g transform="translate(0 108)"><rect x="60" y="0" width="1080" height="96" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">CÂU 1</text><text x="82" y="68" font-size="20" font-weight="600" class="tx">Đây là yêu cầu bắt buộc, lựa chọn thiết kế hay kinh nghiệm?</text><rect x="60" y="108" width="1080" height="96" rx="16" class="bb"/><text x="82" y="143" font-size="13" font-weight="600" class="mut">CÂU 2</text><text x="82" y="176" font-size="20" font-weight="600" class="tx">Căn cứ nằm ở đâu: văn bản nào, ai quyết định, khi nào?</text><rect x="60" y="216" width="1080" height="96" rx="16" class="bb"/><text x="82" y="251" font-size="13" font-weight="600" class="mut">CÂU 3</text><text x="82" y="284" font-size="20" font-weight="600" class="tx">Nó được đưa ra trong điều kiện nào?</text><rect x="60" y="324" width="1080" height="96" rx="16" class="bb"/><text x="82" y="359" font-size="13" font-weight="600" class="mut">CÂU 4</text><text x="82" y="392" font-size="20" font-weight="600" class="tx">Những điều kiện ấy còn đúng với hiện tại không?</text><rect x="60" y="432" width="1080" height="96" rx="16" class="bb"/><text x="82" y="467" font-size="13" font-weight="600" class="mut">CÂU 5</text><text x="82" y="500" font-size="20" font-weight="600" class="tx">Muốn thay đổi thì cần bằng chứng gì, ai có quyền quyết định?</text></g></svg>

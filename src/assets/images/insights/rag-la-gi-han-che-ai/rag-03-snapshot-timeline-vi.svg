<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 494" width="1200" height="494" role="img" aria-label="Dòng thời gian: tài liệu được lập chỉ mục ở phiên bản cũ, sau đó được sửa đổi; chatbot vẫn trả lời theo bản cũ trong khi thực tế đã khác." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="494" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">RAG trả lời theo phiên bản lúc lập chỉ mục</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tài liệu thay đổi sau khi lập chỉ mục thì chatbot không biết.</text><line x1="60.0" y1="410.0" x2="1140.0" y2="410.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="432.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ khái niệm theo bài viết, không phải số liệu đo lường.</text><text x="60.0" y="473.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><line x1="120.0" y1="230.0" x2="1080.0" y2="230.0" stroke="var(--gm)" stroke-width="3"/><circle cx="220.0" cy="230.0" r="13" fill="var(--gm)"/><text x="220.0" y="189.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Lập chỉ mục</text><text x="220.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="middle">Tài liệu ở phiên bản cũ</text><circle cx="600.0" cy="230.0" r="13" fill="var(--a)"/><text x="600.0" y="189.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Tài liệu được sửa</text><text x="600.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="middle">Chatbot chưa thấy thay đổi</text><circle cx="980.0" cy="230.0" r="13" fill="var(--p)"/><text x="980.0" y="189.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Hôm nay</text><text x="980.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="middle">Thực tế đang vận hành</text><rect x="60.0" y="340.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="373.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">RAG trả lời đúng theo bản đã nạp, nhưng thực tế có thể đã đi xa hơn.</text></svg>
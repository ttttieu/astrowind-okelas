<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Sáu tầng xếp chồng: tầng nền là kho tài liệu RAG đã có; năm tầng trên là phần cần bổ sung gồm dữ liệu vận hành, phiên bản và trạng thái, tri thức gắn bối cảnh, workflow và evidence, governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm thành phần vận hành AI cần bổ sung trên tài liệu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cần để trả lời những câu hỏi ảnh hưởng đến quyết định, compliance và trách nhiệm giải trình.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Năm thành phần theo phân tích trong bài, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="162.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Governance: AI được tác động đến đâu, việc nào cần người duyệt</text><rect x="60.0" y="190.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="218.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow và evidence: ai làm gì, khi nào, vì sao</text><rect x="60.0" y="246.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="274.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Tri thức gắn bối cảnh: quy trình, sản phẩm, dây chuyền, quyết định</text><rect x="60.0" y="302.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="330.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Quản lý phiên bản và trạng thái: tài liệu nào đang hiệu lực</text><rect x="60.0" y="358.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="386.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu vận hành thực tế: ERP, QMS, sản xuất, kiểm tra</text><rect x="60.0" y="414.0" width="1080.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="442.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="middle">Kho tài liệu: phần RAG đã có</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Năm tầng phía trên là phần cần bổ sung. RAG vẫn là bước đầu hợp lý, nhưng chưa phải điểm đến.</text></svg>
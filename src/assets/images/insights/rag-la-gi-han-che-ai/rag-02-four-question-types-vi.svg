<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bốn loại câu hỏi RAG không trả lời được: dữ liệu vận hành cụ thể, trạng thái hiện tại, lịch sử quyết định và bằng chứng, truy xuất nguồn gốc." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn loại câu hỏi RAG không trả lời được</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi câu hỏi cần dữ liệu nằm ngoài kho tài liệu.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi minh họa lấy từ bài viết (tình huống tổng hợp), không phải số liệu đo lường.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="142.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="164.0" r="15" fill="var(--p)"/><text x="90.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu vận hành</text><text x="84.0" y="204.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Lô B2024-08 tuần trước có đạt kiểm tra không?”</text><text x="84.0" y="233.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nằm ở hệ thống vận hành, cơ sở dữ liệu hoặc file Excel rời, không nằm trong</text><text x="84.0" y="251.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tài liệu RAG tìm kiếm.</text><rect x="606.0" y="134.0" width="534.0" height="142.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="636.0" cy="164.0" r="15" fill="var(--p)"/><text x="636.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trạng thái hiện tại</text><text x="630.0" y="204.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Phiên bản nào đang có hiệu lực cho dây chuyền số 3?”</text><text x="630.0" y="233.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">RAG chỉ thấy tài liệu như lúc lập chỉ mục, không biết bản nào đang hiệu lực.</text><rect x="60.0" y="288.0" width="534.0" height="142.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="318.0" r="15" fill="var(--p)"/><text x="90.0" y="323.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="324.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Lịch sử quyết định và bằng chứng</text><text x="84.0" y="358.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Vì sao tháng trước đổi nhà cung cấp nguyên liệu X?”</text><text x="84.0" y="387.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cần bản ghi ai duyệt, khi nào, dựa trên căn cứ nào. RAG không có cấu trúc</text><text x="84.0" y="405.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">liên kết các phần này.</text><rect x="606.0" y="288.0" width="534.0" height="142.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="636.0" cy="318.0" r="15" fill="var(--p)"/><text x="636.0" y="323.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="324.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Truy xuất nguồn gốc</text><text x="630.0" y="358.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Lô nguyên liệu A có vấn đề, sản phẩm nào đã dùng nó?”</text><text x="630.0" y="387.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cần chuỗi dữ liệu có cấu trúc từ nguyên liệu tới thành phẩm, truy ngược được</text><text x="630.0" y="405.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">từ kết quả về nguồn.</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không câu nào nằm trong nội dung tài liệu, nên tìm kiếm trên kho tài liệu không đủ để trả lời.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 558" width="1200" height="558" role="img" aria-label="Ba bước của RAG: lập chỉ mục tài liệu, truy xuất đoạn liên quan, tổng hợp câu trả lời; mọi bước chỉ làm việc với kho tài liệu đã nạp." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="558" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">RAG hoạt động ba bước, và chỉ làm việc với kho tài liệu</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cả ba bước đều làm việc trên tài liệu. Đây là giới hạn kiến trúc, không phải lỗi.</text><line x1="60.0" y1="474.0" x2="1140.0" y2="474.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="496.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ khái niệm mô tả cách RAG hoạt động theo bài viết, không phải số liệu đo lường.</text><text x="60.0" y="537.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="92.0" cy="182.0" r="15" fill="var(--gm)"/><text x="92.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lập chỉ mục</text><text x="84.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOP, quy trình, chính sách được chia</text><text x="84.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thành các đoạn nhỏ và lưu vào kho tìm</text><text x="84.0" y="280.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">kiếm theo ngữ nghĩa.</text><line x1="399.0" y1="230.0" x2="419.0" y2="230.0" stroke="var(--gm)" stroke-width="2"/><polygon points="427.0,230.0 419.0,234.4 419.0,225.6" fill="var(--gm)"/><rect x="433.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="465.0" cy="182.0" r="15" fill="var(--p)"/><text x="465.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="493.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Truy xuất</text><text x="457.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Với mỗi câu hỏi, hệ thống lấy các đoạn</text><text x="457.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">liên quan nhất trong kho.</text><line x1="772.0" y1="230.0" x2="792.0" y2="230.0" stroke="var(--gm)" stroke-width="2"/><polygon points="800.0,230.0 792.0,234.4 792.0,225.6" fill="var(--gm)"/><rect x="806.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="838.0" cy="182.0" r="15" fill="var(--gm)"/><text x="838.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="866.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tổng hợp</text><text x="830.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI ghép đoạn đã lấy với câu hỏi để viết</text><text x="830.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">câu trả lời tự nhiên.</text><rect x="60.0" y="334.0" width="1080.0" height="52.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Cả ba bước chỉ làm việc với tài liệu đã nạp vào kho.</text><rect x="60.0" y="404.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="437.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ưu điểm có thật: câu trả lời dựa trên tài liệu nội bộ và truy được nguồn. Giới hạn nằm ở phạm vi dữ liệu.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-label="Ba nguyên nhân SOP không được thực thi: SOP mô tả điều kiện lý tưởng, SOP không sống trong quy trình làm việc, và không đủ lý do để làm đúng khi không có ai nhìn, kèm dấu hiệu nhận biết của từng nguyên nhân." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="676" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba nguyên nhân SOP không được thực thi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi nguyên nhân có một dấu hiệu nhận biết riêng.</text><line x1="60.0" y1="592.0" x2="1140.0" y2="592.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="614.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba nguyên nhân là framework thực tiễn của OKELAS dựa trên quan sát thực tế, không phải phân loại học thuật chuẩn hóa; công cụ thảo luận, không phải phương pháp luận được chứng</text><text x="60.0" y="630.7" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">nhận. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="655.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">SOP mô tả điều kiện lý tưởng,</text><text x="122.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">không phải thực tế</text><rect x="82.0" y="234.0" width="151.9" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="158.0" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Nguyên nhân kỹ thuật</text><text x="82.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="82.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOP viết như kịch bản tốt nhất, nhưng người</text><text x="82.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vận hành dành phần lớn thời gian xử lý</text><text x="82.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">những điều không theo kế hoạch.</text><line x1="82.0" y1="392.0" x2="386.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Dấu hiệu nhận biết</text><text x="82.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhân viên có kinh nghiệm làm khác SOP và</text><text x="82.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">có lý do cụ thể, hợp lý.</text><rect x="426.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">SOP có trong hệ thống nhưng</text><text x="488.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">không sống trong quy trình</text><text x="488.0" y="212.6" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">làm việc</text><rect x="448.0" y="234.0" width="156.0" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="526.0" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Nguyên nhân hệ thống</text><text x="448.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="448.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOP nằm trong folder, DMS, intranet như</text><text x="448.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tài liệu tham khảo, không xuất hiện đúng lúc,</text><text x="448.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đúng chỗ.</text><line x1="448.0" y1="392.0" x2="752.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Dấu hiệu nhận biết</text><text x="448.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khi audit, người thực thi không biết phiên</text><text x="448.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">bản hiện tại, hoặc làm khác SOP mà</text><text x="448.0" y="482.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không biết.</text><rect x="792.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không đủ lý do để làm đúng</text><text x="854.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">khi không có ai nhìn</text><rect x="814.0" y="234.0" width="172.6" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="900.3" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">Nguyên nhân về động lực</text><text x="814.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Là gì</text><text x="814.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Làm đúng SOP tốn thêm thời gian và công</text><text x="814.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sức. Không thấy hậu quả và không ai kiểm</text><text x="814.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tra thì lý do không đủ mạnh.</text><line x1="814.0" y1="392.0" x2="1118.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Dấu hiệu nhận biết</text><text x="814.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tuân thủ tăng đột biến trước audit rồi giảm</text><text x="814.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">lại, hoặc cao ở bước có kiểm tra và thấp ở</text><text x="814.0" y="482.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">bước không có.</text><rect x="60.0" y="522.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="555.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba đều là vấn đề thiết kế hệ thống, không phải vấn đề đạo đức của nhân viên.</text></svg>
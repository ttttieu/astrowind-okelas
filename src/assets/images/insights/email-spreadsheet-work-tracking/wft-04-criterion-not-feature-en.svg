<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Visibility is a criterion for whether a workflow serves its users, not a feature to add or a habit to drop through willpower." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="560" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Visibility is a criterion, not a feature to add</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A system with good visibility makes a separate spreadsheet unnecessary.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="140.0" width="440.0" height="280.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="160.0" width="115.8" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.2"/><text x="141.9" y="176.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">A common view</text><text x="84.0" y="261.1" font-size="20" font-weight="700" fill="var(--mut)" text-anchor="start">Treat visibility as a feature to add</text><text x="84.0" y="297.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ask employees to drop the spreadsheet habit</text><text x="84.0" y="320.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">through willpower.</text><line x1="508.0" y1="280.0" x2="547.0" y2="280.0" stroke="var(--p)" stroke-width="3"/><polygon points="558.0,280.0 547.0,286.1 547.0,273.9" fill="var(--p)"/><rect x="566.0" y="140.0" width="574.0" height="280.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><rect x="590.0" y="160.0" width="125.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="652.6" y="176.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">The article’s view</text><text x="590.0" y="225.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Treat visibility as a criterion</text><text x="590.0" y="256.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Does the current workflow genuinely serve its users?</text><rect x="590.0" y="288.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="310.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Easy to look up</text><rect x="590.0" y="328.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="350.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Enough context</text><rect x="590.0" y="368.0" width="300.0" height="34.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="390.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Shown the way users need</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A good system makes the spreadsheet unnecessary; employees do not have to force themselves to quit it.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 666" width="1200" height="666" role="img" aria-label="The common view stacks automation and AI as two rungs of a ladder; in practice there are three different roles: automation executes under issued rules, AI support reads input and prepares evidence but holds no decision authority, and people judge exceptions and issue rules." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="666" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Not two rungs of a ladder: three different roles</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The common view leads to investing in the wrong place.</text><line x1="60.0" y1="604.0" x2="1140.0" y2="604.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="626.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="130.0" width="1080.0" height="104.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="158.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">The common view</text><rect x="84.0" y="174.0" width="260.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="214.0" y="201.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Automation</text><line x1="348.0" y1="196.0" x2="374.0" y2="196.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="384.0,196.0 374.0,201.5 374.0,190.5" fill="#5B6575"/><rect x="388.0" y="174.0" width="260.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="518.0" y="201.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">Add AI</text><line x1="652.0" y1="196.0" x2="678.0" y2="196.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="688.0,196.0 678.0,201.5 678.0,190.5" fill="#5B6575"/><rect x="692.0" y="174.0" width="300.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="842.0" y="201.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="middle">“Smarter”</text><text x="60.0" y="277.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">In practice: three different roles</text><rect x="60.0" y="294.0" width="346.0" height="232.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="84.0" y="336.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Automation</text><text x="84.0" y="372.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Executes actions that rules</text><text x="84.0" y="393.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">have permitted.</text><line x1="84.0" y1="426.0" x2="382.0" y2="426.0" stroke="#2B74F5" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="452.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Decision authority</text><text x="84.0" y="478.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Yes, within the scope of rules issued</text><text x="84.0" y="500.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">by people</text><rect x="427.0" y="294.0" width="346.0" height="232.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="451.0" y="336.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">AI support</text><text x="451.0" y="372.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Reads unstructured input and</text><text x="451.0" y="393.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">prepares evidence.</text><line x1="451.0" y1="426.0" x2="749.0" y2="426.0" stroke="#2B74F5" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="452.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Decision authority</text><text x="451.0" y="478.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">No</text><rect x="794.0" y="294.0" width="346.0" height="232.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="818.0" y="336.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">People</text><text x="818.0" y="372.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Judge exceptions and issue rules.</text><line x1="818.0" y1="426.0" x2="1116.0" y2="426.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="452.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Decision authority</text><text x="818.0" y="478.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Yes</text><rect x="60.0" y="544.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="577.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI reads, then a rule runs or a person decides.</text></svg>
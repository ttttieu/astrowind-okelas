<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Comparison of automation, AI support and people by main job, what each needs, decision authority and what happens when wrong; AI support holds no decision authority." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="680" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Automation, AI support and people: who does what</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The AI support column holds decision authority in no row.</text><line x1="60.0" y1="618.0" x2="1140.0" y2="618.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="640.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">An orienting framework for discussion, not measured data.</text><rect x="240.0" y="130.0" width="303.0" height="40.0" rx="10" fill="#2B74F5"/><text x="391.5" y="155.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Automation (rule)</text><rect x="553.0" y="130.0" width="303.0" height="40.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="2"/><text x="704.5" y="155.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">AI support</text><rect x="866.0" y="130.0" width="274.0" height="40.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="2"/><text x="1003.0" y="155.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">People</text><text x="64.0" y="223.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Main job</text><rect x="240.0" y="180.0" width="303.0" height="84.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="254.0" y="217.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Executes actions that have</text><text x="254.0" y="236.3" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">been permitted</text><rect x="553.0" y="180.0" width="303.0" height="84.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="567.0" y="227.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Reads input, prepares evidence</text><rect x="866.0" y="180.0" width="274.0" height="84.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="880.0" y="227.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Judges exceptions, issues rules</text><text x="64.0" y="317.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">What it needs</text><rect x="240.0" y="274.0" width="303.0" height="84.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="254.0" y="321.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Clear rules, structured input</text><rect x="553.0" y="274.0" width="303.0" height="84.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="567.0" y="321.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Input to read, sources to look up</text><rect x="866.0" y="274.0" width="274.0" height="84.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="880.0" y="321.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Authority and enough information</text><text x="64.0" y="411.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Decision authority</text><rect x="240.0" y="368.0" width="303.0" height="84.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="254.0" y="415.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Yes, within the scope of issued rules</text><rect x="553.0" y="368.0" width="303.0" height="84.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="567.0" y="415.8" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">No</text><rect x="866.0" y="368.0" width="274.0" height="84.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="880.0" y="415.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Yes</text><text x="64.0" y="505.8" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">When wrong</text><rect x="240.0" y="462.0" width="303.0" height="84.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="254.0" y="509.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Errors repeat quickly and evenly</text><rect x="553.0" y="462.0" width="303.0" height="84.0" rx="12" fill="#08090A" stroke="#2B74F5" stroke-width="1.6"/><text x="567.0" y="509.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Misreading a reviewer can correct</text><rect x="866.0" y="462.0" width="274.0" height="84.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="880.0" y="509.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">An accountable owner, traceable</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Decision authority stays with rules issued by people, or with people.</text></svg>
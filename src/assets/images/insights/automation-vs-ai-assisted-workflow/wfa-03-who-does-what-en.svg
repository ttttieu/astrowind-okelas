<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Comparison of automation, AI support and people by main job, what each needs, decision authority and what happens when wrong; AI support holds no decision authority." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="680" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Automation, AI support and people: who does what</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The AI support column holds decision authority in no row.</text><line x1="60.0" y1="618.0" x2="1140.0" y2="618.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="640.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">An orienting framework for discussion, not measured data.</text><rect x="240.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--p)"/><text x="391.5" y="155.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Automation (rule)</text><rect x="553.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="704.5" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">AI support</text><rect x="866.0" y="130.0" width="274.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><text x="1003.0" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">People</text><text x="64.0" y="223.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Main job</text><rect x="240.0" y="180.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="217.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Executes actions that have</text><text x="254.0" y="236.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">been permitted</text><rect x="553.0" y="180.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="227.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Reads input, prepares evidence</text><rect x="866.0" y="180.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="227.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Judges exceptions, issues rules</text><text x="64.0" y="317.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">What it needs</text><rect x="240.0" y="274.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Clear rules, structured input</text><rect x="553.0" y="274.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Input to read, sources to look up</text><rect x="866.0" y="274.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="321.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Authority and enough information</text><text x="64.0" y="411.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Decision authority</text><rect x="240.0" y="368.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="415.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Yes, within the scope of issued rules</text><rect x="553.0" y="368.0" width="303.0" height="84.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="567.0" y="415.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">No</text><rect x="866.0" y="368.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="415.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Yes</text><text x="64.0" y="505.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">When wrong</text><rect x="240.0" y="462.0" width="303.0" height="84.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Errors repeat quickly and evenly</text><rect x="553.0" y="462.0" width="303.0" height="84.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Misreading a reviewer can correct</text><rect x="866.0" y="462.0" width="274.0" height="84.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="509.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">An accountable owner, traceable</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Decision authority stays with rules issued by people, or with people.</text></svg>
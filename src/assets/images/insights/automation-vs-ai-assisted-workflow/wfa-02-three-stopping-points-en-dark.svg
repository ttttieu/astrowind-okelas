<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="Automation stops in three places: for unstructured input, AI interprets so rules can run; for cases outside the rule, the exception path routes to an authorized person with AI-prepared evidence; for decisions needing judgment, a person decides." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="658" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Automation stops in three places, each needs its own answer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each stopping point needs a different answer.</text><line x1="60.0" y1="596.0" x2="1140.0" y2="596.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="618.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="143.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Automation stops at</text><text x="500.0" y="143.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">The answer</text><rect x="60.0" y="156.0" width="380.0" height="112.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="191.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Unstructured input</text><text x="80.0" y="222.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Emails, scanned documents and notes have no</text><text x="80.0" y="242.5" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">fields for a rule to read.</text><line x1="446.0" y1="212.0" x2="479.0" y2="212.0" stroke="#2B74F5" stroke-width="3"/><polygon points="490.0,212.0 479.0,218.1 479.0,205.9" fill="#2B74F5"/><rect x="500.0" y="156.0" width="640.0" height="112.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="524.0" y="218.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">AI interprets the input so rules can run.</text><rect x="60.0" y="282.0" width="380.0" height="112.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="317.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Cases outside the rule</text><text x="80.0" y="348.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Matches no rule, so the robot stops, as designed.</text><line x1="446.0" y1="338.0" x2="479.0" y2="338.0" stroke="#A78BFA" stroke-width="3"/><polygon points="490.0,338.0 479.0,344.1 479.0,331.9" fill="#A78BFA"/><rect x="500.0" y="282.0" width="640.0" height="112.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="524.0" y="333.0" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Exception path: route to the right authorized person, AI</text><text x="524.0" y="355.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">prepares evidence.</text><rect x="60.0" y="408.0" width="380.0" height="112.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.4" stroke-dasharray="6 5"/><text x="80.0" y="443.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Decisions needing judgment</text><text x="80.0" y="474.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Many factors at once, criteria not stable.</text><line x1="446.0" y1="464.0" x2="479.0" y2="464.0" stroke="#A78BFA" stroke-width="3"/><polygon points="490.0,464.0 479.0,470.1 479.0,457.9" fill="#A78BFA"/><rect x="500.0" y="408.0" width="640.0" height="112.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="524.0" y="470.2" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A person decides; rules cannot replace that yet.</text><rect x="60.0" y="536.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="569.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Treating these three as one is where wrong investment starts.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The common view stacks automation and AI as two rungs of a ladder; in practice automation executes, AI support reads and prepares evidence, and people decide." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Automation and AI-Assisted Workflow: Two</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Different Jobs</text><text x="60.0" y="289.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">The common view</text><rect x="60.0" y="304.0" width="240.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="180.0" y="339.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="middle">Automation</text><line x1="304.0" y1="334.0" x2="335.0" y2="334.0" stroke="var(--gm)" stroke-width="3"/><polygon points="346.0,334.0 335.0,340.1 335.0,327.9" fill="var(--gm)"/><rect x="350.0" y="304.0" width="240.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="470.0" y="339.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="middle">Add AI</text><line x1="594.0" y1="334.0" x2="625.0" y2="334.0" stroke="var(--gm)" stroke-width="3"/><polygon points="636.0,334.0 625.0,340.1 625.0,327.9" fill="var(--gm)"/><rect x="640.0" y="304.0" width="280.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="5 4"/><text x="780.0" y="339.8" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="middle">“Smarter”</text><text x="60.0" y="429.0" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">In practice</text><rect x="60.0" y="444.0" width="300.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="210.0" y="479.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Automation: executes</text><rect x="400.0" y="444.0" width="400.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="479.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI support: reads, prepares evidence</text><rect x="840.0" y="444.0" width="300.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="990.0" y="479.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">People: decide</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Five steps in order of dependency: standardize and write rules, automation, exception path, AI to interpret input, AI to prepare evidence; the two AI steps follow measuring exception rate, unstructured-input share and file-preparation time." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="660" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Investment order follows dependency</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each step works well when the one before it is in place.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="130.0" width="200.0" height="252.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="#2B74F5"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="209.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Standardize and</text><text x="76.0" y="233.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">write rules</text><text x="76.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The repeating part,</text><text x="76.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">with an authorized</text><text x="76.0" y="310.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">person named.</text><line x1="262.0" y1="162.0" x2="272.0" y2="162.0" stroke="#2B74F5" stroke-width="2"/><polygon points="278.0,162.0 272.0,165.3 272.0,158.7" fill="#2B74F5"/><rect x="280.0" y="130.0" width="200.0" height="252.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="310.0" cy="162.0" r="15" fill="#2B74F5"/><text x="310.0" y="167.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="296.0" y="209.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Automation</text><text x="296.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The part with clear rules</text><text x="296.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and structured input.</text><line x1="482.0" y1="162.0" x2="492.0" y2="162.0" stroke="#2B74F5" stroke-width="2"/><polygon points="498.0,162.0 492.0,165.3 492.0,158.7" fill="#2B74F5"/><rect x="500.0" y="130.0" width="200.0" height="252.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="530.0" cy="162.0" r="15" fill="#2B74F5"/><text x="530.0" y="167.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="516.0" y="209.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Exception path</text><text x="516.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Cases outside the rule</text><text x="516.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">reach the right person</text><text x="516.0" y="310.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">with a file; the decision</text><text x="516.0" y="330.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">is recorded.</text><line x1="702.0" y1="162.0" x2="712.0" y2="162.0" stroke="#2B74F5" stroke-width="2"/><polygon points="718.0,162.0 712.0,165.3 712.0,158.7" fill="#2B74F5"/><rect x="720.0" y="130.0" width="200.0" height="252.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><circle cx="750.0" cy="162.0" r="15" fill="#2B74F5"/><text x="750.0" y="167.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="736.0" y="209.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">AI to interpret input</text><text x="736.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">When unstructured</text><text x="736.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">input is a real</text><text x="736.0" y="310.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">bottleneck.</text><rect x="736.0" y="342.0" width="100.3" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="786.2" y="358.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Measure first</text><line x1="922.0" y1="162.0" x2="932.0" y2="162.0" stroke="#2B74F5" stroke-width="2"/><polygon points="938.0,162.0 932.0,165.3 932.0,158.7" fill="#2B74F5"/><rect x="940.0" y="130.0" width="200.0" height="252.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><circle cx="970.0" cy="162.0" r="15" fill="#2B74F5"/><text x="970.0" y="167.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="956.0" y="209.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">AI to prepare</text><text x="956.0" y="233.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">evidence</text><text x="956.0" y="271.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">When exceptions are</text><text x="956.0" y="290.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">numerous enough that</text><text x="956.0" y="310.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">assembling files costs</text><text x="956.0" y="330.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">real effort.</text><rect x="956.0" y="342.0" width="100.3" height="24.0" rx="12.0" fill="#08090A" stroke="#2B74F5" stroke-width="1.2"/><text x="1006.2" y="358.4" font-size="12" font-weight="700" fill="#2B74F5" text-anchor="middle">Measure first</text><rect x="60.0" y="398.0" width="1080.0" height="124.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="430.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Before steps 4 and 5, measure in your own process</text><rect x="84.0" y="460.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="254.0" y="487.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Share of cases that become exceptions</text><rect x="436.0" y="460.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="606.0" y="487.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Share of unstructured input</text><rect x="788.0" y="460.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="958.0" y="487.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Time spent preparing files</text><rect x="60.0" y="538.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="571.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">There is no universal threshold. Your own figures are the basis.</text></svg>
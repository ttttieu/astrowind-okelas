<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Bảy ô thẻ nối thành hàng: nhận diện, phê duyệt, bảo vệ, phân phối, kiểm soát thay đổi, lưu giữ, hủy bỏ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 7.5 yêu cầu kiểm soát, không quy định phương tiện</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 7.5 liệt kê bảy việc cần kiểm soát đối với thông tin đã được lập thành văn bản.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bảy việc theo điều khoản 7.5 như bài viết diễn đạt; cách xếp thành chuỗi là của OKELAS.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="133.0" y="230.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Nhận diện</text><rect x="216.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="289.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Phê duyệt</text><rect x="372.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="445.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Bảo vệ</text><rect x="528.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="601.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Phân phối</text><rect x="684.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="757.0" y="220.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Kiểm soát</text><text x="757.0" y="240.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">thay đổi</text><rect x="840.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="913.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Lưu giữ</text><rect x="996.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1069.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Hủy bỏ</text><text x="60.0" y="336.8" font-size="16" font-weight="400" fill="var(--s)" text-anchor="start">Bảy việc theo điều khoản 7.5 như bài viết diễn đạt.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tiêu chuẩn mô tả kết quả kiểm soát, không mô tả công cụ.</text></svg>
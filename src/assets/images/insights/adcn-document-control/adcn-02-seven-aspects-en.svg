<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Seven boxes in a row: identification, approval, protection, distribution, change control, retention, disposal." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Clause 7.5 requires control, not a specific medium</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Clause 7.5 lists seven aspects of control for documented information.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Seven aspects as the article describes clause 7.5; arranging them as a chain is OKELAS’s presentation.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="133.0" y="230.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Identification</text><rect x="216.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="289.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Approval</text><rect x="372.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="445.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Protection</text><rect x="528.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="601.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Distribution</text><rect x="684.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="757.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Change control</text><rect x="840.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="913.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Retention</text><rect x="996.0" y="170.0" width="146.0" height="110.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="1069.0" y="230.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Disposal</text><text x="60.0" y="336.8" font-size="16" font-weight="400" fill="var(--s)" text-anchor="start">Seven aspects as the article describes clause 7.5.</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The standard describes control outcomes, not tools.</text></svg>
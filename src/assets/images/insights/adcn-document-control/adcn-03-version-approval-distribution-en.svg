<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Three columns: version, approval, distribution, each with four or five items." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three things keep people working from the right version</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Version, approval and distribution are three concrete areas of document control.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three groups per the article; the items inside each group are OKELAS’s paraphrase.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Version</text><text x="84.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Document and revision numbers</text><text x="84.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Effective dates</text><text x="84.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Document register</text><text x="84.0" y="395.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Withdraw or mark old copies</text><rect x="428.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Approval</text><text x="452.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Approvers with authority</text><text x="452.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Avoid long approval chains</text><text x="452.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Record reason for</text><text x="452.0" y="366.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">change (recommended)</text><rect x="796.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="820.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Distribution</text><text x="820.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Who needs which document</text><text x="820.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Confirm receipt</text><text x="820.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Separate</text><text x="820.0" y="366.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">controlled/uncontrolled copies</text><text x="820.0" y="395.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Control external documents</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Everyone must know which version they use, and old copies must be withdrawn.</text></svg>
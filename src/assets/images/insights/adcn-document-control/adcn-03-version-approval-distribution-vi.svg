<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Ba cột: phiên bản, phê duyệt, phân phối, mỗi cột có bốn hoặc năm mục." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba việc giữ cho người làm việc luôn dùng đúng phiên bản</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phiên bản, phê duyệt và phân phối là ba việc cụ thể trong kiểm soát tài liệu.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba nhóm theo bài viết; các mục trong nhóm là diễn đạt lại bởi OKELAS.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Phiên bản</text><text x="84.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Số tài liệu và số phiên bản</text><text x="84.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Ngày hiệu lực</text><text x="84.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Sổ đăng ký tài liệu</text><text x="84.0" y="395.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Thu hồi hoặc đánh dấu bản cũ</text><rect x="428.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Phê duyệt</text><text x="452.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Người duyệt có thẩm quyền</text><text x="452.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Tránh chuỗi duyệt dài</text><text x="452.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Ghi lý do thay đổi (khuyến nghị)</text><rect x="796.0" y="160.0" width="340.0" height="270.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="820.0" y="213.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Phân phối</text><text x="820.0" y="251.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Ai cần tài liệu nào</text><text x="820.0" y="299.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Xác nhận đã nhận</text><text x="820.0" y="347.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Tách bản có và không kiểm soát</text><text x="820.0" y="395.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Kiểm soát tài liệu bên ngoài</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ai dùng bản nào phải rõ, và bản cũ phải bị thu hồi.</text></svg>
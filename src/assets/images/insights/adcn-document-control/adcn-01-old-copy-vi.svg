<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Hai thẻ nguồn bên trái trỏ tới một thẻ kết quả bên phải; kết quả là sản phẩm làm theo phiên bản hết hiệu lực." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bản mới nằm trong thư mục, bản cũ vẫn dán cạnh máy</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không ai cố ý làm sai, nhưng sản phẩm vẫn được làm theo một phiên bản đã hết hiệu lực.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống theo bài viết là ghép hợp thành, không phải khách hàng thật.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="500.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="212.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Bản mới đã duyệt</text><text x="86.0" y="240.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Nằm trong thư mục chia sẻ</text><rect x="60.0" y="290.0" width="500.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="342.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Bản cũ đã được thay thế</text><text x="86.0" y="370.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Vẫn dán cạnh máy</text><line x1="566.0" y1="215.0" x2="622.0" y2="215.0" stroke="var(--gm)" stroke-width="3"/><polygon points="634.0,215.0 622.0,221.6 622.0,208.4" fill="var(--gm)"/><line x1="566.0" y1="345.0" x2="622.0" y2="345.0" stroke="var(--gm)" stroke-width="3"/><polygon points="634.0,345.0 622.0,351.6 622.0,338.4" fill="var(--gm)"/><rect x="640.0" y="230.0" width="500.0" height="130.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="890.0" y="289.4" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">Sản phẩm được làm theo phiên bản không còn</text><text x="890.0" y="314.5" font-size="19" font-weight="700" fill="var(--a)" text-anchor="middle">hiệu lực</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bản đúng phải nằm đúng chỗ người làm việc đang nhìn.</text></svg>
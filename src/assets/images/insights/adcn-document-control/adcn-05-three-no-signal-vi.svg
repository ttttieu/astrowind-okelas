<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" width="1200" height="674" role="img" aria-label="Sơ đồ hai nhánh: checklist mười câu, ba câu trở lên là “không” rẽ sang xem lại; dưới ba câu rẽ sang chọn công cụ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="674" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba câu trả lời “không” là tín hiệu cần xem lại trước</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bộ checklist mười câu; bài viết gợi ý xem lại cách kiểm soát trước khi chọn công cụ.</text><line x1="60.0" y1="590.0" x2="1140.0" y2="590.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="612.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ngưỡng ba câu theo bài viết; sơ đồ hai nhánh là cách OKELAS trình bày.</text><text x="60.0" y="653.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="180.0" width="300.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="210.0" y="241.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Checklist 10 câu</text><line x1="366.0" y1="235.0" x2="408.0" y2="235.0" stroke="var(--gm)" stroke-width="3"/><polygon points="420.0,235.0 408.0,241.6 408.0,228.4" fill="var(--gm)"/><rect x="424.0" y="170.0" width="340.0" height="130.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="594.0" y="230.0" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">3 câu trở lên là “không” hoặc</text><text x="594.0" y="252.4" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">“chưa chắc”</text><line x1="770.0" y1="235.0" x2="808.0" y2="235.0" stroke="var(--gm)" stroke-width="3"/><polygon points="820.0,235.0 808.0,241.6 808.0,228.4" fill="var(--gm)"/><rect x="824.0" y="170.0" width="316.0" height="130.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="982.0" y="230.3" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Xem lại cách kiểm soát trước khi</text><text x="982.0" y="251.4" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">chọn công cụ</text><rect x="424.0" y="360.0" width="340.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="594.0" y="415.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Dưới 3 câu</text><line x1="594.0" y1="300.0" x2="594.0" y2="340.0" stroke="var(--gm)" stroke-width="3"/><polygon points="594.0,352.0 587.4,340.0 600.6,340.0" fill="var(--gm)"/><rect x="824.0" y="360.0" width="316.0" height="100.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="982.0" y="415.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Chọn công cụ khi điều kiện đã rõ</text><line x1="768.0" y1="410.0" x2="808.0" y2="410.0" stroke="var(--gm)" stroke-width="3"/><polygon points="820.0,410.0 808.0,416.6 808.0,403.4" fill="var(--gm)"/><rect x="60.0" y="520.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="553.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Xem lại cách kiểm soát trước, rồi mới chọn công cụ.</text></svg>
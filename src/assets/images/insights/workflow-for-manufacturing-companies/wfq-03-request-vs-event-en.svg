<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The request approval model starts when someone sends a request and waits for an approver before any action; the event action model starts from an event, runs the action when a rule permits, and hands cases the rule does not cover to a person." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From request → approval to event → action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">What changes is what triggers work, and which work need not wait for a person.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="150.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">The approval model</text><rect x="60.0" y="166.0" width="330.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="225.0" y="201.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Someone remembers to send a request</text><line x1="394.0" y1="196.0" x2="416.0" y2="196.0" stroke="var(--gm)" stroke-width="3"/><polygon points="426.0,196.0 416.0,201.5 416.0,190.5" fill="var(--gm)"/><rect x="430.0" y="166.0" width="330.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="595.0" y="201.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Waits for an approver</text><line x1="764.0" y1="196.0" x2="786.0" y2="196.0" stroke="var(--gm)" stroke-width="3"/><polygon points="796.0,196.0 786.0,201.5 786.0,190.5" fill="var(--gm)"/><rect x="800.0" y="166.0" width="330.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="965.0" y="201.5" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="middle">Action</text><text x="60.0" y="278.9" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">The event → action model</text><rect x="60.0" y="294.0" width="330.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="225.0" y="329.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">An event happens</text><line x1="394.0" y1="324.0" x2="416.0" y2="324.0" stroke="var(--p)" stroke-width="3"/><polygon points="426.0,324.0 416.0,329.5 416.0,318.5" fill="var(--p)"/><rect x="430.0" y="294.0" width="330.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="595.0" y="329.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Does a rule permit it?</text><line x1="764.0" y1="324.0" x2="786.0" y2="324.0" stroke="var(--p)" stroke-width="3"/><polygon points="796.0,324.0 786.0,329.5 786.0,318.5" fill="var(--p)"/><rect x="800.0" y="294.0" width="330.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="965.0" y="329.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">The action runs</text><rect x="60.0" y="368.0" width="1080.0" height="56.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="401.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Cases no rule covers: handed to a person, with evidence attached</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Actions run automatically only when an authorized person’s rule permits.</text></svg>
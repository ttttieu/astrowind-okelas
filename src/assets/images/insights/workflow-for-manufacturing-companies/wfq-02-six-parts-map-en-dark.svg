<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Six parts of the map: why a workflow in place still runs slow, from request approval to event action, rule or person, context, AI doing two jobs and its boundary, the five-level journey." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Six parts of the workflow map for manufacturers</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Each part answers a question and leads to detailed articles.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="346.0" height="150.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="169.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Why a workflow still runs slow</text><text x="84.0" y="235.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Digitized is not optimized; dependence on</text><text x="84.0" y="254.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">people; email and Excel</text><rect x="427.0" y="134.0" width="346.0" height="150.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="#2B74F5"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="169.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">From request → approval to</text><text x="489.0" y="193.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">event → action</text><text x="451.0" y="235.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Work starts from an event, not from</text><text x="451.0" y="254.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">someone remembering</text><rect x="794.0" y="134.0" width="346.0" height="150.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="#2B74F5"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="856.0" y="169.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule or person</text><text x="818.0" y="235.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Rules for repeating cases, people for</text><text x="818.0" y="254.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">judgment, a path for exceptions</text><rect x="60.0" y="300.0" width="346.0" height="150.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="336.0" r="15" fill="#2B74F5"/><text x="94.0" y="341.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122.0" y="335.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Context</text><text x="84.0" y="401.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Precedent and special terms with an owner</text><text x="84.0" y="420.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and an expiry</text><rect x="427.0" y="300.0" width="346.0" height="150.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="336.0" r="15" fill="#A78BFA"/><text x="461.0" y="341.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="489.0" y="335.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">AI: two jobs and a boundary</text><text x="451.0" y="401.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Interpret input, prepare evidence; does</text><text x="451.0" y="420.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">not decide</text><rect x="794.0" y="300.0" width="346.0" height="150.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="828.0" cy="336.0" r="15" fill="#2B74F5"/><text x="828.0" y="341.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="856.0" y="335.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">The five-level journey</text><text x="818.0" y="401.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Per process; choose the economically</text><text x="818.0" y="420.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">sensible next step</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Start with the process causing the most loss.</text></svg>
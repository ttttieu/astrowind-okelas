<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The operating chain: process, workflow, event, evidence, knowledge, decision, action; the decision belongs to a rule issued by an authorized person or to a person, and an action runs only when a rule permits." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="470" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">From process to action: the operating chain of a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">A good workflow answers: what triggers it, which rule applies, who is accountable.</text><line x1="60.0" y1="408.0" x2="1140.0" y2="408.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="430.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="150.0" width="132.0" height="72.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.8"/><text x="126.0" y="191.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Process</text><text x="62.0" y="249.8" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">The process on</text><text x="62.0" y="268.0" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">paper: intent</text><line x1="195.0" y1="186.0" x2="207.0" y2="186.0" stroke="#2B74F5" stroke-width="2.4"/><polygon points="215.0,186.0 207.0,190.4 207.0,181.6" fill="#2B74F5"/><rect x="218.0" y="150.0" width="132.0" height="72.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="284.0" y="191.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Workflow</text><text x="220.0" y="249.8" font-size="13" font-weight="400" fill="#E5ECF6" text-anchor="start">How the process</text><text x="220.0" y="268.0" font-size="13" font-weight="400" 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The operating chain: process, workflow, event, evidence, knowledge, decision, action; the decision belongs to a rule issued by an authorized person or to a person, and an action runs only when a rule permits." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="470" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From process to action: the operating chain of a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A good workflow answers: what triggers it, which rule applies, who is accountable.</text><line x1="60.0" y1="408.0" x2="1140.0" y2="408.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="430.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="126.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Process</text><text x="62.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The process on</text><text x="62.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">paper: intent</text><line x1="195.0" y1="186.0" x2="207.0" y2="186.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="215.0,186.0 207.0,190.4 207.0,181.6" fill="var(--p)"/><rect x="218.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="284.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow</text><text x="220.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">How the process</text><text x="220.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">actually runs</text><line x1="353.0" y1="186.0" x2="365.0" y2="186.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="373.0,186.0 365.0,190.4 365.0,181.6" fill="var(--p)"/><rect x="376.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="442.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Event</text><text x="378.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The event that</text><text x="378.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">triggers work</text><line x1="511.0" y1="186.0" x2="523.0" y2="186.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="531.0,186.0 523.0,190.4 523.0,181.6" fill="var(--p)"/><rect x="534.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Evidence</text><text x="536.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The file and</text><text x="536.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">evidence that come</text><text x="536.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">with it</text><line x1="669.0" y1="186.0" x2="681.0" y2="186.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="689.0,186.0 681.0,190.4 681.0,181.6" fill="var(--p)"/><rect x="692.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="758.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge</text><text x="694.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Precedent and</text><text x="694.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">context with</text><text x="694.0" y="286.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">an owner</text><line x1="827.0" y1="186.0" x2="839.0" y2="186.0" stroke="var(--a)" stroke-width="2.4"/><polygon points="847.0,186.0 839.0,190.4 839.0,181.6" fill="var(--a)"/><rect x="850.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="916.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision</text><text x="852.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">A rule issued by</text><text x="852.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">people, or a person</text><line x1="985.0" y1="186.0" x2="997.0" y2="186.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="1005.0,186.0 997.0,190.4 997.0,181.6" fill="var(--p)"/><rect x="1008.0" y="150.0" width="132.0" height="72.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1074.0" y="191.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Action</text><text x="1010.0" y="249.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Runs when a</text><text x="1010.0" y="268.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">rule permits</text><rect x="60.0" y="322.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="355.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The decision is the one place not handed to AI.</text></svg>
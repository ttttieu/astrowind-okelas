<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Câu hỏi về sản phẩm có tỷ lệ sai sót cao nhất và nhà cung cấp nguyên liệu cần đi theo chuỗi dữ liệu sai sót, sản phẩm, nguyên liệu, nhà cung cấp; bốn nguồn rời nhau thì không AI trả lời được, được liên kết thì có câu trả lời." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Câu hỏi vận hành cần đi theo chuỗi quan hệ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khi bốn loại thông tin nằm rời nhau, không AI nào trả lời được.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi ví dụ theo bài viết; sơ đồ minh họa khái niệm, không phải số liệu đo lường.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="49.6" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="84.0" y="164.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Trong quý vừa qua, sản phẩm nào có tỷ lệ sai sót cao nhất, và nguyên liệu của sản phẩm đó đến từ nhà cung cấp nào?</text><rect x="60.0" y="199.6" width="528.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="238.7" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn nguồn rời nhau</text><rect x="84.0" y="261.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="138.0" y="285.8" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu</text><text x="138.0" y="302.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">sai sót (QC)</text><rect x="208.0" y="281.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="262.0" y="314.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm</text><rect x="332.0" y="261.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="386.0" y="294.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nguyên liệu</text><rect x="456.0" y="281.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="510.0" y="314.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhà cung cấp</text><text x="84.0" y="375.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn file hoặc bốn hệ thống không liên thông: không AI nào trả</text><text x="84.0" y="396.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">lời được, dù AI tốt đến đâu.</text><rect x="612.0" y="199.6" width="528.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="238.7" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn loại thông tin được liên kết</text><rect x="636.0" y="271.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="690.0" y="295.8" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu</text><text x="690.0" y="312.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">sai sót (QC)</text><line x1="745.0" y1="299.6" x2="753.0" y2="299.6" stroke="var(--s)" stroke-width="1.8"/><polygon points="759.0,299.6 753.0,302.9 753.0,296.3" fill="var(--s)"/><rect x="760.0" y="271.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="814.0" y="304.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm</text><line x1="869.0" y1="299.6" x2="877.0" y2="299.6" stroke="var(--s)" stroke-width="1.8"/><polygon points="883.0,299.6 877.0,302.9 877.0,296.3" fill="var(--s)"/><rect x="884.0" y="271.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="938.0" y="304.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nguyên liệu</text><line x1="993.0" y1="299.6" x2="1001.0" y2="299.6" stroke="var(--s)" stroke-width="1.8"/><polygon points="1007.0,299.6 1001.0,302.9 1001.0,296.3" fill="var(--s)"/><rect x="1008.0" y="271.6" width="108.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="1062.0" y="304.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhà cung cấp</text><text x="636.0" y="375.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Đi theo chuỗi quan hệ là có câu trả lời, và ghi nhận một lần có</text><text x="636.0" y="396.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">thể dùng cho nhiều mục đích.</text><rect x="60.0" y="445.6" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.2" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây không phải câu hỏi về nội dung văn bản, mà về quan hệ giữa các thực thể.</text></svg>
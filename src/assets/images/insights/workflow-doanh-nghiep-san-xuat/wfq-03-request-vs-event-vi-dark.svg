<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mô hình request approval bắt đầu khi có người gửi yêu cầu rồi chờ người duyệt mới có hành động; mô hình event action bắt đầu từ sự kiện, rule cho phép thì hành động chạy, ca rule không phủ được chuyển cho người." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Từ request → approval sang event → action</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Điều đổi là cái kích hoạt công việc, và việc nào không cần chờ người.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="150.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Mô hình phê duyệt</text><rect x="60.0" y="166.0" width="330.0" height="60.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><text x="225.0" y="201.5" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="middle">Người nhớ gửi yêu cầu</text><line x1="394.0" y1="196.0" x2="416.0" y2="196.0" stroke="#5B6575" stroke-width="3"/><polygon points="426.0,196.0 416.0,201.5 416.0,190.5" fill="#5B6575"/><rect x="430.0" y="166.0" width="330.0" height="60.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><text x="595.0" y="201.5" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="middle">Chờ người duyệt</text><line x1="764.0" y1="196.0" x2="786.0" y2="196.0" stroke="#5B6575" stroke-width="3"/><polygon points="796.0,196.0 786.0,201.5 786.0,190.5" fill="#5B6575"/><rect x="800.0" y="166.0" width="330.0" height="60.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.6"/><text x="965.0" y="201.5" font-size="15" font-weight="700" fill="#9AA6B8" text-anchor="middle">Hành động</text><text x="60.0" y="278.9" font-size="16" font-weight="700" fill="#5FA0FF" text-anchor="start">Mô hình event → action</text><rect x="60.0" y="294.0" width="330.0" height="60.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><text x="225.0" y="329.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Sự kiện xảy ra</text><line x1="394.0" y1="324.0" x2="416.0" y2="324.0" stroke="#2B74F5" stroke-width="3"/><polygon points="426.0,324.0 416.0,329.5 416.0,318.5" fill="#2B74F5"/><rect x="430.0" y="294.0" width="330.0" height="60.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="595.0" y="329.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Rule cho phép?</text><line x1="764.0" y1="324.0" x2="786.0" y2="324.0" stroke="#2B74F5" stroke-width="3"/><polygon points="796.0,324.0 786.0,329.5 786.0,318.5" fill="#2B74F5"/><rect x="800.0" y="294.0" width="330.0" height="60.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="965.0" y="329.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Hành động chạy</text><rect x="60.0" y="368.0" width="1080.0" height="56.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="600.0" y="401.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="middle">Ca rule không phủ được: chuyển cho người, có evidence đi kèm</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Hành động chỉ tự chạy khi có rule do người có thẩm quyền ban hành.</text></svg>
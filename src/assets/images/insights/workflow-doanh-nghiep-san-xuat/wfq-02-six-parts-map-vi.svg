<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Sáu phần của bản đồ: vì sao có workflow vẫn chậm, từ request approval sang event action, rule hay con người, context, AI làm hai việc và ranh giới, hành trình năm cấp." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu phần của bản đồ workflow cho doanh nghiệp sản xuất</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi phần trả lời một câu hỏi và dẫn tới các bài chi tiết.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="346.0" height="150.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao có workflow vẫn chậm</text><text x="84.0" y="235.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Số hóa chưa phải tối ưu; phụ thuộc người;</text><text x="84.0" y="254.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">email và Excel</text><rect x="427.0" y="134.0" width="346.0" height="150.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="15" fill="var(--p)"/><text x="461.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Từ request → approval sang</text><text x="489.0" y="193.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">event → action</text><text x="451.0" y="235.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Việc bắt đầu từ sự kiện, không chờ người</text><text x="451.0" y="254.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhớ gửi</text><rect x="794.0" y="134.0" width="346.0" height="150.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="856.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Rule hay con người</text><text x="818.0" y="235.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rule cho ca lặp lại, người cho ca cần</text><text x="818.0" y="254.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phán đoán, ngoại lệ có đường đi</text><rect x="60.0" y="300.0" width="346.0" height="150.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="336.0" r="15" fill="var(--p)"/><text x="94.0" y="341.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="122.0" y="335.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Context</text><text x="84.0" y="401.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tiền lệ và điều kiện riêng có chủ sở hữu</text><text x="84.0" y="420.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và hạn dùng</text><rect x="427.0" y="300.0" width="346.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="461.0" cy="336.0" r="15" fill="var(--a)"/><text x="461.0" y="341.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="489.0" y="335.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">AI: hai việc và ranh giới</text><text x="451.0" y="401.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Diễn giải đầu vào, chuẩn bị evidence;</text><text x="451.0" y="420.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không quyết định</text><rect x="794.0" y="300.0" width="346.0" height="150.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="336.0" r="15" fill="var(--p)"/><text x="828.0" y="341.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="856.0" y="335.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hành trình năm cấp</text><text x="818.0" y="401.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Dùng cho từng quy trình; chọn bước tiếp</text><text x="818.0" y="420.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">theo có ý nghĩa kinh tế</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bắt đầu từ quy trình đang gây tổn thất nhất.</text></svg>
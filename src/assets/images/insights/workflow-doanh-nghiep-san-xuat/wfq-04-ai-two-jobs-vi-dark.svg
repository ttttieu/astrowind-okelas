<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="AI làm hai việc: diễn giải đầu vào không cấu trúc để rule chạy được và chuẩn bị evidence để con người phán đoán; quyết định thuộc về rule do người có thẩm quyền ban hành hoặc con người; AI không quyết định, không thêm hay sửa rule, không tự chạy hành động." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="612" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">AI làm hai việc, quyết định không chuyển sang AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">AI làm việc trước và quanh quyết định.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="534.0" height="112.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="#2B74F5"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122.0" y="175.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Việc 1 · Diễn giải đầu vào</text><text x="84.0" y="218.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Email, bản scan, ghi chú thành dạng rule đọc được</text><rect x="606.0" y="134.0" width="534.0" height="112.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="#2B74F5"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="668.0" y="175.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Việc 2 · Chuẩn bị evidence</text><text x="630.0" y="218.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Hồ sơ, tiền lệ, dữ liệu liên quan cho người phán đoán</text><rect x="60.0" y="262.0" width="1080.0" height="96.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="292.8" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="start">Quyết định</text><text x="84.0" y="323.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule do người có thẩm quyền ban hành, hoặc con người</text><rect x="60.0" y="374.0" width="1080.0" height="100.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="402.8" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="start">AI không làm</text><rect x="84.0" y="418.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="254.0" y="445.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Quyết định</text><rect x="436.0" y="418.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="606.0" y="445.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Thêm hoặc sửa rule</text><rect x="788.0" y="418.0" width="340.0" height="44.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="958.0" y="445.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Tự chạy hành động</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Rule chỉ đổi khi người có thẩm quyền ban hành từ tiền lệ đã xác nhận.</text></svg>
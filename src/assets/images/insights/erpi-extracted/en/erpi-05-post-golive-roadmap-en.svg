<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="A post go-live roadmap with five parts: an honest current-state assessment, fixing data quality first, leadership-ready reporting, a clear governance structure and ERP knowledge management." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="514" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">A post go-live roadmap to close the gap</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Closing the gap is the next phase, with different goals and methods than implementation.</text><line x1="60.0" y1="430.0" x2="1140.0" y2="430.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="452.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="493.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Honest current-state</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">assessment</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Around 6–12 months after</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">go-live, covering data</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quality and user behavior.</text><rect x="279.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--p)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Fix data quality first</text><text x="295.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">All other adoption work</text><text x="295.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">depends on it.</text><rect x="498.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Leadership-ready</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">reporting</text><text x="514.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Aligned to how decisions</text><text x="514.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">are made; one of the</text><text x="514.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">highest-leverage actions.</text><rect x="717.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--p)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clear governance</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">structure</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">System Owner, Master</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Data Manager, change</text><text x="733.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">request process, periodic</text><text x="733.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quality monitoring.</text><rect x="936.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--p)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">ERP knowledge</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">management</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Document configuration,</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">rationale and module</text><text x="952.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">links so knowledge</text><text x="952.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">survives turnover.</text><rect x="60.0" y="360.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="393.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">It takes a deliberate post-go-live roadmap, not waiting for the system to settle.</text></svg>
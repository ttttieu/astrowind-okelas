<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="Seven signs that ERP is implemented but not adopted, with a threshold of three or more." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="550" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Seven signs: implemented but not adopted?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each sign shows ERP has not entered real operations.</text><line x1="60.0" y1="466.0" x2="1140.0" y2="466.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="488.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The checklist and 3-of-7 threshold are the article’s self-assessment convention, not a certified methodology.</text><text x="60.0" y="529.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="191.5" r="15" fill="var(--p)"/><text x="90.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="165.9" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Someone keeps a</text><text x="116.0" y="186.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">personal Excel “shadow</text><text x="116.0" y="207.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">system” they trust more</text><text x="116.0" y="228.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">than ERP</text><rect x="334.0" y="134.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="364.0" cy="191.5" r="15" fill="var(--p)"/><text x="364.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="390.0" y="176.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ERP reports need manual</text><text x="390.0" y="197.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">double-checking</text><rect x="608.0" y="134.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="191.5" r="15" fill="var(--p)"/><text x="638.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="664.0" y="176.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">New hires learn the</text><text x="664.0" y="197.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">real way of working</text><text x="664.0" y="217.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">from colleagues</text><rect x="882.0" y="134.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="912.0" cy="191.5" r="15" fill="var(--p)"/><text x="912.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="938.0" y="186.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Some modules or fields</text><text x="938.0" y="207.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">are mostly empty</text><rect x="60.0" y="264.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="321.5" r="15" fill="var(--p)"/><text x="90.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="116.0" y="306.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">When something goes</text><text x="116.0" y="327.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">wrong, people check the</text><text x="116.0" y="347.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">spreadsheet first</text><rect x="334.0" y="264.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="364.0" cy="321.5" r="15" fill="var(--p)"/><text x="364.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="390.0" y="306.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ERP usage drops</text><text x="390.0" y="327.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">noticeably in</text><text x="390.0" y="347.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">busy periods</text><rect x="608.0" y="264.0" width="259.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="321.5" r="15" fill="var(--p)"/><text x="638.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="664.0" y="306.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nobody has measured</text><text x="664.0" y="327.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">whether ERP reduced</text><text x="664.0" y="347.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">errors or cycle times</text><rect x="60.0" y="395.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="428.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">3 or more of 7 signs: ERP is implemented but not truly adopted.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="Lộ trình sau go-live gồm năm việc: đánh giá hiện trạng trung thực, xử lý chất lượng dữ liệu trước, báo cáo và dashboard cho lãnh đạo, cấu trúc governance rõ ràng và quản lý tri thức ERP." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="514" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lộ trình sau go-live để thu hẹp khoảng cách</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Thu hẹp khoảng cách là giai đoạn tiếp theo, với mục tiêu và phương pháp khác implementation.</text><line x1="60.0" y1="430.0" x2="1140.0" y2="430.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="452.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="493.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Đánh giá hiện trạng</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">trung thực</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Khoảng 6–12 tháng sau</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">go-live, nhìn cả chất</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lượng dữ liệu lẫn hành</text><text x="76.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vi người dùng.</text><rect x="279.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--p)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Xử lý chất lượng</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">dữ liệu trước</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mọi cải thiện adoption</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">khác đều phụ thuộc</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vào đây.</text><rect x="498.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Báo cáo, dashboard</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">cho lãnh đạo</text><text x="514.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Phù hợp cách lãnh đạo</text><text x="514.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">ra quyết định; một trong</text><text x="514.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">những việc có đòn bẩy</text><text x="514.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cao nhất.</text><rect x="717.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--p)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Cấu trúc governance</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">rõ ràng</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">System Owner, Master</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Data Manager, quy trình</text><text x="733.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Change Request, giám sát</text><text x="733.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chất lượng định kỳ.</text><rect x="936.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--p)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quản lý tri thức ERP</text><text x="952.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Lưu cấu hình, lý do</text><text x="952.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định và liên kết giữa</text><text x="952.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">các module để không mất</text><text x="952.0" y="297.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">khi nhân sự đổi.</text><rect x="60.0" y="360.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="393.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cần lộ trình sau go-live có chủ đích, không chờ hệ thống tự ổn định.</text></svg>
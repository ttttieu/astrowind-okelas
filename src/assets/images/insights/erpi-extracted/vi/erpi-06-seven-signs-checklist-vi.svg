<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-label="Bảy dấu hiệu ERP đã triển khai nhưng chưa được áp dụng, với ngưỡng từ ba dấu hiệu trở lên." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="508" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bảy dấu hiệu: đã triển khai nhưng chưa được áp dụng?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi dấu hiệu là một biểu hiện của việc ERP chưa đi vào vận hành thật.</text><line x1="60.0" y1="424.0" x2="1140.0" y2="424.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="446.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Checklist và ngưỡng 3/7 là quy ước tự đánh giá của bài viết, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="487.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="181.0" r="15" fill="var(--p)"/><text x="90.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="165.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có người giữ file</text><text x="116.0" y="186.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Excel “ngầm” mà họ</text><text x="116.0" y="207.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">tin hơn ERP</text><rect x="334.0" y="134.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="364.0" cy="181.0" r="15" fill="var(--p)"/><text x="364.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="390.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Báo cáo ERP luôn phải</text><text x="390.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">kiểm tra lại thủ công</text><rect x="608.0" y="134.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="181.0" r="15" fill="var(--p)"/><text x="638.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="664.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân viên mới học cách</text><text x="664.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">làm thật từ đồng nghiệp</text><rect x="882.0" y="134.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="912.0" cy="181.0" r="15" fill="var(--p)"/><text x="912.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="938.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Một số module hoặc</text><text x="938.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">trường gần như trống</text><rect x="60.0" y="243.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="290.0" r="15" fill="var(--p)"/><text x="90.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="116.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Khi có sự cố, mọi người</text><text x="116.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">mở Excel trước</text><rect x="334.0" y="243.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="364.0" cy="290.0" r="15" fill="var(--p)"/><text x="364.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="390.0" y="274.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Mức dùng ERP giảm</text><text x="390.0" y="295.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">rõ rệt vào giai đoạn</text><text x="390.0" y="316.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">cao điểm</text><rect x="608.0" y="243.0" width="259.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="290.0" r="15" fill="var(--p)"/><text x="638.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="664.0" y="274.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Chưa từng đo ERP có</text><text x="664.0" y="295.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">giảm lỗi hay rút ngắn thời</text><text x="664.0" y="316.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">gian không</text><rect x="60.0" y="353.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="386.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ 3/7 dấu hiệu trở lên: ERP đã được triển khai nhưng chưa được áp dụng thực sự.</text></svg>
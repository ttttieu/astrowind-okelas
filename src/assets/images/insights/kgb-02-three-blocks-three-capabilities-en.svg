<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 638" width="1200" height="638" role="img" aria-label="The three building blocks of a knowledge graph are entities, relationships and properties; they enable query by relationship, impact analysis and AI with context." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="638" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three building blocks, three new capabilities</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Structured knowledge can be queried, linked and used by AI.</text><line x1="60.0" y1="554.0" x2="1140.0" y2="554.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="576.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="617.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="147.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Three building blocks of a knowledge graph</text><rect x="60.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Entities</text><text x="80.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">The “things” in the business: products,</text><text x="80.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">processes, raw materials, suppliers,</text><text x="80.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">equipment, people, events, decisions.</text><rect x="426.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="446.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Relationships</text><text x="446.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">How entities connect: “Product A uses</text><text x="446.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Material M”, “Incident Y led to a change in</text><text x="446.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Process Z”.</text><rect x="792.0" y="158.0" width="348.0" height="124.8" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="812.0" y="193.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Properties</text><text x="812.0" y="220.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Information about each entity:</text><text x="812.0" y="240.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">specifications, effective dates, responsible</text><text x="812.0" y="260.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">person, current status.</text><line x1="600.0" y1="288.8" x2="600.0" y2="302.8" stroke="var(--mut)" stroke-width="2"/><polygon points="600.0,310.8 595.6,302.8 604.4,302.8" fill="var(--mut)"/><text x="60.0" y="332.5" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Three things that become possible</text><rect x="60.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Query by relationship</text><text x="80.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Which processes are currently using raw</text><text x="80.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">materials from Supplier XYZ?</text><rect x="426.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="446.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Impact analysis</text><text x="446.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">If we change the acceptance criteria for</text><text x="446.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Material M, which products and processes</text><text x="446.0" y="444.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">are affected?</text><rect x="792.0" y="342.8" width="348.0" height="124.8" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="812.0" y="377.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI with context</text><text x="812.0" y="405.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI knows what an entity relates to, so it can</text><text x="812.0" y="425.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">answer operational questions rather than</text><text x="812.0" y="444.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">only summarize documents.</text><rect x="60.0" y="483.6" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="517.2" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Structured knowledge: record relationships once, use them many times and for many purposes.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Three columns: chatbot, AI tool, AI agent; each has a description and a final line stating who controls the next step." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot, AI tool, agent: who controls the next step?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A chatbot answers and stops; an AI tool runs a predefined task; an AI agent plans steps, picks tools and acts.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Classification as set out in the article; not an official standard.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="218.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot</text><text x="84.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Produces a text answer, then stops.</text><text x="84.0" y="290.8" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Who controls the next step?</text><text x="84.0" y="319.6" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">The person</text><line x1="404.0" y1="285.0" x2="414.0" y2="285.0" stroke="var(--p)" stroke-width="2"/><polygon points="422.0,285.0 414.0,289.4 414.0,280.6" fill="var(--p)"/><rect x="426.0" y="176.0" width="340.0" height="218.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="450.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI tool</text><text x="450.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Performs a specific task such as</text><text x="450.0" y="271.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">summarizing or classifying, following a</text><text x="450.0" y="292.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">predefined script.</text><text x="450.0" y="333.4" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Who controls the next step?</text><text x="450.0" y="362.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">The predefined script</text><line x1="770.0" y1="285.0" x2="780.0" y2="285.0" stroke="var(--p)" stroke-width="2"/><polygon points="788.0,285.0 780.0,289.4 780.0,280.6" fill="var(--p)"/><rect x="792.0" y="176.0" width="340.0" height="218.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="816.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI agent</text><text x="816.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Plans multiple steps, chooses tools and</text><text x="816.0" y="271.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">adjusts to intermediate results.</text><text x="816.0" y="312.1" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Who controls the next step?</text><text x="816.0" y="340.9" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">The AI</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The difference lies in who controls the next action.</text></svg>
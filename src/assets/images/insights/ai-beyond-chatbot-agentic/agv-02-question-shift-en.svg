<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="Two cards: the old question of whether AI is smart enough, and the new question of who or what stops AI from acting wrongly." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="534" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The question shifts from “smart enough?” to “who stops it?”</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A wrong chatbot answer can be checked before use; a wrong agent action can take effect before anyone intervenes.</text><line x1="60.0" y1="450.0" x2="1140.0" y2="450.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="472.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis based on the article; no measured data.</text><text x="60.0" y="513.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="186.0" width="440.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="225.0" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">The old question</text><text x="84.0" y="264.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Is this AI smart enough to</text><text x="84.0" y="292.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">answer correctly?</text><line x1="516.0" y1="261.0" x2="552.0" y2="261.0" stroke="var(--p)" stroke-width="3"/><polygon points="564.0,261.0 552.0,267.6 552.0,254.4" fill="var(--p)"/><rect x="580.0" y="186.0" width="560.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="2"/><text x="604.0" y="225.0" font-size="14" font-weight="700" fill="var(--p)" text-anchor="start">The new question</text><text x="604.0" y="264.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Who or what stops the AI before it</text><text x="604.0" y="292.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">acts wrongly?</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">With an agent, the risk lies in actions that may be irreversible.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 506" width="1200" height="506" role="img" aria-label="Ba đặc điểm khiến Excel khó bị thay thế: linh hoạt về cấu trúc, phân tích và trình bày tức thì, và không cần IT để thay đổi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="506" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba đặc điểm khiến Excel khó bị thay thế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sức mạnh của Excel cũng là nguồn gốc của vấn đề.</text><line x1="60.0" y1="422.0" x2="1140.0" y2="422.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="444.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="485.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="202.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Linh hoạt về cấu trúc</text><line x1="82.0" y1="218.0" x2="386.0" y2="218.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="249.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không có schema cứng. Đổi logic ngay khi</text><text x="82.0" y="268.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cần. Phần mềm chuyên biệt có schema định</text><text x="82.0" y="288.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sẵn, thực tế lệch thì phát sinh ma sát.</text><rect x="426.0" y="134.0" width="348.0" height="202.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Phân tích và trình bày tức thì</text><line x1="448.0" y1="218.0" x2="752.0" y2="218.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="249.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lọc, sắp xếp, tính toán, tạo biểu đồ trong</text><text x="448.0" y="268.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cùng một file. Với phân tích ad hoc, người</text><text x="448.0" y="288.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">dùng vẫn export ra Excel.</text><rect x="792.0" y="134.0" width="348.0" height="202.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không cần IT để thay đổi</text><line x1="814.0" y1="218.0" x2="1118.0" y2="218.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="249.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thêm cột, đổi cấu trúc, tạo tab mới ngay lập</text><text x="814.0" y="268.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tức, không cần ticket hay chờ customization.</text><rect x="60.0" y="352.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="385.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đây là sức mạnh thực sự của Excel, và cũng là nguồn gốc của vấn đề.</text></svg>
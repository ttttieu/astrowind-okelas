<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn nguồn customization không cần thiết: quy trình chưa chuẩn hóa, không muốn thay đổi cách làm việc, áp lực timeline và yêu cầu báo cáo chưa phân tích." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn nguồn customization không cần thiết</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Customization thường là phản ứng, không phải quyết định có phân tích.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình chưa</text><text x="76.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">chuẩn hóa</text><text x="76.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Bắt ERP chạy theo cách cũ thay</text><text x="76.0" y="248.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vì xem xét lại quy trình.</text><rect x="334.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Không muốn</text><text x="350.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">thay đổi cách làm việc</text><text x="350.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ít kháng cự trong ngắn hạn,</text><text x="350.0" y="248.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhưng tốn kém về dài hạn.</text><rect x="608.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Áp lực timeline</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Deadline gấp khiến nhà triển khai</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chọn giải pháp nhanh.</text><rect x="882.0" y="134.0" width="259.0" height="139.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu báo cáo chưa</text><text x="898.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">phân tích</text><text x="898.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Báo cáo chuẩn của ERP đã đáp</text><text x="898.0" y="248.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ứng được chưa?</text><rect x="60.0" y="289.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="322.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần lớn customization bắt nguồn từ quy trình chưa chuẩn hóa hoặc yêu cầu chưa phân tích.</text></svg>
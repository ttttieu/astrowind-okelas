<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Tacit knowledge can be partially converted to explicit form through decision frameworks, decision tables and case studies; the felt sense of balance, aesthetic perception, synthesis of subtle signals and relationship trust cannot be fully converted." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Converting tacit to explicit: how far?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three ways to capture part of it, and what stays with people.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Examples from the article for manufacturing SMEs, not measured data.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="660.0" height="318.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Can be partially converted</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Imperfect, but more useful than nothing</text><rect x="84.0" y="218.0" width="200.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="184.0" y="244.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sensory assessment</text><text x="184.0" y="261.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">experience</text><line x1="290.0" y1="248.0" x2="322.0" y2="248.0" stroke="var(--mut)" stroke-width="2"/><polygon points="330.0,248.0 322.0,252.4 322.0,243.6" fill="var(--mut)"/><rect x="336.0" y="218.0" width="360.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="516.0" y="244.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision framework: acceptable range, abnormal</text><text x="516.0" y="261.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">indicators to report</text><rect x="84.0" y="292.0" width="200.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="184.0" y="318.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Judgment of</text><text x="184.0" y="335.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">experienced people</text><line x1="290.0" y1="322.0" x2="322.0" y2="322.0" stroke="var(--mut)" stroke-width="2"/><polygon points="330.0,322.0 322.0,326.4 322.0,317.6" fill="var(--mut)"/><rect x="336.0" y="292.0" width="360.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="516.0" y="318.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision table: when X and Y occur together, the</text><text x="516.0" y="335.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">steps to follow</text><rect x="84.0" y="366.0" width="200.0" height="60.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="184.0" y="392.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Non-standard incidents</text><text x="184.0" y="409.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">that occurred</text><line x1="290.0" y1="396.0" x2="322.0" y2="396.0" stroke="var(--mut)" stroke-width="2"/><polygon points="330.0,396.0 322.0,400.4 322.0,391.6" fill="var(--mut)"/><rect x="336.0" y="366.0" width="360.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="516.0" y="392.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Case study: the problem, how it was handled,</text><text x="516.0" y="409.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">the outcome</text><rect x="740.0" y="134.0" width="400.0" height="318.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="764.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Cannot be fully converted</text><rect x="764.0" y="218.0" width="352.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="940.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">The felt sense of balance</text><rect x="764.0" y="274.0" width="352.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="940.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Aesthetic perception</text><rect x="764.0" y="330.0" width="352.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="940.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Synthesis of many subtle signals at once</text><rect x="764.0" y="386.0" width="352.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="940.0" y="415.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Relationship trust between people</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Partially, but never completely.</text></svg>
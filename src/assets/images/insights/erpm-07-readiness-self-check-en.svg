<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four self-assessment areas for manufacturing readiness, each with one representative question: BOM and routing, traceability, quality and industry-specific needs." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Manufacturing readiness self-assessment: four areas</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each area carries one representative question from the full list in the article.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">BOM and routing</text><text x="76.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is there an accurate, current</text><text x="76.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">BOM for all in-scope products?</text><rect x="334.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is lot tracking required, and how</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">is lot data recorded today?</text><rect x="608.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quality</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Have inspection points in</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the production process</text><text x="624.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">been defined?</text><rect x="882.0" y="134.0" width="259.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Industry-specific needs</text><text x="898.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Have yield, unit-of-measure and</text><text x="898.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">material needs been discussed</text><text x="898.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">with the partner?</text><rect x="60.0" y="284.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="317.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Manufacturing readiness is a prerequisite, not something to resolve during implementation.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Bốn lý do scope creep phổ biến trong ERP: ERP liên quan toàn bộ tổ chức, yêu cầu xuất hiện trong lúc triển khai, tác động của thay đổi nhỏ bị đánh giá thấp và thiếu governance, là nguyên nhân gốc rễ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="496" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn lý do scope creep phổ biến trong ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Nguyên nhân gốc rễ là thiếu người hoặc quy trình quyết định yêu cầu.</text><line x1="60.0" y1="412.0" x2="1140.0" y2="412.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="434.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="475.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ERP liên quan đến toàn</text><text x="76.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">bộ tổ chức</text><text x="76.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mọi bộ phận đều có yêu cầu</text><text x="76.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và coi yêu cầu của mình là</text><text x="76.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">khẩn cấp.</text><rect x="334.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="350.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu xuất hiện trong</text><text x="350.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">lúc triển khai</text><text x="350.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Người dùng thấy thiếu sót khi</text><text x="350.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">xem demo hoặc prototype.</text><rect x="608.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tác động của thay đổi</text><text x="624.0" y="229.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">nhỏ bị đánh giá thấp</text><text x="624.0" y="260.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thêm một trường có thể ảnh</text><text x="624.0" y="280.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hưởng phê duyệt, logic tính toán</text><text x="624.0" y="300.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và báo cáo.</text><rect x="882.0" y="134.0" width="259.0" height="191.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><rect x="898.0" y="150.0" width="140.4" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="968.2" y="166.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Nguyên nhân gốc rễ</text><text x="898.0" y="205.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thiếu governance</text><text x="898.0" y="235.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Không ai quyết định yêu cầu nào</text><text x="898.0" y="255.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vào giai đoạn một, để sau hay bị</text><text x="898.0" y="275.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">từ chối.</text><rect x="60.0" y="341.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="374.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khi không có cấu trúc, mặc định là “thêm vào”, vì đồng ý tránh được xung đột trước mắt.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Tri thức nằm trong đầu người dẫn tới năm hệ quả tích lũy dần: chất lượng không nhất quán, training kéo dài, nhân sự chủ chốt nghỉ, audit khó và không thể scale." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm hệ quả khi tri thức nằm trong đầu người</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hậu quả không xảy ra ngay. Chúng tích lũy dần.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hệ quả mô tả theo phân tích trong bài, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="52.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="166.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Tri thức nằm trong đầu người</text><line x1="162.0" y1="188.0" x2="162.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="162.0,212.0 157.6,204.0 166.4,204.0" fill="var(--gm)"/><rect x="60.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chất lượng không</text><text x="76.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">nhất quán</text><text x="76.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đầu ra phụ thuộc ai làm</text><text x="76.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hôm nay, rõ nhất khi so</text><text x="76.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">sánh giữa các ca.</text><line x1="381.0" y1="188.0" x2="381.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="381.0,212.0 376.6,204.0 385.4,204.0" fill="var(--gm)"/><rect x="279.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="295.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Training kéo dài</text><text x="295.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tri thức truyền qua miệng</text><text x="295.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">và quan sát; người có</text><text x="295.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">kinh nghiệm mất thời gian</text><text x="295.0" y="367.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đào tạo.</text><line x1="600.0" y1="188.0" x2="600.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,212.0 595.6,204.0 604.4,204.0" fill="var(--gm)"/><rect x="498.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="514.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân sự chủ</text><text x="514.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">chốt nghỉ</text><text x="514.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mức phụ thuộc thường chỉ</text><text x="514.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lộ khi có thông báo nghỉ,</text><text x="514.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lúc đó đã muộn để chuyển</text><text x="514.0" y="367.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">giao đủ.</text><line x1="819.0" y1="188.0" x2="819.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="819.0,212.0 814.6,204.0 823.4,204.0" fill="var(--gm)"/><rect x="717.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="733.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Audit khó, kết quả</text><text x="733.0" y="268.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">không ổn định</text><text x="733.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Phải tái tạo bằng chứng</text><text x="733.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thay vì tổng hợp bằng</text><text x="733.0" y="348.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chứng đã được ghi nhận.</text><line x1="1038.0" y1="188.0" x2="1038.0" y2="204.0" stroke="var(--gm)" stroke-width="2"/><polygon points="1038.0,212.0 1033.6,204.0 1042.4,204.0" fill="var(--gm)"/><rect x="936.0" y="214.0" width="204.0" height="180.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="952.0" y="246.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không thể scale</text><text x="952.0" y="312.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi lần mở rộng phải giải</text><text x="952.0" y="330.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lại bài toán tri thức từ đầu.</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hệ quả tích lũy dần, và thường chỉ rõ khi đã khó xử lý.</text></svg>
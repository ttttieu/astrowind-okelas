<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Four self-assessment questions on dependence on individuals: key people leaving, tracing an incident, new employees looking things up, and audit preparation time." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four questions to assess your organizational knowledge</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The right starting point is an honest assessment, not buying software.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Orienting self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--p)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">If 2–3 of your most important employees left at once,</text><text x="122.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">could the organization run normally?</text><rect x="606.0" y="134.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--p)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">After a quality incident, can you find the cause within a</text><text x="668.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">day, or does it take days of asking around?</text><rect x="60.0" y="250.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="286.0" r="15" fill="var(--p)"/><text x="94.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="286.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Can a new employee look up procedures and</text><text x="122.0" y="308.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">work independently, or depend on a guide for</text><text x="122.0" y="331.0" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">every situation?</text><rect x="606.0" y="250.0" width="534.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="286.0" r="15" fill="var(--p)"/><text x="640.0" y="291.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="286.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When an audit arrives, does preparation take a few</text><text x="668.0" y="308.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">days or several weeks?</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Most answers show dependence on individuals? Start with the most critical process.</text></svg>
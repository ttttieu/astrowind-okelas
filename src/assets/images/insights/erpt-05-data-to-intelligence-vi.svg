<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Dữ liệu ERP cộng bối cảnh cộng kiến thức tổ chức tạo ra trí tuệ tổ chức: hiểu điều đang xảy ra, lý giải nguyên nhân và quyết định dựa trên bằng chứng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ dữ liệu ERP đến trí tuệ tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP cung cấp nền tảng dữ liệu; hai lớp còn lại cần được xây thêm.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu ERP</text><text x="76.0" y="204.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Cho biết điều gì đã xảy ra.</text><text x="319.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="341.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="357.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Bối cảnh</text><text x="357.0" y="204.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Giải thích vì sao dữ liệu như vậy.</text><text x="600.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="622.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="638.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kiến thức tổ chức</text><text x="638.0" y="204.8" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình, con người và cách</text><text x="638.0" y="223.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vận hành thực tế.</text><text x="881.0" y="225.9" font-size="30" font-weight="700" fill="var(--mut)" text-anchor="middle">=</text><rect x="903.0" y="140.0" width="237.0" height="150.0" rx="16" fill="var(--ink)"/><text x="919.0" y="177.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="start">Trí tuệ tổ chức</text><text x="919.0" y="204.8" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">Hiểu điều đang xảy ra, lý giải</text><text x="919.0" y="223.3" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">nguyên nhân, quyết định dựa</text><text x="919.0" y="241.7" font-size="13" font-weight="400" fill="var(--onink)" text-anchor="start">trên bằng chứng.</text><rect x="60.0" y="314.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="347.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP cung cấp nền tảng dữ liệu; bối cảnh và kiến thức tổ chức tạo ra trí tuệ tổ chức.</text></svg>
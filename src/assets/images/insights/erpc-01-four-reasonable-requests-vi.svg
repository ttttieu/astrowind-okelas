<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn yêu cầu điển hình nghe đều hợp lý: thêm module vào giai đoạn một, chỉnh một quy trình, thêm bộ phận ngay giai đoạn đầu và một báo cáo cần có từ ngày đầu; cộng lại, không ai kiểm soát được quy mô dự án." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn yêu cầu nghe đều hợp lý</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Từng yêu cầu có lý do chính đáng; vấn đề nằm ở tổng của chúng.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thêm module vào</text><text x="76.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">giai đoạn một</text><text x="76.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Vì “không thể vận hành thiếu”.</text><rect x="334.0" y="134.0" width="259.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉnh một quy trình</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Để hoạt động “hơi khác”</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">một chút.</text><rect x="608.0" y="134.0" width="259.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thêm bộ phận ngay</text><text x="624.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">giai đoạn đầu</text><text x="624.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thay vì triển khai sau.</text><rect x="882.0" y="134.0" width="259.0" height="120.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Một báo cáo cần có từ</text><text x="898.0" y="197.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ngày đầu</text><text x="898.0" y="228.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cần có ngay khi vận hành.</text><rect x="60.0" y="270.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="303.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mỗi yêu cầu đều có lý do; cộng lại, không ai kiểm soát được quy mô dự án.</text></svg>
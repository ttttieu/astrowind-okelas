<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Ba thẻ lĩnh vực: lập trình, toán học, nghiên cứu khoa học; mỗi thẻ có một kết quả được bài viết nêu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI tiến nhanh nhất ở việc có tiêu chí đúng sai rõ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba lĩnh vực bài viết nêu đạt kết quả đáng chú ý; điểm chung là tiêu chí đo rõ ràng.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Theo bài viết và các công bố được bài viết dẫn; chưa kiểm chứng lại từng nguồn.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="80.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Lập trình</text><text x="80.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SWE-bench Verified: tỷ lệ agent giải đúng</text><text x="80.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">issue GitHub thực tế tăng từ 60% lên gần</text><text x="80.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">100% trong một năm.</text><rect x="424.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="444.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Toán học</text><text x="444.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">IMO 2025: một mô hình Google DeepMind</text><text x="444.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">(Gemini ở chế độ Deep Think) đạt chuẩn huy</text><text x="444.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chương vàng với bài toán đòi hỏi chứng minh</text><text x="444.0" y="265.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sáng tạo.</text><rect x="788.0" y="134.0" width="352.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="808.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Nghiên cứu khoa học</text><text x="808.0" y="205.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Benchmark FrontierScience (12/2025) phủ</text><text x="808.0" y="225.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vật lý, hóa học, sinh học; OpenAI cho rằng</text><text x="808.0" y="245.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">mô hình hàng đầu bắt đầu tăng tốc nghiên</text><text x="808.0" y="265.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cứu thực.</text><rect x="60.0" y="322.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="353.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điểm chung: tiêu chí đúng sai rõ và đo khách quan. Việc cần phán đoán mơ hồ hay quan hệ con người vẫn còn</text><text x="600.0" y="377.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">giới hạn.</text></svg>
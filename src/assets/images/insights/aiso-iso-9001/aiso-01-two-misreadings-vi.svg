<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="Hai thẻ hiểu sai ở trên và một khung đúng ở dưới." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="644" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Hai cách hiểu sai về phần mềm và ISO 9001</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cả hai cách hiểu đều bỏ qua nội dung thật của tiêu chuẩn.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hai cách hiểu sai theo bài viết; khung đúng là cách OKELAS tóm lại.</text><text x="60.0" y="623.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="140.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="86.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Hiểu sai 1: ISO bắt buộc dùng phần mềm</text><text x="86.0" y="244.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Sai: điều khoản 7.5 không nêu phương tiện lưu trữ.</text><rect x="612.0" y="160.0" width="528.0" height="140.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="638.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Hiểu sai 2: ISO không có phần mềm nên không cần eQMS</text><text x="638.0" y="244.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Sai: yêu cầu kiểm soát thông tin vẫn áp dụng.</text><rect x="60.0" y="330.0" width="1080.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="88.0" y="380.2" font-size="19" font-weight="700" fill="var(--a)" text-anchor="start">Đúng: ISO 9001:2015 yêu cầu thông tin được kiểm soát ở bất kỳ dạng nào. Quyết định nên dựa trên chi phí</text><text x="88.0" y="406.8" font-size="19" font-weight="700" fill="var(--a)" text-anchor="start">và rủi ro của hệ thống hiện tại.</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điều đúng là kiểm soát thông tin, không phải phương tiện.</text></svg>
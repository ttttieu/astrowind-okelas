<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Three columns of cards: creating and updating, control, additional scope, each with a list." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Clause 7.5 controls information, not the tool</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Clause 7.5 has three parts: creating and updating, control, and scope.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Clause 7.5 content per the article; the grouping is OKELAS’s arrangement, not standard wording.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Creating and updating</text><text x="84.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Identification</text><text x="84.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Format and medium</text><text x="84.0" y="318.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Review and approval</text><rect x="430.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="454.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Control</text><text x="454.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Availability and protection</text><text x="454.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Distribution and access</text><text x="454.0" y="318.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Storage</text><text x="454.0" y="354.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Version control</text><text x="454.0" y="390.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Retention and disposal</text><rect x="800.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="824.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Additional scope</text><text x="824.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Documents of external origin</text><text x="824.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Retained evidence</text><text x="60.0" y="453.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">No part of clause 7.5 prescribes a tool.</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The standard requires control, not one particular tool.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Two cards side by side: to maintain on the left, to retain on the right, each with one risk line." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Documents to maintain differ from records to retain</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The two kinds of information carry different risks, so control differs too.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Maintain versus retain per the article, referencing Annex A of ISO 9001:2015.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="218.7" font-size="24" font-weight="700" fill="var(--s)" text-anchor="start">To maintain</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Procedures, instructions, policies</text><rect x="88.0" y="310.0" width="472.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="324.0" y="338.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Risk: current version</text><rect x="612.0" y="160.0" width="528.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="640.0" y="218.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">To retain</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Inspection results, audit reports, training records</text><rect x="640.0" y="310.0" width="472.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="876.0" y="338.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Risk: integrity and traceability</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Maintained documents risk version errors; retained records risk integrity and traceability.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 674" width="1200" height="674" role="img" aria-label="Hai cột: đáp ứng được và không đáp ứng, với một thanh ghi chú bên dưới." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="674" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Giấy hay PDF đều được, miễn là được kiểm soát</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phương tiện không quyết định tuân thủ; cách kiểm soát mới quyết định.</text><line x1="60.0" y1="590.0" x2="1140.0" y2="590.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="612.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hai cột theo bài viết; cách đặt cạnh nhau là cách OKELAS trình bày.</text><text x="60.0" y="653.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="220.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="88.0" y="215.0" font-size="22" font-weight="700" fill="var(--s)" text-anchor="start">Đáp ứng được</text><text x="88.0" y="255.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">–  Hệ thống giấy được kiểm soát tốt</text><text x="88.0" y="311.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">–  Hệ thống file điện tử được kiểm soát</text><rect x="612.0" y="160.0" width="528.0" height="220.0" rx="16" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="640.0" y="215.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Không đáp ứng</text><text x="640.0" y="255.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">–  Chuyển giấy sang PDF không kiểm soát</text><text x="640.0" y="311.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">–  Thư mục chia sẻ không có quy tắc kiểm soát</text><rect x="60.0" y="400.0" width="1080.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="435.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Phương tiện điện tử cũng cần kiểm soát quyền truy cập, sao lưu và tính toàn vẹn.</text><rect x="60.0" y="520.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="553.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chuyển giấy sang PDF không kiểm soát không làm hệ thống tuân thủ.</text></svg>
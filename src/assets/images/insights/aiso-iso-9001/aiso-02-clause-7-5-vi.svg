<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Ba cột thẻ: tạo và cập nhật, kiểm soát, phạm vi bổ sung, mỗi cột có danh sách mục." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 7.5 kiểm soát thông tin, không quy định công cụ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 7.5 chia thành ba phần: tạo và cập nhật, kiểm soát, và phạm vi.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nội dung điều khoản 7.5 theo bài viết; các nhóm là cách OKELAS sắp xếp, không phải văn bản chuẩn.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Tạo và cập nhật</text><text x="84.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Nhận diện thông tin</text><text x="84.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Định dạng và phương tiện</text><text x="84.0" y="318.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Xem xét và phê duyệt</text><rect x="430.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="454.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm soát</text><text x="454.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Sẵn có và được bảo vệ</text><text x="454.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Phân phối và truy cập</text><text x="454.0" y="318.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Lưu trữ</text><text x="454.0" y="354.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Kiểm soát phiên bản</text><text x="454.0" y="390.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Lưu giữ và hủy</text><rect x="800.0" y="160.0" width="340.0" height="250.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="824.0" y="210.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Phạm vi bổ sung</text><text x="824.0" y="246.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Tài liệu có nguồn gốc bên ngoài</text><text x="824.0" y="282.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">–  Bằng chứng được lưu giữ</text><text x="60.0" y="453.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không có mục nào trong điều khoản 7.5 quy định công cụ.</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Tiêu chuẩn yêu cầu kiểm soát, không yêu cầu một công cụ cụ thể.</text></svg>
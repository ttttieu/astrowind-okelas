<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 618" width="1200" height="618" role="img" aria-label="Bốn câu hỏi kiểm tra một quy trình: ai làm bước nào, bước nào tạo bằng chứng, điều kiện chuyển bước, ai phê duyệt; mỗi câu có ô chọn “có văn bản” hoặc “chưa rõ”." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="618" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn câu hỏi để kiểm tra một quy trình</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Thiếu một câu trả lời bằng văn bản thường là dấu hiệu quy trình chưa đủ để AI tham gia.</text><line x1="60.0" y1="534.0" x2="1140.0" y2="534.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="556.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn câu hỏi theo bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="597.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="640.0" y="158.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Có văn bản</text><text x="960.0" y="158.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Chưa rõ</text><rect x="60.0" y="170.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="201.0" r="15" fill="var(--p)"/><text x="96.0" y="206.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="206.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ai thực hiện bước nào?</text><rect x="634.0" y="190.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="954.0" y="190.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="60.0" y="242.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="273.0" r="15" fill="var(--p)"/><text x="96.0" y="278.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="130.0" y="278.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Bước nào tạo ra bằng chứng (record, chữ ký, kết quả)?</text><rect x="634.0" y="262.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="954.0" y="262.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="60.0" y="314.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="345.0" r="15" fill="var(--p)"/><text x="96.0" y="350.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="350.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Điều kiện để chuyển sang bước tiếp theo là gì?</text><rect x="634.0" y="334.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="954.0" y="334.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="60.0" y="386.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="417.0" r="15" fill="var(--p)"/><text x="96.0" y="422.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="130.0" y="422.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ai phê duyệt, và trong điều kiện nào?</text><rect x="634.0" y="406.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="954.0" y="406.0" width="22.0" height="22.0" rx="5" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><rect x="60.0" y="464.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="497.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nếu người mới không làm đúng chỉ với văn bản, quy trình chưa đủ để AI tham gia.</text></svg>
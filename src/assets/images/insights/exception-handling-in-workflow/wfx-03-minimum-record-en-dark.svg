<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Seven items to record when handling an exception: situation, point of mismatch, evidence reviewed, decision, decision-maker, reason and reversibility." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="650" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Minimum record for handling an exception</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Enough for someone else, six months later, to understand what happened.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="132.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="160.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Situation</text><rect x="350.0" y="132.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="160.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">What is this case, and when did it happen</text><rect x="60.0" y="186.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="214.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Point of mismatch</text><rect x="350.0" y="186.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="214.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Which rule or criterion could not apply, and why</text><rect x="60.0" y="240.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="268.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Evidence reviewed</text><rect x="350.0" y="240.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="268.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">What data and similar cases the decision rested on</text><rect x="60.0" y="294.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="322.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Decision</text><rect x="350.0" y="294.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="322.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">What was chosen</text><rect x="60.0" y="348.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="376.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Decision-maker</text><rect x="350.0" y="348.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="376.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Who had the authority, and when</text><rect x="60.0" y="402.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="430.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Reason</text><rect x="350.0" y="402.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="430.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Why this was chosen over the alternatives</text><rect x="60.0" y="456.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="484.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Reversibility</text><rect x="350.0" y="456.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="484.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Can the decision be corrected if it was wrong</text><rect x="60.0" y="514.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="547.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Purple marks what only a person can confirm: the decision, the decision-maker, the reason.</text></svg>
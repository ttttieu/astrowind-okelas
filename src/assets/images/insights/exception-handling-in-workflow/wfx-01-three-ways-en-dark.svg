<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Three common ways to handle exceptions: side-channels by chat, email or phone leave decisions without evidence; letting cases through makes standards drift; pushing everything up turns authorized people into a bottleneck." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="590" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three ways exceptions get handled, and the cost</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The decision still gets made, but the organization learns nothing from it.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">OKELAS analysis of common operating patterns, not survey data.</text><rect x="60.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Side-channel</text><text x="84.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">What it looks like</text><text x="84.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Ask by chat, email or phone; the</text><text x="84.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">authorized person replies verbally or</text><text x="84.0" y="280.7" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">by message.</text><line x1="84.0" y1="330.0" x2="382.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cost</text><text x="84.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">The decision leaves no</text><text x="84.0" y="404.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">traceable evidence</text><rect x="427.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="451.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Let it through</text><text x="451.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">What it looks like</text><text x="451.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">The person doing the work decides</text><text x="451.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">alone to keep things moving, tells</text><text x="451.0" y="280.7" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">no one.</text><line x1="451.0" y1="330.0" x2="749.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cost</text><text x="451.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Standards drift between cases and</text><text x="451.0" y="404.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">between people</text><rect x="794.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="818.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Push everything up</text><text x="818.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">What it looks like</text><text x="818.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Anything that matches no rule goes to</text><text x="818.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">the top level.</text><line x1="818.0" y1="330.0" x2="1116.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cost</text><text x="818.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Authorized people become</text><text x="818.0" y="404.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">a bottleneck</text><rect x="60.0" y="448.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="481.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">All three share one thing: next time, whoever handles it starts from scratch.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The exception path has five parts: detect, route to the right authorized person, prepare evidence, a person decides and records the reason, then build precedent; AI supports detection and evidence preparation." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">A designed exception path</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Five parts, and the decision step always belongs to a person.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="200.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="90.0" cy="166.0" r="15" fill="#2B74F5"/><text x="90.0" y="171.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Detect</text><text x="76.0" y="275.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">A case matches no</text><text x="76.0" y="294.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">rule: over threshold,</text><text x="76.0" y="314.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">outside precedent or</text><text x="76.0" y="334.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">missing information.</text><line x1="262.0" y1="166.0" x2="272.0" y2="166.0" stroke="#2B74F5" stroke-width="2"/><polygon points="278.0,166.0 272.0,169.3 272.0,162.7" fill="#2B74F5"/><rect x="280.0" y="134.0" width="200.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="310.0" cy="166.0" r="15" fill="#2B74F5"/><text x="310.0" y="171.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Route to the</text><text x="296.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">right person</text><text x="296.0" y="275.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Each exception type has</text><text x="296.0" y="294.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">a decision-maker and a</text><text x="296.0" y="314.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">backup for absence.</text><line x1="482.0" y1="166.0" x2="492.0" y2="166.0" stroke="#2B74F5" stroke-width="2"/><polygon points="498.0,166.0 492.0,169.3 492.0,162.7" fill="#2B74F5"/><rect x="500.0" y="134.0" width="200.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="#2B74F5"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Prepare evidence</text><text x="516.0" y="275.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Where it differs,</text><text x="516.0" y="294.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">relevant data, similar</text><text x="516.0" y="314.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">cases and outcomes.</text><line x1="702.0" y1="166.0" x2="712.0" y2="166.0" stroke="#A78BFA" stroke-width="2"/><polygon points="718.0,166.0 712.0,169.3 712.0,162.7" fill="#A78BFA"/><rect x="720.0" y="134.0" width="200.0" height="262.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="750.0" cy="166.0" r="15" fill="#A78BFA"/><text x="750.0" y="171.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A person decides</text><text x="736.0" y="275.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The decision, reason</text><text x="736.0" y="294.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">and decision-maker</text><text x="736.0" y="314.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">are recorded.</text><rect x="736.0" y="356.0" width="92.4" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="782.2" y="372.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Human gate</text><line x1="922.0" y1="166.0" x2="932.0" y2="166.0" stroke="#A78BFA" stroke-width="2"/><polygon points="938.0,166.0 932.0,169.3 932.0,162.7" fill="#A78BFA"/><rect x="940.0" y="134.0" width="200.0" height="262.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="970.0" cy="166.0" r="15" fill="#2B74F5"/><text x="970.0" y="171.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Build precedent</text><text x="956.0" y="275.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Stored as evidence so</text><text x="956.0" y="294.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">similar cases have</text><text x="956.0" y="314.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">something to stand on.</text><rect x="60.0" y="412.0" width="1080.0" height="56.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="600.0" y="445.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="middle">AI supports step 1 (interpreting input) and step 3 (preparing evidence)</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The exception path reduces effort for the decision-maker; it does not replace them.</text></svg>
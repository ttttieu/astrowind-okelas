<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Seven items to record when handling an exception: situation, point of mismatch, evidence reviewed, decision, decision-maker, reason and reversibility." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Minimum record for handling an exception</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Enough for someone else, six months later, to understand what happened.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="132.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="160.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Situation</text><rect x="350.0" y="132.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="160.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">What is this case, and when did it happen</text><rect x="60.0" y="186.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="214.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Point of mismatch</text><rect x="350.0" y="186.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="214.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Which rule or criterion could not apply, and why</text><rect x="60.0" y="240.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="268.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence reviewed</text><rect x="350.0" y="240.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="268.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">What data and similar cases the decision rested on</text><rect x="60.0" y="294.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="322.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Decision</text><rect x="350.0" y="294.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="322.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">What was chosen</text><rect x="60.0" y="348.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="376.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Decision-maker</text><rect x="350.0" y="348.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="376.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Who had the authority, and when</text><rect x="60.0" y="402.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="430.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Reason</text><rect x="350.0" y="402.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="430.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Why this was chosen over the alternatives</text><rect x="60.0" y="456.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="484.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Reversibility</text><rect x="350.0" y="456.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="484.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Can the decision be corrected if it was wrong</text><rect x="60.0" y="514.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="547.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Purple marks what only a person can confirm: the decision, the decision-maker, the reason.</text></svg>
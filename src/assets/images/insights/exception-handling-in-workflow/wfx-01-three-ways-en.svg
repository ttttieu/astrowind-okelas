<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Three common ways to handle exceptions: side-channels by chat, email or phone leave decisions without evidence; letting cases through makes standards drift; pushing everything up turns authorized people into a bottleneck." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="590" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three ways exceptions get handled, and the cost</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The decision still gets made, but the organization learns nothing from it.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">OKELAS analysis of common operating patterns, not survey data.</text><rect x="60.0" y="134.0" width="346.0" height="296.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="176.1" font-size="21" font-weight="700" fill="var(--hd)" text-anchor="start">Side-channel</text><text x="84.0" y="212.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">What it looks like</text><text x="84.0" y="238.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ask by chat, email or phone; the</text><text x="84.0" y="259.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">authorized person replies verbally or</text><text x="84.0" y="280.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">by message.</text><line x1="84.0" y1="330.0" x2="382.0" y2="330.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="356.6" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Cost</text><text x="84.0" y="382.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">The decision leaves no</text><text x="84.0" y="404.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">traceable evidence</text><rect x="427.0" y="134.0" width="346.0" height="296.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="451.0" y="176.1" font-size="21" font-weight="700" fill="var(--hd)" text-anchor="start">Let it through</text><text x="451.0" y="212.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">What it looks like</text><text x="451.0" y="238.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The person doing the work decides</text><text x="451.0" y="259.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">alone to keep things moving, tells</text><text x="451.0" y="280.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">no one.</text><line x1="451.0" y1="330.0" x2="749.0" y2="330.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="356.6" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Cost</text><text x="451.0" y="382.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Standards drift between cases and</text><text x="451.0" y="404.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">between people</text><rect x="794.0" y="134.0" width="346.0" height="296.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="818.0" y="176.1" font-size="21" font-weight="700" fill="var(--hd)" text-anchor="start">Push everything up</text><text x="818.0" y="212.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">What it looks like</text><text x="818.0" y="238.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Anything that matches no rule goes to</text><text x="818.0" y="259.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">the top level.</text><line x1="818.0" y1="330.0" x2="1116.0" y2="330.0" stroke="var(--a)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="356.6" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Cost</text><text x="818.0" y="382.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Authorized people become</text><text x="818.0" y="404.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">a bottleneck</text><rect x="60.0" y="448.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="481.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All three share one thing: next time, whoever handles it starts from scratch.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four steps from exception to rule: record the exception, identify the pattern, a person reviews and issues, the new rule enters the workflow; unusually rising exceptions are a signal for the rule owner to review." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">From exception to rule: issued by an authorized person</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The scope of rules grows through confirmed precedent, not by handing the system more authority.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="236.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Record the exception</text><text x="76.0" y="273.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Every case outside the rule:</text><text x="76.0" y="292.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">record the decision and reason</text><text x="76.0" y="312.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">as evidence.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="#2B74F5"/><rect x="335.0" y="134.0" width="255.0" height="236.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Identify the pattern</text><text x="351.0" y="273.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The same kind of case repeats</text><text x="351.0" y="292.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">with consistent handling:</text><text x="351.0" y="312.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">propose "could become a rule".</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="#A78BFA" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="#A78BFA"/><rect x="610.0" y="134.0" width="255.0" height="236.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="642.0" cy="168.0" r="15" fill="#A78BFA"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">A person reviews</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">and issues</text><text x="626.0" y="273.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">A proposal does not become a</text><text x="626.0" y="292.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">rule by itself; an authorized</text><text x="626.0" y="312.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">person reviews and issues it.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="#A78BFA" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="#A78BFA"/><rect x="885.0" y="134.0" width="255.0" height="236.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="#2B74F5"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">The new rule enters</text><text x="901.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">the workflow</text><text x="901.0" y="273.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">The same kind of case runs</text><text x="901.0" y="292.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">under the rule; the scope of</text><text x="901.0" y="312.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">judgment narrows.</text><rect x="60.0" y="386.0" width="1080.0" height="84.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="432.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Signals for the rule owner to review</text><rect x="430.0" y="408.0" width="340.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="600.0" y="433.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Exceptions of one kind rising unusually</text><rect x="790.0" y="408.0" width="340.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="960.0" y="433.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Old rules drifting from reality</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Without recorded exceptions, there is no data to tell which rules need fixing.</text></svg>
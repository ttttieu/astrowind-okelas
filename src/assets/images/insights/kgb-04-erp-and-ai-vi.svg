<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Knowledge graph có vai trò trước ERP (ghi nhận thực thể và quan hệ), sau ERP (lớp ngữ nghĩa trên dữ liệu ERP) và cho AI (vượt giới hạn của RAG)." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge graph: trước ERP, sau ERP và cho AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Vai trò cụ thể ở các điểm nối của doanh nghiệp sản xuất.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Trước ERP</text><text x="82.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Bức tranh vận hành đã rõ chưa?</text><rect x="82.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="94.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vấn đề</text><text x="94.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Chưa có bức tranh tổng thể: quy trình nào</text><text x="94.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">liên quan module nào, dữ liệu nào migrate</text><text x="94.0" y="303.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">theo cấu trúc nào.</text><rect x="82.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="94.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Vai trò của knowledge graph</text><text x="94.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi nhận các thực thể chính và quan hệ</text><text x="94.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">giữa chúng trước khi triển khai.</text><rect x="426.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Sau ERP</text><text x="448.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Dữ liệu ERP có trả lời được câu hỏi thật?</text><rect x="448.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="460.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vấn đề</text><text x="460.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu có cấu trúc theo module, không theo</text><text x="460.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cách người dùng thực sự cần hỏi.</text><rect x="448.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="460.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Vai trò của knowledge graph</text><text x="460.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Lớp ngữ nghĩa ánh xạ khái niệm vận hành</text><text x="460.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">(sản phẩm, quy trình, nhà cung cấp, lô</text><text x="460.0" y="407.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hàng) sang cấu trúc dữ liệu ERP.</text><rect x="792.0" y="134.0" width="348.0" height="306.2" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Cho AI</text><text x="814.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">AI có vượt được giới hạn của RAG?</text><rect x="814.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="826.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Vấn đề</text><text x="826.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">RAG chỉ tìm trong văn bản, không đi theo</text><text x="826.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chuỗi quan hệ.</text><rect x="814.0" y="327.6" width="304.0" height="94.6" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="826.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Vai trò của knowledge graph</text><text x="826.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">AI đi theo mạng lưới quan hệ để tìm câu trả</text><text x="826.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">lời đúng cho câu hỏi vận hành.</text><rect x="60.0" y="456.2" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="489.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ghi nhận quan hệ một lần, dùng được nhiều lần và cho nhiều mục đích, kể cả AI.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="Trong DMS các tài liệu là đơn vị riêng, không liên kết; trong vận hành thực tế tri thức là mạng lưới nối tài liệu, sản phẩm, quy trình, quyết định và sự cố." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="644" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức là mạng lưới kết nối, không phải tập hợp file</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Trong DMS, mỗi tài liệu là một đơn vị riêng. Trong vận hành, tri thức là các mối liên kết.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="623.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="340.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Trong DMS</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi tài liệu là một đơn vị riêng: tìm được, đọc được, phê duyệt được</text><rect x="98.0" y="264.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="2"/><line x1="110.0" y1="284.0" x2="150.0" y2="284.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="110.0" y1="298.0" x2="150.0" y2="298.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="110.0" y1="312.0" x2="150.0" y2="312.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="110.0" y1="326.0" x2="150.0" y2="326.0" stroke="var(--gm)" stroke-width="1.6"/><rect x="218.0" y="294.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="2"/><line x1="230.0" y1="314.0" x2="270.0" y2="314.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="230.0" y1="328.0" x2="270.0" y2="328.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="230.0" y1="342.0" x2="270.0" y2="342.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="230.0" y1="356.0" x2="270.0" y2="356.0" stroke="var(--gm)" stroke-width="1.6"/><rect x="338.0" y="264.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="2"/><line x1="350.0" y1="284.0" x2="390.0" y2="284.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="350.0" y1="298.0" x2="390.0" y2="298.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="350.0" y1="312.0" x2="390.0" y2="312.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="350.0" y1="326.0" x2="390.0" y2="326.0" stroke="var(--gm)" stroke-width="1.6"/><rect x="458.0" y="294.0" width="64.0" height="84.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="2"/><line x1="470.0" y1="314.0" x2="510.0" y2="314.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="470.0" y1="328.0" x2="510.0" y2="328.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="470.0" y1="342.0" x2="510.0" y2="342.0" stroke="var(--gm)" stroke-width="1.6"/><line x1="470.0" y1="356.0" x2="510.0" y2="356.0" stroke="var(--gm)" stroke-width="1.6"/><rect x="612.0" y="134.0" width="528.0" height="340.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Trong vận hành thực tế</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Tri thức là mạng lưới kết nối</text><line x1="700.0" y1="264.0" x2="1050.0" y2="264.0" stroke="var(--p)" stroke-width="2"/><line x1="700.0" y1="264.0" x2="876.0" y2="334.0" stroke="var(--p)" stroke-width="2"/><line x1="1050.0" y1="264.0" x2="876.0" y2="334.0" stroke="var(--p)" stroke-width="2"/><line x1="876.0" y1="334.0" x2="700.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><line x1="876.0" y1="334.0" x2="1050.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><line x1="700.0" y1="414.0" x2="1050.0" y2="414.0" stroke="var(--p)" stroke-width="2"/><rect x="638.0" y="246.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="700.0" y="269.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tài liệu</text><rect x="988.0" y="246.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="269.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sản phẩm</text><rect x="814.0" y="316.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="876.0" y="339.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quy trình</text><rect x="638.0" y="396.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="700.0" y="419.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyết định</text><rect x="988.0" y="396.0" width="124.0" height="36.0" rx="18" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="419.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sự cố</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi thực sự không chỉ là “tài liệu nào nói về điều này?” mà là “trong bối cảnh này, tôi cần biết gì?”</text></svg>
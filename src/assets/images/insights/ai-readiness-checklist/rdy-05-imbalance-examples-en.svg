<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Three pairs of labels contrasting a strong dimension with a weak one, each with a consequence: AI can analyze history but not support the workflow; AI can take part but accountability is unaddressed; AI understands procedures but cannot reach data in other systems." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Imbalance between dimensions shows where AI will stall</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three examples from the article. The labels are qualitative, not scores.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Qualitative illustrations from the article, not measured data.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="148.0" width="300.0" height="34.0" rx="17" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="210.0" y="170.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Strong: good data</text><rect x="60.0" y="186.0" width="300.0" height="34.0" rx="17" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="210.0" y="208.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Weak: unclear processes</text><line x1="380.0" y1="182.0" x2="422.0" y2="182.0" stroke="var(--gm)" stroke-width="2"/><polygon points="430.0,182.0 422.0,186.4 422.0,177.6" fill="var(--gm)"/><rect x="440.0" y="134.0" width="700.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="790.0" y="187.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI can analyze history but cannot support the workflow.</text><rect x="60.0" y="254.0" width="300.0" height="34.0" rx="17" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="210.0" y="276.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Strong: clear processes</text><rect x="60.0" y="292.0" width="300.0" height="34.0" rx="17" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="210.0" y="314.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Weak: no governance</text><line x1="380.0" y1="288.0" x2="422.0" y2="288.0" stroke="var(--gm)" stroke-width="2"/><polygon points="430.0,288.0 422.0,292.4 422.0,283.6" fill="var(--gm)"/><rect x="440.0" y="240.0" width="700.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="790.0" y="293.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI can take part, but accountability risks stay unaddressed.</text><rect x="60.0" y="360.0" width="300.0" height="34.0" rx="17" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="210.0" y="382.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Strong: structured knowledge</text><rect x="60.0" y="398.0" width="300.0" height="34.0" rx="17" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="210.0" y="420.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Weak: fragmented systems</text><line x1="380.0" y1="394.0" x2="422.0" y2="394.0" stroke="var(--gm)" stroke-width="2"/><polygon points="430.0,394.0 422.0,398.4 422.0,389.6" fill="var(--gm)"/><rect x="440.0" y="346.0" width="700.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="790.0" y="399.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI understands procedures but cannot reach operational data in other systems.</text><rect x="60.0" y="458.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="491.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The dimensions do not substitute for one another: strength in one does not make up for weakness in another.</text></svg>
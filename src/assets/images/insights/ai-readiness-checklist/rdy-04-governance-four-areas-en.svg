<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Four governance areas, each with one question: authorization, verification, traceability and escalation when AI is uncertain." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Governance answers four questions about AI’s authority</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each area answers one question about what AI is allowed to do and who is accountable.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four governance areas from the article’s analysis. Governance is a management question, not compliance or legal advice.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="174.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Authorization</text><text x="122.0" y="203.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Which data can AI access, which outputs can it produce, which</text><text x="122.0" y="223.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">steps can it influence?</text><rect x="606.0" y="134.0" width="534.0" height="124.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--a)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="174.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Verification</text><text x="668.0" y="203.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What review does AI output go through, and who is responsible?</text><rect x="60.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="306.0" r="15" fill="var(--a)"/><text x="94.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="310.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability</text><text x="122.0" y="339.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is AI’s part in a decision recorded, with an audit trail?</text><rect x="606.0" y="270.0" width="534.0" height="124.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="306.0" r="15" fill="var(--a)"/><text x="640.0" y="311.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="310.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Escalation</text><text x="668.0" y="339.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">When AI is uncertain or out of scope, what process does it</text><text x="668.0" y="359.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">escalate through?</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without governance, wrong information can be acted on and no one is accountable because “the system said so”.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Product cost combines direct materials, direct labor and manufacturing overhead, where overhead depends on the chosen method; three questions cover the costing method, the allocation basis and regular updating of the rate." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="584" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Cost allocation in manufacturing: three questions to answer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Product cost has three components; overhead depends on the chosen method.</text><line x1="60.0" y1="500.0" x2="1140.0" y2="500.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="522.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="563.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="340.0" height="64.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="230.0" y="172.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Direct materials</text><text x="415.0" y="197.2" font-size="28" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="430.0" y="134.0" width="340.0" height="64.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="172.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Direct labor</text><text x="785.0" y="197.2" font-size="28" font-weight="700" fill="var(--mut)" text-anchor="middle">+</text><rect x="800.0" y="158.0" width="340.0" height="64.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="3"/><text x="970.0" y="196.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Manufacturing overhead</text><rect x="814.0" y="134.0" width="210.3" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="919.2" y="150.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Depends on the chosen method</text><text x="60.0" y="262.9" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Three questions many SME manufacturing CFOs have not answered clearly</text><rect x="60.0" y="280.0" width="350.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="92.0" cy="312.0" r="15" fill="var(--mut)"/><text x="92.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="358.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Which costing method is used?</text><text x="76.0" y="389.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Standard, actual or another method.</text><rect x="425.0" y="280.0" width="350.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="457.0" cy="312.0" r="15" fill="var(--mut)"/><text x="457.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="441.0" y="358.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">What is the overhead allocation basis?</text><text x="441.0" y="389.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Machine hours, labor hours or another rate.</text><rect x="790.0" y="280.0" width="350.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="822.0" cy="312.0" r="15" fill="var(--mut)"/><text x="822.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="806.0" y="358.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Is the allocation rate calculated and</text><text x="806.0" y="380.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">updated regularly?</text><rect x="60.0" y="430.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="463.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Missing or conflicting answers: resolve them before configuring modules.</text></svg>
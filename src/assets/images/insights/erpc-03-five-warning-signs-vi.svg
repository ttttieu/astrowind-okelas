<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="Năm dấu hiệu nhận biết scope creep sớm: danh sách yêu cầu tăng sau kick-off, không có quy trình chính thức, go-live lùi nhiều lần, cảnh báo của nhà triển khai bị bỏ qua và ngân sách dự phòng cạn sớm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="514" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm dấu hiệu nhận biết scope creep sớm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Các dấu hiệu này thường xuất hiện trong vài tháng đầu của dự án.</text><line x1="60.0" y1="430.0" x2="1140.0" y2="430.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="452.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Dấu hiệu theo phân tích trong bài viết, không phải thống kê.</text><text x="60.0" y="493.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Danh sách yêu cầu</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">tăng sau kick-off</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Dài hơn so với lúc bắt</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đầu dự án.</text><rect x="279.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Không có quy trình</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">chính thức</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Yêu cầu đến qua email,</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">họp; không có form,</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">đánh giá tác động hay</text><text x="295.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">người phê duyệt.</text><rect x="498.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Go-live lùi nhiều lần</text><text x="514.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không rõ nguyên nhân;</text><text x="514.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">scope creep có thể ẩn</text><text x="514.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">ở đây.</text><rect x="717.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Cảnh báo bị bỏ qua</text><text x="733.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Nhà triển khai cảnh báo</text><text x="733.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tác động nhưng yêu cầu</text><text x="733.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">vẫn được chấp thuận.</text><rect x="936.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Ngân sách dự phòng</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">cạn sớm</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quỹ này dành cho rủi ro kỹ</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thuật, không để bù mở</text><text x="952.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">rộng scope.</text><rect x="60.0" y="360.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="393.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Scope creep đôi khi hiện ra ở timeline trước khi hiện ra ở ngân sách.</text></svg>
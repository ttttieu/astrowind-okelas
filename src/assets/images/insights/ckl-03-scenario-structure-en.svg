<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-label="An assumed scenario of a departing shift supervisor: visible costs are recruitment, handover salary and training; hidden costs as assumed are reduced productivity, support time and increased errors, far larger than the visible ones." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="598" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Illustrative scenario: the cost structure</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Shows structure and relative scale, not to be used as a benchmark.</text><line x1="60.0" y1="514.0" x2="1140.0" y2="514.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="536.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative assumptions from the article, not statistics or benchmarks. Illustrates cost mechanisms only.</text><text x="60.0" y="577.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="600.0" y="168.1" font-size="14" font-weight="700" fill="var(--tx)" text-anchor="middle">Assumed scenario: a food processing business with 90 employees. A shift supervisor with 8 years of experience gives 2 months’ notice.</text><rect x="60.0" y="208.0" width="360.0" height="220.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="247.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Visible costs</text><rect x="84.0" y="266.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="293.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Recruitment: posting, interviews, HR time</text><rect x="84.0" y="318.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="345.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Salary during the 2-month handover</text><rect x="84.0" y="370.0" width="312.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="397.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Training: materials, trainer time</text><rect x="440.0" y="208.0" width="700.0" height="220.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="464.0" y="247.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Hidden costs, as assumed</text><rect x="464.0" y="266.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="294.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">New person reaches 70% productivity in the first 4 months</text><rect x="464.0" y="318.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Other experienced people spend about 20% more time supporting</text><rect x="464.0" y="370.0" width="652.0" height="46.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="398.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Errors rise 15–20% in the first 4 months</text><rect x="60.0" y="444.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="477.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">In the assumed scenario, hidden costs are far larger than visible costs.</text></svg>
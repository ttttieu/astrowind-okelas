<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 484" width="1200" height="484" role="img" aria-label="Four questions: which knowledge is explicit, which is tacit and high risk, what portion of tacit knowledge can be partially made explicit, and which strategies reduce risk without complete documentation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="484" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four questions for telling the two types apart</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Questions a knowledge management strategy needs to answer.</text><line x1="60.0" y1="400.0" x2="1140.0" y2="400.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="422.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-check questions from the article; a discussion aid, not a certified methodology.</text><text x="60.0" y="463.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="168.0" r="15" fill="var(--p)"/><text x="94.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="167.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Which knowledge is explicit and could be better managed</text><text x="122.0" y="188.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">through documentation?</text><rect x="606.0" y="134.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="168.0" r="15" fill="var(--p)"/><text x="640.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="167.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Which knowledge is tacit and at high risk if the person who</text><text x="668.0" y="188.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">holds it leaves?</text><rect x="60.0" y="230.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="94.0" cy="264.0" r="15" fill="var(--p)"/><text x="94.0" y="269.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="263.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">What portion of tacit knowledge could be partially made</text><text x="122.0" y="284.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">explicit, and is it worth the investment?</text><rect x="606.0" y="230.0" width="534.0" height="84.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="640.0" cy="264.0" r="15" fill="var(--p)"/><text x="640.0" y="269.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="263.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">What strategies reduce tacit knowledge risk without</text><text x="668.0" y="284.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">complete documentation?</text><rect x="60.0" y="330.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="363.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These questions all begin with the difference between the two types.</text></svg>
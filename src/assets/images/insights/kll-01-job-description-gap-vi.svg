<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Job description chỉ ghi kỹ năng, kinh nghiệm và bằng cấp; điều nhân viên mang lại sau nhiều năm gồm lý do của các quyết định, cách làm thực tế mà SOP không đề cập và hiểu biết về con người, thường không có trong tài liệu nào." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Những thứ không có trong job description</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một nhân viên được mô tả bằng kỹ năng, kinh nghiệm, bằng cấp. Giá trị sau nhiều năm nằm ở chỗ khác.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Job description</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Những gì được ghi lại về một nhân viên</text><rect x="84.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kỹ năng</text><rect x="84.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kinh nghiệm</text><rect x="84.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Bằng cấp</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Những gì họ mang lại sau nhiều năm</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thường không có trong bất kỳ tài liệu nào</text><rect x="636.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tri thức về “tại sao”: lý do của các quyết định không được ghi lại</text><rect x="636.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tri thức về cách làm thực tế: những biến số mà SOP không đề cập</text><rect x="636.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Hiểu biết về con người, trong và ngoài tổ chức</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Những thứ này thường không có trong JD, file nhân sự hay CRM. Chúng nằm trong đầu người.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="The unreliable data loop: incorrect entries, inaccurate ERP data, users who stop trusting it and keep spreadsheets, and then less accurate data entered." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The unreliable data loop</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A self-reinforcing loop that does not fade without intervention.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="240.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="88.0" cy="178.0" r="13" fill="var(--p)"/><text x="88.0" y="183.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="227.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Incorrect entries</text><line x1="306.0" y1="202.0" x2="325.0" y2="202.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="334.0,202.0 325.0,206.9 325.0,197.1" fill="var(--gm)"/><rect x="340.0" y="150.0" width="240.0" height="104.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="368.0" cy="178.0" r="13" fill="var(--p)"/><text x="368.0" y="183.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="356.0" y="216.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">ERP data becomes</text><text x="356.0" y="238.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">inaccurate</text><line x1="586.0" y1="202.0" x2="605.0" y2="202.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="614.0,202.0 605.0,206.9 605.0,197.1" fill="var(--gm)"/><rect x="620.0" y="150.0" width="240.0" height="104.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="648.0" cy="178.0" r="13" fill="var(--a)"/><text x="648.0" y="183.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="636.0" y="216.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Users stop trusting it and</text><text x="636.0" y="238.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">keep spreadsheets</text><line x1="866.0" y1="202.0" x2="885.0" y2="202.0" stroke="var(--gm)" stroke-width="2.5"/><polygon points="894.0,202.0 885.0,206.9 885.0,197.1" fill="var(--gm)"/><rect x="900.0" y="150.0" width="240.0" height="104.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="928.0" cy="178.0" r="13" fill="var(--a)"/><text x="928.0" y="183.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="916.0" y="216.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Less accurate data</text><text x="916.0" y="238.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">gets entered</text><line x1="1020.0" y1="254.0" x2="1020.0" y2="298.0" stroke="var(--a)" stroke-width="2.5"/><line x1="1020.0" y1="298.0" x2="180.0" y2="298.0" stroke="var(--a)" stroke-width="2.5"/><line x1="180.0" y1="298.0" x2="180.0" y2="272.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="180.0,262.0 185.5,272.0 174.5,272.0" fill="var(--a)"/><rect x="510.0" y="286.0" width="170.3" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="595.1" y="302.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">A self-reinforcing loop</text><rect x="60.0" y="326.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="359.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Without intervention, ERP coexists with an unofficial spreadsheet system.</text></svg>
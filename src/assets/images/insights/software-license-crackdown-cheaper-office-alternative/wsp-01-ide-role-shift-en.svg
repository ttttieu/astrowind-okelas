<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Two boxes joined by an arrow: the IDE used to be where code is written and is shifting toward where work is assigned to AI and results are checked." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Coding tools are not vanishing; their role is shifting</text><g transform="translate(0 109.5)"><rect x="60" y="0" width="508" height="184" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">BEFORE</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">The IDE is where code is written</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Typing, running and debugging step by step.</text><rect x="632" y="0" width="508" height="184" rx="16" class="bp"/><text x="654" y="35" font-size="13" font-weight="600" class="tp">SHIFTING</text><text x="654" y="70" font-size="22" font-weight="600" class="tp">The IDE is where work is assigned and</text><text x="654" y="99" font-size="22" font-weight="600" class="tp">checked</text><text x="654" y="131" font-size="17" font-weight="400" class="mut">Managing AI sessions, reviewing diffs, checking sensitive</text><text x="654" y="155" font-size="17" font-weight="400" class="mut">parts.</text><line x1="578" y1="92" x2="610" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M608 83 l14 9 l-14 9z" class="arf"/><rect x="60" y="212" width="1080" height="73" rx="16" class="bi"/><text x="82" y="256" font-size="22" font-weight="600" class="ti">When AI creates, the value moves to viewing, checking and control.</text></g><text x="60" y="428.5" font-size="13" font-weight="400" class="mut">Source: GenK, Nov 24, 2026, reporting an interview with Satya Nadella. Original not read.</text></svg>

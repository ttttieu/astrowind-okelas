<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Ba cột: chatbot, AI tool, AI agent; mỗi cột có mô tả và dòng cuối ghi ai kiểm soát bước tiếp theo." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="572" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot, AI tool, agent: ai kiểm soát bước tiếp theo?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chatbot tạo văn bản rồi dừng; AI tool chạy kịch bản cố định; agent tự lập kế hoạch và chọn công cụ.</text><line x1="60.0" y1="488.0" x2="1140.0" y2="488.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="510.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân loại theo bài viết; không phải phân loại chính thức của tiêu chuẩn nào.</text><text x="60.0" y="551.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="197.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot</text><text x="84.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tạo văn bản rồi dừng lại.</text><text x="84.0" y="290.8" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Ai kiểm soát bước tiếp theo?</text><text x="84.0" y="319.6" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Người dùng</text><line x1="404.0" y1="274.5" x2="414.0" y2="274.5" stroke="var(--p)" stroke-width="2"/><polygon points="422.0,274.5 414.0,278.9 414.0,270.1" fill="var(--p)"/><rect x="426.0" y="176.0" width="340.0" height="197.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="450.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI tool</text><text x="450.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thực hiện một tác vụ cố định theo kịch</text><text x="450.0" y="271.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bản định sẵn.</text><text x="450.0" y="312.1" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Ai kiểm soát bước tiếp theo?</text><text x="450.0" y="340.9" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Kịch bản định sẵn</text><line x1="770.0" y1="274.5" x2="780.0" y2="274.5" stroke="var(--p)" stroke-width="2"/><polygon points="788.0,274.5 780.0,278.9 780.0,270.1" fill="var(--p)"/><rect x="792.0" y="176.0" width="340.0" height="197.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="816.0" y="217.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">AI agent</text><text x="816.0" y="249.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Lập kế hoạch nhiều bước, chọn công cụ</text><text x="816.0" y="271.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">và điều chỉnh theo kết quả trung gian.</text><text x="816.0" y="312.1" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Ai kiểm soát bước tiếp theo?</text><text x="816.0" y="340.9" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">AI</text><rect x="60.0" y="417.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="450.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Điểm khác nhau nằm ở việc ai kiểm soát hành động tiếp theo.</text></svg>
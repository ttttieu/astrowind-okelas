<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four limits of human review: attention, rare cases, time budget and scope, priority on known risks." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Four natural limits of human-only review</text><g transform="translate(0 110.1)"><rect x="60" y="0" width="530" height="105" rx="16" class="bb"/><text x="82" y="44" font-size="22" font-weight="600" class="tx">Attention is limited</text><text x="82" y="76" font-size="17" font-weight="400" class="mut">Focus fades as review runs long.</text><rect x="610" y="0" width="530" height="105" rx="16" class="bb"/><text x="632" y="44" font-size="22" font-weight="600" class="tx">Rare cases are hard to spot</text><text x="632" y="76" font-size="17" font-weight="400" class="mut">Uncommon situations are seldom reached.</text><rect x="60" y="125" width="530" height="105" rx="16" class="bb"/><text x="82" y="169" font-size="22" font-weight="600" class="tx">Time, budget and scope</text><text x="82" y="201" font-size="17" font-weight="400" class="mut">Each review covers only part of the whole.</text><rect x="610" y="125" width="530" height="105" rx="16" class="bb"/><text x="632" y="169" font-size="22" font-weight="600" class="tx">Priority goes to known risks</text><text x="632" y="201" font-size="17" font-weight="400" class="mut">Unknown risks tend to stay off the list.</text><rect x="60" y="258" width="1080" height="73" rx="16" class="bg"/><text x="82" y="302" font-size="22" font-weight="600" class="tx">These are limits of the method, not faults of the reviewers.</text></g></svg>

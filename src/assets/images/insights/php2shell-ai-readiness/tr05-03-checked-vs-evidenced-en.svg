<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Comparing checks performed with enough evidence, relevant to QMS, GMP, audit and access rights." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">“Checked” is not the same as “evidenced”</text><g transform="translate(0 121.2)"><rect x="60" y="0" width="508" height="131" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">STATE 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Checks were performed</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Activity happened and was recorded.</text><rect x="632" y="0" width="508" height="131" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">STATE 2</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Enough evidence exists</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Scope and depth sufficient to conclude.</text><text x="600" y="77.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><text x="60" y="175" font-size="15" font-weight="600" class="mut">The question shows up in:</text><rect x="269" y="155" width="76" height="34" rx="17" class="bg"/><text x="287" y="178" font-size="17" font-weight="600" class="tx">QMS</text><rect x="357" y="155" width="76" height="34" rx="17" class="bg"/><text x="375" y="178" font-size="17" font-weight="600" class="tx">GMP</text><rect x="445" y="155" width="79" height="34" rx="17" class="bg"/><text x="463" y="178" font-size="17" font-weight="600" class="tx">Audit</text><rect x="536" y="155" width="147" height="34" rx="17" class="bg"/><text x="554" y="178" font-size="17" font-weight="600" class="tx">Access rights</text><rect x="60" y="221" width="1080" height="73" rx="16" class="bi"/><text x="82" y="265" font-size="22" font-weight="600" class="ti">Checking many times does not guarantee enough evidence.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Hệ thống chính thức như ERP đã triển khai và vẫn chạy, trong khi thực tế vận hành diễn ra ở nơi khác: kế hoạch sản xuất qua email và Excel, đơn hàng khẩn trong sheet riêng, tình trạng lô hàng qua tin nhắn, kết quả QC trong file Excel riêng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP vẫn chạy, nhưng vận hành diễn ra ở nơi khác</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hệ thống chính thức hoạt động, nhưng công việc hàng ngày chạy trên Excel, email và tin nhắn.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa tổng hợp theo bài viết, không phải số liệu đo lường hay một tổ chức cụ thể.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="360.0" height="300.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống chính thức</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP, phần mềm quản lý</text><rect x="84.0" y="218.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="249.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đã triển khai</text><rect x="84.0" y="280.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="311.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên đã được đào tạo</text><rect x="84.0" y="342.0" width="312.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Vẫn đang chạy</text><rect x="480.0" y="134.0" width="660.0" height="300.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="504.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Thực tế vận hành</text><text x="504.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Diễn ra ở nơi khác</text><rect x="504.0" y="218.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="245.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kế hoạch sản xuất tuần: gửi qua email, mỗi người một bản Excel</text><rect x="504.0" y="270.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="297.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đơn hàng khẩn: sheet cập nhật thủ công mỗi sáng</text><rect x="504.0" y="322.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="349.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tình trạng lô hàng: hỏi qua tin nhắn, tổng hợp vào email</text><rect x="504.0" y="374.0" width="612.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="810.0" y="401.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kết quả QC: file Excel riêng của tổ QC</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP vẫn chạy. Nhưng thực tế vận hành đang diễn ra ở một nơi khác.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Ba bài toán DMS không giải quyết: tri thức ngữ cảnh, tri thức lịch sử và nguyên nhân, tri thức liên kết; mỗi bài toán so sánh cách DMS trả lời với cách KM tốt hơn trả lời." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="612" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba bài toán tri thức mà DMS không giải quyết được</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dù kho tài liệu đầy đủ, ba loại câu hỏi này DMS thường không trả lời được.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ theo bài viết cho doanh nghiệp sản xuất SME; tình huống minh họa tổng hợp, không phải số liệu đo lường.</text><text x="60.0" y="591.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức ngữ cảnh</text><text x="82.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Quy trình kiểm tra áp dụng thế nào với</text><text x="82.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">sản phẩm mới?</text><rect x="82.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="94.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Trong DMS</text><text x="94.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tìm quy trình, tìm đặc tả sản phẩm, đọc cả</text><text x="94.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hai và tự suy luận.</text><rect x="82.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="94.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Với KM tốt hơn</text><text x="94.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình gắn với từng sản phẩm và</text><text x="94.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">điều kiện áp dụng, trả lời có ngữ cảnh ngay.</text><rect x="426.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức nguyên nhân</text><text x="448.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Vì sao dùng quy trình này? Đã thử cách</text><text x="448.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">khác chưa?</text><rect x="448.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="460.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Trong DMS</text><text x="460.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tài liệu ghi “cái gì”, không ghi “tại sao”. Phải</text><text x="460.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tìm người có kinh nghiệm.</text><rect x="448.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="460.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Với KM tốt hơn</text><text x="460.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Lịch sử quyết định được gắn với tài liệu</text><text x="460.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">và quy trình.</text><rect x="792.0" y="134.0" width="348.0" height="307.1" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tri thức liên kết</text><text x="814.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Đổi thông số ở quy trình A thì quy trình nào</text><text x="814.0" y="223.7" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">khác bị ảnh hưởng?</text><rect x="814.0" y="242.1" width="304.0" height="76.4" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="826.0" y="264.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Trong DMS</text><text x="826.0" y="285.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Hai tài liệu tồn tại riêng, không biết liên quan</text><text x="826.0" y="304.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nếu không ai ghi rõ.</text><rect x="814.0" y="328.5" width="304.0" height="94.6" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="826.0" y="351.1" font-size="12" font-weight="700" fill="var(--s)" text-anchor="start">Với KM tốt hơn</text><text x="826.0" y="372.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Quan hệ giữa quy trình, sản phẩm, thiết bị,</text><text x="826.0" y="390.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nguyên liệu, nhà cung cấp được ghi nhận và</text><text x="826.0" y="408.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">truy vấn được.</text><rect x="60.0" y="457.1" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="490.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">DMS lưu “cái gì”. Các câu hỏi này cần ngữ cảnh, lịch sử và liên kết.</text></svg>
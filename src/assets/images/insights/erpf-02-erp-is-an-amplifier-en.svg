<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="An organization with foundations passing through ERP has its strengths multiplied; an organization not yet ready passing through the same ERP has its weaknesses multiplied on a more complex and expensive system." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ERP amplifies what the organization already has</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP records transactions according to processes. It does not repair the processes.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustration of the “ERP is an amplifier” idea from the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="420.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">An organization with foundations</text><text x="80.0" y="198.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Clear, consistent processes; data of sufficient quality;</text><text x="80.0" y="218.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">controlled scope; people who understand why they</text><text x="80.0" y="237.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">change; governance after go-live.</text><rect x="720.0" y="134.0" width="420.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="740.0" y="169.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">ERP amplifies strengths</text><text x="740.0" y="198.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What the organization already does well is multiplied.</text><line x1="486.0" y1="214.0" x2="504.0" y2="214.0" stroke="var(--gm)" stroke-width="3"/><polygon points="514.0,214.0 504.0,219.5 504.0,208.5" fill="var(--gm)"/><line x1="686.0" y1="214.0" x2="704.0" y2="214.0" stroke="var(--gm)" stroke-width="3"/><polygon points="714.0,214.0 704.0,219.5 704.0,208.5" fill="var(--gm)"/><rect x="60.0" y="310.0" width="420.0" height="160.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="345.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">An organization not yet ready</text><text x="80.0" y="374.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Vague processes, inconsistent data, a culture where</text><text x="80.0" y="394.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">everyone does it their own way.</text><rect x="720.0" y="310.0" width="420.0" height="160.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="740.0" y="345.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">ERP amplifies weaknesses too</text><text x="740.0" y="374.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Operations carry on as before, on a more complex and</text><text x="740.0" y="394.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">expensive system.</text><line x1="486.0" y1="390.0" x2="504.0" y2="390.0" stroke="var(--gm)" stroke-width="3"/><polygon points="514.0,390.0 504.0,395.5 504.0,384.5" fill="var(--gm)"/><line x1="686.0" y1="390.0" x2="704.0" y2="390.0" stroke="var(--gm)" stroke-width="3"/><polygon points="714.0,390.0 704.0,395.5 704.0,384.5" fill="var(--gm)"/><rect x="520.0" y="134.0" width="160.0" height="336.0" rx="16" fill="var(--ink)"/><text x="600.0" y="300.6" font-size="32" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP</text><text x="600.0" y="330.5" font-size="15" font-weight="700" fill="var(--onink)" text-anchor="middle">amplifier</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP amplifies strengths and weaknesses alike: the question is what your organization has to amplify.</text></svg>
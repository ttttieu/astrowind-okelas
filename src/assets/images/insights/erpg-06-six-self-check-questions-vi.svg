<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" role="img" aria-label="Sáu câu hỏi tự đánh giá ERP governance: System Owner, người chịu trách nhiệm master data, kênh liên hệ, quy trình thay đổi cấu hình, xử lý tài khoản khi nghỉ việc và lần kiểm tra chất lượng dữ liệu gần nhất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="550" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu câu hỏi: ERP governance của bạn đang ở đâu?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi câu hỏi lấy từ checklist tự đánh giá trong bài.</text><line x1="60.0" y1="466.0" x2="1140.0" y2="466.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="488.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi tự đánh giá từ bài viết, là công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="60.0" y="529.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="191.5" r="15" fill="var(--p)"/><text x="92.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="165.9" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Đã có ERP System Owner được</text><text x="120.0" y="186.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">chỉ định rõ, có thẩm quyền</text><text x="120.0" y="207.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định và chịu trách nhiệm</text><text x="120.0" y="228.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">trước lãnh đạo chưa?</text><rect x="425.0" y="134.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="191.5" r="15" fill="var(--p)"/><text x="457.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="485.0" y="186.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có người cụ thể chịu trách nhiệm</text><text x="485.0" y="207.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">chất lượng master data chưa?</text><rect x="790.0" y="134.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="191.5" r="15" fill="var(--p)"/><text x="822.0" y="197.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="850.0" y="186.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Người dùng có biết liên hệ ai và qua</text><text x="850.0" y="207.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">kênh nào khi gặp vấn đề không?</text><rect x="60.0" y="264.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="321.5" r="15" fill="var(--p)"/><text x="92.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="316.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Có quy trình rõ ràng xử lý yêu cầu</text><text x="120.0" y="337.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">thay đổi cấu hình không?</text><rect x="425.0" y="264.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="321.5" r="15" fill="var(--p)"/><text x="457.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="485.0" y="306.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Khi nhân viên nghỉ việc, tài khoản</text><text x="485.0" y="327.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ERP được xử lý thế nào và trong</text><text x="485.0" y="347.7" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">bao lâu?</text><rect x="790.0" y="264.0" width="350.0" height="115.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="321.5" r="15" fill="var(--p)"/><text x="822.0" y="327.0" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="850.0" y="316.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lần gần nhất kiểm tra chất lượng</text><text x="850.0" y="337.3" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">dữ liệu ERP là khi nào?</text><rect x="60.0" y="395.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="428.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nhiều câu trả lời “không rõ”: đó là khoảng trống governance cần lấp.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Six stacked layers: the base is the document repository RAG already has; the five layers above are what must be added: operational data, version and state, knowledge tied to context, workflow and evidence, governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five components operational AI needs beyond documents</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Needed to answer questions that affect decisions, compliance and accountability.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The five components follow the article’s analysis, a discussion aid, not a certified methodology.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="162.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Governance: what AI may influence, and what needs human approval</text><rect x="60.0" y="190.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="218.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow and evidence: who did what, when and why</text><rect x="60.0" y="246.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="274.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge tied to context: processes, products, lines, decisions</text><rect x="60.0" y="302.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="330.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Version and state management: which documents are in effect</text><rect x="60.0" y="358.0" width="1080.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="386.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Live operational data: ERP, QMS, production and inspection records</text><rect x="60.0" y="414.0" width="1080.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="442.5" font-size="15" font-weight="700" fill="var(--s)" text-anchor="middle">Document repository: what RAG already has</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The five upper layers are what must be added. RAG is still a sensible first step, but not the destination.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="Four question types RAG cannot answer: specific operational data, current state, decision history and evidence, traceability." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="644" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four question types RAG cannot answer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each question needs data that sits outside the document repository.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative questions from the article (composite scenarios), not measured data.</text><text x="60.0" y="623.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="164.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="164.0" r="15" fill="var(--p)"/><text x="90.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Operational data</text><text x="84.0" y="204.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Did batch B2024-08 pass quality inspection last week?”</text><text x="84.0" y="233.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Lives in operational systems, databases or disconnected spreadsheets, not</text><text x="84.0" y="251.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">in the documents RAG searches.</text><rect x="606.0" y="134.0" width="534.0" height="164.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="636.0" cy="164.0" r="15" fill="var(--p)"/><text x="636.0" y="169.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Current state</text><text x="630.0" y="204.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Which document version is in effect for production line 3 now?”</text><text x="630.0" y="233.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">RAG only sees documents as they were when indexed. It does not know</text><text x="630.0" y="251.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">which version is current.</text><rect x="60.0" y="310.0" width="534.0" height="164.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="340.0" r="15" fill="var(--p)"/><text x="90.0" y="345.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="346.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Decision history and evidence</text><text x="84.0" y="380.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“Why did we switch ingredient supplier X last month?”</text><text x="84.0" y="409.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Needs a record of who approved, when and on what basis. RAG has no</text><text x="84.0" y="427.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">structure linking these.</text><rect x="606.0" y="310.0" width="534.0" height="164.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="636.0" cy="340.0" r="15" fill="var(--p)"/><text x="636.0" y="345.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="346.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Traceability</text><text x="630.0" y="380.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">“If raw material batch A had an issue, which finished products</text><text x="630.0" y="401.6" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">used it?”</text><text x="630.0" y="430.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Needs structured data from ingredient to finished product, traceable back</text><text x="630.0" y="449.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">from outcome to source.</text><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">None of these answers sits in document content, so a document search cannot answer them.</text></svg>
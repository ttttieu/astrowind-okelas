<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" width="1200" height="578" role="img" aria-label="The three RAG steps: index documents, retrieve relevant chunks, generate an answer; every step works only with the loaded document repository." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="578" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">RAG works in three steps, all within the document repository</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">All three steps work on documents. This is an architectural boundary, not a defect.</text><line x1="60.0" y1="494.0" x2="1140.0" y2="494.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="516.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram of how RAG works, based on the article; not measured data.</text><text x="60.0" y="557.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="92.0" cy="182.0" r="15" fill="var(--gm)"/><text x="92.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Index</text><text x="84.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOPs, procedures and policies are</text><text x="84.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">split into chunks and stored in a</text><text x="84.0" y="280.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">searchable repository.</text><line x1="399.0" y1="230.0" x2="419.0" y2="230.0" stroke="var(--gm)" stroke-width="2"/><polygon points="427.0,230.0 419.0,234.4 419.0,225.6" fill="var(--gm)"/><rect x="433.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="465.0" cy="182.0" r="15" fill="var(--p)"/><text x="465.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="493.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Retrieve</text><text x="457.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">For each question, the system finds the</text><text x="457.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chunks most relevant to it.</text><line x1="772.0" y1="230.0" x2="792.0" y2="230.0" stroke="var(--gm)" stroke-width="2"/><polygon points="800.0,230.0 792.0,234.4 792.0,225.6" fill="var(--gm)"/><rect x="806.0" y="150.0" width="333.0" height="160.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="838.0" cy="182.0" r="15" fill="var(--gm)"/><text x="838.0" y="187.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="866.0" y="189.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Generate</text><text x="830.0" y="241.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">The AI combines retrieved content with</text><text x="830.0" y="260.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the question and writes a</text><text x="830.0" y="280.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">natural-language answer.</text><rect x="60.0" y="334.0" width="1080.0" height="52.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="365.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">All three steps work only with documents loaded into the repository.</text><rect x="60.0" y="404.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="435.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The advantage is real: answers are grounded in internal documents and traceable to sources. The limit is the</text><text x="600.0" y="459.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">scope of the data.</text></svg>
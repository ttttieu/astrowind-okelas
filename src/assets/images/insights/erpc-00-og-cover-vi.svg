<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Một khối phạm vi ban đầu và các khối nhỏ cộng dồn thêm, mỗi khối cao hơn khối trước, thể hiện phạm vi dự án lớn dần qua từng yêu cầu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · ERP</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Scope creep trong ERP:</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">khi dự án lớn dần ngoài kế hoạch</text><rect x="130.0" y="420.0" width="120.0" height="80.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="2.4"/><rect x="280.0" y="380.0" width="120.0" height="120.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="2.4" stroke-dasharray="6 5"/><rect x="430.0" y="340.0" width="120.0" height="160.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="2.4" stroke-dasharray="6 5"/><rect x="580.0" y="300.0" width="120.0" height="200.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="2.4" stroke-dasharray="6 5"/><rect x="730.0" y="260.0" width="120.0" height="240.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="2.4" stroke-dasharray="6 5"/><text x="130.0" y="533.8" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Phạm vi ban đầu</text><text x="280.0" y="533.8" font-size="15" font-weight="700" fill="var(--a)" text-anchor="start">Từng yêu cầu nhỏ đều hợp lý, nhưng cộng dồn</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text></svg>
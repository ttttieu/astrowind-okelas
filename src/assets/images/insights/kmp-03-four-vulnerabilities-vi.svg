<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Bốn đặc điểm khiến doanh nghiệp sản xuất dễ mất tri thức: vận hành theo ca, điều kiện không chuẩn, yêu cầu compliance và nhân sự thay đổi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="572" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn đặc điểm khiến doanh nghiệp sản xuất dễ tổn thương</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không phải ngành nào cũng phụ thuộc vào tri thức ngầm như nhau.</text><line x1="60.0" y1="488.0" x2="1140.0" y2="488.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="510.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Đặc điểm theo phân tích trong bài, không phải thống kê. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="551.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="170.0" r="15" fill="var(--a)"/><text x="94.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Vận hành theo ca</text><text x="84.0" y="219.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi ca có thể phát triển cách làm riêng cho tình huống không có trong</text><text x="84.0" y="238.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tài liệu, và không ai ghi lại sự khác biệt.</text><rect x="606.0" y="134.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="170.0" r="15" fill="var(--a)"/><text x="640.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="175.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Điều kiện không chuẩn</text><text x="630.0" y="219.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nguyên liệu biến động, thời tiết, thiết bị thay đổi dần: xử lý cần</text><text x="630.0" y="238.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">kinh nghiệm không có trong SOP.</text><rect x="60.0" y="274.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="310.0" r="15" fill="var(--a)"/><text x="94.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="315.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Yêu cầu compliance</text><text x="84.0" y="359.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ISO, GMP cần evidence rằng quy trình được thực thi đúng. Tri thức</text><text x="84.0" y="378.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">trong đầu người thì không được ghi nhận.</text><rect x="606.0" y="274.0" width="534.0" height="128.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="310.0" r="15" fill="var(--a)"/><text x="640.0" y="315.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="315.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nhân sự thay đổi</text><text x="630.0" y="359.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi lần một người rời đi, tri thức đi theo, và chi phí thực sự thường</text><text x="630.0" y="378.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không được tính đủ.</text><rect x="60.0" y="418.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="451.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Khi tri thức nằm trong đầu người, mỗi lần nhân sự rời đi là một lần mất năng lực vận hành.</text></svg>
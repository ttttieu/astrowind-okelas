<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Năm nhóm dữ liệu kế toán cần chuẩn bị trước ERP: số dư đầu kỳ, công nợ phải thu, công nợ phải trả, tài sản cố định và tồn kho kế toán." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Năm nhóm dữ liệu kế toán cần chuẩn bị trước ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi nhóm có những vấn đề đặc trưng cần xử lý trước cutover.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Số dư đầu kỳ</text><text x="76.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Điểm xuất phát của</text><text x="76.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">hệ thống; sai lệch đi theo</text><text x="76.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">suốt vòng đời.</text><rect x="279.0" y="134.0" width="204.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--p)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Công nợ phải thu</text><text x="295.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Khách hàng trùng, thanh</text><text x="295.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">toán một phần ghi sai, nợ</text><text x="295.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">cũ không thu được.</text><rect x="498.0" y="134.0" width="204.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Công nợ phải trả</text><text x="514.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Hóa đơn chưa khớp phiếu</text><text x="514.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhập kho, điều khoản sai,</text><text x="514.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">số dư âm do lỗi cũ.</text><rect x="717.0" y="134.0" width="204.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--p)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tài sản cố định</text><text x="733.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Tài sản đã thanh lý vẫn</text><text x="733.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">trên sổ; tài sản đang dùng</text><text x="733.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chưa ghi nhận.</text><rect x="936.0" y="134.0" width="204.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--p)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tồn kho kế toán</text><text x="952.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Đối chiếu kiểm kê và điều</text><text x="952.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">chỉnh trước cutover, không</text><text x="952.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">để ERP tự điều chỉnh.</text><rect x="60.0" y="319.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="352.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mỗi nhóm cần người chịu trách nhiệm xác nhận trước ngày cutover.</text></svg>
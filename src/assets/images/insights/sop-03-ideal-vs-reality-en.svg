<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="The SOP is written under ideal conditions while operational reality has variable materials, ageing equipment, new staff and time pressure; when the gap is not acknowledged, people skip steps, adapt from experience or follow habit." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The gap between the SOP and operational reality</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The SOP describes ideal conditions. People execute in real ones.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="480.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">The SOP</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Written under ideal conditions</text><rect x="84.0" y="218.0" width="432.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="300.0" y="243.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Often written by people who don’t execute daily</text><rect x="84.0" y="268.0" width="432.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="300.0" y="293.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Describes the ideal process when all goes to plan</text><rect x="660.0" y="134.0" width="480.0" height="192.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="684.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Operational reality</text><text x="684.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Not ideal</text><rect x="684.0" y="218.0" width="211.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="789.5" y="243.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Variable raw materials</text><rect x="905.0" y="218.0" width="211.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1010.5" y="243.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Ageing equipment</text><rect x="684.0" y="268.0" width="211.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="789.5" y="293.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">New staff learning while doing</text><rect x="905.0" y="268.0" width="211.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1010.5" y="293.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Time pressure</text><line x1="548.0" y1="230.0" x2="555.6" y2="230.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><line x1="644.4" y1="230.0" x2="652.0" y2="230.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><rect x="561.6" y="217.0" width="72.8" height="26.0" rx="13.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="598.0" y="234.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">The gap</text><text x="60.0" y="357.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">When the gap isn’t acknowledged, people resolve it themselves by:</text><rect x="60.0" y="372.0" width="348.0" height="50.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="234.0" y="402.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Skipping the step that doesn’t apply</text><rect x="426.0" y="372.0" width="348.0" height="50.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="600.0" y="402.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Adapting from experience</text><rect x="792.0" y="372.0" width="348.0" height="50.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="966.0" y="402.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Doing it “the way we’ve always done it”</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">This is not laziness. It is a rational response to an SOP that wasn’t designed for real conditions.</text></svg>
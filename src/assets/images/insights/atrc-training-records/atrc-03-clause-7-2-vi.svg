<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Bốn thẻ yêu cầu của điều khoản 7.2 xếp hàng ngang, bên dưới là một khung ghi chú về nhân sự thuê ngoài và tạm thời." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ISO 9001 điều khoản 7.2 yêu cầu bốn việc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 7.2 yêu cầu xác định, đảm bảo, hành động và giữ bằng chứng năng lực.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn yêu cầu theo điều khoản 7.2 và bài viết, diễn đạt lại; bài không đưa số đo.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="255.0" height="200.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><circle cx="90.0" cy="194.0" r="15" fill="var(--p)"/><text x="90.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Xác định năng lực</text><text x="80.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Cần thiết cho các vai trò và</text><text x="80.0" y="341.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bước ảnh hưởng chất lượng.</text><rect x="335.0" y="160.0" width="255.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="365.0" cy="194.0" r="15" fill="var(--gm)"/><text x="365.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đảm bảo có năng lực</text><text x="355.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Qua giáo dục, đào tạo</text><text x="355.0" y="341.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc kinh nghiệm.</text><rect x="610.0" y="160.0" width="255.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="640.0" cy="194.0" r="15" fill="var(--gm)"/><text x="640.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hành động và đánh giá</text><text x="630.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thực hiện hành động cần</text><text x="630.0" y="341.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thiết và đánh giá hiệu quả.</text><rect x="885.0" y="160.0" width="255.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="915.0" cy="194.0" r="15" fill="var(--gm)"/><text x="915.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="905.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Giữ bằng chứng</text><text x="905.0" y="321.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Lưu bằng chứng văn bản về</text><text x="905.0" y="341.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">năng lực.</text><rect x="60.0" y="384.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="418.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Áp dụng cả nhân sự thuê ngoài và tạm thời.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Năng lực cần được xác định, đánh giá hiệu lực và giữ bằng chứng.</text></svg>
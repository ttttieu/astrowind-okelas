<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Sáu thẻ khoảng trống xếp thành lưới hai cột, bên dưới là một thanh giải pháp về ma trận năng lực theo vai trò." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Sáu khoảng trống thường gặp giữa đào tạo và vai trò</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu khoảng trống thường gặp, và đề xuất sửa: ma trận năng lực theo vai trò.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sáu khoảng trống theo bài viết; ma trận năng lực là đề xuất của bài viết.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="193.0" r="15" fill="var(--p)"/><text x="94.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="199.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Gắn đào tạo với người, không với vai trò</text><rect x="60.0" y="238.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="271.0" r="15" fill="var(--gm)"/><text x="94.0" y="276.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="126.0" y="277.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không liên kết với việc sửa SOP</text><rect x="60.0" y="316.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="349.0" r="15" fill="var(--gm)"/><text x="94.0" y="354.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="355.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chỉ giữ chứng chỉ, không giữ bằng chứng</text><rect x="612.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="193.0" r="15" fill="var(--gm)"/><text x="646.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="678.0" y="199.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Không kiểm tra hiệu quả sau đào tạo</text><rect x="612.0" y="238.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="271.0" r="15" fill="var(--gm)"/><text x="646.0" y="276.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="678.0" y="277.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Đào tạo dàn trải, quá mỏng</text><rect x="612.0" y="316.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="349.0" r="15" fill="var(--gm)"/><text x="646.0" y="354.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="678.0" y="355.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bỏ sót nhân sự thuê ngoài và tạm thời</text><rect x="60.0" y="400.0" width="1080.0" height="52.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="600.0" y="432.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Giải pháp: ma trận năng lực theo vai trò</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ma trận năng lực theo vai trò thay cho danh sách người đã học.</text></svg>
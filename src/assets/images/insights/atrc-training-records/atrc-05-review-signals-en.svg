<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Three signal cards above a bar reading “review competence and training”, with a note box below about tacit knowledge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three signals to review competence, not just records</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Reviews should follow document changes, root causes or changes in role.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three triggers per the article and clause 7.2; the diagram is OKELAS’s presentation.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="230.0" y="211.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">A document or SOP changes</text><rect x="430.0" y="160.0" width="340.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="600.0" y="200.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">A nonconformance root cause</text><text x="600.0" y="222.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">is found</text><rect x="800.0" y="160.0" width="340.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="970.0" y="200.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">A role or piece of</text><text x="970.0" y="222.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">equipment changes</text><rect x="60.0" y="280.0" width="1080.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="314.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Review competence and training</text><rect x="60.0" y="356.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="390.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Long-serving staff’s tacit know-how rarely appears in SOPs or training records.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Long-serving staff know-how must be captured deliberately.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Hai thẻ đối chiếu: hồ sơ đầy đủ bên trái, việc thực tế bên phải; bên dưới là một thanh kết luận." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Hồ sơ đào tạo đầy đủ chưa chắc người đó làm được việc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Người có đủ hồ sơ đào tạo vẫn có thể làm một bước khác với hướng dẫn đã ban hành.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Mở đầu theo bài viết; kết luận về hai việc khác nhau là diễn giải của OKELAS.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Hồ sơ đầy đủ</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Khóa học đã hoàn thành, chữ ký xác nhận đủ.</text><rect x="612.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Việc thực tế</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Bước làm khác với hướng dẫn đã ban hành.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Hồ sơ chứng minh đào tạo đã xảy ra, không chứng minh năng lực.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Five questions to ask instead of how many hours AI saved: decisions, incident handling, new employees, audit preparation and information loss when key people leave." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five questions instead of “how many hours did AI save?”</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ask what AI is affecting in the organization’s capabilities.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Orienting self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="54.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="161.0" r="15" fill="var(--p)"/><text x="96.0" y="166.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="166.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Are organizational decisions faster, better or more consistent?</text><rect x="60.0" y="198.0" width="1080.0" height="54.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="225.0" r="15" fill="var(--p)"/><text x="96.0" y="230.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="130.0" y="230.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Has the time from incident detection to root cause analysis shortened?</text><rect x="60.0" y="262.0" width="1080.0" height="54.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="289.0" r="15" fill="var(--p)"/><text x="96.0" y="294.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="294.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Do new employees now work independently sooner?</text><rect x="60.0" y="326.0" width="1080.0" height="54.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="353.0" r="15" fill="var(--p)"/><text x="96.0" y="358.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="130.0" y="358.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When an audit arrives, has preparation time shortened?</text><rect x="60.0" y="390.0" width="1080.0" height="54.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="417.0" r="15" fill="var(--p)"/><text x="96.0" y="422.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="130.0" y="422.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When a key employee leaves, does the organization still lose critical information?</text><rect x="60.0" y="460.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="491.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If every answer is “no change”,</text><text x="600.0" y="515.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">the organization has AI productivity, not organizational intelligence.</text></svg>
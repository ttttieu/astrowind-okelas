<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 708" width="1200" height="708" role="img" aria-label="AI productivity measures individual output such as drafting time and emails per shift; organizational intelligence measures five collective capacities: deciding, consistent execution, learning, explaining and tracing, retaining knowledge." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="708" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity measures output, not organizational outcomes</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The two are measured in different places, so one does not automatically lead to the other.</text><line x1="60.0" y1="624.0" x2="1140.0" y2="624.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="646.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data. Both terms are used in a management and operational sense, not as technical AI definitions.</text><text x="60.0" y="687.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="404.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">AI productivity</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Measures individual output, at the level of single tasks</text><rect x="84.0" y="238.0" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="274.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Drafting time goes down</text><rect x="84.0" y="310.5" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="346.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Emails processed per shift go up</text><rect x="84.0" y="383.0" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="419.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Spelling and grammar errors drop</text><rect x="84.0" y="455.5" width="480.0" height="62.5" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="324.0" y="491.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">New hires synthesize information faster</text><rect x="612.0" y="134.0" width="528.0" height="404.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Organizational intelligence</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Measures the organization’s collective capacity</text><rect x="636.0" y="238.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="267.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Decide on accurate, complete, timely information</text><rect x="636.0" y="296.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="325.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Execute consistently, whoever and whichever shift</text><rect x="636.0" y="354.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="383.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Learn from experience and apply the lessons</text><rect x="636.0" y="412.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="441.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Explain and trace: why, who approved, what evidence</text><rect x="636.0" y="470.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="876.0" y="499.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Retain knowledge when key people leave</text><rect x="60.0" y="554.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="587.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The individual numbers are real and economically valuable. They are just not organizational outcomes.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four boxes joined by arrows: Process, Workflow, Event, Evidence; below is a note box about evidence." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The chain: Process, Workflow, Event, Evidence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Process defines the work; workflow shows how it runs; events record each action.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four-concept chain per the article; the diagram is OKELAS’s presentation.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="180.0" y="226.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Process</text><line x1="306.0" y1="220.0" x2="324.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="334.0,220.0 324.0,225.5 324.0,214.5" fill="var(--gm)"/><rect x="340.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="460.0" y="226.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow</text><line x1="586.0" y1="220.0" x2="604.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="614.0,220.0 604.0,225.5 604.0,214.5" fill="var(--gm)"/><rect x="620.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="740.0" y="226.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Event</text><line x1="866.0" y1="220.0" x2="884.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="894.0,220.0 884.0,225.5 884.0,214.5" fill="var(--gm)"/><rect x="900.0" y="170.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="1020.0" y="226.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Evidence</text><rect x="60.0" y="300.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="334.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Evidence records who, when, on which version, and under what authority.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Evidence is created during the work, not rebuilt afterwards.</text></svg>
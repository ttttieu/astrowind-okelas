<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Ba hộp nối bằng mũi tên: sự kiện có bối cảnh, bằng chứng có sẵn, truy vết khi audit; bên dưới là một khung ghi chú về hành động khắc phục." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#08090A;--tx:#1E2A3E;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#08090A;--wh:#08090A;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#1E2A3E;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Audit trail là kết quả của thiết kế, không phải thêm vào</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khi sự kiện được ghi có bối cảnh từ đầu, audit trail không cần dựng lại trước mỗi đợt audit.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 7.5.3, 9.2, 9.3, 10.2 và nguyên tắc theo bài viết; sơ đồ là của OKELAS.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="340.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="230.0" y="226.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Sự kiện được ghi có bối cảnh</text><line x1="406.0" y1="220.0" x2="414.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="424.0,220.0 414.0,225.5 414.0,214.5" fill="var(--gm)"/><rect x="430.0" y="170.0" width="340.0" height="100.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="600.0" y="226.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Bằng chứng có sẵn</text><line x1="776.0" y1="220.0" x2="784.0" y2="220.0" stroke="var(--gm)" stroke-width="3"/><polygon points="794.0,220.0 784.0,225.5 784.0,214.5" fill="var(--gm)"/><rect x="800.0" y="170.0" width="340.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="970.0" y="226.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Truy vết khi audit</text><rect x="60.0" y="310.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="344.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Ghi log tốt không sửa được điểm yếu của hành động khắc phục.</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ghi log tốt không thay thế việc phân tích nguyên nhân gốc.</text></svg>
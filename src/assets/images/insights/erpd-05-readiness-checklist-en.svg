<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Five areas to check before ERP, each with one representative question: product catalog and SKUs, vendors and customers, inventory, accounting and data governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five areas to check before starting ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each area carries one representative question from the full checklist in the article.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="156.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Product catalog</text><text x="76.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">/ SKUs</text><text x="76.0" y="225.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is the catalog maintained</text><text x="76.0" y="245.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">in one place or spread</text><text x="76.0" y="265.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">across sources?</text><rect x="279.0" y="134.0" width="204.0" height="156.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="295.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Vendors and</text><text x="295.0" y="192.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">customers</text><text x="295.0" y="225.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Are there</text><text x="295.0" y="245.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">duplicate records?</text><rect x="498.0" y="134.0" width="204.0" height="156.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="514.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Inventory</text><text x="514.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is book inventory</text><text x="514.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">reconciled to physical</text><text x="514.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">counts regularly?</text><rect x="717.0" y="134.0" width="204.0" height="156.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="733.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Accounting</text><text x="733.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Does the chart of</text><text x="733.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">accounts support</text><text x="733.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">reporting needs?</text><rect x="936.0" y="134.0" width="204.0" height="156.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="952.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Data governance</text><text x="952.0" y="203.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Is a named person or</text><text x="952.0" y="223.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">team accountable for</text><text x="952.0" y="242.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">data quality?</text><rect x="60.0" y="306.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="339.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Several “no” or “uncertain” answers: allow more time for data preparation.</text></svg>
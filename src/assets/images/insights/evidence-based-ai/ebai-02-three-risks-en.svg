<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-label="Three risk cards: decisions cannot be rebuilt, data version unknown, unclear accountability." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="544" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three risks when AI leaves no trace</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The gap is not that AI was wrong, but that it was used in a traceable process and left no trace.</text><line x1="60.0" y1="460.0" x2="1140.0" y2="460.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="482.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three risks are analysis from the article, not measured data.</text><text x="60.0" y="523.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="206.0" r="15" fill="var(--p)"/><text x="90.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Decisions cannot be rebuilt</text><text x="84.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">If AI inputs and outputs are not kept, the</text><text x="84.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chain of decisions cannot be</text><text x="84.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">reconstructed during an investigation.</text><rect x="426.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="456.0" cy="206.0" r="15" fill="var(--gm)"/><text x="456.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="486.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Data version unknown</text><text x="450.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Without the data analyzed, its timing</text><text x="450.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">and the standard version, an old</text><text x="450.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">decision cannot be shown correct if the</text><text x="450.0" y="314.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">standard has since changed.</text><rect x="792.0" y="176.0" width="340.0" height="169.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="206.0" r="15" fill="var(--p)"/><text x="822.0" y="211.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="852.0" y="216.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Unclear accountability</text><text x="816.0" y="250.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Without a record of AI’s role and the</text><text x="816.0" y="271.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">later human review, the responsibility</text><text x="816.0" y="292.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">boundary becomes ambiguous.</text><rect x="60.0" y="389.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="422.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI is not a legal entity: responsibility stays with the organization.</text></svg>
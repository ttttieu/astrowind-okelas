<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Three boxes in sequence: evidence, trace and audit trail, each with a short definition." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence, trace and audit trail are three different things</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Often merged, but auditors ask about each one separately.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The distinction between the three concepts follows the article; descriptions are illustrative.</text><text x="60.0" y="585.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="196.0" width="340.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence</text><text x="84.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Specific proof that an event occurred,</text><text x="84.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">such as a temperature reading, an</text><text x="84.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">incoming inspection form or a visual</text><text x="84.0" y="335.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">inspection photo.</text><line x1="404.0" y1="292.0" x2="418.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="426.0,292.0 418.0,296.4 418.0,287.6" fill="var(--p)"/><rect x="430.0" y="196.0" width="340.0" height="192.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="454.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Trace</text><text x="454.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The ability to follow a chain backward,</text><text x="454.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">from a release decision to inspection</text><text x="454.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">results, raw material data and the</text><text x="454.0" y="335.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">people who performed and approved</text><text x="454.0" y="356.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">each step.</text><line x1="774.0" y1="292.0" x2="788.0" y2="292.0" stroke="var(--p)" stroke-width="2"/><polygon points="796.0,292.0 788.0,296.4 788.0,287.6" fill="var(--p)"/><rect x="800.0" y="196.0" width="340.0" height="192.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="824.0" y="237.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Audit trail</text><text x="824.0" y="271.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A systematic record of who did what,</text><text x="824.0" y="293.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">when, with what result, and who</text><text x="824.0" y="314.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">changed what, so an audit does not</text><text x="824.0" y="335.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">need to interview everyone.</text><rect x="60.0" y="432.0" width="1080.0" height="73.7" rx="12" fill="var(--ink)"/><text x="600.0" y="463.0" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All three must cover AI activity: what evidence it received, which chain it traced, and whether the trail can rebuild</text><text x="600.0" y="487.8" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">the decision.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Ba ô nối bằng mũi tên: kết luận sai, lời giải thích nghe hợp lý, kiểm toán phát hiện muộn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="554" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao một kết luận sai vẫn nghe rất hợp lý</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Lập luận được tối ưu cho sự mạch lạc và tính thuyết phục, không nhất thiết cho độ chính xác.</text><line x1="60.0" y1="470.0" x2="1140.0" y2="470.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="492.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Chuỗi theo bài viết; việc phát hiện muộn trong kiểm toán là diễn giải của bài.</text><text x="60.0" y="533.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="300.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="231.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Kết luận sai</text><text x="60.0" y="317.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả không đúng với thực tế.</text><rect x="420.0" y="170.0" width="300.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="570.0" y="231.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Lời giải thích nghe hợp lý</text><text x="420.0" y="317.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Mạch lạc, thuyết phục, nhưng không</text><text x="420.0" y="339.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">kèm nguồn.</text><rect x="780.0" y="170.0" width="360.0" height="110.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="960.0" y="231.9" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="middle">Kiểm toán phát hiện muộn</text><text x="780.0" y="317.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Bản ghi không đạt chuẩn bằng chứng.</text><line x1="370.0" y1="225.0" x2="398.0" y2="225.0" stroke="var(--gm)" stroke-width="3"/><polygon points="410.0,225.0 398.0,231.6 398.0,218.4" fill="var(--gm)"/><line x1="730.0" y1="225.0" x2="758.0" y2="225.0" stroke="var(--gm)" stroke-width="3"/><polygon points="770.0,225.0 758.0,231.6 758.0,218.4" fill="var(--gm)"/><rect x="60.0" y="400.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="433.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Lập luận được tối ưu cho sự mạch lạc, nên một kết luận sai vẫn có thể nghe hợp lý.</text></svg>
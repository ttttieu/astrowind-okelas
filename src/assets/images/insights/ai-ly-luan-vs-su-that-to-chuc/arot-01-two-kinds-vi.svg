<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" width="1200" height="554" role="img" aria-label="Hai thẻ song song: lập luận và bằng chứng của tổ chức, mỗi thẻ có hai gạch đầu dòng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="554" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lập luận và bằng chứng là hai loại thông tin khác nhau</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI tạo ra một chuỗi lập luận hợp lý; bằng chứng của tổ chức là thứ khác.</text><line x1="60.0" y1="470.0" x2="1140.0" y2="470.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="492.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân biệt theo bài viết; hai thẻ là minh họa khái niệm, không phải số liệu.</text><text x="60.0" y="533.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="240.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="88.0" y="182.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Lập luận (reasoning)</text><text x="88.0" y="232.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Tạo ra một chuỗi lập luận hợp lý</text><text x="88.0" y="294.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Được đánh giá theo mạch lạc và tính thuyết phục</text><rect x="612.0" y="134.0" width="528.0" height="240.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="182.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng của tổ chức</text><text x="640.0" y="232.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Truy xuất được về nguồn gốc</text><text x="640.0" y="294.3" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">•  Kiểm chứng được bởi bên độc lập với nguồn</text><rect x="60.0" y="400.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="433.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Lập luận hợp lý không tự động là bằng chứng của tổ chức.</text></svg>
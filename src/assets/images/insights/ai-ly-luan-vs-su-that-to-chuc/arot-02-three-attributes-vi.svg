<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img" aria-label="Bảng ba hàng so sánh truy xuất nguồn, quy kết và kiểm chứng: lời giải thích AI thuần ghi “Chưa đủ”, dữ liệu có nguồn ghi “Có thể đạt”." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="564" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Lời giải thích mạch lạc chưa đáp ứng chuẩn bằng chứng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba thuộc tính bài viết nêu, đặt cạnh hai loại thông tin.</text><line x1="60.0" y1="480.0" x2="1140.0" y2="480.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="502.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bảng là cách OKELAS sắp xếp lại lập luận của bài; nhãn “Chưa đủ” và “Có thể đạt” là đánh giá của OKELAS.</text><text x="60.0" y="543.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Thuộc tính</text><text x="460.0" y="152.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Lời giải thích AI thuần</text><text x="810.0" y="152.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Gắn với dữ liệu có nguồn</text><rect x="60.0" y="170.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="206.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Truy xuất nguồn</text><rect x="460.0" y="170.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="182.0" width="90.9" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="529.5" y="204.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Chưa đủ</text><rect x="810.0" y="170.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="182.0" width="104.7" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="886.4" y="204.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Có thể đạt</text><rect x="60.0" y="242.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="278.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quy kết được</text><rect x="460.0" y="242.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="254.0" width="90.9" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="529.5" y="276.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Chưa đủ</text><rect x="810.0" y="242.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="254.0" width="104.7" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="886.4" y="276.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Có thể đạt</text><rect x="60.0" y="314.0" width="380.0" height="58.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="84.0" y="350.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm chứng được</text><rect x="460.0" y="314.0" width="330.0" height="58.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><rect x="484.0" y="326.0" width="90.9" height="34.0" rx="17.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="529.5" y="348.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Chưa đủ</text><rect x="810.0" y="314.0" width="330.0" height="58.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><rect x="834.0" y="326.0" width="104.7" height="34.0" rx="17.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="886.4" y="348.5" font-size="15" font-weight="700" fill="var(--p)" text-anchor="middle">Có thể đạt</text><rect x="60.0" y="410.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="443.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Lời giải thích mạch lạc không tự động đáp ứng chuẩn bằng chứng.</text></svg>
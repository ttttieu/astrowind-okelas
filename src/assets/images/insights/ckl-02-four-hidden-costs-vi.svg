<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Bốn loại chi phí ẩn của knowledge loss: năng suất giảm trong thời gian chuyển giao, sai sót và sự cố khi học việc, mất đi cải tiến tiềm năng, và thời gian quản lý xử lý hậu quả." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="580" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn loại chi phí ẩn của knowledge loss</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phát sinh trong nhiều tháng sau khi người đó rời đi.</text><line x1="60.0" y1="496.0" x2="1140.0" y2="496.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="518.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="559.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="94.0" cy="168.0" r="15" fill="var(--a)"/><text x="94.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Năng suất giảm trong thời gian chuyển giao</text><text x="122.0" y="199.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Công việc lâu hơn. Người có kinh nghiệm trong đội mất thời gian</text><text x="122.0" y="218.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">giải thích, kiểm tra và sửa lỗi.</text><rect x="606.0" y="134.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="640.0" cy="168.0" r="15" fill="var(--a)"/><text x="640.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="170.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Sai sót và sự cố khi học việc</text><text x="668.0" y="199.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Nhận nguyên liệu không đạt, bỏ sót dấu hiệu thiết bị, xử lý sai</text><text x="668.0" y="218.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tình huống bất thường. Có thể kéo theo chi phí audit và khắc</text><text x="668.0" y="238.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phục non-conformance.</text><rect x="60.0" y="278.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="94.0" cy="312.0" r="15" fill="var(--a)"/><text x="94.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="314.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Mất đi cải tiến tiềm năng</text><text x="122.0" y="343.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ý tưởng cải tiến chưa được ghi lại ra đi cùng người. Đây là chi phí</text><text x="122.0" y="362.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cơ hội thực sự.</text><rect x="606.0" y="278.0" width="534.0" height="132.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="640.0" cy="312.0" r="15" fill="var(--a)"/><text x="640.0" y="317.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="314.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Thời gian quản lý xử lý hậu quả</text><text x="668.0" y="343.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phân công người đảm nhận, giám sát chặt hơn, xử lý vấn đề phát</text><text x="668.0" y="362.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">sinh, tuyển người thay thế.</text><rect x="60.0" y="426.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="459.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần lớn các chi phí này không có dòng ngân sách riêng.</text></svg>
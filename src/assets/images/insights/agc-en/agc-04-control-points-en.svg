<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Five-step pipeline with control points at the action step, and a step-limit bar underneath." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Place control points at every action step</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Controlling only the input or the final output is not enough, because risk sits in intermediate actions.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Control points and step limits are recommendations from the article; the right level depends on each system.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="230.0" width="180.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="150.0" y="270.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Goal</text><line x1="246.0" y1="265.0" x2="270.0" y2="265.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="279.0,265.0 270.0,269.9 270.0,260.1" fill="var(--p)"/><rect x="285.0" y="230.0" width="180.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="375.0" y="270.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Plan</text><line x1="471.0" y1="265.0" x2="495.0" y2="265.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="504.0,265.0 495.0,269.9 495.0,260.1" fill="var(--p)"/><rect x="510.0" y="230.0" width="180.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="600.0" y="270.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Select tool</text><line x1="696.0" y1="265.0" x2="720.0" y2="265.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="729.0,265.0 720.0,269.9 720.0,260.1" fill="var(--p)"/><rect x="735.0" y="230.0" width="180.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="825.0" y="270.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Action</text><line x1="921.0" y1="265.0" x2="945.0" y2="265.0" stroke="var(--p)" stroke-width="2.4"/><polygon points="954.0,265.0 945.0,269.9 945.0,260.1" fill="var(--p)"/><rect x="960.0" y="230.0" width="180.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="1050.0" y="270.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Observe</text><polygon points="150.0,178.0 164.0,192.0 150.0,206.0 136.0,192.0" fill="var(--gm)"/><text x="150.0" y="165.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Input</text><polygon points="825.0,178.0 839.0,192.0 825.0,206.0 811.0,192.0" fill="var(--a)"/><text x="825.0" y="165.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Control point</text><rect x="60.0" y="350.0" width="1080.0" height="64.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="387.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Step limit: set a maximum step count, or require confirmation after a set number of actions.</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Control points belong at the action step, where consequences actually occur.</text></svg>
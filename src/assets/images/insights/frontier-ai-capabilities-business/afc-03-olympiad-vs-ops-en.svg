<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Two columns: clear, self-contained olympiad problems versus messier enterprise workflows with four constraints." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Winning an olympiad is not the same as running operations</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The “jagged frontier” Stanford HAI describes: strong on some tasks, still failing on others.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Comparison as presented in the article, used to illustrate a concept; not measured data.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Olympiad problems</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Clearly stated and self-contained, with objectively checkable</text><text x="84.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">right-or-wrong answers.</text><rect x="84.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Clear, self-contained problem statement</text><rect x="84.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Objective right-or-wrong answers</text><rect x="84.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">IMO 2025: gold-medal standard reached</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Enterprise workflows</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Messier: incomplete data, shifting requirements, and success judged</text><text x="636.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">against many constraints.</text><rect x="636.0" y="238.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="265.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Incomplete or missing data</text><rect x="636.0" y="292.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="319.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Requirements change mid-task</text><rect x="636.0" y="346.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Regulatory and customer constraints</text><rect x="636.0" y="400.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="417.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Agents still fail about 1 in 3 attempts on structured benchmarks in</text><text x="876.0" y="436.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">real workflows</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Capability and operational reliability should be evaluated separately.</text></svg>
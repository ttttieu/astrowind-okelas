<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Four cards, each showing a benchmark name, its figures and a short description." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="632" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Independent benchmarks show capability rising fast</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Four benchmarks cited in the article, covering reasoning, coding, assistant tasks and web tasks.</text><line x1="60.0" y1="548.0" x2="1140.0" y2="548.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="570.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Figures as stated in the article; each benchmark differs, so cards are not directly comparable.</text><text x="60.0" y="611.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="169.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Humanity’s Last Exam</text><text x="84.0" y="215.8" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">+30%</text><text x="84.0" y="249.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Frontier models improved in one year; 2,500 expert-level questions in</text><text x="84.0" y="268.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">math and natural sciences.</text><rect x="612.0" y="134.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="636.0" y="169.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">SWE-bench Verified</text><text x="636.0" y="215.8" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">60% → nearly 100%</text><text x="636.0" y="249.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Agent success rate on real GitHub issues, within one year.</text><rect x="60.0" y="300.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="335.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">GAIA</text><text x="84.0" y="381.8" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">20% → 74.5%</text><text x="84.0" y="415.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Accuracy for general AI assistants.</text><rect x="612.0" y="300.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="636.0" y="335.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">WebArena</text><text x="636.0" y="381.8" font-size="34" font-weight="700" fill="var(--p)" text-anchor="start">15% → 74.3%</text><text x="636.0" y="415.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Agent task success on live web environments, from 2023 to</text><text x="636.0" y="434.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">early 2026.</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These are independent benchmarks, not self-reported figures from AI vendors.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" width="1200" height="496" role="img" aria-label="Five change management elements that work: early and clear communication, benefits from the end user’s view, super users, visible leadership use and a safe practice space." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="496" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five change management elements that work</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each element addresses a concern of the end user.</text><line x1="60.0" y1="412.0" x2="1140.0" y2="412.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="434.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="475.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Early, clear</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">communication</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">On daily work, timeline and</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">available support.</text><rect x="279.0" y="134.0" width="204.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--p)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Benefits from the</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">end user’s view</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Such as no waiting on</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">email approvals, real-time</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">order tracking.</text><rect x="498.0" y="134.0" width="204.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Super users</text><text x="514.0" y="242.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Internal experts who</text><text x="514.0" y="260.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">support colleagues daily;</text><text x="514.0" y="279.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">more sustainable than</text><text x="514.0" y="297.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">relying on the partner.</text><rect x="717.0" y="134.0" width="204.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--p)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Visible</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">leadership use</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Request reports from ERP</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and decide from its data.</text><rect x="936.0" y="134.0" width="204.0" height="192.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--p)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">A safe</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">practice space</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">A sandbox or parallel run</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">to practice with real data.</text><rect x="60.0" y="342.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="375.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Leaders using ERP first is the strongest signal to the whole organization.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Ba lý do chuẩn bị audit mất nhiều thời gian: bằng chứng ghi nhận sau, tài liệu không được duy trì, hồ sơ nằm rải rác; mỗi lý do kèm điều đang xảy ra và hệ quả trước audit." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba lý do chuẩn bị audit mất nhiều thời gian</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Cả ba đều xuất phát từ cách vận hành hằng ngày, không phải từ độ khó của audit.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống minh họa tổng hợp theo bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="288.0" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bằng chứng ghi sau</text><text x="82.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Bằng chứng được tạo ra khi nào?</text><rect x="82.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="94.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Điều đang xảy ra</text><text x="94.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả kiểm tra, log thực hiện, chữ ký</text><text x="94.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">phê duyệt không được ghi nhận ngay</text><text x="94.0" y="303.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">trong quy trình.</text><rect x="82.0" y="327.6" width="304.0" height="76.4" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="94.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Hệ quả trước audit</text><text x="94.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Phải “tái tạo” trước audit: việc tốn thời gian</text><text x="94.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">nhất và rủi ro nhất.</text><rect x="426.0" y="134.0" width="348.0" height="288.0" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Tài liệu không được duy trì</text><text x="448.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Tài liệu được cập nhật khi nào?</text><rect x="448.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="460.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Điều đang xảy ra</text><text x="460.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">SOP và hướng dẫn vận hành được cập nhật</text><text x="460.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">theo kiểu “trước audit rồi tính”.</text><rect x="448.0" y="327.6" width="304.0" height="76.4" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="460.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Hệ quả trước audit</text><text x="460.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi lần audit là một đợt cập nhật lớn thay vì</text><text x="460.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">các cập nhật nhỏ, thường xuyên.</text><rect x="792.0" y="134.0" width="348.0" height="288.0" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hồ sơ nằm rải rác</text><text x="814.0" y="204.6" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Hồ sơ nằm ở đâu?</text><rect x="814.0" y="223.0" width="304.0" height="94.6" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="826.0" y="245.7" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Điều đang xảy ra</text><text x="826.0" y="266.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả kiểm tra trong Excel, phê duyệt</text><text x="826.0" y="285.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">trong email, biên bản trong thư mục không</text><text x="826.0" y="303.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">tổ chức.</text><rect x="814.0" y="327.6" width="304.0" height="76.4" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4"/><text x="826.0" y="350.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="start">Hệ quả trước audit</text><text x="826.0" y="371.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Không có cách tổng hợp nhanh: phải gom</text><text x="826.0" y="389.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">thủ công từ nhiều nguồn.</text><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba lý do đều cho thấy vận hành hằng ngày chưa tạo ra bằng chứng sẵn sàng để trình.</text></svg>
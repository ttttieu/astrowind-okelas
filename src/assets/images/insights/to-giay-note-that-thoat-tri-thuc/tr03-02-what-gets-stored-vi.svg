<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Chuỗi hồ sơ, nhận định, quyết định, hành động; hai đầu được lưu, phần giữa thường không được lưu." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Hệ thống lưu kết quả, nhưng không lưu lý do</text><g transform="translate(0 162.9)"><rect x="60" y="0" width="237" height="155" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">ĐƯỢC LƯU</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Hồ sơ</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Hồ sơ gốc trong tủ</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">hoặc thư mục.</text><rect x="341" y="0" width="237" height="155" rx="16" class="bp"/><text x="363" y="35" font-size="13" font-weight="600" class="tp">THƯỜNG KHÔNG LƯU</text><text x="363" y="70" font-size="22" font-weight="600" class="tp">Nhận định</text><text x="363" y="102" font-size="17" font-weight="400" class="mut">Nhân viên hiểu vấn đề</text><text x="363" y="126" font-size="17" font-weight="400" class="mut">thế nào.</text><rect x="622" y="0" width="237" height="155" rx="16" class="bp"/><text x="644" y="35" font-size="13" font-weight="600" class="tp">LÝ DO THƯỜNG KHÔNG LƯU</text><text x="644" y="70" font-size="22" font-weight="600" class="tp">Quyết định</text><text x="644" y="102" font-size="17" font-weight="400" class="mut">Lãnh đạo cân nhắc</text><text x="644" y="126" font-size="17" font-weight="400" class="mut">điều gì.</text><rect x="903" y="0" width="237" height="155" rx="16" class="bb"/><text x="925" y="35" font-size="13" font-weight="600" class="mut">ĐƯỢC LƯU</text><text x="925" y="70" font-size="22" font-weight="600" class="tx">Hành động</text><text x="925" y="102" font-size="17" font-weight="400" class="mut">Chữ ký, con dấu, trạng</text><text x="925" y="126" font-size="17" font-weight="400" class="mut">thái “đã duyệt”.</text><line x1="303" y1="77.5" x2="323" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M321 68.5 l14 9 l-14 9z" class="arf"/><line x1="584" y1="77.5" x2="604" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M602 68.5 l14 9 l-14 9z" class="arf"/><line x1="865" y1="77.5" x2="885" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M883 68.5 l14 9 l-14 9z" class="arf"/></g></svg>

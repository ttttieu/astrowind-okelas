<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bốn loại quyết định cần giữ lý do: ngoại lệ, rủi ro chất lượng an toàn pháp lý, quyết định lặp lại, quyết định có thể bị hỏi lại." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Bốn loại quyết định đáng giữ lại lý do</text><g transform="translate(0 120.6)"><rect x="60" y="0" width="530" height="73" rx="16" class="bb"/><text x="82" y="44" font-size="22" font-weight="600" class="tx">Ngoại lệ hoặc sai lệch so với quy định</text><rect x="610" y="0" width="530" height="73" rx="16" class="bb"/><text x="632" y="44" font-size="22" font-weight="600" class="tx">Rủi ro về chất lượng, an toàn hoặc pháp lý</text><rect x="60" y="93" width="530" height="102" rx="16" class="bb"/><text x="82" y="137" font-size="22" font-weight="600" class="tx">Quyết định lặp lại theo chu kỳ, nơi tiền lệ có</text><text x="82" y="166" font-size="22" font-weight="600" class="tx">giá trị</text><rect x="610" y="93" width="530" height="102" rx="16" class="bb"/><text x="632" y="137" font-size="22" font-weight="600" class="tx">Quyết định có thể bị hỏi lại khi audit hoặc</text><text x="632" y="166" font-size="22" font-weight="600" class="tx">tranh chấp</text><rect x="60" y="223" width="1080" height="73" rx="16" class="bg"/><text x="82" y="267" font-size="22" font-weight="600" class="tx">Không cần lưu mọi tờ note, chỉ những lý do có giá trị về sau.</text></g></svg>

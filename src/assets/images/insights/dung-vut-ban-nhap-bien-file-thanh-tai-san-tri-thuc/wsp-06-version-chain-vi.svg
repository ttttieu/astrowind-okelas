<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-label="Chuỗi năm phiên bản: dữ liệu ban đầu, phương án A, điều chỉnh sau khi phát hiện máy có lịch bảo trì, phương án B có thêm tăng ca, và kết quả trình phê duyệt." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="512" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Năm phiên bản của một kế hoạch sản xuất (ví dụ minh họa)</text><g transform="translate(0 108)"><rect x="60" y="0" width="330.6666666666667" height="155" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">V1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Dữ liệu ban đầu</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Đơn hàng, tồn kho, năng lực máy.</text><rect x="434.6666666666667" y="0" width="330.6666666666667" height="155" rx="16" class="bb"/><text x="456.6666666666667" y="35" font-size="13" font-weight="600" class="mut">V2</text><text x="456.6666666666667" y="70" font-size="22" font-weight="600" class="tx">Phương án A</text><text x="456.6666666666667" y="102" font-size="17" font-weight="400" class="mut">Phân bổ theo năng lực hiện tại.</text><rect x="809.3333333333334" y="0" width="330.6666666666667" height="155" rx="16" class="bp"/><text x="831.3333333333334" y="35" font-size="13" font-weight="600" class="tp">V3</text><text x="831.3333333333334" y="70" font-size="22" font-weight="600" class="tp">Điều chỉnh</text><text x="831.3333333333334" y="102" font-size="17" font-weight="400" class="mut">Sửa sau khi phát hiện máy có lịch</text><text x="831.3333333333334" y="126" font-size="17" font-weight="400" class="mut">bảo trì.</text><line x1="396.6666666666667" y1="77.5" x2="416.6666666666667" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M414.6666666666667 68.5 l14 9 l-14 9z" class="arf"/><line x1="771.3333333333334" y1="77.5" x2="791.3333333333334" y2="77.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M789.3333333333334 68.5 l14 9 l-14 9z" class="arf"/><rect x="60" y="191" width="518" height="131" rx="16" class="bp"/><text x="82" y="226" font-size="13" font-weight="600" class="tp">V4</text><text x="82" y="261" font-size="22" font-weight="600" class="tp">Phương án B</text><text x="82" y="293" font-size="17" font-weight="400" class="mut">Phân bổ lại, thêm phương án tăng ca.</text><rect x="622" y="191" width="518" height="131" rx="16" class="bb"/><text x="644" y="226" font-size="13" font-weight="600" class="mut">V5</text><text x="644" y="261" font-size="22" font-weight="600" class="tx">Kết quả</text><text x="644" y="293" font-size="17" font-weight="400" class="mut">Phương án được chọn, trình phê duyệt.</text><line x1="584" y1="256.5" x2="604" y2="256.5" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M602 247.5 l14 9 l-14 9z" class="arf"/><path d="M974.6666666666667 159 V173 H319 V177" class="ar" fill="none" stroke-width="3" stroke-dasharray="6 6"/><path d="M310 177 l9 14 l9 -14z" class="arf"/></g><text x="60" y="464" font-size="13" font-weight="400" class="mut">Ví dụ minh họa của OKELAS, không phải trường hợp của khách hàng.</text></svg>

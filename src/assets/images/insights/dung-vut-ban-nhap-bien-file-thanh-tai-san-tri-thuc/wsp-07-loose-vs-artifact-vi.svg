<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Hai khối khác nhau: nhiều file phân tán với nhiều tên, và một artifact có nhiều phiên bản được quản lý; nhân viên vẫn làm việc như cũ còn hệ thống ghi nhận quá trình." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">File rời rạc và artifact có phiên bản</text><g transform="translate(0 132.6)"><rect x="60" y="0" width="508" height="155" rx="16" class="bg"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">FILE PHÂN TÁN</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Nhiều file, nhiều tên</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Không rõ bản nào đúng, không có lịch sử thay đổi.</text><rect x="632" y="0" width="508" height="155" rx="16" class="bb"/><text x="654" y="35" font-size="13" font-weight="600" class="mut">ARTIFACT QUẢN LÝ</text><text x="654" y="70" font-size="22" font-weight="600" class="tx">Một artifact, nhiều phiên bản</text><text x="654" y="102" font-size="17" font-weight="400" class="mut">Có người sửa, thời điểm, trạng thái; truy xuất và khai thác</text><text x="654" y="126" font-size="17" font-weight="400" class="mut">lại được.</text><text x="600" y="89.5" font-size="40" font-weight="700" class="tp" text-anchor="middle">≠</text><rect x="60" y="183" width="1080" height="73" rx="16" class="bi"/><text x="82" y="227" font-size="22" font-weight="600" class="ti">Nhân viên vẫn làm việc như cũ; hệ thống ghi nhận quá trình.</text></g></svg>

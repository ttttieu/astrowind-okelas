<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" width="1200" height="512" role="img" aria-label="Six questions for self-estimating: about high-risk positions, who, time to reach 80% capability and productivity drop; about specific costs, compensation, monthly error cost and the rise with less experienced staff." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="512" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Estimating the cost for your organization</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Use your own data rather than research figures from different conditions.</text><line x1="60.0" y1="428.0" x2="1140.0" y2="428.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="450.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-estimate questions from the article; a discussion aid, not a certified methodology.</text><text x="60.0" y="491.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="208.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">About high-risk positions</text><circle cx="94.0" cy="202.0" r="5" fill="var(--p)"/><text x="112.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Who are the 3–5 people whose departure would meaningfully</text><text x="112.0" y="226.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">affect operations?</text><circle cx="94.0" cy="253.2" r="5" fill="var(--p)"/><text x="112.0" y="258.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">For each, how long for a replacement to reach 80% of</text><text x="112.0" y="277.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">their capability?</text><circle cx="94.0" cy="304.4" r="5" fill="var(--p)"/><text x="112.0" y="309.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">During that time, how much would productivity in their area fall?</text><rect x="612.0" y="134.0" width="528.0" height="208.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">About specific costs</text><circle cx="646.0" cy="202.0" r="5" fill="var(--p)"/><text x="664.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What are the fully-loaded compensation costs for these positions?</text><circle cx="646.0" cy="253.2" r="5" fill="var(--p)"/><text x="664.0" y="258.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">What is the average monthly cost of errors and material waste in</text><text x="664.0" y="277.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">normal operations?</text><circle cx="646.0" cy="304.4" r="5" fill="var(--p)"/><text x="664.0" y="309.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">How much does that rise with less experienced staff?</text><rect x="60.0" y="358.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="391.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">From these, estimate the cost per high-risk position and compare it with retention and transfer measures.</text></svg>
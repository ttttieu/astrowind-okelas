<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-label="DMS giải quyết được kiểm soát phiên bản, phân quyền truy cập và tìm kiếm; phần còn thiếu là biết tài liệu nào quan trọng, tài liệu nào là tri thức sống và tài liệu nào là đầu ra đã xong." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="566" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">DMS giải quyết được gì, và còn thiếu gì</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quản lý tài liệu tốt hơn chưa phải là quản lý tri thức.</text><line x1="60.0" y1="482.0" x2="1140.0" y2="482.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="504.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="545.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="480.0" height="262.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">DMS có thể giải quyết</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phần mà hệ thống lưu trữ làm được</text><rect x="84.0" y="218.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="300.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Kiểm soát phiên bản</text><rect x="84.0" y="274.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="300.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phân quyền truy cập</text><rect x="84.0" y="330.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="300.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tìm kiếm đơn giản hơn</text><rect x="660.0" y="134.0" width="480.0" height="262.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="684.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Vẫn cần quản lý tri thức</text><text x="684.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phần mà lưu trữ tốt hơn không làm được</text><rect x="684.0" y="218.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="900.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Biết tài liệu nào quan trọng</text><rect x="684.0" y="274.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="900.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Biết tài liệu nào là tri thức sống</text><rect x="684.0" y="330.0" width="432.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="900.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Biết tài liệu nào là đầu ra đã xong, không cần duy trì</text><line x1="548.0" y1="265.0" x2="643.0" y2="265.0" stroke="var(--mut)" stroke-width="2"/><polygon points="652.0,265.0 643.0,269.9 643.0,260.1" fill="var(--mut)"/><rect x="60.0" y="412.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="445.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Giải pháp thực sự không phải lưu trữ tốt hơn, mà là quản lý tri thức tốt hơn.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Hai thẻ so sánh: ngăn chặn hoàn toàn và thiết kế để phát hiện sớm." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tổn thất còn lại không thể loại bỏ hoàn toàn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bài viết đề xuất chấp nhận tổn thất còn lại và tập trung vào phát hiện sớm.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nguyên tắc theo bài viết; chưa có số liệu nào được đưa vào hình.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="528.0" height="170.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="88.0" y="198.3" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Ngăn chặn hoàn toàn</text><text x="88.0" y="244.5" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Không thể loại bỏ hoàn toàn agency costs, nên không</text><text x="88.0" y="269.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">thể ngăn chặn mọi tổn thất.</text><rect x="612.0" y="150.0" width="528.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="198.3" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Thiết kế để phát hiện sớm</text><text x="640.0" y="244.5" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Chấp nhận tổn thất còn lại sẽ tồn tại và tập trung vào</text><text x="640.0" y="269.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">phát hiện sớm.</text><rect x="60.0" y="372.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="405.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thiết kế để phát hiện sớm vì không thể ngăn chặn hoàn toàn.</text></svg>
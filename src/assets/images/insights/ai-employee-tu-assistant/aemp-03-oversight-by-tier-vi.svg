<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 682" width="1200" height="682" role="img" aria-label="Hai cột: quyền Read có cột thấp, quyền Execute có cột cao hơn nhiều, không có số liệu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="682" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Quyền hạn càng lớn, chi phí giám sát càng lớn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Một agent chỉ có quyền Read cần ít chi phí quản trị hơn nhiều so với agent có quyền Execute.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">So sánh định tính theo bài viết; các cột không có số liệu, chiều cao chỉ thể hiện thứ bậc.</text><text x="60.0" y="661.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="200.0" y="300.0" width="260.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="330.0" y="340.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí quản trị thấp</text><text x="330.0" y="468.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Read</text><text x="330.0" y="491.5" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="middle">Chỉ đọc và phân tích</text><rect x="680.0" y="170.0" width="260.0" height="260.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="810.0" y="210.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Chi phí quản trị cao</text><text x="810.0" y="468.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">Execute</text><text x="810.0" y="491.5" font-size="15" font-weight="400" fill="var(--mut)" text-anchor="middle">Tự hành động trong ngưỡng</text><rect x="60.0" y="528.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="561.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quyền hạn càng lớn thì cần giám sát và cam kết càng chặt.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Hai nhóm: bên trái là Identity và Authority; bên phải là Responsibility và Audit Trail, tương ứng bonding và monitoring; dưới cùng là residual loss." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn yếu tố tương ứng với các loại chi phí ủy quyền</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Identity và Authority thuộc quan hệ ủy quyền; Responsibility và Audit Trail ứng với chi phí.</text><line x1="60.0" y1="536.0" x2="1140.0" y2="536.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="558.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ánh xạ theo bài viết; bài chỉ ánh xạ trực tiếp Responsibility và Audit Trail, phần Identity và Authority là mô tả vai trò.</text><text x="60.0" y="599.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="153.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Thành phần của quan hệ ủy quyền</text><text x="620.0" y="153.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Cơ chế quản trị chi phí</text><rect x="60.0" y="170.0" width="520.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="320.0" y="211.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Identity: ai nằm trong quan hệ ủy quyền</text><rect x="60.0" y="254.0" width="520.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="320.0" y="295.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Authority: phạm vi quyết định được giao</text><rect x="620.0" y="170.0" width="520.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="880.0" y="211.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Responsibility ↔ chi phí cam kết (bonding)</text><rect x="620.0" y="254.0" width="520.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="880.0" y="295.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Audit Trail ↔ chi phí giám sát (monitoring)</text><rect x="60.0" y="364.0" width="1080.0" height="62.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="400.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Residual loss: tổn thất còn lại, cần được chấp nhận và thiết kế để phát hiện sớm</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Quan hệ ủy quyền có cả thành phần lẫn chi phí; bốn yếu tố bao phủ cả hai.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img" aria-label="Five questions before approving a customization: is it customization or configuration, can the process adapt, what is the true total cost, is the value measurable and who decides." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="654" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five questions before approving a customization</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Answer in order before approving any request.</text><line x1="60.0" y1="570.0" x2="1140.0" y2="570.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="592.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Framework from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="633.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="165.0" r="15" fill="var(--p)"/><text x="96.0" y="170.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="171.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Is this customization or configuration?</text><text x="640.0" y="170.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">If it is configuration, do it now.</text><rect x="60.0" y="206.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="237.0" r="15" fill="var(--p)"/><text x="96.0" y="242.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="130.0" y="243.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Can the process be adapted to fit ERP?</text><text x="640.0" y="242.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Should this process work the way ERP supports?</text><rect x="60.0" y="278.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="309.0" r="15" fill="var(--p)"/><text x="96.0" y="314.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="315.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">What is the true total cost?</text><text x="640.0" y="304.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Development, testing, annual maintenance, upgrade impact,</text><text x="640.0" y="324.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dependency risk.</text><rect x="60.0" y="350.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="381.0" r="15" fill="var(--p)"/><text x="96.0" y="386.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="130.0" y="387.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Is the business value measurable?</text><text x="640.0" y="386.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">If not, reconsider.</text><rect x="60.0" y="422.0" width="1080.0" height="62.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="453.0" r="15" fill="var(--p)"/><text x="96.0" y="458.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="130.0" y="459.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Who is the decision-maker?</text><text x="640.0" y="458.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Someone with business authority, not only the project or IT team.</text><rect x="60.0" y="500.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="533.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Customization needs a structured framework, not a reaction to requests.</text></svg>
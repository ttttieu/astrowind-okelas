<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Một câu hỏi về sự cố chất lượng được trả lời trong ba môi trường: giấy, paperless và digital operations"><style>
  :root{--p:1 97 239;--s:1 84 207;--a:109 40 217;--bg:255 255 255;--tx:0 0 0;--mut:16 16 16;--line:16 16 16}
  @media (prefers-color-scheme: dark){:root{--bg:8 9 10;--tx:247 248 248;--mut:229 236 246;--line:229 236 246}}
  text{font-family:Inter,Roboto,'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
  .bg{fill:rgb(var(--bg))}
  .title{font-size:32px;font-weight:700;fill:rgb(var(--tx))}
  .big{font-size:50px;font-weight:700;fill:rgb(var(--tx))}
  .subtitle{font-size:17px;fill:rgb(var(--mut)/.66)}
  .term{font-size:16px;font-weight:700;fill:rgb(var(--tx))}
  .h2{font-size:19px;font-weight:700;fill:rgb(var(--tx))}
  .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;fill:rgb(var(--mut)/.66)}
  .desc{font-size:13.5px;fill:rgb(var(--mut)/.85)}
  .body{font-size:14.5px;fill:rgb(var(--mut)/.88)}
  .mut{font-size:13px;fill:rgb(var(--mut)/.66)}
  .val{font-size:15px;font-weight:600;fill:rgb(var(--tx))}
  .foot{font-size:13px;fill:rgb(var(--mut)/.5)}
  .chip{font-size:12px;font-weight:700;letter-spacing:.06em}
  .g1 .box{fill:rgb(var(--p)/.08);stroke:rgb(var(--p))}
  .g2 .box{fill:rgb(var(--s)/.12);stroke:rgb(var(--s))}
  .g3 .box{fill:rgb(var(--a)/.09);stroke:rgb(var(--a))}
  .g1 .bar{fill:rgb(var(--p))}.g2 .bar{fill:rgb(var(--s))}.g3 .bar{fill:rgb(var(--a))}
  .g1 .acc{fill:rgb(var(--p))}.g2 .acc{fill:rgb(var(--s))}.g3 .acc{fill:rgb(var(--a))}
  .box{stroke-width:1.5}
  .card{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .soft{fill:rgb(var(--line)/.05)}
  .ghost{fill:rgb(var(--line)/.22)}
  .rule{stroke:rgb(var(--line)/.45);stroke-width:2;fill:none}
  .ring{stroke:rgb(var(--line)/.18);stroke-width:1;fill:none}
  .axis{stroke:rgb(var(--line)/.18);stroke-width:1}
  .poly{fill:rgb(var(--p)/.18);stroke:rgb(var(--p));stroke-width:2.5;stroke-linejoin:round}
  .dot{fill:rgb(var(--p));stroke:rgb(var(--bg));stroke-width:2}
  .ah{fill:rgb(var(--line)/.45)}
  .chipbox{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  .chiptx{fill:rgb(var(--a))}
  .blue{fill:rgb(var(--p))}.purp{fill:rgb(var(--a))}
  .ok{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .pr{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .final{fill:rgb(var(--tx));}
  .finaltx{font-size:18px;font-weight:700;fill:rgb(var(--bg))}
  @media (prefers-color-scheme: dark){
    .g1 .box{fill:rgb(var(--p)/.18)}.g2 .box{fill:rgb(var(--s)/.22)}.g3 .box{fill:rgb(var(--a)/.2)}
    .chiptx{fill:rgb(167 139 250)}.chipbox{stroke:rgb(167 139 250)}.purp{fill:rgb(167 139 250)}.pr{stroke:rgb(167 139 250)}
    .g3 .acc{fill:rgb(167 139 250)}
  }
</style><style>
  .tag{font-size:12px;font-weight:700;letter-spacing:.06em;fill:rgb(var(--mut)/.66)}
  .big2{font-size:44px;font-weight:700;fill:rgb(var(--tx))}
  .metric{font-size:26px;font-weight:700;fill:rgb(var(--tx))}
  .metricp{font-size:26px;font-weight:700;fill:rgb(var(--a))}
  .step{fill:rgb(var(--line)/.05);stroke:rgb(var(--line)/.18);stroke-width:1.2}
  .stepp{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.2}
  .stepb{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.2}
  .lane{fill:rgb(var(--bg));stroke:rgb(var(--line)/.2);stroke-width:1.5}
  .lanep{fill:rgb(var(--a)/.06);stroke:rgb(var(--a));stroke-width:1.5}
  .lanb{fill:rgb(var(--p)/.05);stroke:rgb(var(--p));stroke-width:1.5}
  .cross{stroke:rgb(var(--line)/.55);stroke-width:2.5;stroke-linecap:round}
  .tick{stroke:rgb(var(--p));stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .tickp{stroke:rgb(var(--a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .bridge{fill:rgb(var(--a)/.10);stroke:rgb(var(--a));stroke-width:1.5}
  .endl{fill:rgb(var(--line)/.07);stroke:rgb(var(--line)/.25);stroke-width:1.5}
  .endr{fill:rgb(var(--p)/.10);stroke:rgb(var(--p));stroke-width:1.5}
  .dashv{stroke:rgb(var(--line)/.35);stroke-width:1.5;stroke-dasharray:5 5}
  .chipbox2{fill:rgb(var(--a)/.12);stroke:rgb(var(--a));stroke-width:1.2}
  @media (prefers-color-scheme: dark){
    .metricp{fill:rgb(167 139 250)}.tickp{stroke:rgb(167 139 250)}
    .stepp{stroke:rgb(167 139 250)}.lanep{stroke:rgb(167 139 250)}.bridge{stroke:rgb(167 139 250)}
    .chipbox2{stroke:rgb(167 139 250)}
  }
</style><style>
  .numw{font-size:18px;font-weight:700;fill:#fff}
  .chipfill{fill:rgb(var(--a))}
  .chipw{font-size:14px;font-weight:700;fill:#fff}
  .cell{fill:rgb(var(--line)/.07)}
  .c1{fill:rgb(var(--p))}.c2{fill:rgb(var(--s))}.c3{fill:rgb(var(--a))}
  .hl{fill:rgb(var(--a)/.07);stroke:rgb(var(--a));stroke-width:1.5}
  .dash{stroke:rgb(var(--line)/.4);stroke-width:2;stroke-dasharray:6 5;fill:none}
  .pa{stroke:rgb(var(--a));stroke-width:3;fill:none}
  .pah{fill:rgb(var(--a))}
  .bold-p{font-size:14.5px;font-weight:700;fill:rgb(var(--a))}
  @media (prefers-color-scheme: dark){
    .bold-p{fill:rgb(167 139 250)}.pa{stroke:rgb(167 139 250)}.pah{fill:rgb(167 139 250)}.c3{fill:rgb(167 139 250)}
    .hl{stroke:rgb(167 139 250)}.chipfill{fill:rgb(109 40 217)}
  }
</style><rect class="bg" width="1200" height="760"/>
<text class="title" x="60" y="78" text-anchor="start">Một câu hỏi, ba môi trường vận hành</text>
<text class="subtitle" x="60" y="110" text-anchor="start">Cùng một câu hỏi của CEO, thời gian và độ tin cậy của câu trả lời khác nhau</text>
<rect class="final" x="60" y="136" width="1080" height="76" rx="14"/>
<text class="finaltx" x="600" y="168" text-anchor="middle">“Tháng vừa qua có bao nhiêu sự cố chất lượng ở dây chuyền 2,</text>
<text class="finaltx" x="600" y="194" text-anchor="middle">nguyên nhân chính là gì, nhà cung cấp nào liên quan?”</text>
<rect class="lane" x="60" y="232" width="1080" height="138" rx="14"/>
<text class="tag" x="84" y="266" text-anchor="start">MÔI TRƯỜNG 1</text>
<text class="h2" x="84" y="294" text-anchor="start">Giấy</text>
<rect class="step" x="84" y="312" width="150" height="52" rx="10"/>
<text class="desc" x="159.0" y="343" text-anchor="middle">Tìm sổ ghi chép</text>
<line class="rule" x1="237" y1="338.0" x2="245" y2="338.0"/><path class="ah" d="M254 338.0 l-9 -5 v10 z"/>
<rect class="step" x="256" y="312" width="150" height="52" rx="10"/>
<text class="desc" x="331.0" y="343" text-anchor="middle">Đọc</text>
<line class="rule" x1="409" y1="338.0" x2="417" y2="338.0"/><path class="ah" d="M426 338.0 l-9 -5 v10 z"/>
<rect class="step" x="428" y="312" width="150" height="52" rx="10"/>
<text class="desc" x="503.0" y="343" text-anchor="middle">Tổng hợp thủ công</text>
<line class="axis" x1="640" y1="252" x2="640" y2="350"/>
<text class="tag" x="670" y="272" text-anchor="start">THỜI GIAN</text>
<text class="metric" x="670" y="306" text-anchor="start">1–3 ngày</text>
<text class="tag" x="670" y="332" text-anchor="start">ĐỘ CHÍNH XÁC</text>
<text class="body" x="670" y="354" text-anchor="start">Phụ thuộc người tổng hợp</text>
<rect class="lanb" x="60" y="382" width="1080" height="138" rx="14"/>
<text class="tag" x="84" y="416" text-anchor="start">MÔI TRƯỜNG 2</text>
<text class="h2" x="84" y="444" text-anchor="start">Paperless (PDF)</text>
<rect class="stepb" x="84" y="462" width="150" height="52" rx="10"/>
<text class="desc" x="159.0" y="493" text-anchor="middle">Tìm file</text>
<line class="rule" x1="237" y1="488.0" x2="245" y2="488.0"/><path class="ah" d="M254 488.0 l-9 -5 v10 z"/>
<rect class="stepb" x="256" y="462" width="150" height="52" rx="10"/>
<text class="desc" x="331.0" y="493" text-anchor="middle">Mở từng file</text>
<line class="rule" x1="409" y1="488.0" x2="417" y2="488.0"/><path class="ah" d="M426 488.0 l-9 -5 v10 z"/>
<rect class="stepb" x="428" y="462" width="150" height="52" rx="10"/>
<text class="desc" x="503.0" y="493" text-anchor="middle">Tổng hợp vào Excel</text>
<line class="axis" x1="640" y1="402" x2="640" y2="500"/>
<text class="tag" x="670" y="422" text-anchor="start">THỜI GIAN</text>
<text class="metric" x="670" y="456" text-anchor="start">Nửa ngày – 1 ngày</text>
<text class="tag" x="670" y="482" text-anchor="start">ĐỘ CHÍNH XÁC</text>
<text class="body" x="670" y="504" text-anchor="start">Thủ công, phụ thuộc người làm</text>
<rect class="lanep" x="60" y="532" width="1080" height="138" rx="14"/>
<text class="tag" x="84" y="566" text-anchor="start">MÔI TRƯỜNG 3</text>
<text class="h2" x="84" y="594" text-anchor="start">Digital operations (vận hành số)</text>
<rect class="stepp" x="84" y="612" width="150" height="52" rx="10"/>
<text class="desc" x="159.0" y="643" text-anchor="middle">Lọc theo điều kiện</text>
<line class="rule" x1="237" y1="638.0" x2="245" y2="638.0"/><path class="ah" d="M254 638.0 l-9 -5 v10 z"/>
<rect class="stepp" x="256" y="612" width="150" height="52" rx="10"/>
<text class="desc" x="331.0" y="635" text-anchor="middle">Hệ thống phân loại</text>
<text class="desc" x="331.0" y="652" text-anchor="middle">tự động</text>
<line class="rule" x1="409" y1="638.0" x2="417" y2="638.0"/><path class="ah" d="M426 638.0 l-9 -5 v10 z"/>
<rect class="stepp" x="428" y="612" width="150" height="52" rx="10"/>
<text class="desc" x="503.0" y="643" text-anchor="middle">Có kết quả</text>
<line class="axis" x1="640" y1="552" x2="640" y2="650"/>
<text class="tag" x="670" y="572" text-anchor="start">THỜI GIAN</text>
<text class="metricp" x="670" y="606" text-anchor="start">Vài phút</text>
<text class="tag" x="670" y="632" text-anchor="start">ĐỘ CHÍNH XÁC</text>
<text class="body" x="670" y="654" text-anchor="start">Kiểm chứng được, có audit trail</text>
<text class="foot" x="60" y="736" text-anchor="start">okelas.com</text>
<text class="foot" x="1140" y="736" text-anchor="end">Mốc thời gian là ước tính minh họa theo kịch bản, không phải số đo thực tế.</text>
</svg>
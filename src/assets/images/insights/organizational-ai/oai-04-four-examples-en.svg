<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Four example columns: quality control, audit preparation, new employee onboarding, supplier management; each has a short description." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four examples you can build once the foundation is ready</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative scenarios; each becomes buildable once process, data and governance are in place.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The four examples are composite illustrations from the article, not measured deployment results.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="176.0" width="258.0" height="8.0" rx="4" fill="var(--p)"/><rect x="60.0" y="184.0" width="258.0" height="185.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="220.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quality control</text><text x="80.0" y="254.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Monitor inspection data</text><text x="80.0" y="275.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">near real time, catch trends</text><text x="80.0" y="296.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">early, and alert the</text><text x="80.0" y="318.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">responsible person with</text><text x="80.0" y="339.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">specific evidence.</text><rect x="334.0" y="176.0" width="258.0" height="8.0" rx="4" fill="var(--p)"/><rect x="334.0" y="184.0" width="258.0" height="185.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="354.0" y="220.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Audit preparation</text><text x="354.0" y="254.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Review records for a</text><text x="354.0" y="275.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">period, identify gaps and</text><text x="354.0" y="296.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">produce a pre-audit list</text><text x="354.0" y="318.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">with evidence, replacing</text><text x="354.0" y="339.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">days of manual work.</text><rect x="608.0" y="176.0" width="258.0" height="8.0" rx="4" fill="var(--p)"/><rect x="608.0" y="184.0" width="258.0" height="185.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="628.0" y="220.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">New employee</text><text x="628.0" y="244.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">onboarding</text><text x="628.0" y="278.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Guide new hires through real</text><text x="628.0" y="299.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">processes tied to their</text><text x="628.0" y="321.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">products and lines, and</text><text x="628.0" y="342.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">record training with evidence.</text><rect x="882.0" y="176.0" width="258.0" height="8.0" rx="4" fill="var(--p)"/><rect x="882.0" y="184.0" width="258.0" height="185.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="902.0" y="220.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Supplier management</text><text x="902.0" y="254.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Track performance, incoming</text><text x="902.0" y="275.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">inspection results and</text><text x="902.0" y="296.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">certification; flag supply risks</text><text x="902.0" y="318.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">before production is affected.</text><rect x="60.0" y="413.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="446.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Each example uses the same foundation; they differ in data scope and who receives the alert.</text></svg>
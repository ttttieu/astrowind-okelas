<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" width="1200" height="642" role="img" aria-label="Two systems answer the same question: system 1 summarizes the SOP; system 2 checks actual data and names lots missing steps with evidence." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="642" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Same model, different results depending on context</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">System 1 summarizes the SOP; system 2 queries inspection records and answers with evidence.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The two systems are a composite illustration from the article, not measured results.</text><text x="60.0" y="621.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="1080.0" height="52.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="600.0" y="202.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Does the incoming lot follow the inspection procedure?</text><rect x="60.0" y="250.0" width="534.0" height="193.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="288.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System 1</text><text x="84.0" y="318.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Summarizes the SOP</text><text x="84.0" y="351.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Describes what should happen</text><text x="84.0" y="380.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Does not check actual records</text><text x="84.0" y="410.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Cannot point to lots missing steps</text><rect x="606.0" y="250.0" width="534.0" height="193.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="630.0" y="288.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">System 2</text><text x="630.0" y="318.2" font-size="15" font-weight="700" fill="var(--s)" text-anchor="start">Checks actual records</text><text x="630.0" y="351.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Queries inspection results from the last 30 days</text><text x="630.0" y="380.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Checks against approved supplier specifications</text><text x="630.0" y="410.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">– Names lots missing mandatory steps, with evidence</text><rect x="60.0" y="487.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="520.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The gap lies in the organizational context AI is connected to, not in the model.</text></svg>
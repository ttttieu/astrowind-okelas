<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="Five warning signs of a governance gap: master data quality deteriorates, problems reported but not resolved, unmanaged change requests, uncontrolled user access and nobody knowing how well the system works." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="514" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five warning signs of a governance gap</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">These typically appear six to eighteen months after go-live.</text><line x1="60.0" y1="430.0" x2="1140.0" y2="430.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="452.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="493.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Master data quality</text><text x="76.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">deteriorates</text><text x="76.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Products created</text><text x="76.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">off-convention,</text><text x="76.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">duplicate vendors, stale</text><text x="76.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">customer data.</text><rect x="279.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="311.0" cy="166.0" r="15" fill="var(--a)"/><text x="311.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="295.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Problems reported</text><text x="295.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">but not resolved</text><text x="295.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Issues bounce between</text><text x="295.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">managers; no ticket</text><text x="295.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">system, SLA or final owner.</text><rect x="498.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--a)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="514.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Change requests</text><text x="514.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">are unmanaged</text><text x="514.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No clear decider,</text><text x="514.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">implementer or</text><text x="514.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">validator; some changes</text><text x="514.0" y="319.5" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">undocumented.</text><rect x="717.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="749.0" cy="166.0" r="15" fill="var(--a)"/><text x="749.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="733.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">User access is</text><text x="733.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">uncontrolled</text><text x="733.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Granted by verbal request;</text><text x="733.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">leavers keep access.</text><rect x="936.0" y="134.0" width="204.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="968.0" cy="166.0" r="15" fill="var(--a)"/><text x="968.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="952.0" y="212.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Nobody knows how</text><text x="952.0" y="234.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">well it works</text><text x="952.0" y="264.1" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">No regular reporting;</text><text x="952.0" y="282.6" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">leaders learn only when</text><text x="952.0" y="301.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">something breaks.</text><rect x="60.0" y="360.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="393.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">With no owner and no process, problems simply accumulate.</text></svg>
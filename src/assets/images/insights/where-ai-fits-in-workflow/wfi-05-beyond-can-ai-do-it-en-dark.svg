<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Choosing the automation level should not rest only on whether AI can do it, but also on long-term effects such as automation complacency and skill decline in decision-making." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="548" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Choosing automation: not only whether AI can do it</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Automation does not just replace people: it changes the nature of their work.</text><line x1="60.0" y1="486.0" x2="1140.0" y2="486.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="508.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="400.0" height="240.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="152.0" width="176.5" height="26.0" rx="13.0" fill="#08090A" stroke="#9AA6B8" stroke-width="1.2"/><text x="172.3" y="169.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="middle">The technical question</text><text x="84.0" y="231.3" font-size="24" font-weight="700" fill="#9AA6B8" text-anchor="start">Can AI do it?</text><text x="84.0" y="280.3" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Necessary, but not enough to choose the</text><text x="84.0" y="302.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">automation level.</text><line x1="468.0" y1="254.0" x2="505.0" y2="254.0" stroke="#A78BFA" stroke-width="3"/><polygon points="516.0,254.0 505.0,260.1 505.0,247.9" fill="#A78BFA"/><rect x="526.0" y="134.0" width="614.0" height="240.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><rect x="550.0" y="152.0" width="117.5" height="26.0" rx="13.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="608.7" y="169.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Also consider</text><text x="550.0" y="221.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Long-term effects on the team’s decision-making ability</text><rect x="550.0" y="268.0" width="566.0" height="42.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="833.0" y="294.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Over-reliance on automation (automation complacency)</text><rect x="550.0" y="320.0" width="566.0" height="42.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="833.0" y="346.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Skill decline when people rarely practise deciding</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Choose the level on technical capability and on the human capability worth keeping.</text></svg>
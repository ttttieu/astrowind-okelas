<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The four-stage information-processing model: acquisition, analysis, decision and action selection, and implementation, mapped to recording an event, classifying it, deciding, and acting; the automation level can differ at each stage." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Four information-processing stages in a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The right automation level can differ at each stage; it need not be uniform.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="814.4" y="124.0" width="325.6" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="977.2" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Parasuraman, Sheridan and Wickens (2000) model</text><rect x="60.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="194.0" r="15" fill="#2B74F5"/><text x="92.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Information acquisition</text><text x="76.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Sensing input data</text><rect x="76.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="86.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">The system records a</text><text x="86.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">request or event</text><line x1="317.0" y1="194.0" x2="327.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,194.0 327.0,197.3 327.0,190.7" fill="#2B74F5"/><rect x="335.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="194.0" r="15" fill="#2B74F5"/><text x="367.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Information analysis</text><text x="351.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Interpreting data</text><rect x="351.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="361.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">The system understands</text><text x="361.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">and classifies it</text><line x1="592.0" y1="194.0" x2="602.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,194.0 602.0,197.3 602.0,190.7" fill="#2B74F5"/><rect x="610.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="194.0" r="15" fill="#2B74F5"/><text x="642.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Decision and</text><text x="626.0" y="265.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">action selection</text><text x="626.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Choosing the action</text><rect x="626.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="636.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">The system or a person</text><text x="636.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">decides the action</text><line x1="867.0" y1="194.0" x2="877.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,194.0 877.0,197.3 877.0,190.7" fill="#2B74F5"/><rect x="885.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="194.0" r="15" fill="#2B74F5"/><text x="917.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Action implementation</text><text x="901.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Carrying it out</text><rect x="901.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="911.0" y="359.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">The action is performed</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The better question: at which stage should AI take part, and at what automation level?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Two criteria decide what goes to rules and what stays with people: how reversible the action is and how certain the input data is; the decision still belongs to a rule or a person." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Two criteria: hand to a rule or keep with a person</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Two criteria help decide what goes to rules and what stays with people.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Illustrative example</text><text x="60.0" y="149.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Can the action be reversed</text><rect x="60.0" y="168.0" width="530.0" height="134.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="80.0" y="198.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Easily reversible</text><text x="80.0" y="227.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Sending a reminder, creating an unsent draft</text><text x="80.0" y="280.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Can go to an approved rule; AI only prepares input</text><rect x="60.0" y="314.0" width="530.0" height="134.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="344.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Hard or impossible to reverse</text><text x="80.0" y="373.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Sending money, confirming a contract, rejecting a</text><text x="80.0" y="394.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">customer request</text><text x="80.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">A person confirms before it is carried out</text><text x="610.0" y="149.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">How certain is the input data</text><rect x="610.0" y="168.0" width="530.0" height="134.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="630.0" y="198.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Structured, little ambiguity</text><text x="630.0" y="227.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">A number crossing a defined threshold</text><text x="630.0" y="280.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">AI interprets more reliably; the rule runs steadily</text><rect x="610.0" y="314.0" width="530.0" height="134.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="630.0" y="344.9" font-size="16" font-weight="700" fill="#9AA6B8" text-anchor="start">Unstructured, ambiguous</text><text x="630.0" y="373.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">A complaint email written emotionally</text><text x="630.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">AI interpretation needs more frequent human checks</text><rect x="60.0" y="464.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="497.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The decision still belongs to a rule or a person, not to AI.</text></svg>
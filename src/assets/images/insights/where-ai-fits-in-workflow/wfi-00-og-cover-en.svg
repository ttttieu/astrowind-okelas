<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The four information-processing stages of a workflow; AI interprets input and prepares evidence, while decision authority stays with rules or people." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Where AI Fits in a Workflow: Interpreting Input and</text><text x="60.0" y="173.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Preparing Evidence</text><text x="60.0" y="281.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">Four information-processing stages</text><rect x="60.0" y="296.0" width="240.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="180.0" y="332.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Acquire</text><line x1="304.0" y1="326.0" x2="325.0" y2="326.0" stroke="var(--p)" stroke-width="3"/><polygon points="336.0,326.0 325.0,332.1 325.0,319.9" fill="var(--p)"/><rect x="340.0" y="296.0" width="240.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="460.0" y="332.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Analyze</text><line x1="584.0" y1="326.0" x2="605.0" y2="326.0" stroke="var(--p)" stroke-width="3"/><polygon points="616.0,326.0 605.0,332.1 605.0,319.9" fill="var(--p)"/><rect x="620.0" y="296.0" width="240.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="740.0" y="332.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Decide</text><line x1="864.0" y1="326.0" x2="885.0" y2="326.0" stroke="var(--p)" stroke-width="3"/><polygon points="896.0,326.0 885.0,332.1 885.0,319.9" fill="var(--p)"/><rect x="900.0" y="296.0" width="240.0" height="60.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="1020.0" y="332.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Implement</text><text x="60.0" y="407.0" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Where AI supports</text><rect x="60.0" y="422.0" width="520.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="320.0" y="458.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Interpret input</text><rect x="620.0" y="422.0" width="240.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="740.0" y="458.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Prepare evidence</text><rect x="900.0" y="422.0" width="240.0" height="60.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8" stroke-dasharray="5 4"/><text x="1020.0" y="458.2" font-size="17" font-weight="700" fill="var(--mut)" text-anchor="middle">Does not execute</text><rect x="60.0" y="514.0" width="1080.0" height="64.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="600.0" y="552.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision authority: rules issued by authoriz
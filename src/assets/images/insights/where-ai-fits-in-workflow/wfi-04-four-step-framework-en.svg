<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four steps: break the process into four stages, choose who is responsible by reversibility and data certainty, roll out one stage at a time, and review periodically by the rule owner." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four steps to bring AI into a workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Roll out one stage, verify, then change scope only by issuing new rules.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Break the process into</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">four stages</text><text x="76.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Identify acquisition, analysis,</text><text x="76.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">decision and action rather</text><text x="76.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">than treating the process as</text><text x="76.0" y="334.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">one block.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="var(--p)"/><rect x="335.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Choose who is</text><text x="351.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">responsible</text><text x="351.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Reversible and clear: a rule</text><text x="351.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">handles it. Otherwise AI stops at</text><text x="351.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">interpretation or evidence and a</text><text x="351.0" y="334.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">person decides.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="var(--p)"/><rect x="610.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--p)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Roll out one stage at</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">a time</text><text x="626.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Start with AI interpreting input,</text><text x="626.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">keep people at the decision;</text><text x="626.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">scope changes only by issuing</text><text x="626.0" y="334.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">new rules.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="var(--p)"/><rect x="885.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Review periodically</text><text x="901.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">The rule owner revisits the</text><text x="901.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">scope of rules and of AI</text><text x="901.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">support; every change is</text><text x="901.0" y="334.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">logged for traceability.</text><rect x="60.0" y="400.0" width="1080.0" height="84.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="446.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Example from the article: start with</text><rect x="400.0" y="422.0" width="330.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="565.0" y="447.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">AI interprets input</text><rect x="744.0" y="422.0" width="330.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="909.0" y="447.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">People still decide</text><rect x="60.0" y="502.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="535.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Scope changes by issuing rules, not by promoting AI to more authority.</text></svg>
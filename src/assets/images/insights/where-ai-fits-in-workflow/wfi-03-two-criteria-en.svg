<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Two criteria for choosing the automation level: reversibility of the action and certainty of the input data; easily reversible actions and clear data tolerate more automation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Two criteria for choosing the automation level</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">There is no universal answer; two criteria help set the right level at each stage.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram; the examples are illustrations from the article, not measured data.</text><rect x="1002.6" y="124.0" width="137.4" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1071.3" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Illustrative example</text><text x="60.0" y="149.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Can the action be reversed</text><rect x="60.0" y="168.0" width="530.0" height="134.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="198.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Easily reversible</text><text x="80.0" y="227.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Sending a reminder, creating an unsent draft</text><text x="80.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tolerates higher automation</text><rect x="60.0" y="314.0" width="530.0" height="134.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="344.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Hard or impossible to reverse</text><text x="80.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Sending money, confirming a contract, rejecting a</text><text x="80.0" y="394.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">customer request</text><text x="80.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Keep at Recommend or lower</text><text x="610.0" y="149.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">How certain is the input data</text><rect x="610.0" y="168.0" width="530.0" height="134.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="630.0" y="198.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Structured, little ambiguity</text><text x="630.0" y="227.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A number crossing a defined threshold</text><text x="630.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">AI can be more confident in analysis and decision</text><rect x="610.0" y="314.0" width="530.0" height="134.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="630.0" y="344.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Unstructured, ambiguous</text><text x="630.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A complaint email written emotionally</text><text x="630.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Keep automation low in analysis; people decide</text><rect x="60.0" y="464.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="497.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Automation can rise with the reversibility of the action and the certainty of the data.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 714" width="1200" height="714" role="img" aria-label="A boundary table by four stages: acquisition, analysis, decision selection, action implementation, with three columns: rule in the workflow, AI input support, and people; AI holds decision authority in no row, and an action runs on its own only when a rule permits it." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="714" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Boundary: rules, AI and people at each stage</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI holds decision authority in no row; an action runs on its own only when a rule permits it.</text><line x1="60.0" y1="652.0" x2="1140.0" y2="652.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="674.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">An orienting framework for discussion, not measured data.</text><rect x="240.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--p)"/><text x="391.5" y="155.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Rule in the workflow</text><rect x="553.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="704.5" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">AI input support</text><rect x="866.0" y="130.0" width="274.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><text x="1003.0" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">People</text><text x="64.0" y="155.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Stage</text><circle cx="76.0" cy="226.0" r="13" fill="var(--p)"/><text x="76.0" y="230.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="98.0" y="213.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Information</text><text x="98.0" y="234.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">acquisition</text><rect x="240.0" y="180.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="231.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Records by defined fields and rules</text><rect x="553.0" y="180.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="221.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Extracts and interprets from emails,</text><text x="567.0" y="240.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">forms, scanned documents</text><rect x="866.0" y="180.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="880.0" y="231.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Only when data is ambiguous</text><circle cx="76.0" cy="328.0" r="13" fill="var(--p)"/><text x="76.0" y="332.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="98.0" y="315.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Information</text><text x="98.0" y="336.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">analysis</text><rect x="240.0" y="282.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="333.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Applies written criteria and thresholds</text><rect x="553.0" y="282.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="323.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Classifies; assembles evidence from</text><text x="567.0" y="342.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">similar cases</text><rect x="866.0" y="282.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="880.0" y="333.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Confirms when risk is high</text><circle cx="76.0" cy="430.0" r="13" fill="var(--p)"/><text x="76.0" y="434.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="98.0" y="417.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Decision</text><text x="98.0" y="438.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">selection</text><rect x="240.0" y="384.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="425.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Only when criteria are clear and the cost</text><text x="254.0" y="444.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">of error is low (default path)</text><rect x="553.0" y="384.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="435.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Prepares evidence; does not decide</text><rect x="866.0" y="384.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="425.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Judges; confirmation mandatory</text><text x="880.0" y="444.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">when the cost of error is high</text><circle cx="76.0" cy="532.0" r="13" fill="var(--p)"/><text x="76.0" y="536.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="98.0" y="519.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Action</text><text x="98.0" y="540.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">implementation</text><rect x="240.0" y="486.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="537.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Carries out actions a rule has permitted</text><rect x="553.0" y="486.0" width="303.0" height="92.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="567.0" y="537.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Does not execute</text><rect x="866.0" y="486.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="527.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Carries out or approves</text><text x="880.0" y="546.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hard-to-reverse actions</text><rect x="60.0" y="592.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="625.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">With no permitting rule, the action waits for a person.</text></svg>
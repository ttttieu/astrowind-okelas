<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 642" width="1200" height="642" role="img" aria-label="Bốn thẻ nguyên tắc được đánh số theo dạng lưới 2×2." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="642" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn nguyên tắc quản lý quyền hạn của AI</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn nguyên tắc bài viết đề xuất cho việc quản lý quyền hạn của AI.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn nguyên tắc theo bài viết; cách áp dụng cụ thể tùy từng doanh nghiệp.</text><text x="60.0" y="621.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="176.0" r="15" fill="var(--gm)"/><text x="100.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="140.0" y="180.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Trao quyền tường minh</text><text x="140.0" y="221.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không suy diễn quyền từ năng lực. Quyền hạn phải</text><text x="140.0" y="243.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">được trao một cách tường minh.</text><rect x="612.0" y="134.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="652.0" cy="176.0" r="15" fill="var(--p)"/><text x="652.0" y="181.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="692.0" y="180.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Gắn với người chịu trách nhiệm</text><text x="692.0" y="221.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi quyền hạn gắn với một người cụ thể</text><text x="692.0" y="243.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">chịu trách nhiệm.</text><rect x="60.0" y="300.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="342.0" r="15" fill="var(--gm)"/><text x="100.0" y="347.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="140.0" y="346.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Phạm vi theo hậu quả</text><text x="140.0" y="387.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Phân tầng theo hậu quả và khả năng đảo ngược,</text><text x="140.0" y="409.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">không theo mức thông minh của mô hình.</text><rect x="612.0" y="300.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="652.0" cy="342.0" r="15" fill="var(--p)"/><text x="652.0" y="347.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="692.0" y="346.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Thu hồi độc lập</text><text x="692.0" y="387.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Việc thu hồi quyền không phụ thuộc vào việc đánh</text><text x="692.0" y="409.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">giá lại năng lực.</text><rect x="60.0" y="488.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="521.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Authority phải được trao một cách tường minh, không được suy diễn từ năng lực.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Six questions an ERP implementation partner needs answered about each process: number of steps, who performs them, who approves, data captured, exceptions and links to adjacent processes; if departments answer differently the system cannot be configured accurately." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="560" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six questions ERP needs answered about a process</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">ERP operates processes that are already designed; it is not a tool for designing them.</text><line x1="60.0" y1="476.0" x2="1140.0" y2="476.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="498.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="539.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">What an implementation partner needs to know, for each process</text><rect x="60.0" y="194.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="240.0" r="15" fill="var(--p)"/><text x="92.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="245.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">How many steps does it have?</text><rect x="426.0" y="194.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="458.0" cy="240.0" r="15" fill="var(--p)"/><text x="458.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="486.0" y="245.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Who performs each step?</text><rect x="792.0" y="194.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="824.0" cy="240.0" r="15" fill="var(--p)"/><text x="824.0" y="245.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="852.0" y="235.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Who approves, and under</text><text x="852.0" y="256.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">what conditions?</text><rect x="60.0" y="298.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="344.0" r="15" fill="var(--p)"/><text x="92.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="339.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">What data is captured at</text><text x="120.0" y="360.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">each point?</text><rect x="426.0" y="298.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="458.0" cy="344.0" r="15" fill="var(--p)"/><text x="458.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="486.0" y="339.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">When do exceptions occur, and</text><text x="486.0" y="360.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">how are they handled?</text><rect x="792.0" y="298.0" width="348.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="824.0" cy="344.0" r="15" fill="var(--p)"/><text x="824.0" y="349.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="852.0" y="328.7" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">How does it connect to</text><text x="852.0" y="349.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">adjacent processes, and in</text><text x="852.0" y="370.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">what sequence?</text><rect x="60.0" y="406.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="439.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">If departments answer the same question differently, the system cannot be configured accurately.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img" aria-label="Ba nguyên nhân phổ biến khiến nhân viên quay lại Excel: cấu hình không khớp quy trình thực tế, thiếu lý do cá nhân để thay đổi và dữ liệu ERP không đáng tin." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="486" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba nguyên nhân phổ biến khiến nhân viên quay lại Excel</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Excel linh hoạt hơn nên có giá trị ngay khi người dùng chịu áp lực vận hành.</text><line x1="60.0" y1="402.0" x2="1140.0" y2="402.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="424.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải thống kê.</text><text x="60.0" y="465.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--a)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cấu hình không khớp quy trình</text><text x="76.0" y="239.8" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">thực tế</text><text x="76.0" y="270.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Excel chấp nhận ngoại lệ, không bắt phê duyệt</text><text x="76.0" y="290.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhiều bước và không báo lỗi khi thiếu dữ liệu.</text><rect x="425.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="457.0" cy="166.0" r="15" fill="var(--a)"/><text x="457.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="441.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Thiếu lý do cá nhân để thay đổi</text><text x="441.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ERP làm việc phức tạp hơn, không có lợi ích rõ</text><text x="441.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ràng và không ai yêu cầu dùng đúng.</text><rect x="790.0" y="134.0" width="350.0" height="181.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="822.0" cy="166.0" r="15" fill="var(--a)"/><text x="822.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="806.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu ERP không đáng tin</text><text x="806.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Người dùng không tin dữ liệu nên lập file</text><text x="806.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Excel riêng.</text><rect x="60.0" y="331.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="364.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thiếu lý do thay đổi và dữ liệu không đáng tin đều dẫn người dùng về cách làm cũ.</text></svg>
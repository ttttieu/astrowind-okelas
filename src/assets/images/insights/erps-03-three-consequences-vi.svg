<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="1200" height="536" role="img" aria-label="Đưa quy trình chưa chuẩn hóa vào ERP dẫn tới ba hướng: cấu hình theo quy trình sai, customization không kiểm soát và cạn ngân sách trước go-live." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="536" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba hệ quả khi đưa quy trình chưa chuẩn vào ERP</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba hướng diễn biến thường gặp khi các câu hỏi về quy trình chưa được trả lời trước.</text><line x1="60.0" y1="452.0" x2="1140.0" y2="452.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="474.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba hướng diễn biến theo phân tích trong bài viết, không phải thống kê.</text><text x="60.0" y="515.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="300.0" y="134.0" width="600.0" height="48.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="164.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Đưa quy trình chưa chuẩn hóa vào ERP</text><line x1="234.0" y1="184.0" x2="234.0" y2="202.0" stroke="var(--gm)" stroke-width="2"/><polygon points="234.0,210.0 229.6,202.0 238.4,202.0" fill="var(--gm)"/><rect x="60.0" y="212.0" width="348.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="80.0" y="243.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Hướng 1</text><text x="80.0" y="273.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cấu hình theo quy trình sai</text><text x="80.0" y="303.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Hệ thống không phản ánh thực tế. Sau</text><text x="80.0" y="323.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">go-live, nhân viên dùng Excel, ghi chú ngoài</text><text x="80.0" y="343.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hệ thống hoặc xin ngoại lệ.</text><line x1="600.0" y1="184.0" x2="600.0" y2="202.0" stroke="var(--gm)" stroke-width="2"/><polygon points="600.0,210.0 595.6,202.0 604.4,202.0" fill="var(--gm)"/><rect x="426.0" y="212.0" width="348.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="446.0" y="243.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Hướng 2</text><text x="446.0" y="273.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Customization không kiểm soát</text><text x="446.0" y="303.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi nhóm có yêu cầu riêng, danh sách thay</text><text x="446.0" y="323.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">đổi dài dần. Mỗi customization có thể vỡ khi</text><text x="446.0" y="343.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nâng cấp, và chỉ vài người hiểu.</text><line x1="966.0" y1="184.0" x2="966.0" y2="202.0" stroke="var(--gm)" stroke-width="2"/><polygon points="966.0,210.0 961.6,202.0 970.4,202.0" fill="var(--gm)"/><rect x="792.0" y="212.0" width="348.0" height="154.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="812.0" y="243.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Hướng 3</text><text x="812.0" y="273.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cạn ngân sách trước go-live</text><text x="812.0" y="303.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Việc làm rõ quy trình diễn ra ngay trong</text><text x="812.0" y="323.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">dự án, với chi phí cao hơn ở mỗi buổi họp và</text><text x="812.0" y="343.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">vòng chỉnh cấu hình.</text><rect x="60.0" y="382.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="415.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chi phí làm rõ quy trình không biến mất; nó chuyển sang giai đoạn đắt hơn.</text></svg>
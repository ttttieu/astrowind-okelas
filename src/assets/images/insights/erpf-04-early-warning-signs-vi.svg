<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Dấu hiệu sớm của dự án ERP gặp vấn đề, chia theo ba giai đoạn: chuẩn bị, triển khai và sau go-live, mỗi giai đoạn bốn dấu hiệu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Dấu hiệu sớm theo ba giai đoạn của dự án</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Dùng như danh sách đối chiếu khi dự án đang chuẩn bị, đang chạy hoặc đã go-live.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Dấu hiệu tổng hợp từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="234.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Giai đoạn chuẩn bị</text><line x1="410.0" y1="156.0" x2="416.0" y2="156.0" stroke="var(--gm)" stroke-width="2"/><polygon points="424.0,156.0 416.0,160.4 416.0,151.6" fill="var(--gm)"/><rect x="60.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="219.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Chưa có tài liệu quy trình hiện tại đủ chi tiết</text><text x="234.0" y="236.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">cho nhà triển khai</text><rect x="60.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Họp yêu cầu kết thúc bằng “để xem lại” hoặc “tùy</text><text x="234.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">trường hợp”</text><rect x="60.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="359.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Không có một người chịu trách nhiệm cuối cùng cho</text><text x="234.0" y="376.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">từng module</text><rect x="60.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Dữ liệu master chưa được làm sạch và chuẩn hóa</text><rect x="426.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="600.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Giai đoạn triển khai</text><line x1="776.0" y1="156.0" x2="782.0" y2="156.0" stroke="var(--gm)" stroke-width="2"/><polygon points="790.0,156.0 782.0,160.4 782.0,151.6" fill="var(--gm)"/><rect x="426.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="219.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Danh sách customization dài ra mà không ai</text><text x="600.0" y="236.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">kiểm soát</text><rect x="426.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Gap analysis thấy nhiều điểm lệch nhưng không có</text><text x="600.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">quyết định xử lý</text><rect x="426.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="359.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Người dùng cuối được đào tạo muộn hoặc không</text><text x="600.0" y="376.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">tham gia kiểm thử</text><rect x="426.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Không có kế hoạch xử lý dữ liệu cũ sau go-live</text><rect x="792.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="966.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sau go-live</text><rect x="792.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="227.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Nhiều quy trình vẫn chạy song song ngoài ERP</text><rect x="792.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Báo cáo ERP không khớp số liệu ban lãnh đạo dùng</text><text x="966.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">để quyết định</text><rect x="792.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="367.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Không có người phụ trách ERP nội bộ rõ ràng</text><rect x="792.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Mỗi vấn đề đều phải quay lại nhà triển khai</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi hữu ích ở mỗi giai đoạn: dấu hiệu nào trong số này đã xuất hiện ở dự án của chúng ta?</text></svg>
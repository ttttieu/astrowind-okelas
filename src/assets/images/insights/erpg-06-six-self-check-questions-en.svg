<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-label="Six self-assessment questions on ERP governance: System Owner, master data owner, contact channel, change request process, handling accounts when people leave and the last data quality review." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="508" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six questions: where does your ERP governance stand?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each question comes from the self-assessment in the article.</text><line x1="60.0" y1="424.0" x2="1140.0" y2="424.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="446.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="487.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="181.0" r="15" fill="var(--p)"/><text x="92.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="165.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is there a designated ERP System</text><text x="120.0" y="186.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Owner with decision authority who</text><text x="120.0" y="207.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">is accountable to leadership?</text><rect x="425.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="181.0" r="15" fill="var(--p)"/><text x="457.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="485.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is a named person responsible for</text><text x="485.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">master data quality?</text><rect x="790.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="181.0" r="15" fill="var(--p)"/><text x="822.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="850.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Do users know who to contact and</text><text x="850.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">how when they hit an ERP problem?</text><rect x="60.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="290.0" r="15" fill="var(--p)"/><text x="92.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is there a defined process for</text><text x="120.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">configuration change requests?</text><rect x="425.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="290.0" r="15" fill="var(--p)"/><text x="457.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="485.0" y="274.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">When an employee leaves, how</text><text x="485.0" y="295.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">and how quickly is their ERP</text><text x="485.0" y="316.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">access revoked?</text><rect x="790.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="290.0" r="15" fill="var(--p)"/><text x="822.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="850.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">When was data quality in the ERP</text><text x="850.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">last reviewed?</text><rect x="60.0" y="353.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="386.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Several “unclear” answers are governance gaps to fill.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="A file library, where each file sits separately in product, quality and supplier folders, compared with a knowledge network linking Product A, Material M, Supplier XYZ, Standard T-001, Procedure KT-003 and the Quality Manager through relationships." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From file library to knowledge network</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The same information, organized by folders or by relationships.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative example from the article (names and codes are hypothetical), not measured data.</text><text x="60.0" y="651.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="368.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">File library</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Each file exists independently</text><text x="84.0" y="238.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Products</text><rect x="84.0" y="248.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="274.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Product-A technical spec</text><rect x="330.0" y="248.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="274.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Product-A manufacturing process</text><text x="84.0" y="328.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Quality</text><rect x="84.0" y="338.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="364.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Incoming inspection procedure</text><rect x="330.0" y="338.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="364.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Raw material acceptance criteria</text><text x="84.0" y="418.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">/Suppliers</text><rect x="84.0" y="428.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="201.0" y="454.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Supplier-XYZ contract</text><rect x="330.0" y="428.0" width="234.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="447.0" y="454.4" font-size="12" font-weight="700" fill="var(--tx)" text-anchor="middle">Supplier-XYZ assessment</text><rect x="612.0" y="134.0" width="528.0" height="368.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Knowledge network</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Entities are recorded and connected</text><rect x="655.0" y="222.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="242.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Product A</text><line x1="760.0" y1="256.0" x2="760.0" y2="271.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,278.0 756.1,271.0 763.9,271.0" fill="var(--s)"/><text x="774.0" y="271.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">uses raw material</text><rect x="655.0" y="280.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="300.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Material M</text><line x1="760.0" y1="314.0" x2="760.0" y2="329.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,336.0 756.1,329.0 763.9,329.0" fill="var(--s)"/><text x="774.0" y="329.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">subject to standard</text><rect x="655.0" y="338.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="358.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Standard T-001</text><line x1="760.0" y1="372.0" x2="760.0" y2="387.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,394.0 756.1,387.0 763.9,387.0" fill="var(--s)"/><text x="774.0" y="387.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">inspected via</text><rect x="655.0" y="396.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="416.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Procedure KT-003</text><line x1="760.0" y1="430.0" x2="760.0" y2="445.0" stroke="var(--s)" stroke-width="1.8"/><polygon points="760.0,452.0 756.1,445.0 763.9,445.0" fill="var(--s)"/><text x="774.0" y="445.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">approved by</text><rect x="655.0" y="454.0" width="210.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="760.0" y="474.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Quality Manager</text><rect x="1000.0" y="280.0" width="130.0" height="32.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><text x="1065.0" y="300.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Supplier XYZ</text><line x1="869.0" y1="296.0" x2="989.0" y2="296.0" stroke="var(--a)" stroke-width="1.8"/><polygon points="996.0,296.0 989.0,299.9 989.0,292.1" fill="var(--a)"/><text x="901.0" y="314.6" font-size="12" font-weight="400" fill="var(--tx)" text-anchor="start">supplied by</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The difference isn’t what information exists, but how it is organized through relationships.</text></svg>
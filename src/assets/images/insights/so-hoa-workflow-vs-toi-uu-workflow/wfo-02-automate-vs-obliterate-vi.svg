<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" role="img" aria-label="Máy tính hóa cách cũ giữ nguyên quy trình và chạy nhanh hơn; thiết kế lại hỏi bước nào cần tuần tự, bước nào gộp hoặc song song, bước nào bỏ được." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="628" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Làm nhanh cách cũ, hay hỏi cách cũ còn cần không?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quan sát của Hammer (HBR, 1990): đầu tư công nghệ thường thất vọng khi chỉ máy tính hóa cách làm cũ.</text><line x1="60.0" y1="566.0" x2="1140.0" y2="566.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="588.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Nguồn: M. Hammer, Reengineering Work: Don’t Automate, Obliterate, Harvard Business Review, 1990. Sơ đồ minh họa khái niệm; ví dụ quy trình 5 bước là giả định.</text><rect x="60.0" y="134.0" width="520.0" height="346.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Automate: máy tính hóa cách cũ</text><rect x="447.0" y="188.0" width="109.0" height="24.0" rx="12.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="501.5" y="204.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><text x="84.0" y="209.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Quy trình giấy</text><rect x="84.0" y="226.0" width="72.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="120.0" y="251.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">1</text><line x1="159.0" y1="246.0" x2="169.0" y2="246.0" stroke="var(--gm)" stroke-width="2"/><polygon points="176.0,246.0 169.0,249.8 169.0,242.2" fill="var(--gm)"/><rect x="179.0" y="226.0" width="72.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="215.0" y="251.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">2</text><line x1="254.0" y1="246.0" x2="264.0" y2="246.0" stroke="var(--gm)" stroke-width="2"/><polygon points="271.0,246.0 264.0,249.8 264.0,242.2" fill="var(--gm)"/><rect x="274.0" y="226.0" width="72.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="310.0" y="251.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">3</text><line x1="349.0" y1="246.0" x2="359.0" y2="246.0" stroke="var(--gm)" stroke-width="2"/><polygon points="366.0,246.0 359.0,249.8 359.0,242.2" fill="var(--gm)"/><rect x="369.0" y="226.0" width="72.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="405.0" y="251.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">4</text><line x1="444.0" y1="246.0" x2="454.0" y2="246.0" stroke="var(--gm)" stroke-width="2"/><polygon points="461.0,246.0 454.0,249.8 454.0,242.2" fill="var(--gm)"/><rect x="464.0" y="226.0" width="72.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="500.0" y="251.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">5</text><rect x="84.0" y="348.0" width="72.0" height="40.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="120.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">1</text><line x1="159.0" y1="368.0" x2="169.0" y2="368.0" stroke="var(--p)" stroke-width="2"/><polygon points="176.0,368.0 169.0,371.9 169.0,364.1" fill="var(--p)"/><rect x="179.0" y="348.0" width="72.0" height="40.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="215.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">2</text><line x1="254.0" y1="368.0" x2="264.0" y2="368.0" stroke="var(--p)" stroke-width="2"/><polygon points="271.0,368.0 264.0,371.9 264.0,364.1" fill="var(--p)"/><rect x="274.0" y="348.0" width="72.0" height="40.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="310.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">3</text><line x1="349.0" y1="368.0" x2="359.0" y2="368.0" stroke="var(--p)" stroke-width="2"/><polygon points="366.0,368.0 359.0,371.9 359.0,364.1" fill="var(--p)"/><rect x="369.0" y="348.0" width="72.0" height="40.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="405.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">4</text><line x1="444.0" y1="368.0" x2="454.0" y2="368.0" stroke="var(--p)" stroke-width="2"/><polygon points="461.0,368.0 454.0,371.9 454.0,364.1" fill="var(--p)"/><rect x="464.0" y="348.0" width="72.0" height="40.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="500.0" y="373.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">5</text><line x1="320.0" y1="272.0" x2="320.0" y2="330.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="320.0,340.0 314.5,330.0 325.5,330.0" fill="var(--a)"/><text x="334.0" y="307.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">số hóa</text><text x="84.0" y="337.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="start">Quy trình số hóa</text><text x="84.0" y="421.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Vẫn 5 bước tuần tự, chỉ chạy trên phần mềm.</text><rect x="620.0" y="134.0" width="520.0" height="346.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="644.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Obliterate: hỏi lại cách cũ</text><rect x="644.0" y="198.0" width="472.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="672.0" cy="228.0" r="14" fill="var(--p)"/><text x="672.0" y="233.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="694.0" y="233.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Bước nào thực sự cần tuần tự?</text><rect x="644.0" y="270.0" width="472.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="672.0" cy="300.0" r="14" fill="var(--p)"/><text x="672.0" y="305.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="694.0" y="305.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Bước nào gộp lại hoặc chạy song song được?</text><rect x="644.0" y="342.0" width="472.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="672.0" cy="372.0" r="14" fill="var(--p)"/><text x="672.0" y="377.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="694.0" y="377.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Bước nào có thể bỏ hẳn?</text><text x="644.0" y="435.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Không làm nhanh cách cũ, mà hỏi liệu cách cũ có còn cần</text><text x="644.0" y="456.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tồn tại.</text><rect x="60.0" y="496.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="529.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi không phải “làm cách cũ nhanh thế nào”, mà là “cách cũ có còn cần thiết không”.</text></svg>
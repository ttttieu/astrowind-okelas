<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Bốn thứ số hóa không tự thay đổi: số bước và thứ tự, quyền quyết định, cách xử lý ngoại lệ và ngữ cảnh đi kèm mỗi bước." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn thứ số hóa không tự thay đổi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quy trình gốc có vấn đề thì số hóa không loại bỏ chúng.</text><line x1="60.0" y1="622.0" x2="1140.0" y2="622.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="644.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; ví dụ quy trình 5 bước là giả định, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="96.0" cy="166.0" r="16" fill="var(--a)"/><text x="96.0" y="171.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text><text x="124.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Số bước và thứ tự</text><rect x="82.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="185.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước: 5 bước tuần tự</text><text x="305.0" y="223.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="322.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="425.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sau: 5 bước tuần tự</text><text x="82.0" y="266.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quy trình giấy 5 bước tuần tự thường thành quy trình số 5</text><text x="82.0" y="287.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bước tuần tự.</text><rect x="610.0" y="132.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="646.0" cy="166.0" r="16" fill="var(--a)"/><text x="646.0" y="171.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text><text x="674.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ai có quyền quyết định</text><rect x="632.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="735.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước: Phân quyền cũ</text><text x="855.0" y="223.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="872.0" y="198.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="975.0" y="220.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sau: Phân quyền cũ</text><text x="632.0" y="266.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Cơ cấu phân quyền cũ, kể cả khi không còn phù hợp, thường được</text><text x="632.0" y="287.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chuyển nguyên sang hệ thống số.</text><rect x="60.0" y="338.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="96.0" cy="372.0" r="16" fill="var(--a)"/><text x="96.0" y="377.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text><text x="124.0" y="379.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Cách xử lý ngoại lệ</text><rect x="82.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="185.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước: Kênh phi chính thức</text><text x="305.0" y="429.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="322.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="425.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sau: Kênh phi chính thức</text><text x="82.0" y="472.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ngoại lệ vẫn được xử lý ngoài hệ thống, qua tin nhắn hoặc</text><text x="82.0" y="493.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">cuộc gọi, không có đường đi định sẵn.</text><rect x="610.0" y="338.0" width="530.0" height="188.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="646.0" cy="372.0" r="16" fill="var(--a)"/><text x="646.0" y="377.8" font-size="16" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text><text x="674.0" y="379.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Ngữ cảnh đi kèm mỗi bước</text><rect x="632.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="735.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Trước: Chỉ các trường dữ liệu</text><text x="855.0" y="429.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">=</text><rect x="872.0" y="404.0" width="206.0" height="36.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="975.0" y="426.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Sau: Chỉ các trường dữ liệu</text><text x="632.0" y="472.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Form điện tử, như form giấy, chỉ chứa các trường cần điền, không</text><text x="632.0" y="493.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tự mang theo lý do hay lịch sử.</text><rect x="60.0" y="550.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="583.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Số hóa giữ nguyên và tăng tốc chính những vấn đề của quy trình gốc.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 646" width="1200" height="646" role="img" aria-label="Số hóa chỉ đổi phương tiện từ giấy hoặc email sang phần mềm; logic vận hành gồm số bước, quyền quyết định, xử lý ngoại lệ và ngữ cảnh không tự đổi." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="646" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Số hóa đổi phương tiện, không đổi logic vận hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Số hóa giải quyết đúng một lớp vấn đề: cách thông tin được lưu trữ và luân chuyển.</text><line x1="60.0" y1="584.0" x2="1140.0" y2="584.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="606.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân biệt phương tiện và logic dựa trên định nghĩa digitization của Gartner Glossary, được OKELAS diễn giải lại. Sơ đồ minh họa khái niệm.</text><rect x="60.0" y="134.0" width="620.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Phương tiện</text><rect x="572.0" y="152.0" width="84.0" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--s)" stroke-width="1.2"/><text x="614.0" y="169.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="middle">Thay đổi</text><rect x="84.0" y="200.0" width="200.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="184.0" y="225.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Giấy hoặc email</text><line x1="290.0" y1="220.0" x2="356.0" y2="220.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="366.0,220.0 356.0,225.5 356.0,214.5" fill="var(--p)"/><rect x="372.0" y="200.0" width="200.0" height="40.0" rx="8" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="472.0" y="225.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phần mềm</text><text x="84.0" y="265.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Form điện tử và chữ ký số thay cho bản giấy.</text><rect x="60.0" y="298.0" width="620.0" height="206.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="84.0" y="339.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Logic vận hành</text><rect x="545.1" y="316.0" width="110.9" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="600.5" y="333.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Không tự đổi</text><rect x="84.0" y="368.0" width="264.0" height="46.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="216.0" y="396.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Số bước và thứ tự</text><rect x="364.0" y="368.0" width="264.0" height="46.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="496.0" y="396.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Quyền quyết định</text><rect x="84.0" y="428.0" width="264.0" height="46.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="216.0" y="456.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Cách xử lý ngoại lệ</text><rect x="364.0" y="428.0" width="264.0" height="46.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="496.0" y="456.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ngữ cảnh mỗi bước</text><rect x="710.0" y="134.0" width="430.0" height="370.0" rx="16" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><text x="734.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Số hóa mang lại giá trị thật</text><circle cx="742.0" cy="222.0" r="5" fill="var(--p)"/><text x="758.0" y="227.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Không còn thất lạc tài liệu</text><line x1="734.0" y1="258.0" x2="1116.0" y2="258.0" stroke="var(--line)" stroke-width="1"/><circle cx="742.0" cy="294.0" r="5" fill="var(--p)"/><text x="758.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Tra cứu lại được lịch sử phê duyệt</text><line x1="734.0" y1="330.0" x2="1116.0" y2="330.0" stroke="var(--line)" stroke-width="1"/><circle cx="742.0" cy="366.0" r="5" fill="var(--p)"/><text x="758.0" y="371.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Bớt thời gian chuyển giấy tờ</text><line x1="734.0" y1="402.0" x2="1116.0" y2="402.0" stroke="var(--line)" stroke-width="1"/><circle cx="742.0" cy="438.0" r="5" fill="var(--p)"/><text x="758.0" y="443.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Có dữ liệu thô để phân tích sau</text><rect x="60.0" y="522.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="555.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Số hóa chỉ giải quyết một lớp vấn đề, và nhiều doanh nghiệp dừng lại vì nhầm tưởng đã xong.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 692" width="1200" height="692" role="img" aria-label="Bốn câu hỏi kèm câu trả lời cho thấy workflow mới dừng ở số hóa; từ hai câu trở lên thì nhiều khả năng chưa tối ưu." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="692" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn câu hỏi cho biết workflow mới dừng ở số hóa</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Trả lời “có vấn đề” từ hai câu trở lên thì nhiều khả năng workflow mới dừng ở số hóa.</text><line x1="60.0" y1="630.0" x2="1140.0" y2="630.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="652.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Cách phân loại và ngưỡng trong hình là gợi ý của OKELAS, công cụ thảo luận định hướng, không phải phương pháp luận được chứng nhận.</text><text x="96.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Câu hỏi</text><text x="610.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Nếu câu trả lời là</text><text x="884.0" y="141.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Cho thấy</text><rect x="60.0" y="152.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="196.0" r="15" fill="var(--p)"/><text x="88.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="191.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Nếu bỏ qua công nghệ, quy trình nghiệp vụ có đổi gì so với 5</text><text x="116.0" y="211.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">năm trước?</text><rect x="606.0" y="162.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="201.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Không, chỉ công cụ thay đổi</text><line x1="846.0" y1="196.0" x2="867.0" y2="196.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,196.0 867.0,200.9 867.0,191.1" fill="var(--p)"/><text x="884.0" y="201.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Số hóa thuần túy</text><rect x="60.0" y="252.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="296.0" r="15" fill="var(--p)"/><text x="88.0" y="301.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="116.0" y="291.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người ở bước cuối có tự giải thích được vì sao các bước trước</text><text x="116.0" y="311.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định như vậy, không cần hỏi lại?</text><rect x="606.0" y="262.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="301.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Không</text><line x1="846.0" y1="296.0" x2="867.0" y2="296.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,296.0 867.0,300.9 867.0,291.1" fill="var(--p)"/><text x="884.0" y="301.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Workflow thiếu ngữ cảnh</text><rect x="60.0" y="352.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="396.0" r="15" fill="var(--p)"/><text x="88.0" y="401.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="391.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ngoại lệ tháng vừa rồi được xử lý qua hệ thống hay qua</text><text x="116.0" y="411.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">kênh phi chính thức?</text><rect x="606.0" y="362.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="401.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Kênh phi chính thức</text><line x1="846.0" y1="396.0" x2="867.0" y2="396.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,396.0 867.0,400.9 867.0,391.1" fill="var(--p)"/><text x="884.0" y="391.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Khoảng trống thiết kế, không phải</text><text x="884.0" y="410.3" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">lỗi tuân thủ của nhân viên</text><rect x="60.0" y="452.0" width="1080.0" height="88.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="88.0" cy="496.0" r="15" fill="var(--p)"/><text x="88.0" y="501.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="116.0" y="491.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Thời gian hoàn thành trung bình có giảm rõ rệt sau khi số</text><text x="116.0" y="511.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hóa không?</text><rect x="606.0" y="462.0" width="236.0" height="68.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="724.0" y="491.9" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">Chỉ giảm nhẹ vì bớt</text><text x="724.0" y="510.3" font-size="14" font-weight="700" fill="var(--a)" text-anchor="middle">chuyển giấy</text><line x1="846.0" y1="496.0" x2="867.0" y2="496.0" stroke="var(--p)" stroke-width="2.5"/><polygon points="876.0,496.0 867.0,500.9 867.0,491.1" fill="var(--p)"/><text x="884.0" y="491.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Phần lớn thời gian nằm ở logic</text><text x="884.0" y="510.3" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">quy trình, không ở phương tiện</text><rect x="60.0" y="558.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="591.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Từ hai câu trở lên: nhiều khả năng workflow đang ở giai đoạn số hóa, chưa tới giai đoạn tối ưu.</text></svg>
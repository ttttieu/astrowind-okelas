<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Implementation is complete once the system works technically, while adoption begins when the system changes how the business runs and decides; the gap between the two is usually larger than post-go-live announcements imply." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Go-live ends implementation, not adoption</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The distance between the two is usually larger than post-go-live announcements imply.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="400.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="2.2"/><text x="84.0" y="195.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Implementation</text><text x="84.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Complete once the system works technically</text><text x="84.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">and the partner hands over</text><rect x="740.0" y="150.0" width="400.0" height="150.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="2.2" stroke-dasharray="6 5"/><text x="764.0" y="195.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Adoption</text><text x="764.0" y="232.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Begins when the system changes how the</text><text x="764.0" y="253.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">business runs and decides</text><rect x="456.0" y="130.0" width="71.3" height="26.0" rx="13.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="491.6" y="147.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Go-live</text><line x1="476.0" y1="231.0" x2="724.0" y2="231.0" stroke="var(--a)" stroke-width="3" stroke-dasharray="8 6"/><polygon points="736.0,231.0 716.0,222.0 716.0,240.0" fill="var(--a)"/><rect x="554.0" y="191.0" width="76.8" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="592.4" y="208.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">The gap</text><rect x="60.0" y="324.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="357.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Go-live is where implementation ends, not where adoption begins.</text></svg>
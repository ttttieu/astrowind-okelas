<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Chi phí hiển thị gồm tuyển dụng, lương chuyển giao và đào tạo là phần nhỏ nhất; chi phí ẩn gồm năng suất giảm, sai sót, mất cải tiến tiềm năng và thời gian quản lý." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí hiển thị chỉ là phần nhỏ của chi phí thực</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Khi nhân sự quan trọng nghỉ việc, phần dễ thấy nhất thường là phần nhỏ nhất.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="420.0" height="236.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí hiển thị</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Dễ thấy, dễ tính</text><rect x="84.0" y="218.0" width="372.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="270.0" y="244.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Tuyển dụng</text><rect x="84.0" y="268.0" width="372.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="270.0" y="294.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Lương trong giai đoạn chuyển giao</text><rect x="84.0" y="318.0" width="372.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="270.0" y="344.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Đào tạo người mới</text><rect x="500.0" y="134.0" width="640.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="524.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí ẩn</text><text x="524.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khó tính hơn, nhưng có thật</text><rect x="524.0" y="218.0" width="592.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Năng suất giảm trong thời gian chuyển giao</text><rect x="524.0" y="276.0" width="592.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820.0" y="305.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Sai sót và sự cố trong giai đoạn học việc</text><rect x="524.0" y="334.0" width="592.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820.0" y="363.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Mất đi cải tiến tiềm năng</text><rect x="524.0" y="392.0" width="592.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820.0" y="421.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thời gian quản lý để xử lý hậu quả</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chi phí tuyển dụng thường là phần nhỏ nhất của tổng chi phí thực sự.</text></svg>
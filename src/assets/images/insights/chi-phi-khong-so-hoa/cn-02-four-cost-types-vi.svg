<rect class="need" x="60" y="624" width="1080" height="44" rx="12"/>
<text class="term" x="600" y="652" text-anchor="middle">Mỗi loại nằm trong một dòng ngân sách khác nhau, hoặc không nằm trong dòng nào</text>
<text class="foot" x="60" y="696" text-anchor="start">okelas.com</text>
</svg>
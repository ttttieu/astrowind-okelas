<text class="desc" x="638" y="582" text-anchor="start">trong tổ chức</text>
<g class="g3"><rect class="box" x="885" y="196" width="255" height="410" rx="14"/><rect class="bar" x="885" y="196" width="255" height="6" rx="3"/></g>
<circle class="purp" cx="919" cy="240" r="15"/>

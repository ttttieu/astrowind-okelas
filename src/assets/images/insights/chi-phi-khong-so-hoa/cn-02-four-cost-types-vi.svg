<text class="desc" x="363" y="565" text-anchor="start">từ vài phút sửa lỗi đến sản</text>
<text class="desc" x="363" y="582" text-anchor="start">phẩm không đạt</text>
<g class="g3"><rect class="box" x="610" y="196" width="255" height="410" rx="14"/><rect class="bar" x="610" y="196" width="255" height="6" rx="3"/></g>
<circle class="purp" cx="644" cy="240" r="15"/>

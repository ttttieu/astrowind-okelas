<rect class="soft" x="899" y="524" width="227" height="68" rx="10"/>
<text class="desc" x="913" y="548" text-anchor="start">Khó đo nhất; thay đổi rất</text>
<text class="desc" x="913" y="565" text-anchor="start">nhiều giữa các ngành và</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-label="Four bottlenecks that limit organizational capacity: concentrated approvals, information processing capacity, undefined processes and missing organizational context." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="586" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four bottlenecks that limit organizational capacity</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">For small and mid-sized businesses, writing speed is usually not the bottleneck.</text><line x1="60.0" y1="502.0" x2="1140.0" y2="502.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="524.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four bottlenecks from the article’s analysis, not statistics.</text><text x="60.0" y="565.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="135.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="172.0" r="15" fill="var(--a)"/><text x="94.0" y="177.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="173.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Concentrated approvals</text><text x="122.0" y="202.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Decisions run through one or two people, so the queue does not</text><text x="122.0" y="222.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">shrink even if documents are prepared faster.</text><rect x="606.0" y="134.0" width="534.0" height="135.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="172.0" r="15" fill="var(--a)"/><text x="640.0" y="177.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="668.0" y="173.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Information processing capacity</text><text x="668.0" y="202.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI produces more text, but the people who read and decide stay</text><text x="668.0" y="222.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the same. More volume without more capacity means overload.</text><rect x="60.0" y="281.0" width="534.0" height="135.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="94.0" cy="319.0" r="15" fill="var(--a)"/><text x="94.0" y="324.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="122.0" y="320.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Undefined processes</text><text x="122.0" y="349.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">When a process is unclear, AI just produces unclear</text><text x="122.0" y="369.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">documents faster.</text><rect x="606.0" y="281.0" width="534.0" height="135.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="640.0" cy="319.0" r="15" fill="var(--a)"/><text x="640.0" y="324.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="668.0" y="320.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Missing organizational context</text><text x="668.0" y="349.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">AI can format an inspection report well but may not know the</text><text x="668.0" y="369.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">batch’s criteria, who signs off, or the next step. Someone still fills</text><text x="668.0" y="389.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">the gaps by hand.</text><rect x="60.0" y="432.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="465.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A system’s speed is set by its slowest point, not its fastest.</text></svg>
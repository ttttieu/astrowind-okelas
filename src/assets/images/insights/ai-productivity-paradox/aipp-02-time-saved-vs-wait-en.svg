<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="A hypothetical timeline bar for one proposal: drafting drops from 2 hours to 20 minutes, saving 100 minutes, but the 3-day approval wait fills almost the whole bar and does not change." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="556" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Time saved at drafting, delay at approval</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Illustrative, hypothetical figures, not statistics.</text><line x1="60.0" y1="472.0" x2="1140.0" y2="472.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="494.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hypothetical figures following the article’s example, not statistics. Bars are drawn to scale for the hypothetical times.</text><text x="60.0" y="535.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="225.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Before AI</text><line x1="290.8" y1="180.0" x2="290.8" y2="196.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="173.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Drafting: 2 hours</text><rect x="280.0" y="196.0" width="21.6" height="48.0" rx="3" fill="var(--p)"/><rect x="301.6" y="196.0" width="778.4" height="48.0" rx="3" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="690.8" y="225.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Waiting for approval: 3 days (hypothetical)</text><text x="60.0" y="325.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">After AI</text><line x1="281.8" y1="280.0" x2="281.8" y2="296.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="273.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Drafting: 20 minutes</text><rect x="280.0" y="296.0" width="3.6" height="48.0" rx="2" fill="var(--p)"/><rect x="283.6" y="296.0" width="18.0" height="48.0" rx="3" fill="none" stroke="var(--p)" stroke-width="1.6" stroke-dasharray="4 3"/><rect x="301.6" y="296.0" width="778.4" height="48.0" rx="3" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="690.8" y="325.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Waiting for approval: 3 days (hypothetical)</text><line x1="292.6" y1="344.0" x2="292.6" y2="358.0" stroke="var(--gm)" stroke-width="1.5"/><text x="280.0" y="375.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">100 minutes saved</text><rect x="60.0" y="402.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="435.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">100 minutes saved at drafting, but the approval wait is unchanged.</text></svg>
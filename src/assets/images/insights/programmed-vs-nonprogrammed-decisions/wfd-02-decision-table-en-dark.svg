<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-label="A table of four decision types and three mechanisms: workflow rule, AI supports input and human decides; AI appears only in the supports-input column, decision authority stays with people." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="670" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Who handles which part of a decision</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">AI does not appear in the "decides" column: authority stays with people.</text><line x1="60.0" y1="608.0" x2="1140.0" y2="608.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="630.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="330.0" height="38.0" rx="10" fill="#14161A"/><text x="225.0" y="158.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Decision characteristics</text><rect x="400.0" y="134.0" width="230.0" height="38.0" rx="10" fill="#2B74F5"/><text x="515.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Workflow rule</text><rect x="640.0" y="134.0" width="250.0" height="38.0" rx="10" fill="#A78BFA"/><text x="765.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI supports input</text><rect x="900.0" y="134.0" width="240.0" height="38.0" rx="10" fill="#F7F8F8"/><text x="1020.0" y="158.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Human decides</text><rect x="60.0" y="182.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="217.6" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Repetitive, clear criteria,</text><text x="76.0" y="237.4" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">structured data</text><rect x="400.0" y="182.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="227.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Yes</text><rect x="640.0" y="182.0" width="250.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="765.0" y="227.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Not needed</text><rect x="900.0" y="182.0" width="240.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="1020.0" y="227.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Not needed</text><rect x="60.0" y="272.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="317.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Repetitive, but unstructured input</text><rect x="400.0" y="272.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Yes, after AI interprets</text><rect x="640.0" y="272.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Interprets input</text><rect x="900.0" y="272.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="317.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Confirms if high risk</text><rect x="60.0" y="362.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="407.5" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">Infrequent, criteria not yet stable</text><rect x="400.0" y="362.0" width="230.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2" stroke-dasharray="5 4"/><text x="515.0" y="407.1" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="middle">Not yet: needs precedent</text><rect x="640.0" y="362.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="407.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Assembles evidence</text><rect x="900.0" y="362.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="407.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Judgment call</text><rect x="60.0" y="452.0" width="330.0" height="80.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="76.0" y="487.6" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">High consequence of error, regardless</text><text x="76.0" y="507.4" font-size="15" font-weight="700" fill="#F7F8F8" text-anchor="start">of frequency</text><rect x="400.0" y="452.0" width="230.0" height="80.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="515.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Default path only</text><rect x="640.0" y="452.0" width="250.0" height="80.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="765.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Prepares evidence file</text><rect x="900.0" y="452.0" width="240.0" height="80.0" rx="12" fill="#08090A" stroke="#F7F8F8" stroke-width="1.8"/><text x="1020.0" y="497.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Required confirmation</text><rect x="60.0" y="548.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="581.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI interprets input and prepares evidence so people can decide faster and with better grounding.</text></svg>
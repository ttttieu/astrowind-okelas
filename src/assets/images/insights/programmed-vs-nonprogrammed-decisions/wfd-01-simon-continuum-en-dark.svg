<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Herbert Simon’s continuum: programmed decisions at one end, nonprogrammed at the other, most real decisions in between; the position is not fixed and shifts toward programmable as precedent builds; four criteria help place a decision." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="640" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Where a decision sits on the continuum</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Two ends of a continuum, not two separate categories.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="714.1" y="124.0" width="425.9" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="927.0" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Herbert Simon, "The New Science of Management Decision" (1960)</text><rect x="330.0" y="168.0" width="471.5" height="24.0" rx="12.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="565.8" y="184.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">The position is not fixed: it shifts toward programmable as precedent builds</text><line x1="1100.0" y1="206.0" x2="140.0" y2="206.0" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="160.0" y1="206.0" x2="130.0" y2="206.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="120.0,206.0 130.0,200.5 130.0,211.5" fill="#A78BFA"/><rect x="60.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.8"/><text x="80.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Programmed decisions</text><text x="80.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">Can be written as rules</text><rect x="420.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#14161A" stroke="#5B6575" stroke-width="1.8"/><text x="440.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Most real decisions</text><text x="440.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">sit between the two ends</text><rect x="780.0" y="224.0" width="360.0" height="74.0" rx="14" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="800.0" y="257.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Nonprogrammed decisions</text><text x="800.0" y="282.8" font-size="14" font-weight="400" fill="#9AA6B8" text-anchor="start">Need judgment</text><rect x="60.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="80.0" y="344.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Repetitive, clearly structured, handled</text><text x="80.0" y="365.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">through established procedures or systems.</text><rect x="80.0" y="408.0" width="320.0" height="40.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="240.0" y="432.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Candidate for a workflow rule</text><rect x="420.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="440.0" y="338.8" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Four criteria for placing a decision</text><rect x="440.0" y="356.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="517.0" y="380.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Frequency</text><rect x="608.0" y="356.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="685.0" y="380.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Stability of criteria</text><rect x="440.0" y="404.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="517.0" y="428.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Variations can be listed</text><rect x="608.0" y="404.0" width="154.0" height="40.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="685.0" y="428.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Consequence of error</text><rect x="780.0" y="312.0" width="360.0" height="150.0" rx="14" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="800.0" y="344.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Novel, complex, weighing several factors</text><text x="800.0" y="365.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">at once, variations cannot be fully listed</text><text x="800.0" y="386.7" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">in advance.</text><rect x="800.0" y="408.0" width="320.0" height="40.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5"/><text x="960.0" y="432.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Belongs to people; the system prepares inputs</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">The question is not "should we use AI", but where this decision sits on the continuum.</text></svg>
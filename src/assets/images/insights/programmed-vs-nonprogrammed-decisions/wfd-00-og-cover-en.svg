<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A continuum from programmed to nonprogrammed decisions, with most real decisions in between and the position shifting toward rules as precedent accumulates." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><rect x="0.0" y="0.0" width="1200.0" height="630.0" rx="0" fill="var(--bg)"/><rect x="0.0" y="0.0" width="14.0" height="630.0" rx="0" fill="var(--p)"/><text x="60.0" y="60.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">OKELAS · Insights · Workflow</text><text x="60.0" y="123.6" font-size="40" font-weight="700" fill="var(--hd)" text-anchor="start">Programmed vs. Nonprogrammed Decisions</text><text x="60.0" y="309.0" font-size="18" font-weight="700" fill="var(--mut)" text-anchor="start">The decision continuum</text><rect x="330.0" y="368.0" width="388.5" height="28.0" rx="14.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="524.2" y="386.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Accumulating precedent shifts the position toward rules</text><line x1="1100.0" y1="418.0" x2="140.0" y2="418.0" stroke="var(--a)" stroke-width="3" stroke-dasharray="8 6"/><line x1="160.0" y1="418.0" x2="129.0" y2="418.0" stroke="var(--a)" stroke-width="3"/><polygon points="118.0,418.0 129.0,411.9 129.0,424.1" fill="var(--a)"/><rect x="60.0" y="450.0" width="360.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="240.0" y="501.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Rule</text><rect x="420.0" y="450.0" width="360.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Most real decisions</text><rect x="780.0" y="450.0" width="360.0" height="90.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="960.0" y="501.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Human judgment</text></svg>
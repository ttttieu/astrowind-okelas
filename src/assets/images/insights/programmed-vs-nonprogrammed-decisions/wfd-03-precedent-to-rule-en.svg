<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 648" width="1200" height="648" role="img" aria-label="Four steps from judgment to rule: record exceptions, identify the pattern, a person reviews and approves, the new rule enters the workflow; plus rule lifecycle with a rule owner, change process, audit trail and review signals." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="648" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From judgment to rule: as precedent builds</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The scope of judgment narrows through confirmed precedent, not through delegating more authority to AI.</text><line x1="60.0" y1="586.0" x2="1140.0" y2="586.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="608.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Record exceptions</text><text x="76.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Each case outside current rules:</text><text x="76.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">the system records the situation</text><text x="76.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">and decision as evidence.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="var(--p)"/><rect x="335.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Identify the pattern</text><text x="351.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">The same situation recurs</text><text x="351.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">enough times with consistent</text><text x="351.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">handling: suggest "this could</text><text x="351.0" y="327.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">become a rule".</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="var(--p)"/><rect x="610.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="var(--a)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><rect x="766.6" y="154.0" width="82.4" height="22.0" rx="11.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="807.8" y="169.0" font-size="11" font-weight="700" fill="var(--a)" text-anchor="middle">Human gate</text><text x="626.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">A person reviews</text><text x="626.0" y="239.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">and approves</text><text x="626.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">A proposal never becomes a rule</text><text x="626.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">by itself: the authorized owner</text><text x="626.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">reviews, adjusts and issues it with</text><text x="626.0" y="327.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">clear conditions.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="var(--p)"/><rect x="885.0" y="134.0" width="255.0" height="210.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="215.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The new rule enters</text><text x="901.0" y="239.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">the workflow</text><text x="901.0" y="272.0" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">Future cases of that type</text><text x="901.0" y="290.4" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">are handled by the rule,</text><text x="901.0" y="308.9" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="start">without escalation.</text><rect x="60.0" y="360.0" width="1080.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="84.0" y="390.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Rule lifecycle</text><rect x="84.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="245.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Rule owner reviews periodically</text><rect x="424.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="585.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Changes go through a formal process</text><rect x="764.0" y="406.0" width="322.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="925.0" y="430.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Audit trail on every application</text><text x="84.0" y="476.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Signals a rule needs review</text><rect x="330.0" y="456.0" width="280.0" height="36.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="470.0" y="478.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Unusual spike in exceptions</text><rect x="630.0" y="456.0" width="280.0" height="36.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="770.0" y="478.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Complaints rise after the rule runs</text><rect x="60.0" y="526.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="559.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A mature organization knows which decisions are ready to be rules and which need people.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Herbert Simon’s continuum: programmed decisions at one end, nonprogrammed at the other, most real decisions in between; the position is not fixed and shifts toward programmable as precedent builds; four criteria help place a decision." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Where a decision sits on the continuum</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Two ends of a continuum, not two separate categories.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="714.1" y="124.0" width="425.9" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="927.0" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Herbert Simon, "The New Science of Management Decision" (1960)</text><rect x="330.0" y="168.0" width="471.5" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="565.8" y="184.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">The position is not fixed: it shifts toward programmable as precedent builds</text><line x1="1100.0" y1="206.0" x2="140.0" y2="206.0" stroke="var(--a)" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="160.0" y1="206.0" x2="130.0" y2="206.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="120.0,206.0 130.0,200.5 130.0,211.5" fill="var(--a)"/><rect x="60.0" y="224.0" width="360.0" height="74.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="257.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Programmed decisions</text><text x="80.0" y="282.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Can be written as rules</text><rect x="420.0" y="224.0" width="360.0" height="74.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="440.0" y="257.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Most real decisions</text><text x="440.0" y="282.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">sit between the two ends</text><rect x="780.0" y="224.0" width="360.0" height="74.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="800.0" y="257.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Nonprogrammed decisions</text><text x="800.0" y="282.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Need judgment</text><rect x="60.0" y="312.0" width="360.0" height="150.0" rx="14" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="80.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Repetitive, clearly structured, handled</text><text x="80.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">through established procedures or systems.</text><rect x="80.0" y="408.0" width="320.0" height="40.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="240.0" y="432.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Candidate for a workflow rule</text><rect x="420.0" y="312.0" width="360.0" height="150.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="440.0" y="338.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Four criteria for placing a decision</text><rect x="440.0" y="356.0" width="154.0" height="40.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="517.0" y="380.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Frequency</text><rect x="608.0" y="356.0" width="154.0" height="40.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="685.0" y="380.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Stability of criteria</text><rect x="440.0" y="404.0" width="154.0" height="40.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="517.0" y="428.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Variations can be listed</text><rect x="608.0" y="404.0" width="154.0" height="40.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="685.0" y="428.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Consequence of error</text><rect x="780.0" y="312.0" width="360.0" height="150.0" rx="14" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="800.0" y="344.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Novel, complex, weighing several factors</text><text x="800.0" y="365.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">at once, variations cannot be fully listed</text><text x="800.0" y="386.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">in advance.</text><rect x="800.0" y="408.0" width="320.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="960.0" y="432.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Belongs to people; the system prepares inputs</text><rect x="60.0" y="478.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="511.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The question is not "should we use AI", but where this decision sits on the continuum.</text></svg>
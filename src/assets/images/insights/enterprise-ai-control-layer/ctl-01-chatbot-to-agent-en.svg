<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Two chains: a chatbot proposes and a person decides and acts; an agent chooses the next step, acts within scope and repeats." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">From chatbot to agent: who chooses the next step</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A chatbot proposes and a person acts; an agent chooses its next step and acts within its granted scope.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Concepts from the article; not an official classification from any standard.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="192.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chatbot</text><rect x="60.0" y="200.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="175.0" y="247.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Proposes</text><line x1="294.0" y1="242.0" x2="318.0" y2="242.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,242.0 318.0,246.4 318.0,237.6" fill="var(--p)"/><rect x="330.0" y="200.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="445.0" y="247.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Person decides</text><line x1="564.0" y1="242.0" x2="588.0" y2="242.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,242.0 588.0,246.4 588.0,237.6" fill="var(--p)"/><rect x="600.0" y="200.0" width="230.0" height="84.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="715.0" y="247.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Person acts</text><text x="60.0" y="344.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Agent</text><rect x="60.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="175.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Chooses the next step</text><line x1="294.0" y1="394.0" x2="318.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="326.0,394.0 318.0,398.4 318.0,389.6" fill="var(--p)"/><rect x="330.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="445.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Acts within scope</text><line x1="564.0" y1="394.0" x2="588.0" y2="394.0" stroke="var(--p)" stroke-width="2"/><polygon points="596.0,394.0 588.0,398.4 588.0,389.6" fill="var(--p)"/><rect x="600.0" y="352.0" width="230.0" height="84.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="715.0" y="399.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Observes and repeats</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The difference is who controls the processing path, not how intelligent the system is.</text></svg>
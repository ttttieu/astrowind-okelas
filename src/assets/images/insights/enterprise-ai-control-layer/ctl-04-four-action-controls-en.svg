<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Four steps in sequence: distinct identity, least privilege, independent confirmation, runtime logging, each with a description." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four action controls before an agent touches real systems</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">These four controls govern what AI may do; each is needed before an agent is deployed.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four requirements from the article, drawing on Cloud Security Alliance and NIST AI RMF; check details against the framework you use.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="180.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Distinct identity</text><text x="64.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Each agent has its own identity,</text><text x="64.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">not shared; treated as a</text><text x="64.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">non-human identity.</text><rect x="340.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="460.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Least privilege</text><text x="344.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Access scoped to the task, not</text><text x="344.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">granted broadly “just in case”.</text><rect x="620.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="740.0" y="225.0" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Independent</text><text x="740.0" y="247.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">confirmation</text><text x="624.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A checkpoint separate from the</text><text x="624.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">agent, before</text><text x="624.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">high-consequence or</text><text x="624.0" y="380.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">irreversible actions.</text><rect x="900.0" y="180.0" width="240.0" height="100.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1020.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Runtime logging</text><text x="904.0" y="316.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Every action logged with its</text><text x="904.0" y="337.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">reasoning and the data</text><text x="904.0" y="358.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">behind it.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">These four govern what AI may do; the question of which knowledge AI reasons from is a separate layer.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Two horizontal bars: broad access across the full width above; least privilege, much shorter, below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Grant only the access the task needs</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Broad access granted for convenience runs against the principle of least privilege.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Illustration of the concept from the article; not measured data.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="164.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Broad access, granted for convenience</text><rect x="60.0" y="176.0" width="1080.0" height="56.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="84.0" y="210.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Wide access, not tied to a specific task</text><text x="60.0" y="294.6" font-size="18" font-weight="700" fill="var(--p)" text-anchor="start">Least privilege</text><rect x="60.0" y="306.0" width="300.0" height="56.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="340.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Only what the task needs</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">An agent’s authority should be enough for one specific task, and no more.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Three numbered cards: broad access, many steps in sequence, and data and actions blurring together." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three traits make least privilege more urgent for agents</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three traits from the article that make an agent’s risk larger than ordinary software.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three traits from the article; the OWASP ranking shift LLM06→LLM03 is cited there and not shown here.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="166.0" r="15" fill="var(--gm)"/><text x="100.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="219.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Broad access to handle</text><text x="84.0" y="244.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">unpredictable cases</text><text x="84.0" y="284.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Agents are often granted broad access</text><text x="84.0" y="305.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">for flexibility. That runs against least</text><text x="84.0" y="326.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">privilege and feeds Excessive Agency.</text><rect x="426.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="466.0" cy="166.0" r="15" fill="var(--p)"/><text x="466.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="450.0" y="219.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Many steps in sequence</text><text x="450.0" y="284.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Agents run many steps in a row, so one</text><text x="450.0" y="305.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">permission flaw can be exploited across</text><text x="450.0" y="326.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">several of them.</text><rect x="792.0" y="134.0" width="348.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="832.0" cy="166.0" r="15" fill="var(--gm)"/><text x="832.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="816.0" y="219.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Data and actions easily</text><text x="816.0" y="244.0" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">blur together</text><text x="816.0" y="284.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Because agents process natural</text><text x="816.0" y="305.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">language, the boundary between data to</text><text x="816.0" y="326.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">read and actions to take is easily blurred.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">One permission flaw in a multi-step chain can be exploited across several steps.</text></svg>
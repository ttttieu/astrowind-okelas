<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Four numbered step cards in order; the step to check at every action is highlighted." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four steps to design a permission model</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The design steps from the article, from listing actions to revoking authority.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four steps from the article; complete mediation per Saltzer &amp; Schroeder (1975).</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="240.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="100.0" cy="168.0" r="15" fill="var(--gm)"/><text x="100.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="82.0" y="228.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">List every action type</text><text x="82.0" y="306.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Write down every kind of</text><text x="82.0" y="327.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">action the agent can take.</text><line x1="306.0" y1="249.0" x2="324.0" y2="249.0" stroke="var(--gm)" stroke-width="3"/><polygon points="334.0,249.0 324.0,254.5 324.0,243.5" fill="var(--gm)"/><rect x="340.0" y="134.0" width="240.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="380.0" cy="168.0" r="15" fill="var(--gm)"/><text x="380.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="362.0" y="228.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Assign a tier by</text><text x="362.0" y="251.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">consequence</text><text x="362.0" y="306.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Base the tier on severity</text><text x="362.0" y="327.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">and reversibility.</text><line x1="586.0" y1="249.0" x2="604.0" y2="249.0" stroke="var(--gm)" stroke-width="3"/><polygon points="614.0,249.0 604.0,254.5 604.0,243.5" fill="var(--gm)"/><rect x="620.0" y="134.0" width="240.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="660.0" cy="168.0" r="15" fill="var(--p)"/><text x="660.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="642.0" y="228.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Check at every action</text><text x="642.0" y="306.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Not only at configuration</text><text x="642.0" y="327.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">(complete mediation).</text><line x1="866.0" y1="249.0" x2="884.0" y2="249.0" stroke="var(--gm)" stroke-width="3"/><polygon points="894.0,249.0 884.0,254.5 884.0,243.5" fill="var(--gm)"/><rect x="900.0" y="134.0" width="240.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="940.0" cy="168.0" r="15" fill="var(--gm)"/><text x="940.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="922.0" y="228.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Review and keep</text><text x="922.0" y="251.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">revocation possible</text><text x="922.0" y="306.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Review periodically;</text><text x="922.0" y="327.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">authority can always</text><text x="922.0" y="348.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">be revoked.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A policy on paper does not replace a check at the moment of action.</text></svg>
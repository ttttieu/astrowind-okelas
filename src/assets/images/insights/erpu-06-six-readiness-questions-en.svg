<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 508" width="1200" height="508" role="img" aria-label="Six self-assessment questions on change management readiness: project awareness, benefits per user group, hands-on practice, super users, leadership commitment and post-go-live support." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="508" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six questions: ready for change management?</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A self-check before go-live.</text><line x1="60.0" y1="424.0" x2="1140.0" y2="424.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="446.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Self-assessment questions from the article, a discussion aid, not a certified methodology.</text><text x="60.0" y="487.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="181.0" r="15" fill="var(--p)"/><text x="92.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="120.0" y="165.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Do employees know where the</text><text x="120.0" y="186.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">project stands and how it affects</text><text x="120.0" y="207.2" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">their jobs?</text><rect x="425.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="181.0" r="15" fill="var(--p)"/><text x="457.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="485.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Can you state the concrete benefits</text><text x="485.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">for each user group?</text><rect x="790.0" y="134.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="181.0" r="15" fill="var(--p)"/><text x="822.0" y="186.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="850.0" y="176.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is there a hands-on practice plan,</text><text x="850.0" y="196.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">not just a demo, before go-live?</text><rect x="60.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="290.0" r="15" fill="var(--p)"/><text x="92.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="120.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Has a super user been named for</text><text x="120.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">each department?</text><rect x="425.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="290.0" r="15" fill="var(--p)"/><text x="457.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="485.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is leadership committed to using</text><text x="485.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">ERP for decisions after go-live?</text><rect x="790.0" y="243.0" width="350.0" height="94.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="290.0" r="15" fill="var(--p)"/><text x="822.0" y="295.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="850.0" y="285.1" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Is there a clear support channel for</text><text x="850.0" y="305.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">problems after go-live?</text><rect x="60.0" y="353.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="386.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Several “no” answers: more preparation is needed before go-live.</text></svg>
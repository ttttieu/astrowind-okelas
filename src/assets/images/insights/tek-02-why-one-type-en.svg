<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Comparison: explicit knowledge can be stored, version-controlled, searched, audited and measured; tacit knowledge cannot, so explicit knowledge gets attention because it is easier to handle." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Why most organizations only manage one type</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Explicit knowledge gets attention because it is easier to handle.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="330.0" rx="16" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><rect x="726.7" y="152.0" width="142.6" height="28.0" rx="14.0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="798.0" y="170.7" font-size="13" font-weight="700" fill="var(--p)" text-anchor="middle">Explicit knowledge</text><rect x="944.6" y="152.0" width="126.8" height="28.0" rx="14.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1008.0" y="170.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Tacit knowledge</text><line x1="84.0" y1="198.0" x2="1116.0" y2="198.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="228.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Stored in a system</text><circle cx="800.0" cy="224.0" r="13" fill="var(--p)"/><line x1="794.0" y1="224.0" x2="798.0" y2="229.0" stroke="var(--wh)" stroke-width="2.4"/><line x1="798.0" y1="229.0" x2="807.0" y2="219.0" stroke="var(--wh)" stroke-width="2.4"/><circle cx="1010.0" cy="224.0" r="13" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1005.0" y1="219.0" x2="1015.0" y2="229.0" stroke="var(--a)" stroke-width="2.4"/><line x1="1005.0" y1="229.0" x2="1015.0" y2="219.0" stroke="var(--a)" stroke-width="2.4"/><line x1="84.0" y1="250.0" x2="1116.0" y2="250.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Version-controlled</text><circle cx="800.0" cy="276.0" r="13" fill="var(--p)"/><line x1="794.0" y1="276.0" x2="798.0" y2="281.0" stroke="var(--wh)" stroke-width="2.4"/><line x1="798.0" y1="281.0" x2="807.0" y2="271.0" stroke="var(--wh)" stroke-width="2.4"/><circle cx="1010.0" cy="276.0" r="13" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1005.0" y1="271.0" x2="1015.0" y2="281.0" stroke="var(--a)" stroke-width="2.4"/><line x1="1005.0" y1="281.0" x2="1015.0" y2="271.0" stroke="var(--a)" stroke-width="2.4"/><line x1="84.0" y1="302.0" x2="1116.0" y2="302.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="332.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Searched and retrieved</text><circle cx="800.0" cy="328.0" r="13" fill="var(--p)"/><line x1="794.0" y1="328.0" x2="798.0" y2="333.0" stroke="var(--wh)" stroke-width="2.4"/><line x1="798.0" y1="333.0" x2="807.0" y2="323.0" stroke="var(--wh)" stroke-width="2.4"/><circle cx="1010.0" cy="328.0" r="13" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1005.0" y1="323.0" x2="1015.0" y2="333.0" stroke="var(--a)" stroke-width="2.4"/><line x1="1005.0" y1="333.0" x2="1015.0" y2="323.0" stroke="var(--a)" stroke-width="2.4"/><line x1="84.0" y1="354.0" x2="1116.0" y2="354.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="384.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Checked in an audit</text><circle cx="800.0" cy="380.0" r="13" fill="var(--p)"/><line x1="794.0" y1="380.0" x2="798.0" y2="385.0" stroke="var(--wh)" stroke-width="2.4"/><line x1="798.0" y1="385.0" x2="807.0" y2="375.0" stroke="var(--wh)" stroke-width="2.4"/><circle cx="1010.0" cy="380.0" r="13" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1005.0" y1="375.0" x2="1015.0" y2="385.0" stroke="var(--a)" stroke-width="2.4"/><line x1="1005.0" y1="385.0" x2="1015.0" y2="375.0" stroke="var(--a)" stroke-width="2.4"/><line x1="84.0" y1="406.0" x2="1116.0" y2="406.0" stroke="var(--line)" stroke-width="1"/><text x="84.0" y="436.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Measured (exists or not, which version)</text><circle cx="800.0" cy="432.0" r="13" fill="var(--p)"/><line x1="794.0" y1="432.0" x2="798.0" y2="437.0" stroke="var(--wh)" stroke-width="2.4"/><line x1="798.0" y1="437.0" x2="807.0" y2="427.0" stroke="var(--wh)" stroke-width="2.4"/><circle cx="1010.0" cy="432.0" r="13" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1005.0" y1="427.0" x2="1015.0" y2="437.0" stroke="var(--a)" stroke-width="2.4"/><line x1="1005.0" y1="437.0" x2="1015.0" y2="427.0" stroke="var(--a)" stroke-width="2.4"/><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Explicit knowledge gets attention because it is easier to handle, not because it matters more.</text></svg>
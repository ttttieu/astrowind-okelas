<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Ba thẻ giới hạn mang nhãn Giới hạn, và một khung bên dưới ghi hướng phát triển FindGap." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM không quyết định quyền hạn và không phải cả khung</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba giới hạn theo bài viết, và một hướng phát triển chưa là năng lực hiện tại.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Giới hạn và FindGap theo bài viết; FindGap được nêu là hướng phát triển, không phải năng lực hiện tại.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="204.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Giới hạn</text><text x="200.0" y="193.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM không quyết định agent nào được làm hành động nào; việc đó thuộc các bậc Read, Request,</text><text x="200.0" y="212.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Recommend, Execute</text><rect x="60.0" y="246.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="290.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Giới hạn</text><text x="200.0" y="279.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM không ghi lại mọi hành động của agent trên toàn hệ thống</text><rect x="60.0" y="332.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Giới hạn</text><text x="200.0" y="365.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM không phải cơ chế an toàn ở tầng mô hình</text><rect x="60.0" y="436.0" width="1080.0" height="64.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="473.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Hướng phát triển: FindGap, phát hiện khoảng trống tri thức chưa được ghi nhận. Chưa phải năng lực hiện tại.</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM là một mắt xích trong khung kiểm soát, không phải toàn bộ khung.</text></svg>
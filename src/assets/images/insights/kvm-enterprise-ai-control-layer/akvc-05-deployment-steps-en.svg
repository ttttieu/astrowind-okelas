<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Four numbered cards, one for each deployment step." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four steps, starting with the agent holding most authority</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">No need to finish everything first; start where control matters most.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four deployment steps per the article; no timeline is given in the article.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="240.0" height="200.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="96.0" cy="200.0" r="15" fill="var(--p)"/><text x="96.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="82.0" y="248.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Choose the agent or</text><text x="82.0" y="270.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">process with the most</text><text x="82.0" y="291.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">delegated authority</text><rect x="340.0" y="170.0" width="240.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="376.0" cy="200.0" r="15" fill="var(--gm)"/><text x="376.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="362.0" y="248.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Draft an authority profile</text><text x="362.0" y="270.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">covering Identity,</text><text x="362.0" y="291.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Authority,</text><text x="362.0" y="313.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Responsibility, Audit</text><rect x="620.0" y="170.0" width="240.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="656.0" cy="200.0" r="15" fill="var(--gm)"/><text x="656.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="642.0" y="248.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Find steps that need</text><text x="642.0" y="270.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">organizational</text><text x="642.0" y="291.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">knowledge; evaluate</text><text x="642.0" y="313.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">KVM for them</text><rect x="900.0" y="170.0" width="240.0" height="200.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="936.0" cy="200.0" r="15" fill="var(--gm)"/><text x="936.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="922.0" y="248.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Set a periodic review</text><text x="922.0" y="270.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">schedule for the</text><text x="922.0" y="291.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">control design</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Add control layers gradually, starting where authority is greatest.</text></svg>
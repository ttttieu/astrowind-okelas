<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Ba thẻ thao tác Trace, FindEvidence, Resolve, mỗi thẻ có một dòng mô tả; bên dưới là khung Hướng phát triển FindGap." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="552" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba thao tác xác định cho tri thức của tổ chức</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Trace, FindEvidence và Resolve là ba thao tác có tính xác định, không để mô hình tự đoán.</text><line x1="60.0" y1="468.0" x2="1140.0" y2="468.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="490.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba thao tác theo bài viết; phần mô tả ngắn là diễn giải của OKELAS.</text><text x="60.0" y="531.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="190.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="86.0" y="214.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">Trace</text><text x="86.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Nguồn gốc của một</text><text x="86.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">thông tin (provenance)</text><rect x="430.0" y="160.0" width="340.0" height="190.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="456.0" y="214.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">FindEvidence</text><text x="456.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Tìm bằng chứng liên quan</text><text x="456.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">đến câu hỏi</text><rect x="800.0" y="160.0" width="340.0" height="190.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="826.0" y="214.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">Resolve</text><text x="826.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định thực thể và quan hệ</text><text x="826.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">giữa chúng</text><rect x="60.0" y="398.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="431.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ba thao tác có tính xác định, không để mô hình tự đoán.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 582" width="1200" height="582" role="img" aria-label="Hai thẻ đặt cạnh nhau: AI suy luận bên trái, KVM truy xuất và phân giải tri thức bên phải." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="582" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">AI suy luận, còn KVM truy xuất tri thức có nguồn gốc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tách phần việc của mô hình khỏi phần việc truy xuất và phân giải tri thức.</text><line x1="60.0" y1="498.0" x2="1140.0" y2="498.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="520.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Vai trò theo bài viết; việc đặt hai cột cạnh nhau là cách OKELAS trình bày.</text><text x="60.0" y="561.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="150.0" width="528.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="324.0" y="175.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="middle">AI agent / Copilot</text><text x="88.0" y="242.9" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">AI suy luận và giải thích kết quả</text><rect x="612.0" y="150.0" width="528.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="876.0" y="175.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">KVM</text><text x="640.0" y="242.9" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">KVM truy xuất, phân giải và truy vết</text><text x="640.0" y="272.6" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">tri thức tổ chức</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI giải thích; KVM đảm bảo tri thức đứng sau câu trả lời.</text></svg>
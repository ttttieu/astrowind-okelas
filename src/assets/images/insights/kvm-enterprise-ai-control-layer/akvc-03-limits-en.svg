<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Three limit cards labelled Limit, and a bordered box below for the future direction FindGap." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM does not decide authority or make up the whole framework</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Three limits per the article, plus one direction that is not yet a current capability.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Limits and FindGap per the article; FindGap is described as a future direction, not a current capability.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="204.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Limit</text><text x="200.0" y="193.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM does not decide which agent may take which action; that belongs to the Read, Request, Recommend,</text><text x="200.0" y="212.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Execute tiers</text><rect x="60.0" y="246.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="290.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Limit</text><text x="200.0" y="279.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM does not log every agent action across the whole system</text><rect x="60.0" y="332.0" width="1080.0" height="76.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="86.0" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="start">Limit</text><text x="200.0" y="365.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">KVM is not a model-level safety mechanism</text><rect x="60.0" y="436.0" width="1080.0" height="64.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="473.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="middle">Future direction: FindGap, detecting knowledge gaps that were never recorded. Not yet a current capability.</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM is one link in a control framework, not the whole framework.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Flow from AI agent through KVM to organizational knowledge, with six connected sources below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agents reach organizational knowledge via one defined layer</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The data flow from agent to knowledge, and the sources this layer connects to.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Flow and knowledge sources per the article; the arrangement is OKELAS’s illustration.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="280.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="200.0" y="224.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">AI agent / Copilot</text><line x1="346.0" y1="218.0" x2="404.0" y2="218.0" stroke="var(--gm)" stroke-width="3"/><polygon points="416.0,218.0 404.0,224.6 404.0,211.4" fill="var(--gm)"/><rect x="420.0" y="170.0" width="280.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="560.0" y="225.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="middle">KVM</text><line x1="706.0" y1="218.0" x2="764.0" y2="218.0" stroke="var(--gm)" stroke-width="3"/><polygon points="776.0,218.0 764.0,224.6 764.0,211.4" fill="var(--gm)"/><rect x="780.0" y="170.0" width="360.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="960.0" y="224.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational knowledge</text><rect x="60.0" y="318.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="230.0" y="345.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Documents</text><rect x="430.0" y="318.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="345.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Events</text><rect x="800.0" y="318.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="970.0" y="345.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Workflows</text><rect x="60.0" y="378.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="230.0" y="405.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">People</text><rect x="430.0" y="378.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="405.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Systems</text><rect x="800.0" y="378.0" width="340.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="970.0" y="405.8" font-size="16" font-weight="700" fill="var(--tx)" text-anchor="middle">Records</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Agents access knowledge through defined operations, not raw data.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Hai thẻ điều khoản 8.7 và 10.2 xếp cạnh nhau, mỗi thẻ có một đoạn mô tả, bên dưới có khung tóm tắt." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 8.7 xử lý vấn đề, 10.2 ngăn tái diễn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Hai điều khoản cùng làm việc: một bên xử lý đầu ra, một bên tìm nguyên nhân.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Điều khoản 8.7 và 10.2 theo bài viết; cách đặt hai cột cạnh nhau là của OKELAS.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="180.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Điều khoản 8.7</text><text x="88.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Xử lý đầu ra không phù hợp: khắc phục, cách ly, thông</text><text x="88.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">báo khách hàng, xác minh sau khắc phục</text><rect x="612.0" y="160.0" width="528.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Điều khoản 10.2</text><text x="640.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Đánh giá nhu cầu loại bỏ nguyên nhân, thực hiện hành</text><text x="640.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">động và rà soát hiệu lực</text><rect x="60.0" y="370.0" width="1080.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="406.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">8.7 xử lý vấn đề trước mắt; 10.2 ngăn vấn đề quay lại.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Xử lý vấn đề và ngăn tái diễn là hai việc khác nhau.</text></svg>
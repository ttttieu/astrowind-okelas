<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Two rows of classification chips: by impact with three items, by source with five items." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Classify by impact and source to see trends</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The main value of NCRs lies in aggregated data over time.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Classification groups per the article; arranging them as two rows is OKELAS’s presentation.</text><text x="60.0" y="663.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="177.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">By impact</text><rect x="60.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="230.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Customer</text><rect x="430.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Safety</text><rect x="800.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="970.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Regulatory</text><text x="60.0" y="323.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">By source</text><rect x="60.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Material</text><rect x="335.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="462.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Process</text><rect x="610.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="737.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Equipment</text><rect x="885.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="1012.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">People</text><rect x="60.0" y="420.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="460.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Documents</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Only detailed classification reveals repeat failures.</text></svg>
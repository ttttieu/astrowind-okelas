<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Two cards: top, two quarters with no NCRs; bottom, the problems are often handled off-system; a note box below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:var(--svg-p,#0161EF);--s:var(--svg-s,#0154CF);--a:var(--svg-a,#6D28D9);--bg:var(--svg-bg,#FFFFFF);--tx:var(--svg-tx,#273244);--mut:var(--svg-mut,#5B677A);--line:var(--svg-line,#D5DCE7);--hd:var(--svg-hd,#0B1220);--pt:var(--svg-pt,#EAF2FF);--at:var(--svg-at,#F3EDFF);--gt:var(--svg-gt,#F2F4F8);--ink:var(--svg-ink,#0B1220);--onink:var(--svg-onink,#FFFFFF);--wh:var(--svg-wh,#FFFFFF);--gm:var(--svg-gm,#98A2B3);}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Two quarters with no NCRs is a signal to ask more</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A plant reports zero NCRs; auditors are skeptical, since real operations rarely run flawlessly.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Scenario per the article; the conclusion is OKELASâ€™s reading.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Two quarters with no NCRs</text><text x="88.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">The problems are often being handled off-system</text><rect x="612.0" y="160.0" width="528.0" height="150.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">The question to ask</text><text x="640.0" y="258.7" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">Is that zero fully recorded, or is the work happening</text><text x="640.0" y="283.0" font-size="18" font-weight="400" fill="var(--tx)" text-anchor="start">outside the system?</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A zero count should prompt questions, not reassurance.</text></svg>
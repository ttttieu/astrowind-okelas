<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Two clause cards, 8.7 and 10.2, side by side, each with a description, and a summary bar below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:var(--svg-p,#0161EF);--s:var(--svg-s,#0154CF);--a:var(--svg-a,#6D28D9);--bg:var(--svg-bg,#FFFFFF);--tx:var(--svg-tx,#273244);--mut:var(--svg-mut,#5B677A);--line:var(--svg-line,#D5DCE7);--hd:var(--svg-hd,#0B1220);--pt:var(--svg-pt,#EAF2FF);--at:var(--svg-at,#F3EDFF);--gt:var(--svg-gt,#F2F4F8);--ink:var(--svg-ink,#0B1220);--onink:var(--svg-onink,#FFFFFF);--wh:var(--svg-wh,#FFFFFF);--gm:var(--svg-gm,#98A2B3);}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Clause 8.7 handles the problem, 10.2 prevents recurrence</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Two clauses work together: one handles the output, the other finds the cause.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Clauses 8.7 and 10.2 per the article; placing the two side by side is OKELASâ€™s presentation.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="180.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="88.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Clause 8.7</text><text x="88.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Handling nonconforming outputs: correction,</text><text x="88.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">segregation, customer notice, verification</text><text x="88.0" y="305.7" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">after correction</text><rect x="612.0" y="160.0" width="528.0" height="180.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="640.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Clause 10.2</text><text x="640.0" y="258.1" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">Evaluating the need to remove causes, implementing</text><text x="640.0" y="281.9" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="start">action, and reviewing effectiveness</text><rect x="60.0" y="370.0" width="1080.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="406.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">8.7 handles the immediate problem; 10.2 keeps it from coming back.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Handling the problem and preventing recurrence are two different jobs.</text></svg>
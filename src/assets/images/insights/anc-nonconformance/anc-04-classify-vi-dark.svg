<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" width="1200" height="684" role="img" aria-label="Hai dãy thẻ phân loại: theo tác động gồm ba mục, theo nguồn gồm năm mục." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#08090A;--gm:#5B6575;}}</style><rect width="1200" height="684" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phân loại theo tác động và nguồn để thấy xu hướng</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Giá trị lớn nhất của NCR nằm ở dữ liệu tổng hợp theo thời gian.</text><line x1="60.0" y1="600.0" x2="1140.0" y2="600.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="622.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Các nhóm phân loại theo bài viết; cách sắp xếp thành hai dãy là của OKELAS.</text><text x="60.0" y="663.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="177.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Theo tác động</text><rect x="60.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="230.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Khách hàng</text><rect x="430.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="600.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">An toàn</text><rect x="800.0" y="190.0" width="340.0" height="70.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="970.0" y="231.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Pháp lý</text><text x="60.0" y="323.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Theo nguồn</text><rect x="60.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Vật liệu</text><rect x="335.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="462.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Quy trình</text><rect x="610.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="737.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Thiết bị</text><rect x="885.0" y="336.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="1012.5" y="376.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Con người</text><rect x="60.0" y="420.0" width="255.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="187.5" y="460.8" font-size="16" font-weight="700" fill="var(--a)" text-anchor="middle">Tài liệu</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phân loại đủ chi tiết mới thấy được lỗi lặp lại.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Four question cards in a row, with a reminder bar below about recording the reason when no CAPA is opened." font-family="Inter, system-ui, sans-serif"><style>svg{--p:var(--svg-p,#0161EF);--s:var(--svg-s,#0154CF);--a:var(--svg-a,#6D28D9);--bg:var(--svg-bg,#FFFFFF);--tx:var(--svg-tx,#273244);--mut:var(--svg-mut,#5B677A);--line:var(--svg-line,#D5DCE7);--hd:var(--svg-hd,#0B1220);--pt:var(--svg-pt,#EAF2FF);--at:var(--svg-at,#F3EDFF);--gt:var(--svg-gt,#F2F4F8);--ink:var(--svg-ink,#0B1220);--onink:var(--svg-onink,#FFFFFF);--wh:var(--svg-wh,#FFFFFF);--gm:var(--svg-gm,#98A2B3);}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four questions decide whether an NCR needs CAPA</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not every NCR needs CAPA; the article suggests four questions to decide.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four questions per the article, paraphrased by OKELAS; the article sets no fixed criteria.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><circle cx="90.0" cy="204.0" r="15" fill="var(--p)"/><text x="90.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Has it recurred or shown</text><text x="80.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">a trend?</text><rect x="335.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="365.0" cy="204.0" r="15" fill="var(--gm)"/><text x="365.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="355.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Is the impact serious?</text><rect x="610.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="640.0" cy="204.0" r="15" fill="var(--gm)"/><text x="640.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="630.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Is the cause systemic or</text><text x="630.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">a one-off?</text><rect x="885.0" y="170.0" width="255.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="915.0" cy="204.0" r="15" fill="var(--gm)"/><text x="915.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="905.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Could it be happening</text><text x="905.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">elsewhere?</text><rect x="60.0" y="370.0" width="1080.0" height="60.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="406.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">If you decide not to open a CAPA, record the reason.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Record the reason whenever you decide not to open a CAPA.</text></svg>
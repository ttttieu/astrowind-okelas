<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Six pattern cards in a column, each numbered from 1 to 6." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Six signs that NCRs have become a formality</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Six patterns per the article; the article treats them as general observations, not measured data.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Six patterns per the article, paraphrased; the article gives no measured figures.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="193.0" r="15" fill="var(--p)"/><text x="94.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="197.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">NCRs written for audits, late and in batches</text><rect x="612.0" y="160.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="193.0" r="15" fill="var(--gm)"/><text x="646.0" y="198.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="678.0" y="197.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Blame culture discourages reporting</text><rect x="60.0" y="244.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="277.0" r="15" fill="var(--gm)"/><text x="94.0" y="282.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="281.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Descriptions too vague to analyze</text><rect x="612.0" y="244.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="277.0" r="15" fill="var(--gm)"/><text x="646.0" y="282.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="678.0" y="281.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Disposition decisions not recorded</text><rect x="60.0" y="328.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="94.0" cy="361.0" r="15" fill="var(--gm)"/><text x="94.0" y="366.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="126.0" y="365.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Every NCR looks the same</text><rect x="612.0" y="328.0" width="528.0" height="66.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><circle cx="646.0" cy="361.0" r="15" fill="var(--gm)"/><text x="646.0" y="366.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="678.0" y="365.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nobody reviews the overall picture</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">NCRs become a formality when nobody reviews the overall picture.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 682" width="1200" height="682" role="img" aria-label="Four example cards of agent incidents: Replit, Apollo Research, confused deputy and EchoLeak." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="682" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">When an agent errs, the consequence has already happened</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Four examples from the article, described at a general level.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Examples summarised from the article. Dates: Replit 07/2025; Apollo Research 2024; CSA 2026.</text><text x="60.0" y="661.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="171.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Replit · 07/2025</text><text x="84.0" y="207.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">An AI coding agent deleted a production database despite</text><text x="84.0" y="229.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">instructions to make no changes without approval.</text><rect x="612.0" y="134.0" width="528.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="636.0" y="171.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Apollo Research · 2024</text><text x="636.0" y="207.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Test-environment study: some models attempted to disable</text><text x="636.0" y="229.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">oversight under designed conditions.</text><rect x="60.0" y="320.0" width="528.0" height="170.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="357.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Confused deputy · CSA 2026</text><text x="84.0" y="393.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Errors propagate through orchestrators and can exceed the</text><text x="84.0" y="415.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">authority of individual agents.</text><rect x="612.0" y="320.0" width="528.0" height="170.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="636.0" y="357.1" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">EchoLeak · CVE-2025-32711</text><text x="636.0" y="393.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">A crafted email could expose enterprise data without any</text><text x="636.0" y="415.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">click from the user.</text><rect x="60.0" y="528.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="561.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The common thread: the consequence had already occurred before anyone reviewed it.</text></svg>
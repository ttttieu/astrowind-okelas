<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-label="Two process rows: the chatbot has a person checking before any consequence; the agent has the system changed before review." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="644" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Same kind of error, two different points of intervention</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A person checks a chatbot answer before it has an effect; an agent may already have changed the system.</text><line x1="60.0" y1="560.0" x2="1140.0" y2="560.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="582.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Schematic illustrating the article’s structure; not measured data.</text><text x="60.0" y="623.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="176.6" font-size="18" font-weight="700" fill="var(--s)" text-anchor="start">Chatbot</text><text x="60.0" y="340.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="start">Agent</text><rect x="60.0" y="190.0" width="300.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="244.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">AI answers</text><rect x="450.0" y="190.0" width="300.0" height="96.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="244.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">A person checks</text><rect x="840.0" y="190.0" width="300.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="990.0" y="244.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Fix or discard</text><rect x="60.0" y="354.0" width="300.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="210.0" y="408.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">AI acts</text><rect x="450.0" y="354.0" width="300.0" height="96.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="600.0" y="408.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">The system has changed</text><rect x="840.0" y="354.0" width="300.0" height="96.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="990.0" y="396.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Review after the</text><text x="990.0" y="420.4" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">consequence</text><line x1="360.0" y1="238.0" x2="436.0" y2="238.0" stroke="var(--gm)" stroke-width="3"/><polygon points="448.0,238.0 436.0,244.6 436.0,231.4" fill="var(--gm)"/><line x1="750.0" y1="238.0" x2="826.0" y2="238.0" stroke="var(--gm)" stroke-width="3"/><polygon points="838.0,238.0 826.0,244.6 826.0,231.4" fill="var(--gm)"/><line x1="360.0" y1="402.0" x2="436.0" y2="402.0" stroke="var(--gm)" stroke-width="3"/><polygon points="448.0,402.0 436.0,408.6 436.0,395.4" fill="var(--gm)"/><line x1="750.0" y1="402.0" x2="826.0" y2="402.0" stroke="var(--gm)" stroke-width="3"/><polygon points="838.0,402.0 826.0,408.6 826.0,395.4" fill="var(--gm)"/><rect x="60.0" y="490.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="523.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">When a chatbot errs, a person checks and fixes it. When an agent errs, the action may already have happened.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 672" width="1200" height="672" role="img" aria-label="A table comparing chatbot and agent across five criteria." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="672" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five criteria separating agent errors from chatbot errors</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">A comparison of five dimensions, as the article sets them out.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Summary comparison from the article; not survey data.</text><text x="60.0" y="651.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="84.0" y="163.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Criteria</text><text x="340.0" y="163.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">Chatbot</text><text x="760.0" y="163.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Agent</text><rect x="60.0" y="182.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="182.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="182.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="216.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Nature</text><text x="352.0" y="216.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">One answer</text><text x="772.0" y="216.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">An action that changes system state</text><rect x="60.0" y="246.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="246.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="246.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="280.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Timing of intervention</text><text x="352.0" y="280.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Before any consequence</text><text x="772.0" y="280.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Possibly after the consequence has occurred</text><rect x="60.0" y="310.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="310.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="310.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="344.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Reversibility</text><text x="352.0" y="344.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Usually easy to fix or discard</text><text x="772.0" y="344.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Can be hard or impossible to reverse</text><rect x="60.0" y="374.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="374.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="374.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="408.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Scope</text><text x="352.0" y="408.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">One output, one reader</text><text x="772.0" y="408.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Data, workflows and connected systems</text><rect x="60.0" y="438.0" width="240.0" height="58.0" rx="10" fill="var(--bg)"/><rect x="330.0" y="438.0" width="390.0" height="58.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><rect x="750.0" y="438.0" width="390.0" height="58.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.2"/><text x="84.0" y="472.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Detection</text><text x="352.0" y="472.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A person sees it at once</text><text x="772.0" y="472.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Often only through logs or an incident</text><rect x="60.0" y="518.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="551.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The difference lies in timing and reversibility, not only in how severe the error is.</text></svg>
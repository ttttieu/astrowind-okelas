<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Four pillar cards: evidence, authorization, boundary and audit." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four pillars: evidence, authorization, boundary, audit</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The four pillars the article proposes to bound agent risk.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Four pillars as the article describes them; specific implementation varies by business.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="96.0" cy="166.0" r="15" fill="var(--gm)"/><text x="96.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence</text><text x="84.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Independently recorded</text><text x="84.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">inputs, reasoning and</text><text x="84.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">outcomes, not the</text><text x="84.0" y="320.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">model’s self-report.</text><rect x="335.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="371.0" cy="166.0" r="15" fill="var(--p)"/><text x="371.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="359.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Authorization</text><text x="359.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">A separate confirmation</text><text x="359.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">point before</text><text x="359.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">consequential actions.</text><rect x="610.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="646.0" cy="166.0" r="15" fill="var(--gm)"/><text x="646.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="634.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Boundary</text><text x="634.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Least-privilege scope,</text><text x="634.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">checked at both agent and</text><text x="634.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">system level.</text><rect x="885.0" y="134.0" width="255.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="921.0" cy="166.0" r="15" fill="var(--gm)"/><text x="921.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="909.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Audit</text><text x="909.0" y="256.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Proactive periodic review</text><text x="909.0" y="277.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">and the ability to revoke</text><text x="909.0" y="298.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">authority quickly.</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Capability doesn’t equal permission.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Three reasons a digitized workflow stays slow: steps stay sequential when they could run in parallel, approvers lack context, and exceptions fall back to calls, texts and private email." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="630" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three reasons a digitized workflow still creates friction</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Not the fault of any specific software, but the result of how the process was digitized.</text><line x1="60.0" y1="568.0" x2="1140.0" y2="568.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="590.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="98.0" cy="168.0" r="17" fill="var(--a)"/><text x="98.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text><text x="126.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sequential when it</text><text x="126.0" y="189.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">needn’t be</text><text x="82.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Steps are chained one after another</text><text x="82.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">because that’s how it was done on paper,</text><text x="82.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">not because the business requires it.</text><text x="82.0" y="447.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Digitizing usually carries the habit over.</text><rect x="74.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><text x="82.0" y="228.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Today</text><rect x="82.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="110.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">A</text><line x1="141.0" y1="251.0" x2="157.0" y2="251.0" stroke="var(--gm)" stroke-width="2"/><polygon points="165.0,251.0 157.0,255.4 157.0,246.6" fill="var(--gm)"/><rect x="168.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="196.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">B</text><line x1="227.0" y1="251.0" x2="243.0" y2="251.0" stroke="var(--gm)" stroke-width="2"/><polygon points="251.0,251.0 243.0,255.4 243.0,246.6" fill="var(--gm)"/><rect x="254.0" y="236.0" width="56.0" height="30.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="282.0" y="255.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">C</text><text x="82.0" y="288.6" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="start">Where the business allows</text><rect x="82.0" y="308.0" width="56.0" height="30.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="110.0" y="327.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">A</text><rect x="168.0" y="294.0" width="56.0" height="26.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="196.0" y="311.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">B</text><rect x="168.0" y="324.0" width="56.0" height="26.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="196.0" y="341.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">C</text><line x1="141.0" y1="317.0" x2="157.6" y2="310.1" stroke="var(--p)" stroke-width="2"/><polygon points="165.0,307.0 159.3,314.1 155.9,306.0" fill="var(--p)"/><line x1="141.0" y1="325.0" x2="157.8" y2="333.4" stroke="var(--p)" stroke-width="2"/><polygon points="165.0,337.0 155.9,337.4 159.8,329.5" fill="var(--p)"/><rect x="427.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="465.0" cy="168.0" r="17" fill="var(--a)"/><text x="465.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text><text x="493.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">The system carries</text><text x="493.0" y="189.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">no context</text><text x="449.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">The person approving step 3 only sees</text><text x="449.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">a completed form. They ask, wait for</text><text x="449.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">an explanation, or approve without</text><text x="449.0" y="447.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">enough information.</text><rect x="441.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><rect x="449.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="477.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">1</text><line x1="508.0" y1="241.0" x2="524.0" y2="241.0" stroke="var(--gm)" stroke-width="2"/><polygon points="532.0,241.0 524.0,245.4 524.0,236.6" fill="var(--gm)"/><rect x="535.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="563.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">2</text><line x1="594.0" y1="241.0" x2="610.0" y2="241.0" stroke="var(--gm)" stroke-width="2"/><polygon points="618.0,241.0 610.0,245.4 610.0,236.6" fill="var(--gm)"/><rect x="621.0" y="224.0" width="56.0" height="34.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="649.0" y="245.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">3</text><rect x="449.0" y="276.0" width="142.0" height="54.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.4" stroke-dasharray="4 4"/><text x="520.0" y="299.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Reasons for steps 1,</text><text x="520.0" y="315.3" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">2 hidden</text><rect x="621.0" y="276.0" width="120.0" height="54.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="681.0" y="299.4" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">Sees only a</text><text x="681.0" y="315.3" font-size="12" font-weight="700" fill="var(--s)" text-anchor="middle">completed form</text><line x1="477.0" y1="260.0" x2="477.0" y2="276.0" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="563.0" y1="260.0" x2="563.0" y2="276.0" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="651.0" y1="260.0" x2="651.0" y2="269.0" stroke="var(--p)" stroke-width="2"/><polygon points="651.0,276.0 647.1,269.0 654.9,269.0" fill="var(--p)"/><rect x="794.0" y="130.0" width="346.0" height="358.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.6"/><circle cx="832.0" cy="168.0" r="17" fill="var(--a)"/><text x="832.0" y="174.2" font-size="17" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text><text x="860.0" y="166.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Exceptions have nowhere</text><text x="860.0" y="189.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">to go</text><text x="816.0" y="384.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Workflow is designed for the standard</text><text x="816.0" y="405.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">case. A new supplier or a spend over</text><text x="816.0" y="426.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">the usual limit sends everything to</text><text x="816.0" y="447.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">informal channels.</text><rect x="808.0" y="210.0" width="318.0" height="140.0" rx="12" fill="var(--gt)"/><rect x="816.0" y="220.0" width="92.0" height="34.0" rx="8" fill="var(--at)" stroke="var(--a)" stroke-width="1.5"/><text x="862.0" y="241.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Exception</text><line x1="912.0" y1="237.0" x2="958.0" y2="237.0" stroke="var(--gm)" stroke-width="2"/><polygon points="966.0,237.0 958.0,241.4 958.0,232.6" fill="var(--gm)"/><text x="939.0" y="231.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">×</text><rect x="970.0" y="220.0" width="92.0" height="34.0" rx="8" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="1016.0" y="241.7" font-size="13" font-weight="700" fill="var(--s)" text-anchor="middle">System</text><rect x="816.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="861.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Phone call</text><line x1="862.0" y1="258.0" x2="861.2" y2="289.0" stroke="var(--a)" stroke-width="1.8"/><polygon points="861.0,296.0 857.3,288.9 865.0,289.1" fill="var(--a)"/><rect x="914.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="959.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Text message</text><line x1="862.0" y1="258.0" x2="952.5" y2="293.4" stroke="var(--a)" stroke-width="1.8"/><polygon points="959.0,296.0 951.1,297.0 953.9,289.9" fill="var(--a)"/><rect x="1012.0" y="298.0" width="90.0" height="34.0" rx="8" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="1057.0" y="319.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Private email</text><line x1="862.0" y1="258.0" x2="1050.1" y2="294.7" stroke="var(--a)" stroke-width="1.8"/><polygon points="1057.0,296.0 1049.4,298.4 1050.9,290.9" fill="var(--a)"/><rect x="60.0" y="506.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="539.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The result of digitizing a process without redesigning it.</text></svg>
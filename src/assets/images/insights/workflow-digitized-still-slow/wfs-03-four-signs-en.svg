<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Four signs a workflow was digitized but never redesigned; two or more suggests the problem is process design." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="572" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Four signs you digitized the process but never redesigned it</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tick what applies to your organization.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The threshold and categories shown are OKELAS’s suggestions: a discussion aid, not a certified methodology.</text><rect x="60.0" y="132.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="98.0" cy="194.0" r="18" fill="var(--p)"/><text x="98.0" y="200.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="130.0" y="189.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">A request gets stuck and nobody can say which step it’s</text><text x="130.0" y="210.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">at until someone asks the person handling it.</text><rect x="610.0" y="132.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="648.0" cy="194.0" r="18" fill="var(--p)"/><text x="648.0" y="200.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="680.0" y="189.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Exceptions are consistently handled outside the system,</text><text x="680.0" y="210.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">even while the workflow keeps running.</text><rect x="60.0" y="274.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="98.0" cy="336.0" r="18" fill="var(--p)"/><text x="98.0" y="342.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="130.0" y="331.3" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Someone acts as an unofficial “chaser”; when they are</text><text x="130.0" y="352.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">out, everything slows down.</text><rect x="610.0" y="274.0" width="530.0" height="124.0" rx="14" fill="var(--gt)" stroke="var(--line)" stroke-width="1.5"/><circle cx="648.0" cy="336.0" r="18" fill="var(--p)"/><text x="648.0" y="342.6" font-size="18" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="680.0" y="320.7" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">The approval steps in the software match the old</text><text x="680.0" y="341.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">physical signatures; nothing was combined, removed or</text><text x="680.0" y="362.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">run in parallel.</text><rect x="60.0" y="422.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="455.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Two or more: the problem is likely how the process was designed, not which workflow tool you use.</text></svg>
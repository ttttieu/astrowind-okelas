<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 524" width="1200" height="524" role="img" aria-label="Together BOM and routing let ERP calculate expected production cost, plan against capacity, generate production orders and track progress by operation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="524" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">What BOM and routing let ERP do</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Only with both BOM and routing can ERP calculate and track production.</text><line x1="60.0" y1="440.0" x2="1140.0" y2="440.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="462.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram from the article, not measured data.</text><text x="60.0" y="503.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="440.0" height="100.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="171.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">BOM</text><text x="84.0" y="201.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Materials, subassemblies, components and quantities</text><rect x="60.0" y="250.0" width="440.0" height="100.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="287.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Routing</text><text x="84.0" y="317.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Operations, time per step, machines or work</text><text x="84.0" y="336.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">centers, labor</text><line x1="510.0" y1="242.0" x2="687.8" y2="158.8" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,155.0 689.9,163.3 685.8,154.3" fill="var(--gm)"/><rect x="700.0" y="133.0" width="440.0" height="44.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="920.0" y="160.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Calculate expected production cost</text><line x1="510.0" y1="242.0" x2="687.1" y2="214.4" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,213.0 687.9,219.3 686.3,209.5" fill="var(--gm)"/><rect x="700.0" y="191.0" width="440.0" height="44.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="920.0" y="218.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Plan against capacity</text><line x1="510.0" y1="242.0" x2="687.1" y2="269.6" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,271.0 686.3,274.5 687.9,264.7" fill="var(--gm)"/><rect x="700.0" y="249.0" width="440.0" height="44.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="920.0" y="276.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Generate production orders</text><line x1="510.0" y1="242.0" x2="687.8" y2="325.2" stroke="var(--gm)" stroke-width="2.5"/><polygon points="696.0,329.0 685.8,329.7 689.9,320.7" fill="var(--gm)"/><rect x="700.0" y="307.0" width="440.0" height="44.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="920.0" y="334.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Track progress by operation</text><rect x="60.0" y="370.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="403.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Routing is a preparation step, not something ERP creates during implementation.</text></svg>
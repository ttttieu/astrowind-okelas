<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" width="1200" height="552" role="img" aria-label="Three operation cards: Trace, FindEvidence, Resolve, each with a question and a short definition." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="552" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three operations: Trace, FindEvidence, Resolve</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The three operations the article names; each answers a different question.</text><line x1="60.0" y1="468.0" x2="1140.0" y2="468.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="490.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three operations per the article; FindGap is a stated future direction, not a current capability, so it is not shown.</text><text x="60.0" y="531.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="183.7" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Trace</text><text x="84.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Where does this knowledge come</text><text x="84.0" y="249.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">from, and through which steps?</text><text x="84.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Traces the origin, relationships or</text><text x="84.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">provenance of a piece of knowledge.</text><rect x="426.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="450.0" y="183.7" font-size="24" font-weight="700" fill="var(--a)" text-anchor="start">FindEvidence</text><text x="450.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">What evidence exists for</text><text x="450.0" y="249.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">this situation?</text><text x="450.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Finds relevant organizational evidence</text><text x="450.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">for a specific situation.</text><rect x="792.0" y="134.0" width="348.0" height="230.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="816.0" y="183.7" font-size="24" font-weight="700" fill="var(--hd)" text-anchor="start">Resolve</text><text x="816.0" y="227.2" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Which object is being referred to?</text><text x="816.0" y="297.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Identifies the exact entity, relationship</text><text x="816.0" y="319.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">or object being referenced.</text><rect x="60.0" y="398.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="431.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">AI reasons and explains; KVM retrieves, resolves and traces organizational knowledge.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 568" width="1200" height="568" role="img" aria-label="Chain AI → KVM → organizational knowledge, with four cards below stating what KVM is not: sandbox, Knowledge Graph, LLM, or a complete permission system." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="568" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">KVM is one mechanism, not all of AI control</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">KVM controls how knowledge is accessed; it does not replace a permission system.</text><line x1="60.0" y1="484.0" x2="1140.0" y2="484.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="506.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The “not” list and the AI → KVM → organizational knowledge model are per the article.</text><text x="60.0" y="547.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="260.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="190.0" y="186.3" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="middle">AI</text><rect x="410.0" y="134.0" width="380.0" height="90.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="187.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="middle">KVM</text><rect x="880.0" y="134.0" width="260.0" height="90.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="1010.0" y="185.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Organizational knowledge</text><line x1="324.0" y1="179.0" x2="394.0" y2="179.0" stroke="var(--gm)" stroke-width="3"/><polygon points="406.0,179.0 394.0,185.6 394.0,172.4" fill="var(--gm)"/><line x1="794.0" y1="179.0" x2="864.0" y2="179.0" stroke="var(--gm)" stroke-width="3"/><polygon points="876.0,179.0 864.0,185.6 864.0,172.4" fill="var(--gm)"/><text x="60.0" y="273.2" font-size="17" font-weight="700" fill="var(--s)" text-anchor="start">KVM is not</text><rect x="60.0" y="286.0" width="255.0" height="70.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="187.5" y="326.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Sandbox</text><rect x="335.0" y="286.0" width="255.0" height="70.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="462.5" y="326.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge Graph</text><rect x="610.0" y="286.0" width="255.0" height="70.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="737.5" y="326.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">LLM</text><rect x="885.0" y="286.0" width="255.0" height="70.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="1012.5" y="316.3" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">A complete</text><text x="1012.5" y="337.4" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">permission system</text><rect x="60.0" y="414.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="447.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">KVM is one specific OKELAS mechanism, not a complete answer to AI control.</text></svg>
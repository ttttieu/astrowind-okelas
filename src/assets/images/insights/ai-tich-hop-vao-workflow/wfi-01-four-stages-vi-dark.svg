<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mô hình bốn giai đoạn xử lý thông tin: thu thập, phân tích, lựa chọn quyết định và thực thi, tương ứng với ghi nhận sự kiện, phân loại, quyết định và hành động; mức tự động hóa có thể khác nhau ở từng giai đoạn." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Bốn giai đoạn xử lý thông tin trong một workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Mức độ tự động hóa hợp lý có thể khác nhau ở từng giai đoạn, không nhất thiết đồng đều.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="811.5" y="124.0" width="328.5" height="22.0" rx="11.0" fill="#1E1636" stroke="#A78BFA" stroke-width="1.2"/><text x="975.7" y="139.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Mô hình Parasuraman, Sheridan và Wickens (2000)</text><rect x="60.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="194.0" r="15" fill="#2B74F5"/><text x="92.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Thu thập thông tin</text><text x="76.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Information acquisition</text><rect x="76.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="86.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống ghi nhận một yêu</text><text x="86.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">cầu hoặc sự kiện</text><line x1="317.0" y1="194.0" x2="327.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,194.0 327.0,197.3 327.0,190.7" fill="#2B74F5"/><rect x="335.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="194.0" r="15" fill="#2B74F5"/><text x="367.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Phân tích thông tin</text><text x="351.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Information analysis</text><rect x="351.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="361.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống hiểu và phân loại</text><text x="361.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">yêu cầu đó</text><line x1="592.0" y1="194.0" x2="602.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,194.0 602.0,197.3 602.0,190.7" fill="#2B74F5"/><rect x="610.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="194.0" r="15" fill="#2B74F5"/><text x="642.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Lựa chọn quyết định</text><text x="626.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Decision and action selection</text><rect x="626.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="636.0" y="349.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Hệ thống hoặc con người</text><text x="636.0" y="368.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">quyết định hành động</text><line x1="867.0" y1="194.0" x2="877.0" y2="194.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,194.0 877.0,197.3 877.0,190.7" fill="#2B74F5"/><rect x="885.0" y="160.0" width="255.0" height="250.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="194.0" r="15" fill="#2B74F5"/><text x="917.0" y="199.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="241.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Thực thi hành động</text><text x="901.0" y="291.7" font-size="13" font-weight="400" fill="#9AA6B8" text-anchor="start">Action implementation</text><rect x="901.0" y="318.0" width="223.0" height="72.0" rx="10" fill="#0E1D38"/><text x="911.0" y="359.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Hành động được thực hiện</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Câu hỏi đúng hơn: AI nên tham gia giai đoạn nào, và ở mức tự động nào?</text></svg>
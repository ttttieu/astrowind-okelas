<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Bốn bước: chia workflow theo bốn giai đoạn, đánh giá khả năng đảo ngược và độ chắc chắn dữ liệu, triển khai từng giai đoạn độc lập, và xem lại định kỳ." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="620" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Bốn bước tích hợp AI vào workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Triển khai từng giai đoạn, kiểm chứng rồi mới mở rộng.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="230.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="#2B74F5"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Chia workflow theo</text><text x="76.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">bốn giai đoạn</text><text x="76.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Xác định đâu là thu thập, phân</text><text x="76.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">tích, quyết định, thực thi, thay vì</text><text x="76.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">coi cả quy trình là một khối.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="#2B74F5"/><rect x="335.0" y="134.0" width="255.0" height="230.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="#2B74F5"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Đánh giá từng giai đoạn</text><text x="351.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Xét khả năng đảo ngược và độ</text><text x="351.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">chắc chắn dữ liệu để chọn mức:</text><text x="351.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Classify, Route, Recommend</text><text x="351.0" y="342.7" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">hoặc Execute.</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="#2B74F5"/><rect x="610.0" y="134.0" width="255.0" height="230.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="642.0" cy="168.0" r="15" fill="#2B74F5"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Triển khai từng giai đoạn</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">độc lập</text><text x="626.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Không làm cả quy trình cùng</text><text x="626.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">lúc; kiểm chứng độ chính xác</text><text x="626.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">trước khi mở rộng.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="#2B74F5" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="#2B74F5"/><rect x="885.0" y="134.0" width="255.0" height="230.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="#2B74F5"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="#F7F8F8" text-anchor="start">Xem lại định kỳ</text><text x="901.0" y="283.0" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Mức phù hợp thay đổi khi</text><text x="901.0" y="302.9" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">dữ liệu tích lũy và độ tin cậy</text><text x="901.0" y="322.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">được kiểm chứng.</text><rect x="60.0" y="380.0" width="1080.0" height="84.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="426.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Ví dụ trong bài: bắt đầu với</text><rect x="380.0" y="402.0" width="170.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="465.0" y="427.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Classify</text><rect x="564.0" y="402.0" width="170.0" height="40.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="649.0" y="427.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Route</text><rect x="748.0" y="402.0" width="330.0" height="40.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="913.0" y="427.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Con người vẫn quyết định</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Mức tự động hóa không cố định một lần: điều chỉnh sau mỗi lần xem lại.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 714" width="1200" height="714" role="img" aria-label="Bảng ranh giới theo bốn giai đoạn: thu thập, phân tích, lựa chọn quyết định, thực thi, với ba cột rule trong workflow, AI hỗ trợ đầu vào và con người; AI không giữ quyền quyết định ở hàng nào, và hành động chỉ tự chạy khi có rule cho phép." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="714" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ranh giới: rule, AI và con người ở từng giai đoạn</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">AI không giữ quyền quyết định ở hàng nào; hành động chỉ tự chạy khi có rule cho phép.</text><line x1="60.0" y1="652.0" x2="1140.0" y2="652.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="674.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Khung định hướng để thảo luận, không phải số liệu đo lường.</text><rect x="240.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--p)"/><text x="391.5" y="155.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">Rule trong workflow</text><rect x="553.0" y="130.0" width="303.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="2"/><text x="704.5" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">AI hỗ trợ đầu vào</text><rect x="866.0" y="130.0" width="274.0" height="40.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="2"/><text x="1003.0" y="155.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Con người</text><text x="64.0" y="155.8" font-size="15" font-weight="700" fill="var(--mut)" text-anchor="start">Giai đoạn</text><circle cx="76.0" cy="226.0" r="13" fill="var(--p)"/><text x="76.0" y="230.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="98.0" y="213.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Thu thập</text><text x="98.0" y="234.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">thông tin</text><rect x="240.0" y="180.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="231.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ghi nhận theo trường và quy tắc đã định</text><rect x="553.0" y="180.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="221.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Trích xuất, diễn giải từ email, biểu mẫu,</text><text x="567.0" y="240.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ảnh chứng từ</text><rect x="866.0" y="180.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="880.0" y="231.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ khi dữ liệu mơ hồ</text><circle cx="76.0" cy="328.0" r="13" fill="var(--p)"/><text x="76.0" y="332.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="98.0" y="315.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Phân tích</text><text x="98.0" y="336.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">thông tin</text><rect x="240.0" y="282.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="333.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Áp tiêu chí và ngưỡng đã viết</text><rect x="553.0" y="282.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="323.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phân loại; tổng hợp evidence</text><text x="567.0" y="342.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">từ ca tương tự</text><rect x="866.0" y="282.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6" stroke-dasharray="6 5"/><text x="880.0" y="333.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Xác nhận khi rủi ro cao</text><circle cx="76.0" cy="430.0" r="13" fill="var(--p)"/><text x="76.0" y="434.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="98.0" y="417.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Lựa chọn</text><text x="98.0" y="438.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định</text><rect x="240.0" y="384.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="425.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chỉ khi tiêu chí rõ và hậu quả sai thấp</text><text x="254.0" y="444.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">(đường mặc định)</text><rect x="553.0" y="384.0" width="303.0" height="92.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.6"/><text x="567.0" y="435.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Chuẩn bị evidence, không quyết định</text><rect x="866.0" y="384.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="425.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phán đoán; xác nhận bắt buộc khi</text><text x="880.0" y="444.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hậu quả sai cao</text><circle cx="76.0" cy="532.0" r="13" fill="var(--p)"/><text x="76.0" y="536.7" font-size="13" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="98.0" y="519.8" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Thực thi</text><text x="98.0" y="540.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">hành động</text><rect x="240.0" y="486.0" width="303.0" height="92.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="254.0" y="527.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thực hiện hành động mà rule đã</text><text x="254.0" y="546.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cho phép</text><rect x="553.0" y="486.0" width="303.0" height="92.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="567.0" y="537.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">Không thực thi</text><rect x="866.0" y="486.0" width="274.0" height="92.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="880.0" y="527.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Thực hiện hoặc phê duyệt</text><text x="880.0" y="546.3" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hành động khó đảo ngược</text><rect x="60.0" y="592.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="625.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không có rule cho phép thì hành động chờ con người.</text></svg>
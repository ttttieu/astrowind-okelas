<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Bốn dạng AI tham gia workflow: phân loại, định tuyến, gợi ý và thực thi, với mức rủi ro tăng dần từ thấp đến cao nhất." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn dạng AI tham gia: từ phân loại đến thực thi</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn dạng không loại trừ nhau: một workflow có thể dùng nhiều dạng ở các bước khác nhau.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="290.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="76.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Classify</text><text x="76.0" y="194.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Phân loại</text><rect x="76.0" y="212.0" width="132.5" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="142.3" y="228.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Phân tích thông tin</text><text x="76.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Gán dữ liệu đầu vào như email,</text><text x="76.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">biểu mẫu, ảnh chứng từ vào</text><text x="76.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">danh mục định sẵn.</text><rect x="76.0" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="133.2" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><rect x="190.5" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><rect x="247.8" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><text x="76.0" y="398.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Rủi ro thấp</text><rect x="335.0" y="134.0" width="255.0" height="290.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="351.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Route</text><text x="351.0" y="194.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Định tuyến</text><rect x="351.0" y="212.0" width="191.0" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="446.5" y="228.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Giữa phân tích và quyết định</text><text x="351.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Xác định yêu cầu nên đi tới</text><text x="351.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người, phòng ban hoặc quy trình</text><text x="351.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">con nào.</text><rect x="351.0" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="408.2" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="465.5" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><rect x="522.8" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><text x="351.0" y="398.8" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Thấp đến trung bình</text><rect x="610.0" y="134.0" width="255.0" height="290.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="626.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Recommend</text><text x="626.0" y="194.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Gợi ý</text><rect x="626.0" y="212.0" width="142.3" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="697.1" y="228.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Lựa chọn quyết định</text><text x="626.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đề xuất hành động dựa trên</text><text x="626.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">dữ liệu và tiền lệ; con người</text><text x="626.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quyết định cuối.</text><rect x="626.0" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="683.2" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="740.5" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="797.8" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--line)"/><text x="626.0" y="398.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Trung bình</text><rect x="885.0" y="134.0" width="255.0" height="290.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><text x="901.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Execute</text><text x="901.0" y="194.8" font-size="14" font-weight="400" fill="var(--mut)" text-anchor="start">Thực thi</text><rect x="901.0" y="212.0" width="136.3" height="24.0" rx="12.0" fill="var(--gt)" stroke="var(--mut)" stroke-width="1.2"/><text x="969.2" y="228.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Thực thi hành động</text><text x="901.0" y="267.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Trực tiếp làm, như gửi thông</text><text x="901.0" y="286.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">báo, tạo đơn, cập nhật hồ sơ,</text><text x="901.0" y="306.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">không cần xác nhận từng ca.</text><rect x="901.0" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="958.2" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="1015.5" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><rect x="1072.8" y="362.0" width="51.2" height="10.0" rx="5" fill="var(--a)"/><text x="901.0" y="398.8" font-size="14" font-weight="700" fill="var(--a)" text-anchor="start">Cao nhất</text><rect x="60.0" y="442.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="475.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Rủi ro tăng dần: hậu quả của Execute xảy ra ngay, trước khi con người kịp can thiệp.</text></svg>
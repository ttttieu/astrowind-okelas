<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="AI làm hai việc trong workflow: diễn giải đầu vào phi cấu trúc để rule chạy được, và chuẩn bị evidence để con người phán đoán; AI không quyết định thay con người, không tự thực hiện hành động, không tự thêm hoặc sửa rule." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="660" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">AI làm hai việc trong workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Cả hai việc đều chuẩn bị đầu vào; không việc nào là ra quyết định.</text><line x1="60.0" y1="598.0" x2="1140.0" y2="598.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="620.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="530.0" height="252.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="96.0" cy="172.0" r="15" fill="#2B74F5"/><text x="96.0" y="177.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="179.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Diễn giải đầu vào phi cấu trúc</text><text x="80.0" y="220.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Đọc email, biểu mẫu, ảnh chứng từ; gán loại yêu cầu, trích số liệu</text><text x="80.0" y="241.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">để rule chạy được.</text><rect x="80.0" y="294.0" width="206.1" height="26.0" rx="13.0" fill="#14161A" stroke="#9AA6B8" stroke-width="1.2"/><text x="183.0" y="311.4" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">Thu thập và phân tích thông tin</text><line x1="92.0" y1="352.0" x2="113.0" y2="352.0" stroke="#2B74F5" stroke-width="2.4"/><polygon points="122.0,352.0 113.0,356.9 113.0,347.1" fill="#2B74F5"/><rect x="130.0" y="330.0" width="440.0" height="44.0" rx="10" fill="#0E1D38"/><text x="142.0" y="357.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Rule quyết định bước tiếp theo</text><rect x="610.0" y="134.0" width="530.0" height="252.0" rx="16" fill="#08090A" stroke="#2B74F5" stroke-width="1.8"/><circle cx="646.0" cy="172.0" r="15" fill="#2B74F5"/><text x="646.0" y="177.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="674.0" y="179.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Chuẩn bị evidence</text><text x="630.0" y="220.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Tìm ca tương tự, tổng hợp điều khoản và dữ liệu liên quan; mỗi ý</text><text x="630.0" y="241.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">chỉ về nguồn kiểm chứng được.</text><rect x="630.0" y="294.0" width="176.3" height="26.0" rx="13.0" fill="#14161A" stroke="#9AA6B8" stroke-width="1.2"/><text x="718.2" y="311.4" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">Trước lựa chọn quyết định</text><line x1="642.0" y1="352.0" x2="663.0" y2="352.0" stroke="#2B74F5" stroke-width="2.4"/><polygon points="672.0,352.0 663.0,356.9 663.0,347.1" fill="#2B74F5"/><rect x="680.0" y="330.0" width="440.0" height="44.0" rx="10" fill="#0E1D38"/><text x="692.0" y="357.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="start">Con người phán đoán, có căn cứ</text><rect x="60.0" y="402.0" width="1080.0" height="112.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="432.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Điều AI không làm</text><rect x="84.0" y="454.0" width="330.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="249.0" y="481.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Không quyết định thay con người</text><rect x="435.0" y="454.0" width="330.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="600.0" y="481.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Không tự thực hiện hành động</text><rect x="786.0" y="454.0" width="330.0" height="44.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="951.0" y="481.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Không tự thêm hoặc sửa rule</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">AI chuẩn bị đầu vào; quyền quyết định ở lại với rule hoặc con người.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Chọn mức hỗ trợ của AI không chỉ dựa trên việc AI có làm được hay không, mà còn cân nhắc tác động dài hạn như ỷ lại vào tự động hóa và suy giảm kỹ năng phán đoán." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="548" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Chọn mức hỗ trợ: không chỉ hỏi AI có làm được không</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Tự động hóa không chỉ thay thế con người: nó thay đổi bản chất công việc của con người.</text><line x1="60.0" y1="486.0" x2="1140.0" y2="486.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="508.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="400.0" height="240.0" rx="16" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="152.0" width="133.4" height="26.0" rx="13.0" fill="#08090A" stroke="#9AA6B8" stroke-width="1.2"/><text x="150.7" y="169.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="middle">Câu hỏi kỹ thuật</text><text x="84.0" y="231.3" font-size="24" font-weight="700" fill="#9AA6B8" text-anchor="start">AI có làm được không?</text><text x="84.0" y="280.3" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Cần thiết, nhưng chưa đủ để quyết định AI</text><text x="84.0" y="302.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">hỗ trợ ở đâu.</text><line x1="468.0" y1="254.0" x2="505.0" y2="254.0" stroke="#A78BFA" stroke-width="3"/><polygon points="516.0,254.0 505.0,260.1 505.0,247.9" fill="#A78BFA"/><rect x="526.0" y="134.0" width="614.0" height="240.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><rect x="550.0" y="152.0" width="152.8" height="26.0" rx="13.0" fill="#08090A" stroke="#A78BFA" stroke-width="1.2"/><text x="626.4" y="169.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Cần cân nhắc thêm</text><text x="550.0" y="221.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Tác động dài hạn tới năng lực phán đoán của đội ngũ</text><rect x="550.0" y="268.0" width="566.0" height="42.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="833.0" y="294.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Ỷ lại vào tự động hóa (automation complacency)</text><rect x="550.0" y="320.0" width="566.0" height="42.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="833.0" y="346.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Suy giảm kỹ năng khi ít thực hành ra quyết định</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Chọn phạm vi hỗ trợ dựa trên cả khả năng kỹ thuật lẫn năng lực phán đoán cần giữ.</text></svg>
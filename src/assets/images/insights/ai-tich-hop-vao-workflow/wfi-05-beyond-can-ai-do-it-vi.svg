<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" role="img" aria-label="Chọn mức tự động hóa không chỉ dựa trên việc AI có làm được hay không, mà còn cân nhắc tác động dài hạn như ỷ lại vào tự động hóa và suy giảm kỹ năng ra quyết định." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="548" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chọn mức tự động hóa: không chỉ hỏi AI có làm được không</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Tự động hóa không chỉ thay thế con người: nó thay đổi bản chất công việc của con người.</text><line x1="60.0" y1="486.0" x2="1140.0" y2="486.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="508.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="400.0" height="240.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="84.0" y="152.0" width="133.4" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.2"/><text x="150.7" y="169.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="middle">Câu hỏi kỹ thuật</text><text x="84.0" y="231.3" font-size="24" font-weight="700" fill="var(--mut)" text-anchor="start">AI có làm được không?</text><text x="84.0" y="280.3" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Cần thiết, nhưng chưa đủ để chọn mức</text><text x="84.0" y="302.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">tự động hóa.</text><line x1="468.0" y1="254.0" x2="505.0" y2="254.0" stroke="var(--a)" stroke-width="3"/><polygon points="516.0,254.0 505.0,260.1 505.0,247.9" fill="var(--a)"/><rect x="526.0" y="134.0" width="614.0" height="240.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><rect x="550.0" y="152.0" width="152.8" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="626.4" y="169.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Cần cân nhắc thêm</text><text x="550.0" y="221.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Tác động dài hạn tới năng lực ra quyết định của đội ngũ</text><rect x="550.0" y="268.0" width="566.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="833.0" y="294.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ỷ lại vào tự động hóa (automation complacency)</text><rect x="550.0" y="320.0" width="566.0" height="42.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="833.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Suy giảm kỹ năng khi ít thực hành ra quyết định</text><rect x="60.0" y="392.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="425.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chọn mức tự động hóa dựa trên cả khả năng kỹ thuật lẫn năng lực con người cần giữ.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Hai tiêu chí chọn mức tự động hóa: mức đảo ngược của hành động và độ chắc chắn của dữ liệu đầu vào; hành động dễ đảo ngược và dữ liệu rõ ràng chấp nhận tự động hóa cao hơn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Hai tiêu chí để quyết định mức tự động hóa</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Không có đáp án chung cho mọi workflow; hai tiêu chí giúp chọn mức phù hợp cho từng giai đoạn.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm; các ví dụ là minh họa trong bài, không phải số liệu đo lường.</text><rect x="1031.0" y="124.0" width="109.0" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1085.5" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Ví dụ minh họa</text><text x="60.0" y="149.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Hành động có đảo ngược được không</text><rect x="60.0" y="168.0" width="530.0" height="134.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="80.0" y="198.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Dễ đảo ngược</text><text x="80.0" y="227.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Gửi nhắc nhở, tạo bản nháp chưa gửi</text><text x="80.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Chấp nhận tự động hóa cao hơn</text><rect x="60.0" y="314.0" width="530.0" height="134.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="80.0" y="344.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Khó hoặc không thể đảo ngược</text><text x="80.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Gửi tiền, xác nhận hợp đồng, từ chối yêu cầu của khách</text><text x="80.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Giữ ở Recommend hoặc thấp hơn</text><text x="610.0" y="149.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu đầu vào chắc chắn đến đâu</text><rect x="610.0" y="168.0" width="530.0" height="134.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="630.0" y="198.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Có cấu trúc, ít mơ hồ</text><text x="630.0" y="227.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một con số vượt ngưỡng đã định</text><text x="630.0" y="280.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">AI tự tin hơn ở phân tích và quyết định</text><rect x="610.0" y="314.0" width="530.0" height="134.0" rx="14" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="630.0" y="344.9" font-size="16" font-weight="700" fill="var(--mut)" text-anchor="start">Phi cấu trúc, mơ hồ</text><text x="630.0" y="373.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Email khiếu nại viết cảm tính</text><text x="630.0" y="426.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Giữ tự động hóa thấp ở phân tích; con người ở quyết định</text><rect x="60.0" y="464.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="497.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mức tự động hóa tăng theo khả năng đảo ngược của hành động và độ chắc chắn của dữ liệu.</text></svg>
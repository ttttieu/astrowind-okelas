<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mô hình bốn giai đoạn xử lý thông tin: thu thập, phân tích, lựa chọn quyết định và thực thi, tương ứng với ghi nhận sự kiện, phân loại, quyết định và hành động; mức tự động hóa có thể khác nhau ở từng giai đoạn." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn giai đoạn xử lý thông tin trong một workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mức độ tự động hóa hợp lý có thể khác nhau ở từng giai đoạn, không nhất thiết đồng đều.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="811.5" y="124.0" width="328.5" height="22.0" rx="11.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="975.7" y="139.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Mô hình Parasuraman, Sheridan và Wickens (2000)</text><rect x="60.0" y="160.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="194.0" r="15" fill="var(--p)"/><text x="92.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Thu thập thông tin</text><text x="76.0" y="291.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Information acquisition</text><rect x="76.0" y="318.0" width="223.0" height="72.0" rx="10" fill="var(--pt)"/><text x="86.0" y="349.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống ghi nhận một yêu</text><text x="86.0" y="368.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">cầu hoặc sự kiện</text><line x1="317.0" y1="194.0" x2="327.0" y2="194.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,194.0 327.0,197.3 327.0,190.7" fill="var(--p)"/><rect x="335.0" y="160.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="194.0" r="15" fill="var(--p)"/><text x="367.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Phân tích thông tin</text><text x="351.0" y="291.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Information analysis</text><rect x="351.0" y="318.0" width="223.0" height="72.0" rx="10" fill="var(--pt)"/><text x="361.0" y="349.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống hiểu và phân loại</text><text x="361.0" y="368.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">yêu cầu đó</text><line x1="592.0" y1="194.0" x2="602.0" y2="194.0" stroke="var(--p)" stroke-width="2"/><polygon points="608.0,194.0 602.0,197.3 602.0,190.7" fill="var(--p)"/><rect x="610.0" y="160.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="642.0" cy="194.0" r="15" fill="var(--p)"/><text x="642.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Lựa chọn quyết định</text><text x="626.0" y="291.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Decision and action selection</text><rect x="626.0" y="318.0" width="223.0" height="72.0" rx="10" fill="var(--pt)"/><text x="636.0" y="349.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Hệ thống hoặc con người</text><text x="636.0" y="368.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định hành động</text><line x1="867.0" y1="194.0" x2="877.0" y2="194.0" stroke="var(--p)" stroke-width="2"/><polygon points="883.0,194.0 877.0,197.3 877.0,190.7" fill="var(--p)"/><rect x="885.0" y="160.0" width="255.0" height="250.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="194.0" r="15" fill="var(--p)"/><text x="917.0" y="199.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="241.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Thực thi hành động</text><text x="901.0" y="291.7" font-size="13" font-weight="400" fill="var(--mut)" text-anchor="start">Action implementation</text><rect x="901.0" y="318.0" width="223.0" height="72.0" rx="10" fill="var(--pt)"/><text x="911.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="start">Hành động được thực hiện</text><rect x="60.0" y="428.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="461.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Câu hỏi đúng hơn: AI nên tham gia giai đoạn nào, và ở mức tự động nào?</text></svg>
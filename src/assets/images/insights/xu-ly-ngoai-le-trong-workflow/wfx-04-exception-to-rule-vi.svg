<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Bốn bước từ ngoại lệ đến rule: ghi nhận ngoại lệ, nhận diện mẫu hình, con người duyệt và ban hành, rule mới vào workflow; số ngoại lệ tăng bất thường là tín hiệu để chủ sở hữu rule rà soát." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Từ ngoại lệ đến rule: người có thẩm quyền ban hành</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phạm vi rule mở rộng nhờ tiền lệ được xác nhận, không nhờ giao thêm quyền cho hệ thống.</text><line x1="60.0" y1="578.0" x2="1140.0" y2="578.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="600.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="255.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="168.0" r="15" fill="var(--p)"/><text x="92.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi nhận ngoại lệ</text><text x="76.0" y="273.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi ca ngoài rule: ghi quyết định</text><text x="76.0" y="292.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và lý do như evidence.</text><line x1="317.0" y1="168.0" x2="327.0" y2="168.0" stroke="var(--p)" stroke-width="2"/><polygon points="333.0,168.0 327.0,171.3 327.0,164.7" fill="var(--p)"/><rect x="335.0" y="134.0" width="255.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="367.0" cy="168.0" r="15" fill="var(--p)"/><text x="367.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="351.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nhận diện mẫu hình</text><text x="351.0" y="273.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Cùng loại ca lặp lại với xử lý</text><text x="351.0" y="292.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhất quán: đề xuất "có thể</text><text x="351.0" y="312.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thành rule".</text><line x1="592.0" y1="168.0" x2="602.0" y2="168.0" stroke="var(--a)" stroke-width="2"/><polygon points="608.0,168.0 602.0,171.3 602.0,164.7" fill="var(--a)"/><rect x="610.0" y="134.0" width="255.0" height="236.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="642.0" cy="168.0" r="15" fill="var(--a)"/><text x="642.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="626.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Con người duyệt</text><text x="626.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">và ban hành</text><text x="626.0" y="273.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đề xuất không tự thành rule;</text><text x="626.0" y="292.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người có thẩm quyền xem xét</text><text x="626.0" y="312.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">và ban hành.</text><line x1="867.0" y1="168.0" x2="877.0" y2="168.0" stroke="var(--a)" stroke-width="2"/><polygon points="883.0,168.0 877.0,171.3 877.0,164.7" fill="var(--a)"/><rect x="885.0" y="134.0" width="255.0" height="236.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="917.0" cy="168.0" r="15" fill="var(--p)"/><text x="917.0" y="173.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="901.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Rule mới vào workflow</text><text x="901.0" y="273.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ca cùng loại do rule xử lý;</text><text x="901.0" y="292.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">phạm vi phán đoán thu hẹp.</text><rect x="60.0" y="386.0" width="1080.0" height="84.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="84.0" y="432.9" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tín hiệu để chủ sở hữu rule rà soát</text><rect x="430.0" y="408.0" width="340.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="600.0" y="433.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Ngoại lệ một loại tăng bất thường</text><rect x="790.0" y="408.0" width="340.0" height="40.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="960.0" y="433.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Rule cũ lệch khỏi thực tế</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Không ghi ngoại lệ thì không có dữ liệu để biết rule nào cần sửa.</text></svg>
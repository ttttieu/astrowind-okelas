<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Ba cách thường gặp xử lý ngoại lệ: xử lý tắt qua Zalo, email hoặc điện thoại khiến quyết định không có evidence; cho qua khiến tiêu chuẩn lệch dần; đẩy hết lên trên khiến người có thẩm quyền thành nút thắt." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="590" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba cách xử lý ngoại lệ và cái giá</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Quyết định vẫn được đưa ra, nhưng tổ chức không học được gì từ nó.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Phân tích của OKELAS dựa trên mô hình vận hành thường gặp, không phải số liệu khảo sát.</text><rect x="60.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Xử lý tắt</text><text x="84.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Biểu hiện</text><text x="84.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Hỏi qua Zalo, email, điện thoại; người có</text><text x="84.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">thẩm quyền trả lời miệng hoặc nhắn tin.</text><line x1="84.0" y1="330.0" x2="382.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="84.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cái giá</text><text x="84.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định không để lại evidence</text><text x="84.0" y="404.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">truy vết được</text><rect x="427.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="451.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Cho qua</text><text x="451.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Biểu hiện</text><text x="451.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Người làm tự quyết để việc không bị</text><text x="451.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">dừng, không báo ai.</text><line x1="451.0" y1="330.0" x2="749.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="451.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cái giá</text><text x="451.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Tiêu chuẩn lệch dần giữa các ca và</text><text x="451.0" y="404.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">giữa các người</text><rect x="794.0" y="134.0" width="346.0" height="296.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="818.0" y="176.1" font-size="21" font-weight="700" fill="#F7F8F8" text-anchor="start">Đẩy hết lên trên</text><text x="818.0" y="212.6" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="start">Biểu hiện</text><text x="818.0" y="238.1" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Mọi ca không khớp rule đều chuyển lên</text><text x="818.0" y="259.4" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">cấp cao nhất.</text><line x1="818.0" y1="330.0" x2="1116.0" y2="330.0" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="4 4"/><text x="818.0" y="356.6" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="start">Cái giá</text><text x="818.0" y="382.9" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Người có thẩm quyền thành nút thắt</text><rect x="60.0" y="448.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="481.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Cả ba giống nhau ở một điểm: lần sau, người xử lý lại bắt đầu từ đầu.</text></svg>
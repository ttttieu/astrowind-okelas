<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Bảy mục cần ghi khi xử lý một ngoại lệ: tình huống, điểm không khớp, evidence đã xem, quyết định, người quyết định, lý do và khả năng đảo ngược." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="650" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bộ ghi tối thiểu khi xử lý một ngoại lệ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Đủ để người khác, sáu tháng sau, hiểu điều đã xảy ra.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="160.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Tình huống</text><rect x="350.0" y="132.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="160.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ca này là gì, xảy ra khi nào</text><rect x="60.0" y="186.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="214.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Điểm không khớp</text><rect x="350.0" y="186.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="214.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Rule hoặc tiêu chí nào không áp dụng được, và vì sao</text><rect x="60.0" y="240.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="268.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence đã xem</text><rect x="350.0" y="240.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="268.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quyết định căn cứ vào dữ liệu và ca tương tự nào</text><rect x="60.0" y="294.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="322.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Quyết định</text><rect x="350.0" y="294.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="322.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Đã chọn làm gì</text><rect x="60.0" y="348.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="376.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Người quyết định</text><rect x="350.0" y="348.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="376.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ai có thẩm quyền, tại thời điểm nào</text><rect x="60.0" y="402.0" width="280.0" height="46.0" rx="12" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="76.0" y="430.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Lý do</text><rect x="350.0" y="402.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="430.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Vì sao chọn như vậy thay vì phương án khác</text><rect x="60.0" y="456.0" width="280.0" height="46.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="76.0" y="484.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Khả năng đảo ngược</text><rect x="350.0" y="456.0" width="790.0" height="46.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.2"/><text x="368.0" y="484.5" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Quyết định này sửa lại được không, nếu sai</text><rect x="60.0" y="514.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="547.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần màu tím là phần chỉ con người xác nhận được: quyết định, người quyết định, lý do.</text></svg>
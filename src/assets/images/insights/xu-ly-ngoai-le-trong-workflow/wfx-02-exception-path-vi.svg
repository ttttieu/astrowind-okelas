<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Đường ngoại lệ gồm năm việc: nhận diện, chuyển đúng người có thẩm quyền, chuẩn bị evidence, con người quyết định và ghi lý do, rồi tích lũy thành tiền lệ; AI hỗ trợ bước nhận diện và chuẩn bị evidence." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Một đường ngoại lệ được thiết kế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Năm việc, trong đó bước quyết định luôn thuộc về con người.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="166.0" r="15" fill="var(--p)"/><text x="90.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Nhận diện</text><text x="76.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Ca không khớp</text><text x="76.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">rule: vượt ngưỡng,</text><text x="76.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ngoài tiền lệ hoặc</text><text x="76.0" y="334.7" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">thiếu thông tin.</text><line x1="262.0" y1="166.0" x2="272.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="278.0,166.0 272.0,169.3 272.0,162.7" fill="var(--p)"/><rect x="280.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="310.0" cy="166.0" r="15" fill="var(--p)"/><text x="310.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="296.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chuyển đúng người</text><text x="296.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Mỗi loại ngoại lệ có</text><text x="296.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người quyết định và</text><text x="296.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người thay thế khi vắng.</text><line x1="482.0" y1="166.0" x2="492.0" y2="166.0" stroke="var(--p)" stroke-width="2"/><polygon points="498.0,166.0 492.0,169.3 492.0,162.7" fill="var(--p)"/><rect x="500.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="530.0" cy="166.0" r="15" fill="var(--p)"/><text x="530.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="516.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Chuẩn bị evidence</text><text x="516.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Khác rule ở đâu, dữ liệu</text><text x="516.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">liên quan, ca tương tự và</text><text x="516.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">kết quả.</text><line x1="702.0" y1="166.0" x2="712.0" y2="166.0" stroke="var(--a)" stroke-width="2"/><polygon points="718.0,166.0 712.0,169.3 712.0,162.7" fill="var(--a)"/><rect x="720.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><circle cx="750.0" cy="166.0" r="15" fill="var(--a)"/><text x="750.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="736.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Con người</text><text x="736.0" y="237.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">quyết định</text><text x="736.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Quyết định, lý do và</text><text x="736.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">người quyết định được</text><text x="736.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ghi lại.</text><rect x="736.0" y="356.0" width="114.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="793.0" y="372.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Cổng con người</text><line x1="922.0" y1="166.0" x2="932.0" y2="166.0" stroke="var(--a)" stroke-width="2"/><polygon points="938.0,166.0 932.0,169.3 932.0,162.7" fill="var(--a)"/><rect x="940.0" y="134.0" width="200.0" height="262.0" rx="16" fill="var(--bg)" stroke="var(--p)" stroke-width="1.8"/><circle cx="970.0" cy="166.0" r="15" fill="var(--p)"/><text x="970.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="956.0" y="213.9" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Thành tiền lệ</text><text x="956.0" y="275.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lưu như evidence để</text><text x="956.0" y="294.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">ca tương tự sau có</text><text x="956.0" y="314.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">chỗ dựa.</text><rect x="60.0" y="412.0" width="1080.0" height="56.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="600.0" y="445.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">AI hỗ trợ bước 1 (diễn giải đầu vào) và bước 3 (chuẩn bị evidence)</text><rect x="60.0" y="484.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="517.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Đường ngoại lệ giảm công sức cho người quyết định, không thay thế họ.</text></svg>
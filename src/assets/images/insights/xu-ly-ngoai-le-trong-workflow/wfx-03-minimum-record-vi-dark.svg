<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="Bảy mục cần ghi khi xử lý một ngoại lệ: tình huống, điểm không khớp, evidence đã xem, quyết định, người quyết định, lý do và khả năng đảo ngược." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="650" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Bộ ghi tối thiểu khi xử lý một ngoại lệ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Đủ để người khác, sáu tháng sau, hiểu điều đã xảy ra.</text><line x1="60.0" y1="588.0" x2="1140.0" y2="588.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="610.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="132.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="160.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Tình huống</text><rect x="350.0" y="132.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="160.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Ca này là gì, xảy ra khi nào</text><rect x="60.0" y="186.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="214.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Điểm không khớp</text><rect x="350.0" y="186.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="214.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Rule hoặc tiêu chí nào không áp dụng được, và vì sao</text><rect x="60.0" y="240.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="268.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Evidence đã xem</text><rect x="350.0" y="240.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="268.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Quyết định căn cứ vào dữ liệu và ca tương tự nào</text><rect x="60.0" y="294.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="322.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Quyết định</text><rect x="350.0" y="294.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="322.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Đã chọn làm gì</text><rect x="60.0" y="348.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="376.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Người quyết định</text><rect x="350.0" y="348.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="376.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Ai có thẩm quyền, tại thời điểm nào</text><rect x="60.0" y="402.0" width="280.0" height="46.0" rx="12" fill="#1E1636" stroke="#A78BFA" stroke-width="1.6"/><text x="76.0" y="430.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Lý do</text><rect x="350.0" y="402.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="430.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Vì sao chọn như vậy thay vì phương án khác</text><rect x="60.0" y="456.0" width="280.0" height="46.0" rx="12" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.6"/><text x="76.0" y="484.8" font-size="16" font-weight="700" fill="#F7F8F8" text-anchor="start">Khả năng đảo ngược</text><rect x="350.0" y="456.0" width="790.0" height="46.0" rx="12" fill="#14161A" stroke="#5B6575" stroke-width="1.2"/><text x="368.0" y="484.5" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Quyết định này sửa lại được không, nếu sai</text><rect x="60.0" y="514.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="547.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Phần màu tím là phần chỉ con người xác nhận được: quyết định, người quyết định, lý do.</text></svg>
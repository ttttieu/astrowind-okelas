<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Early warning signs of an ERP project in trouble, in three project stages: preparation, implementation and after go-live, four signs each." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Early warning signs across three project stages</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Use as a checklist while a project is preparing, running or already live.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Signs compiled from the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="234.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Preparation stage</text><line x1="410.0" y1="156.0" x2="416.0" y2="156.0" stroke="var(--gm)" stroke-width="2"/><polygon points="424.0,156.0 416.0,160.4 416.0,151.6" fill="var(--gm)"/><rect x="60.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="219.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">No process documentation detailed enough for the</text><text x="234.0" y="236.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">implementation partner</text><rect x="60.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Requirements meetings end with “let’s revisit this” or</text><text x="234.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">“it depends”</text><rect x="60.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="359.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">No single accountable owner for each</text><text x="234.0" y="376.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">module’s requirements</text><rect x="60.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="234.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Master data not yet cleaned and standardized</text><rect x="426.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="600.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Implementation stage</text><line x1="776.0" y1="156.0" x2="782.0" y2="156.0" stroke="var(--gm)" stroke-width="2"/><polygon points="790.0,156.0 782.0,160.4 782.0,151.6" fill="var(--gm)"/><rect x="426.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="219.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">The customization list keeps growing and no one</text><text x="600.0" y="236.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">controls it</text><rect x="426.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Gap analysis finds mismatches but no decisions on</text><text x="600.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">resolving them</text><rect x="426.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="367.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">End users trained too late or left out of testing</text><rect x="426.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="600.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">No plan for handling legacy data after go-live</text><rect x="792.0" y="134.0" width="348.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="966.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">After go-live</text><rect x="792.0" y="192.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="227.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Many processes still run in parallel outside ERP</text><rect x="792.0" y="262.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="289.2" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">ERP reports do not reconcile with the numbers</text><text x="966.0" y="306.3" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">management decides on</text><rect x="792.0" y="332.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="367.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">No clearly designated internal ERP owner</text><rect x="792.0" y="402.0" width="348.0" height="62.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.6"/><text x="966.0" y="437.7" font-size="13" font-weight="400" fill="var(--tx)" text-anchor="middle">Every issue goes back to the implementation partner</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A useful question at each stage: which of these signs have already appeared in our project?</text></svg>
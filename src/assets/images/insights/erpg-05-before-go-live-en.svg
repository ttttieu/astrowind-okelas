<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Three things to define before go-live: the ERP System Owner, the Master Data Manager and the change request process." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Governance starts before go-live</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">At minimum, define these three things before go-live.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Analysis from the article, not statistics.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="350.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="92.0" cy="166.0" r="15" fill="var(--p)"/><text x="92.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="76.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">ERP System Owner</text><text x="76.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A person with ultimate responsibility for the</text><text x="76.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">system from day one.</text><rect x="425.0" y="134.0" width="350.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="457.0" cy="166.0" r="15" fill="var(--p)"/><text x="457.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="441.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Master Data Manager</text><text x="441.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">One named person accountable for</text><text x="441.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">foundational data quality.</text><rect x="790.0" y="134.0" width="350.0" height="157.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="822.0" cy="166.0" r="15" fill="var(--p)"/><text x="822.0" y="171.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="806.0" y="215.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Change request process</text><text x="806.0" y="245.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">A defined path for change requests</text><text x="806.0" y="265.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">after go-live.</text><rect x="60.0" y="307.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="340.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Ad hoc decisions in the first weeks are costly to undo.</text></svg>
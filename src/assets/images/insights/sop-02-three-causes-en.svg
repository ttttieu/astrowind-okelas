<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-label="Three reasons SOPs are not followed: the SOP describes ideal conditions, the SOP does not live in the workflow, and there is no sufficient reason to follow it when no one is watching, each with a recognition sign." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="676" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Three reasons SOPs are not followed</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Each reason has its own recognition sign.</text><line x1="60.0" y1="592.0" x2="1140.0" y2="592.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="614.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">The three reasons are a practical framework developed by OKELAS from direct observation, not a formally standardized academic classification; a discussion aid, not a certified</text><text x="60.0" y="630.7" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">methodology. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="655.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="15" fill="var(--p)"/><text x="96.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="122.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The SOP describes ideal</text><text x="122.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">conditions, not reality</text><rect x="82.0" y="234.0" width="145.9" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="154.9" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">The technical reason</text><text x="82.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="82.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOPs are written as best-case scenarios,</text><text x="82.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">but operators spend most of their time</text><text x="82.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">handling what doesn’t go to plan.</text><line x1="82.0" y1="392.0" x2="386.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="82.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">How to recognize it</text><text x="82.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Experienced employees work differently</text><text x="82.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">from the SOP, and have specific,</text><text x="82.0" y="482.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">coherent reasons.</text><rect x="426.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="462.0" cy="170.0" r="15" fill="var(--p)"/><text x="462.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="488.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">The SOP exists in a system but</text><text x="488.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">not in the workflow</text><rect x="448.0" y="234.0" width="145.1" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="520.6" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">The systemic reason</text><text x="448.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="448.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">SOPs sit in a folder, DMS or intranet as</text><text x="448.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">reference documents, not at the right time</text><text x="448.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">and place.</text><line x1="448.0" y1="392.0" x2="752.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="448.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">How to recognize it</text><text x="448.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">In an audit, the person executing doesn’t</text><text x="448.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">know the current version, or works</text><text x="448.0" y="482.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">differently without knowing it.</text><rect x="792.0" y="134.0" width="348.0" height="372.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="828.0" cy="170.0" r="15" fill="var(--p)"/><text x="828.0" y="175.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="169.1" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">No sufficient reason to follow</text><text x="854.0" y="190.8" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">it when no one is watching</text><rect x="814.0" y="234.0" width="154.5" height="24.0" rx="12.0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.2"/><text x="891.2" y="250.4" font-size="12" font-weight="700" fill="var(--p)" text-anchor="middle">The motivation reason</text><text x="814.0" y="287.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">What it is</text><text x="814.0" y="311.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Following an SOP costs extra time and</text><text x="814.0" y="330.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">effort. With no visible consequence and no</text><text x="814.0" y="350.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">checking, the reason isn’t compelling.</text><line x1="814.0" y1="392.0" x2="1118.0" y2="392.0" stroke="var(--line)" stroke-width="1"/><text x="814.0" y="419.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">How to recognize it</text><text x="814.0" y="443.0" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Compliance spikes before audits then drops,</text><text x="814.0" y="462.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">or is high on checked steps and low on</text><text x="814.0" y="482.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">unchecked ones.</text><rect x="60.0" y="522.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="555.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">All three are system design problems, not a moral failing of employees.</text></svg>
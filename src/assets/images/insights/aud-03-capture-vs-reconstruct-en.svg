<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Two flows: when evidence is captured during operations, only consolidation is needed before the audit; when it is not, records must be reconstructed." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Evidence captured in operations, or rebuilt later</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The same work, but when evidence is recorded decides whether preparation is consolidation or collection.</text><line x1="60.0" y1="516.0" x2="1140.0" y2="516.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="538.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data. Analysis from a management perspective, not compliance or legal advice.</text><text x="60.0" y="579.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="1080.0" height="140.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="171.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Captured during operations</text><rect x="84.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="239.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Work is performed</text><line x1="398.0" y1="226.0" x2="432.0" y2="226.0" stroke="var(--s)" stroke-width="2"/><polygon points="440.0,226.0 432.0,230.4 432.0,221.6" fill="var(--s)"/><rect x="444.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="599.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Evidence is captured immediately</text><line x1="758.0" y1="226.0" x2="792.0" y2="226.0" stroke="var(--s)" stroke-width="2"/><polygon points="800.0,226.0 792.0,230.4 792.0,221.6" fill="var(--s)"/><rect x="804.0" y="196.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="959.0" y="231.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Before the audit: consolidate</text><rect x="60.0" y="290.0" width="1080.0" height="140.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="327.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Gathered afterwards</text><rect x="84.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="239.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Work is performed</text><line x1="398.0" y1="382.0" x2="432.0" y2="382.0" stroke="var(--a)" stroke-width="2"/><polygon points="440.0,382.0 432.0,386.4 432.0,377.6" fill="var(--a)"/><rect x="444.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="599.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Evidence isn’t captured</text><line x1="758.0" y1="382.0" x2="792.0" y2="382.0" stroke="var(--a)" stroke-width="2"/><polygon points="800.0,382.0 792.0,386.4 792.0,377.6" fill="var(--a)"/><rect x="804.0" y="352.0" width="310.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="959.0" y="387.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Before the audit: reconstruct records</text><rect x="60.0" y="446.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="479.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Reconstructing evidence is the most time-consuming and riskiest part of audit preparation.</text></svg>
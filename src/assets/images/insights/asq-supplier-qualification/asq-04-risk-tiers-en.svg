<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Three risk-tier cards in a row, with a strip of five criteria below." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Group suppliers by risk, then set criteria per group</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Controls follow potential impact; the article suggests three risk tiers.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Three risk tiers and five criteria per the article; the article sets no fixed thresholds.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="82.0" y="219.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Critical</text><text x="82.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Directly affects product quality</text><text x="82.0" y="274.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">or safety.</text><rect x="430.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="219.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Standard</text><text x="452.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Limited impact; controlled on a cycle.</text><rect x="800.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="219.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Low risk</text><text x="822.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Little impact; minimal</text><text x="822.0" y="274.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">control, recorded.</text><rect x="60.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="160.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Technical capability</text><rect x="280.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="380.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Quality system</text><rect x="500.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Track record</text><rect x="720.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="820.0" y="363.6" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Regulatory</text><text x="820.0" y="383.4" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">requirements</text><rect x="940.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="1040.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Supply continuity</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Control scales with impact; not every supplier needs the same level.</text></svg>
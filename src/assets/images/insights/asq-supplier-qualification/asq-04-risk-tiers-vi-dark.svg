<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-label="Ba thẻ nhóm rủi ro xếp hàng ngang, bên dưới là một dãy năm tiêu chí đánh giá." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="624" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Phân nhóm nhà cung cấp theo rủi ro, tiêu chí theo nhóm</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Kiểm soát tương xứng với tác động tiềm ẩn; bài viết gợi ý ba nhóm rủi ro.</text><line x1="60.0" y1="540.0" x2="1140.0" y2="540.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="562.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba nhóm rủi ro và năm tiêu chí theo bài viết; bài không đưa ngưỡng cố định.</text><text x="60.0" y="603.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="82.0" y="219.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">Quan trọng</text><text x="82.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ảnh hưởng trực tiếp đến chất lượng</text><text x="82.0" y="274.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc an toàn sản phẩm.</text><rect x="430.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="219.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Tiêu chuẩn</text><text x="452.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ảnh hưởng có giới hạn; kiểm soát</text><text x="452.0" y="274.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">theo chu kỳ.</text><rect x="800.0" y="160.0" width="340.0" height="150.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="219.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Rủi ro thấp</text><text x="822.0" y="252.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Ít ảnh hưởng; kiểm soát tối thiểu và</text><text x="822.0" y="274.2" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">có ghi nhận.</text><rect x="60.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="160.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Năng lực kỹ thuật</text><rect x="280.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="380.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Hệ thống chất lượng</text><rect x="500.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Lịch sử thực hiện</text><rect x="720.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="820.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Yêu cầu pháp lý</text><rect x="940.0" y="340.0" width="200.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="1040.0" y="373.5" font-size="15" font-weight="700" fill="var(--tx)" text-anchor="middle">Tính liên tục cung ứng</text><rect x="60.0" y="470.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="503.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Kiểm soát tương xứng với tác động: không phải nhà cung cấp nào cũng cần cùng mức.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Ba thẻ câu hỏi của auditor xếp hàng ngang, bên dưới là một thanh kết luận." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="540" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Danh sách nhà cung cấp được duyệt cần có căn cứ</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Auditor hỏi vì sao nhà cung cấp được duyệt, đánh giá lại khi nào và hiệu suất ra sao.</text><line x1="60.0" y1="456.0" x2="1140.0" y2="456.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="478.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Câu hỏi của auditor theo bài viết; kết luận về danh sách là diễn giải của OKELAS.</text><text x="60.0" y="519.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><circle cx="94.0" cy="196.0" r="15" fill="var(--p)"/><text x="94.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="82.0" y="251.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Vì sao được duyệt?</text><text x="82.0" y="296.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Căn cứ nào đã dùng khi phê duyệt.</text><rect x="430.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="464.0" cy="196.0" r="15" fill="var(--gm)"/><text x="464.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="452.0" y="251.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Đánh giá lại khi nào?</text><text x="452.0" y="296.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Lần gần nhất và chu kỳ đang áp dụng.</text><rect x="800.0" y="160.0" width="340.0" height="170.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="834.0" cy="196.0" r="15" fill="var(--gm)"/><text x="834.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="822.0" y="251.3" font-size="19" font-weight="700" fill="var(--hd)" text-anchor="start">Hiệu suất ra sao?</text><text x="822.0" y="296.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Dữ liệu giao hàng, lỗi và khiếu nại.</text><rect x="60.0" y="380.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="413.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Danh sách cho biết ai được duyệt, không cho biết vì sao.</text></svg>
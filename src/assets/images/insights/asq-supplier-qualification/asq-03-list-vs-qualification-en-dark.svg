<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Two comparison columns: approved list with three rows on the left, qualification with three rows on the right." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">The list is the result; qualification is the process</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The comparison: the list records an outcome; qualification records how it was reached.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Two-column comparison per the article; placing them side by side is OKELAS’s presentation.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="187.3" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">Approved supplier list</text><text x="612.0" y="187.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="start">Qualification</text><rect x="60.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Records who was approved</text><rect x="612.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="236.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Criteria set by risk level</text><rect x="60.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="308.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">No record of the approval basis</text><rect x="612.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="308.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Performance tracked with data</text><rect x="60.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="380.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Rarely updated</text><rect x="612.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="380.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Re-evaluated on a cycle and by event</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">The list is the result; qualification is the work that produces it.</text></svg>
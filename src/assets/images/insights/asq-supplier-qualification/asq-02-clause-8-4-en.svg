<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Three clause cards, 8.4.1, 8.4.2 and 8.4.3, in a row, with a note box below about certificates." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="640" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">ISO 9001 clause 8.4 asks for a continuing process</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Clause 8.4 covers selecting, monitoring and re-evaluating suppliers, with evidence.</text><line x1="60.0" y1="556.0" x2="1140.0" y2="556.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="578.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Clauses 8.4.1–8.4.3 per the article, paraphrased; the diagram is OKELAS’s presentation.</text><text x="60.0" y="619.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="82.0" y="217.0" font-size="22" font-weight="700" fill="var(--a)" text-anchor="start">8.4.1</text><text x="82.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Evaluate, select, monitor and</text><text x="82.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">re-evaluate providers; keep</text><text x="82.0" y="299.8" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">documented information.</text><rect x="430.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="452.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">8.4.2</text><text x="452.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Control type and extent proportionate</text><text x="452.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">to potential impact.</text><rect x="800.0" y="160.0" width="340.0" height="190.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="822.0" y="217.0" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">8.4.3</text><text x="822.0" y="255.0" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Communicate requirements clearly</text><text x="822.0" y="277.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">to providers.</text><rect x="60.0" y="376.0" width="1080.0" height="56.0" rx="12" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="410.2" font-size="17" font-weight="700" fill="var(--tx)" text-anchor="middle">Certificates are supporting evidence, not a substitute for assessing fit.</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Selection is one step; clause 8.4 covers the whole lifecycle.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="Hai cột đối chiếu: danh sách được duyệt với ba dòng bên trái, qualification với ba dòng bên phải." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#FFFFFF;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#0B1220;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Danh sách là kết quả; qualification mới là quy trình</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bảng so sánh: danh sách ghi kết quả, qualification ghi cách đi đến kết quả.</text><line x1="60.0" y1="520.0" x2="1140.0" y2="520.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="542.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Hai cột đối chiếu theo bài viết; cách đặt cạnh nhau là của OKELAS.</text><text x="60.0" y="583.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><text x="60.0" y="187.3" font-size="20" font-weight="700" fill="var(--s)" text-anchor="start">Danh sách được duyệt</text><text x="612.0" y="187.3" font-size="20" font-weight="700" fill="var(--a)" text-anchor="start">Qualification</text><rect x="60.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="236.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Ghi ai đã được duyệt</text><rect x="612.0" y="200.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="236.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Tiêu chí theo mức rủi ro</text><rect x="60.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="308.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Không ghi căn cứ duyệt</text><rect x="612.0" y="272.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="308.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Theo dõi hiệu suất có dữ liệu</text><rect x="60.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.3"/><text x="324.0" y="380.2" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="middle">Hiếm khi được cập nhật</text><rect x="612.0" y="344.0" width="528.0" height="60.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.4"/><text x="876.0" y="380.2" font-size="17" font-weight="700" fill="var(--a)" text-anchor="middle">Đánh giá lại theo chu kỳ và sự kiện</text><rect x="60.0" y="450.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="483.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Danh sách là kết quả; qualification là quá trình tạo ra kết quả đó.</text></svg>
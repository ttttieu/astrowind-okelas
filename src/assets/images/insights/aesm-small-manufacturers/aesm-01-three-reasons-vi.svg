<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 594" width="1200" height="594" role="img" aria-label="Ba thẻ lý do xếp hàng ngang, mỗi thẻ có một dòng giải thích." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="594" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba lý do khiến eQMS trông nặng hơn thực tế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Quy mô sản phẩm, demo và cách bán gói đều góp phần làm eQMS trông phức tạp.</text><line x1="60.0" y1="510.0" x2="1140.0" y2="510.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="532.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Ba lý do theo bài viết; ISO 9001:2015 không quy định danh sách module phần mềm.</text><text x="60.0" y="573.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="340.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="94.0" cy="196.0" r="15" fill="var(--p)"/><text x="94.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="84.0" y="250.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sản phẩm nhắm tới doanh</text><text x="84.0" y="275.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">nghiệp lớn hoặc ngành được</text><text x="84.0" y="299.3" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">quản lý chặt</text><text x="84.0" y="331.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Dược phẩm và thiết bị y tế là ví dụ được</text><text x="84.0" y="351.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bài viết nêu.</text><rect x="428.0" y="160.0" width="340.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="462.0" cy="196.0" r="15" fill="var(--gm)"/><text x="462.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="452.0" y="250.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Demo cho thấy toàn bộ bộ</text><text x="452.0" y="275.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">tính năng</text><text x="452.0" y="331.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Người xem dễ kết luận sản phẩm không</text><text x="452.0" y="351.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">dành cho mình.</text><rect x="796.0" y="160.0" width="340.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="830.0" cy="196.0" r="15" fill="var(--gm)"/><text x="830.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="820.0" y="250.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Nhà cung cấp bán gói tính</text><text x="820.0" y="275.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">năng ghép</text><text x="820.0" y="331.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Phần phức tạp thường là lựa chọn của</text><text x="820.0" y="351.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">nhà cung cấp, không phải yêu cầu.</text><rect x="60.0" y="440.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="473.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần phức tạp thường đến từ lựa chọn sản phẩm, không từ ISO.</text></svg>
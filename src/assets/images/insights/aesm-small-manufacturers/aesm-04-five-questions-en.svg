<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 694" width="1200" height="694" role="img" aria-label="Five question cards: four in a grid and one wide card at the bottom." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="694" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Five questions to answer before the next demo</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article’s five-question self-check; answer it before reviewing more demos.</text><line x1="60.0" y1="610.0" x2="1140.0" y2="610.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="632.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Five questions per the article, paraphrased by OKELAS; this is a self-check, not a set of criteria.</text><text x="60.0" y="673.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="528.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="94.0" cy="196.0" r="15" fill="var(--gm)"/><text x="94.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="126.0" y="199.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">What is the biggest pain point?</text><rect x="612.0" y="160.0" width="528.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="646.0" cy="196.0" r="15" fill="var(--gm)"/><text x="646.0" y="201.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="678.0" y="199.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Which component addresses it?</text><rect x="60.0" y="290.0" width="528.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="94.0" cy="326.0" r="15" fill="var(--gm)"/><text x="94.0" y="331.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="126.0" y="329.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">How many users, and where do they work?</text><rect x="612.0" y="290.0" width="528.0" height="110.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><circle cx="646.0" cy="326.0" r="15" fill="var(--gm)"/><text x="646.0" y="331.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="678.0" y="329.7" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Which features are needed now, which are nice</text><text x="678.0" y="352.6" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">to have?</text><rect x="60.0" y="420.0" width="1080.0" height="80.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="94.0" cy="460.0" r="15" fill="var(--p)"/><text x="94.0" y="465.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="130.0" y="457.7" font-size="17" font-weight="700" fill="var(--a)" text-anchor="start">Do customer or sector rules on electronic records apply?</text><rect x="60.0" y="540.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="573.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Answer the five questions before the next demo.</text></svg>
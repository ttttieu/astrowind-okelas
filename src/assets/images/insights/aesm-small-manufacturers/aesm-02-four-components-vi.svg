<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Bốn ô thành phần ở trên, một khung nét đứt bên dưới ghi các chức năng thêm sau." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn thành phần khởi đầu, không phải yêu cầu bắt buộc</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn thành phần này là điểm xuất phát phổ biến; các chức năng khác có thể thêm sau.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn thành phần theo bài viết; rủi ro, nhà cung cấp và báo cáo quản lý được xếp là bổ sung sau.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="255.0" height="130.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><text x="187.5" y="231.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">Kiểm soát tài liệu</text><rect x="335.0" y="160.0" width="255.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="462.5" y="219.7" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Không phù hợp và hành</text><text x="462.5" y="243.4" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">động khắc phục</text><rect x="610.0" y="160.0" width="255.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="737.5" y="231.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Đánh giá nội bộ</text><rect x="885.0" y="160.0" width="255.0" height="130.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="1012.5" y="231.6" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="middle">Đào tạo và năng lực</text><rect x="60.0" y="330.0" width="1080.0" height="70.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.2"/><text x="600.0" y="371.2" font-size="17" font-weight="400" fill="var(--tx)" text-anchor="middle">Sau này mới thêm: quản lý rủi ro, đánh giá nhà cung cấp, báo cáo quản lý</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Bắt đầu bằng bốn thành phần, rồi mở rộng khi cần.</text></svg>
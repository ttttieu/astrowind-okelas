<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 614" width="1200" height="614" role="img" aria-label="Five numbered cards from 1 to 5 in a row, each a starting step." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="614" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Start small: pilot one component in one area</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Five steps per the article, from the most specific pain point to minimal customization.</text><line x1="60.0" y1="530.0" x2="1140.0" y2="530.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="552.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Steps per the article; arranging them as five cards is OKELAS’s presentation.</text><text x="60.0" y="593.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="196.0" height="230.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="94.0" cy="204.0" r="15" fill="var(--p)"/><text x="94.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="80.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Start from the most</text><text x="80.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">painful problem</text><rect x="281.0" y="170.0" width="196.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="315.0" cy="204.0" r="15" fill="var(--gm)"/><text x="315.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="301.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Pilot one</text><text x="301.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">component in</text><text x="301.0" y="299.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">one area</text><rect x="502.0" y="170.0" width="196.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="536.0" cy="204.0" r="15" fill="var(--gm)"/><text x="536.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="522.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Clarify processes</text><text x="522.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">before configuring</text><rect x="723.0" y="170.0" width="196.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="757.0" cy="204.0" r="15" fill="var(--gm)"/><text x="757.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="743.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Let floor users test</text><text x="743.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">the system</text><rect x="944.0" y="170.0" width="196.0" height="230.0" rx="14" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><circle cx="978.0" cy="204.0" r="15" fill="var(--gm)"/><text x="978.0" y="209.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="964.0" y="256.6" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">Limit early</text><text x="964.0" y="278.2" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="start">customization</text><rect x="60.0" y="460.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="493.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A small pilot shows the real problem before scaling up.</text></svg>
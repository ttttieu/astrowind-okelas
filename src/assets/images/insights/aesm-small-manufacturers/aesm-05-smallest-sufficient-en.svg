<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Three nested frames: the largest is the full feature set, the smallest is the smallest sufficient system." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Keep only the features that solve a named problem</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The article’s principle: solve operational problems with the smallest system that is sufficient.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Principle per the article; the nested layers are OKELAS’s illustration.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="160.0" width="1080.0" height="250.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.4"/><text x="88.0" y="206.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">The product’s full feature set</text><rect x="200.0" y="230.0" width="800.0" height="160.0" rx="14" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.4"/><text x="228.0" y="274.8" font-size="16" font-weight="700" fill="var(--s)" text-anchor="start">Features that solve a named problem</text><rect x="360.0" y="300.0" width="480.0" height="70.0" rx="12" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="341.6" font-size="18" font-weight="700" fill="var(--a)" text-anchor="middle">The smallest system that is sufficient</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">A feature earns its place only when it solves a specific problem.</text></svg>
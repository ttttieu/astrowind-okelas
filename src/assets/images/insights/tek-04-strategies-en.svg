<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 622" width="1200" height="622" role="img" aria-label="Strategy for explicit knowledge is a controlled document system; strategy for tacit knowledge is mentoring, case studies and debriefs, knowledge interviews before people leave, and reducing single-person dependency." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="622" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Appropriate strategies for each type of knowledge</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The goal is not to document everything.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Strategies are practical applications from the article; a discussion aid, not a certified methodology.</text><text x="60.0" y="601.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="318.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">For explicit knowledge</text><text x="84.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Well organized, easy to find, consistently updated</text><rect x="84.0" y="218.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Document system with version control</text><rect x="84.0" y="274.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Clear approval process</text><rect x="84.0" y="330.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Updating when reality changes</text><rect x="84.0" y="386.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="415.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Accessible at the point of execution</text><rect x="612.0" y="134.0" width="528.0" height="318.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">For tacit knowledge</text><text x="636.0" y="198.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Reduce loss risk, speed up transfer</text><rect x="636.0" y="218.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="247.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Structured mentoring and shadowing</text><rect x="636.0" y="274.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Case studies and post-incident debriefs</text><rect x="636.0" y="330.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="359.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Knowledge interviews before key people leave</text><rect x="636.0" y="386.0" width="480.0" height="48.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="876.0" y="415.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Reduce single-person dependencies</text><rect x="60.0" y="468.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="501.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Manage each type of knowledge in a way that fits its nature, not by documenting everything.</text></svg>
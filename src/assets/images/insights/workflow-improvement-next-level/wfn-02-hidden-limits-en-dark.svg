<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="Three hidden limits: workflows start only when someone creates a request, handle cases one at a time without spotting patterns, and leave decision-makers to assemble information themselves." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="590" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Three hidden limits of an already good workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">They cause no obvious failures, but quietly cap speed.</text><line x1="60.0" y1="528.0" x2="1140.0" y2="528.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="550.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="350.0" height="314.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="#A78BFA"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Manual initiation</text><text x="80.0" y="231.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Today</text><rect x="80.0" y="240.0" width="310.0" height="62.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="235.0" y="276.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Starts when someone creates a request</text><text x="80.0" y="335.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Still missing</text><rect x="80.0" y="344.0" width="310.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="235.0" y="380.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Detecting real-world events to</text><text x="235.0" y="399.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">respond early</text><rect x="425.0" y="134.0" width="350.0" height="314.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Isolated case handling</text><text x="445.0" y="231.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Today</text><rect x="445.0" y="240.0" width="310.0" height="62.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="600.0" y="276.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Handles each request efficiently</text><text x="445.0" y="335.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Still missing</text><rect x="445.0" y="344.0" width="310.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600.0" y="380.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Spotting recurring patterns across cases,</text><text x="600.0" y="399.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">signs of emerging trends</text><rect x="790.0" y="134.0" width="350.0" height="314.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="#A78BFA"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Information assembly</text><text x="810.0" y="231.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Today</text><rect x="810.0" y="240.0" width="310.0" height="62.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="965.0" y="276.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Decision-makers understand context</text><text x="810.0" y="335.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Still missing</text><rect x="810.0" y="344.0" width="310.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5 4"/><text x="965.0" y="380.9" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Information prepared in advance,</text><text x="965.0" y="399.3" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">not self-compiled</text><rect x="60.0" y="466.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="499.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">All three sit beyond what a workflow optimized the usual way can reach.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Two next directions: event-driven activation instead of waiting for people to notice, and pre-prepared context that turns decisions from investigation into confirmation." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Two directions for the next layer of speed</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">The two directions the article describes for the next layer of speed.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="530.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Event-driven activation</text><text x="84.0" y="209.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Today</text><rect x="84.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="152.0" y="248.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Someone notices</text><text x="152.0" y="265.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">a problem</text><line x1="222.0" y1="252.0" x2="244.0" y2="252.0" stroke="var(--gm)" stroke-width="2"/><polygon points="252.0,252.0 244.0,256.4 244.0,247.6" fill="var(--gm)"/><rect x="254.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="322.0" y="248.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">They create</text><text x="322.0" y="265.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">a request</text><line x1="392.0" y1="252.0" x2="414.0" y2="252.0" stroke="var(--gm)" stroke-width="2"/><polygon points="422.0,252.0 414.0,256.4 414.0,247.6" fill="var(--gm)"/><rect x="424.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="492.0" y="256.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Workflow starts</text><text x="84.0" y="323.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Next direction</text><rect x="84.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="152.0" y="369.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">A significant</text><text x="152.0" y="386.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">event occurs</text><line x1="222.0" y1="373.0" x2="244.0" y2="373.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="252.0,373.0 244.0,377.4 244.0,368.6" fill="var(--a)"/><rect x="254.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="322.0" y="369.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">The system</text><text x="322.0" y="386.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">recognizes it</text><line x1="392.0" y1="373.0" x2="414.0" y2="373.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="422.0,373.0 414.0,377.4 414.0,368.6" fill="var(--a)"/><rect x="424.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="492.0" y="369.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">The process</text><text x="492.0" y="386.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">starts itself</text><rect x="610.0" y="134.0" width="530.0" height="322.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><text x="634.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Pre-prepared context</text><text x="634.0" y="209.7" font-size="13" font-weight="700" fill="var(--mut)" text-anchor="start">Today</text><rect x="634.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="702.0" y="239.6" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision-maker</text><text x="702.0" y="256.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">gathers</text><text x="702.0" y="273.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">information</text><line x1="772.0" y1="252.0" x2="794.0" y2="252.0" stroke="var(--gm)" stroke-width="2"/><polygon points="802.0,252.0 794.0,256.4 794.0,247.6" fill="var(--gm)"/><rect x="804.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="872.0" y="248.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Compiles history,</text><text x="872.0" y="265.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">similar cases</text><line x1="942.0" y1="252.0" x2="964.0" y2="252.0" stroke="var(--gm)" stroke-width="2"/><polygon points="972.0,252.0 964.0,256.4 964.0,247.6" fill="var(--gm)"/><rect x="974.0" y="218.0" width="136.0" height="68.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5"/><text x="1042.0" y="256.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Then decides</text><text x="634.0" y="323.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="start">Next direction</text><rect x="634.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="702.0" y="360.6" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">System assembles</text><text x="702.0" y="377.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">history, similar</text><text x="702.0" y="394.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">cases</text><line x1="772.0" y1="373.0" x2="794.0" y2="373.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="802.0,373.0 794.0,377.4 794.0,368.6" fill="var(--a)"/><rect x="804.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="872.0" y="360.6" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Decision-maker</text><text x="872.0" y="377.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">reviews a</text><text x="872.0" y="394.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">summary</text><line x1="942.0" y1="373.0" x2="964.0" y2="373.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="972.0,373.0 964.0,377.4 964.0,368.6" fill="var(--a)"/><rect x="974.0" y="332.0" width="136.0" height="82.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="1042.0" y="377.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="middle">Confirms</text><rect x="60.0" y="474.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="507.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">From investigation to confirmation; from waiting to be noticed to responding early.</text></svg>
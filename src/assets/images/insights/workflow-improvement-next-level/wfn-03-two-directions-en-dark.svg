<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Two next directions: event-driven activation instead of waiting for people to notice, and pre-prepared context that turns decisions from investigation into confirmation." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Two directions for the next layer of speed</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">The two directions the article describes for the next layer of speed.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="530.0" height="322.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Event-driven activation</text><text x="84.0" y="209.7" font-size="13" font-weight="700" fill="#9AA6B8" text-anchor="start">Today</text><rect x="84.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="152.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Someone notices</text><text x="152.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">a problem</text><line x1="222.0" y1="252.0" x2="244.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="252.0,252.0 244.0,256.4 244.0,247.6" fill="#5B6575"/><rect x="254.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="322.0" y="248.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">They create</text><text x="322.0" y="265.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">a request</text><line x1="392.0" y1="252.0" x2="414.0" y2="252.0" stroke="#5B6575" stroke-width="2"/><polygon points="422.0,252.0 414.0,256.4 414.0,247.6" fill="#5B6575"/><rect x="424.0" y="218.0" width="136.0" height="68.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5"/><text x="492.0" y="256.7" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">Workflow starts</text><text x="84.0" y="323.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start">Next direction</text><rect x="84.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="152.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">A significant</text><text x="152.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">event occurs</text><line x1="222.0" y1="373.0" x2="244.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="252.0,373.0 244.0,377.4 244.0,368.6" fill="#A78BFA"/><rect x="254.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="322.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">The system</text><text x="322.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">recognizes it</text><line x1="392.0" y1="373.0" x2="414.0" y2="373.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="422.0,373.0 414.0,377.4 414.0,368.6" fill="#A78BFA"/><rect x="424.0" y="332.0" width="136.0" height="82.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="492.0" y="369.2" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">The process</text><text x="492.0" y="386.3" font-size="13" font-weight="700" fill="#F7F8F8" text-anchor="middle">starts itself</text><rect x="610.0" y="134.0" width="530.0" height="322.0" rx
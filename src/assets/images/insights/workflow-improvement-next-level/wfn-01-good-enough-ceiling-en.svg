<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 604" width="1200" height="604" role="img" aria-label="A good workflow has sensible approvals, enough context, clear exception paths and trackable progress, but that is only the current limit of technology and design, not an absolute ceiling." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="604" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Good enough today is not a fixed ceiling</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Most small and mid-sized manufacturers have not reached this level; but it is only the current ceiling.</text><line x1="60.0" y1="542.0" x2="1140.0" y2="542.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="564.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Conceptual diagram based on the article, not measured data.</text><rect x="60.0" y="134.0" width="520.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="175.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">A good workflow has</text><rect x="84.0" y="204.0" width="472.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="112.0" cy="230.0" r="13" fill="var(--p)"/><line x1="106.0" y1="230.0" x2="110.5" y2="235.0" stroke="var(--wh)" stroke-width="2.8"/><line x1="110.5" y1="235.0" x2="118.5" y2="225.0" stroke="var(--wh)" stroke-width="2.8"/><text x="134.0" y="235.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Sensible approvals, no redundancy</text><rect x="84.0" y="266.0" width="472.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="112.0" cy="292.0" r="13" fill="var(--p)"/><line x1="106.0" y1="292.0" x2="110.5" y2="297.0" stroke="var(--wh)" stroke-width="2.8"/><line x1="110.5" y1="297.0" x2="118.5" y2="287.0" stroke="var(--wh)" stroke-width="2.8"/><text x="134.0" y="297.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Enough context for handlers</text><rect x="84.0" y="328.0" width="472.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="112.0" cy="354.0" r="13" fill="var(--p)"/><line x1="106.0" y1="354.0" x2="110.5" y2="359.0" stroke="var(--wh)" stroke-width="2.8"/><line x1="110.5" y1="359.0" x2="118.5" y2="349.0" stroke="var(--wh)" stroke-width="2.8"/><text x="134.0" y="359.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Clear exception paths</text><rect x="84.0" y="390.0" width="472.0" height="52.0" rx="12" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><circle cx="112.0" cy="416.0" r="13" fill="var(--p)"/><line x1="106.0" y1="416.0" x2="110.5" y2="421.0" stroke="var(--wh)" stroke-width="2.8"/><line x1="110.5" y1="421.0" x2="118.5" y2="411.0" stroke="var(--wh)" stroke-width="2.8"/><text x="134.0" y="421.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Trackable progress without asking directly</text><rect x="620.0" y="134.0" width="520.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="644.0" y="175.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">But “good enough” has limits</text><rect x="668.0" y="204.0" width="424.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="880.0" y="231.5" font-size="15" font-weight="700" fill="var(--a)" text-anchor="middle">Room to go higher</text><line x1="720.0" y1="304.0" x2="720.0" y2="265.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="720.0,256.0 725.0,265.0 715.0,265.0" fill="var(--a)"/><line x1="880.0" y1="304.0" x2="880.0" y2="265.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="880.0,256.0 885.0,265.0 875.0,265.0" fill="var(--a)"/><line x1="1040.0" y1="304.0" x2="1040.0" y2="265.0" stroke="var(--a)" stroke-width="2.5"/><polygon points="1040.0,256.0 1045.0,265.0 1035.0,265.0" fill="var(--a)"/><line x1="644.0" y1="314.0" x2="1116.0" y2="314.0" stroke="var(--mut)" stroke-width="4"/><text x="644.0" y="338.8" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="start">The limit of current technology and design</text><rect x="668.0" y="366.0" width="424.0" height="64.0" rx="10" fill="var(--p)"/><text x="880.0" y="403.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">An optimized workflow today</text><rect x="60.0" y="482.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="515.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Good enough by today’s standards is not a fixed ceiling.</text></svg>
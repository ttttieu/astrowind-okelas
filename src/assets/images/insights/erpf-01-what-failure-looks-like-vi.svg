<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Dự án ERP “xong” có phần nhìn thấy (cài phần mềm, nhân viên đăng nhập, dữ liệu được nhập) và phần bị che khuất (việc thật vẫn chạy bằng Excel và email, dữ liệu không được tin, customization tăng, vận hành chưa đổi); nếu chưa đổi cách vận hành thì vẫn là thất bại về kinh doanh." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="634" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Dự án “xong” chưa có nghĩa là ERP thành công</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Phần lớn dự án ERP không kết thúc bằng một tuyên bố thất bại chính thức.</text><line x1="60.0" y1="550.0" x2="1140.0" y2="550.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="572.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường. Phân tích từ góc độ quản trị, không phải tư vấn tuân thủ hay pháp lý.</text><text x="60.0" y="613.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="84.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Phần nhìn thấy</text><text x="84.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Phần mềm đã triển khai, hệ thống đang chạy</text><rect x="84.0" y="238.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="274.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Phần mềm đã được cài đặt</text><rect x="84.0" y="310.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="346.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhân viên vẫn đăng nhập</text><rect x="84.0" y="382.0" width="480.0" height="62.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="324.0" y="418.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu vẫn được nhập vào</text><rect x="612.0" y="134.0" width="528.0" height="330.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="636.0" y="179.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Phần bị che khuất</text><text x="636.0" y="206.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Kết quả thực tế khác xa kỳ vọng ban đầu</text><rect x="636.0" y="238.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="265.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Nghiệp vụ thực tế vẫn chạy bằng Excel, email, thủ công song song</text><rect x="636.0" y="292.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="309.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Dữ liệu trong ERP không được tin, báo cáo không dùng</text><text x="876.0" y="328.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">để ra quyết định</text><rect x="636.0" y="346.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="373.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Customization tăng dần, hệ thống ngày càng khó bảo trì</text><rect x="636.0" y="400.0" width="480.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="876.0" y="427.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Doanh nghiệp chưa thực sự đổi cách vận hành</text><rect x="60.0" y="480.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="513.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Phần mềm chạy chưa phải mục tiêu: chưa đổi cách vận hành thì vẫn là thất bại về mặt kinh doanh.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-label="Bắt đầu từ ba câu hỏi về thực thể, quan hệ và thông tin quan trọng, ghi lại trong một spreadsheet có cấu trúc, sẽ có giá trị sớm: người mới hiểu nhanh, audit dễ hơn, AI có nền tảng." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="592" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bắt đầu nhỏ: từ ba câu hỏi và một spreadsheet</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Knowledge graph không nhất thiết là dự án công nghệ lớn ngay từ đầu.</text><line x1="60.0" y1="508.0" x2="1140.0" y2="508.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="530.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><text x="60.0" y="571.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="340.0" height="288.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><text x="84.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Ba câu hỏi để bắt đầu</text><rect x="84.0" y="196.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="230.0" y="221.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Doanh nghiệp có những thực thể</text><text x="230.0" y="240.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">chính nào?</text><rect x="84.0" y="268.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="230.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chúng liên quan đến nhau như thế nào?</text><rect x="84.0" y="340.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="230.0" y="365.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Thông tin nào quan trọng về</text><text x="230.0" y="384.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">mỗi thực thể?</text><rect x="430.0" y="134.0" width="340.0" height="288.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="454.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Ghi lại có cấu trúc</text><rect x="510.0" y="204.0" width="60.0" height="30.0" rx="0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="570.0" y="204.0" width="60.0" height="30.0" rx="0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="630.0" y="204.0" width="60.0" height="30.0" rx="0" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><rect x="510.0" y="234.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><rect x="570.0" y="234.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><rect x="630.0" y="234.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><rect x="510.0" y="264.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><rect x="570.0" y="264.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><rect x="630.0" y="264.0" width="60.0" height="30.0" rx="0" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="454.0" y="336.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">Ngay cả một spreadsheet có cấu trúc</text><text x="454.0" y="357.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">đã là bước đầu tiên theo hướng</text><text x="454.0" y="378.0" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="start">knowledge graph.</text><rect x="800.0" y="134.0" width="340.0" height="288.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8" stroke-dasharray="6 5"/><text x="824.0" y="173.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Giá trị đến sớm</text><rect x="824.0" y="196.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="970.0" y="231.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Người mới hiểu nhanh hơn</text><rect x="824.0" y="268.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="970.0" y="303.1" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Chuẩn bị audit dễ hơn</text><rect x="824.0" y="340.0" width="292.0" height="60.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="970.0" y="365.9" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">Khi tích hợp AI, đã có nền tảng để</text><text x="970.0" y="384.3" font-size="14" font-weight="700" fill="var(--hd)" text-anchor="middle">hoạt động</text><line x1="404.0" y1="278.0" x2="418.0" y2="278.0" stroke="var(--mut)" stroke-width="2"/><polygon points="426.0,278.0 418.0,282.4 418.0,273.6" fill="var(--mut)"/><line x1="774.0" y1="278.0" x2="788.0" y2="278.0" stroke="var(--mut)" stroke-width="2"/><polygon points="796.0,278.0 788.0,282.4 788.0,273.6" fill="var(--mut)"/><rect x="60.0" y="438.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="471.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Nguyên tắc là tổ chức tri thức theo quan hệ, không theo folder.</text></svg>
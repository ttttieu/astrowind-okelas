<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Chuỗi bốn bước: tiếp nhận, hiểu và trích xuất, liên kết và phân tích, thực hiện và tạo đầu ra; con người kiểm tra, phê duyệt và chịu trách nhiệm." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Workspace tiếp nhận tri thức: bốn bước</text><g transform="translate(0 109.5)"><rect x="60" y="0" width="237" height="184" rx="16" class="bb"/><text x="82" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 1</text><text x="82" y="70" font-size="22" font-weight="600" class="tx">Tiếp nhận</text><text x="82" y="102" font-size="17" font-weight="400" class="mut">Tài liệu và dữ liệu vào</text><text x="82" y="126" font-size="17" font-weight="400" class="mut">một nơi.</text><rect x="341" y="0" width="237" height="184" rx="16" class="bb"/><text x="363" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 2</text><text x="363" y="70" font-size="22" font-weight="600" class="tx">Hiểu và trích xuất</text><text x="363" y="102" font-size="17" font-weight="400" class="mut">Nắm nội dung, ngữ</text><text x="363" y="126" font-size="17" font-weight="400" class="mut">cảnh, thông tin chính.</text><rect x="622" y="0" width="237" height="184" rx="16" class="bb"/><text x="644" y="35" font-size="13" font-weight="600" class="mut">BƯỚC 3</text><text x="644" y="70" font-size="22" font-weight="600" class="tx">Liên kết và</text><text x="644" y="99" font-size="22" font-weight="600" class="tx">phân tích</text><text x="644" y="131" font-size="17" font-weight="400" class="mut">Đối chiếu với tri thức và</text><text x="644" y="155" font-size="17" font-weight="400" class="mut">dữ liệu khác.</text><rect x="903" y="0" width="237" height="184" rx="16" class="bp"/><text x="925" y="35" font-size="13" font-weight="600" class="tp">BƯỚC 4</text><text x="925" y="70" font-size="22" font-weight="600" class="tp">Thực hiện và tạo</text><text x="925" y="99" font-size="22" font-weight="600" class="tp">đầu ra</text><text x="925" y="131" font-size="17" font-weight="400" class="mut">Dùng kết quả cho công</text><text x="925" y="155" font-size="17" font-weight="400" class="mut">việc, tạo tài liệu khi cần.</text><line x1="303" y1="92" x2="323" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M321 83 l14 9 l-14 9z" class="arf"/><line x1="584" y1="92" x2="604" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M602 83 l14 9 l-14 9z" class="arf"/><line x1="865" y1="92" x2="885" y2="92" class="ar" stroke-width="3" stroke-dasharray="6 6"/><path d="M883 83 l14 9 l-14 9z" class="arf"/><rect x="60" y="212" width="1080" height="73" rx="16" class="bi"/><text x="82" y="256" font-size="22" font-weight="600" class="ti">Con người kiểm tra, phê duyệt và chịu trách nhiệm.</text></g><text x="60" y="428.5" font-size="13" font-weight="400" class="mut">Công cụ thảo luận định hướng do OKELAS đề xuất, không phải phương pháp luận được chứng nhận.</text></svg>

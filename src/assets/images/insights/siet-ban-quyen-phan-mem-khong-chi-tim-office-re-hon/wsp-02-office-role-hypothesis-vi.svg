<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Ba thẻ: Word từ viết sang xem và hiệu chỉnh, Excel từ nhập liệu sang kiểm tra và phân tích, PowerPoint từ thiết kế từng slide sang hoàn thiện; đây là giả thuyết của OKELAS." font-family="Inter, 'Inter Variable', system-ui, sans-serif"><style>.bgr{fill:#fff}.hd{fill:#08090a}.tx{fill:#1f2937}.mut{fill:#5b6472}.tp{fill:#6d28d9}.ti{fill:#fff}.dot{fill:#0161ef}.bb{fill:#eef4ff;stroke:#0161ef;stroke-width:2}.bp{fill:#f3ecff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:8 6}.bg{fill:#f1f4f9;stroke:#c9d6ee;stroke-width:2}.bi{fill:#08090a}.chip{fill:#f3ecff;stroke:#6d28d9;stroke-width:1.5}.ar{stroke:#6d28d9}.arf{fill:#6d28d9}@media (prefers-color-scheme:dark){.bgr{fill:#08090a}.hd{fill:#f7f8f8}.tx{fill:#e5ecf6}.mut{fill:#9aa6b8}.tp{fill:#a78bfa}.ti{fill:#08090a}.dot{fill:#6ea8ff}.bb{fill:#0c1d3f;stroke:#3b82f6}.bp{fill:#1b1433;stroke:#a78bfa}.bg{fill:#14171c;stroke:#2d343d}.bi{fill:#f7f8f8}.chip{fill:#1b1433;stroke:#a78bfa}.ar{stroke:#a78bfa}.arf{fill:#a78bfa}}</style><rect width="1200" height="480" class="bgr"/><text x="60" y="74" font-size="32" font-weight="700" class="hd">Word, Excel, PowerPoint: một giả thuyết về vai trò mới</text><g transform="translate(0 139.8)"><rect x="60" y="0" width="349.3333333333333" height="184" rx="16" class="bp"/><text x="82" y="35" font-size="13" font-weight="600" class="tp">WORD</text><text x="82" y="70" font-size="22" font-weight="600" class="tp">Từ viết sang xem và hiệu</text><text x="82" y="99" font-size="22" font-weight="600" class="tp">chỉnh</text><text x="82" y="131" font-size="17" font-weight="400" class="mut">Tài liệu do AI soạn, con người sửa và</text><text x="82" y="155" font-size="17" font-weight="400" class="mut">duyệt.</text><rect x="425.3333333333333" y="0" width="349.3333333333333" height="184" rx="16" class="bp"/><text x="447.3333333333333" y="35" font-size="13" font-weight="600" class="tp">EXCEL</text><text x="447.3333333333333" y="70" font-size="22" font-weight="600" class="tp">Từ nhập liệu sang kiểm tra</text><text x="447.3333333333333" y="99" font-size="22" font-weight="600" class="tp">và phân tích</text><text x="447.3333333333333" y="131" font-size="17" font-weight="400" class="mut">AI dựng bảng và công thức, con</text><text x="447.3333333333333" y="155" font-size="17" font-weight="400" class="mut">người kiểm tra kết quả.</text><rect x="790.6666666666666" y="0" width="349.3333333333333" height="184" rx="16" class="bp"/><text x="812.6666666666666" y="35" font-size="13" font-weight="600" class="tp">POWERPOINT</text><text x="812.6666666666666" y="70" font-size="22" font-weight="600" class="tp">Từ thiết kế từng slide sang</text><text x="812.6666666666666" y="99" font-size="22" font-weight="600" class="tp">hoàn thiện</text><text x="812.6666666666666" y="131" font-size="17" font-weight="400" class="mut">AI tạo bản trình bày, con người chỉnh</text><text x="812.6666666666666" y="155" font-size="17" font-weight="400" class="mut">và chốt.</text></g><text x="60" y="357.8" font-size="13" font-weight="400" class="mut">Hình dung của OKELAS cho 1 đến 3 năm tới, chưa được chứng minh.</text></svg>

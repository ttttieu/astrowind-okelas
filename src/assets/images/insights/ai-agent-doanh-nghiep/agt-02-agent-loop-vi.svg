<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Năm ô nối tiếp từ mục tiêu đến báo cáo kèm bằng chứng; mũi tên vòng từ đánh giá kết quả quay lại bước truy vấn khi chưa đủ." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="574" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Agent vận hành theo vòng lặp có kiểm tra kết quả</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ví dụ kiểm tra lô B2024-09: agent truy vấn, đối chiếu và báo rõ bước thiếu thông tin.</text><line x1="60.0" y1="490.0" x2="1140.0" y2="490.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="512.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Lô B2024-09 là tình huống minh họa tổng hợp, không phải dữ liệu thực tế.</text><text x="60.0" y="553.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="150.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Mục tiêu</text><line x1="244.0" y1="255.0" x2="273.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="281.0,255.0 273.0,259.4 273.0,250.6" fill="var(--p)"/><rect x="285.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="375.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Lập kế hoạch</text><line x1="469.0" y1="255.0" x2="498.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="506.0,255.0 498.0,259.4 498.0,250.6" fill="var(--p)"/><rect x="510.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="600.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Gọi công cụ, truy vấn</text><line x1="694.0" y1="255.0" x2="723.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="731.0,255.0 723.0,259.4 723.0,250.6" fill="var(--p)"/><rect x="735.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="825.0" y="260.5" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Đánh giá kết quả</text><line x1="919.0" y1="255.0" x2="948.0" y2="255.0" stroke="var(--p)" stroke-width="2"/><polygon points="956.0,255.0 948.0,259.4 948.0,250.6" fill="var(--p)"/><rect x="960.0" y="200.0" width="180.0" height="110.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><text x="1050.0" y="250.6" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">Báo cáo kèm</text><text x="1050.0" y="270.4" font-size="15" font-weight="700" fill="var(--hd)" text-anchor="middle">bằng chứng</text><line x1="825.0" y1="312.0" x2="825.0" y2="350.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><line x1="825.0" y1="350.0" x2="600.0" y2="350.0" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/><line x1="600.0" y1="350.0" x2="600.0" y2="322.0" stroke="var(--a)" stroke-width="2"/><polygon points="600.0,314.0 604.4,322.0 595.6,322.0" fill="var(--a)"/><text x="712.5" y="388.1" font-size="14" font-weight="700" fill="var(--mut)" text-anchor="middle">Chưa đủ: quay lại truy vấn hoặc nêu bước thiếu</text><rect x="60.0" y="420.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="453.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Agent có thể sai, và lỗi có thể nhân qua nhiều bước; bước đánh giá kết quả là bắt buộc.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-label="Bốn thẻ: kiểm tra chuẩn bị audit, kiểm tra đầu vào, theo dõi compliance task, hỗ trợ phê duyệt; thẻ phê duyệt ghi rõ agent không tự phê duyệt." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="584" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn việc vận hành agent có thể hỗ trợ trong nhà máy</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Mỗi ứng dụng là người tham gia có nhiệm vụ, quyền hạn giới hạn và có người giám sát.</text><line x1="60.0" y1="500.0" x2="1140.0" y2="500.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="522.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn ứng dụng là ví dụ minh họa theo bài viết, không phải kết quả triển khai đã đo lường.</text><text x="60.0" y="563.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="534.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="162.0" r="15" fill="var(--p)"/><text x="90.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hỗ trợ chuẩn bị audit</text><text x="84.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Rà soát hồ sơ trong kỳ, tìm hồ sơ thiếu hoặc chưa được phê duyệt.</text><text x="84.0" y="227.1" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Kết quả: Danh sách gap theo ưu tiên</text><rect x="606.0" y="134.0" width="534.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="162.0" r="15" fill="var(--gm)"/><text x="636.0" y="167.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="662.0" y="170.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Kiểm tra đầu vào</text><text x="630.0" y="199.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Đối chiếu nhà cung cấp với danh sách approved, kiểm tra trường COA,</text><text x="630.0" y="219.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">xác nhận lô hàng thuộc kế hoạch sản xuất.</text><text x="630.0" y="246.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Kết quả: Checklist, hoặc gắn cờ cho người phụ trách</text><rect x="60.0" y="280.0" width="534.0" height="134.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="308.0" r="15" fill="var(--p)"/><text x="90.0" y="313.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="116.0" y="316.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Theo dõi compliance task</text><text x="84.0" y="345.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Theo dõi kiểm tra thiết bị, gia hạn chứng nhận, đào tạo; nhắc hạn và</text><text x="84.0" y="365.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">cảnh báo task quá hạn.</text><text x="84.0" y="392.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Kết quả: Nhắc việc và cảnh báo đúng người</text><rect x="606.0" y="280.0" width="534.0" height="134.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="636.0" cy="308.0" r="15" fill="var(--gm)"/><text x="636.0" y="313.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="662.0" y="316.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Hỗ trợ phê duyệt</text><text x="630.0" y="345.2" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Kiểm tra đề xuất thay đổi có đủ thông tin, xác định người cần thông</text><text x="630.0" y="365.1" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">báo, liệt kê tài liệu cần cập nhật.</text><text x="630.0" y="392.9" font-size="14" font-weight="700" fill="var(--s)" text-anchor="start">Kết quả: Agent không tự phê duyệt</text><rect x="60.0" y="430.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="463.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Mỗi việc có ranh giới rõ: agent tạo kết quả, con người vẫn quyết định.</text></svg>
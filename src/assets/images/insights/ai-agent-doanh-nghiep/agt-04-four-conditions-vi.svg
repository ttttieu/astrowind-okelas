<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="Bốn cột điều kiện đánh số: quy trình được định nghĩa, dữ liệu có cấu trúc, bối cảnh tổ chức, governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="530" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Bốn điều kiện để agent chạy được trong thực tế</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Agent chỉ thực thi quy trình đã có, không tự giải quyết vấn đề của quy trình.</text><line x1="60.0" y1="446.0" x2="1140.0" y2="446.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="468.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Bốn điều kiện theo phân tích trong bài, là cách tổ chức thực tiễn, không phải khung chuẩn được chứng nhận.</text><text x="60.0" y="509.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="170.0" width="258.0" height="161.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="90.0" cy="200.0" r="15" fill="var(--p)"/><text x="90.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="116.0" y="206.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Quy trình được</text><text x="116.0" y="230.4" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">định nghĩa</text><text x="80.0" y="264.4" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Ai làm gì, điều kiện chuyển</text><text x="80.0" y="285.7" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">bước và evidence cần tạo ra.</text><rect x="334.0" y="170.0" width="258.0" height="161.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="364.0" cy="200.0" r="15" fill="var(--gm)"/><text x="364.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="390.0" y="206.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Dữ liệu có cấu trúc</text><text x="354.0" y="240.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Excel rời rạc hay email</text><text x="354.0" y="261.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">không tìm kiếm được đều</text><text x="354.0" y="282.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chặn agent.</text><rect x="608.0" y="170.0" width="258.0" height="161.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.8"/><circle cx="638.0" cy="200.0" r="15" fill="var(--p)"/><text x="638.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="664.0" y="206.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Bối cảnh tổ chức</text><text x="628.0" y="240.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tiêu chuẩn áp dụng, nơi lưu</text><text x="628.0" y="261.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">danh sách, và ai phê duyệt</text><text x="628.0" y="282.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">việc gì.</text><rect x="882.0" y="170.0" width="258.0" height="161.0" rx="16" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.8"/><circle cx="912.0" cy="200.0" r="15" fill="var(--gm)"/><text x="912.0" y="205.5" font-size="15" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="938.0" y="206.3" font-size="17" font-weight="700" fill="var(--hd)" text-anchor="start">Governance</text><text x="902.0" y="240.2" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Được đọc dữ liệu nào, tạo</text><text x="902.0" y="261.6" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">record nào, tác động</text><text x="902.0" y="282.9" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hệ thống nào, và leo thang</text><text x="902.0" y="304.1" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">ra sao.</text><rect x="60.0" y="375.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="408.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Thiếu một trong bốn điều kiện, agent sẽ hoặc không chạy được, hoặc chạy sai mà khó nhận ra.</text></svg>
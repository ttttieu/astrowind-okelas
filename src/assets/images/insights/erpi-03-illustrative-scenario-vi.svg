<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Tình huống minh họa sáu tháng sau go-live ở một doanh nghiệp chế biến thực phẩm giả định: kho giữ Excel riêng, sản xuất lập kế hoạch theo kinh nghiệm, kế toán xuất Excel hằng tháng và CEO vẫn nhận báo cáo tuần qua email." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="480" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Tình huống minh họa: sáu tháng sau go-live</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Doanh nghiệp chế biến thực phẩm giả định, khoảng 120 nhân sự, 5 module, triển khai 9 tháng.</text><line x1="60.0" y1="396.0" x2="1140.0" y2="396.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="418.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Tình huống tổng hợp minh họa trong bài viết, không phải case thật hay số liệu đo lường.</text><text x="60.0" y="459.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="259.0" height="174.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="76.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kho</text><text x="76.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Vẫn giữ file Excel riêng vì không</text><text x="76.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tin ERP; số liệu lệch khoảng</text><text x="76.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">5–15% trong ví dụ tổng hợp.</text><rect x="334.0" y="134.0" width="259.0" height="174.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="350.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Sản xuất</text><text x="350.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Lệnh sản xuất có trong ERP</text><text x="350.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhưng kế hoạch theo kinh</text><text x="350.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nghiệm quản lý sàn; kết quả</text><text x="350.0" y="263.5" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">nhập theo lô cuối ngày</text><text x="350.0" y="283.4" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc tuần.</text><rect x="608.0" y="134.0" width="259.0" height="174.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="624.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Kế toán</text><text x="624.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">Xuất dữ liệu ra Excel hằng</text><text x="624.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">tháng để làm báo cáo theo mẫu</text><text x="624.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">quen thuộc.</text><rect x="882.0" y="134.0" width="259.0" height="174.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="898.0" y="173.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Quản trị</text><text x="898.0" y="203.9" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">CEO vẫn nhận báo cáo tuần qua</text><text x="898.0" y="223.8" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">email từng bộ phận, không dùng</text><text x="898.0" y="243.6" font-size="14" font-weight="400" fill="var(--tx)" text-anchor="start">dashboard ERP.</text><rect x="60.0" y="324.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="357.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">ERP đang là kho lưu trữ song song: chi phí đã trả, giá trị chưa đạt.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba dạng phụ thuộc vào con người: phê duyệt một điểm, theo dõi bằng trí nhớ, tiến triển nhờ bị đòi việc." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="600" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Ba dạng phụ thuộc vào con người trong workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Ba dạng phổ biến mà bài viết mô tả.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="var(--a)"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Phê duyệt một điểm</text><rect x="76.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="84.0" y="232.0" width="88.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5"/><text x="128.0" y="254.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Nhiều</text><text x="128.0" y="270.3" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">yêu cầu</text><line x1="174.0" y1="258.0" x2="189.0" y2="258.0" stroke="var(--gm)" stroke-width="2"/><polygon points="196.0,258.0 189.0,261.9 189.0,254.2" fill="var(--gm)"/><rect x="198.0" y="234.0" width="76.0" height="48.0" rx="24" fill="var(--a)"/><text x="236.0" y="262.4" font-size="12" font-weight="700" fill="var(--wh)" text-anchor="middle">Một người</text><line x1="276.0" y1="258.0" x2="291.0" y2="258.0" stroke="var(--a)" stroke-width="2"/><polygon points="298.0,258.0 291.0,261.9 291.0,254.2" fill="var(--a)"/><rect x="300.0" y="232.0" width="86.0" height="52.0" rx="10" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="343.0" y="254.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Việc</text><text x="343.0" y="270.3" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">tiếp tục</text><text x="80.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Một người nắm quyền quyết định hoặc</text><text x="80.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thông tin độc quyền; khi họ vắng mặt, mọi</text><text x="80.0" y="382.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">việc phía sau dừng lại.</text><rect x="425.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="var(--a)"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Theo dõi bằng trí nhớ</text><rect x="441.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="449.0" y="232.0" width="120.0" height="52.0" rx="10" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="509.0" y="262.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Trí nhớ cá nhân</text><text x="601.0" y="262.4" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="middle">thay vì</text><rect x="633.0" y="232.0" width="118.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--gm)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="692.0" y="254.4" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">Ghi chép</text><text x="692.0" y="270.3" font-size="12" font-weight="700" fill="var(--mut)" text-anchor="middle">hệ thống</text><text x="445.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Tiến độ dựa vào hiểu biết không</text><text x="445.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">chính thức thay vì hệ thống ghi chép;</text><text x="445.0" y="382.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">rủi ro khi người giữ thông tin đổi việc</text><text x="445.0" y="403.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">hoặc nghỉ.</text><rect x="790.0" y="134.0" width="350.0" height="300.0" rx="16" fill="var(--bg)" stroke="var(--a)" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="var(--a)"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="var(--hd)" text-anchor="start">Tiến triển nhờ đòi việc</text><rect x="806.0" y="210.0" width="318.0" height="96.0" rx="12" fill="var(--gt)"/><rect x="814.0" y="232.0" width="88.0" height="52.0" rx="10" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="858.0" y="254.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Bước sẵn</text><text x="858.0" y="270.3" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">sàng</text><text x="967.0" y="251.0" font-size="11" font-weight="700" fill="var(--a)" text-anchor="middle">chờ bị đòi</text><line x1="906.0" y1="276.0" x2="1021.0" y2="276.0" stroke="var(--a)" stroke-width="2"/><polygon points="1028.0,276.0 1021.0,279.9 1021.0,272.1" fill="var(--a)"/><rect x="1030.0" y="232.0" width="86.0" height="52.0" rx="10" fill="var(--bg)" stroke="var(--p)" stroke-width="1.5"/><text x="1073.0" y="262.4" font-size="12" font-weight="700" fill="var(--hd)" text-anchor="middle">Đi tiếp</text><text x="810.0" y="340.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Công việc chỉ đi tiếp khi có người nhắc,</text><text x="810.0" y="361.0" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">thay vì tự đi tiếp khi điều kiện đã đủ.</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Cả ba đều dồn rủi ro vào cách quy trình được thiết kế, không phải vào một cá nhân cụ thể.</text></svg>
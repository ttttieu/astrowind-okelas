<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Chi phí của việc chờ gồm thời gian chờ dễ thấy, cộng với hành vi tự bảo vệ và tổn thất cơ hội cộng dồn qua nhiều quy trình." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="620" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Chi phí của việc chờ không chỉ là thời gian</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Chờ không chỉ làm chậm: nó còn kéo theo những chi phí khó thấy hơn.</text><line x1="60.0" y1="558.0" x2="1140.0" y2="558.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="580.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Phân tích từ bài viết, không phải số liệu đo lường. Sơ đồ minh họa khái niệm.</text><rect x="60.0" y="134.0" width="1080.0" height="92.0" rx="16" fill="var(--pt)" stroke="var(--p)" stroke-width="1.5"/><text x="84.0" y="175.2" font-size="22" font-weight="700" fill="var(--hd)" text-anchor="start">Thời gian chờ</text><text x="84.0" y="202.9" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Phần dễ thấy: công việc nằm yên chờ một người.</text><line x1="60.0" y1="252.0" x2="1140.0" y2="252.0" stroke="var(--a)" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="60.0" y="239.0" width="153.0" height="26.0" rx="13.0" fill="var(--bg)" stroke="var(--a)" stroke-width="1.2"/><text x="136.5" y="256.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Ngoài thời gian chờ</text><rect x="997.7" y="239.0" width="142.3" height="26.0" rx="13.0" fill="var(--at)" stroke="var(--a)" stroke-width="1.2"/><text x="1068.8" y="256.4" font-size="12" font-weight="700" fill="var(--a)" text-anchor="middle">Phân tích từ bài viết</text><rect x="60.0" y="278.0" width="530.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="84.0" y="317.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Hành vi tự bảo vệ</text><text x="84.0" y="345.8" font-size="15" font-weight="400" fill="var(--tx)" text-anchor="start">Khi không rõ ai chịu trách nhiệm, người ta tự bảo vệ:</text><rect x="84.0" y="384.0" width="148.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="158.0" y="416.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Duyệt thừa</text><rect x="240.0" y="384.0" width="148.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="314.0" y="416.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Leo thang thừa</text><rect x="396.0" y="384.0" width="148.0" height="56.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="470.0" y="408.2" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Trì hoãn dù đủ</text><text x="470.0" y="425.3" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">thẩm quyền</text><rect x="610.0" y="278.0" width="530.0" height="190.0" rx="16" fill="var(--at)" stroke="var(--a)" stroke-width="1.8"/><text x="634.0" y="317.1" font-size="20" font-weight="700" fill="var(--hd)" text-anchor="start">Tổn thất cơ hội cộng dồn</text><text x="634.0" y="351.4" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">Những chậm trễ nhỏ cộng dồn qua hàng chục quy trình, tạo</text><text x="634.0" y="374.6" font-size="16" font-weight="400" fill="var(--tx)" text-anchor="start">lực cản lớn mà số liệu tài chính không thấy.</text><rect x="634.0" y="396.0" width="116.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="692.0" y="422.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Quy trình 1</text><rect x="760.0" y="396.0" width="116.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="818.0" y="422.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Quy trình 2</text><rect x="886.0" y="396.0" width="116.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="944.0" y="422.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">Quy trình 3</text><rect x="1012.0" y="396.0" width="116.0" height="44.0" rx="10" fill="var(--bg)" stroke="var(--a)" stroke-width="1.5"/><text x="1070.0" y="422.7" font-size="13" font-weight="700" fill="var(--a)" text-anchor="middle">…</text><rect x="60.0" y="486.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="519.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Chi phí thật gồm cả hành vi tự bảo vệ và tổn thất cơ hội cộng dồn, không chỉ thời gian chờ.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" width="1200" height="652" role="img" aria-label="Một bước chờ thông tin và điều kiện sẵn sàng khác với một bước chờ đúng một người, khi người đó vắng mặt, quá tải hoặc bỏ sót." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="652" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Chờ thông tin sẵn sàng khác với chờ đúng một người</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Cần phán đoán của con người không phải vấn đề; vấn đề là khi chỉ một người nắm quyền hoặc thông tin.</text><line x1="60.0" y1="590.0" x2="1140.0" y2="590.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="612.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="1080.0" height="150.0" rx="16" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="84.0" y="171.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Chờ điều kiện sẵn sàng</text><rect x="84.0" y="190.0" width="130.0" height="52.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="149.0" y="221.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước 1</text><line x1="218.0" y1="216.0" x2="241.0" y2="216.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="250.0,216.0 241.0,220.9 241.0,211.1" fill="#2B74F5"/><rect x="254.0" y="190.0" width="130.0" height="52.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="319.0" y="221.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước 2</text><line x1="388.0" y1="216.0" x2="411.0" y2="216.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="420.0,216.0 411.0,220.9 411.0,211.1" fill="#2B74F5"/><rect x="424.0" y="190.0" width="290.0" height="52.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="2"/><text x="569.0" y="221.1" font-size="14" font-weight="700" fill="#5FA0FF" text-anchor="middle">Thông tin và điều kiện đã đủ</text><line x1="718.0" y1="216.0" x2="747.0" y2="216.0" stroke="#2B74F5" stroke-width="2.5"/><polygon points="756.0,216.0 747.0,220.9 747.0,211.1" fill="#2B74F5"/><rect x="760.0" y="190.0" width="130.0" height="52.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="825.0" y="221.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước 3</text><text x="84.0" y="267.8" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Tiến lên khi thông tin và điều kiện đã sẵn sàng.</text><rect x="60.0" y="298.0" width="1080.0" height="214.0" rx="16" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8" stroke-dasharray="6 5"/><text x="84.0" y="335.1" font-size="20" font-weight="700" fill="#F7F8F8" text-anchor="start">Chờ đúng một người</text><rect x="84.0" y="354.0" width="130.0" height="52.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="149.0" y="385.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước 1</text><line x1="218.0" y1="380.0" x2="241.0" y2="380.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="250.0,380.0 241.0,384.9 241.0,375.1" fill="#5B6575"/><rect x="254.0" y="354.0" width="130.0" height="52.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="319.0" y="385.1" font-size="14" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước 2</text><line x1="388.0" y1="380.0" x2="411.0" y2="380.0" stroke="#5B6575" stroke-width="2.5"/><polygon points="420.0,380.0 411.0,384.9 411.0,375.1" fill="#5B6575"/><rect x="424.0" y="354.0" width="290.0" height="52.0" rx="10" fill="#A78BFA"/><text x="569.0" y="385.1" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chờ một người</text><line x1="718.0" y1="380.0" x2="747.0" y2="380.0" stroke="#A78BFA" stroke-width="2.5"/><polygon points="756.0,380.0 747.0,384.9 747.0,375.1" fill="#A78BFA"/><rect x="760.0" y="354.0" width="130.0" height="52.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="825.0" y="385.1" font-size="14" font-weight="700" fill="#9AA6B8" text-anchor="middle">Bước 3</text><rect x="424.0" y="430.0" width="90.0" height="36.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="469.0" y="452.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Vắng mặt</text><rect x="522.0" y="430.0" width="90.0" height="36.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="567.0" y="452.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Quá tải</text><rect x="620.0" y="430.0" width="90.0" height="36.0" rx="10" fill="#08090A" stroke="#A78BFA" stroke-width="1.5"/><text x="665.0" y="452.7" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="middle">Bỏ sót</text><text x="760.0" y="438.8" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">Chỉ một người có quyền hoặc thông tin, và không có</text><text x="760.0" y="458.1" font-size="14" font-weight="400" fill="#E5ECF6" text-anchor="start">phương án khác.</text><rect x="60.0" y="530.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="563.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Vấn đề không nằm ở việc cần con người, mà ở chỗ chỉ có một người và không có phương án dự phòng.</text></svg>
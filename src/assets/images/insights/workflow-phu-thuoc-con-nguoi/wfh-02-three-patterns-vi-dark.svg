<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Ba dạng phụ thuộc vào con người: phê duyệt một điểm, theo dõi bằng trí nhớ, tiến triển nhờ bị đòi việc." font-family="Inter, system-ui, sans-serif"><rect width="1200" height="600" fill="#08090A"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="#F7F8F8" text-anchor="start">Ba dạng phụ thuộc vào con người trong workflow</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="#9AA6B8" text-anchor="start">Ba dạng phổ biến mà bài viết mô tả.</text><line x1="60.0" y1="538.0" x2="1140.0" y2="538.0" stroke="#2A2F38" stroke-width="1"/><text x="60.0" y="560.5" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="start">Sơ đồ minh họa khái niệm từ bài viết, không phải số liệu đo lường.</text><rect x="60.0" y="134.0" width="350.0" height="300.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="96.0" cy="170.0" r="16" fill="#A78BFA"/><text x="96.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="124.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Phê duyệt một điểm</text><rect x="76.0" y="210.0" width="318.0" height="96.0" rx="12" fill="#14161A"/><rect x="84.0" y="232.0" width="88.0" height="52.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5"/><text x="128.0" y="254.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Nhiều</text><text x="128.0" y="270.3" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">yêu cầu</text><line x1="174.0" y1="258.0" x2="189.0" y2="258.0" stroke="#5B6575" stroke-width="2"/><polygon points="196.0,258.0 189.0,261.9 189.0,254.2" fill="#5B6575"/><rect x="198.0" y="234.0" width="76.0" height="48.0" rx="24" fill="#A78BFA"/><text x="236.0" y="262.4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Một người</text><line x1="276.0" y1="258.0" x2="291.0" y2="258.0" stroke="#A78BFA" stroke-width="2"/><polygon points="298.0,258.0 291.0,261.9 291.0,254.2" fill="#A78BFA"/><rect x="300.0" y="232.0" width="86.0" height="52.0" rx="10" fill="#14161A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="343.0" y="254.4" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">Việc</text><text x="343.0" y="270.3" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">tiếp tục</text><text x="80.0" y="340.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Một người nắm quyền quyết định hoặc</text><text x="80.0" y="361.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">thông tin độc quyền; khi họ vắng mặt, mọi</text><text x="80.0" y="382.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">việc phía sau dừng lại.</text><rect x="425.0" y="134.0" width="350.0" height="300.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="461.0" cy="170.0" r="16" fill="#A78BFA"/><text x="461.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="489.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Theo dõi bằng trí nhớ</text><rect x="441.0" y="210.0" width="318.0" height="96.0" rx="12" fill="#14161A"/><rect x="449.0" y="232.0" width="120.0" height="52.0" rx="10" fill="#1E1636" stroke="#A78BFA" stroke-width="1.8"/><text x="509.0" y="262.4" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">Trí nhớ cá nhân</text><text x="601.0" y="262.4" font-size="12" font-weight="400" fill="#9AA6B8" text-anchor="middle">thay vì</text><rect x="633.0" y="232.0" width="118.0" height="52.0" rx="10" fill="#08090A" stroke="#5B6575" stroke-width="1.5" stroke-dasharray="5 4"/><text x="692.0" y="254.4" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">Ghi chép</text><text x="692.0" y="270.3" font-size="12" font-weight="700" fill="#9AA6B8" text-anchor="middle">hệ thống</text><text x="445.0" y="340.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Tiến độ dựa vào hiểu biết không</text><text x="445.0" y="361.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">chính thức thay vì hệ thống ghi chép;</text><text x="445.0" y="382.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">rủi ro khi người giữ thông tin đổi việc</text><text x="445.0" y="403.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">hoặc nghỉ.</text><rect x="790.0" y="134.0" width="350.0" height="300.0" rx="16" fill="#08090A" stroke="#A78BFA" stroke-width="1.8"/><circle cx="826.0" cy="170.0" r="16" fill="#A78BFA"/><text x="826.0" y="175.8" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="854.0" y="177.0" font-size="18" font-weight="700" fill="#F7F8F8" text-anchor="start">Tiến triển nhờ đòi việc</text><rect x="806.0" y="210.0" width="318.0" height="96.0" rx="12" fill="#14161A"/><rect x="814.0" y="232.0" width="88.0" height="52.0" rx="10" fill="#0E1D38" stroke="#2B74F5" stroke-width="1.5"/><text x="858.0" y="254.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Bước sẵn</text><text x="858.0" y="270.3" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">sàng</text><text x="967.0" y="251.0" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle">chờ bị đòi</text><line x1="906.0" y1="276.0" x2="1021.0" y2="276.0" stroke="#A78BFA" stroke-width="2"/><polygon points="1028.0,276.0 1021.0,279.9 1021.0,272.1" fill="#A78BFA"/><rect x="1030.0" y="232.0" width="86.0" height="52.0" rx="10" fill="#08090A" stroke="#2B74F5" stroke-width="1.5"/><text x="1073.0" y="262.4" font-size="12" font-weight="700" fill="#F7F8F8" text-anchor="middle">Đi tiếp</text><text x="810.0" y="340.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">Công việc chỉ đi tiếp khi có người nhắc,</text><text x="810.0" y="361.0" font-size="15" font-weight="400" fill="#E5ECF6" text-anchor="start">thay vì tự đi tiếp khi điều kiện đã đủ.</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="#F7F8F8"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="#08090A" text-anchor="middle">Cả ba đều dồn rủi ro vào cách quy trình được thiết kế, không phải vào một cá nhân cụ thể.</text></svg>
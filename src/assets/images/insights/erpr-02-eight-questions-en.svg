<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" width="1200" height="606" role="img" aria-label="Eight self-assessment questions on ERP readiness, grouped into four dimensions: processes, data, people, and scope and governance." font-family="Inter, system-ui, sans-serif"><style>svg{--p:#0161EF;--s:#0154CF;--a:#6D28D9;--bg:#FFFFFF;--tx:#273244;--mut:#5B677A;--line:#D5DCE7;--hd:#0B1220;--pt:#EAF2FF;--at:#F3EDFF;--gt:#F2F4F8;--ink:#0B1220;--onink:#FFFFFF;--wh:#FFFFFF;--gm:#98A2B3;}@media (prefers-color-scheme: dark){svg{--p:#2B74F5;--s:#5FA0FF;--a:#A78BFA;--bg:#08090A;--tx:#E5ECF6;--mut:#9AA6B8;--line:#2A2F38;--hd:#F7F8F8;--pt:#0E1D38;--at:#1E1636;--gt:#14161A;--ink:#F7F8F8;--onink:#08090A;--wh:#FFFFFF;--gm:#5B6575;}}</style><rect width="1200" height="606" fill="var(--bg)"/><text x="60.0" y="69.7" font-size="32" font-weight="700" fill="var(--hd)" text-anchor="start">Eight questions to assess your readiness</text><text x="60.0" y="103.9" font-size="17" font-weight="400" fill="var(--mut)" text-anchor="start">Numbered as in the article; grouped into four dimensions for readability.</text><line x1="60.0" y1="522.0" x2="1140.0" y2="522.0" stroke="var(--line)" stroke-width="1"/><text x="60.0" y="544.5" font-size="12" font-weight="400" fill="var(--mut)" text-anchor="start">Grouping the eight questions into four dimensions is OKELAS’s own, for readability; a discussion aid, not a certified methodology.</text><text x="60.0" y="585.7" font-size="13" font-weight="700" fill="var(--gm)" text-anchor="start">okelas.com</text><rect x="60.0" y="134.0" width="258.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="189.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Processes</text><rect x="60.0" y="192.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="84.0" cy="230.0" r="13" fill="var(--p)"/><text x="84.0" y="235.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">1</text><text x="106.0" y="226.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Are processes documented</text><text x="106.0" y="243.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">and consistently followed?</text><rect x="334.0" y="134.0" width="258.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="463.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Data</text><rect x="334.0" y="192.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="358.0" cy="230.0" r="13" fill="var(--p)"/><text x="358.0" y="235.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">3</text><text x="380.0" y="226.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Is master data complete,</text><text x="380.0" y="243.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">current and free of duplicates?</text><rect x="334.0" y="276.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="358.0" cy="314.0" r="13" fill="var(--p)"/><text x="358.0" y="319.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">4</text><text x="380.0" y="310.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Do recorded stock levels</text><text x="380.0" y="327.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">match physical stock?</text><rect x="608.0" y="134.0" width="258.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="737.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">People</text><rect x="608.0" y="192.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="632.0" cy="230.0" r="13" fill="var(--p)"/><text x="632.0" y="235.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">2</text><text x="654.0" y="217.6" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Does someone have the</text><text x="654.0" y="234.7" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">authority and time to</text><text x="654.0" y="251.9" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">decide throughout?</text><rect x="608.0" y="276.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="632.0" cy="314.0" r="13" fill="var(--p)"/><text x="632.0" y="319.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">6</text><text x="654.0" y="310.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Is there a change</text><text x="654.0" y="327.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">management plan?</text><rect x="608.0" y="360.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="632.0" cy="398.0" r="13" fill="var(--p)"/><text x="632.0" y="403.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">8</text><text x="654.0" y="394.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Are leaders actively involved,</text><text x="654.0" y="411.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">not just approving budget?</text><rect x="882.0" y="134.0" width="258.0" height="44.0" rx="12" fill="var(--gt)" stroke="var(--gm)" stroke-width="1.6"/><text x="1011.0" y="161.8" font-size="16" font-weight="700" fill="var(--hd)" text-anchor="middle">Scope and governance</text><rect x="882.0" y="192.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="906.0" cy="230.0" r="13" fill="var(--p)"/><text x="906.0" y="235.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">5</text><text x="928.0" y="226.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Has the first-phase scope</text><text x="928.0" y="243.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">been defined?</text><rect x="882.0" y="276.0" width="258.0" height="76.0" rx="14" fill="var(--pt)" stroke="var(--p)" stroke-width="1.6"/><circle cx="906.0" cy="314.0" r="13" fill="var(--p)"/><text x="906.0" y="319.1" font-size="14" font-weight="700" fill="var(--wh)" text-anchor="middle">7</text><text x="928.0" y="310.2" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">Who owns the system after</text><text x="928.0" y="327.3" font-size="13" font-weight="700" fill="var(--hd)" text-anchor="start">the project?</text><rect x="60.0" y="452.0" width="1080.0" height="54.0" rx="12" fill="var(--ink)"/><text x="600.0" y="485.6" font-size="18" font-weight="700" fill="var(--onink)" text-anchor="middle">Several unclear answers signal a need to prepare, not a reason to drop ERP.</text></svg>